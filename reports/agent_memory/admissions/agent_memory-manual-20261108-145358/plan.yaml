    # Agent 记忆为何“找到了也用不对”：从保存事实到恢复决策依据


    长期记忆系统经常把“找到相关历史”当作成功的标志。但智能体真正需要解决的问题是：这些历史能否支持当前答案或行动？用户曾经选择某个方案，不代表今天仍然适用；过去失败的轨迹，也可能包含当前任务需要的正确操作。记忆的价值因此不能只用存储量、摘要质量或单条相关性判断。


    本批四项研究共同揭示了一个值得追问的断点：历史经过加工、检索并进入上下文之后，支持决策的关系可能已经消失。Memory Tax 检查加工损失，HABIT-Bench
    检查有效条件的恢复，MemComposer 学习如何组合经验，MemSteer 则尝试为这些环节建立优化反馈。它们研究的任务与控制条件不同，不能拼成统一排行榜，却可以帮助我们解释：为什么记忆内容看似正确，最终行为仍然错误。


    ## 先确认：加工记忆究竟增加了什么


    [Memory Tax](https://arxiv.org/abs/2610.34073v1)提出一个必要的参照：直接检索原始历史已经能解决多少问题？论文把记忆答对、单轮
    RAG 答错的题称为收益，把 RAG 答对、记忆答错的题称为“记忆税”。两者相减才是准确率的净变化。这里的税指正确性损失，并非 token 费用，而且取决于参照系统。


    这个参照并不简陋。原始历史按对话轮次切块，不跨会话边界，附带时间；查询结合 BM25、稠密检索和重排。双轮版本还会判断证据是否足够，再提出后续查询。在 Qwen3.6-27B
    的 LongMemEval-s 实验中，单轮与双轮 RAG 准确率分别为77.6%和81.4%，A-Mem 为79.4%。同一个记忆系统是否“超过 RAG”，会随检索参照改变。论文逐题计算收益与税使用单轮参照，不能与主表中的双轮参照混用。


    作者进一步用理想证据回放分离两类问题：只提供支撑答案的原始轮次，再只提供对应的加工记忆。如果后者仍然明显较差，就需要检查构建时的信息损失；如果理想记忆表现接近原始证据、正常检索却远低于两者，主要障碍便可能在访问。MAGMA、LightMem
    出现了后一种现象，说明“保存下来”与“需要时取出来”是不同能力。


    人工标注也显示，加工确实可能丢失信息。在跨三个基准抽样的500个原始轮次中，MemoryOS 的信息完全保留比例为98.4%，SimpleMem 为65.6%。但完整保留率本身仍不能保证回答正确：一个轮次拆成多条后，关键部分可能排得很靠后；事实并入长画像后可能被稀释；改写还可能改变查询与证据的匹配关系。


    这并不意味着压缩和抽象没有价值。短事实可以减少干扰，跨会话重组可以帮助多跳推理。真正需要检验的是：加工所节省的阅读与推理，是否大于它引入的信息和访问损失。


    ## 检索命中的是观察，行动需要的是有效状态


    [HABIT-Bench](https://arxiv.org/abs/2610.24520v2)把问题推进了一步：即使找到相关对话，系统能否恢复当时有效、适用于当前情境的用户默认行为？


    基准包含114名合成用户、37,152个会话和3,328道四选一行动题，覆盖饮食、金融、软件与旅行。每道题同时规定历史可见截止点和决策目标时间。系统可能看到了2025年的替代流程，却需要回答2023年应该采用什么。金融与软件中的典型结构是：早期会话列出有序候选，较晚回复用序号确认选择，之后另一组列表与确认建立替代流程。只保存“用户选了第二项”，甚至只保存最新方案，都不足以回答历史问题。


    这里需要保留的不只是事实内容，还有指代、确认、替换和生效关系。助手提出过的建议不等于用户接受；单次例外不自动改写长期默认；某个环境中的软件处理方法，也不能直接迁移到另一个环境。因此，所谓习惯记忆部分涉及行为归纳，部分涉及跨会话流程状态维护，不能把四个领域都解释为从重复行为统计偏好。


    结果说明这些关系尚未被稳定处理。八种记忆方法在 Qwen3-235B-A22B 下的最佳四领域宏平均准确率为33.06%，BM25 为32.50%；GLM-5.3-Flash
    下分别为33.61%和稠密检索的33.21%。这表明，在论文适配器、共享回答器与预算条件下，更复杂的记忆流水线没有稳定转化为更好的行动选择。


    尤其值得注意的是，直接提供标注证据后，Qwen 主模型各领域准确率仍只有39.26%—58.25%。相关材料到场，仍不等于状态已经恢复。另一个提供私有习惯状态的控制达到98%以上，但它同时暴露了所需行动，因此不能把两者差距全部解释成某种记忆表示的收益。


    来源追踪进一步揭示了局部命中的误导性：六种可追溯方法的前五条来源会话至少命中一条正证据的比例为37.77%—41.44%，标注证据召回率却只有11.17%—13.89%。找到后来的确认，却漏掉早期候选列表，就是“相关但不充分”的典型情形。这些指标的适用题目集合不同，不能直接相减来分摊错误原因。


    ## 上下文组装本身也是决策


    即使记忆完整、检索相关，把所有候选按相似度排列也未必最好。[MemComposer](https://arxiv.org/abs/2610.21091v2)研究的是程序性经验：历史轨迹与复盘如何帮助执行器完成多步工具任务。


    它先用当前开场请求检索十条候选，组装器联合读取候选摘要，决定选哪些、选多少以及如何排序，允许一条也不选。选中后，完整轨迹与复盘才按指定顺序进入执行器上下文。训练期间，记忆库、检索器和执行器全部冻结，优化的是读取与呈现策略。


    训练信号来自完整任务交互。ExPO 对每个输入采样八个组装序列，每个序列运行八次，用平均成功率扣除数量和格式惩罚后进行组内比较。这样，学习目标就从“这条经验像不像当前请求”变成“这一组经验能否改善执行”。互补信息、冗余和相互干扰都可能影响奖励。


    在三个客服领域中，Qwen3-4B 执行器的平均成功率达到50.8%，比该指标最强基线高5.9个百分点。更能隔离机制的是固定集合实验：保持选中的记忆完全相同，只改用相似度或长度规则排序，学习顺序领先3.8—8.5个成功率百分点。这说明记忆效用不是集合成员独立分数的简单相加，呈现位置也会改变执行。


    不过，每领域只有20—40个测试任务，分执行器看，相对最强基线的成功率增益置信区间仍包含零；组装器也无法选择候选池之外的经验。论文报告执行器记忆 token
    减少16.9%和4.9%，没有计入组装器读取候选与训练模拟的全部成本。因此，这项工作支持把组装作为独立优化层，尚不能证明端到端成本必然下降，更不能代替持续写入和状态更新。


    ## 优化反馈必须知道错误发生在哪里


    要改善上述环节，仅有一个最终正确率往往不够。[MemSteer](https://arxiv.org/abs/2610.39276v1)尝试从未标注用户历史生成问题、参考答案与来源证据，让系统既能评分，也能追查失败位置。


    生成流程先抽取相互关联的记录，规划答案及每项事实的来源，再生成问题。之后进行语义审计，并让看不到参考答案的盲读器恢复答案、引用所有选定证据。通过检查的监督被划分为互斥训练集与验证集：前者帮助提出修改，后者选择设计。


    它的诊断逻辑很直接：答错但所需证据已经完整进入最终上下文，归为回答失败；证据缺失且无法从当前记忆恢复，归为存储失败；仍可恢复却没有进入上下文，归为检索失败。提案器据此修改存储、检索或上下文构造，在固定回答器、提示和最终上下文预算下验证，只有准确率严格上升才接受。


    在 ATM-Bench 上，主集 Question Score 从54.9升至68.3。作者还报告，显式阶段诊断比仅补充参考证据带来更大改善。这个发现的意义在于：证据要转化成可操作的故障信息，才更容易指导优化。


    但这仍是工程归类，不能当作完备的因果分解。“证据齐全仍答错”可能包含时间状态恢复、有效条件判断或上下文呈现问题。生成监督也没有人工认证；盲答成功只说明答案可恢复，并不证明每条引用都必要。生成题反映历史中容易构造的问题，也不等于用户未来真实需求。


    用户差异同样不能忽略。一个六用户共享设计迁移到留出用户 Martin 后，准确率从基础系统的41.2%降至37.7%；再用该用户历史生成监督继续优化，达到44.3%。这支持目标用户反馈的价值，也限制了“一套记忆设计普遍适用”的期待。


    ## 新的工程判断：加工记忆应是可回溯、可修订的决策视图


    综合这些结果，我们推断：值得优化的单位，可能不是单条摘要或事实，而是“足以支持一次决策的证据关系”。事实保存完整，却漏掉候选与确认的连接，无法恢复选择；默认行为检索正确，却缺少例外与有效时间，仍会错误应用；经验集合相同，呈现顺序不同，也会改变执行结果。


    由此可以形成一个待验证的设计：原始记录保留来源和时间；加工层形成便于查询的默认行为或经验，同时连接支持观察、用户确认、适用范围、替换与例外；读取层围绕当前问题补齐缺失关系，再决定组合与顺序。加工结果是随证据修订的决策视图，而原始历史提供恢复路径。


    其中，原文回退是 Memory Tax 作者明确提出并进行概念验证的方向；将它与有效条件、证据关系及组装策略结合，是我们的综合推断，四篇论文尚未共同验证这一架构。验证时应固定回答器与总预算，对比纯摘要、摘要加原文回退、关系补全和可训练组装，分别观察证据链完整度、状态判断、行动正确率与延迟。若只提高相关会话命中率，却没有改善后续行动，就不能宣称解决了记忆使用问题。


    成本也必须按生命周期核算。HABIT-Bench 的固定32用户子集中，A-MEM 构建累计消耗1.078亿 LLM token，查询为339万；这说明低查询成本可能建立在昂贵预处理之上。是否值得提前加工，取决于记忆会被复用多少次、更新多频繁，以及查询是否集中在可预测需求上。


    本批材料呈现出一个共同研究方向：把记忆设计从“如何存更多”推进到“如何证明这些历史支持当前决策，并用失败修订它”。这不是跨时间趋势判断；清单没有可核实的相关历史。上述分析依据已审阅总结与对应原文中的可核对机制和结果，未独立复现实验；合成用户、静态库存、小测试集及不同预算，也都限制了结论向真实长期智能体的外推。


    ## 记忆优化应关注支持决策的证据关系，而不只关注单条内容


    Memory Tax 显示完整保存与可访问性可以分离；HABIT-Bench 显示相关会话命中不等于恢复候选、确认、替换及有效时间；MemComposer
    的固定集合重排进一步表明，相同内容的使用效果还取决于组合与顺序。由此推断，单条事实的保留率和相关性不足以描述记忆效用，应增加对当前决策所需关系是否完整的评测。该判断是跨研究综合推断，并非统一实验已经证实的结论。


    ## 加工记忆可以作为可修订的决策视图，原始历史承担恢复作用


    原文检索可补回加工导致的信息损失，但 HABIT-Bench 的理想证据实验说明，补齐原文后仍可能无法恢复有效状态。因此，原文回退与条件关系恢复应分别设计、分别验证。一个可检验方向是让摘要或习惯条目连接来源、用户确认、适用范围、有效时间和例外，再围绕当前问题补齐关系；目前材料尚未验证这一组合架构的端到端收益。


    ## 阶段诊断适合指导优化，但“回答失败”仍需细分


    MemSteer 用证据是否保存、能否恢复、是否进入上下文定位修改环节，显式诊断比单纯附加证据更有帮助。然而，HABIT-Bench 中证据已提供仍大量答错，MemComposer
    中相同集合因顺序改变而产生不同结果，说明证据齐全后的失败还可能涉及状态恢复、有效条件判断与呈现方式。工程上可保留粗粒度诊断用于搜索，再用固定证据、固定集合和目标时间对照区分下游瓶颈，避免把所有问题归为回答模型能力不足。


