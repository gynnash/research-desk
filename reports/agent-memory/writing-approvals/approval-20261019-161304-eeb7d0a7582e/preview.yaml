    text: "---\nschema_version: 1\nid: research-cycle-agent-memory-gh-20261019-paper-2d89084b-a1b1-4a27-b298-a660ef434e61\n\
      kind: research_report\ntitle: 'Hy-Memory-30B-A3B: Attributed Reinforcement Learning\
