      status: accepted\nsource_id: paper-2d89084b-a1b1-4a27-b298-a660ef434e61\ncoverage:\
      \ abstract_only\n---\n\n# Hy-Memory-30B-A3B: Attributed Reinforcement Learning\
      \ for Long-Term Memory Writing\n\n> AI 自动研究记录，已通过独立模型审阅；阅读范围及证据限制见正文，未复现实验。\n\
      \n- 来源：[Hy-Memory-30B-A3B: Attributed Reinforcement Learning for Long-Term Memory\
      \ Writing](https://arxiv.org/abs/2610.22196v1)。\n- 覆盖范围：仅论文摘要，未核验全文或实验数据。\n\
      - 研究模型：`gpt-6-luna`；独立审阅：`gpt-6.1-sol`。\n- 审阅：`pass`；修订次数：0；原始材料仅在内存中提供给模型。\n\
      \n## 研究概述\n\n本次仅依据所提供的论文摘要，概述 Hy-Memory-30B-A3B 的研究动机、训练方法及作者报告的基准结果；不代表对论文完整内容或结果的独立核验。\n\
      \n## 主张与证据\n\n- **作者声称（未独立核验）**：作者指出，外部记忆系统的质量依赖模型如何写入记忆，包括保留什么、如何表述，以及如何依据新证据更新持久状态；现有框架通常使用由框架专属提示驱动的通用大模型，带来服务成本与协议迁移问题。（[A1、A2、A3](https://arxiv.org/abs/2610.22196v1)）\n\
      - **作者声称（未独立核验）**：作者介绍 Hy-Memory-30B-A3B，将其描述为在 Mem0、MemOS 和 Hy-Memory 上训练的紧凑型长期记忆写入模型。（[A4](https://arxiv.org/abs/2610.22196v1)）\n\
      - **作者声称（未独立核验）**：摘要称，其训练方法包括在学生模型生成的状态上学习框架专属写入协议的 Memory On-Policy Distillation，以及通过分块探测、跨块归因奖励、过度存储控制和\
      \ chunk-level GRPO 优化下游可回答性的 Memory RL；训练中还跨窗口沿用策略写入的记忆库。（[A5、A6](https://arxiv.org/abs/2610.22196v1)）\n\
      - **作者声称（未独立核验）**：作者报告，在固定的 20% 基准子样本上，该模型在四个评测 harness 中均排名第一（包括留出的 EverMemOS），宏平均为\
      \ 55.49%，Claude Opus 5 为 54.62%。（[A7](https://arxiv.org/abs/2610.22196v1)）\n\
      \n## 局限\n\n- 本次只读论文摘要，未核验全文、实验设计、实现或结果。\n- 基准结论及数值仅为摘要中的作者报告；材料未提供各评测 harness\
      \ 的细节、样本规模或统计不确定性。\n- 材料不足以判断模型在其他数据、框架或部署条件下的表现。\n\n## 独立审阅\n\n\n正式来源：[paper-2d89084b-a1b1-4a27-b298-a660ef434e61](../../sources/papers/agent-memory/paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)。\n\
      \n准入记录：[输入、审阅与输出散列](admissions/cycle-agent-memory-gh-20261019/accepted.yaml)。\n"
