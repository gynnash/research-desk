    \ true\npublish_authorized: false\n---\n\n> 正式研究稿件：基于页面确认选题生成，三阶段均已通过独立模型审阅；保留事实与推断及证据范围，尚未发布，亦未获得公众号发布授权。\n\
    \n# Agent Memory：保存了，为什么仍可能用不上或用错？\n\n- 已确认角度：以 R1 的写入训练摘要、R2 的上下文管理节选和 H1 的历史记忆块笔记为线索，讨论如何分别审视写入、任务时取用和正确使用，并清楚区分作者描述、历史笔记与待验证假设。\n\
    - 已确认受众：关注 AI Agent 长任务可靠性、记忆架构与评测的产品、工程及研究读者。\n- 目标字数：2000\n\n## 导读\n\nAgent\
    \ 记忆不是“存进去”就算完成：信息可能没写入，任务时可能没有进入上下文，也可能被取到却用错。本文以论文摘要、博客节选和未经本次独立复核的历史笔记为线索，提出一套待验证的分阶段排查思路，并说明如何检验系统面对材料中没有答案的问题时能否保留未知。\n\
    \n相关资料（具体支持关系以正文逐段核查为准）：[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)、[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)\n\
    \n## 先别把“有记忆”当成“记得住”\n\n**我们的推断**：当 Agent 忘了用户交代过的偏好，或回答时把旧信息当成新信息，我们很容易笼统地说“记忆不好”。但故障可能出在不同位置：重要信息没有写进持久记忆；信息虽然保存了，任务发生时却没有被检索或载入当前上下文；又或者信息已经可见，模型仍误读、误用。把这几种情况分开，是一种待验证的排查框架，不是现有材料已经证明有效的解决方案。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)、[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n## 第一关：重要信息有没有写进去\n\n**原作者声称，未经我们独立复现实验**：R1 是一篇论文的摘要。作者指出，外部记忆系统的质量不只取决于有没有存储空间，也取决于写入模型如何决定保留什么、如何表述，以及如何根据新证据更新持久状态。作者介绍\
    \ Hy-Memory-30B-A3B，并称其训练包含学习特定框架写入协议的蒸馏方法，以及通过分块探测、跨块归因奖励等方式优化下游可回答性的强化学习方法。这些是摘要中的作者描述，本稿没有核验论文全文、实现或实验。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)）\n\
    \n**我们的推断**：从写入环节看，值得追问的不是“系统有没有记忆”，而是“这条关键信息最后留下了什么表达”。可以检查记忆是否遗漏了时间、条件或来源，是否把暂时状态写成长期偏好，以及新证据到来后旧状态有没有得到适当更新。这些是排查问题，不是对\
    \ R1 所述模型的独立评估；如果信息没有写进去，后面的检索通常也无从取回。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)）\n\
    \n**原作者声称，未经我们独立复现实验**：R1 摘要还报告：在固定的 20% 基准子样本上，Hy-Memory-30B-A3B 在四个评测 harness\
    \ 中排名第一，宏平均为 55.49%，Claude Opus 5 为 54.62%。这只是作者在摘要中报告的结果。现有材料没有提供各评测的细节、样本规模或统计不确定性，因此不能据此判断结果能否推广到其他数据、框架或部署条件。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)）\n\
    \n## 第二关：任务发生时，记忆有没有进入上下文\n\n**原作者声称，未经我们独立复现实验**：R2 是一篇博客的节选。节选把上下文管理概括为两类工作：减少无关信息进入上下文，以及管理已经在上下文中的信息；也介绍了文件卸载、摘要、按需加载技能、子代理和跨对话文件记忆等机制。这里转述的是博客作者对方法的描述，并不代表本稿核实了完整文章、当前实现或这些机制的实际效果。（[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)）\n\
    \n**原作者声称，未经我们独立复现实验**：节选举例称，工具结果超过约 20,000 个 token 时，流程会将结果写入文件并提供简短预览和文件路径；摘要中间件则默认在上下文使用量达到模型窗口的\
    \ 85% 后压缩较早消息，同时保留最近消息原文。阈值和流程均来自所给节选，不能视为对当前版本或运行表现的独立确认。（[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)）\n\
    \n**我们的推断**：因此，写入成功和任务时可用是两个问题。可以检查目标信息是否在任务发生时可访问：它是否没被取回，是否被压缩得难以辨认，还是已经进入上下文却没有被模型注意。历史笔记\
    \ H1 曾记录记忆块与调用时编入上下文等概念，但它未经本次独立复核，只能作为提出问题的线索，不能当成已核实的系统说明。（[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n## 第三关：取到了，是否用对了\n\n**我们的推断**：信息出现在上下文中，也不等于回答一定正确。模型可能误读条件、把概括当作原始事实、混淆新旧状态，或把自己的推断说成记忆里明确记载的内容。现有材料没有给出这些错误在具体系统中的发生率；把它们列出来，是为了设计检查项，而不是报告已经观察到的实验发现。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)、[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n**我们的推断**：H1 的历史笔记提到记忆块的标签、值、容量限制和可选描述，也记下了持久化、调用时编入上下文及多个 Agent 共享等说法。由于笔记未经本次独立复核，这些内容不能升格为已核验事实。它能提醒我们继续查问：块的权限如何区分？共享内容发生冲突时怎样处理？写入能否追溯来源或回滚？现有材料不足以回答这些问题。（[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n## 把错误拆开记录，也要检查“没有答案”\n\n**我们的推断**：一种待验证的排查流程，是逐题记录三件事：信息是否写入、任务时是否检索或载入、回答是否正确使用了相关内容。再根据记录把问题归到写入、取用或使用环节。这能让团队描述错误发生在哪里，而不只是看到最终答案错了；但现有材料没有证明这套记录方法本身会提高任务表现。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)、[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n**我们的推断**：测试题可以包括材料中有明确答案的事实题、需要跨资料整合的问题，以及材料根本没有答案的问题。对最后一类，检查系统能否说明现有材料不足、避免补造答案，并记录它作出判断的依据。这样才能区分“没有记到”与“没有证据却答了”：一个可能是写入或取用问题，另一个则可能是使用阶段没有守住未知边界。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)、[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n**我们的推断**：若要检验分阶段记录是否有帮助，可以预先设计任务，比较采用这类记录与不采用时出现的错误类型；样本有限时，只把结果用于流程排查，不据此推断普遍效果。任务也可能本来就能从当前上下文直接回答，额外检索或管理步骤未必有益。现有材料没有提供这类对照结果。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)、[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n## 保存、取用、使用，各自都要有证据\n\n**我们的推断**：面对“Agent 为什么没记住”这个问题，可以先拆成三个更具体的问题：该记的信息是否写入？当前任务是否取到？取到之后是否被正确使用？这套区分提供的是一张待验证的排查地图，不是现成的性能保证。R1\
    \ 仅覆盖论文摘要，R2 仅覆盖博客节选，H1 是未经本次独立复核的历史笔记；它们提供了提出问题的线索，不足以验证某个系统的实际效果。（[R1](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)、[R2](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n## 来源与核验范围\n\n- **R1**：[正式研究资料](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)；[原始来源\
    \ 1](https://arxiv.org/abs/2610.22196v1)；[来源笔记 1](../../sources/papers/agent-memory/paper-2d89084b-a1b1-4a27-b298-a660ef434e61.md)。覆盖范围：abstract_only；引用仅限已审阅研究的材料范围。\n\
    - **R2**：[正式研究资料](../../reports/agent-memory/cycle-agent-memory-gh-20261019-research-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)；[原始来源\
    \ 1](https://www.langchain.com/blog/context-engineering-deep-agents-remember)；[来源笔记\
    \ 1](../../sources/blogs/agent-memory/blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)。覆盖范围：excerpt；引用仅限已审阅研究的材料范围。\n\
    - **H1**：[正式研究资料](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)；[原始来源\
    \ 1](https://www.letta.com/blog/memory-blocks/)；[来源笔记 1](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)。覆盖范围：historical_note；历史人工笔记，未经本次独立原文核验，只供推断背景。\n\
    \n## 证据与表达边界\n\n- R1 仅覆盖论文摘要；论文全文、评测设计、样本规模及统计不确定性未核验。摘要中的基准结果属于作者报告。\n- R2 仅覆盖博客节选；完整原文、当前实现、阈值适用性与运行效果未独立核验。\n\
    - H1 是未经本次独立复核的历史笔记，只能支撑待验证问题与推断，不能作为已核验原文事实或原作者主张。\n- 现有材料不足以证明分阶段检查会提升任务表现，也不足以支持行业趋势或普遍性能结论。\n\
    \n确认记录：[approval-20261019-161304-eeb7d0a7582e](../../reports/agent-memory/writing-approvals/approval-20261019-161304-eeb7d0a7582e/confirmed.yaml)\n"
