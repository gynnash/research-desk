    \n### S75 · Appendix J Judge Validation\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A10)\n\
    \nEvery number in this paper is produced by a single judge\n\n(Qwen3.7-Plus),\
    \ so that all comparisons are scored by the same model;\n\ncomparing scores across\
    \ different judges is unsound. To justify relying on one\n\njudge we run a three-judge\
    \ panel: GLM-5.2 and Grok-4.5, both with\n\nextended thinking disabled at temperature\
    \ 0, independently re-score every item\n\nof all twelve Track B runs under the\
    \ identical rubric. This yields\n\n12\\times 923=11{,}076 triple-scored items.\
    \ Neither auxiliary judge ever\n\ncontributes to a reported score; the panel exists\
    \ only to test whether the\n\nconclusions survive a change of judge.\n\nTable\
    \ 25 reports the pooled result. Agreement is very\n\nhigh on every pair: quadratic-weighted\
    \ \\kappa never falls below 0.96 on\n\naverage, Spearman \\rho of the item-level\
    \ scores never below 0.95, and all\n\nthree judges land in the same rubric band\
    \ on 84.0% of items. Per-run\n\nvariation is modest and concentrated in the two\
    \ lowest-scoring MemoryOS runs,\n\nwhere most predictions are refusals and the\
    \ band distribution is degenerate;\n\neven there the minimum weighted \\kappa\
    \ is 0.884. The most contested question\n\ntype is knowledge update ( \\kappa=0.926\
    \ ), which is expected: it is the type\n\nwhose gold answer depends on resolving\
