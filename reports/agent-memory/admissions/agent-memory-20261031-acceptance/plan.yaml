    ### S13 · Appendix B Protocols


    [原文定位](https://arxiv.org/html/2610.29823v1#A2)


    Mem0 OSS 2.1.0 writes one chronological turn at a time and retrieves k=200 without
    reranking; dates are prepended to the text. Zep runs Graphiti OSS 0.30.2 on Kuzu,
    one session per episode, with hybrid edge search (top 20). The memory methods’
    GPT-6 Luna and Claude Opus 5.5 requests set reasoning effort high.


    Each agent question is a Harbor 0.24.0 task [19]: a fresh container holding only
    the conversation, exactly as in the official file, without questions or answers.
    The agent’s last message is its answer. While the agent runs, the container can
    reach only the model endpoint. GPT-6 Luna and Claude Opus 5.5 run at reasoning
    effort high, through a proxy that translates the API where an agent does not speak
    the model’s own; GPT-4o-mini has no effort setting. Codex and Claude Code have
    web search off; Pi has none. A question may take 20 minutes, and Pi and Claude
    Code at most 100 turns. With GPT-6 Luna, Codex picks its code mode: one JavaScript
    tool that calls the shell. A trial that fails or ends without an answer is run
    again, and only the accepted trial is counted.


