    \nThis appendix expands the caveats summarized in §8.\n\n### S61 · Stage associations\
    \ versus isolated causality.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px1)\n\
    \nMatched stage drops associate each paired contrast with the intervened stage\n\
    \nunder a frozen reader, prompt, packer, and judge. Gold versus retrieved\n\n\
    contexts still differ in distractors and composition, so stage labels are\n\n\
    protocol associations rather than fully isolated causal mechanisms.\n\n### S62\
    \ · Underpowered video nulls.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px2)\n\
    \nVideo strata are modest ( n{=}56 – 64 unique QIDs). At 80% power the MDEs\n\n\
    are 8.9 – 11.2 points (Appendix F), so ordered-versus-shuffled\n\nand related\
    \ nulls are inconclusive, not proof of lossless temporal\n\ncompression.\n\n###\
    \ S63 · Gold-delivery audio nulls and lexical leakage.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px3)\n\
    \nRaw audio versus ASR ( +0.8 ) and ASR plus a gold prosody tag versus ASR\n\n\
    ( +1.5 ) are near-null under gold delivery for the primary reader. A\n\nmodel-independent\
    \ lexical audit of the textualized audio carriers used as the\n\nASR condition\
    \ finds frequent paralinguistic cues (e.g., oh wow,\n\nugh, filled pauses) in\
    \ the script text, and other gold hops often\n\nalready expose the answer value.\
    \ These nulls therefore do not establish that\n\nthe reader recovers sentiment\
    \ from plain transcripts or raw audio. A separate\n\ncorrect-versus-swapped symbolic\
    \ tag intervention does show selector-level\n\nsensitivity (Appendix K.4); human-audited\n\
    \nlexically clean subsets defined without conditioning on model failure remain\n\
    \nfuture work.\n\n### S64 · Construction and coverage.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px4)\n\
    \nAutomated filters and a human audit support release quality\n\n(Appendix I).\
    \ Modality coverage is uneven by design (we\n\nreport per-challenge strata), and\
    \ text-only backends do not yet ingest native\n\nmedia indices. Gold construction\
    \ metadata must not be exposed to systems under\n\ntest (Appendix H).\n\n### S65\
    \ · Appendix H Refusal Surface-Structure Diagnostics\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A8)\n\
    \nAnswer Refusal items inherit an IE-shaped template then strip required\n\nevidence.\
    \ We separate privileged construction annotations from\n\nsystem-observable features.\
    \ Classifiers are balanced logistic regressions\n\nwith persona-grouped 5-fold\
    \ CV; AUROC confidence intervals are item bootstrap\n\n95% intervals over out-of-fold\
    \ scores.\n\n### S66 · Privileged negative control.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A8.SS0.SSS0.Px1)\n\
    \nRequired-hop count, answer-session count, and the answer_refusal\n\nquestion-type\
    \ label perfectly identify refusal items (AUROC =1.00 ). These\n\nfields are definitionally\
    \ downstream of refusal construction and are not part\n\nof the evaluation request;\
    \ this result is a sanity check, not an\n\nexploitable surface shortcut. Release\
    \ users must not feed gold metadata\n\n(evidence_plan requiredness, answer_session_ids,\
    \ type\n\nlabels) into systems under test.\n\n### S67 · Observable features.\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#A8.SS0.SSS0.Px2)\n\nHaystack length\
    \ is matched: sessions-only AUROC 0.52 [0.47,\\,0.56] vs. all\n\nanswerable items.\
    \ Broader structural counts (messages, media attachments, date\n\nspan, question\
    \ length) reach 0.75 [0.70,\\,0.79] . Question-text TF–IDF is\n\npartially predictive\
    \ ( 0.85 [0.82,\\,0.88] vs. all answerable; 0.66\n\n[0.60,\\,0.72] vs. IE-only).\
