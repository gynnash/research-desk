    ✓\n\n✓\n\n✓\n\n✓\n\n✓\n\n923\n\n17.5\n\nTable 1: Comparison with prior memory\
    \ benchmarks. Cross-Mod.: answering requires chaining across modality boundaries.\
    \ †Text–image co-reference only. ‡Multi-source personal items (not dialogue sessions);\
    \ avg. 1.6 evidence items/query. §110 dialogues, avg. 9 Q&A turns. ¶Scales with\
    \ 32K–256K context variants. Artefact counts: Table 10.\n\nMulti-hop text QA (Yang\
    \ et al., 2018; Trivedi et al., 2022) likewise lacks this multimodal, temporal\
    \ setting, and coupled system comparisons obscure where evidence is lost. We therefore\
    \ cast the pipeline as four stages—write, retrieve, deliver, and read (Figure\
    \ 2)—and diagnose them with matched interventions under a frozen reader, prompt,\
    \ budget, and judge.\n\nEach stage fails in its own way, motivating four research\
    \ questions:\n\n•\n\nRQ1 (Write). Does the stored representation keep the spatial,\n\
    \ntemporal, and prosodic detail the answer will later depend on?\n\n•\n\nRQ2 (Retrieve\
    \ & Deliver). Is every required unit found,\n\nand does it survive packing into\
    \ the reader’s request? Media caps can\n\ndrop even top-ranked artefacts, so the\
    \ two are measured separately.\n\n•\n\nRQ3 (Read). Given the complete delivered\
    \ chain, can the reader\n\nintegrate it across modalities and sessions?\n\n•\n\
    \nRQ4 (Abstain). Does the system abstain precisely when\n\nrequired evidence is\
    \ absent—and only then?\n\nMOSAIC has 923 questions in 11–24-session haystacks\
    \ with\n\nconstruction-targeted modality gaps (§3.2). Headline\n\nfindings: textualization\
    \ costs \\sim 9 points (spatial-heavy); retrieval costs\n\n\\sim 8 points and\
    \ packing \\sim 4 at production budgets (far more under tight\n\nmedia caps);\
    \ \\sim 15 points remain under gold symbolic facts; abstention\n\nremains weak\
    \ on these controls. Under the matched protocol, each paired drop is\n\nassociated\
    \ with the intervened stage; within-item carrier contrasts further\n\nlocalize\
    \ signal-specific loss, with the strongest causal validation for spatial\n\ninformation\
    \ and additional selector-level validation for annotated prosody\n\n(§6.2).\n\n\
    ### S4 · Contributions.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S1.SS0.SSS0.Px1)\n\
    \n•\n\nMOSAIC, 923 persona-grounded omni-modal memory questions\n\nwith construction-targeted\
    \ spatial, temporal, and prosodic signals (strongest\n\ncausal validation for\
    \ spatial information; selector-level validation for\n\nannotated prosody), cross-modal\
    \ multi-hop chains, and 139 refusal controls.\n\n•\n\nA matched four-stage diagnostic\
    \ protocol separating\n\nwrite, retrieve, deliver, and read,\n\nwith fixed-reader\
    \ and native end-to-end evaluation tracks.\n\n•\n\nA validated public benchmark\
    \ pipeline, including human\n\naudits, media, filtering dispositions, manifests,\
    \ and run configurations.\n\n### S5 · Conversational memory benchmarks.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px1)\n\
    \nFrom single-session persona grounding (Zhang et al., 2018) to multi-session\
    \ suites, text-only benchmarks probe extraction, multi-session and temporal reasoning,\
    \ knowledge updating, recall, and persona consistency (Zhong et al., 2023; Ou\
    \ et al., 2024; Wu et al., 2025; Yu et al., 2025; Jiang et al., 2025; He et al.,\
    \ 2024; Du et al., 2025). Multimodal extensions remain limited: LoCoMo images\
    \ are often non-essential (Maharana et al., 2024; Bei et al., 2026); Mem-Gallery\
    \ and MemLens make images task-critical but stop at text+image and emphasise finding\
    \ rather than cross-modal chaining (Bei et al., 2026; Ren et al., 2026); ATM-Bench\
    \ aggregates personal multi-source evidence rather than sequential conversational\
    \ chaining (Mei et al., 2026); and MMRC, MMDU, MM-NIAH/MMNeedle, Mementos, and\
    \ M3-Bench add image/video reasoning without multi-session dialogue structure\
    \ (Xue et al., 2025; Liu et al., 2024b; Wang et al., 2024a; Wang et al., 2024b;\
    \ Zhou et al., 2026). MOSAIC is the first to require retrieving and chaining evidence\
    \ across all four primary modalities in multi-session conversations (Table 1).\n\
    \n### S6 · Multi-hop and cross-modal reasoning.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px2)\n\
    \nHotpotQA, MuSiQue, MultiModalQA, WebQA, and CRIT target compositional multi-hop\
    \ QA over text and images (Yang et al., 2018; Trivedi et al., 2022; Talmor et\
    \ al., 2021; Chang et al., 2022; Sung et al., 2026); long-context suites such\
    \ as BABILong, RULER, and MMLU-Reason chain facts in static corpora (Kuratov et\
    \ al., 2024; Hsieh et al., 2024; Tie et al., 2025). MOSAIC combines multi-hop\
    \ reasoning with session-scattered multimodal retrieval.\n\n### S7 · Memory-augmented\
    \ LLM systems.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px3)\n\
    \nMemory architectures virtualize or structure long context (Packer et al., 2024;\
    \ Chen et al., 2023; Sarthi et al., 2024; Liu et al., 2024a), integrate graphs\
    \ with retrieval (Guo et al., 2025; Gutiérrez et al., 2025; Paul et al., 2026),\
    \ or provide agentic/OS-inspired layers (Xu et al., 2025; Kang et al., 2025; Wang\
    \ et al., 2025). They lack a standard omni-modal benchmark for controlled comparison—the\
    \ role MOSAIC fills.\n\n### S8 · RAG and memory diagnosis.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px4)\n\
    \nPrior work localizes failures via claim-level RAG diagnostics (Ru et al., 2024),\
    \ tests of visual evidence use (Hu et al., 2025), controlled document pools (Peng\
    \ et al., 2026), AMemGym’s write/read/utilization split (Jiayang et al., 2026),\
    \ and MemFail’s text-memory stages (Garg et al., 2026); localization itself is\
    \ not novel. We differ in how stages are separated: instead of stressing a still-coupled\
    \ pipeline, MOSAIC makes each stage substitutable under a frozen reader, prompt,\
    \ packer, budget, and judge. This measures deliver apart from retrieve and attributes\
    \ loss to carrier-level signals—to our knowledge the first substitutable four-stage\
    \ protocol for omni-modal conversational memory.\n\n### S9 · 3 Preliminaries\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S3)\n\nEvery MOSAIC item is a persona-grounded,\
    \ multi-modal query embedded in a chronological haystack of user–assistant sessions.\
    \ Three orthogonal axes define it, each worked through end-to-end in Appendix\
    \ A: the question type fixes the reasoning skeleton (§3.1), the modality gap defines\
    \ what each non-text modality must contribute (§3.2), and the reasoning chain\
    \ composes Narrower, Selector, and Answer facts into a deterministic retrieval\
    \ path (§3.3).\n\n### S10 · 3.1 Question Types\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S3.SS1)\n\
    \nMOSAIC covers six types: single-session information extraction;\n\ncross-session\
    \ selection and bridging; knowledge updates; temporal-plan\n\ndisruptions; and\
    \ refusal after evidence removal. Questions require one to\n\nthree facts; Appendix\
    \ A defines each type, and\n\nAppendix D reports per-type counts.\n\nMod.\n\n\
    Challenge\n\nControlled realization\n\nFacts\n\nItems\n\nImage\n\nBackground detail\n\
