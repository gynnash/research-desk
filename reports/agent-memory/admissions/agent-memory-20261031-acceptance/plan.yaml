    \ [cs.AI]\n\nExternal Links: Link,\n\nDocument\n\nCited by: §2.\n\n### S35 · A.1\
    \ Question Type Definitions and Examples\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A1.SS1)\n\
    \nTable 5 summarises hop and session requirements for the\n\nsix types introduced\
    \ in §3.1; Table 6\n\ngives full definitions and examples from the 923-item evaluation\
    \ set.\n\nType\n\nHops\n\nSess.\n\nReasoning\n\nInfo. Extraction\n\n1–2\n\n1\n\
    \nDirect recall\n\nMsr-Selection\n\n2–3\n\n\\geq 2\n\nCross-sess. select\n\nMsr-Bridge\n\
    \n3\n\n\\geq 3\n\nSequential chain\n\nKnowledge Update\n\n2\n\n\\geq 2\n\nOld\
    \ \\rightarrow new\n\nTemporal Reasoning\n\n2–3\n\n\\geq 2\n\nPlan \\rightarrow\
    \ disrupt\n\nAnswer Refusal\n\n1–2\n\n1\n\nAbstention\n\nTable 5: The six MOSAIC\
    \ question types. Hops = required facts in the\n\nreasoning chain; Sess. = evidence\
    \ sessions that host those facts.\n\nType\n\nDefinition\n\nExample\n\nInformation\
    \ Extraction\n\nSingle-session factual recall. Disambiguates among \\geq 2 same-category\
    \ items via a discriminator (tone, sequence, count, temporal hint). 1–2 hops.\n\
    \n“In the photo of my fondue set with the colour-coded forks, what brand is stamped\
    \ on it?”\n\nMSR Selection\n\nCross-session entity binding: entities of the same\
    \ category appear in different sessions; a discriminator selects the target. 2–3\
    \ hops, \\geq 2 sessions.\n\n“What background detail is visible in the photo of\
    \ the tomato seedlings I sounded happy about?”\n\nMSR Bridge\n\nSequential chain:\
    \ entity e_{0} in s_{0} identifies e_{1} in s_{1} , which identifies e_{2} in\
    \ s_{2} ; the answer is an attribute of e_{2} . 3 hops, \\geq 3 sessions.\n\n\
    “What is the packing method from the carver in the video where I first hollowed\
    \ then inlaid, in the town on the sign in my chess set photo?”\n\nKnowledge Update\n\
    \nEvolving attribute tracking (old \\rightarrow new state) across sessions. 2\
    \ hops, \\geq 2 sessions.\n\n“In the two photos, what brand did my chore coat\
    \ change to?” (Carhartt \\rightarrow Dickies)\n\nTemporal Reasoning\n\nTime-order\
    \ reasoning with a causal disruption: an old plan is altered; the answer depends\
    \ on the new outcome. 2–3 hops, \\geq 2 sessions.\n\n“After I sounded unhappy\
    \ about the tour cancellation, what was the shade name of the replacement tile\
    \ I photographed?”\n\nAnswer Refusal\n\nEvidence-stripped unanswerable calibration\
    \ check. The question appears answerable on its surface, but the required evidence\
    \ has been deliberately removed. 1–2 hops, 1 session.\n\n“In the photo of my Kierkegaard\
    \ book on the bench by the foggy harbour, what stand-up comedy detail is in the\
    \ background?” (Expected: “I don’t know.”)\n\nTable 6: The six MOSAIC question\
    \ types with definitions and concrete examples.\n\n### S36 · A.2 Modality Gap\
    \ Strategies\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A1.SS2)\n\nRequired\
    \ non-text facts are assigned a gap strategy (1,555/1,582 carry a\n\nnamed tag\
    \ in the release; see Table 14). A modality gap\n\nis information that survives\
    \ only because its native modality preserves\n\nit—a text-only or caption-based\
    \ agent would lose it. The gaps are not\n\narbitrary: each probes a known encoder\
    \ failure mode so that recovering the\n\nanswer requires the native channel that\
    \ mechanism preserves.\n\n### S37 · Encoder motivation (deferred from § 3.2 ).\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px1)\n\nImage gaps (spatial)\
    \ target detail that patch-based visual encoders compress away under token-pooling\
    \ and resolution limits, and that captioners—which describe the salient foreground—omit.\
    \ Video gaps (temporal) target what sparse frame-sampling and temporal pooling\
    \ destroy: a caption of “assembling a shelf” retains neither order nor count.\
    \ Audio gaps (prosodic) target the lexical–acoustic split that ASR collapses;\
    \ prosody is the signal most completely erased by textualization.\n\n### S38 ·\
    \ Image Gaps (Spatial).\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px2)\n\
    \n•\n\nBackground detail: The answer resides in the periphery or background; the\
    \ foreground depicts an unrelated object. Example: a photo of a chess set where\
    \ the answer is the lighthouse visible through the window behind it.\n\n•\n\n\
    Fine-grained attribute: The answer requires reading text (brand names, prices,\
    \ serial numbers, book titles) or counting exact quantities visible only in the\
    \ image. Example: the brand name “Lorraine” stamped on the base of a fondue pot,\
    \ never mentioned in chat text.\n\n•\n\nSpatial configuration: The answer depends\
    \ on the relative arrangement or position of items. Example: “the left pole leaning\
    \ higher than the right” in a photo of hiking poles against a fence.\n\n### S39\
    \ · Video Gaps (Temporal).\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px3)\n\
    \n•\n\nAction ordering: Which of two distinct actions came first vs. second. Example:\
    \ a video of a shelf being assembled, where the model must determine whether the\
    \ photo was placed before or after the candle was lit.\n\n•\n\nState transition:\
    \ How a change unfolded—gradual, sudden, uneven, patchy. Example: a barn renovation\
    \ video showing transformation stages across multiple weeks.\n\n•\n\nAction repetition\
    \ count: How many times an action occurred, banded as 1–2, 4–5, or 8+ to absorb\
    \ video-generation variance. Example: counting how many times a molinillo is spun\
    \ in a hot chocolate preparation video.\n\n### S40 · Audio Gap (Prosodic).\n\n\
    [原文定位](https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px4)\n\n•\n\nAudio prosody\
    \ (happy/unhappy): Emotional tone conveys preference, while the transcript uses\
    \ deliberately neutral words naming \\geq 2 candidates. Example: a voice message\
    \ saying “I tried the brass-and-glass telegraph” in a happy tone, while another\
    \ message mentions a different telegraph neutrally.\n\n### S41 · A.3 Fact Roles\
    \ and Chain Structure\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A1.SS3)\n\n\
    Every answerable MOSAIC item is built around a reasoning chain—an ordered sequence\
    \ of required facts. Each fact has a role:\n\n•\n\nNarrower (NAR): Reduces the\
    \ candidate set (e.g., “I prefer vintage items”).\n\n•\n\nSelector (SEL): Identifies\
    \ a unique entity (e.g., “the brass-and-glass telegraph I sounded happy about”).\n\
    \n•\n\nAnswer (ANS): Carries the final value (e.g., “8:15 AM”).\n\nA chain follows\
    \ the pattern \\text{NAR}^{*}\\;\\text{SEL}^{*}\\;\\text{ANS} . Every valid chain\
    \ satisfies four constraints defined in §3.3. A chain is cross-modal when its\
    \ required facts span at least two modalities. The gap-bearing detail typically\
    \ resides in a Narrower or Selector. The Answer’s final value is always a short\
    \ text-expressible string (a name, price, count, or date), but the fact that carries\
    \ it may itself be multimodal—e.g., a brand name readable only in an image, or\
    \ a preference conveyed only by prosody.\n\n### S42 · Appendix B Generation Pipeline\
    \ Details\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A2)\n\nFigure 7: The MOSAIC\
    \ generation pipeline. Stage 1 samples a persona and designs a multi-hop reasoning\
    \ chain; Stage 2 audits it via a per-fact deletion test against twelve failure\
    \ modes; Stage 3 realises it as a timestamped multi-session conversation with\
    \ persona-conditioned filler; Stage 4 synthesises the media assets, followed by\
    \ structural and LLM-based quality filtering.\n\n### S43 · B.1 Stages 1–3 in Detail\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#A2.SS1)\n\nEach item is grounded\
    \ in a persona from Nemotron-Personas. A round-robin sampler assigns gap strategies\
    \ and audio tones for uniform coverage, and a single LLM call designs one caption-distinct\
    \ primary entity per question (at most two per category, differing in \\geq 2\
    \ of style, colour, material, setting, or condition). The LLM then designs the\
    \ chain question-first—write the question, choose the answer, then construct the\
    \ chain \\mathcal{C} and its facts under the bridge-entity and entity-pair constraints\
    \ (§3.3). Every chain enters a validate-and-repair loop (up to three iterations):\
    \ a programmatic pass enforces hard structural constraints, and an LLM judge runs\
    \ a per-fact deletion test against twelve named failure modes (e.g. Lexical-Leak,\
    \ Bridge-Integrity, Shortcut); chains unrepaired after three iterations are discarded,\
    \ and Answer Refusal items have their required facts stripped after auditing.\
    \ Surviving facts are realised as natural turns in a chronological haystack of\
    \ evidence and persona-conditioned filler sessions, under a temporal-leak guard\
    \ and a forbidden-value list that keep early or non-answer turns from leaking\
    \ the answer.\n\n### S44 · B.2 Stage 4 Filtering Lineage and Release Statistics\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#A2.SS2)\n\nStage 4 synthesises media—images\
    \ via FLUX-2-pro (GPT-image-2 for text-rich gaps), video via Kling/Seedance, and\
    \ audio via Qwen3-TTS with persona-aware voices—after which a filtering cascade\
    \ reduces the 1,050 raw items to 1,004 structurally and semantically valid candidates.\
    \ Of the 864 answerable candidates, an omni answerability probe accepts 745; a\
    \ second automated quality intersection retains 740 of these plus 139 of the 140\
    \ Answer Refusal candidates, producing an 879-item automated set. A three-annotator\
    \ human audit of 100 sampled items (94.3% well-posed) then rescues 44 probe false\
    \ negatives, yielding exactly 923 unique items (784 answerable + 139 refusal).\
    \ We report this as an exact lineage rather than reconstructing it from rounded\
    \ pass rates; the 784/864 (90.7%) figure is a filtering retention rate, not a\
    \ human answerability ceiling (full cascade in Appendix E; audit in Appendix I).\n\
    \nMOSAIC-Eval spans 70 personas (11–24 sessions, mean 17.5), 4,573 annotated facts\
    \ of which 1,860 are required by answerable items, 10,765 multimodal artefacts,\
    \ and an \\sim 18.8M-token haystack ( \\sim 269K tokens per persona, 1.7\\times\
    \ LongMemEval’s budget in denser sessions). Among answerable items, 668/784 (85.2%)\
    \ require at least two facts and 588/784 (75.0%) require at least two modalities.\
    \ Required evidence appears in image, audio, video, and text for 780 (99.5%),\
    \ 424 (54.1%), 184 (23.5%), and 277 (35.3%) items respectively; these incidence\
    \ rates overlap, so we report per-challenge strata throughout. The remaining distribution\
    \ tables appear in Appendix D.\n\n### S45 · B.3 Prompt Templates\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A2.SS3)\n\
    \nThe pipeline uses a modular set of LLM prompt templates, each targeting a specific\
    \ generation subtask:\n\n•\n\nChain design: Given a persona, question type, and\
    \ assigned modalities, the LLM designs the reasoning chain question-first: write\
    \ the question, choose the answer, then construct the chain \\mathcal{C} and its\
    \ facts. Type-specific templates enforce the required hop count and session structure.\n\
    \n•\n\nFact extraction: After chain design, the LLM extracts canonical fact statements\
    \ from the reasoning chain, assigning each fact a role (Narrower, Selector, Answer),\
    \ a modality, and a gap strategy.\n\n•\n\nSession planning: Facts are distributed\
    \ across a chronological timeline of evidence and filler sessions. Periods and\
    \ session groups are assigned programmatically; the LLM determines the natural\
    \ language realisation of each fact within its assigned session.\n\n•\n\nValidation\
    \ and repair: A dedicated validation prompt runs a per-fact deletion test and\
    \ checks for twelve named failure modes (see below). Failures trigger minimal\
    \ repairs (1–3 targeted changes); items unrepaired after three iterations are\
    \ discarded.\n\n•\n\nSession building: An LLM rewrites each canonical fact as\
    \ a natural conversation turn under two guards: a temporal-leak guard restricts\
    \ facts to those with \\texttt{hop\\_index}\\leq the current turn, and a forbidden-value\
    \ list prevents Narrower and Selector facts from mentioning the Answer value.\n\
    \n### S46 · B.4 Chain Templates\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A2.SS4)\n\
    \nTable 7 lists the type-specific chain templates used during Stage 1 chain design\
    \ (§4).\n\nType\n\nChain template\n\nInfo. Extraction\n\nNaropt \\rightarrow Sel\
    \ \\rightarrow Ans\n\nMsr-Selection\n\nNaropt \\rightarrow Sel \\rightarrow Ans\
    \ (cross-sess.)\n\nMsr-Bridge\n\nNaropt \\rightarrow Sel \\rightarrow Sel \\rightarrow\
    \ Ans\n\nKnowledge Update\n\nNaropt \\rightarrow Selold \\rightarrow Ansnew\n\n\
    Temporal Reasoning\n\nNaropt \\rightarrow Selplan \\rightarrow Seldisrupt \\rightarrow\
    \ Ansout.\n\nAnswer Refusal\n\ninherits IE, evidence stripped\n\nTable 7: Chain\
    \ templates. Nar = Narrower, Sel = Selector, Ans = Answer. “opt” denotes an optional\
    \ narrowing step.\n\n### S47 · B.5 Twelve Named Failure Modes\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A2.SS5)\n\
    \nTable 8 catalogues the twelve failure modes checked during Stage 2 chain validation\
    \ (§4). Each mode targets a specific class of generation defect, detected by the\
    \ LLM validation judge, triggering targeted repairs; chains unrepaired after three\
    \ iterations are discarded.\n\nFailure Mode\n\nDefinition\n\nLexical-Leak\n\n\
    The question text paraphrases or contains the answer value.\n\nBridge-Integrity\n\
    \nAdjacent facts in the chain do not share a concrete referent.\n\nShortcut\n\n\
    The answer can be derived from text-only evidence, bypassing the intended modality\
    \ gap.\n\nEntity-Mismatch\n\nThe entity described in the Answer fact does not\
    \ match the entity selected by prior facts.\n\nGap-Anchoring\n\nThe question text\
    \ does not reference the gap-bearing detail, making it unclear which evidence\
    \ to retrieve.\n\nRedundant-Gap\n\nTwo facts test the same modality gap, reducing\
    \ diversity.\n\nSession-Overlap\n\nRequired facts from different hops are placed\
    \ in the same session, collapsing the temporal structure.\n\nTone-Collapse\n\n\
    Both audio candidates share the same prosodic tone, removing the discriminator.\n\
    \nPeriod-Leak\n\nA later-period fact leaks the answer value into an earlier period’s\
    \ context.\n\nCaption-Distinctness\n\nPrimary entities in the same category are\
    \ not sufficiently distinct ( <2 of style, colour, material, setting, condition).\n\
    \nEntity-Pair\n\nAn audio/video Narrower or Selector has no competing same-type\
    \ entity, making the gap unnecessary.\n\nCount-Band\n\nThe action repetition count\
    \ in a video question does not match the specified count band (1–2, 4–5, 8+).\n\
    \nTable 8: The twelve named failure modes checked during Stage 2 validation.\n\
    \n### S48 · B.6 Filler Session Generation\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A2.SS6)\n\
    \nFiller dialogue text is taken from LongMemEval’s publicly released\n\ncustom-history\
    \ filler pool (Wu et al., 2025)\n\n(data_5_filler_sess.json; 29,149 sessions):\n\
    \nUltraChat (Ding et al., 2023) (20,000 sessions; LLM-synthesized\n\ndialogues;\
    \ MIT; accessed via https://github.com/thunlp/UltraChat) and\n\nShareGPT (Chiang\
    \ et al., 2023) (9,149 sessions; user-shared ChatGPT\n\ntranscripts curated via\
    \ LMSYS FastChat; Apache 2.0 as stated by\n\nLongMemEval, accessed via https://github.com/lm-sys/FastChat).\
    \ We do not\n\nre-sample upstream dumps independently; session IDs retain the\
    \ LongMemEval\n\nultrachat_* / sharegpt_* scheme. In the official release\n\n\
    configuration the existing-corpus ratio is 1.0 (no LLM-generated filler\n\ndialogue).\
    \ Multimodal attachments on fillers are injected separately by our\n\npipeline\
    \ and are synthetic. Topic filtering prevents fillers from mentioning\n\nevidence\
    \ entities. Fillers are interleaved chronologically with evidence\n\nsessions\
    \ to create realistic temporal gaps.\n\n### S49 · C.1 System Architectures\n\n\
    [原文定位](https://arxiv.org/html/2610.29249v1#A3.SS1)\n\nFigure 8: The three system\
    \ architectures evaluated on MOSAIC: Caption-Text (VL captioner + Whisper ASR,\
    \ text index), Omni-Text (single omni captioner preserving prosody, text index),\
    \ and Native-MM (multimodal embeddings over raw artefacts, omni-modal reasoner).\n\
    \nThree architectures differ in how multimodal evidence is preprocessed and indexed\
    \ (see Figure 8):\n\n•\n\nCaption-Text (CT): A VL captioner (Qwen3-VL-235B-A22B)\
    \ and Whisper-large-v3-turbo convert all non-text evidence to captions. All captions\
    \ are indexed as text chunks with a text embedding model (Qwen3-Embedding-0.6B).\
    \ A text-only LLM reasoner retrieves and answers over captions.\n\n•\n\nOmni-Text\
    \ (OT): A single omni-modal LM (MiMo-V2.5) replaces the cascade, generating captions\
    \ that preserve audio prosody (Whisper discards it). Otherwise identical to Caption-Text:\
    \ text index, text reasoner.\n\n•\n\nNative-MM (NMM): No textualization. Raw images,\
    \ video frames, and audio are indexed with a multimodal embedding model (jina-embeddings-v5-omni-small).\
    \ An omni-modal LM reasons directly over the retrieved artefacts (images, video,\
    \ audio).\n\n### S50 · C.2 Retrieval Back-Ends\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A3.SS2)\n\
    \n•\n\nNaive RAG: Single-pass retrieval with top- k=20 , using Qwen3-Embedding-0.6B\
    \ (Zhang et al., 2025) for text indices and jina-embeddings-v5-omni-small (Hönicke\
    \ et al., 2026) for Native-MM. Query rewriting (LLM keyword extraction) before\
    \ embedding. No time filter. Score threshold 0.0.\n\n•\n\nReAct-RAG: Iterative\
    \ retrieval (up to 5 steps) with a tool-use loop; the model decides when to search\
    \ and when to answer. SEARCH/ANSWER marker format for Native-MM, function calling\
    \ for text architectures. Search top- k=20 , query rewriting enabled, duplicate\
    \ query rejection. Every ReAct configuration must first pass a one-search parity\
    \ gate, in which the scaffold is restricted to a single retrieval call and must\
    \ reproduce the corresponding Naive RAG run’s retrieval and delivery plumbing;\
    \ ReAct numbers are reported only after that gate matches.\n\n•\n\nA-MEM (Xu et\
    \ al., 2025): Agentic memory system that extracts structured memory entries from\
    \ conversation history. Uses MiniLM-L6-v2 (Wang et al., 2020) embeddings. Applied\
    \ only to Caption-Text and Omni-Text, since it does not ingest native media.\n\
    \n•\n\nMemoryOS (Kang et al., 2025): Memory operating system that organizes conversation\
    \ history into retrievable memory blocks. Uses MiniLM-L6-v2 embeddings. Applied\
    \ only to Caption-Text and Omni-Text. MemoryOS does not expose a ranked candidate\
    \ list, so its chain-coverage cells are reported as not observable rather than\
    \ zero.\n\n### S51 · C.3 Reasoning Models\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A3.SS3)\n\
    \n•\n\nFixed reader (all matched conditions and Track A): Gemini 3.5, temperature\
    \ 0, 1,024 output tokens, extended thinking disabled. Chosen because it played\
    \ no role in dataset construction.\n\n•\n\nText reasoners (Track B): DeepSeek-v4-Flash\
    \ for Naive RAG, ReAct, A-MEM, and MemoryOS over the text architectures. Temperature\
    \ 0.\n\n•\n\nOmni reasoners (Track B, Native-MM only): MiMo-V2.5 and Gemini 3.5.\
    \ Temperature 0. For Native-MM ReAct, the omni model handles both the iterative\
    \ search loop and the final answer.\n\n•\n\nWrite-time models: generic text uses\
    \ a Qwen3-VL-235B captioner (Bai et al., 2025) with Whisper-large-v3-turbo ASR\
    \ (Radford et al., 2023); structured text uses a query-blind MiMo-V2.5 writer\
    \ with fixed per-modality schemas that preserve spatial relations, temporal order,\
    \ counts, and prosody.\n\n### S52 · C.4 Diagnostic Conditions\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A3.SS4)\n\
    \nBeyond the two architecture tracks, the matched decomposition\n\n(§5.1) runs\
    \ seven conditions on the same 784 answerable\n\nQIDs under one reader, prompt,\
    \ packer, budget, and judge:\n\n•\n\nGold symbolic facts: the annotated required\
    \ facts as text, bounding residual read and grading error.\n\n•\n\nGold native\
    \ evidence: the same chain delivered as raw media, isolating native perception\
    \ cost.\n\n•\n\nGold generic text: the same chain as VL captions plus Whisper\
    \ ASR, isolating write-time textualization loss.\n\n•\n\nGold structured text:\
    \ the same chain under the query-blind structured writer, isolating the avoidable\
    \ share of that loss.\n\n•\n\nRetrieved native, all delivered: every retrieved\
    \ hit is serialized, isolating retrieval loss at fixed delivery.\n\n•\n\nRetrieved\
    \ native, production caps: the identical ranked manifest under top-20 units, three\
    \ media per modality, 100 MB, isolating delivery loss at fixed ranking.\n\n•\n\
    \nEnd-to-end native RAG: adds the frozen fixed-rewrite query ranking.\n\nDelivery\
    \ is additionally swept over two tighter budgets (top-10 units with\n\nthree media;\
    \ top-5 units with one media item per modality) against a single\n\nfrozen top-50\
    \ manifest, so that retrieval quality is constant by construction\n\nand only\
    \ the packer’s allowance varies. The within-item modality interventions\n\n(§5.2)\
    \ supply twelve further conditions: four image\n\nvariants, four video variants,\
    \ and four audio variants.\n\n### S53 · C.5 LLM-as-Judge Protocol\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A3.SS5)\n\
    \nAll system outputs are evaluated by a single LLM judge (Qwen3.7-Plus; full\n\
    \nprompt in Appendix M). A three-judge panel (GLM-5.2 and\n\nGrok-4.5 as auxiliaries)\
    \ re-scores every Track B run to verify that conclusions\n\nare robust to judge\
    \ identity (agreement statistics:\n\nAppendix J). Only the primary judge’s scores\
    \ appear in any\n\nreported number. The judge receives the question, expected\
    \ answer, accepted\n\naliases, and the system’s predicted answer, and assigns\
    \ a score on a 0–1\n\nscale:\n\nScore\n\nLabel\n\nDefinition\n\n1.0\n\nPerfect\n\
    \nSemantically identical to expected or alias. Only formatting/capitalization\
    \ differs.\n\n0.7\n\nMostly Correct\n\nRight answer but extra context or slightly\
    \ imprecise wording.\n\n0.5\n\nPartial\n\nGets category or one part right, misses\
    \ specifics.\n\n0.3\n\nAttempted\n\nCore fact wrong but shows effort.\n\n0.0\n\
    \nWrong\n\nCompletely incorrect, refused on answerable question, empty, or error.\n\
    \nTable 9: LLM-as-Judge scoring rubric.\n\nFor Answer Refusal items, “I don’t\
    \ know” or similar refusals score 1.0; any other answer scores 0.0.\n\n### S54\
    \ · C.6 Metrics Definitions\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A3.SS6)\n\
    \n•\n\nJudge score (answerable): Mean judge score over the 784 answerable items.\
    \ Answer Refusal is excluded and reported separately as abstention.\n\n•\n\nAbstention\
    \ (paired): Correct-refusal rate on the 139 Answer Refusal items together with\
    \ the false-refusal rate on the 784 answerable items (Table 28, Figure 6); reporting\
    \ both prevents an always-abstain system from appearing well-calibrated.\n\n•\n\
    \nRequired-fact Recall@ k : Fraction of an item’s gold required facts whose source\
    \ unit appears in the top- k set, computed over both the ranked units and the\
    \ units actually serialized into the request.\n\n•\n\nComplete-chain Recall@ k\
    \ / chain delivery: Fraction of items for which every required fact appears, ranked\
    \ or delivered respectively. This is the retrieval metric that matters for multi-hop\
    \ memory, since a partial chain is not usable.\n\n•\n\nPaired effect: For a controlled\
    \ contrast, the mean within-item difference over the shared QID set, with an item-bootstrap\
    \ 95% interval (10,000 resamples), wins/ties/losses, and a persona-clustered bootstrap\
    \ as a dependence sensitivity check.\n\n### S55 · Appendix D Dataset Statistics\n\
