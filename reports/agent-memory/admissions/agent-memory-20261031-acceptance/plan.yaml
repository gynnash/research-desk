    \ 100-item audit.\n\n### S71 · I.4 Failure Mode Distribution\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A9.SS4)\n\
    \nTable 24 breaks down failure modes for items where the omni probe verdict was\
    \ NO. Evidence item invalid (60.0%) dominates, reflecting generative media artefacts\
    \ rather than benchmark design flaws.\n\nFailure Mode (Q4)\n\nCount\n\n%\n\nEvidence\
    \ item invalid\n\n126\n\n60.0%\n\nModel overlooked gap-bearing detail\n\n34\n\n\
    16.2%\n\nModel refused incorrectly\n\n31\n\n14.8%\n\nModel attended to wrong modality\n\
    \n16\n\n7.6%\n\nJudge format mismatch\n\n3\n\n1.4%\n\nTable 24: Failure mode distribution\
    \ on Judge=NO items (pooled across 3 evaluators).\n\nThe failure mode distribution\
    \ clarifies why the omni probe fails. The dominant category—evidence item invalid\
    \ (60.0%)—indicates that the primary bottleneck is media synthesis quality: generated\
    \ images sometimes render text illegibly, video frames occasionally miscount actions,\
    \ and audio clips may garble prosodic cues. This is a limitation of current generative\
    \ models rather than a benchmark design flaw, and as synthesis quality improves,\
    \ these failures will naturally decrease. The second-largest category, model overlooked\
    \ gap-bearing detail (16.2%), reveals that even a capable omni model sometimes\
    \ attends to the correct modality but misses the specific detail that the gap\
    \ strategy targets—for example, reading the foreground text in an image while\
    \ missing the small background label that contains the answer. This is precisely\
    \ the failure mode that MOSAIC is designed to expose in evaluated systems. Model\
    \ refused incorrectly (14.8%) indicates cases where the omni probe said “I don’t\
    \ know” despite the evidence being present and legible, likely due to ambiguous\
    \ question phrasing or insufficient reasoning depth. The remaining categories—wrong\
    \ modality (7.6%) and format mismatch (1.4%)—are minor, confirming that the probe\
    \ generally attends to the correct evidence source.\n\n### S72 · I.5 Probe Rejections\
    \ Overturned (Rescued Items)\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A9.SS5)\n\
    \nThe human audit identified 44 items where the omni probe verdict was NO but\
    \ annotators restored them to the final set. The selection rule is: an item is\
    \ excluded only if all three annotators mark the evidence item invalid (26 items);\
    \ otherwise it is rescued (44 items). The 44 rescued items are not unanimous first-pass\
    \ agreement—first-pass Q2 Yes counts were 35/36/46 across the three annotators\
    \ across the 70 probe-NO items audited—so “quality 1.0” means inclusion under\
    \ the three-annotator unanimous-exclusion rule, not unanimous first-pass acceptance.\
    \ Rescued items span all five answerable question types: Information Extraction\
    \ (5), Knowledge Update (11), MSR Bridge (9), MSR Selection (9), and Temporal\
    \ Reasoning (10).\n\n### S73 · I.6 Inter-Rater Agreement\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A9.SS6)\n\
    \nPairwise agreement between evaluators measures the reliability of human judgments:\n\
    \nQ1 (Well-posed?): mean pairwise 94.0% (E1-E2=95%, E2-E3=91%, E1-E3=96%).\n\n\
    Q2 (Gold answer correct?): mean pairwise 92.7% (E1-E2=99%, E2-E3=90%, E1-E3=89%).\n\
    \nQ3 (Evidence sufficient?): mean pairwise 84.0% (E1-E2=84%, E2-E3=76%, E1-E3=92%).\n\
    \nQ3 shows the highest variance (76–92%), reflecting genuine perceptual ambiguity\
    \ in judging whether a synthesised image or audio clip “clearly shows” the intended\
