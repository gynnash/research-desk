    \ distinct items,\n\nnot independent subsets.\n\n### S11 · 3.2 Modality Gaps\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S3.SS2)\n\nA modality gap is information\
    \ that survives only because its native\n\nmodality preserves it, while a text-only\
    \ or caption-based agent would lose it.\n\nRequired non-text facts are assigned\
    \ a gap strategy\n\n(Appendix A): image (background detail, fine-grained\n\nattribute,\
    \ spatial configuration), video (action ordering, state\n\ntransition, repetition\
    \ count), or audio (happy/unhappy prosody with\n\nneutral wording over \\geq 2\
    \ candidates); Appendix D\n\nbreaks down tag coverage. Audio prosody is the most\
    \ frequent\n\nannotated strategy (450 facts / 399 of 784 answerable items), so\
    \ Caption-Text /\n\nASR write paths lose the tone discriminator by design—a pipeline\
    \ exposure,\n\nnot a gold-delivery perception cost (§6.2).\n\n### S12 · Challenge\
    \ by construction.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S3.SS2.SSS0.Px1)\n\
    \nA media attachment is insufficient to establish multimodal reasoning,\n\nsince\
    \ a caption or transcript may preserve the entire answer. MOSAIC therefore\n\n\
    assigns a challenge before dialogue and media realization, specifying the\n\n\
    native relation that carries a fact together with constraints that keep that\n\
    \nrelation out of the surrounding text; every answerable item contains at least\n\
    \none required challenge-bearing fact (Table 2). Action\n\nRepetition Count is\
    \ representative: a fixed-camera clip repeats one action with\n\nno cuts and no\
    \ on-screen counter, and the dialogue says only “a few times,” so\n\na generic\
    \ caption preserves the event but loses the selector\n\nneeded to continue the\
    \ chain (per-challenge specifications:\n\nAppendix A).\n\n### S13 · 3.3 Reasoning\
    \ Chains and Fact Roles\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S3.SS3)\n\
    \nEvery answerable item has a reasoning chain of required facts with roles\n\n\
    Narrower (NAR; reduces candidates), Selector (SEL; identifies\n\nan entity), and\
    \ Answer (ANS; carries the final value), in the pattern\n\n\\text{NAR}^{*}\\;\\\
    text{SEL}^{*}\\;\\text{ANS} .\n\nValid chains are bridge-entity-linked and deletion-tested\n\
    \n(§4): removing any required fact makes the\n\nquestion unanswerable, and audio/video\
    \ discriminators choose among\n\n\\geq 2 same-type entities. A chain is cross-modal\
    \ when required\n\nfacts span at least two modalities; gap-bearing detail usually\
    \ sits in a\n\nNarrower or Selector, and the Answer’s final\n\nvalue is always\
    \ a short text-expressible string (enabling judge\n\nscoring), though the fact\
    \ carrying it may itself be multimodal (full\n\nconstraints and templates: Appendix\
    \ A).\n\n### S14 · 4 The MOSAIC Generation Pipeline\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S4)\n\
    \nMOSAIC is produced by a fully automated, config-driven four-stage pipeline\n\
    \n(Figure 7; details in Appendix B). Each item\n\nis grounded in a Nemotron-Personas\
    \ persona (Meyer and Corneil, 2025).\n\nAn LLM designs a caption-distinct primary\
    \ entity, then builds the chain\n\nquestion-first under the bridge-entity and\
    \ entity-pair constraints\n\n(§3.3). A validate-and-repair loop combines programmatic\
    \ checks\n\nwith a per-fact deletion test against twelve failure modes; unrepaired\
    \ chains\n\nare discarded, and Answer Refusal items strip required facts after\n\
    \nauditing. Surviving facts become chronological evidence and filler sessions\n\
    \nunder leak guards. Stage 4 synthesises media (FLUX-2-pro / Kling–Seedance /\n\
    \nQwen3-TTS). Filtering then yields the exact lineage\n\n1{,}050\\!\\rightarrow\\\
    !1{,}004\\!\\rightarrow\\!879 (automated) before a\n\nthree-annotator audit of\
    \ 100 items (94.3% well-posed) rescues 44 probe false\n\nnegatives, giving MOSAIC-Eval:\
    \ 923 items (784 answerable +\n\n139 refusal). Reweighting that audit with a 100-item\
    \ probe-YES follow-up\n\nestimates \\approx 97.8% gold-correct and \\approx 96.6%\
    \ evidence-sufficient\n\non the 784 answerable releases (Appendix I); the 784/864\n\
    \n(90.7%) figure remains a filtering retention rate, not a human\n\nanswerability\
    \ ceiling (Appendix E).\n\nThe release spans 70 personas (11–24 sessions, mean\
    \ 17.5), 10,765 multimodal\n\nartefacts (Table 10), and \\sim 18.8M tokens\n\n\
    ( \\sim 269K/persona). Among answerable items, 85.2% need \\geq 2 facts and\n\n\
    75.0% need \\geq 2 modalities; required evidence appears in image, audio,\n\n\
    video, and text for 99.5%, 54.1%, 23.5%, and 35.3% of items (overlapping),\n\n\
    so we report per-challenge strata rather than claiming uniform modality\n\nbalance;\
    \ Appendix D collects the remaining haystack\n\nstatistics.\n\n### S15 · 5 Diagnostic\
    \ Evaluation Protocol\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S5)\n\nTo\
    \ answer RQ1–RQ4 with matched stage contrasts, the protocol makes every stage\n\
    \nof the pipeline separately substitutable under a frozen reader, prompt, and\n\
    \nbudget. For history H , question q , and delivery budget B , let\n\n\\displaystyle\
    \ M\n\n\\displaystyle=W(H),\n\n\\displaystyle R\n\n\\displaystyle=G(q,M),\n\n\\\
    displaystyle D\n\n\\displaystyle=P(R,B),\n\n\\displaystyle\\hat{a}\n\n\\displaystyle=F(q,D),\n\
    \n(1)\n\nwhere W writes memory, G retrieves units, P serializes and packs them,\n\
    \nand F reads the delivered evidence. A retrieved artefact counts as\n\ndelivered\
    \ only if it is presented to the actual provider, a\n\ndistinction that turns\
    \ out to matter a great deal\n\n(§6.1).\n\n### S16 · 5.1 Matched Stage Decomposition\n\
