    \ Song\n\n### S2 · Abstract\n\n[原文定位](https://arxiv.org/html/2610.29249v1#abstract1)\n\
    \nOmni-modal assistants must remember not only what users say, but also what they\
    \ show and convey. Existing long-term memory benchmarks are mostly text-and-image\
    \ or report a single end-to-end score, so they cannot locate whether evidence\
    \ is lost when it is represented, retrieved, delivered, or read. We introduce\
    \ MOSAIC, a benchmark of 923 questions over persona-grounded histories of 11–24\
    \ sessions spanning text, image, video, and audio. MOSAIC constructs targeted\
    \ spatial, temporal, and prosodic signals rather than decorative media—with the\
    \ strongest causal validation for spatial information and selector-level validation\
    \ for annotated prosody—and pairs them with a matched diagnostic protocol that\
    \ freezes the question, reader, prompt, and budget while intervening on representation,\
    \ retrieval, and delivery. Matched decomposition shows that representation loss\
    \ is modality-dependent, residual reading dominates even under gold evidence,\
    \ and abstention remains weak on these controls: strong answerable scores coexist\
    \ with failures to refuse. MOSAIC thus turns omni-modal memory evaluation from\
    \ a leaderboard into a diagnosis of write, retrieve, deliver, and read failures.\n\
    \n### S3 · 1 Introduction\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S1)\n\n\
    Omni-modal assistants such as GPT-4o, Gemini, Qwen-Omni, and MiMo (OpenAI et al.,\
    \ 2024; Team et al., 2025; Qwen Team, 2026; Xiaomi LLM-Core Team, 2026) are moving\
    \ from single-turn demos to persistent, multi-session deployments. A user may\
    \ share a product photo in January, leave a dietary voice note in March, and later\
    \ expect both to inform a recommendation. Answering requires not only retrieving\
    \ temporally scattered evidence, but chaining it across modalities (Figure 1).\
    \ Prior conversational memory benchmarks omit video/audio, treat images as optional,\
    \ or stop at text–image co-reference; none combine four-modality multi-session\
    \ dialogue with a matched stage-diagnostic protocol (Table 1).\n\nFigure 1: Example\
    \ MOSAIC haystack: evidence spans four modalities and months of sessions. Answering\
    \ the final query requires chaining a January text specification with later audio\
    \ and video evidence.\n\nFigure 2: Overview of MOSAIC. Top: what the benchmark\
    \ tests—evidence\n\nscattered across months of text, image, video, and audio sessions\
    \ must be\n\nchained across modalities. Construction targets native signals rather\
    \ than\n\ndecorative media: spatial layout and background detail in images; action\n\
    \norder, repetition count, and state change in video; vocal affect in audio\n\n\
    (causal validation is strongest for spatial detail; §6.2).\n\nBottom: where systems\
    \ lose that signal—matched interventions on\n\nwrite (representation compression),\
    \ retrieve (missed\n\nfacts), deliver (retrieved but dropped under media caps),\
    \ and\n\nread (misread complete evidence).\n\nModalities\n\nReasoning\n\nBenchmark\n\
