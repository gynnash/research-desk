    \nMatched conditions use Gemini 3.5 as the fixed omni-modal reader (temperature\
    \ 0;\n\nextended thinking disabled), held out from dataset construction: MiMo-V2.5\
    \ is\n\nthe answerability probe, so using it as the primary reader would couple\n\
    \nselection with evaluation. The trade-off is disclosed—gold-native failures\n\
    \nmix perception error with bounded item noise\n\n(§6.1). Retrieval replays a\
    \ frozen top-50 ranked\n\nmanifest; the production budget delivers the top 20\
    \ units with at most three\n\nitems per modality under a 100 MB media cap. Embedders,\
    \ captioner/ASR,\n\nstructured writer (query-blind MiMo-V2.5 schemas), and judge\
    \ (Qwen3.7-Plus)\n\nare listed in Appendix C. MiMo-V2.5 as second reader on the\n\
    \n120-item pilot reproduces the gold and budgeted stage ladder\n\n(Appendix K.2);\
    \ uncapped all-delivered remains Gemini-only\n\n(MiMo timeouts under large multimodal\
    \ payloads).\n\n### S18 · 5.2 Within-Item Modality Interventions\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S5.SS2)\n\
    \nWithin an item we change one required carrier while holding its question,\n\n\
    evidence order, and every other hop fixed. Image variants are raw media,\n\nOCR-only\
    \ text, object-only text, and a spatial description; video variants are\n\nraw\
    \ video, ordered sparse frames, shuffled frames, and an ordered event/count\n\n\
    description; audio variants are raw audio, ASR, ASR plus a gold\n\nprosody tag\
    \ from the construction annotation (an upper bound on any prosody\n\ntagger),\
    \ and ASR plus the swapped gold tag (happy \\leftrightarrow unhappy).\n\nImage\
    \ and video text variants use the same query- and answer-blind MiMo writer\n\n\
    as the structured-write condition.\n\nBecause every retained item was verified\
    \ answerable from native evidence alone,\n\na text-over-raw gap indicates a perception\
    \ failure rather than a missing\n\nsignal. Each contrast is restricted to the\
    \ matching challenge stratum, and a\n\nper-condition leak audit verifies that\
    \ non-intervened hops are unchanged.\n\n### S19 · 5.3 Two Architecture Tracks\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S5.SS3)\n\nWe separate two questions\
    \ that end-to-end leaderboards conflate.\n\nIn Track A (fixed reader), flat RAG\
    \ over caption-text, omni-text, and\n\nnative indexes, plus A-MEM (Xu et al.,\
    \ 2025) and\n\nMemoryOS (Kang et al., 2025), export retrieved context to one reader,\n\
    \nprompt, packer, budget, and judge—comparing the useful evidence each\n\nbackend\
    \ produces. In Track B (native end-to-end), Naive RAG, repaired\n\nReAct (Yao\
    \ et al., 2023), A-MEM, and MemoryOS use their intended\n\ncontrollers and readers,\
    \ measuring deployable capability descriptively\n\nbecause multiple components\
    \ change at once.\n\nThree representations underlie both tracks\n\n(Appendix C):\
    \ Caption-Text (VL captioner + ASR),\n\nOmni-Text (single omni LM captions that\
    \ retain prosody Whisper\n\ndiscards; retrieval still textual), and Native-MM\
    \ (multimodal\n\nembeddings + omni reader over raw artefacts). A-MEM and MemoryOS\
    \ are\n\ntext-derived only; ReAct results in Table 28 are adaptive (up to 5 iterative\
    \ search steps; mean 1.91 searches, median 1). A one-search parity gate is applied\
    \ first—the scaffold is restricted to a single retrieval and must match the corresponding\
    \ Naive RAG run’s retrieval and delivery plumbing—and adaptive ReAct numbers are\
    \ reported only after that gate passes.\n\n### S20 · 5.4 Metrics and Uncertainty\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S5.SS4)\n\nThe primary answer metric\
    \ is a 0–1 semantic judge score from Qwen3.7-Plus\n\n(rubric in Appendix C) (Li\
    \ et al., 2024), reported\n\nseparately for the 784 answerable items, with correct-refusal\
    \ and false-refusal\n\nrates paired so that an always-abstain system cannot appear\
    \ calibrated.\n\nRetrieval and delivery use required-fact and complete-chain Recall@\
    \ k over both\n\nranked units and units actually serialized into the request.\
    \ Controlled\n\ncomparisons are paired by QID with item-bootstrap 95% intervals\
    \ and\n\nwins/ties/losses; a persona-clustered bootstrap is a dependence check.\n\
    \nReported intervals are per-contrast and unadjusted across the many paired\n\n\
    tests and strata, so exploratory challenge-level nulls should be read\n\ncautiously.\
    \ GLM-5.2 and Grok-4.5 evaluate each native end-to-end run\n\n(Appendix J); Appendix\
    \ C documents\n\nmanifests, media caps, and scoring; Appendix M reproduces the\n\
    \nprompts.\n\n### S21 · 6 Results and Analysis\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S6)\n\
    \nAll numbers come from one canonical paired run, and every stage claim uses only\n\
    \npaired conditions with identical QIDs, readers, prompts, packers, and judges.\
    \ A\n\nretrieved-but-dropped artefact counts as a delivery failure rather than\
    \ a\n\nreading failure, and a write loss is claimed only where structured text\
    \ recovers\n\nan error made with generic text.\n\n### S22 · 6.1 Overall Stage\
    \ Decomposition (RQ1–RQ3)\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS1)\n\
    \nFigure 3: Decomposing the loss on the 784 answerable items under one fixed\n\
    \nreader, prompt, packer, and judge (Table 3).\n\n(a) Descending the native pipeline:\
    \ each arrow is a paired drop\n\nassociated with the intervened stage under the\
    \ matched protocol; the shaded\n\nband is residual reading error under gold symbolic\
    \ facts. (b)\n\nWrite-time representation only: generic captions/ASR cost 9.3\
    \ points; a\n\nquery-blind structured writer recovers a statistically insignificant\
    \ 1.4.\n\nTable 3 and Figure 3 associate\n\neach paired drop with the intervened\
    \ stage under the matched protocol. Gold\n\nsymbolic facts score 0.846, so 15.4\
    \ points of residual reading/grading error\n\nremain even with perfect evidence.\
    \ Native gold evidence drops to 0.783\n\n(6.2-point perception cost [3.2, 9.3]);\
    \ generic captions/ASR fall further to\n\n0.690 ( -9.3 vs. native), and the structured\
    \ writer recovers only +1.4\n\n[ -0.9 , 3.7] to 0.704—a recovery indistinguishable\
    \ from zero. Retrieval\n\ncosts 7.6 points (0.783 \\to 0.708 all-delivered [5.2,\
    \ 9.9]) and production\n\npacking another 3.8 on identical ranked hits (0.708\
    \ \\to 0.670 [1.5, 6.0]),\n\nwith complete-chain delivery falling from 0.675 to\
    \ 0.491; end-to-end native\n\nRAG reaches 0.653 ( +1.7 vs. the original-query\
    \ budgeted condition is not\n\nmaterial). Under this frozen reader and judge,\
    \ reading is the largest single associated loss and the only\n\nstage whose dominance\
    \ is stable across pipelines; among the rest, retrieval leads for native\n\npipelines\
    \ while write-time textualization leads for text-derived ones. These are matched-protocol\
    \ associations, not universal causal bottlenecks: the 15.4-point gold-symbolic\
    \ residual reflects reader, output-format, and judge error in addition to true\
    \ reading failure.\n\nAppendix K gives paired CIs and write-contrast\n\nW/T/L;\
    \ Appendix K.7 the per-type ladders.\n\n### S23 · Perception cost is modality-dependent.\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS1.SSS0.Px1)\n\nVideo items score\
    \ 0.900 with symbolic facts but only 0.729 with native video\n\n(17.1-point perception\
    \ cost), against 6.2 for image (0.847 \\to 0.785) and none\n\nfor audio (0.821\
    \ \\to 0.826). For this fixed reader, video perception is a\n\ncandidate bottleneck—not\
    \ explained by retrieval or question difficulty alone.\n\n### S24 · Probe selection.\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS1.SSS0.Px2)\n\nProbe-pass (\
    \ n{=}740 ) and human-rescued ( n{=}44 ) items match under gold\n\nsymbolic facts\
    \ (0.846 vs. 0.845) but differ by 27.8 points under gold native\n\nevidence (0.799\
    \ vs. 0.520); absolute native scores are optimistic there, but\n\npaired comparisons\
    \ remain interpretable under the matched protocol.\n\n### S25 · Delivery is the\
    \ stage a retrieval-terminating decomposition cannot see.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS1.SSS0.Px3)\n\
    \nFigure 4 freezes the top-50 ranked manifest (required-fact\n\nRecall@50 =0.871\
    \ throughout) and varies only the packer. Halving the unit\n\nbudget costs 5.7\
    \ points [3.3, 8.0]; one media item per modality jointly with the reduced top-\
    \ k costs 17.7\n\n[14.5, 20.9] and collapses complete-chain delivery from 0.675\
    \ to 0.184\n\n(required-fact coverage 0.871 \\to 0.501). The 17.7-point drop therefore\
    \ reflects the combined effect of the top- k reduction and the one-media-per-modality\
    \ cap together, not the media cap alone. Context construction, not ranking,\n\n\
    is the binding constraint once media budgets tighten (numeric sweep in\n\nAppendix\
    \ K.3).\n\nFigure 4: Delivery-budget sweep over a single frozen top-50 ranked\
    \ manifest.\n\nRetrieval quality is constant (Recall@50 =0.871 ); only the packer’s\
    \ allowance\n\nchanges. One-media-per-modality packing collapses complete-chain\
    \ delivery from\n\n0.675 to 0.184.\n\n### S26 · 6.2 Representation Loss by Modality\
    \ (RQ1)\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS2)\n\nFigure 5: Within-item\
    \ paired effects on the governing challenge stratum\n\n(item-bootstrap 95% intervals).\
    \ Filled markers exclude zero. Spatial structure\n\nis the signal for which no\
    \ tested text surrogate is adequate.\n\nFigure 5 shows the paired effects on each\
    \ governing challenge\n\nstratum; Appendix K.4 tabulates exact estimates\n\nand\
    \ W/T/L.\n\n### S27 · Visual signals are heavily compressed by textualization.\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS2.SSS0.Px1)\n\nOn fine-detail\
    \ and background items, OCR-only text loses 18.5 points to raw\n\nimages [15.3,\
    \ 21.6], and on spatial-configuration items raw images beat\n\nOCR-only text by\
    \ 32.0 points. What is lost is specifically relational: on\n\nthose same spatial-configuration\
    \ items, an explicit spatial description recovers\n\n15.4 points over object-only\
    \ text [9.5, 21.5], closing about a third of the\n\n43.3-point gap between object-only\
    \ text and raw pixels. Naming the objects\n\npresent is therefore not enough;\
    \ the arrangement carries the fact, and a writer\n\nthat is told to preserve arrangement\
    \ recovers a substantial part of it—but\n\nonly a part.\n\n### S28 · Temporal\
    \ and prosodic signals show the opposite profile.\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS2.SSS0.Px2)\n\
    \nOrdered sparse frames do not beat shuffled frames on action-ordering items\n\
    \n( -1.5 points [ -7.8 , 4.6]); event/count text matches sparse frames on\n\n\
    repetition and state-transition items ( +1.4 [ -5.2 , 8.0] and +2.7 [ -5.0 ,\n\
    \n10.6]); raw audio beats ASR by only 0.8 [ -1.5 , 3.0]; and a gold\n\nprosody\
    \ tag adds only 1.5 [ -0.8 , 3.8] (394/450 ties). Under gold delivery\n\nthese\
    \ are ceilings on acoustic recovery once the transcript is in hand,\n\nnot evidence\
    \ that the gap is decorative. On the same 399 items, Native-MM substantially outperforms\
    \ Caption-Text\n\nend-to-end (Appendix K.10), a write/retrieve exposure\n\nthat\
    \ gold delivery factors out. Video\n\nstrata remain small ( n{=}56 – 64 unique\
    \ QIDs); at 80% power the MDEs are\n\n8.9 – 11.2 points (Appendix F), so the nonsignificant\
    \ video\n\ncontrasts do not establish lossless temporal compression.\n\nOver 399\
    \ unique prosody QIDs, replacing the correct gold prosody tag with its\n\nopposite\
    \ reduced score by 4.6 points [1.7, 7.7; W/T/L 46/330/23]\n\n(Appendix K.4, Figure\
    \ 5): the\n\nannotated selector is causally load-bearing under gold delivery,\
    \ even though\n\nraw audio versus ASR remains inconclusive.\n\n### S29 · 6.3 Fixed-Reader\
    \ Comparison (RQ2)\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS3)\n\nBackend\
    \ / representation\n\nChain R@ k\n\nScore\n\nFlat RAG, caption text\n\n0.698\n\
    \n0.522\n\nFlat RAG, omni text\n\n0.705\n\n0.500\n\nFlat RAG, native multimodal\n\
    \n0.466\n\n0.641\n\nA-MEM, caption text\n\n0.787\n\n0.684\n\nA-MEM, omni text\n\
    \n0.702\n\n0.664\n\nMemoryOS, caption text\n\nn/o\n\n0.268\n\nMemoryOS, omni text\n\
    \nn/o\n\n0.279\n\nTable 4: Track A under the fixed Gemini 3.5 reader on 784 answerable\
    \ QIDs.\n\nChain R@ k denotes complete-chain delivery; MemoryOS coverage is unobservable.\n\
    \nPaired effects: Appendix K.5.\n\nWith the reader fixed (Table 4), A-MEM beats\
    \ same-representation\n\nflat RAG by 16.2 points on caption text [13.1, 19.3;\
    \ W/T/L 233/464/87] and by\n\n16.4 on omni text [13.2, 19.4]; A-MEM caption (0.684)\
    \ also outscores flat RAG\n\nover native multimodal evidence (0.641). Chain coverage\
    \ explains why:\n\nA-MEM delivers the complete required chain on 0.787 of items\
    \ vs. 0.698 (flat\n\ncaption) and only 0.466 (native index), whose media caps\
    \ evict chain members.\n\nMemoryOS lags at 0.268/0.279 (25.5 / 22.1 points behind\
    \ flat RAG), consistent\n\nwith Track B over-abstention.\n\nMemory organization\
    \ therefore helps when it improves complete-chain\n\ndelivery under a fixed reader\
    \ and budget; a native index can still lose if\n\npacking drops required media\
    \ before the reader sees them. Backends that keep\n\nevery required hop in the\
    \ request win even with a text-only store; native\n\nperception cannot rescue\
    \ a truncated chain. All 9,338 retrieved-but-dropped\n\nartefacts hit the media-count\
    \ cap (Appendix K.9).\n\n### S30 · 6.4 End-to-End Systems & Abstention (RQ4)\n\
    \n[原文定位](https://arxiv.org/html/2610.29249v1#S6.SS4)\n\nFigure 6: Answering versus\
    \ abstention for all twelve Track B systems. Marker\n\narea is proportional to\
    \ the false-refusal rate. The shaded upper region is\n\nunoccupied. Full scores:\
    \ Appendix K.6,\n\nTable 28.\n\nFigure 6 exposes a sharp answer–abstention trade-off.\n\
    \nNative ReAct with MiMo-V2.5 leads on answerable items (0.732) but correctly\n\
    \nrefuses only 0.410, whereas MemoryOS exceeds 0.88 correct refusal while scoring\n\
    \nbelow 0.26 on answerable items and falsely refusing over 0.61. A-MEM caption\n\
    \ntext is the closest to balanced, but no system occupies the upper-right.\n\n\
    Because refusal controls retain question-form cues\n\n(Appendix H), RQ4 diagnoses\
    \ abstention under this\n\ncontrol set rather than form-blind calibration.\n\n\
    ### S31 · 7 Conclusion\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S7)\n\nMOSAIC\
    \ separates omni-modal memory failures into write,\n\nretrieve, deliver, and read.\
    \ Under the matched\n\nprotocol and fixed reader, reading accounts for the largest\
    \ residual loss\n\nunder gold facts; retrieval and delivery constrain native pipelines,\
    \ textualization text-derived ones. These are protocol associations, not universal\
    \ bottlenecks. Spatial structure has the\n\nclearest causal validation and no\
    \ adequate text surrogate; annotated prosody\n\ntags show selector-level sensitivity,\
    \ while temporal and raw-audio versus ASR\n\ncontrasts remain inconclusive. No\
    \ system both answers and refuses reliably:\n\nprogress requires preserving modality-specific\
    \ signal, delivering complete\n\nchains, and reading them faithfully.\n\n### S32\
    \ · 8 Limitations\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S8)\n\nMOSAIC’s\
    \ personas, evidence sessions, and media are synthetic; evaluation on\n\norganically\
    \ collected multimodal histories remains future work. The primary\n\nreader is\
    \ held out from filtering, and stage contrasts are paired, but stage\n\nlabels\
    \ are matched-protocol associations rather than fully isolated mechanisms.\n\n\
    Video nulls are underpowered (Appendix F). The raw-audio versus\n\nASR gap is\
    \ inconclusive for this reader, and textualized audio carriers often\n\nretain\
    \ paralinguistic lexical cues while other gold hops already expose the\n\nanswer\
    \ value—so gold-delivery audio nulls do not establish acoustic recovery\n\n(Appendix\
    \ G). Swapped gold prosody tags\n\nnonetheless show selector-level sensitivity\n\
    \n(Appendix K.4). RQ4 uses length-matched refusal\n\ncontrols with residual form\
    \ cues (Appendix H).\n\nFurther caveats on modality coverage and backend scope\
    \ are in\n\nAppendix G.\n\n### S33 · 9 Ethical Considerations\n\n[原文定位](https://arxiv.org/html/2610.29249v1#S9)\n\
    \nPersonas, evidence sessions, and all media artefacts in MOSAIC are synthetic;\
    \ we\n\nrelease no private user logs collected by the authors. Filler dialogue\n\
    \ntext is sampled from LongMemEval’s public filler-session pool\n\n(Appendix B.6):\
    \ UltraChat under MIT and ShareGPT under Apache 2.0\n\nas stated by LongMemEval;\
    \ multimodal attachments on those fillers are synthetic\n\ninjections from our\
    \ pipeline. Stage-localized evaluation is intended as a\n\nconstructive tool:\
    \ deployers can see where evidence was dropped rather\n\nthan only that a system\
    \ scored poorly. The human audit used short voluntary\n\nacademic annotation (Appendix\
    \ I). Real deployments of\n\nomni-modal memory should of course obtain user consent\
    \ and provide retention\n\ncontrols, concerns outside the scope of this benchmark\
    \ release. AI assistants\n\naided coding and drafting.\n\n### S34 · References\n\
