    \ question-form cues remain; calibration\n\nshould not be read as fully form-blind,\
    \ and matched multi-hop refusal controls\n\nare future work.\n\n### S68 · I.1\
    \ Annotation Protocol\n\n[原文定位](https://arxiv.org/html/2610.29249v1#A9.SS1)\n\n\
    Three annotators independently reviewed a stratified sample of 100 items (70 where\
    \ the omni probe verdict was NO, 30 where it was YES). Annotators were shown the\
    \ question, expected answer, all required evidence facts (with modality and gap\
    \ strategy), and the omni probe’s verdict. For each item, they answered:\n\n1.\n\
    \nWell-posed? Is the question unambiguous and answerable as stated? (Yes / Partially\
    \ / No)\n\n2.\n\nGold answer correct? Is the expected answer factually correct\
    \ given the evidence? (Yes / No)\n\n3.\n\nEvidence sufficient? Are all required\
    \ artefacts legible/audible and do they show the answer? (Yes / No)\n\n4.\n\n\
    Failure mode: If insufficient, what is the primary failure? (Evidence item invalid\
    \ / Model refused incorrectly / Model attended to wrong modality / Model overlooked\
    \ gap-bearing detail / Judge format mismatch / No need to answer)\n\nA follow-up\
    \ audit then graded 100 additional probe-YES items drawn from the 740 automated\
    \ answerable releases (seed 20260801; excluding the 30 YES items already in the\
    \ first sample), using the same Q1–Q3 rubric with two annotators.\n\n### S69 ·\
