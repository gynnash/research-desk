    \n## 抽取正文\n\n### S1 · MOSAIC: An Omni-Modal Benchmark for Long-Term Memory and\
    \ Cross-Modal Reasoning in Conversational Agents\n\n[原文定位](https://arxiv.org/html/2610.29249v1)\n\
    \nHong Ting Tsang\n\nBoyi Zhang\n\nHaoyu Huang\n\nJiaxin Bai\n\nYufei Li\n\nYisen\
    \ Gao\n\nZhongwei Xie\n\nHongyu Luo\n\nJeff Z. Pan\n\nAffiliation: The Hong Kong\
