    The memory methods answer one question at a time with Mem0’s 2025 answer template;
    Mem0 is OSS 2.1.0 and Zep is Graphiti OSS 0.30.2, both with default extraction
    and retrieval [1, 2]. The agents, Pi 1.1.0, Codex 0.159.2 and Claude Code 2.1.295
    [3, 4, 5], start a fresh session in a fresh container for each question, with
    the conversation as one file, their default tools, and the template’s answer rules
    in the prompt (Appendix C).


    The models go from weak to strongest: GPT-4o-mini, GPT-6 Luna, Claude Opus 5.5.
    The last two run at reasoning effort high, the effort coding agents are usually
    run at [10]; GPT-4o-mini has no effort setting. In each cell one model writes
    the store (Mem0, Zep) and answers every question, or drives the agent.


    ### S5 · Photos.


    [原文定位](https://arxiv.org/html/2610.29823v1#S2.SS0.SSS0.Px1)


    Some LoCoMo turns share a photo, and the official file holds a caption of it next
    to the turn text. The agents get the official file, captions included; the memory
    methods were given the turn text only. 116 of the 419 turns share a photo, and
    64 of the 152 questions have evidence in such a turn. Section 5 measures what
    this changes.


    ### S6 · Measurement.


    [原文定位](https://arxiv.org/html/2610.29823v1#S2.SS0.SSS0.Px2)


    A rollout is one run over the conversation: the build, then the 152 questions.
    GPT-4o-mini grades every answer with Mem0’s 2025 judge rubric [1]; empty answers
    count as wrong. Cost is the list price of every model call, LLM and embedding
    (text-embedding-3-small), with the judge excluded. A turn is one LLM call: one
    per question for the memory methods, one per step of an agent’s loop, and Mem0’s
    and Zep’s calls to build their store. Tokens are those calls’ input and output
    tokens, cached input included; embeddings are not counted. Each cell runs once.


    ### S7 · 3 Agent memory is a costly patch for a weak model


    [原文定位](https://arxiv.org/html/2610.29823v1#S3)


    With GPT-4o-mini, Mem0 scores highest. It scores 78%, against 74% for both full
    context and BM25; Zep scores 43%. The agents score 63% (Pi), 28% (Codex) and 29%
    (Claude Code): Codex opens the conversation file for three questions in four and
    Claude Code almost never, and otherwise they answer from the question alone.


    With the two stronger models, the patch stops helping. With GPT-6 Luna, full context
    scores 92%, BM25 82%, Mem0 80% and Zep 51%; Zep’s graph holds 128 facts from the
    19 sessions, against 195 with Claude Opus 5.5. With Claude Opus 5.5, Mem0 and
    full context both score 95% and Zep 87%, and the agents score highest: Pi 99%,
    Codex 98% and Claude Code 97%, a lead that comes mostly from questions about photos
    (Section 5). Earlier work also finds that plain retrieval keeps up with elaborate
    memory [11] and that rankings between memory systems change with the model [12].


    Figure 2: Cumulative cost–correct curves. Each curve is one rollout: the build,
    then the questions from cheapest to most expensive (equal costs grouped), adding
    up cost and correct answers; correct answers are divided by 152, so a wrong answer
    adds cost only. Colour is the model, the badge the method, and agents are dotted.
    The cost axis is linear to $2 and logarithmic above. Curves use a nine-point moving
    average, and the badges mark the unsmoothed totals of Table 2. Strong lines are
    cells that no other cell beats on both cost and correct answers.


    The patch is not free. Mem0’s build alone costs more than full context’s whole
    rollout with the same model: $0.56 against $0.43 with GPT-4o-mini, $0.45 against
    $0.29 with GPT-6 Luna and $25.88 against $17.84 with Claude Opus 5.5 (Figure 2).
    Its questions are cheaper, so the build would pay for itself after 372, 545 and
    596 questions on the same history; LoCoMo asks 152. Mem0 and Zep are never on
    the frontier of Figure 1, which runs through BM25 and full context with GPT-6
    Luna and Pi with Claude Opus 5.5. Paying to build memory that a stronger model
    does not need is a memory tax.


    ### S8 · 4 Agent memory has a ceiling


    [原文定位](https://arxiv.org/html/2610.29823v1#S4)


    The model that writes the store limits every reader. Mem0 and Zep write their
    store with the same model that later reads it. Retrieval calls no language model,
    so the reader can be swapped: each model answers from the retrievals of the others’
    stores (Figure 3, Table 3).


    Figure 3: Writer and reader. Each colour is one store, written by that model.
    The filled badge is the writer reading its own store, and arrows run from it to
    the other two readers.


    A stronger reader does not recover what the writer left out. On Zep’s GPT-4o-mini
    graph, GPT-4o-mini, GPT-6 Luna and Claude Opus 5.5 score 43%, 43% and 45%; on
    the graph Claude Opus 5.5 wrote, 66%, 71% and 87%. Mem0 keeps the order with smaller
    gaps: 78%, 83% and 84% from GPT-4o-mini’s store, 89%, 91% and 95% from Claude
    Opus 5.5’s. This agrees with work where verbatim chunks beat extracted facts on
    long conversations [13].


    ### S9 · 5 With Claude Opus 5.5, Pi tops the frontier


    [原文定位](https://arxiv.org/html/2610.29823v1#S5)


    Pi with Claude Opus 5.5 is the top of the frontier in Figure 1. No other cell
    scores higher: Pi scores 99% for $6.95 a rollout, while full context with the
    same model scores 95% for $17.84. Pi reads about 10,000 input tokens a question,
    7,900 of them cached, against 28,900 for full context. Codex and Claude Code score
    98% and 97% for $25.41 and $28.41; HarnessTax explains why the same model costs
    so differently across harnesses [10].


    Its one miss is LoCoMo’s mistake. The question asks what kind of painting Caroline
    shared with Melanie on 13 October 2023, and the answer key says an abstract painting
    with blue streaks. In the conversation it is Melanie who shares that painting;
    Caroline shares a drawing. Pi says so and is marked wrong: “Caroline shared a
    drawing, not a painting. … The paintings shared that day (a sunset and an abstract
    piece) were Melanie’s.” With Claude Opus 5.5, full context, Codex and Claude Code
    point out the same mistake and are marked wrong too. On the other 151 questions,
    Pi with Claude Opus 5.5 is always right.


    Photo captions account for most of Pi’s lead over full context. With Claude Opus
    5.5, Pi answers seven questions that full context misses and misses none that
    it answers. Six of the seven have their evidence in a turn that shares a photo,
    whose caption Pi could read and full context could not (Section 2); so do all
    six such questions for Codex and all four for Claude Code. On the 88 questions
    without photo evidence, Pi scores 100%, and full context, Mem0, Codex and Claude
    Code 99% each (Table 4). With the same input, then, Pi matches full context for
    less than half its cost. Whether searching the record answers more than reading
    all of it, this study does not settle.


    ### S10 · 6 Discussion and limitations


    [原文定位](https://arxiv.org/html/2610.29823v1#S6)


    Our results suggest that agent memory is a costly patch for a weak model and caps
    what any reader can answer. On this LoCoMo conversation, Mem0 helps GPT-4o-mini
    but not GPT-6 Luna or Claude Opus 5.5, a stronger reader does not recover what
    the writer left out, and with Claude Opus 5.5 Pi answers every sound question
    for less than full context costs.


    The findings rest on a small study, and these limits apply:


    •


    Scale. One conversation of LoCoMo’s ten, and one run per cell. Differences of
    a few questions may not hold in a second run.


    •


    Grading. A GPT-4o-mini judge with a lenient rubric, and at least one wrong answer
    key.


    •


    Photo captions. The agents could read photo captions that the memory methods were
    not given (Section 5). This touches comparisons between agents and memory methods,
    not those among the memory methods.


    •


    Context length. The history fits in every model’s context window, so full context
    is always an option. Results may differ on other benchmarks such as LongMemEval
    [14] and on histories that do not fit.


    •


    Settings and prices. Mem0 and Zep run with their default extraction and retrieval,
    and other settings may do better. Costs are list prices and depend on each provider’s
    caching.


    Memory systems and harnesses can also be searched for automatically [15, 16],
    but what is found is still fixed before the question arrives. More broadly, a
    strong model may need less designed memory and better tools: exact, semantic and
    vector search over the raw record, driven by the model itself [3, 4]. Progress
    may then look less like another memory system and more like ripgrep after grep
    [17], or zvec-grep after ripgrep [18]. Designed memory may survive as a cost trade-off
    when many questions share one history (Figure 2).


