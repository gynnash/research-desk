    ### S1 · MemoryTax: The Bitter Lesson of Agent Memory


    [原文定位](https://arxiv.org/html/2610.29823v1)


    Zedong Peng


    Affiliation: Shanghai Jiao Tong University


    Email: zedongpeng1@gmail.com


    ### S2 · Abstract


    [原文定位](https://arxiv.org/html/2610.29823v1#abstract1)


    Agent memory systems such as Mem0 and Zep decide what to keep before any question
    arrives; coding agents keep the raw history and let the model search it with its
    own tools. We ask whether designed memory still helps once the model is strong
    enough to search for itself. On one LoCoMo conversation (419 turns, 152 questions),
    we run four memory methods (full context, BM25, Mem0, Zep) and three coding agents
    (Pi, Codex, Claude Code), each with GPT-4o-mini, GPT-6 Luna and Claude Opus 5.5,
    and record what every rollout costs. This is a short empirical study, with one
    conversation and one run per cell. Agent memory is a costly patch for a weak model:
    Mem0 beats full context only with GPT-4o-mini, and its build alone costs more
    than a whole full-context rollout. Agent memory also has a ceiling, set by the
    model that writes it: a stronger reader does not recover what a weaker writer
    left out. With Claude Opus 5.5, Pi tops the cost–accuracy frontier, scoring 99%
    for less than half the cost of full context; its one miss is a wrong answer key.
    Part of that lead comes from photo captions that only the agents could read: on
    the 88 questions whose evidence has no photo, Pi and full context differ by one
    answer.


    Interactive version: zedongpeng.com/memorytax


    ### S3 · 1 Introduction


    [原文定位](https://arxiv.org/html/2610.29823v1#S1)


    Agent memory systems such as Mem0 and Zep decide what to keep before any question
    arrives: the model extracts facts or builds a graph from the conversation, and
    each question sees a few retrieved pieces [1, 2]. Coding agents and recursive
    language models keep the raw history instead and let the model search it with
    its own tools [3, 4, 5, 6].


    The bitter lesson is that knowledge built into a system helps at first, then plateaus,
    while general methods that scale with computation win [7]. Agent memory builds
    in what to keep. Does it still help once the model is strong enough to search
    for itself?


    We run four memory methods (full context, BM25 [8], Mem0 and Zep) and three coding
    agents (Pi, Codex and Claude Code), each with GPT-4o-mini, GPT-6 Luna and Claude
    Opus 5.5, on a conversation from LoCoMo [9], and measure what each run costs.
    We find:


    •


    Agent memory is a costly patch for a weak model. Mem0 beats full context only
    with GPT-4o-mini, and its build alone costs more than full context’s whole run
    (Section 3).


    •


    Agent memory has a ceiling, set by the model that writes it. A stronger reader
    does not recover what a weaker writer left out (Section 4).


    •


    With Claude Opus 5.5, Pi tops the cost–accuracy frontier (Figure 1). It answers
    every question whose answer key is sound, for less than half what full context
    costs. Where the two read the same text they differ by one answer; the rest of
    Pi’s lead comes from photo captions that only the agents could read (Section 5).


    The study is small: one conversation, one run per cell, and a GPT-4o-mini judge.
    Section 6 lists what it cannot show. Within those limits, the results suggest
    that a strong model needs less designed memory and better tools for searching
    the raw record.


    Figure 1: Cost and correct rate per rollout. Each badge is one cell’s whole run:
    the build, then all 152 questions. Colour is the model, the badge the method’s
    mark, and a letter in the badge marks a method without one (F full context, B
    BM25). The stepped line is the highest correct rate reached at or below each cost,
    and the labelled cells lie on it. Cost is on a log axis.


    ### S4 · 2 Setup


    [原文定位](https://arxiv.org/html/2610.29823v1#S2)


    We run 21 cells, seven methods with three models each, on LoCoMo conv-26 [9]:
    419 turns in 19 sessions and 152 single-hop, multi-hop, temporal and open-domain
    questions. LoCoMo’s adversarial questions are left out, as in Mem0’s evaluation
    [1]. The history fits every model’s context window. Among the ten LoCoMo conversations,
    conv-26’s per-method accuracies track those of the full set closely. Table 1 lists
    the methods.


    Table 1: Methods: what each stores and what the model sees when it answers.


    Method


    Stored


    Model sees


    Full context


    raw history


    all of it


    BM25


    raw turns


    top-8 turns, \pm 2


    Mem0


    extracted facts


    top-200 facts


    Zep


    temporal graph


    top-20 edges


    Pi, Codex, Claude Code


    raw history, one JSON file


