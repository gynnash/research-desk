  reports/agent-memory/agent-memory-20261027-0300-research-paper-bc0d7d05-0ed7-4d63-8a1b-f8552566bf17.md: "---\n\
    schema_version: 1\nid: research-agent-memory-20261027-0300-paper-bc0d7d05-0ed7-4d63-8a1b-f8552566bf17\n\
