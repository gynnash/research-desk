    # 记忆筛选与记忆组织：Agent究竟该留下什么？


    **待用户确认选题、角度与受众；未授权或启动 Writing，不是文章大纲或草稿。**


    - 写作角度：以R1摘要中的任务时记忆子集选择为切入点，与H2历史笔记记录的记忆块组织概念并置；明确两者不是直接效果对照，且历史材料须重新核实。

    - 目标读者：关注Agent架构与长期记忆评测的开发者和研究者

