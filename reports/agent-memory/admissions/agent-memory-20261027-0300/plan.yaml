    topics:\n- agent-memory\n---\n\n> AI 自动研究记录，已通过独立模型审阅；阅读范围及证据限制见正文，未复现实验。\n\n\
    # Agent记忆：选择、持续学习与上下文管理的证据边界\n\nR1、R2仅依据论文摘要，R3仅依据博客节选；H1—H6为未经本轮独立复核的人工历史基线，不能视为新核验事实。来源关联不构成独立验证，材料不足以支持行业趋势、因果结论或普遍性能排名。\n\
    \n## 综合摘要\n\n这批材料涉及按决策筛选记忆、长时程持续学习评测，以及卸载和摘要等上下文管理机制。它们呈现的是不同研究问题和工程描述，不能据此比较系统总体性能或断言某种记忆方案普遍有效。历史笔记可提供待核对的架构线索，但其主张未经本轮复核。\n\
    \n## 比较与证据\n\n- **作者声称，未独立复现**：R1摘要介绍交互感知的记忆子集选择，并报告其基准结果；这些数值是作者报告，尚未核验全文或独立复现。（[R1](agent-memory-20261027-0300-research-paper-e7352648-9e8c-4262-b10b-9681bf24ee23.md)）\n\
    - **作者声称，未独立复现**：R2摘要介绍开放式文本游戏评测，并报告短期记忆有益而监督微调智能体仍可能灾难性遗忘；适用范围限于摘要所述研究与测试。（[R2](agent-memory-20261027-0300-research-paper-bc0d7d05-0ed7-4d63-8a1b-f8552566bf17.md)）\n\
    - **作者声称，未独立复现**：R3节选描述文件卸载、摘要等上下文管理机制；历史H1记录了相近内容，但二者对应同一博客来源，不能当作独立验证或效果证据。（[R3](agent-memory-20261027-0300-update-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H1](../../sources/blogs/agent-memory/blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)）\n\
    - **我们的推断**：R1讨论任务决策时保留行为所需的记忆子集，H2历史笔记则描述带用途和容量约束的记忆块；两者可启发区分选择与组织问题，但历史笔记未经本轮复核，不能据此判断实际效果。（[R1](agent-memory-20261027-0300-research-paper-e7352648-9e8c-4262-b10b-9681bf24ee23.md)、[H2](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    - **我们的推断**：R2强调长时程交互中的探索、记忆和规划评测，H4历史笔记记录分层存储与检索架构；这提示可研究评测与架构如何对应，但不构成跨研究性能比较。（[R2](agent-memory-20261027-0300-research-paper-bc0d7d05-0ed7-4d63-8a1b-f8552566bf17.md)、[H4](../../sources/papers/paper-4eb3be4b-7189-49aa-bafd-f88f77a972f4.md)）\n\
    \n## 局限\n\n- R1、R2只有摘要，未核验全文、实验设计、统计分析或实现。\n- R3只有博客节选；机制、阈值及效果未独立验证。\n- H1—H6均为历史基线，相关主张未经本轮独立复核；H1与R3来源相同。\n\
    - 不同材料的任务、系统和评测设置不统一，不能据此作性能排名或因果判断。\n\n## 待验证问题\n\n- 记忆子集选择在不同模型、接口和任务条件下能否保持行为充分性？\n\
    - 长时程任务中，记忆检索、摘要与参数更新各自如何影响遗忘和任务表现？\n- 记忆写入、更新和删除如何记录依据、处理冲突并保护隐私？\n\n## 输入与来源\n\
    \n- [H1](../../sources/blogs/agent-memory/blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)：human_baseline；来源\
