    research_summary: 仅依据论文摘要，AgentOdyssey面向测试时持续学习智能体，提出程序化生成开放式文本游戏的评测框架，并报告了智能体能力与测试时训练方面的实验观察；以下不代表对全文或实验的独立核验。
    research_claims:
    - kind: fact
      text: 摘要介绍 AgentOdyssey：一个程序化生成开放式文本游戏的评测框架，游戏包含丰富实体、世界动态和长程任务。
      evidence_ids:
      - A2
    - kind: fact
      text: 摘要称其评测方法除游戏进度外，还涵盖世界知识获取、情景记忆、物体与动作探索、动作多样性及模型成本。
      evidence_ids:
      - A4
    - kind: author_claim
      text: 作者称，他们在六款生成的游戏中评估了多种智能体范式，并观察到智能体关键能力的局限及影响其有效规划时域的因素。
      evidence_ids:
      - A5
      - A6
    - kind: author_claim
      text: 作者称，测试时训练的专项研究发现短期记忆有益，但经监督微调训练的智能体仍会发生灾难性遗忘；有效的参数化持续学习仍是未解决的问题。
      evidence_ids:
      - A8
    research_limitations:
    - 本次只读论文摘要，未核验全文、实验细节、实现或结果；作者报告的发现不应视为独立验证。
    - 材料对记忆的讨论限于摘要中有关情景记忆、短期记忆与灾难性遗忘的概述，未提供记忆机制的详细描述。
