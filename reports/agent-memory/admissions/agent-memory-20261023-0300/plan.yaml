  coverage_note: R1、R2仅覆盖论文摘要；H1、H2为未经本次独立原文复核的历史人工笔记。历史笔记中的转述不能视为本次核验事实；来源有关联不构成独立验证，现有材料不足以推断行业趋势、因果关系或跨方法性能排名。
  report:
    title: 智能体记忆：检索、证据组织与容量约束
    summary: R1摘要描述视频编辑中的有界特征缓存、相似性检索传播和多样性更新；R2摘要提出面向长期对话记忆的查询条件证据编译。H1、H2的历史笔记分别记录上下文管理和记忆块的工程描述。它们可用于提出记忆选择与组织的研究问题，但R1并非通用智能体记忆研究，R2结果仅为作者报告，历史笔记也未经本次复核，不能据此确认效果或进行性能比较。
    comparisons:
    - text: R1摘要描述在固定预算下缓存前序帧特征、按相似性检索并依据特征多样性更新；该设计属于视频编辑场景，不能直接证明其适用于智能体长期记忆。
      kind: fact
      evidence_ids:
      - R1
    - text: R2摘要描述先定位支持材料、再在有限预算内选择互补证据并组织回答上下文；其报告的 LoCoMo 结果未在本次材料中独立核验。
      kind: author_claim
      evidence_ids:
      - R2
    - text: H1历史笔记转述了文件卸载、摘要和按需加载等上下文管理机制；这些描述未经本次原文复核，不能据此确认其当前适用性或效果。
      kind: author_claim
      evidence_ids:
      - H1
    - text: H2历史笔记记录了以用途、容量等组织记忆块的工程视角；与R2的查询条件证据编译并置，可形成“持久组织”与“任务时组装”的研究问题，但不能据此认定两者互补或孰优孰劣。
      kind: inference
      evidence_ids:
      - R2
      - H2
    - text: R1讨论视频帧特征传播，R2讨论长期对话中的回答证据编译；任务与对象不同，现有材料不支持跨领域性能排名。
      kind: inference
      evidence_ids:
      - R1
      - R2
    limitations:
    - R1、R2均仅有摘要，缺少可供本次复核的全文、完整实验设置和独立复现；R2摘要未提供成本指标定义及统计不确定性。
    - R1研究视频编辑特征缓存，不直接研究通用智能体的工作记忆或长期记忆。
    - H1、H2为历史笔记，未经本次独立原文复核；其中转述的主张不能升格为本次核验事实。
    - 材料没有统一任务或评测条件，不支持因果结论、行业趋势或方法排名。
    open_questions:
    - 查询条件证据编译在不同长期对话任务及独立复现中是否仍有收益？
    - 记忆预算受限时，如何评估证据的互补性、冗余程度和回答所需的完整性？
    - 持久记忆块、文件卸载或摘要与查询时证据编译如何组合，是否会导致信息丢失或冲突？
  insights:
  - title: 检索命中之后，证据如何变成可回答上下文？
    hypothesis: 待验证研究假设：对长期记忆检索结果增加面向查询的证据选择与组织步骤，可能比直接呈现检索单元更能控制冗余并保留回答所需支持。R2摘要提出此类编译框架，H1历史笔记记录了卸载和摘要等上下文管理思路；现有材料不能证明该假设成立。
    evidence_ids:
    - R2
    - H1
    counterpoints:
    - 编译过程也可能遗漏必要证据，或增加延迟与成本。
    - H1是未经本次复核的历史笔记，不能作为机制有效的验证。
    - R2的实验结果与泛化表述仅为摘要中的作者报告。
    limitations:
    - R2仅有摘要，缺少足以独立核查的实验设置、成本口径和统计不确定性。
    - H1仅为历史笔记；两份材料来自不同原始来源，不构成相互验证。
    validation:
    - 在同一长期对话任务与模型上，比较直接呈现检索结果和查询条件证据编译，并预先固定上下文预算。
    - 由盲评者评估答案正确性、支持证据完整性和无关信息比例，同时记录延迟与token成本。
    - 在多个数据集及独立随机种子下重复实验，公开评估口径和失败案例。
  - title: 容量受限时，记忆选择与更新规则值得独立评测
    hypothesis: 待验证研究假设：容量受限的记忆若结合查询相关性与冗余控制，可能在预算内保留更多有用信息。R1描述视频特征多样性更新，H2历史笔记描述有容量约束的记忆块；这些材料不能证明策略可迁移至智能体记忆或能提升实际效果。
    evidence_ids:
    - R1
    - H2
    counterpoints:
    - 视频特征的多样性不等同于对话事实的价值、时效性或可信度。
    - 固定容量和去冗余可能丢弃低频但关键的信息；容量限制本身也不保证记忆质量。
    - H2是未经本次复核的历史项目方博客笔记，不构成性能证据。
    limitations:
    - R1是视频编辑摘要，不是智能体记忆实验；H2是历史笔记。
    - 当前材料没有针对记忆写入、遗忘、冲突更新及长期正确性的共同评测。
    validation:
    - 在长期对话任务中比较不同容量、相关性选择与冗余控制策略，并保持检索和回答组件一致。
    - 分别测量重要信息保留、过时或冲突记忆处理、最终回答正确性及存储成本。
    - 使用跨会话、跨任务测试及人工核验的事实来源标签，检查稳定性并识别误删风险。
  topics:
  - title: 记忆检索命中之后：为什么还需要证据编译？
    angle: 以R2摘要中的寻址与证据编译设计为切入点，与H1历史笔记转述的上下文卸载、摘要机制并置，讨论可检验的问题；不把作者报告写成已独立验证的效果。
    audience: 关注长期对话记忆、检索增强生成与上下文工程的产品和研究人员
    why_now: 本批资料包含一篇提出查询条件证据编译的论文摘要及一份历史上下文管理笔记，适合讨论检索结果如何转成可回答上下文；这不代表议题热度上升。
    insight_indices:
    - 0
    evidence_ids:
    - R2
    - H1
    key_questions:
    - 检索命中直接交给回答模块时，冗余或缺漏如何评估？
    - 证据编译是否改善回答支持度，代价如何衡量？
    evidence_gaps:
    - 核验R2全文、实验基线、成本定义与统计不确定性。
    - 核验H1所据原文及其所述机制当前是否适用。
    - 需要独立复现和可比评测，不能仅凭摘要与历史笔记下结论。
  - title: 容量有限时，智能体应如何挑选和更新记忆？
    angle: 从R1的视频特征多样性更新和H2历史笔记中的容量约束记忆块提出跨领域研究问题，明确区分设计线索与已验证的智能体记忆效果。
    audience: 研究智能体记忆写入、长期信息维护与可靠性评测的读者
    why_now: 当前资料同时涉及有界缓存更新和有容量约束的记忆组织，可用于界定后续实验问题；材料没有证据表明这已成为行业趋势。
    insight_indices:
    - 1
    evidence_ids:
    - R1
    - H2
    key_questions:
    - 对话记忆中的多样性应如何定义，是否能代表信息价值？
    - 容量约束与冗余控制会不会删除低频但重要的信息？
    - 如何评估记忆更新对长期正确性的影响？
    evidence_gaps:
    - R1不研究通用智能体记忆，不能直接迁移其更新策略。
    - H2是未经本次独立复核的历史笔记，需核验原文。
    - 缺少统一任务下关于容量、保留、遗忘与答案正确性的对照实验。
