    metadata:
      title: 'From Memory Hits to Answerable Evidence: Query-Conditioned Memory Compilation
        for Long-Term Agent Memory'
      source: arXiv
      source_url: https://arxiv.org/abs/2610.23313
      authors:
      - Li, Shangze
      - Yao, Yanyu
      - Xu, Derong
      - Zheng, Zhi
      - Xu, Tong
      published_at: '2026-10-16'
      arxiv_id: '2610.23313'
      source_version: v1
    research_summary: 本文摘要提出面向长期对话记忆的查询条件证据编译框架 MemCompile；以下仅概述所提供的摘要，不代表对论文全文或实验的独立核验。
    research_claims:
    - kind: author_claim
      text: 作者认为，长期智能体记忆需要从分散于多轮对话和多个会话的内容中恢复与回答相关的证据。
      evidence_ids:
      - A1
    - kind: author_claim
      text: 作者指出，现有系统可能将检索或扩展后的记忆单元直接交给回答模块，导致最终上下文冗余或不完整。
      evidence_ids:
      - A2
    - kind: author_claim
      text: MemCompile 将处理分为寻址与证据编译：寻址平面定位支持材料并将不同检索命中映射到稳定的 SourcePacket 身份；证据平面则在有限预算内选择互补材料并组织成面向回答的上下文。
      evidence_ids:
      - A3
      - A4
      - A5
    - kind: author_claim
      text: 摘要报告，MemCompile 在 LoCoMo 上取得 80.52% 的 Judge Accuracy，并称其将经验质量—成本帕累托前沿扩展至更高质量区域。
      evidence_ids:
      - A6
    - kind: author_claim
      text: 作者称其在 LongMemEval-S 上的表现进一步显示，查询条件编译的收益可推广至其他长期对话记忆基准。
      evidence_ids:
      - A7
    research_limitations:
    - 本次材料仅为论文摘要，未核验全文、实验设置、实现细节或结果。
    - 摘要未提供评测对照、成本指标定义、统计不确定性或 LongMemEval-S 的具体结果，无法据此独立判断比较幅度或推广范围。
