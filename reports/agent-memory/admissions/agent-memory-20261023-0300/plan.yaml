    # Edit-Your-Interest: Efficient Video Editing via Feature Most-Similar Propagation


    > AI 自动研究记录，已通过独立模型审阅；阅读范围及证据限制见正文，未复现实验。


    - 来源：[Edit-Your-Interest: Efficient Video Editing via Feature Most-Similar Propagation](https://arxiv.org/abs/2510.13084v2)。

    - 覆盖范围：仅论文摘要，未核验全文或实验数据。

    - 研究模型：`gpt-6-luna`；独立审阅：`gpt-6.1-sol`。

    - 审阅：`pass`；修订次数：0；原始材料仅在内存中提供给模型。


    ## 研究概述


    仅依据论文摘要，概述 Edit-Your-Interest 在视频编辑中使用有界特征记忆与相似性检索传播的设计；材料涉及记忆缓存、检索和更新，但不直接研究通用智能体记忆。


    ## 主张与证据


    - **原文事实**：摘要称，时空特征记忆库（SFM）在固定内存预算下缓存前序帧的空间注意力特征。（[A5](https://arxiv.org/abs/2510.13084v2)）

    - **作者声称（未独立核验）**：作者称，SFM维护代表性候选池，以减少对完整序列进行时空建模的计算开销。（[A6](https://arxiv.org/abs/2510.13084v2)）

    - **原文事实**：摘要称，特征最相似传播（FMP）依据相似度检索相关缓存令牌，并将其传播至当前帧；SFM更新算法则依据特征多样性维护记忆的代表性和非冗余性。（[A7、A9](https://arxiv.org/abs/2510.13084v2)）

    - **作者声称（未独立核验）**：作者称，SFM与FMP的设计改善了时间一致性并减少模糊和马赛克状伪影；摘要还称实验中该方法在效率和视觉保真度方面优于当时的先进方法。（[A8、A12](https://arxiv.org/abs/2510.13084v2)）


    ## 局限


    - 本次仅覆盖论文摘要，未核验全文、实验细节、实现或结果。

    - 材料讨论的是视频编辑方法中的特征缓存与检索，不能据此推断其适用于通用智能体的工作记忆或长期记忆。

    - 摘要未提供可用于独立评估记忆更新策略、内存预算大小或比较实验的具体细节。


    ## 独立审阅



    正式来源：[paper-ef2bb506-9872-4221-8434-03dc4c74646a](../../sources/papers/agent-memory/paper-ef2bb506-9872-4221-8434-03dc4c74646a.md)。


    准入记录：[输入、审阅与输出散列](admissions/agent-memory-20261023-0300/accepted.yaml)。

