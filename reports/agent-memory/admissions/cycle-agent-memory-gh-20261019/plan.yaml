    metadata:
      title: 'Hy-Memory-30B-A3B: Attributed Reinforcement Learning for Long-Term Memory
        Writing'
      source: arXiv
      source_url: https://arxiv.org/abs/2610.22196
      authors:
      - Fei, Tianxiang
      - Kang, Jiazheng
      - Zheng, Mao
      - He, Xingyan
      - Yu, Xiang
      published_at: '2026-10-15'
      arxiv_id: '2610.22196'
      source_version: v1
    research_summary: 本次仅依据所提供的论文摘要，概述 Hy-Memory-30B-A3B 的研究动机、训练方法及作者报告的基准结果；不代表对论文完整内容或结果的独立核验。
    research_claims:
    - kind: author_claim
      text: 作者指出，外部记忆系统的质量依赖模型如何写入记忆，包括保留什么、如何表述，以及如何依据新证据更新持久状态；现有框架通常使用由框架专属提示驱动的通用大模型，带来服务成本与协议迁移问题。
      evidence_ids:
      - A1
      - A2
      - A3
    - kind: author_claim
      text: 作者介绍 Hy-Memory-30B-A3B，将其描述为在 Mem0、MemOS 和 Hy-Memory 上训练的紧凑型长期记忆写入模型。
      evidence_ids:
      - A4
    - kind: author_claim
      text: 摘要称，其训练方法包括在学生模型生成的状态上学习框架专属写入协议的 Memory On-Policy Distillation，以及通过分块探测、跨块归因奖励、过度存储控制和
        chunk-level GRPO 优化下游可回答性的 Memory RL；训练中还跨窗口沿用策略写入的记忆库。
      evidence_ids:
      - A5
      - A6
    - kind: author_claim
      text: 作者报告，在固定的 20% 基准子样本上，该模型在四个评测 harness 中均排名第一（包括留出的 EverMemOS），宏平均为 55.49%，Claude
        Opus 5 为 54.62%。
      evidence_ids:
      - A7
    research_limitations:
    - 本次只读论文摘要，未核验全文、实验设计、实现或结果。
    - 基准结论及数值仅为摘要中的作者报告；材料未提供各评测 harness 的细节、样本规模或统计不确定性。
    - 材料不足以判断模型在其他数据、框架或部署条件下的表现。
