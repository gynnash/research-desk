  insights:
  - title: 把持久写入与任务时取用分开检验
    hypothesis: 待验证的研究假设：分别检查信息如何写入持久记忆、如何进入当前任务上下文、以及是否被正确使用，可能有助于定位记忆相关错误；现有材料不能证明这种分阶段检查会提升任务表现。
