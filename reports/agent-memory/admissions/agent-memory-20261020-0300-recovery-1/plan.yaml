    metadata:
      title: 'MemSyco-Bench: Benchmarking Sycophancy in Agent Memory'
      source: arXiv
      source_url: https://arxiv.org/abs/2607.01071
      authors:
      - Xiang, Zhishang
      - Chen, Zerui
      - Tang, Yunbo
      - Wei, Zhimin
      - Ning, Ruqin
      - Lin, Yujie
      - Zhang, Qinggang
      - Su, Jinsong
      published_at: '2026-07-01'
      arxiv_id: '2607.01071'
      source_version: v3
    research_summary: 仅依据论文摘要节选，MemSyco-Bench 关注记忆对智能体后续推理与决策的影响，尤其是记忆诱发的迎合问题；不能据此判断基准的完整设计或实测效果。
    research_claims:
    - kind: author_claim
      text: 作者指出，检索到的记忆可能导致智能体过度迎合用户，从而损害事实准确性或客观推理。
      evidence_ids:
      - A2
    - kind: author_claim
      text: 作者称，现有记忆基准主要评估记忆是否被正确存储、检索或更新，而较少关注记忆如何影响后续推理与决策。
      evidence_ids:
      - A3
    - kind: author_claim
      text: 作者提出 MemSyco-Bench，用于评估智能体系统中的记忆诱发迎合，并考察何时应让记忆影响决策、以及如何使用有效记忆。
      evidence_ids:
      - A4
      - A5
    - kind: fact
      text: 摘要列出五类评测任务：拒绝将记忆当作事实证据、遵守记忆适用范围、处理记忆与客观证据的冲突、跟踪记忆更新，以及使用有效记忆进行个性化。
      evidence_ids:
      - A6
    research_limitations:
    - 本次仅阅读摘要节选，未核验论文全文、基准数据、实验结果或实现。
    - 节选未提供各任务的具体定义、评测方法、结果或局限，不能据此判断基准的有效性或实际表现。
