    research_summary: 本概述仅依据论文摘要，介绍其多模态文件系统记忆架构 MFM 及摘要所报告的任务表现，不代表对完整论文或实验结果的独立核验。
    research_claims:
    - kind: author_claim
      text: 作者提出 MFM，将情景、空间、语义、程序性和工作记忆结合起来，分别用于保存经历、关联地点、积累知识与行动方法，以及维持当前计划。
      evidence_ids:
      - A3
    - kind: author_claim
      text: 作者称，MFM 通过可搜索的文本记录连接不同记忆表示与底层多模态经历，使智能体能按上下文线索查找经历，并查看原始观察以恢复文本描述中缺失的细节。
      evidence_ids:
      - A4
      - A5
    - kind: author_claim
      text: 作者称，MFM 的整合过程能将经历转化为更高层次的知识与程序，同时保留指向原始经历的引用。
      evidence_ids:
      - A6
    - kind: author_claim
      text: 作者报告，使用 GPT-6-Astra 时，MFM 在 Mine Diamond from Scratch 任务中完成目标，在 Ender
        Dragon 任务中达到 24 个里程碑中的 16 个；摘要称最佳基线为 12.7。
      evidence_ids:
      - A8
    - kind: author_claim
      text: 作者报告，MFM 在 CUABench-KiCad 上的平均奖励为 0.440；摘要给出的最佳基线和无持久记忆结果分别为 0.400 和 0.267。
      evidence_ids:
      - A9
