    # Multimodal Filesystem Memory For Long-Horizon Embodied Agents


    > AI 自动研究记录，已通过独立模型审阅；阅读范围及证据限制见正文，未复现实验。


    - 来源：[Multimodal Filesystem Memory For Long-Horizon Embodied Agents](https://arxiv.org/abs/2610.22686v1)。

    - 覆盖范围：仅论文摘要，未核验全文或实验数据。

    - 研究模型：`gpt-6-luna`；独立审阅：`gpt-6.1-sol`。

    - 审阅：`pass`；修订次数：0；原始材料仅在内存中提供给模型。


    ## 研究概述


    本概述仅依据论文摘要，介绍其多模态文件系统记忆架构 MFM 及摘要所报告的任务表现，不代表对完整论文或实验结果的独立核验。


    ## 主张与证据


    - **作者声称（未独立核验）**：作者提出 MFM，将情景、空间、语义、程序性和工作记忆结合起来，分别用于保存经历、关联地点、积累知识与行动方法，以及维持当前计划。（[A3](https://arxiv.org/abs/2610.22686v1)）

    - **作者声称（未独立核验）**：作者称，MFM 通过可搜索的文本记录连接不同记忆表示与底层多模态经历，使智能体能按上下文线索查找经历，并查看原始观察以恢复文本描述中缺失的细节。（[A4、A5](https://arxiv.org/abs/2610.22686v1)）

    - **作者声称（未独立核验）**：作者称，MFM 的整合过程能将经历转化为更高层次的知识与程序，同时保留指向原始经历的引用。（[A6](https://arxiv.org/abs/2610.22686v1)）

    - **作者声称（未独立核验）**：作者报告，使用 GPT-6-Astra 时，MFM 在 Mine Diamond from Scratch 任务中完成目标，在
    Ender Dragon 任务中达到 24 个里程碑中的 16 个；摘要称最佳基线为 12.7。（[A8](https://arxiv.org/abs/2610.22686v1)）

    - **作者声称（未独立核验）**：作者报告，MFM 在 CUABench-KiCad 上的平均奖励为 0.440；摘要给出的最佳基线和无持久记忆结果分别为
    0.400 和 0.267。（[A9](https://arxiv.org/abs/2610.22686v1)）


    ## 局限


    - 本次仅阅读论文摘要，未核验全文、实验设置、实现或结果。

    - 摘要未提供评测细节、统计不确定性或具体基线配置，因此不能据此独立判断所报告差异的稳健性。


    ## 独立审阅



