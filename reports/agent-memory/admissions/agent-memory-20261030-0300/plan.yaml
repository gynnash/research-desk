  reports/agent-memory/agent-memory-20261030-0300-synthesis.md: "---\nschema_version:\
    \ 1\nid: formal-report-agent-memory-agent-memory-20261030-0300\nkind: synthesis\n\
    title: Agent记忆：从存储到证据使用\ntopic: agent-memory\nstatus: accepted\nevidence_ids:\n\
    - H2\n- H4\n- R1\n- R2\n- R3\n- R4\napproval_required: false\nwriting_started:\
    \ false\npublish_authorized: false\ninput_fingerprint: a409d2af659ab939cf9d6030a225ae4b2a7f20b71594808456ab99f8d90b7221\n\
    topics:\n- agent-memory\n---\n\n> AI 自动研究记录，已通过独立模型审阅；阅读范围及证据限制见正文，未复现实验。\n\n\
    # Agent记忆：从存储到证据使用\n\nR1、R2仅覆盖论文摘要，R3、R4仅覆盖博客节选；H1–H6为未经本轮独立复核的人工历史基线。历史笔记中的主张不视为新核验事实；来源关联不构成独立验证。\n\
    \n## 综合摘要\n\n材料呈现了几类不同的记忆问题：R1描述多模态记忆与经历整合，R2聚焦针对查询构建充分证据，R3介绍上下文卸载与摘要，R4仅提及受限范围记忆而未说明其机制。它们可用于提出架构和评测问题，但摘要与节选不足以证明普遍效果、因果关系或系统间性能优劣。历史基线仅作待复核背景。\n\
    \n## 比较与证据\n\n- **我们的推断**：R1摘要描述将情景、空间、语义、程序性和工作记忆结合，并保留通往原始经历的引用；H4历史笔记也记录了分层记忆与检索机制。两者可作架构问题的参照，但H4未经本轮复核，且不能据此判断架构优劣。（[R1](agent-memory-20261030-0300-research-paper-1337d0ee-7403-4fe2-8802-f1771af20c20.md)、[H4](../../sources/papers/paper-4eb3be4b-7189-49aa-bafd-f88f77a972f4.md)）\n\
    - **我们的推断**：R2摘要将记忆利用表述为构建查询特定证据集，而非只找单条相关记忆；H2历史笔记描述带用途和容量约束的记忆块。二者涉及不同组织视角，现有材料未给出可比评测。（[R2](agent-memory-20261030-0300-research-paper-f794b398-b1d9-451d-89a0-03897daeede2.md)、[H2](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    - **作者声称，未独立复现**：R3节选描述文件卸载和摘要等上下文管理机制；H4历史笔记记录通过调入、编辑和移出信息管理上下文。可比较其关注点，但博客节选与历史笔记均不足以证明实际可靠性或效果。（[R3](agent-memory-20261030-0300-update-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)、[H4](../../sources/papers/paper-4eb3be4b-7189-49aa-bafd-f88f77a972f4.md)）\n\
    - **作者声称，未独立复现**：R4节选仅称 Managed Deep Agents 提供受限范围记忆能力，未交代写入、检索或更新机制；H2历史笔记对记忆块的组织方式作了概述，但未经本轮独立复核。两者不能支持对机制或性能的比较。（[R4](agent-memory-20261030-0300-research-blog-2c7372dc-2b55-40b2-bdbf-8cf136b56cd0.md)、[H2](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)）\n\
    \n## 局限\n\n- R1、R2仅有摘要，实验设计、实现、样本规模和统计不确定性未在材料中充分呈现；其结果均为作者报告。\n- R3、R4仅有博客节选，未提供可独立核验的记忆可靠性、隐私或安全评测。\n\
    - H1–H6是历史人工基线，未经本轮独立复核；其中H5包含旧轮次综合内容，不能把旧引用标记当作本轮证据编号。\n- 材料来自少量、覆盖方式不同的来源，不支持行业趋势、因果结论或跨系统性能排名。\n\
    \n## 待验证问题\n\n- 多模态原始经历引用、查询特定证据集及上下文摘要分别会如何影响答案的可追溯性与正确性？\n- 记忆整合或压缩后，系统能否发现信息缺失、冲突和过时内容，并可靠地回查原始记录？\n\
    - R1、R2摘要所报结果在完整评测设置、不同模型和独立复现实验中是否成立？\n- R4所称受限范围记忆的具体写入、访问控制、更新与遗忘机制是什么？\n\n\
    ## 输入与来源\n\n- [H2](../../sources/blogs/blog-fec9a2e1-6812-425a-83cd-e6a2464a1110.md)：human_baseline；来源\
    \ ID：blog-fec9a2e1-6812-425a-83cd-e6a2464a1110。\n  - [原始来源](https://www.letta.com/blog/memory-blocks/)；覆盖：historical_note。\n\
    - [H4](../../sources/papers/paper-4eb3be4b-7189-49aa-bafd-f88f77a972f4.md)：human_baseline；来源\
    \ ID：paper-4eb3be4b-7189-49aa-bafd-f88f77a972f4。\n  - [原始来源](https://arxiv.org/abs/2310.08560)；覆盖：historical_note。\n\
    - [R1](agent-memory-20261030-0300-research-paper-1337d0ee-7403-4fe2-8802-f1771af20c20.md)：reviewed_research；来源\
    \ ID：paper-1337d0ee-7403-4fe2-8802-f1771af20c20。\n  - [原始来源](https://arxiv.org/abs/2610.22686v1)；覆盖：abstract_only。\n\
    - [R2](agent-memory-20261030-0300-research-paper-f794b398-b1d9-451d-89a0-03897daeede2.md)：reviewed_research；来源\
    \ ID：paper-f794b398-b1d9-451d-89a0-03897daeede2。\n  - [原始来源](https://arxiv.org/abs/2610.22668v1)；覆盖：abstract_only。\n\
    - [R3](agent-memory-20261030-0300-update-blog-05c33166-b18e-425e-91e0-36ddd26f21aa.md)：reviewed_research；来源\
    \ ID：blog-05c33166-b18e-425e-91e0-36ddd26f21aa。\n  - [原始来源](https://www.langchain.com/blog/context-engineering-deep-agents-remember)；覆盖：excerpt。\n\
    - [R4](agent-memory-20261030-0300-research-blog-2c7372dc-2b55-40b2-bdbf-8cf136b56cd0.md)：reviewed_research；来源\
    \ ID：blog-2c7372dc-2b55-40b2-bdbf-8cf136b56cd0。\n  - [原始来源](https://www.langchain.com/blog/design-agent)；覆盖：excerpt。\n\
    \n## 准入记录\n\n[独立审阅与输入输出散列](admissions/agent-memory-20261030-0300/accepted.yaml)。\n"
