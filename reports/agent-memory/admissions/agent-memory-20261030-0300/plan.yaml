      authors:
      - Jess Weng
      published_at: '2026-10-14'
    research_summary: 本概述仅覆盖所提供的 LangChain 博客节选，聚焦其描述的代理上下文管理方法；不代表对相关实现或效果的独立核验。
    research_claims:
    - kind: author_claim
      text: 节选将上下文工程概括为两类做法：阻止不必要的信息进入上下文窗口，以及管理和筛选已经进入窗口的信息。
      evidence_ids:
      - A7
    - kind: author_claim
      text: 节选称 Deep Agents 通过卸载、摘要、按需加载技能、子代理和长期记忆等方式管理上下文；其中长期记忆会将代理学到的信息保存到可跨对话使用的文件中。
      evidence_ids:
      - A9
      - A10
      - A11
      - A12
      - A13
      - A14
    - kind: author_claim
      text: 节选称，工具结果超过约 20,000 个 token 时会先写入文件，模型收到简短预览和文件路径；超大用户消息也会被类似处理，但阈值更高。
      evidence_ids:
      - A25
      - A26
      - A28
    - kind: author_claim
      text: 节选称，默认在上下文使用量达到模型窗口的 85% 后，摘要中间件会通过一次单独的 LLM 调用压缩较早消息，移除旧消息并保留最近消息原文。
      evidence_ids:
      - A31
      - A32
    - kind: inference
      text: 按节选的描述，卸载主要减少大型单次输入带来的上下文增长，摘要则用于处理长任务中的累积；两者处理的是不同时间尺度的上下文负担。
      evidence_ids:
      - A25
      - A30
      - A31
    research_limitations:
    - 本次只读博客节选，未核验全文、实验或实现。
    - 节选描述了机制及默认阈值，但未提供可独立验证的性能、可靠性、隐私或安全性评测。
