  reports/agent-memory/agent-memory-20261030-0300-research-paper-f794b398-b1d9-451d-89a0-03897daeede2.md: "---\n\
    schema_version: 1\nid: research-agent-memory-20261030-0300-paper-f794b398-b1d9-451d-89a0-03897daeede2\n\
    kind: research_report\ntitle: 'From Relevant Memories to Sufficient Evidence:\
    \ Rethinking Memory Utilization\n  in LLM Agents'\ntopic: agent-memory\ntopics:\n\
    - agent-memory\nstatus: accepted\nsource_id: paper-f794b398-b1d9-451d-89a0-03897daeede2\n\
    coverage: abstract_only\n---\n\n# From Relevant Memories to Sufficient Evidence:\
    \ Rethinking Memory Utilization in LLM Agents\n\n> AI 自动研究记录，已通过独立模型审阅；阅读范围及证据限制见正文，未复现实验。\n\
    \n- 来源：[From Relevant Memories to Sufficient Evidence: Rethinking Memory Utilization\
    \ in LLM Agents](https://arxiv.org/abs/2610.22668v1)。\n- 覆盖范围：仅论文摘要，未核验全文或实验数据。\n\
    - 研究模型：`gpt-6-luna`；独立审阅：`gpt-6.1-sol`。\n- 审阅：`pass`；修订次数：0；原始材料仅在内存中提供给模型。\n\n\
    ## 研究概述\n\n材料仅提供论文摘要，介绍 QEMem 如何将记忆利用从检索单条相关记忆转向构建针对查询的证据集；以下效果数据均为摘要中的作者报告，未独立核验。\n\
    \n## 主张与证据\n\n- **作者声称（未独立核验）**：作者指出，检索到相关记忆并不必然意味着证据足以回答问题；信息可能分散在多条记录中、被抽象掩盖，或缺少推理所需的关联。（[A1、A2](https://arxiv.org/abs/2610.22668v1)）\n\
    - **作者声称（未独立核验）**：作者提出 QEMem，将记忆利用表述为构建查询特定的证据集，以集体证据支持取代对单条记忆相关性的侧重。（[A3](https://arxiv.org/abs/2610.22668v1)）\n\
    - **作者声称（未独立核验）**：摘要称，QEMem 包含查询引导的多粒度证据发现、带来源引用及证据角色的结构化 ViewCards，以及按证据充分性选择性补回缺失信息的机制。（[A4](https://arxiv.org/abs/2610.22668v1)）\n\
    - **作者声称（未独立核验）**：摘要称，在不修改既有记忆形成方式、并使用共享记忆存储的设定下，QEMem 配合 Claude Opus 4.5 在 LoCoMo\
    \ 上取得 91.43% 的 LLM judge 准确率；作者报告其较最强评测基线 MemR$^3$ 高 7.6 个百分点，较 NEMORI 高 10.7\
    \ 个百分点。（[A5](https://arxiv.org/abs/2610.22668v1)）\n- **作者声称（未独立核验）**：作者报告，进一步分析显示\
    \ QEMem 提高了证据覆盖率，并在需要整合跨会话证据的问题上表现较强。（[A6](https://arxiv.org/abs/2610.22668v1)）\n\
    \n## 局限\n\n- 本次仅依据论文摘要，未核验全文、实验细节、实现或结果。\n- 摘要未提供基线配置、评测样本与统计不确定性等细节，因此不能据此判断报告差异的稳健性或适用范围。\n\
    \n## 独立审阅\n\n\n正式来源：[paper-f794b398-b1d9-451d-89a0-03897daeede2](../../sources/papers/agent-memory/paper-f794b398-b1d9-451d-89a0-03897daeede2.md)。\n\
    \n准入记录：[输入、审阅与输出散列](admissions/agent-memory-20261030-0300/accepted.yaml)。\n"
