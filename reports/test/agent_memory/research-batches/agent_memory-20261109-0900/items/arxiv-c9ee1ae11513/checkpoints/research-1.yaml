  text: "{\n  \"summary\": \"在一段能完整放入上下文的LoCoMo对话上，作者报告：Mem0仅在GPT-4o-mini上比全上下文更准确，且三种模型的建库费均超过全上下文完成整轮测试的费用。Claude\
    \ Opus 5.5配合Pi搜索原始记录更省钱，但其准确率优势大多涉及额外可见的照片说明，不能据此认定搜索比全上下文更准确。\",\n  \"claims\"\
    : [\n    {\n      \"kind\": \"fact\",\n      \"text\": \"## 比较预先抽取与按需读取\\n\\n实验使用419轮、19个会话、152道题。Mem0逐轮抽取事实，回答时检索前200条；Zep按会话建立时序图，检索前20条边。智能体每题开启新会话和新容器，通过工具读取原始对话文件，并不在题目之间累积记忆。\"\
    ,\n      \"evidence_ids\": [\"A5\", \"A22\"]\n    },\n    {\n      \"kind\": \"\
    author_claim\",\n      \"text\": \"作者报告，Mem0在GPT-4o-mini上达到78%正确率，高于全上下文的74%；换成GPT-6\
    \ Luna后为80%对92%，换成Claude Opus 5.5后均为95%。三种模型的Mem0建库费都超过同模型完成全部152题的全上下文费用。虽然建库后单题更便宜，但按作者计算，分别需要在同一历史上回答372、545、596题才能摊平建库成本。\"\
    ,\n      \"evidence_ids\": [\"A9\", \"A10\"]\n    },\n    {\n      \"kind\": \"\
    author_claim\",\n      \"text\": \"## 写入质量限制后续回答\\n\\n作者固定记忆库及检索结果，只更换回答模型：读取GPT-4o-mini写入的Zep图时，GPT-4o-mini与Claude\
    \ Opus 5.5的正确率分别为43%和45%；后者读取自己写入的图则达到87%。Mem0对应为78%、84%和95%。这些结果支持作者关于较强读者不能充分弥补较弱写入者遗漏信息的判断，但没有证明任何读者都无法突破某个固定上限。\"\
    ,\n      \"evidence_ids\": [\"A11\", \"A20\"]\n    },\n    {\n      \"kind\":\
    \ \"author_claim\",\n      \"text\": \"## Pi的省钱优势不等于搜索普遍占优\\n\\n作者报告，Claude Opus\
    \ 5.5驱动Pi完成整轮测试花费6.95美元、正确率99%，全上下文为17.84美元、95%；同模型驱动Codex和Claude Code却分别花费25.41和28.41美元。Pi比全上下文多答对的7题中，6题的证据位于含照片的轮次，只有智能体能读取照片说明。在88道无照片证据题上，两者为100%和99%，仅差一题；论文未能确定搜索是否比读取全部记录更准确。\"\
    ,\n      \"evidence_ids\": [\"A7\", \"A12\", \"A13\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"已阅读所提供的完整抽取正文，包括参考文献、结果表、协议及提示词附录；未独立复现实验，未核验原始图像。\",\n    \"仅测试一段对话，每个配置一次运行，且历史均能装入上下文；不能直接推广到超出上下文窗口的历史或持续在线记忆。Mem0与Zep采用默认抽取和检索设置。\"\
    ,\n    \"智能体与记忆方法的照片说明输入不一致。评分由GPT-4o-mini按宽松规则完成，作者还指出至少一处答案键错误；少数题的差距未必稳定。\"\
    ,\n    \"费用按模型调用标价计算，依赖缓存并排除评分调用。协议允许失败或无答案的试验重跑，且只计入被接受的试验，因此报告成本不能代表包含所有失败尝试的总开销。\"\
    \n  ]\n}"
