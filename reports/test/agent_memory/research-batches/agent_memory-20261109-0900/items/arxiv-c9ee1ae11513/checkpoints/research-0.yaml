result:
  text: "{\n  \"summary\": \"作者在一段能完整放入上下文的 LoCoMo 对话上发现：预先抽取的记忆只让弱模型受益，却增加建库成本；强模型配合原始记录搜索更划算。但智能体的准确率优势大多来自额外可见的照片说明，不能据此认定搜索比全上下文更准确。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"fact\",\n      \"text\": \"## 比较的是预先筛选与按需读取\\\
    n\\n实验覆盖419轮、19个会话和152道题。Mem0逐轮抽取事实，回答时检索前200条；Zep按会话建立时序图，检索前20条边。智能体则每题开启新容器和新会话，按需读取原始对话文件，因此这里比较的不是智能体自身跨题积累记忆的能力。\"\
    ,\n      \"evidence_ids\": [\"A5\", \"A22\"]\n    },\n    {\n      \"kind\": \"\
    author_claim\",\n      \"text\": \"作者报告，Mem0在GPT-4o-mini上达到78%正确率，高于全上下文的74%；换成GPT-6\
    \ Luna后为80%对92%，换成Claude Opus 5.5后均为95%。三种模型的Mem0建库费都超过同模型完成全部152题的全上下文费用；按文中单题成本推算，需要在同一历史上回答372、545、596题才能分别摊平建库成本。\"\
    ,\n      \"evidence_ids\": [\"A9\", \"A10\"]\n    },\n    {\n      \"kind\": \"\
    author_claim\",\n      \"text\": \"## 换强读者不能完全弥补写入损失\\n\\n作者固定记忆库及其检索结果，只更换回答模型：读取GPT-4o-mini写入的Zep图时，GPT-4o-mini与Claude\
    \ Opus 5.5的正确率分别为43%和45%；让后者读取自己写入的图则达到87%。Mem0对应为78%、84%和95%。这些结果支持作者关于写入质量限制后续回答的判断，而不只是读者推理能力不足。\"\
    ,\n      \"evidence_ids\": [\"A11\", \"A20\"]\n    },\n    {\n      \"kind\":\
    \ \"author_claim\",\n      \"text\": \"## 搜索的成本优势比准确率优势更明确\\n\\n作者报告，Claude Opus\
    \ 5.5驱动Pi完成整轮测试花费6.95美元、正确率99%，全上下文为17.84美元、95%。但Pi额外答对的7题中，6题的证据位于含照片的轮次，只有智能体能读取照片说明。在88道无照片证据题上，两者为100%和99%，仅差一题；论文因此没有证明搜索原始记录比读取全部记录更准确。\"\
    ,\n      \"evidence_ids\": [\"A7\", \"A12\", \"A13\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"已阅读完整抽取正文，包括结果表、协议和提示词附录；未独立复现实验，也未核验原始图像。\",\n    \"仅测试一段对话，每个配置保留一次运行结果，且历史均能装入上下文；不能直接推广到超长历史或长期在线记忆。Mem0、Zep使用默认设置。\"\
    ,\n    \"智能体与记忆方法的照片说明输入不一致。评分由GPT-4o-mini按宽松规则完成，作者还指出至少一处答案键错误；少数题的差距不宜视为稳定优势。\"\
    ,\n    \"费用按供应商标价与缓存计费，排除评分调用。协议允许失败或无答案的试验重跑，仅计入被接受的试验，因此报告费用不包含这些失败重试的开销。\"\n\
    \  ]\n}"
