result:
  text: "{\n  \"summary\": \"作者报告，在 Minecraft 和 KiCad 的长时程单智能体任务中，MFM 通过“检索文本线索、回看原始多模态证据、更新可追溯知识”的组合提高了表现。GPT-6-Astra\
    \ 在 36,000 步预算内完成 Ender Dragon 的 16/24 个里程碑，优于最佳基线的 12.7，但仍未完成任务。\",\n  \"claims\"\
    : [\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 先定位经历，再检查原始证据\\\
    n\\n作者提出的 MFM 不用摘要替代历史，而是把原始观察、状态和动作保存为情景记录，另建包含时间、位置、动作、结果和证据路径的索引。智能体先按线索筛选经历，再选择加载历史画面、裁剪区域或比较新旧视图，从而检查索引文字未记下的细节。Minecraft\
    \ 索引由运行框架根据结构化游戏状态生成，并非模型自由撰写。\",\n      \"evidence_ids\": [\"A14\", \"A15\",\
    \ \"A19\", \"A20\", \"A72\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"作者将记忆巩固实现为对知识、程序和当前计划的修订，同时保留情景档案及索引。知识和程序引用支持它们的经历，便于发现矛盾后重新查证；working.md\
    \ 则保存计划、未解决问题和上下文重置后的恢复信息。这里改变的是可读写的外部记忆，而非丢弃原始证据后只留下压缩结论。\",\n      \"evidence_ids\"\
    : [\"A17\", \"A18\", \"A21\", \"A22\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 提升来自多个组件的组合\\n\\n作者在三个随机种子的主实验中报告：GPT-6-Astra 配合 MFM 在\
    \ Ender Dragon 上达到 16.0±0.0 个里程碑，VISTA 为 12.7±0.6；在含 25 个任务、允许跨任务保留记忆的 KiCad 评测中，平均奖励分别为\
    \ 0.440±0.013 和 0.400±0.010。相同模型移除历史画面、将索引换成扁平日志、移除程序或移除巩固后，Dragon 得分分别降至 9.7、9.3、10.7、9.3，支持各组件均有贡献。\"\
    ,\n      \"evidence_ids\": [\"A25\", \"A26\", \"A27\", \"A30\"]\n    },\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"## 迁移收益取决于记住了什么\\n\\n作者把探索轨迹的记忆交给同一世界中的新智能体，再要求寻找并开采铁、钻石或金矿；成功次数从无继承记忆的\
    \ 1/12 增至完整记忆的 11/12。收益主要出现在记忆已记录目标矿位置的条件下：继承发现目标之前的记忆，往往仍会耗尽预算。因此，实验支持相关环境知识的复用，而不是记忆越多就必然越有效。\"\
    ,\n      \"evidence_ids\": [\"A35\", \"A36\", \"A39\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"已阅读完整抽取正文及可用附录，未独立复现实验，也未核验图像本身。提示词附录仅有引导句，无法据此完整检查实际提示配置。\",\n   \
    \ \"主实验和消融每配置仅三个种子，评测限于 Minecraft、KiCad 的单智能体；世界知识迁移在同一世界中进行，不能直接推广为跨环境泛化。\",\n\
    \    \"Minecraft 索引依赖结构化游戏状态。VISTA 与 MFM 具有等价的历史画面检查能力，但还同时存在索引、知识组织和程序形成方面的差异，因此总体优势不能单独归因于视觉记忆。\"\
    ,\n    \"记忆尚未解决探索瓶颈，Ender Dragon 仍未完成；完整保存历史也有存储代价，文中单次 Diamond 运行的全分辨率画面占用 720\
    \ MB，不能据此推定更长时间运行仍可低成本扩展。\"\n  ]\n}"
