    \ 新增按发起运行者的已认证身份划分的用户记忆。两层由 LangSmith Context Hub 支撑，分别挂载到 /memories/agent/ 和\
    \ /memories/user/；前者供同一部署的用户共享，后者保存个人偏好、工作方式或用户要求记住的细节。运行时不在两层之间复制内容，因此团队规则与个人上下文默认分开保存。\"\
    ,\n      \"evidence_ids\": [\"A3\", \"A4\"]\n    },\n    {\n      \"kind\": \"\
    author_claim\",\n      \"text\": \"## 入口策略决定能否访问个人记忆\\n\\n作者称，开发者可在单个配置文件中启用任一层或同时启用两层，并分别定义访问策略。默认情况下，Slack\
    \ 一对一私聊允许访问两层；Slack 频道、群组私聊和 HTTP 入口只允许访问智能体层，拒绝访问用户层。这使私聊能够使用个人偏好，而多人会话默认采用团队偏好；其机制是限制当前运行可访问的记忆范围，而非把个人记忆转存为共享记忆。\"\
