  text: "{\n  \"summary\": \"作者报告，在将 FlyHash 的获胜位数 k 与 SimHash 的输出位数 k 对齐时，FlyHash\
    \ 的检索质量持续更高，包括在合成记忆的独立相关性标签上；但这不是等存储预算比较，也没有转化为内存或延迟优势。在测试的 5,000 条 GloVe 向量上，HNSW\
    \ 同时取得了更高质量和更低延迟。\",\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 获胜位数相同，不代表存储相同\\n\\n作者使用稀疏随机投影将嵌入映射到默认 2,000 维的候选池，再只保留最大的\
    \ k 个响应，形成稀疏二进制码；SimHash 则直接生成 k 位符号码。比较时，作者固定候选池宽度、调整获胜比例，而不是把池宽也设为 k。这个协议检验的是指定\
    \ k 下的检索质量，不能解释为两者占用相同字节数。\",\n      \"evidence_ids\": [\"A14\", \"A15\", \"A17\"\
    , \"A29\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 质量优势覆盖代理标签与合成记忆标签\\n\\n作者在四个数据集、五档 k、每档 10 个投影随机种子下，均报告 FlyHash 优于 SimHash。以\
    \ 5,000 条 GloVe 向量为例，k=64 时，依据原嵌入精确近邻计算的 mAP@100 为 0.449±0.008，对照为 0.185±0.008；因此这部分证据首先说明它更好地保留了嵌入邻域。\"\
    ,\n      \"evidence_ids\": [\"A16\", \"A19\", \"A24\", \"A25\", \"A26\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"作者另构造 6,000\
    \ 条带人物姓名的模板记忆和 150 个查询，以同一人物、同一事实的改写句作为相关项，标签不依赖嵌入距离。使用 TF-IDF 加 256 维 SVD 嵌入、10\
    \ 个种子时，k=64 的 mAP 为 0.324±0.012，对照为 0.212±0.016。这支持优势不只存在于近邻代理指标中，但不等于真实多会话问答准确率提升。\"\
    ,\n      \"evidence_ids\": [\"A37\", \"A38\", \"A39\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"## 稀疏比较仍未兑现资源优势\\n\\n作者利用固定 k 时汉明距离等于\
    \ 2k−2|A∩B|，改按活跃位置集合的交集排序。在 5,000 条 GloVe 记录上，k=64 时稀疏比较耗时 1.59 ms/查询，SimHash\
    \ 为 0.45 ms；以 uint16 保存位置需 128 字节/条，对照为 8 字节。稀疏表示减少了扫描完整候选池的开销，却仍比 SimHash 更大、更慢。\"\
    ,\n      \"evidence_ids\": [\"A29\", \"A31\"]\n    },\n    {\n      \"kind\":\
    \ \"author_claim\",\n      \"text\": \"在同规模的系统比较中，作者使用 FAISS HNSW，设置 M=32、efConstruction=200、efSearch=64，得到\
    \ mAP@100=0.9862、0.060 ms/查询、671.5 字节/条。它以更高存储换取了超过两种哈希的质量和速度，因此该实验不支持把 FlyHash\
    \ 作为一般检索系统的默认替代方案。\",\n      \"evidence_ids\": [\"A35\", \"A36\"]\n    }\n  ],\n\
    \  \"limitations\": [\n    \"已阅读完整抽取正文，包括参考文献和复现调查附录；未独立运行代码或复现实验，也未核验原始图形及排版。\"\
    ,\n    \"结论限于平坦的嵌入相似度检索；研究未评估记忆更新、遗忘、冲突处理或长期多会话任务表现。\",\n    \"带标签实验使用模板合成文本和\
    \ TF-IDF+SVD，真实 MiniLM 文本实验仅有 100 句；不能据此确认真实用户记忆日志上的收益。\",\n    \"HNSW 只测试了单一数据规模和配置族，哈希采用线性扫描，且未比较向量量化方法；极端存储约束下的等字节质量优势仍未得到直接验证。\"\
    \n  ]\n}"
