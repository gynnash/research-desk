result:
  text: "{\n  \"summary\": \"作者报告，在以 gpt-4.1-mini 写入和回答的对话记忆评测中，MIRIX-2.0 保留证据记录、增加超图索引并合并重复实体后，LoCoMo\
    \ 准确率由平面记忆的 85.7% 升至 91.4%，LongMemEval-S 由 58.8% 升至 72.6%。最值得记住的设计是：整合只改变证据的连接方式，不改写已存记录；这不等于写入无遗漏，也不等于长期运行延迟已获保证。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 记录与索引分离\\n\\n作者让六类写入代理分别管理记忆，仅对情景和语义记录建立超图。记录先提交到向量数据库，图写入失败不会回滚记录。图中的多元事实框架把参与者、角色及日期、价格等属性放在一起，并引用来源记录；无明确日期的情景事件以不可变记录标识区分，避免仅因措辞相似而合并。\"\
    ,\n      \"evidence_ids\": [\"A19\", \"A20\", \"A24\", \"A25\"]\n    },\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"作者将检索限制为先选图锚点，再沿关系取得事实及其来源记录，而非直接搜索全部证据。单值查询的基础记录与引用记录预算分别为\
    \ 6 和 4，计数查询为 8 和 12。语义 AutoDream 则在写入路径之外判定重复实体，合并引用并重连边，不改写记录或合并事件事实节点。\",\n\
    \      \"evidence_ids\": [\"A26\", \"A27\", \"A37\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"## 对话召回改善，收益来自组合配置\\n\\n作者在 LoCoMo\
    \ 上报告，平面记忆、加入超图、再加入 AutoDream 的准确率依次为 85.7%、88.4%、91.4%；LongMemEval-S 对应为 58.8%、70.0%、72.6%。回答与抽取使用\
    \ gpt-4.1-mini，两个基准由 gpt-4o-mini 三次投票评分。这支持图索引与实体整合的组合收益，但不能单独归因于多元框架或来源引用。\"\
    ,\n      \"evidence_ids\": [\"A43\", \"A46\", \"A68\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"## 程序记忆改技能，而非只改索引\\n\\n作者让 AutoDream\
    \ 从任务会话中提炼可复用经验及应避免的错误，再由管理代理创建、修改或删除技能，并核对引用文本。以 GPT-6 Luna 为执行模型、训练后冻结记忆、评测\
    \ 134 个留出 ALFWorld 任务时，三次运行平均成功率为 76.4%，无记忆为 69.4%，AWM 为 73.6%；该实验评估的是整条技能提炼流程。\"\
    ,\n      \"evidence_ids\": [\"A38\", \"A52\", \"A53\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"作者报告，关闭 AutoDream 的图配置在五个计时基准上均比\
    \ HyperMem 回答更快，但三项文档任务的摄取耗时是平面记忆的 3.8—4.0 倍。图检索在这些文档任务上也比平面检索更慢，因此工程取舍是用更多预处理和证据处理换取准确率，而非普遍降低成本。\"\
    ,\n      \"evidence_ids\": [\"A56\", \"A57\", \"A124\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"已阅读完整抽取正文，包括方法与结果附录及参考文献；未独立复现实验，也未核验代码和原始图像。\",\n    \"用户记忆结果来自单次运行，部分采用\
    \ LLM 评分；消融按组件组叠加，未隔离写入路由、事件标识、来源引用或回答验证的贡献，也未测量实体合并精度与源细节保留率。\",\n    \"优势并非覆盖所有任务：DetectiveQA\
    \ 的 64.8% 低于 MemoryBank 的 67.6%；LoCoMo 开放类和单跳题仍落后于 HyperMem。ALFWorld 部分任务类型也低于无记忆，且三次运行波动较大，不能据最高均值认定稳定优于\
    \ AWM。\",\n    \"全部计时均关闭 AutoDream，不能外推到完整系统；检索预算只约束访问证据量，未验证历史持续增长时的端到端延迟。保留已写入记录也不能保证模型最初完整写入或正确抽取，错误实体合并仍会影响可达证据。\"\
    \n  ]\n}"
