binding: c7d4f61a57e44aa4bf9c00892876cc86fc02a3793cd93a7afa6568738ac59221
result:
  text: "{\n  \"summary\": \"HABIT-Bench针对长期智能体记忆中的一个具体断点：找到过去的对话，不等于能从零散选择中恢复用户习惯，更不等于知道何时应该沿用。作者用受控习惯图与任务型对话种子构造四领域、114名合成用户的长期历史，通过四选一行动题同时检查默认行为、适用范围、临时例外、时间变化和用户确认。八种记忆方法在两个主模型下的最佳四领域宏平均准确率仅为33.06%和33.61%，与简单检索接近；直接提供标注证据后仍有大量错误。最值得关注的不是记忆容量，而是记忆能否保留足以支撑当前决策的证据关系与有效条件。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 习惯记忆必须恢复默认行为的有效条件\\n\\n作者提出，习惯记忆不是把用户说过的话存下来，而是从跨会话的不完整证据中推断行为默认值，再判断它是否适用于新请求。重复选择可能只对某种情境成立，助手提出过的建议也不等于用户已经接受。每道题因此同时指定可见历史的截止点和需要回答的目标时间：系统即使看到了2025年的替代流程，也可能必须回答2023年有效的流程。私有习惯状态记录默认行为、适用范围、例外、时间有效性和用户确认，评测器据此确定唯一行动，但不要求被测方法采用某种固定记忆表示。这里评估的是历史能否支撑决策，而不是能否复述一条偏好。\"\
    ,\n      \"evidence_ids\": [\"A7\", \"A8\", \"A13\", \"A14\"]\n    },\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"作者构造了114名合成用户、37,152个会话和3,328道题，覆盖饮食、金融、软件与旅行；源数据提供任务和表达模式，用户连续性与习惯关系则由基准重新建立。饮食领域展示了弱证据如何形成：每名用户有七个习惯，每个稳定习惯安排候选列表、远距离序号选择、三次确认复用、边界观察、单次例外、未定演练和被拒绝的建议，再混入普通任务。边界证据包含局部相邻的正反对照，因此难点并不是所有线索都相距遥远。每个习惯分别测试直接应用、边界和例外；例外只允许局部偏离，不自动替换长期默认值。\"\
    ,\n      \"evidence_ids\": [\"A15\", \"A45\", \"A46\", \"A47\", \"A48\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"金融与软件进一步转向跨会话决策重建：早期会话给出有序候选流程，较晚的用户回复通过序号确认某项选择，后续另一组候选与确认又可能建立替代流程。金融题全部组合两个或三个习惯；软件沿用这一机制，并加入71条替换链、不同环境中的相似错误和未完成支持案例。系统必须把选择连回正确候选、工作流与生效时间，而不能只保留最后一句确认。旅行则先编写长期历史，再标注证据，用当前候选事实测试历史行为规则的迁移与组合。作者明确，四领域并非同一种归纳任务：金融和软件更偏流程状态维护，旅行更偏规则恢复与应用，不能将所有题目都理解为从未经确认的行为中统计推断偏好。\"\
    ,\n      \"evidence_ids\": [\"A50\", \"A51\", \"A53\", \"A54\", \"A55\", \"A56\"\
    , \"A58\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 按时间写入记忆，再通过共享回答器选择行动\\n\\n作者采用按用户隔离、按时间写入的流程：方法依次吸收会话并更新自身记忆，到题目截止点时，根据当前请求取出上下文，再交给同一设置中的共享回答模型选择行动。普通方法不能读取私有习惯状态、证据标注、正确答案、未来会话或其他用户的记忆。主实验统一最终选择提示和JSON输出格式，用四选一精确匹配计算各领域准确率，再对四领域等权平均；均匀随机选择为25%。这一设计避免使用LLM裁判给自由回答评分，但衡量的是非交互式行动选择，不是工具执行成功率，也不直接评价记忆内容是否完整。\"\
    ,\n      \"evidence_ids\": [\"A11\", \"A18\", \"A23\", \"A76\", \"A79\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"比较覆盖A-MEM、Mem0、MemOS、MemRL、LightMem、SeCom、Letta和MIRIX，以及最近会话、BM25、稠密检索和时序混合检索基线；检索基线只用请求、不用答案选项来选择完整会话。两个主设置分别使用Qwen3-235B-A22B和GLM-5.3-Flash，同一设置的记忆操作与最终回答使用同一语言模型。Full\
    \ Memory并非原样塞入全部历史，而是组合持久摘要与近期历史：摘要最多8,192 token，主输入上限40,000 token。多数记忆系统通过保留其生命周期的官方代码适配器运行，只向共享回答器暴露检索上下文，因此这些结果不是原生端到端系统的直接排名。\"\
    ,\n      \"evidence_ids\": [\"A22\", \"A23\", \"A24\", \"A68\", \"A75\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 复杂记忆流水线没有稳定超过会话检索\\\
    n\\n作者报告，八种记忆方法在Qwen设置下的宏平均准确率为27.01%—33.06%，在GLM设置下为30.42%—33.61%，两个设置的最佳方法均为A-MEM。Qwen下最佳记忆方法为33.06%，BM25为32.50%；GLM下最佳记忆方法为33.61%，稠密检索为33.21%。GLM的压缩历史控制达到41.98%，超过全部八种记忆方法。结果支持的判断是：在这些完整流水线中，抽取、组织和维护记忆并未稳定转化为更好的行动选择。它不能单独证明某种记忆架构无效，因为各方法的上下文构造与实际预算不同，比较没有隔离表示结构本身的贡献。\"\
    ,\n      \"evidence_ids\": [\"A25\", \"A26\", \"A28\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"领域拆分更能说明困难所在。Qwen下，最佳记忆方法相对无记忆在饮食和旅行分别提高20.32与13.07个百分点；金融领域八种方法却全部低于无记忆的23.54%点估计，软件最大增益也只有1.03个百分点。GLM下，记忆方法在金融和软件的最高准确率分别为28.29%与25.44%，旅行则达到54.62%。作者将这种差异联系到多习惯组合、历史状态解析以及用户承诺与未接受建议的区分，但没有把领域差异当成单因素因果证据。任务同时改变了证据结构和组合要求，不能仅凭低分断言错误全出在检索、时间推理或习惯归纳中的某一个环节。\"\
    ,\n      \"evidence_ids\": [\"A27\", \"A58\"]\n    },\n    {\n      \"kind\":\
    \ \"author_claim\",\n      \"text\": \"## 证据命中、状态重建与正确行动是不同门槛\\n\\n作者用私有信息控制区分证据访问与下游决策：Qwen主模型直接读取标注证据时，各领域准确率仍只有39.26%—58.25%；提供私有习惯状态和所需行动时，则达到98.41%—99.26%。后者已经暴露所需行动，不能视为纯粹的理想记忆表示消融。另在Qwen3-32B的六种可追溯方法中，前五条来源会话至少命中一条正证据的Hit@5为37.77%—41.44%，但标注证据召回率只有11.17%—13.89%，答案正确且有证据命中的比例为12.92%—16.20%。作者强调，后续选择可能仍需早期列表才能解释；命中相关会话不等于恢复完整支持链。不同指标的适用题目集合不同，也不能相减得到错误来源占比。\"\
    ,\n      \"evidence_ids\": [\"A24\", \"A29\", \"A30\", \"A83\", \"A84\", \"A85\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"作者还比较了Qwen3-4B、8B、14B、32B和235B-A22B，指标保持为各领域题目准确率的四领域等权平均。A-MEM从4B时的29.41%提高到235B时的33.06%；但LightMem在14B、32B和235B下分别为28.14%、25.04%和27.01%，并未随模型增大而持续改善。这些结果只能描述较大模型设置没有一致解决任务困难，不能把差异归因于参数规模：实验同时更换了记忆阶段和回答阶段的模型，235B还采用更新的读取协议。较小模型关闭思考模式、使用更宽松的答案解析方式，因此这也不是只改变回答模型能力的受控消融。\"\
    ,\n      \"evidence_ids\": [\"A32\", \"A73\", \"A81\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"在固定32名用户、954道题的Qwen3-8B子集上，作者将检索数量从2增至20，A-MEM由29.23%升至31.21%，Letta由28.53%升至31.71%；扩大写入块则没有一致收益。同一队列的成本记录显示，A-MEM构建累计使用54.59小时与1.078亿LLM\
    \ token，查询使用13.24分钟与339万token。时间是逐用户延迟累计值，不是并行墙钟时间，token不含嵌入计算。作者据此强调，低查询成本可能隐藏昂贵的历史处理，必须分开核算构建与查询。结合证据诊断，论文最终指向的研究目标不是单纯增加检索量，而是保留默认行为、支持观察与有效条件之间的关系，使记忆建设真正服务于后续决策。\"\
    ,\n      \"evidence_ids\": [\"A33\", \"A34\", \"A35\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"已阅读抽取全文，未独立复现实验。材料覆盖正文、参考文献与可用附录，但文本抽取仍可能遗漏图表内部信息，也不能核验版式和公式呈现；四领域示例图主要保留了图注，不能据此补出完整对话、候选内容或具体失败轨迹。\"\
    ,\n    \"历史是由任务型对话种子和受控习惯关系构造的合成记录，不是源参与者的真实长期轨迹；旅行集也不是独立封存的泛化测试。人工复核检查的是给定标注证据包后能否恢复决策，而非人在完整历史中的检索能力。复核覆盖饮食200题、金融340题、软件311题和旅行618题；抽样比例不同，不能将样本通过率直接外推到全部题目。金融四道选项覆盖缺陷已修正，旅行79道内容修订题通过定向盲审。\"\
    ,\n    \"结论适用于这里的适配器、共享回答器、预算及四选一任务，不等价于原生智能体的部署表现。模型大小比较不是纯参数规模消融；敏感性与成本结果只来自固定子集和记录实现，也不是预算匹配的准确率—成本排名。证据指标受来源可追溯性、标注资格及前五条上限约束；检索到未接受建议有时有助于判断其不具约束力，因此上下文包含此类证据不自动意味着错误个性化。这些指标不直接测量错误个性化率或概率校准，也不能将总错误因果拆分为检索、归纳和适用性判断。\"\
    \n  ]\n}"
