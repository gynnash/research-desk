result:
  text: "{\n  \"summary\": \"HABIT-Bench 针对长期智能体记忆中的一个具体断点：找到过去的对话，不等于能从零散选择中恢复用户习惯，更不等于知道何时应该沿用。作者用受控习惯图与任务型对话种子构造四领域、114名合成用户的长期历史，通过四选一行动题同时检查默认行为、适用范围、临时例外、时间变化和用户确认。八种记忆方法在两个主模型下的最佳四领域宏平均准确率仅为33.06%和33.61%，与简单检索接近；直接提供标注证据后仍有大量错误。最值得关注的不是记忆容量，而是记忆能否保留足以支撑当前决策的证据关系与有效条件。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 习惯记忆要恢复默认行为，也要恢复它的有效条件\\n\\n作者提出，习惯记忆不是把用户说过的话存下来，而是从跨会话的不完整证据中推断行为默认值，再判断它是否适用于新请求。重复选择可能只对某种情境成立，助手提出过的建议也不等于用户已经接受。每道题因此同时指定可见历史的截止点和需要回答的目标时间：系统即使看到了2025年的替代流程，也可能必须回答2023年有效的流程。私有习惯状态记录默认行为、适用范围、例外、时间有效性和用户确认，评测器据此确定唯一行动，但不要求被测方法采用某种固定记忆表示。\"\
    ,\n      \"evidence_ids\": [\"A7\", \"A13\", \"A14\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"作者构造了114名合成用户、37,152个会话和3,328道题，覆盖饮食、金融、软件与旅行；源数据提供任务和表达模式，用户连续性与习惯关系则由基准重新建立。饮食领域尤其清楚地展示了“弱证据”如何形成：每名用户有七个习惯，每个稳定习惯安排候选列表、远距离序号选择、三次确认复用、边界观察、单次例外、未定演练和被拒绝的建议，再混入普通任务。边界证据中还包含局部相邻的正反对照，因此难点并不是所有线索都相距遥远。每个习惯分别测试直接应用、边界和例外；例外只允许局部偏离，不自动替换长期默认值。\"\
    ,\n      \"evidence_ids\": [\"A15\", \"A45\", \"A46\", \"A47\", \"A48\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"金融与软件把难点进一步转向跨会话决策重建：早期会话给出有序候选流程，较晚的用户回复通过序号确认某项选择，后续另一组候选与确认又可能建立替代流程。金融题全部组合两个或三个习惯；软件沿用这一机制，并加入71条替换链、不同环境中的相似错误和未完成支持案例。系统必须把选择连回正确候选、工作流与生效时间，而不能只保留最后一句确认。旅行则先编写长期历史，再标注证据，用当前候选事实测试历史行为规则的迁移与组合。作者明确，这四个领域并非同一种归纳任务：金融和软件更偏政策状态维护，旅行更偏规则恢复与应用。\"\
    ,\n      \"evidence_ids\": [\"A50\", \"A51\", \"A53\", \"A54\", \"A55\", \"A56\"\
    , \"A58\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 统一读出接口，把记忆系统与行动选择连接起来\\n\\n作者采用按用户隔离、按时间写入的评测流程：方法依次吸收会话并更新自身记忆，到题目截止点时，根据当前请求取出上下文，再交给同一设置中的共享回答模型选择行动。普通方法不能读取私有习惯状态、证据标注、正确答案、未来会话或其他用户的记忆。主实验统一最终选择提示和JSON输出格式，用四选一精确匹配计算各领域准确率，再对四领域等权平均；均匀随机选择为25%。这一设计减少了自由生成与裁判模型的变动，但衡量的是非交互式行动选择，不是工具执行成功率，也不直接评价记忆内容是否完整。\"\
    ,\n      \"evidence_ids\": [\"A11\", \"A18\", \"A23\", \"A76\", \"A79\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"比较覆盖A-MEM、Mem0、MemOS、MemRL、LightMem、SeCom、Letta和MIRIX，并设置最近会话、BM25、稠密检索及时序混合检索基线；检索基线只用请求、不用答案选项来选完整会话。两个主设置分别使用Qwen3-235B-A22B和GLM-5.3-Flash，同一设置中的记忆操作与最终回答使用同一语言模型。Full\
    \ Memory并非原样塞入全部历史，而是将持久摘要与近期历史组合：摘要最多8,192 token，主输入上限40,000 token。多数记忆系统通过保留其生命周期的官方代码适配器运行，只向共享回答器暴露检索上下文，因此不是原生端到端系统的直接排名。\"\
    ,\n      \"evidence_ids\": [\"A22\", \"A23\", \"A24\", \"A68\", \"A75\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 复杂记忆流水线没有稳定超过会话检索\\\
    n\\n作者报告，八种记忆方法在Qwen设置下的宏平均准确率为27.01%—33.06%，在GLM设置下为30.42%—33.61%，两个设置的最佳方法均为A-MEM。与简单检索相比，Qwen下最佳记忆方法为33.06%，BM25为32.50%；GLM下最佳记忆方法为33.61%，稠密检索为33.21%。GLM的压缩历史控制达到41.98%，超过全部八种记忆方法。结果支持的判断是：在这些完整流水线中，抽取、组织和维护记忆并未稳定转化为更好的行动选择。它不能单独证明某种记忆架构无效，因为各方法的上下文构造与实际预算不同，比较没有隔离表示结构本身的贡献。\"\
    ,\n      \"evidence_ids\": [\"A25\", \"A26\", \"A28\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"领域拆分比总分更能说明困难所在。Qwen下，最佳记忆方法相对无记忆在饮食和旅行分别提高20.32与13.07个百分点；金融领域八种方法却全部低于无记忆的23.54%点估计，软件最大增益也只有1.03个百分点。GLM下，记忆方法在金融和软件的最高准确率分别为28.29%与25.44%，旅行则达到54.62%。作者将这种差异联系到多习惯组合、历史状态解析以及用户承诺与未接受建议的区分，但没有把领域差异当成单因素因果证据。任务同时改变了证据结构和组合要求，因此不能仅凭低分断言错误全出在检索、时间推理或习惯归纳中的某一个环节。\"\
    ,\n      \"evidence_ids\": [\"A27\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 找到相关证据之后，仍有重建与适用性判断\\n\\n作者用私有信息控制区分证据访问与下游决策：Qwen主模型直接读取标注证据时，各领域准确率仍只有39.26%—58.25%；提供私有习惯状态和所需行动时，则达到98.41%—99.26%。后者已经暴露所需行动，不能当作纯粹“理想记忆表示”的消融。另在Qwen3-32B的六种可追溯方法中，前五条来源会话至少命中一条正证据的Hit@5为37.77%—41.44%，但标注证据召回率只有11.17%—13.89%，答案正确且有证据命中的比例为12.92%—16.20%。这些结果说明命中一条相关会话不等于恢复完整支持链；不同指标的适用题目集合不同，也不能相减得到错误来源占比。\"\
    ,\n      \"evidence_ids\": [\"A29\", \"A30\", \"A83\", \"A84\", \"A85\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"作者还在固定32名用户、954道题的Qwen3-8B子集上改变检索数量和写入分块。将检索数量从2增至20，A-MEM从29.23%升至31.21%，Letta从28.53%升至31.71%；扩大写入块没有一致收益。相同队列的成本记录则显示，A-MEM构建累计使用54.59小时与1.078亿LLM\
    \ token，查询仅使用13.24分钟与339万token。时间是逐用户延迟累计值，不是并行作业墙钟时间，token也不含嵌入计算。作者据此强调应分开核算记忆建设和查询：便宜的查询可能依赖昂贵的历史处理，而这项投入是否值得，还取决于记忆之后被复用和更新的频率。\"\
    ,\n      \"evidence_ids\": [\"A33\", \"A34\"]\n    },\n    {\n      \"kind\":\
    \ \"inference\",\n      \"text\": \"这提示，值得研究的改进方向不是单纯扩大记忆容量或增加检索条数，而是让记忆显式保留“默认行为—支持观察—有效条件”的关联。根据文中的候选列表与远距离确认机制，我们据此推测，只压缩出一条用户偏好，可能丢掉其所指选项、确认来源或生效区间；只找回一次后续选择，也可能缺少解释它所需的早期列表。同样，未接受建议有时需要被检索出来，才能证明它不具约束力，因此上下文里出现非约束性证据并不自动构成错误个性化。基准的研究价值在于把这些关系变成可诊断的决策要求，而不是证明某种新的表示已经解决了问题。\"\
    ,\n      \"evidence_ids\": [\"A30\", \"A31\", \"A35\", \"A50\", \"A85\"]\n   \
    \ }\n  ],\n  \"limitations\": [\n    \"已阅读抽取全文，未独立复现实验。材料覆盖正文与可用附录，但文本抽取不能核验图像、版式和公式呈现；四领域示例图主要保留了图注，不能据此补出完整对话、候选内容或具体失败轨迹。\"\
    ,\n    \"历史是由任务型对话种子和受控习惯关系构造的合成记录，不是源参与者的真实长期轨迹；旅行集也不是独立封存的泛化测试。人工复核检查的是给定标注证据包后能否恢复决策，而非人在完整历史中的检索能力。复核覆盖饮食200题、金融340题、软件311题和旅行618题；抽样比例不同，不能将样本通过率直接外推到全部题目。金融四道选项覆盖缺陷已修正，旅行79道内容修订题通过定向盲审。\"\
    ,\n    \"结论适用于这里的适配器、共享回答器、预算及四选一任务，不等价于原生智能体的部署表现。模型大小比较同时改变记忆阶段模型、回答模型和部分读取协议，不是纯参数规模消融；敏感性与成本结果只来自固定子集和记录实现。证据指标受来源可追溯性、标注资格及前五条上限约束，不直接测量错误个性化率或概率校准，也没有提供可将总错误因果拆分为检索、归纳和适用性判断的实验。\"\
    \n  ]\n}"
