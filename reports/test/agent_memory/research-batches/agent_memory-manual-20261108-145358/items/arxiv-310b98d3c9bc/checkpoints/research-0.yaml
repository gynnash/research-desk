result:
  text: "{\n  \"summary\": \"长期运行的智能体即使保存了历史，也可能反复犯错：记录会在检索竞争中失去可达性，摘要可能抹掉适用条件，旧策略还会干扰新任务。作者提出记忆中心持续学习框架（MCCL），把存储介质、知识资产和管理策略分开，并用内层记忆更新、外层策略演化连接经验与任务反馈。文章进一步给出保持、适应和迁移的评测协议，以及经验、容量、读写计算的联合扩展假说。最值得关注的是两组实测：存储越充分，增加读取预算的收益越大；但连续积累经验的\
    \ Mem0 在部分检查点由正收益转为负收益，说明记得更多不等于学得更好。\",\n  \"claims\": [\n    {\n      \"kind\"\
    : \"author_claim\",\n      \"text\": \"## 存储历史与学会行动是两件事\\n\\n作者从一个具体矛盾展开：执行日志、时间戳和环境状态可以持续积累，但把这些原始文本重新塞回提示词，并不保证后续行动改善。长上下文受会话边界和注意力退化限制，持续微调则有计算、遗忘和回滚成本。MCCL\
    \ 不是一个替代检索器的新模块，而是组织系统设计与验证学习效果的框架。它区分三条轴：状态存在上下文、激活、外部记录还是可更新参数中；经验形成情景、语义还是程序性资产；读写操作由固定规则、运行时模型判断还是反馈训练控制。外部数据库只回答“存在哪里”，不能据此断言知识已经具备迁移能力。\"\
    ,\n      \"evidence_ids\": [\"A3\", \"A4\", \"A5\", \"A9\", \"A10\", \"A11\"]\n\
    \    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"作者用两个耦合循环说明这些维度如何运转。内层接收观察、行动、结果和反馈，在当前管理策略控制下更新持久记忆，再通过后续访问与利用影响行为；外层则利用延迟到来的任务结果、奖励或纠错，修改未来如何写入、检索、压缩和遗忘。这里必须区分三种情况：固定策略把反馈存成新记录，部署前训练好的控制器继续管理变化中的内容，以及部署反馈真正持续改变控制规则。只有第三种属于在线策略演化，但它并非所有记忆中心持续学习的必要条件。作者特别强调，更新记录或更新策略都不是成功的充分证据，必须观察之后的行为是否改善，并保住仍有用的能力。\"\
    ,\n      \"evidence_ids\": [\"A33\", \"A34\", \"A35\", \"A36\", \"A56\", \"A57\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 写入和抽象必须保留可修订的证据链\\\
    n\\n作者把选择性写入视为系统的可塑性边界：写得过松会永久引入偶然、冗余和错误观察，过严则丢失未来适应所需的证据。写入时不仅要选内容，还要决定粒度、关系结构以及来源、时间有效性和适用范围；未记录的条件，后续整理通常无法恢复。随后，系统决定如何划分事件、何时整合，以及是否把情景记录抽象为事实或程序。例如，LycheeMemory\
    \ V2 等待语义片段边界，RecMem 以相关观察的反复出现触发整合，但这些触发规则仍是预设的。抽象增加复用范围，却也放大错误概括的影响，因此作者主张让高层规则保留通向原始情景的链接，而不是默认以摘要替换证据。\"\
    ,\n      \"evidence_ids\": [\"A38\", \"A39\", \"A40\", \"A42\", \"A43\", \"A44\"\
    , \"A45\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"取出记忆时，作者要求匹配当前决策缺口，而不只是文本相似度：规划可能需要流程和约束，执行需要精确参数，验证需要反证，失败恢复则需要过去的失败条件。摘要不足以解释适用范围时，应恢复支持它的情景上下文。发现冲突后，维护模块还要区分原记录错误、事实随时间改变和情境差异，不能让新信息自动覆盖旧证据；修订也应传播到依赖该记录的摘要与程序。遗忘则是另一维度：硬删除、到期停用和降低检索优先级调节可访问性，不等于判定事实失效。保留历史并标明当前有效范围，可以同时支持正确行动、审计和回滚。\"\
    ,\n      \"evidence_ids\": [\"A47\", \"A48\", \"A49\", \"A51\", \"A52\", \"A53\"\
    , \"A54\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 用匹配重测区分持续学习与上下文扩张\\n\\n作者提出“保存、访问、利用、行为效果”四道门：记录尚在、能够检索、进入推理以及带来净改善，分别是不同事件。因此，高召回率不能替代持续学习评测。其基本比较是同一任务上保留经验状态与重置状态的性能差\
    \ ΔP_t，并保持骨干模型、工具、输入、上下文、检索及推理预算一致。无记忆基线检查模型原有能力，完整历史基线排除单纯多给文本的解释，静态 RAG 检查动态积累是否优于固定知识源，匹配计算量则排除额外推理收益。若保留状态同时包含对话、工具状态和外部库，正的性能差仍不能单独归因于某一种记忆机制。\"\
    ,\n      \"evidence_ids\": [\"A49\", \"A63\", \"A64\", \"A65\", \"A73\", \"A74\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"作者进一步要求反复测量稳定的能力目标，而非只给长轨迹终点分数。保持性先测即时收益，再经过明确的延迟和干扰重测；仅当即时收益为正时，才报告其归一化保留比例，并记录中间更新的数量、语义重叠与冲突。适应性测变化检测延迟、恢复步数、陈旧错误持续时间，以及未变化能力受到的连带损伤。迁移则区分原例重放、同族未见变体和跨任务结构复用，同时排除重复实例与目标答案，报告目标收益、达到阈值所需交互及负迁移率。按照这一尺度，LoCoMo、LongMemEval\
    \ 的静态历史问答主要诊断访问能力，不能直接等同于带反馈交互流中的持续学习。\",\n      \"evidence_ids\": [\"A66\", \"\
    A67\", \"A68\", \"A69\", \"A70\", \"A71\", \"A72\", \"A75\", \"A76\"]\n    },\n\
    \    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 容量、读取和维护共同决定经验的收益\\\
    n\\n作者对非参数记忆提出资源瓶颈假说：经验、持久容量、每次读取预算及写入维护预算共同约束可达误差，扩容可能因读取不足而提前饱和。实测使用 Qwen3-30B-A3B-Instruct-2507\
    \ 构建和回答，比较 Mem0 0.1.94 与原始历史检索 Raw RAG。LoCoMo 包含十段对话、1,540 个问题和四乘四存储—读取网格；把读取从\
    \ 512 增至 2,048 tokens，Raw RAG 的 F1 在保留八分之一历史时增加 0.89 个百分点，完整保留时增加 3.82 点，两种增益的配对差为\
    \ 2.93 点，95% 区间为 [2.06,4.02]。这支持存储与读取互补，但不是对整套幂律形式的验证。\",\n      \"evidence_ids\"\
    : [\"A78\", \"A79\", \"A80\", \"A81\", \"A82\", \"A83\", \"A85\"]\n    },\n  \
    \  {\n      \"kind\": \"author_claim\",\n      \"text\": \"连续部署的反例更能说明“积累”与“改善”的距离。作者在\
    \ IdeaBench 上以五十个固定问题、三种随机训练对话顺序重测 Mem0；容量上限 8,192 tokens、读取 1,024 tokens 时，相对重置条件的平均收益在\
    \ 64 段训练对话后为 +7.10 个百分点，128 段后为 −10.43 点，256 段后为 −13.93 点。实际占用停在 3,858 tokens，容量上限并未触及；每隔十六或六十四段对话整合虽将最终占用降至约\
    \ 1,800 tokens，最终收益仍为负。另一组九段 LoCoMo 对话、180 个问题的读取比较中，搜索加摘要将输入从全读的 729.78 降至 43.52\
    \ tokens，却把中位延迟从 0.154 增至 0.367 秒，F1 也从 4.63% 降至 3.91%。\",\n      \"evidence_ids\"\
    : [\"A85\", \"A87\", \"A88\", \"A90\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"参数记忆的扩展模型另加了随负载增长的干扰项：经验写入共享参数，可能直接改变旧知识的读出；外部记忆则更多通过检索竞争或驱逐失去功能。作者假设干扰阈值取决于介质与写入策略，并用既有研究提供局部支持，而非进行统一复测。例如，GradMem\
    \ 固定八个记忆向量，保存 96 对键值时，一次写入步骤的精确匹配率为 32.6%，五次则为 88.4%，表明写入计算可部分补偿容量。TMEM 的最佳写入触发阈值在\
    \ LoCoMo 为 4K tokens、LongMemEval-S 为 12K，更频繁或更稀疏写入均会下降。这些结果支持写入策略的重要性，但不同容量的负载曲线能否归一到同一关系，原文明确仍未检验。\"\
    ,\n      \"evidence_ids\": [\"A92\", \"A93\", \"A95\", \"A96\", \"A101\", \"A104\"\
    ]\n    },\n    {\n      \"kind\": \"inference\",\n      \"text\": \"这提示，MCCL 最有价值的研究转向不是把数据库重新命名为学习器，而是让每次记忆操作承担可追踪的未来行为责任。容量尚未耗尽却出现负收益，意味着诊断必须继续追查写入质量、证据损失、检索竞争和错误利用，而不能只增加存储；摘要减少输入却增加延迟，也说明优化目标应是相同性能下的生命周期成本。结合作者提出的混合路径，我们据此推测，更值得验证的设计是：让易变化事实保留在可审计、可修订的外部记录中，仅将反复验证且高频复用的模式固化进参数，并保留依赖链以处理纠错与删除。它目前仍是研究路线，不能视作已经实现的自主自我改进系统。\"\
    ,\n      \"evidence_ids\": [\"A49\", \"A87\", \"A88\", \"A89\", \"A90\", \"A105\"\
    , \"A126\", \"A127\", \"A128\"]\n    }\n  ],\n  \"limitations\": [\n    \"已阅读抽取全文，未独立复现实验。阅读范围覆盖所提供的完整\
    \ HTML 抽取文本及参考文献，但文本抽取不保证图像、版式和数学渲染忠实，也可能遗漏图表视觉信息或未被抽出的附录内容；本文只使用可核对的正文、图注与表格文字。\"\
    ,\n    \"MCCL 主要是统一框架、评测协议和扩展假说，并非一个端到端实现且经统一基线验证的算法。多幅扩展曲线来自预设函数的理论示意，不能当作拟合结果；参数记忆部分大量数字是作者转述其他论文，预训练记忆层、合成键值任务、事实编辑与持续行动的实验条件不同，不能据此给出通用容量阈值或跨系统排名。\"\
    ,\n    \"作者自有实测的外推范围有限：LongMemEval 只选取一百个样本，并采用本地语义裁判；IdeaBench 的 Mem0 默认在线模式在五十题评测期间也写入，因此初始点存在小幅非零偏移，性能下降不能简单归因于容量不足或某一单独环节。小记忆库读取经济性实验不包含离线构建延迟，其低绝对\
    \ F1 也不支持一般部署质量结论。在线策略演化的延迟信用分配、跨介质修订与回滚，以及删除对摘要和参数等派生状态的影响，仍是未解决边界。\"\n  ]\n}"
