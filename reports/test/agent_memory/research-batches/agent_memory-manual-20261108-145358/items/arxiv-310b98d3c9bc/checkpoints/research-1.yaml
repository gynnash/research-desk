result:
  text: "{\n  \"summary\": \"长期运行的智能体即使保存了历史，也可能因检索竞争、摘要丢失适用条件和旧策略干扰而反复犯错。作者提出记忆中心持续学习框架（MCCL），将存储介质、知识资产和管理策略分开，用内层记忆更新与外层策略演化连接经验和任务反馈，并要求通过保持、适应、迁移评测证明后续行为改善。文章还提出经验、容量和读写计算的联合扩展假说。实测中，完整历史让增加读取预算的收益更大；但\
    \ Mem0 连续积累经验后可由正收益转为负收益，且压缩占用未消除退化。这使研究重点从“存了多少、检索多准”转向“经验何时真正改善行动”。\",\n  \"\
    claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 记忆的存储位置不等于学习能力\\\
    n\\n作者指出，把执行日志重新塞回提示词并不保证后续行动改善，因此将设计拆成存储介质、情景／语义／程序性资产、管理策略三轴。介质还需按状态表示区分：上下文以可见\
    \ token 参与注意力，激活记忆以隐藏状态、KV 缓存或记忆槽参与前向计算，外部记忆是可独立寻址和修改的记录，自适应参数记忆则要求部署后仍能更新权重或适配器。数据库文本进入提示词仍属外部记忆，KV\
    \ 缓存移到磁盘仍是激活表示，静态预训练权重不属于部署期自适应记忆。激活状态读写高效，却难以逐事实编辑或跨模型转移；外部记录便于修订，但检索排名下降仍能造成“记录尚在、功能已失”的遗忘。\"\
    ,\n      \"evidence_ids\": [\"A3\", \"A9\", \"A10\", \"A11\", \"A12\", \"A13\"\
    , \"A14\", \"A15\", \"A17\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"MCCL 据此提出两个耦合循环，而非一个替换现有检索器的新模块。内层接收观察、行动、结果和反馈，在当前管理策略控制下更新持久记忆，再通过后续访问与利用影响行为；外层利用延迟到来的任务结果、奖励或纠错，修改未来如何写入、检索、压缩和遗忘。作者区分三种反馈作用：固定规则把反馈存成记录，部署前训练好的控制器管理持续变化的内容，以及部署反馈真正持续改变控制规则。只有第三种属于在线策略演化，但它并非所有记忆中心持续学习的必要条件。共同的判据是经验引起的状态变化能否在未来带来适当改善，同时保住仍有用的能力，而不是更新次数是否增加。\"\
    ,\n      \"evidence_ids\": [\"A33\", \"A34\", \"A35\", \"A36\", \"A56\", \"A57\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 写入与抽象必须留下可修订的证据\\\
    n\\n作者把选择性写入视为可塑性边界：过松会持久保存偶然、冗余和错误观察，过严则丢失未来适应所需的证据。写入不仅选择内容，还决定粒度、关系结构、来源、时间有效性和适用范围；没有记录的条件，后续整合通常无法恢复。系统随后决定如何划分事件、何时整合，以及是否把情景记录抽象为事实或程序。例如，LycheeMemory\
    \ V2 等待语义片段边界，RecMem 用相关观察的反复出现触发整合，但这些触发规则仍是预设的。抽象能压缩重复细节、扩大复用范围，也会让错误概括影响更多任务。作者因此主张保留高层规则与原始情景之间的链接，而非默认用摘要替换证据；这里的整合服务跨任务持久复用，不只是缓解当前上下文长度。\"\
    ,\n      \"evidence_ids\": [\"A38\", \"A39\", \"A40\", \"A41\", \"A42\", \"A43\"\
    , \"A44\", \"A45\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"\
    text\": \"读取阶段应匹配当前决策缺口，而不只是文本相似度：规划需要流程与约束，执行可能需要精确参数，验证需要检验结论的证据，失败恢复需要过去的失败条件。摘要不足以确定适用范围时，应恢复支持它的情景上下文。发现冲突后，维护模块还须区分原观察错误、事实随时间改变和情境不同，不能让新信息自动覆盖旧证据；修订原记录时，也要检查依赖它的摘要和程序。遗忘则调节可访问性：硬删除、到期停用、降低检索优先级，与判定某项事实已失效不是同一种操作。作者强调，删除来源也不保证消除派生知识的影响；未来价值不确定且允许保留时，可逆抑制或归档可能比永久移除更合适。\"\
    ,\n      \"evidence_ids\": [\"A47\", \"A48\", \"A49\", \"A51\", \"A52\", \"A53\"\
    , \"A54\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 用匹配重测证明经验改善了行为\\n\\n作者将“保存、访问、利用、行为效果”分成四道门：记录存在、成功检索、实际进入推理和产生净改善，不能相互替代。基本比较是同一任务上保留经验状态与重置状态的性能差\
    \ ΔP_t，并匹配骨干模型、工具、输入、上下文、检索和推理预算。无记忆基线检查模型原有能力，完整历史基线排除单纯增加历史文本的解释，静态 RAG 检查动态积累是否超出固定知识源的收益，匹配计算量则排除额外推理。外部库还可通过关闭写入、关闭读取、清空存储分别干预；参数或激活记忆需要重置相应状态，不能只删数据库。若状态条件同时保留对话、工具状态和外部库，正的性能差仍不能单独归因于某一种记忆机制。\"\
    ,\n      \"evidence_ids\": [\"A49\", \"A65\", \"A73\", \"A74\", \"A76\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"评测还必须反复测量稳定的能力目标，而非只给长轨迹终点分数。保持性先测即时收益，再经过声明的延迟和干扰重测；仅在即时收益为正时，报告归一化保留比例，并记录中间更新的数量、语义重叠和冲突。适应性测变化检测延迟、恢复步数、陈旧错误持续时间及未变化能力的连带损伤。迁移则区分原例重放、同族未见变体和跨任务结构复用，排除重复实例与目标答案，报告目标收益、达到阈值所需交互及负迁移率。按作者的分类，LoCoMo、LongMemEval\
    \ 的静态历史问答主要诊断长程访问；带任务反馈的连续交互才更接近检验经验是否形成新能力。不同评测范式的分数不能直接组成通用排名。\",\n      \"\
    evidence_ids\": [\"A66\", \"A67\", \"A68\", \"A69\", \"A70\", \"A71\", \"A72\"\
    , \"A75\", \"A76\", \"A77\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 扩容的收益取决于读取和维护预算\\n\\n作者对非参数记忆提出资源瓶颈假说：经验、持久容量、读取预算、写入维护预算共同约束可达误差，单独扩容可能因其他资源不足而饱和。自有实测用\
    \ Qwen3-30B-A3B-Instruct-2507 构建、回答和本地模型评分，比较 Mem0 0.1.94 与原始历史检索 Raw RAG。LoCoMo\
    \ 使用十段对话、1,540 个问题及四乘四存储—读取网格；读取从 512 增至 2,048 tokens 时，Raw RAG 的 F1 在保留八分之一历史时增加\
    \ 0.89 个百分点，完整保留时增加 3.82 点，配对增益差为 2.93 点，95% 区间 [2.06,4.02]。另在一百个所选 LongMemEval\
    \ 样本上，同样提高读取预算，使完整历史 Raw RAG 的本地语义准确率从 35.00% 升至 44.00%。作者据此支持存储—读取互补，而非证明整套幂律形式。\"\
    ,\n      \"evidence_ids\": [\"A78\", \"A79\", \"A80\", \"A81\", \"A82\", \"A83\"\
    , \"A85\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"连续部署则出现相反方向。作者在 IdeaBench 上用五十个固定问题、三种随机训练对话顺序重测 Mem0；容量上限 8,192 tokens、读取\
    \ 1,024 tokens 时，平均 stateful–reset 收益在 64 段训练对话后为 +7.10 个百分点，128 段后为 −10.43，256\
    \ 段后为 −13.93。实际占用停在 3,858 tokens，容量上限并未触及；每隔十六或六十四段对话整合虽将最终占用降至约 1,800 tokens，最终收益仍为负。另一组九段\
    \ LoCoMo 对话、180 个问题的读取比较也揭示成本错位：搜索加摘要将输入从全读的 729.78 降至 43.52 tokens，中位延迟却从 0.154\
    \ 增至 0.367 秒，F1 从 4.63% 降至 3.91%。这些结果支持分别核算占用、行为收益、token 和延迟，而非把压缩率当作学习效果。\",\n\
    \      \"evidence_ids\": [\"A85\", \"A87\", \"A88\", \"A89\", \"A90\"]\n    },\n\
    \    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 参数容量与写入策略需要分别检验\\\
    n\\n参数扩展模型另加负载干扰项。作者定义负载比为待保留信息量与有效参数容量之比；后者由记忆参数规模及单位参数容量决定。假说认为，负载超过依赖介质和写入策略的阈值后，新写入开始破坏旧内容。外部库更多通过检索竞争或驱逐失去功能，参数记忆则直接改变共享参数的读出。其读取通常由架构决定，不是可自由分配的独立预算；不增加提示词\
    \ token 并不意味着没有前向计算成本。写入计算还能部分补偿容量：作者转述 GradMem 的合成键值实验，固定八个记忆向量、保存 96 对键值时，一次写入步骤的精确匹配率为\
    \ 32.6%，五次为 88.4%。但不同容量的负载曲线能否按负载比归一到同一关系，原文明确仍未检验。\",\n      \"evidence_ids\"\
    : [\"A92\", \"A93\", \"A94\", \"A95\", \"A96\", \"A101\", \"A105\"]\n    },\n\
    \    {\n      \"kind\": \"author_claim\",\n      \"text\": \"容量项的依据来自另一组被引用研究，而非上述键值实验。作者转述固定\
    \ 1.3B 配置下 Memory+ 值数量从 1M 增至 64M：NaturalQuestions 准确率从 13.68 升至 20.78，TriviaQA\
    \ F1 从 42.89 升至 62.14；同配置无记忆层模型分别为 7.76、32.64。不过这些层在预训练中联合训练，不能验证部署期顺序写入。等容量也不保证等效果：Qwen3-8B、LoRA\
    \ rank 128 时，SFT、MemFT-OT、MemFT-SW 的记忆准确率分别为 40.0%、100.0%、94.4%。作者用这些分组证据说明容量与写入方法必须分别控制，并提出混合研究路线：快速变化的经验先保留在可修订的外部记录中，仅将反复验证、高频复用的模式固化到参数。双向纠错与回滚仍是待建立的机制，而非已完成的自主改进闭环。\"\
    ,\n      \"evidence_ids\": [\"A98\", \"A99\", \"A105\", \"A126\", \"A127\"]\n\
    \    }\n  ],\n  \"limitations\": [\n    \"已阅读抽取全文，未独立复现实验。阅读范围覆盖提供的完整 HTML 抽取文本、可用图注与表格文字及参考文献，但未独立核查图像、版式和数学渲染；抽取仍可能遗漏图表视觉信息、公式细节或未被抽出的附录内容，也不等于阅读了被引用论文的全文。\"\
    ,\n    \"MCCL 主要是统一框架、评测协议与扩展假说，不是经过统一基线验证的端到端算法。多幅扩展曲线来自预设函数的理论示意，不能当作数据拟合；参数部分转述的预训练记忆层、LoRA\
    \ 记忆、合成键值任务和事实编辑采用不同协议，不能跨设置排名，也不能据此确定通用干扰阈值。负载比归一假说及完整在线策略演化尚未得到系统验证。\",\n  \
    \  \"自有实验的外推范围有限：LongMemEval 只用一百个所选样本和本地语义裁判；IdeaBench 的 Mem0 默认在线模式在五十题评测期间也写入，初始点存在小幅非零偏移，退化不能归因于某个单独环节。小记忆库读取实验的延迟不含离线构建，其低绝对\
    \ F1 不支持一般部署质量结论。延迟信用分配、跨介质修订和删除对摘要、程序及参数等派生状态的影响，以及访问控制与安全回滚，仍是持续部署的重要边界。\"\n\
    \  ]\n}"
