binding: 4a349e6faa86eced230c3cd17328bbaef373f8cf27751e64c62a91bf4e8d9238
result:
  text: "{\n  \"summary\": \"MemComposer 针对智能体记忆中的一个具体难题：语义相似的历史轨迹未必能指导当前任务，固定检索数量与排序也可能降低执行成功率。作者在相似度检索之后加入可训练的记忆组装器，联合读取请求与候选摘要，决定选哪些、选多少以及如何排列，再把完整轨迹交给冻结的执行器。训练采用\
    \ ExPO，以多次完整交互的成功率比较不同组装方案，而不是预测单条记忆的相关性。在三个客服领域、两个执行器上，作者报告平均成功率与四次全部成功的比例均领先，且执行器接收的记忆\
    \ token 分别减少16.9%和4.9%；固定记忆集合的重排实验进一步显示，顺序本身具有可测的影响。\",\n  \"claims\": [\n   \
    \ {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 记忆价值取决于整组经验如何指导执行\\\
    n\\n作者提出，智能体需要的不是单纯“与请求相似”的文本，而是能改变后续行动的经验。其前期观察显示，增加记忆数量并不稳定提高成绩，不同领域偏好的数量不同；即使记忆集合不变，换一个排列也会改变具体任务的结果。MemComposer\
    \ 因而将决策对象从单条记忆的分数改为整个有序子集：给定请求与候选池，同时决定成员、数量和顺序，允许一个也不选。作者将这一点与逐条估计效用的 MemRL、Memento\
    \ 区分开来。相对于文中讨论的 RAG 场景，这些候选的主要价值不是提供答案事实，而是引导执行器完成多步工具操作、遵守政策并避免旧错误。\",\n    \
    \  \"evidence_ids\": [\"A5\", \"A11\", \"A57\", \"A59\"]\n    },\n    {\n    \
    \  \"kind\": \"author_claim\",\n      \"text\": \"记忆首先离线写入，而不是在测试交互中持续增长。作者让冻结执行器对每个训练任务独立运行8次，再由同一模型结合结果、评测反馈和参考解进行事后复盘。失败轨迹标出最早的错误行动及替代做法；成功轨迹也接受过程审计，有严重过程错误的被标为\
    \ fake pass，但不改动环境原本给出的成功奖励。确定性检查负责核对引用轮次、结果一致性和格式，不通过就连同轨迹删除。最后每个训练任务最多保留两条，尽量兼有成功与失败。因此库存并非成功示范集，而是包含行动、历史结果及纠错解释的程序性经验库；测试任务不参与建库。\"\
    ,\n      \"evidence_ids\": [\"A65\", \"A66\", \"A67\", \"A68\", \"A69\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"取出记忆时，作者只用用户开场请求建立索引，以\
    \ Qwen3-Embedding-8B 的余弦相似度取得前10条。为控制组装器的输入，每条记忆有两种表示：完整轨迹加复盘平均约2.3K—3.0K token；摘要平均约1.0K—1.4K\
    \ token，含开场请求、结果标签、关键行动概述及复盘。组装器联合读取请求和十份摘要，输出简短理由及互不重复的候选编号有序列表；选中后才把对应完整版本按该顺序插入执行器系统提示。测试时每个任务只选择一次，并在四次试验中复用。训练期间执行器、检索器与库存都固定，改变的是如何组装上下文，而非记忆内容或执行器参数。\"\
    ,\n      \"evidence_ids\": [\"A70\", \"A71\", \"A72\", \"A73\", \"A93\", \"A94\"\
    , \"A17\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## ExPO 用完整交互的结果学习组装策略\\n\\n作者提出的 Experience Policy Optimization（ExPO）沿用 GRPO\
    \ 的组内比较框架，但奖励来自执行器完成任务后的结果。每个输入采样8个组装序列，每个有效序列固定记忆和顺序，以不同基准种子完成8次交互，取二元成功结果的平均值。最终奖励再扣除数量与格式惩罚；相同序列可共享试验，基础设施错误导致的试验会重采样。数量惩罚按条数而非\
    \ token 计算：零售、航空每条扣0.01；电信前7条免费，超出后每条扣0.02。其最大值低于一次成功带来的1/8奖励增量，所以在格式条件相同时，数量惩罚只用于偏好同等任务成绩下更小的选择，不会压过成功率差异。\"\
    ,\n      \"evidence_ids\": [\"A14\", \"A15\", \"A75\", \"A76\", \"A77\", \"A80\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"训练还会丢弃任务成功率完全相同的采样组，避免仅靠“更短”或“格式更好”产生看似有用的学习信号。保留组内的优势是最终奖励减组均值，不除以标准差，以免放大接近结果中的噪声；随后用\
    \ token 级裁剪策略目标更新组装器，不使用参考策略 KL 惩罚。作者以 LoRA 训练30次策略更新。为扩大输入变化，每个训练任务生成四种客户开场，多数设置还把前20个候选分成两个十条窗口；检索排除同任务记忆，测试则固定单个开场与前10条。代价主要在完整交互：采样与环境模拟占每步墙钟时间的69%—91%，说明这不是便宜的相关性标注替代品。\"\
    ,\n      \"evidence_ids\": [\"A16\", \"A17\", \"A79\", \"A80\", \"A81\", \"A82\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 成绩提升来自选择与排序，而不只是更多上下文\\\
    n\\n作者在 τ²-bench 的零售、航空、电信领域评测，测试任务分别为40、20、40个，统一由 GLM-4.7 模拟用户。每个任务运行四次：pass1\
    \ 是平均成功率，pass4 是四次全部成功的任务比例，不是“至少一次成功”；跨领域成绩取等权平均。同一执行器下，各选择方法共享冻结模型、库存与前10个候选。基线包括无记忆、相似度或轨迹长度启发式、未训练选择器、预训练重排器，以及\
    \ MemRL、Memento。启发式在测试集上从指定预算中挑最好配置；MemRL 则关闭写回，仅比较价值感知检索。这些条件将比较集中于固定候选池内的选择策略，而不是完整在线记忆系统。\"\
    ,\n      \"evidence_ids\": [\"A19\", \"A20\", \"A22\", \"A23\", \"A24\", \"A89\"\
    , \"A92\", \"A95\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"\
    text\": \"作者报告，Qwen3-4B-Instruct 执行器下，MemComposer 的跨领域平均 pass1、pass4 分别为50.8和32.5，较各指标最强基线高5.9和5.0个百分点；Ministral-3-8B-Instruct\
    \ 下分别为63.5和40.0，其中 pass1 较最强基线高4.6点。它并非逐项占优：Ministral 的电信任务中，MemRL 的 pass1、pass4\
    \ 为76.2和55.0，高于其75.6和52.5。效率收益指执行器收到的记忆块：相对各执行器最强基线平均少16.9%和4.9%，不等于端到端计算同比降低。额外的\
    \ ALFWorld 实验在133个未见测试游戏上达到82.0%，高于 Memento 的79.7%，但所有方法在双物体拾取类型上均未超过30%。\",\n\
    \      \"evidence_ids\": [\"A18\", \"A25\", \"A26\", \"A63\", \"A64\", \"A96\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"行为分析给出了比总分更具体的解释。在同一组零售任务上，训练使平均选择数从2.52增至3.73，所选候选的平均相似度名次从3.21移至4.35；成功经验占比却从45.5%降至35.6%。因此“比最强基线省\
    \ token”并不意味着“比未训练选择器选得更少”，而失败经验也可能携带有用行动。作者举出的换货案例从无记忆的0/4提升至使用失败记忆的4/4，不过其中训练与测试涉及同一客户、同一订单。排序分析则固定已选集合，在\
    \ Ministral 的全部测试任务上改用四种相似度或长度排序；作者报告学习顺序领先3.8—8.5个 pass1 百分点。这一对照隔离了顺序效应，但没有证明学习顺序最优。\"\
    ,\n      \"evidence_ids\": [\"A27\", \"A28\", \"A29\", \"A30\", \"A102\", \"A38\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 迁移结果支持可复用的组装能力\\\
    n\\n作者进一步不经重训地更换领域、执行器或库存。零售训练的 Qwen 组装器迁移到航空后，pass1 为53.8，与领域内训练的52.5接近；迁移到电信则以1.2点\
    \ pass1 换取2.5点 pass4。换成 Ministral 执行器及其库存后，迁移组装器在零售达到70.6/50.0，而针对 Ministral 训练的是75.0/47.5，体现平均成功率与稳定性之间的取舍。另一组实验固定\
    \ Qwen 执行器，在零售和航空更换更强模型生成的库存：组装器在10个领域—库存组合中的9个不低于相似度 top-5，并在每个未见库存上提高两领域平均 pass4，平均增益9.1点。作者据此认为，更好的存储内容并不会消除组装需求。\"\
    ,\n      \"evidence_ids\": [\"A33\", \"A34\", \"A30\", \"A31\", \"A35\"]\n   \
    \ },\n    {\n      \"kind\": \"inference\",\n      \"text\": \"我们据此推测，这项工作的研究意义在于把“检索之后的上下文组装”确立为可独立训练的决策层，而不是证明相似度检索已经无用。相似度仍决定候选边界，组装器无法选到池外经验；摘要决定它能看到哪些线索，完整轨迹则决定执行器实际接收什么。整组任务奖励能够容纳经验互补和失败中的局部价值，但也把内容与顺序的信用分配混在一起。工程上，应将执行器上下文节省与组装器读取候选、生成选择及训练模拟的成本分别核算。对于长期智能体，这更像一个可插入固定记忆库的读取模块，而不是已经覆盖持续写入、遗忘、冲突解决和跨会话个性化的完整方案。\"\
    ,\n      \"evidence_ids\": [\"A11\", \"A17\", \"A38\", \"A39\", \"A70\", \"A71\"\
    , \"A82\", \"A96\", \"A100\", \"A101\"]\n    }\n  ],\n  \"limitations\": [\n \
    \   \"统计结论受每领域20—40个测试任务限制。作者采用10,000次按领域分层的任务配对 bootstrap；合并两个执行器后，pass1 相对所有基线的区间排除零，但\
    \ pass4 相对 Complexity、Memento 不排除零。分执行器看，相对最强基线的 pass1 增益区间都包含零，不能表述为各执行器上的决定性胜利；同时未做多重比较校正。测试集挑选启发式预算、固定库存下对\
    \ MemRL 和 Memento 的适配，也限定了比较对象，并不代表全面击败其原始在线系统。\",\n    \"适用范围是完整历史轨迹加复盘组成的程序性记忆，执行器仅覆盖4B、8B模型；尚未验证事实规则型语义记忆、特定用户历史或前沿规模执行器。复盘依赖训练任务的参考解和评测反馈，确定性检查只能验证部分结构一致性，不能保证解释语义正确。官方划分中的客户与订单重叠会使部分记忆直接包含可复用操作，案例提升不能直接等同于抽象技能迁移。顺序通过整组奖励隐式学习，未与全排列最优解比较，也未完成选择、顺序和所有奖励组件的全面消融；记忆\
    \ token 节省不包含额外组装器和模拟 API 成本。\",\n    \"已阅读抽取全文，未独立复现实验。阅读范围包含提供的正文、附录及参考文献，但文本抽取不保证图像、表格布局和公式忠实完整，部分案例的图形内容与长轨迹在抽取文本中缺失或省略；这里仅使用可从文字完整核对的数值与机制，未从曲线或缺失单元格推算结果。\"\
    \n  ]\n}"
