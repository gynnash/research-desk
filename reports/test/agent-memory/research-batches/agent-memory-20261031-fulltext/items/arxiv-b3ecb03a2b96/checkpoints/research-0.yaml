result:
  text: "{\n  \"summary\": \"长期交互中的难点不只是找回用户说过什么，而是从分散、含糊且可能过时的行为中判断默认习惯、适用范围、例外和用户是否真正认可，再据此选择行动。作者提出\
    \ HABIT-Bench：以四领域合成纵向历史和四选一决策，检验习惯推断与恰当使用，并让多种记忆系统在共享回答协议下比较。114名合成用户、37,152个会话和3,328项探测构成评测。最值得注意的是，最佳记忆方法宏准确率仅约三分之一；即使直接提供标注证据仍有明显错误，而压缩历史在一个模型设置下反而优于各记忆方法。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 记住历史不等于知道何时该用\\n\\n作者把习惯记忆界定为两个相连但不能互相替代的能力：从跨会话的不完整证据推断行为默认值，以及判断该默认值在当前请求中是否仍然适用。一个人反复选择某项做法，可能只是在特定情境下成立；一次例外也不必然意味着长期改习惯；助手提出的方案若未获用户接受，更不能被当成用户承诺。因而，基准不限定记忆必须采用何种内部表示，而是考查记忆能否支撑有依据的行动选择。\"\
    ,\n      \"evidence_ids\": [\"A7\", \"A13\", \"A14\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"探测任务给出当前请求、四个候选行动、历史可见截止点和要判断的目标时间。评测者依据目标时间有效的习惯状态——包括默认行为、适用条件、例外、时间效力和用户认可情况——解析出唯一有效选项。这样，系统不能只回答“历史里出现过什么”：它可能需要把早期定义候选项的会话与后来的序号选择拼起来，也可能要在历史目标时间忽略后来替换的新流程。作者以金融场景说明，即使较新的替代方案已经可见，问题仍可能要求重建2023年5月当时的工作流。\"\
    ,\n      \"evidence_ids\": [\"A13\", \"A14\", \"A50\"]\n    },\n    {\n      \"\
    kind\": \"fact\",\n      \"text\": \"基准包含114名合成用户、37,152个会话和3,328项探测，覆盖食品、金融、软件和旅行。食品数据从烹饪对话种子构造，刻意安排重复选择、上下文对比、局部例外和被拒绝的建议；金融与软件主要让系统从远隔的候选清单和用户确认中恢复工作流，并识别替换、未解决案例及未获认可的提议；旅行则用先写出的时间顺序历史建立行为规则，再测试其向新请求的应用。四域证据结构不同，不能把统一的四选一形式误读为单一类型的习惯学习任务。\"\
    ,\n      \"evidence_ids\": [\"A15\", \"A16\", \"A44\", \"A46\", \"A49\", \"A50\"\
    , \"A52\", \"A53\", \"A55\", \"A58\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 合成纵向证据怎样被组织成可判定任务\\n\\n作者以任务型对话数据提供任务种子和交互模式，再由基准自行构造用户连续性、习惯状态、时间线及探测标签；历史中还穿插普通同领域任务，避免每个会话都像直接提示答案。金融和软件尤其依赖证据拓扑：顺序候选清单与用户后来确认共同确立流程，替换链决定某一目标时间的有效状态，而一次性案例、未接受的助手建议和未解决排练不能自动算作绑定证据。探测还组合多个习惯、历史时点、来源判断与案例续接，使选项符合请求硬约束，却在是否正确使用习惯上有所区别。\"\
    ,\n      \"evidence_ids\": [\"A15\", \"A16\", \"A24\", \"A25\", \"A27\", \"A51\"\
    , \"A54\"]\n    },\n    {\n      \"kind\": \"fact\",\n      \"text\": \"作者报告了独立人工审查：两名审阅者先在不看标准答案和系统预测的情况下，根据按时间排列的证据包判断是否存在唯一可支持行动，并评价证据充分性、范围、例外、选项平衡、自然度、来源和隐私等项目；有分歧时由第三人裁决。审查覆盖食品200项、金融340项、软件311项和旅行618项。双方对有效选项的原始一致率分别为99.50%、100.00%、99.68%和92.84%；金融有4项因选项漏掉额外输出位置要求而被标为需修改，之后修正。该流程验证的是给定证据包时决策是否可恢复，不是人工能否从完整长历史中检索证据。\"\
    ,\n      \"evidence_ids\": [\"A20\", \"A21\", \"A59\", \"A60\", \"A61\", \"A63\"\
    , \"A64\", \"A65\", \"A67\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 共享回答器比较的是完整记忆流程\\n\\n每个用户拥有隔离记忆，系统按时间顺序摄入会话，并只使用探测截止时可见的历史；回答时，各方法向同一回答器提供检索或构造出的上下文，回答器从四个候选行动中选一个。主实验比较无记忆、压缩历史、近期会话检索、BM25、稠密检索、时间混合检索，以及六种记忆方法和两个多存储方法。准确率按四选一严格匹配计算，主指标为四领域准确率的等权平均，随机选择基线为25%。因此比较对象是包括上下文构造、方法特定预算和回答在内的流水线，而不是只改变某个记忆表示的受控架构消融。\"\
    ,\n      \"evidence_ids\": [\"A18\", \"A22\", \"A23\", \"A24\", \"A25\", \"A68\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"作者报告，Qwen3-235B-A22B下八种记忆方法的宏准确率为27.01%至33.06%，GLM-5.3-Flash下为30.42%至33.61%；两组最优值分别由A-MEM取得。记忆带来的收益随领域变化：Qwen下最佳记忆方法相对无记忆在食品提高20.32个百分点、旅行提高13.07个百分点，但金融所有八种方法都低于无记忆的23.54%，软件最大提升仅1.03个百分点。GLM下金融和软件最佳分数为28.29%和25.44%，旅行则为54.62%。这些差异表明跨会话、多习惯与时间状态重建仍难，但单靠领域对比不能确定具体错误来自检索、状态推断还是组合决策。\"\
    ,\n      \"evidence_ids\": [\"A25\", \"A26\", \"A27\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"简单基线进一步限制了“更复杂记忆必然更好”的解释。Qwen下最佳记忆方法宏准确率33.06%，BM25为32.50%；GLM下相应数值为33.61%和稠密检索的33.21%。GLM的压缩历史控制达到41.98%，高于该设置下所有八种记忆方法。诊断实验也显示，直接提供标注证据仍远非解决问题：Qwen3-235B-A22B的证据预言条件在各域为39.26%至58.25%，而直接提供习惯状态和所需行动的特权条件为98.41%至99.26%。这说明任务错误不只发生在找证据阶段；但预言条件额外提供了哪些信息并不相同，不能据此做严格的误差因果分解。\"\
    ,\n      \"evidence_ids\": [\"A28\", \"A29\", \"A30\"]\n    },\n    {\n      \"\
    kind\": \"inference\",\n      \"text\": \"## 证据命中仍不足以支撑完整决策\\n\\n来源可追踪的检索诊断把“找到相关会话”和“有充分依据选对行动”分开：六种Qwen3-32B方法的Hit@5为37.77%至41.44%，但标注证据召回率只有11.17%至13.89%；同时要求答对且至少命中一条证据的Joint\
    \ A+E为12.92%至16.20%。这提示，一个相关会话并不等于恢复了完整决策链，例如后来的选择可能需要早先的候选项定义，默认行为也可能受后续例外或替换制约。清洁证据上下文指标更低，但它检查的是被归因会话中是否包含非绑定证据，并不直接证明系统把未接受建议当成偏好。\"\
    ,\n      \"evidence_ids\": [\"A30\", \"A31\", \"A83\", \"A84\", \"A85\"]\n   \
    \ },\n    {\n      \"kind\": \"inference\",\n      \"text\": \"从工程评估角度看，这组结果支持把记忆质量拆成证据覆盖、状态随时间更新、适用边界保留和最终行动选择来诊断，而不是只看摘要长度或检索命中。作者的敏感性试验中，32名用户、954项探测上，调整检索数量或摄入块大小后准确率仍在24.83%至31.71%；A-MEM的检索数从2增至20时由29.23%升至31.21%，Letta由28.53%升至31.71%，较大摄入块也没有稳定收益。成本测量还显示，A-MEM构建累计54.59小时、107.80百万LLM\
    \ token，查询为13.24分钟、3.39百万token。由此可推测，记忆复用频率和更新成本应与准确率一起考察；这些记录并未给出匹配条件下的准确率—成本排名。\"\
    ,\n      \"evidence_ids\": [\"A33\", \"A34\", \"A35\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"评测历史是以任务对话种子和受控习惯图构造的合成纵向记录，不是原始数据参与者的真实长期行为记录；四个领域采用不同证据结构，领域平均分不能等同于单一、普适的习惯推断能力。旅行被作者明确定位为受控诊断集，而非独立隔离的泛化测试。\"\
    ,\n    \"记忆方法的上下文构造、预算和实现适配不同，若干方法通过基准适配器运行而非上游原生端到端设置；因此结果比较的是完整流水线，不能单独归因于记忆架构。模型规模比较同时改变记忆阶段与回答模型，且最大模型设置使用修订过的读取协议，也不是纯规模消融。人工审查覆盖抽样项目，依据预先选出的证据包判断可恢复性，不验证全历史检索质量；四选一准确率也不是概率校准或整体误个性化率。\"\
    ,\n    \"已阅读抽取全文，未独立复现实验。抽取文本虽覆盖全文与附录，仍不能核验图表布局、公式忠实呈现及未完整提取的图像内容；成本数据限于特定实现和32人队列，且不含嵌入计算、并行墙钟时间或完整数据集外推。\"\
    \n  ]\n}"
