result:
  text: "{\n  \"summary\": \"长期交互中的记忆难题，不只是找回用户做过什么，还要从零散证据判断行为默认值的适用范围、例外、时效，以及用户是否真正认可，再据此选择行动。作者提出\
    \ HABIT-Bench，以四个领域的合成纵向历史和四选一任务评测这一过程，并比较检索、压缩历史与多种记忆系统。最值得关注的是：主模型下最佳记忆方法宏准确率约三分之一，接近简单检索；直接提供标注证据仍有明显决策错误，而GLM设置中的压缩历史准确率达到41.98%。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 评测对象不是偏好回忆，而是有条件地使用习惯\\n\\n作者将习惯记忆定义为两个相连的任务：从跨会话、可能不完整的行为证据中推断默认做法，再判断该做法在当前情境和目标时间是否成立。反复出现的选择可能只适用于某类场景；一次例外不必然取代长期默认；助手提出但用户未接受的方案，也不能仅因留在历史里就成为用户偏好。因此，基准不要求系统采用特定的记忆表示，而考查记忆能否支持有证据、符合范围与时效的行动。\"\
    ,\n      \"evidence_ids\": [\"A7\", \"A8\", \"A13\", \"A48\"]\n    },\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"每项探测包含请求、四个候选行动、历史可见截止点和待判断的目标时间。评测依据目标时间有效的习惯状态——默认行为、适用条件、例外、时间效力及用户认可情况——解析出一个有效行动。于是，系统可能要把早先列出选项的会话与后来按序号作出的选择连接起来，也可能必须在历史目标时间忽略之后才发生的流程替换。作者举例说明，金融任务可以要求恢复2023年5月的工作流，即便较新的替代流程已经出现在可见历史中；保留“做了什么”和“何时生效”缺一不可。\"\
    ,\n      \"evidence_ids\": [\"A13\", \"A14\", \"A50\"]\n    },\n    {\n      \"\
    kind\": \"fact\",\n      \"text\": \"基准由114名合成用户、37,152个会话和3,328项探测组成，覆盖食品、金融、软件和旅行。食品任务强调重复选择、上下文对比与局部例外；金融和软件要求恢复用户确认的工作流、跟踪替换，并区分承诺、未解决案例和未接受建议；旅行则测试从历史恢复行为规则并将其用于新请求。各域都采用四选一界面，但证据结构并不相同：金融、软件偏向跨会话流程重建，旅行偏向规则恢复与组合应用，不能将总分理解为单一同质的习惯学习能力。\"\
    ,\n      \"evidence_ids\": [\"A15\", \"A16\", \"A44\", \"A49\", \"A50\", \"A52\"\
    , \"A53\", \"A55\", \"A58\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 合成历史把默认、例外与状态变化编进证据链\\n\\n作者以任务型对话数据提供任务种子和交互模式，再自行构造用户连续性、习惯状态、时间线及探测标签，并在相关会话之间穿插普通同领域任务。以食品为例，每名用户有七项习惯；稳定习惯的十个信号会分布在早、中、晚期，包含候选清单、后续确认、重复使用、边界观察、单次例外、未解决的演练和被拒绝的助手建议。例外只授权局部偏离，不等于长期改写默认。金融与软件则以有序候选清单和远隔的用户确认建立流程，并用替换链决定目标时间的有效状态。\"\
    ,\n      \"evidence_ids\": [\"A15\", \"A16\", \"A20\", \"A46\", \"A48\", \"A50\"\
    , \"A53\"]\n    },\n    {\n      \"kind\": \"fact\",\n      \"text\": \"探测选项都需满足请求的硬约束，区别在于是否恰当应用习惯；任务还会组合多个习惯、时间状态、来源判断或旧案例续接。金融的1,368项探测中，944项组合两个习惯、424项组合三个；软件680项中相应为464项和216项。作者对抽样项目进行盲审：审阅者先不看标准答案和系统预测，依据按时间排列的证据包判断是否存在唯一可支持行动，并评价证据充分性、范围、例外、选项平衡、自然度、来源及隐私；分歧由第三人裁决。该审查测试给定证据包时的可判定性，不测试人能否从完整长历史检索证据。\"\
    ,\n      \"evidence_ids\": [\"A17\", \"A20\", \"A21\", \"A25\", \"A51\", \"A54\"\
    , \"A59\", \"A60\", \"A61\", \"A63\", \"A64\", \"A67\"]\n    },\n    {\n     \
    \ \"kind\": \"author_claim\",\n      \"text\": \"## 共享回答器仍比较的是完整流水线\\n\\n每名用户有独立记忆，系统按时间顺序摄入会话，在探测时只访问可见截止点之前的历史；随后由同一比较设置中的回答器根据请求、四个选项和方法提供的记忆上下文作答。比较包括无记忆、压缩历史、近期会话、BM25、稠密与时间混合检索，以及六种单类记忆方法和两个多存储方法。主指标是各域四选一准确率的等权平均，随机选择为25%。主设置输入上限为40,000\
    \ token，先为请求、选项和模板留出预算；记忆超限时按方法给出的顺序保留前缀，请求和选项不截断。因此，方法特定预算和上下文构造都会影响结果，比较的是整体流程，而非只隔离记忆表示。\"\
    ,\n      \"evidence_ids\": [\"A18\", \"A22\", \"A23\", \"A24\", \"A25\", \"A68\"\
    , \"A75\", \"A78\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"\
    text\": \"作者报告，Qwen3-235B-A22B设置下八种记忆方法的宏准确率为27.01%至33.06%，GLM-5.3-Flash下为30.42%至33.61%；两组最高值均由A-MEM取得。收益明显依领域而异：Qwen下最佳记忆方法相对无记忆在食品提高20.32个百分点、旅行提高13.07个百分点，但金融的八种方法都低于无记忆的23.54%，软件最大提升只有1.03个百分点。GLM下金融、软件最佳值为28.29%和25.44%，旅行为54.62%。这表明跨会话、多习惯及时间状态组合仍难；领域差异本身不能确定错误究竟来自检索、状态恢复还是行动组合。\"\
    ,\n      \"evidence_ids\": [\"A25\", \"A26\", \"A27\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"复杂记忆并未稳定胜过简单基线：Qwen下最佳记忆方法为33.06%，BM25为32.50%；GLM下分别为33.61%和稠密检索的33.21%。GLM的压缩历史控制达到41.98%，超过该设置的所有记忆方法。诊断条件下，Qwen3-235B-A22B获得标注证据时，各域准确率为39.26%至58.25%；进一步直接提供私有习惯状态和所需行动时，则为98.41%至99.26%。这说明仅让回答器看到相关证据并不能消除大量错误，但两种诊断条件提供的信息不同，不能把差值当作严格的检索与推理误差因果分解。\"\
    ,\n      \"evidence_ids\": [\"A28\", \"A29\", \"A30\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"规模比较同样没有显示稳定的单调改善：A-MEM宏准确率从Qwen3-4B的29.41%升至235B-A22B的33.06%，而LightMem在14B时为28.14%，到32B降至25.04%，在235B设置为27.01%。作者还在独立的Qwen3-8B敏感性实验中，用每域8名用户、共32名用户和954项探测，测试适配后的A-MEM、Mem0、Letta和MemRL。检索数量实验固定摄入目标4096\
    \ token；摄入粒度实验固定k=5。各设置准确率为24.83%至31.71%，增加k能提高A-MEM和Letta的部分结果，但较大摄入块没有稳定收益。规模实验同时改变记忆阶段与回答模型，且235B读取协议不同，不能据此归因参数规模的因果作用。\"\
    ,\n      \"evidence_ids\": [\"A32\", \"A33\", \"A73\", \"A81\"]\n    },\n    {\n\
    \      \"kind\": \"inference\",\n      \"text\": \"## 命中相关会话不等于恢复完整决策链\\n\\n来源可追踪的Qwen3-32B检索诊断显示，六种方法的Hit@5为37.77%至41.44%，但标注证据召回率仅11.17%至13.89%；要求同时答对且命中至少一条证据的Joint\
    \ A+E为12.92%至16.20%。这提示单条相关记录未必覆盖决策所需的全部关系：后来的选择可能依赖早先的候选定义，默认做法也可能被后来的例外或替换限定。Clean\
    \ Grounded@5为5.49%至8.20%，它额外要求归因会话中没有标注为非绑定的材料，但不直接衡量系统是否错误采纳了未接受建议；各指标的适用样本也不同，不能拼成因果误差分解。\"\
    ,\n      \"evidence_ids\": [\"A30\", \"A31\", \"A83\", \"A84\", \"A85\"]\n   \
    \ },\n    {\n      \"kind\": \"inference\",\n      \"text\": \"从工程评估角度看，这些结果提示记忆质量应分解为证据覆盖、时间状态维护、边界保留和最终行动选择，而不宜只看摘要压缩或检索命中。成本试验中，A-MEM在同一32人队列上的记忆构建累计逐用户延迟为54.59小时、使用1.078亿LLM\
    \ token；后续查询为13.24分钟、339万token。这里的时间是逐用户延迟之和，不是并行运行墙钟时间，token包含LLM输入输出但不含嵌入。由此可推测，评估记忆复用价值时应同时记录构建、查询和更新开销；该试验只描述特定适配实现与队列，并未提供条件匹配的准确率—成本排名。\"\
    ,\n      \"evidence_ids\": [\"A33\", \"A34\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"历史是以任务对话种子和受控习惯图构造的合成记录，并非来源数据参与者的真实长期行为。四领域证据结构不同；旅行是受控诊断集，不是独立隔离的泛化测试。四选一准确率也不是概率校准或整体误个性化率。\"\
    ,\n    \"记忆方法的预算、上下文构造与实现适配各异，部分系统通过基准适配器运行；比较不能单独归因于记忆架构。模型规模实验同时改变记忆阶段模型和回答模型，最大模型还使用修订的读取协议。人工审查是基于抽样证据包的可恢复性检查，不验证完整历史上的人工检索能力。\"\
    ,\n    \"已阅读抽取全文，未独立复现实验。抽取覆盖所提供的正文与附录，但无法据此核验图表布局、公式忠实呈现或未完整提取的图像内容；成本测量限于特定实现和32人队列，不能外推为完整数据集或部署成本。\"\
    \n  ]\n}"
