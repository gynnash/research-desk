  - id: S34
    title: B.2 RAG Implementation in Prior Works
    text: 'All above results also raise a natural question: given its strong performance
      and simplicity, has the naive RAG been largely overlooked in prior memory methods
      and studies?


      Revisiting the papers from all of our evaluated baselines along with several
      other influential memory papers (Chhikara et al. (2025b), Rasmussen et al. (2025),
      Packer et al. (2024),


      Ma et al. (2026), Zhang et al. (2026a)), we find that only three of them (excluding
      originally RAG system like HippoRAG2) report RAG results (LightMem, PlugMem,
      and Mem-T), while the others primarily compare against other existing memory
      systems.


      Specifically, LightMem segments corpus by turn and retrieves using all-MiniLM-L6-v2
      embedding without specifying retrieval budget and other settings. PlugMem also
      uses turn-level chunks and retrieves using NV-Embed-v2 embedding (top-10). Mem-T
      adopts BGE-M3 with a top-5 retrieval, without specifying its chunking strategy.


      These observations suggest that the potential of naive RAG may have been underestimated
      and not fully realized in prior memory studies. With a widely-used standard
      hybrid retrieval and reranking pipeline, RAG becomes a strong baseline, highlighting
      the importance of adequately evaluating retrieval controls when assessing the
      added value of constructed memory.'
    location: https://arxiv.org/html/2610.34073v1#A2.SS2
