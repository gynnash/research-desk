  - id: S42
    title: Oracle raw context vs. oracle memory units
    text: Figure 13 extends Figure 3 to both Qwen backbones on LongMemEval-s and PersonaMem-v2.
      Some systems show a clear gap between oracle raw context and oracle memory units,
      e.g., SimpleMem, OpenViking and Memory-R2 on LongMemEval-s with Qwen3.5-4B and
      PlugMem on PersonaMem-v2 with Qwen3.6-27B, indicating information loss during
      memory processing. For MAGMA and LightMem, oracle-memory performance is close
      to oracle-raw performance yet much higher than their retrieval performance,
      suggesting that the evidence is preserved but harder to recover, which motivates
      the accessibility analysis.
    location: https://arxiv.org/html/2610.34073v1#A3.SS2.SSS0.Px3
  - id: S43
    title: Human Annotation of Information Preservation.
    text: For the micro-level analysis, we sample 500 raw turns from the corpus of
      three benchmarks and trace each to its corresponding memory unit(s), without
      restricting the samples to gold evidence. For one-to-many mappings, we present
      annotators with all corresponding memory units without LLM filtering, avoiding
      any model-based preselection before human judgment. Annotators compare the raw
      turn with the full set of memory units and label its information as fully preserved,
      partially missing, largely missing, or having no corresponding memory unit (Table
      2). Redundant memory units are allowed as long as the raw-turn information is
      fully preserved.
    location: https://arxiv.org/html/2610.34073v1#A3.SS2.SSS0.Px4
  - id: S44
    title: Overview
    text: 'We group the retrieval mechanisms of memory systems into four types in
      a representative but not exhaustive way: ranking scores memory units, e.g.,
      by embedding similarity, lexical scores or a reranker; matching selects units
      by keywords or metadata filters; expansion grows the retrieved set along the
      memory structure, e.g., via graph neighbors or personalized PageRank; and persistence
      always places part of the memory, such as a user profile, preferences, knowledge
      entries, etc. into the context. Table 14 lists the types each system uses.


      Table 14: Retrieval mechanisms used by each memory system at query time.


