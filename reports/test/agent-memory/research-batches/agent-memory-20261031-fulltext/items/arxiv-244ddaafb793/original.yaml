  - id: S45
    title: Iterative Retrieval Replay.
    text: 'Following the definitions of gold raw turns and gold memory units in Appendix
      C.2, each query has one or more gold raw turns and their corresponding gold
      memory units. We repeatedly run retrieval to measure how many rounds are needed
      to recover all gold memory units. After each round, the retrieved units are
      excluded from the remaining memory store before the next round. The process
      continues until all gold units are recovered or the round limit is reached.
      For most baselines, this process can be reproduced offline from the stored memory
      and retrieval state. While for those systems involving graph expansion or LLM-based
      query refinement, we need to rerun the retrieval process.


      Figure 5 shows that memory systems generally recover fewer gold units in the
      first round than RAG.'
    location: https://arxiv.org/html/2610.34073v1#A3.SS3.SSS0.Px2
  - id: S46
    title: Similarity Drift.
    text: 'At the micro level, we compare \mathrm{sim}(q,g_{\mathrm{raw}}) with \mathrm{sim}(q,g_{\mathrm{mem}})
      for each gold raw turn and its gold memory unit(s). This analysis is only indicative,
      since each system retrieves within its own memory store, so absolute similarity
      values are not directly comparable across systems. Some memory systems also
      do not always rank units by embedding similarity only, so we focus on the within-system
      shift from raw evidence to its memory representation.


      We report both point-wise changes and overall similarity distributions. For
      point-wise analysis, when multiple units correspond to the same raw turn, we
      use their median similarity to reduce the influence of extreme values.'
    location: https://arxiv.org/html/2610.34073v1#A3.SS3.SSS0.Px3
