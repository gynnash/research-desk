  \ we show some representative case studies for both Memory Benefit (D.1) and Memory\
  \ Tax (\n\nD.2\n\n, D.3\n\n), and also some comparison examples of benefit and tax\
  \ within the same memory mechanism to directly show the dual nature of memory (D.4).\n\
  [S58] D.1 Memory Benefit (https://arxiv.org/html/2610.34073v1#A4.SS1)\nA98: Even\
  \ the main results show memory underperform RAG in the overall performance in many\
  \ cases, memory systems can still answer some questions correctly where naive RAG\
  \ fails and we still need them in such scenarios. We inspect a sample of such questions\
  \ and group the wins of memory into several representative types (Figures 18 and\
  \ 19):\n\nFocused atomic extraction: each fact becomes a short unit, so the gold\
  \ facts fit into the retrieved context, while RAG’s top- k is filled by long chunks\
  \ that other irrelevant information, making the evidence hard to recover.\n\nMulti-hop\
  \ linking: facts from different sessions are retrieved together and combined, while\
  \ for naive RAG the evidences are scattered.\n\nImplicit preference exposure: a\
  \ trait mentioned only in passing becomes an explicit unit in the memory.\n\nTemporal\
  \ anchoring: relative time expressions are anchored to absolute dates during construction.\n\
  \nExplicit forgetting: a forget request updates the stored state by removing or\
  \ deactivating the targeted content.\n\nProcessing for heterogeneous inputs: non-dialogue\
  \ inputs such as code diffs are described in natural language, making it easier\
  \ to be recalled with semantic retrieval.\n\nFigure 18: Examples of memory benefit:\
  \ (a) focused atomic extraction, (b) multi-hop linking, and (c) implicit preference\
  \ exposure.\n\n\nA99: Figure 19: Examples of memory benefit-2: (d) temporal anchoring,\
  \ (e) explicit forgetting, and (f) processing for heterogeneous inputs.\n[S59] D.2\
  \ Memory Tax - Faithfulness (https://arxiv.org/html/2610.34073v1#A4.SS2)\nA100:\
  \ Figures 23 to 23 show examples from the annotation in Section 4.2, with varying\
  \ degrees of information loss:\n\nNo Loss.\n\nPartial Loss.\n\nMajor Loss.\n\nNo\
  \ Corresponding Memory Unit.\n\nFigure 20: Faithfulness case studies-1.\n\nFigure\
  \ 21: Faithfulness case studies-2.\n\nFigure 22: Faithfulness case studies-3.\n\n\
  Figure 23: Faithfulness case studies-4.\n[S60] D.3 Memory Tax - Accessibility (https://arxiv.org/html/2610.34073v1#A4.SS3)\n\
  A101: Figure 24 shows examples from the round replay in Section 4.3. In each case\
  \ the evidence is still preserved in memory, but it is returned in a later round\
  \ than the raw turns. The badges give the round in which a unit is first retrieved\
  \ and the maximum number of rounds for that store. We observe three recurring patterns:\n\
  \nFragmenting: one raw turn is split into several units, and a unit carrying a necessary\
  \ part of the evidence ranks far behind the others.\n\nDiluting: the evidence is\
  \ wrapped in unrelated or additional content, such as a long profile or an elaborated\
  \ note, which weakens its match with the query.\n\nRephrasing: the evidence is rewritten,\
  \ sometimes with a slight shift in meaning, and no longer matches the query as well\
  \ as the raw wording.\n\nFigure 24: Examples of accessibility degradation: (a) fragmenting,\
  \ (b) diluting, and (c) rephrasing.\n[S61] D.4 Direct Examples for the Double-edged\
  \ Memory Mechanisms (https://arxiv.org/html/2610.34073v1#A4.SS4)\nA102: The same\
  \ structure or mechanism of a memory system can help on one question and hurt on\
  \ another. Figures 25 and 26 pair, for each mechanism, a question that the memory\
  \ system answers correctly while RAG (1rd) fails (memory benefit) with a question\
  \ where the same mechanism makes it fail while RAG (1rd) succeeds (memory tax).\n\
  \nFigure 25: Direct examples of the dual nature of memory-1: the same mechanism\
