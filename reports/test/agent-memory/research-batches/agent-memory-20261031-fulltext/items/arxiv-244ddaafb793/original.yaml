      We vary one component at a time while keeping the rest at the default, along
      these dimensions:


      Chunking method:


      buffer-merged chunks with a 1024-chars buffer [default],


      a smaller 512-chars buffer (with long turns split into 4096-chars windows);


      turn-level chunks, where each conversation turn or observation step forms its
      own chunk;


      streaming chunks, where the history is cut into fixed 1024-chars windows with
      a 256-chars overlap, regardless of turn boundaries.


      Retrieval method:


      hybrid retrieval [default];


      BM25 only;


      dense embedding retrieval only (Emb-Only), both without reranking.


      Embedding model (ordered by model size):


      Qwen3-Embedding-0.6B [default]


      all-MiniLM-L6-v2 (0.02B) (Wang et al., 2020)


      BGE-Large-en-v1.5 (0.3B) (Xiao et al., 2024)


      pplx-embed-v1 (4B) (Eslami et al., 2026)


      NV-Embed-v2 (8B) (Lee et al., 2025).


      Reranker (ordered by model size):


      Qwen3-Reranker-0.6B [default]


      BGE-Reranker-Large (0.6B) (Liu et al., 2025)


      Jina-Reranker-v3 (0.6B) (Wang et al., 2025)


      Qwen3-Reranker-4B (Zhang et al., 2025b).


      All other settings, including the retrieval top- k and the answer prompt, follow
      the default configuration.


      The full results are shown in Table 6.


      Across these ablations, naive RAG remains strong under a range of configurations,
      suggesting that its performance is not driven by any particular component, careful
      tuning, or a lucky configuration. Most variants stay within a few points of
      the default across settings. The largest drops occur when fixed-size windows
      split turns (streaming-chunk) or retrieval relies solely on lexical matching
      (BM25), yet even these variants remain competitive with several memory systems
      in Table 1.'
