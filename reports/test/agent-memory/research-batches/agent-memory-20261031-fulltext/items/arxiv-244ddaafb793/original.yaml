  [S20] A.1 Benchmark Details (https://arxiv.org/html/2610.34073v1#A1.SS1)\nA50: Table\
  \ 4 summarizes the evaluation data.\n[S21] LongMemEval-s ( Wu et al., 2025 ) . (https://arxiv.org/html/2610.34073v1#A1.SS1.SSS0.Px1)\n\
  A51: Each question has its own chat history of about 50 sessions, with a few evidence\
  \ sessions hidden among distractors. We use the full set, except a 100-corpus subset\
  \ stratified by question type for GPT-5.6 Luna.\n[S22] PersonaMem-v2 ( Jiang et\
  \ al., 2025b ) . (https://arxiv.org/html/2610.34073v1#A1.SS1.SSS0.Px2)\nA52: Each\
  \ corpus is one simulated user’s chat history (128k-token variant), with four-way\
  \ MCQs on the user’s implicit persona and preferences. We evaluate a 20% subset\
  \ (40 of 200 corpora).\n[S23] MINT-Eval ( Lee et al., 2026 ) . (https://arxiv.org/html/2610.34073v1#A1.SS1.SSS0.Px3)\n\
  A53: Each corpus is an ordered stream of steps from one of four sub-domains, testing\
  \ memory under multi-target interference. We draw a 10% stratified sample (60 of\
  \ 595 corpora).\n[S24] Vanilla. (https://arxiv.org/html/2610.34073v1#A1.SS2.SSS0.Px1)\n\
  A54: These references use no retrieval or memory building. No Context answers from\
  \ the question alone.\n\nFull Context provides the entire raw corpus in chronological\
  \ order, truncating the earliest units if it exceeds the model’s context window.\n\
  \nGold Context provides only the gold evidence (raw turns supporting the answer)\
  \ for each question, serving as an oracle reference. We omit this baseline on MINT-Eval,\
  \ where author-annotated and verified gold evidence is available for only about\
  \ half of the questions (Appendix C.2).\n[S25] Naive RAG. (https://arxiv.org/html/2610.34073v1#A1.SS2.SSS0.Px2)\n\
  A55: The raw corpus is first chunked and indexed. Chunking follows conversation\
  \ turns (or observation steps) and never crosses session boundaries. Short turns\
  \ are greedily merged into chunks of about 1024 characters, with the last turn carried\
  \ over as overlap. Longer turns remain separate, while turns exceeding 8192 characters\
  \ are split into 8192-character windows with 1024-character overlap. Each chunk\
  \ is prefixed with a session date-time header.\n\nAt question time, BM25 and dense\
  \ retrieval (Qwen3-Embedding-0.6B) independently return their top- k chunks. Their\
  \ deduplicated union is reranked by Qwen3-Reranker-0.6B, and the top k chunks, roughly\
  \ half of the candidate pool, are passed to the backbone with the shared QA prompt.\n\
  \nFor RAG (2-round), we add a second retrieval round. The backbone checks whether\
  \ the first-round chunks suffice and, if not, issues a follow-up query against the\
  \ remaining pool. Chunks from both rounds are used for answering.\n[S26] Memory\
  \ systems. (https://arxiv.org/html/2610.34073v1#A1.SS2.SSS0.Px3)\nA56: We group\
  \ the memory systems as follows:\n\nFlat store keeps memory as a flat collection\
  \ (extracted facts, notes, etc.), indexed for similarity search: A-Mem (Xu et al.,\
  \ 2026a), SimpleMem (Liu et al., 2026b), MemOS (Li et al., 2025b).\n\nHier/Lifecycle\
  \ manages memory across tiers that differ in lifetime or abstraction, and moves,\
  \ consolidates or updates units between them over time: MemoryOS (Kang et al., 2025),\
  \ LightMem (Fang et al., 2026a), and OpenViking (Volcengine, 2026).\n\nGraph-based\
  \ links memory units through explicit relations (e.g., entities, events or causal\
  \ edges), and retrieval can expand along them: HippoRAG2 (Gutiérrez et al., 2025),\
  \ PlugMem (Yang et al., 2026a), MAGMA (Jiang et al., 2026a).\n\nTrained Policy learns\
  \ how memory is written, updated and used through reinforcement learning rather\
  \ than a hand-designed pipeline, whatever the store layout (hierarchical for Mem-T,\
  \ flat for Memory-R2): Mem-T (Yue et al., 2026), Memory-R2 (Yan et al., 2026b).\n\
  \nFor these two systems, memory construction, update and retrieval are carried out\
  \ by their own policy models (Qwen3-4B for Mem-T, Qwen2.5-7B-Instruct for Memory-R2),\
  \ which we keep as released, replacing only the QA model with our backbones.\n\n\
