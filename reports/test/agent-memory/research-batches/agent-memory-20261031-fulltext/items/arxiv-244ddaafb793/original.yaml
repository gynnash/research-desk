      (1) MemOS: we disable the retrieval post-processing of its official evaluation
      (relativity threshold of 0.45 and MMR), whose threshold is calibrated for its
      original embedding model and overly strict with ours, and enable the cosine
      reranking that degenerates to constant scores by default. Both changes favor
      MemOS (Table 10).


      (2) SimpleMem: its default ingestion window of 40 utterances is set for LoCoMo
      and packs unrelated sessions together elsewhere, so we use 10 on all three benchmarks.


      (3) LightMem: its official LongMemEval-s script uses user turns only. We compare
      this setting with user+assistant turns on LongMemEval-s and find the latter
      performs better (Table 10), so we use it across all three benchmarks.


      (4) Mem-T: we stop the policy model after retrieval, before it answers at finish,
      and let the shared QA backbone answer.


      (5) Memory-R2: we raise the output limits of both construction stages (2048
      and 1024 tokens) to 4096, its training length, since the defaults truncate about
      12% of the calls on LongMemEval-s and drop whole blocks of memory operations.'
