  - id: S60
    title: D.3 Memory Tax - Accessibility
    text: 'Figure 24 shows examples from the round replay in Section 4.3. In each
      case the evidence is still preserved in memory, but it is returned in a later
      round than the raw turns. The badges give the round in which a unit is first
      retrieved and the maximum number of rounds for that store. We observe three
      recurring patterns:


      Fragmenting: one raw turn is split into several units, and a unit carrying a
      necessary part of the evidence ranks far behind the others.


      Diluting: the evidence is wrapped in unrelated or additional content, such as
      a long profile or an elaborated note, which weakens its match with the query.


      Rephrasing: the evidence is rewritten, sometimes with a slight shift in meaning,
      and no longer matches the query as well as the raw wording.


      Figure 24: Examples of accessibility degradation: (a) fragmenting, (b) diluting,
      and (c) rephrasing.'
    location: https://arxiv.org/html/2610.34073v1#A4.SS3
  - id: S61
    title: D.4 Direct Examples for the Double-edged Memory Mechanisms
    text: 'The same structure or mechanism of a memory system can help on one question
      and hurt on another. Figures 25 and 26 pair, for each mechanism, a question
      that the memory system answers correctly while RAG (1rd) fails (memory benefit)
      with a question where the same mechanism makes it fail while RAG (1rd) succeeds
      (memory tax).


      Figure 25: Direct examples of the dual nature of memory-1: the same mechanism
      of a memory system brings memory benefit on one question (left) and memory tax
      on another (right).


      Figure 26: Direct examples of the dual nature of memory-2: the same mechanism
      of a memory system brings memory benefit on one question (left) and memory tax
      on another (right).'
    location: https://arxiv.org/html/2610.34073v1#A4.SS4
