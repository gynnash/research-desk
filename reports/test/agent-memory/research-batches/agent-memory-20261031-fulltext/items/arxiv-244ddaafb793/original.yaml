  \n21.5 ( - 11.6)\n\n22.9 ( - 11.6)\n\n§LongMemEval is relatively retrieval-friendly,\
  \ while the other two involve more complex demands, see §4.5.\n\n†Interestingly,\
  \ on PersonaMem-v2, 5.6-luna usually scores lower than Q3.6-27B, opposite of the\
  \ other two benchmarks, see A.5.\n\nFigure 1: Pareto plot of Accuracy vs. Token-cost.\
  \ Bubble size is the memory store size in tokens.\n\n\nA9: Memory is increasingly\
  \ used across different scenarios. We begin with its common application, personal\
  \ agent memory or conversational memory, and later extend to more domains (§5.1\
  \ and §5.2).\n\nBenchmarks.\n\nWe evaluate on LongMemEval-s (Wu et al., 2025), PersonaMem-v2\
  \ (Jiang et al., 2025b), and MINT-Eval (Lee et al., 2026). Due to cost constraints,\
  \ we evaluate 20% of PersonaMem-v2 and 10% of MINT-Eval. All subsets are selected\
  \ with stratified sampling over question types. These benchmarks span direct recall\
  \ to more complex queries involving aggregation or multi-interference reasoning.\
  \ Appendix A.1 shows the full details.\n\nBaselines.\n\nWe group the memory systems\
  \ by how they organize what they store, and take open-source representatives of\
  \ each group.\n\nFlat store: A-Mem (Xu et al., 2026a),\n\nSimpleMem (Liu et al.,\
  \ 2026b),\n\nMemOS (Li et al., 2025b).\n\nHier/Lifecycle: MemoryOS (Kang et al.,\
  \ 2025), LightMem (Fang et al., 2026a), OpenViking (Volcengine, 2026).\n\nGraph-based:\n\
  \nHippoRAG2 (Gutiérrez et al., 2025),\n\nPlugMem (Yang et al., 2026a), MAGMA (Jiang\
  \ et al., 2026a).\n\nTrained policy: Mem-T (Yue et al., 2026), Memory-R2 (Yan et\
  \ al., 2026b).\n\nWe use RAG over the raw corpus as the main memory-free baseline,\
  \ with both single-round (1rd) and two-round (2rd) variants. We also include several\
  \ vanilla references, including No Context, Gold Context, etc. Appendix A.2 shows\
  \ the full details.\n\n\nA10: Implementation details.\n\nWe run every system on\
  \ three backbones, Qwen3.5-4B, Qwen3.6-27B and GPT-5.6-luna(low), sharing the same\
  \ embedding model, Qwen3-Embedding-0.6B. Answers are scored by an LLM-as-Judge backed\
  \ by Qwen3.6-27B, with judge prompts in Appendix F.2. Alongside accuracy we report\
  \ several cost metrics including token cost, end-to-end wall-clock time, number\
  \ of LLM calls, and memory storage size.\n\nSince memory granularity and storage\
  \ capacity vary substantially across systems, a fixed top- k can correspond to very\
  \ different amounts of retrieved information. For a fair comparison, we align retrieval\
  \ budgets using Retrieval Scope (RS), defined as the tokens in the memory units\
  \ exposed to the LLM from retrieval through answering, normalized by the total tokens\
  \ within the system’s retrievable store. We tune top- k for each system (increasing\
  \ it from the default in most cases) so its Retrieval Scope is roughly no lower\
  \ than that of RAG (1-round), while roughly comparable across systems. The exception\
  \ includes systems that contain only a few memory units, which retains a fixed top-\
  \ k .\n\nSee full details in Appendix A.3 and A.4.\n\nFigure 2: Venn plot for per-query\
  \ correction comparison between memory system and RAG (1rd).\n\nFigure 3: Original\
  \ performances vs.\nA11:  w/ gold memory units (bars), and the memory tax (quantified\
  \ in scores) before and after having gold memory units (boxed numbers).\n[S5] 3.2\
  \ Results (https://arxiv.org/html/2610.34073v1#S3.SS2)\nA12: Table 1 reports the\
  \ results of all the baselines on three benchmarks, and Figure 1 plots the cost-performance\
  \ trade-off more directly. Appendix E.1 to E.3 gives the full result. Given the\
  \ surprisingly strong performance of naive RAG, we further validate our baseline\
  \ setup in Appendix B.1 to B.3, including ablations on the RAG, reviewing RAG baselines\
  \ in prior works, and validating the fairness of memory configurations. Overall,\
  \ many memory systems fail to beat RAG in many cases, motivating a closer analysis\
  \ in the next section.\n[S6] 4.1 Overview (https://arxiv.org/html/2610.34073v1#S4.SS1)\n\
  A13: §3.2 shows many memory systems underperform the naive RAG despite substantially\
  \ higher costs. Since RAG accesses the same raw history with minimal processing,\
  \ it provides a reference for assessing the net value of building memory.\n\nWe\
  \ dissect this net value through a per-query comparison with RAG (1rd) (Figure 3).\
  \ Memory does solve some queries RAG misses, benefiting from additional organization\
  \ or processing, while losing others that RAG already solves, where evidence may\
  \ become lost, obscured, or harder to access after memory processing.\n\nThese two\
  \ outcomes can be understood through the inevitable deviations introduced by memory\
  \ from the raw history, as any nontrivial memory process can change how information\
  \ is structured, preserved, or accessed.\n\nThese deviations give memory its dual\
  \ nature.\n\nThey are originally intended to better serve the tasks, yet may also\
  \ have unintended harmful effects due to particular design choices, giving rise\
  \ to Memory Benefit and Memory Tax.\n\nTheir balance determines the net value of\
  \ memory, and for the above cases, the tax outweighs the benefit.\n\nThese quantities\
  \ are reference-dependent, and throughout this work are defined relative to the\
  \ naive RAG.\n\nTable 2:\n\nAnnotations for degree of information loss for sampled\
  \ facts (%): no loss (NL), partial loss (PL), major loss (ML), and no memory unit\
  \ (NU).\n\nMethod\n\nNL\n\nPL\n\nML\n\nNU\n\nMethod\n\nNL\n\nPL\n\nML\n\n\nA14:\
  \ NU\n\nMemOS\n\n85.8\n\n9.0\n\n2.4\n\n2.8\n\nOpenViking\n\n39.4\n\n9.6\n\n13.0\n\
  \n38.0\n\nSimpleMem\n\n65.6\n\n27.6\n\n2.2\n\n4.6\n\nMAGMA\n\n93.6\n\n6.2\n\n0.2\n\
