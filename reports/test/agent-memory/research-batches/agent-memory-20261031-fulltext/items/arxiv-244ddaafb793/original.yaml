      additional processing helps as shown in several typical types in Appendix D.1,
      it largely aligns with the intended value of memory, while memory tax is underexplored.
      Its effects are visible in failed queries, but these outcomes do not explain
      how the losses arise within the memory. We next examine internal factors behind
      the memory tax.'
