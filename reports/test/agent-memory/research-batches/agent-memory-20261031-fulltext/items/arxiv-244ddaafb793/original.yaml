  \nFramePack\n\nvisual latents\n\n.217\n\n.312\n\n.279\n\n.303\n\nHyDRA\n\nmem. tokens\n\
  \n.320\n\n.319\n\n.355\n\n.326\n\nFigure 9: Example frame sequences from three evaluation\
  \ scenes for testing long-horizon scene consistency.\n[S14] 6 Design Implications\
  \ (https://arxiv.org/html/2610.34073v1#S6)\nA26: In this section, we derive some\
  \ simple yet effective design implications for reducing or compensating for the\
  \ memory tax. We focus on improvements that can be used on existing memory systems\
  \ without introducing another new architecture, and deliberately exclude common\
  \ test-time scaling techniques like retrieval depth / width expansion, query refinement,\
  \ using stronger backbones, etc.\n\nAs we discussed above, building memory can introduce\
  \ changes and deviations from the raw history about how information is preserved\
  \ and accessed through diverse memory operations. While no single design can predict\
  \ and fit all tasks needs, and the harmful deviations are difficult to eliminate\
  \ entirely, a more promising way to reduce memory tax is to make such deviations\
  \ recoverable, preserving a lightweight path back to the source history when memory\
  \ becomes insufficient.\n\nAs a simple proof of concept, we retrieve from source\
  \ history alongside normal memory retrieval and jointly rerank them before QA. This\
  \ lightweight recovery path can restore evidence lost during construction or missed\
  \ in access. Results in Table show consistent improvements and reduction of memory\
  \ tax across several memory systems.\n\nMemory tax can only be visible in actual\
  \ use, when relevant evidences become harder to access and are recovered only after\
  \ deep search.\nA27:  Such retrieval experience directly reflects the harmful deviations\
  \ memory introduced, and can in turn provide feedback to improve future memory access,\
  \ creating a recursive loop between memory access and construction.\n\nInspired\
  \ by progress on recursive self-improvement (RSI) (Zhang et al., 2026c; Karten et\
  \ al., 2026; Zhang et al., 2026d), where a system is expected to “improve how it\
  \ improves”, memory can similarly “remember how it remembers”.\n\nPast queries,\
  \ evidences, and retrieval paths can themselves be source materials for memory,\
  \ and this is particularly useful for multi-round retrieval, since evidence found\
  \ in deeper rounds can then be accessed directly by similar information needs.\n\
  \nIt also offers a new dimension of test-time scaling at query-side, allowing inter-query\
  \ scaling beyond a single query.\n\nAs a simple proof of concept, we treat past\
  \ queries and retrieved evidence as additional inputs into memory store, making\
  \ them available for future retrieval. Results in Table also validate its effectiveness.\n\
  \nMany methods build memory ahead of time (AoT) before future queries come. As we\
  \ discussed before, memory makes deviations on the raw history, with the intention\
  \ of better serving task queries, but may also add implicitly harmful effects. Without\
  \ knowing future demand accurately, it is unclear what kind of deviations will be\
  \ beneficial.\nA28:  To cover a broader range of possible queries, AoT systems may\
  \ need to process more information in more elaborate ways, making it increasingly\
  \ expensive.\n\nThe opposite is just-in-time (JiT) memory (Yan et al., 2025a; Zhou\
  \ et al., 2026b; Yan et al., 2026a), which delays memory operations until queries\
  \ arrive. With query already known, JiT can choose more targeted forms and directions\
  \ of deviation to maximize the memory benefit and minimize the memory tax, but moves\
  \ computation to the online part and increases user-facing latency, to which the\
  \ users are highly sensitive.\n\nA middle ground is to model the future demand.\n\
  \nIn personal agent settings, task queries are not purely random.\n\nPast interests,\
  \ habits, and access patterns provide a prior over what information is likely to\
  \ matter, and hence what kinds of deviations that memory introduces are likely useful.\n\
  \nSuch signals may help construction allocate effort more selectively, and reduces\
  \ harmful deviations, without paying the full online cost of JiT. From this view,\
  \ memory can partly be seen as an implicit recommendation system that estimates\
  \ future relevance of past information.\n\nExploring this perspective in real-world\
  \ personal-agent settings may be a promising direction for future exploration.\n\
  [S15] Long-Term Agent Memory. (https://arxiv.org/html/2610.34073v1#S7.SS0.SSS0.Px1)\n\
  A29: Long-term memory has become an important component for long-horizon agents,\
  \ supporting the retention of specific information, past interactions, and task\
  \ experience. Existing systems explore a variety of memory representations, including\
  \ relatively flat stores (Liu et al., 2026b; Yang et al., 2026b; Meng et al., 2026),\
  \ hierarchical organizations, from short-/long-term memory layers (Kang et al.,\
  \ 2025; Fang et al., 2026a) to filesystem-tree designs in recent industrial systems\
  \ (Volcengine, 2026; Tencent-Cloud, 2026), and graph-based representations (Jiang\
  \ et al., 2026a; Yang et al., 2026a). Another line of variation lies in how memory\
  \ operations are governed. Some systems rely on predefined harness for writing,\
  \ updating, and using memories, while others allow an LLM agent to decide these\
  \ operations dynamically (Wang and Chen, 2025; Xu et al., 2026a; EverMind-AI, 2026)\
  \ or explore learned memory policies (Yan et al., 2026c; Yu et al., 2026a; Yan et\
  \ al., 2026b).\n\nIn this work, we study these memory systems through the lens of\
  \ their net value, examining the gains and the losses introduced by memory operations.\n\
  [S16] Empirical Studies of Agent Memory. (https://arxiv.org/html/2610.34073v1#S7.SS0.SSS0.Px2)\n\
  A30: Recent empirical studies examine agent memory from different perspectives,\
  \ including how memory systems are designed and deployed, their performance-cost\
  \ trade-offs, and where computation and time are spent (Jiang et al., 2026b; Omri\
  \ et al., 2026; Zhou et al., 2026a; Huang et al., 2026; Wolff and Bennati, 2026).\
  \ These works mainly characterize existing memory designs and their empirical behavior,\
  \ but our work focuses on the net value introduced by memory processing itself.\
  \ We introduce memory tax to characterize its losses relative to direct retrieval,\
  \ analyze how such losses arise from both system and evaluation sides, and derive\
  \ system-agnostic design implications.\n[S17] 8 Conclusion (https://arxiv.org/html/2610.34073v1#S8)\n\
  A31: We revisit the agent memory by studying its net value over direct retrieval\
  \ from raw history.\n\nAcross the evaluation on three benchmarks with many retrieval-friendly\
  \ queries alongside some complex ones, many memory methods underperform naive RAG,\
  \ indicating a negative net value in these settings.\n\nWe dissect this net value\
  \ into memory benefit and tax, showing memory can improve how past information is\
  \ organized and used, but may also have harmful effects.\n\nWe analyze memory tax\
  \ from both system sides and evaluation settings, and generalize it to broader scenarios\
  \ like experiential memory and world-model memory.\n\nWe hope memory tax can shift\
  \ more attention from standalone performance to the net value of memory, and encourages\
  \ more reliable memory design and evaluation.\n[S18] Limitations (https://arxiv.org/html/2610.34073v1#Sx1)\n\
  A32: Given the rapid development of this field, our baseline selection is representative\
  \ rather than exhaustive. We also follow official configurations wherever possible,\
  \ though further system-specific tuning may yield better performance.\n\nOur benchmarks\
  \ are primarily static, offline, and English-language, leaving long-lived deployments\
  \ with interleaved queries and multilingual interactions underexplored. Extending\
  \ the analysis to other forms of memory, such as omnimodal, latent, and parametric\
  \ memory, is also left for future work.\n\nOur evaluation is limited by computational\
  \ and API-calling cost. We do not include stronger frontier models beyond GPT-5.6\
  \ Luna (low), and use stratified subsets for some benchmarks (20% of PersonaMem-v2,\
  \ 10% of MINT-Eval, and 20% LongMemEval-s questions for GPT-5.6 Luna).\n[S19] References\
