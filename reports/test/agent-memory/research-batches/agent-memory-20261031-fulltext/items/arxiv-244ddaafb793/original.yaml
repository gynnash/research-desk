  - id: S48
    title: C.5 Benchmark Headroom Further Exposes the Memory Tax
    text: 'We probe the benchmark headroom with the retrieval-only controls on a broader
      set of long-term memory benchmarks, listed here in order of release date (including
      the three benchmarks used in our main experiments): LoCoMo (Maharana et al.,
      2024), LongMemEval-s and LongMemEval-m (Wu et al., 2025), PersonaMem-v1 (Jiang
      et al., 2025a), MemoryAgentBench (Hu et al., 2025b), HaluMem-Medium (Chen et
      al., 2026a), PersonaMem-v2 (Jiang et al., 2025b), MINT-Eval (Lee et al., 2026),
      KnowMe-Bench (Wu et al., 2026a), RealMem (Bian et al., 2026), EverMemBench-MCQ
      (Hu et al., 2026a), AMA-Bench (Zhao et al., 2026), ES-MemEval (Chen et al.,
      2026e), and the multimodal benchmarks Mem-Gallery (Bei et al., 2026) and WorldMemArena
      (Liu et al., 2026a).'
    location: https://arxiv.org/html/2610.34073v1#A3.SS5
  - id: S49
    title: Simple baselines.
    text: 'We run the four naive baselines of Section 4.5. For IDF-keyword, we select
      for each query the two terms with the highest inverse document frequency (IDF)
      in the corpus and prioritize chunks containing both terms, followed by those
      containing either one. Within each tier, chunks are sampled uniformly at random
      until the top- k budget is filled.


      All retrieval baselines follow the default settings of Section 3.1. Their top-
      k and retrieval scope are listed in Table 15.


      Figure 16: Simple retrieval baselines across benchmarks with Qwen3.6-27B.


      marks multimodal benchmarks.'
