  A81: Following the definitions of gold raw turns and gold memory units in Appendix\
  \ C.2, each query has one or more gold raw turns and their corresponding gold memory\
  \ units. We repeatedly run retrieval to measure how many rounds are needed to recover\
  \ all gold memory units. After each round, the retrieved units are excluded from\
  \ the remaining memory store before the next round. The process continues until\
  \ all gold units are recovered or the round limit is reached. For most baselines,\
  \ this process can be reproduced offline from the stored memory and retrieval state.\
  \ While for those systems involving graph expansion or LLM-based query refinement,\
