  \n7\n\n\\sim 129k\n[S27] Performance. (https://arxiv.org/html/2610.34073v1#A1.SS3.SSS0.Px1)\n\
  A58: We score answers with an LLM-as-Judge backed by Qwen3.6-27B and deliberately\
  \ avoid lexical-overlap metrics such as F1 or BLEU, which are sensitive to surface\
  \ form and can penalize a correct but rephrased answer.\n\nFor general QA, the judge\
  \ checks the generated answer against the gold answer. For MCQ, we match the parsed\
  \ option exactly and send unparsable responses to the judge.\n\nJudge prompts are\
  \ in Appendix F.2, and Table 5 reports the judge reliability against human labels.\n\
  \nTable 5: Reliability of the LLM-as-Judge against human judgments, measured as\
  \ the fraction of items on which the judge and human labels match.\n\nLongMemEval-s\n\
  \nPersonaMem-v2\n\nMINT-Eval\n\nAgree. (%)\n\n95.1%\n\n100.0%†\n\n97.3%\n\n†PersonaMem-v2\
  \ is MCQ, so answers are scored by the option letter alone, matching the human labels\
  \ on every item.\n[S28] Cost. (https://arxiv.org/html/2610.34073v1#A1.SS3.SSS0.Px2)\n\
  A59: We report the following cost metrics for every system–benchmark–backbone triple.\n\
  \nToken cost. All input and output LLM tokens, summed over ingestion (memory construction,\
  \ maintenance, etc.) and QA (retrieval, intermediate reasoning, answering, etc.).\n\
  \nEnd-to-end wall-clock time (Equivalent single-concurrency time). Systems run with\
  \ different concurrency, so we normalize each runtime, covering construction, retrieval\
  \ and answering, to its single-concurrency equivalent in hours. Times under the\
  \ same backbone are broadly comparable, though endpoint throughput can still fluctuate.\n\
  \nLLM calls. The total number of LLM calls across ingestion and QA, which, unlike\
  \ wall-clock time, does not depend on endpoint load.\n\nMemory store size. The total\
  \ tokens across all stored memory units after ingestion, averaged over corpora,\
  \ reflecting how much a system expands or compresses the raw corpus.\n[S29] Retrieval\
  \ scope. (https://arxiv.org/html/2610.34073v1#A1.SS4.SSS0.Px1)\nA60: In existing\
  \ comparisons of memory systems, the retrieval top- k used at QA time is usually\
  \ inherited from each repository’s default configuration or aligned with that of\
  \ the proposed system.\n\nSince memory units vary widely across systems, from a\
  \ single turn to a merged chunk or session summary, the same top- k can span from\
  \ a few hundred to tens of thousands of tokens.\n\nSo we measure Retrieval Scope\
  \ (RS), defined as the fraction of tokens in memory units seen by the LLM from retrieval\
  \ through QA over the total tokens in all memory units within the system’s retrieval\
  \ range. We average this ratio over questions and report it as a percentage.\n\n\
  Tokens are counted with the Qwen3.6-27B tokenizer.\n\nWe adjust each system’s top-\
  \ k so that its RS is no lower than that of “RAG (1-round)”, while keeping RS reasonably\
  \ comparable across systems.\n\nWe further clarify what counts as “the docs LLM\
  \ sees” in RS. This depends on the LLM’s involvement in retrieval, which falls into\
  \ three levels: no involvement, where retrieval relies entirely on embeddings, indices,\
  \ or other non-LLM components. pre-retrieval involvement, where LLM rewrites query\
  \ or extracts keywords but reads no retrieved units. retrieval-time involvement,\
  \ where the LLM reads retrieved units, e.g., to decide whether further retrieval\
  \ is needed, reformulate the query, or assess whether a unit is useful.\n\n\nA61:\
  \ Only level exposes the LLM to memory units beyond the final answer prompt. RS\
