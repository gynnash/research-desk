  - id: S27
    title: Performance.
    text: 'We score answers with an LLM-as-Judge backed by Qwen3.6-27B and deliberately
      avoid lexical-overlap metrics such as F1 or BLEU, which are sensitive to surface
      form and can penalize a correct but rephrased answer.


      For general QA, the judge checks the generated answer against the gold answer.
      For MCQ, we match the parsed option exactly and send unparsable responses to
      the judge.


      Judge prompts are in Appendix F.2, and Table 5 reports the judge reliability
      against human labels.


      Table 5: Reliability of the LLM-as-Judge against human judgments, measured as
      the fraction of items on which the judge and human labels match.


      LongMemEval-s


      PersonaMem-v2


      MINT-Eval


      Agree. (%)


      95.1%


      100.0%†


      97.3%


      †PersonaMem-v2 is MCQ, so answers are scored by the option letter alone, matching
      the human labels on every item.'
    location: https://arxiv.org/html/2610.34073v1#A1.SS3.SSS0.Px1
  - id: S28
    title: Cost.
    text: 'We report the following cost metrics for every system–benchmark–backbone
      triple.


      Token cost. All input and output LLM tokens, summed over ingestion (memory construction,
      maintenance, etc.) and QA (retrieval, intermediate reasoning, answering, etc.).


      End-to-end wall-clock time (Equivalent single-concurrency time). Systems run
      with different concurrency, so we normalize each runtime, covering construction,
      retrieval and answering, to its single-concurrency equivalent in hours. Times
      under the same backbone are broadly comparable, though endpoint throughput can
      still fluctuate.


      LLM calls. The total number of LLM calls across ingestion and QA, which, unlike
      wall-clock time, does not depend on endpoint load.


      Memory store size. The total tokens across all stored memory units after ingestion,
      averaged over corpora, reflecting how much a system expands or compresses the
      raw corpus.'
    location: https://arxiv.org/html/2610.34073v1#A1.SS3.SSS0.Px2
  - id: S29
    title: Retrieval scope.
    text: 'In existing comparisons of memory systems, the retrieval top- k used at
      QA time is usually inherited from each repository’s default configuration or
      aligned with that of the proposed system.


      Since memory units vary widely across systems, from a single turn to a merged
      chunk or session summary, the same top- k can span from a few hundred to tens
      of thousands of tokens.


      So we measure Retrieval Scope (RS), defined as the fraction of tokens in memory
      units seen by the LLM from retrieval through QA over the total tokens in all
      memory units within the system’s retrieval range. We average this ratio over
      questions and report it as a percentage.


      Tokens are counted with the Qwen3.6-27B tokenizer.


      We adjust each system’s top- k so that its RS is no lower than that of “RAG
      (1-round)”, while keeping RS reasonably comparable across systems.


      We further clarify what counts as “the docs LLM sees” in RS. This depends on
      the LLM’s involvement in retrieval, which falls into three levels: no involvement,
      where retrieval relies entirely on embeddings, indices, or other non-LLM components.
      pre-retrieval involvement, where LLM rewrites query or extracts keywords but
      reads no retrieved units. retrieval-time involvement, where the LLM reads retrieved
      units, e.g., to decide whether further retrieval is needed, reformulate the
      query, or assess whether a unit is useful.


      Only level exposes the LLM to memory units beyond the final answer prompt. RS
      counts all such exposure, including every unit read from retrieval through QA
      regardless of whether it appears in the final answer context.


      Both the numerator and denominator count only content that participates in retrieval.
      Metadata attached to memory units, such as topic, involved people, or date,
      is excluded when it is not searched over.


      The RS requirement has some exceptions. Some memory systems produce only a few
      memory units, each covering a large part of the corpus. Forcing their RS to
      match would leave a very small top- k , as for OpenViking, so we fix a top-
      k for them.'
    location: https://arxiv.org/html/2610.34073v1#A1.SS4.SSS0.Px1
  - id: S30
    title: Inference settings.
    text: 'We use NVIDIA H20 GPUs to locally served


      Qwen3.6-27B and Qwen3.5-4B, and they are decoded with temperature 0.0 and top-
      p 1.0 for every ingestion and QA call, with reasoning disabled. GPT-5.6 Luna
      (low) is accessed through the OpenAI API with the default sampling config and
      reasoning effort set to low.


      For a fair comparison, we unify the embedding model and, where a system uses
      one, the reranker model across all baselines.


      Unless otherwise stated, all baselines use Qwen3-Embedding-0.6B (Zhang et al.,
      2025b) as the embedding model and Qwen3-Reranker-0.6B (Zhang et al., 2025b)
      as the reranker if used in certain memory system.'
    location: https://arxiv.org/html/2610.34073v1#A1.SS4.SSS0.Px2
  - id: S31
    title: A.5 More Explanations
    text: 'GPT-5.6 luna on PersonaMem-v2.


      Interestingly, on PersonaMem-v2 5.6-luna usually scores lower than Q3.6-27B
      for most systems, while on LongMemEval-s and MINT-Eval, it’s usually better.
      Our inspection suggests this gap reflects answer preference of 5.6-luna, not
      the ability degradation. PersonaMem-v2 often contrasts a personalized answer
      with an almost identical generic distractor, and 5.6-luna tends to prefer the
      generic option. This preference appears to interact with 5.6-luna’s tendency
      to avoid relying on stereotypes, health-related, or privacy-sensitive information.
      This pattern is specific to PersonaMem-v2, whose multiple-choice questions often
      reward explicit use of user preferences, unlike the other two benchmarks.


      Gold Context baseline on MINT-Eval.


      MINT-Eval provides author-annotated gold context for only about half of its
      queris, so we skip it.'
    location: https://arxiv.org/html/2610.34073v1#A1.SS5
  - id: S32
    title: Appendix B Configuration Validation
    text: 'The main results in Section 3 show that naive RAG performs surprisingly
      well, outperforming many memory systems across all our three benchmarks. To
      further examine and validate it, we provide three complementary analyses: component-wise
      ablations of our RAG baseline to show its stability (B.1); a review of RAG implementations
      in prior memory works (B.2); and a validation of memory baseline configurations,
      examining our deviations from the original repositories and their impact on
      performance (B.3).'
    location: https://arxiv.org/html/2610.34073v1#A2
  - id: S33
    title: B.1 Ablations on RAG Baseline
    text: 'Since naive RAG serves as the reference point for our memory tax analysis
      throughout the paper, we examine how sensitive it is to its design choices.
      The default configuration is the single-round hybrid RAG (1rd), described in
      Section 3.1 (details in Appendix A.2), which uses buffer-merged chunks, BM25
      and dense retrieval combined and then reranked, with Qwen3-Embedding-0.6B as
      the embedding model and Qwen3-Reranker-0.6B as the reranker.


