  - id: S5
    title: 3.2 Results
    text: Table 1 reports the results of all the baselines on three benchmarks, and
      Figure 1 plots the cost-performance trade-off more directly. Appendix E.1 to
      E.3 gives the full result. Given the surprisingly strong performance of naive
      RAG, we further validate our baseline setup in Appendix B.1 to B.3, including
      ablations on the RAG, reviewing RAG baselines in prior works, and validating
      the fairness of memory configurations. Overall, many memory systems fail to
      beat RAG in many cases, motivating a closer analysis in the next section.
    location: https://arxiv.org/html/2610.34073v1#S3.SS2
  - id: S6
    title: 4.1 Overview
    text: '§3.2 shows many memory systems underperform the naive RAG despite substantially
      higher costs. Since RAG accesses the same raw history with minimal processing,
      it provides a reference for assessing the net value of building memory.


      We dissect this net value through a per-query comparison with RAG (1rd) (Figure
      3). Memory does solve some queries RAG misses, benefiting from additional organization
      or processing, while losing others that RAG already solves, where evidence may
      become lost, obscured, or harder to access after memory processing.


      These two outcomes can be understood through the inevitable deviations introduced
      by memory from the raw history, as any nontrivial memory process can change
      how information is structured, preserved, or accessed.


      These deviations give memory its dual nature.


      They are originally intended to better serve the tasks, yet may also have unintended
      harmful effects due to particular design choices, giving rise to Memory Benefit
      and Memory Tax.


      Their balance determines the net value of memory, and for the above cases, the
      tax outweighs the benefit.


      These quantities are reference-dependent, and throughout this work are defined
      relative to the naive RAG.


