  - id: S36
    title: Shared settings.
    text: For fair comparison, we standardize several evaluation components across
      baselines, including the QA prompt, QA backbone, judge prompt, judge backbone,
      and embedding model. These settings are shared by design to reduce confounding
      factors unrelated to the memory mechanism itself, so we do not ablate them separately
      for individual baselines.
    location: https://arxiv.org/html/2610.34073v1#A2.SS3.SSS0.Px1
  - id: S37
    title: Retrieval scope.
    text: 'We additionally adjust the retrieval top- k to control the relative retrieval
      scope of each system.


      RS is not intended to equalize exact inference token budgets across systems,
      but to avoid overly restrictive retrieval caused by heterogeneous memory-unit
      granularity and store sizes.


      Using the same top- k across systems can be misleading because memory units
      differ substantially in granularity and store size. For example, one system
      may effectively access 10% of its store while another accesses only 1%. So we
      tune top- k based on Retrieval Scope (Appendix A.4), ensuring that each memory
      baseline has a scope no lower than RAG (1rd). In practice, this adjustment mostly
      increases the original top- k , giving memory baselines access to more of their
      stored information.


      Table 8 shows the effect of adjusting retrieval top- k to align retrieval scope
      across systems. In most cases, we increase top- k beyond the repository defaults,
      which generally improves performance. In the few cases where top- k must be
      reduced to control its retrieval scope, the resulting performance degradation
      is minor.'
    location: https://arxiv.org/html/2610.34073v1#A2.SS3.SSS0.Px2
