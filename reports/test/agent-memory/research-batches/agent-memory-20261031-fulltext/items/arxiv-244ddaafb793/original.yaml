  - id: S41
    title: Mapping Gold Raw Turns to Gold Memory Units.
    text: 'Given the benchmark-provided gold raw turns, we map them to the corresponding
      units in each memory store. The mapping falls into three cases. A raw turn may
      correspond to a single deterministic memory unit, multiple candidate units,
      or no unit when the relevant information is lost during memory processing. GPT-5.6
      Terra and Claude Sonnet 5 independently select relevant memory units given the
      query, answer, and gold raw turn, with rare disagreements resolved by human
      adjudication.


      A-Mem, MemoryOS, HippoRAG2, and MAGMA admit deterministic one-to-one mappings,
      while the remaining systems require this LLM-based filtering. Table 12 reports
      the resulting coverage and the average number of gold memory units per gold
      raw turn for some memory systems. To check the LLM-based selection, we manually
      inspect sampled cases for some systems and label each as correct, redundant,
