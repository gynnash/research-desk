      Memory is increasingly used across different scenarios. We begin with its common
      application, personal agent memory or conversational memory, and later extend
      to more domains (§5.1 and §5.2).


      Benchmarks.


      We evaluate on LongMemEval-s (Wu et al., 2025), PersonaMem-v2 (Jiang et al.,
      2025b), and MINT-Eval (Lee et al., 2026). Due to cost constraints, we evaluate
      20% of PersonaMem-v2 and 10% of MINT-Eval. All subsets are selected with stratified
      sampling over question types. These benchmarks span direct recall to more complex
      queries involving aggregation or multi-interference reasoning. Appendix A.1
      shows the full details.


      Baselines.


      We group the memory systems by how they organize what they store, and take open-source
      representatives of each group.


      Flat store: A-Mem (Xu et al., 2026a),


      SimpleMem (Liu et al., 2026b),


      MemOS (Li et al., 2025b).


      Hier/Lifecycle: MemoryOS (Kang et al., 2025), LightMem (Fang et al., 2026a),
      OpenViking (Volcengine, 2026).


      Graph-based:


      HippoRAG2 (Gutiérrez et al., 2025),


      PlugMem (Yang et al., 2026a), MAGMA (Jiang et al., 2026a).


      Trained policy: Mem-T (Yue et al., 2026), Memory-R2 (Yan et al., 2026b).


      We use RAG over the raw corpus as the main memory-free baseline, with both single-round
      (1rd) and two-round (2rd) variants. We also include several vanilla references,
      including No Context, Gold Context, etc. Appendix A.2 shows the full details.


      Implementation details.


      We run every system on three backbones, Qwen3.5-4B, Qwen3.6-27B and GPT-5.6-luna(low),
      sharing the same embedding model, Qwen3-Embedding-0.6B. Answers are scored by
      an LLM-as-Judge backed by Qwen3.6-27B, with judge prompts in Appendix F.2. Alongside
      accuracy we report several cost metrics including token cost, end-to-end wall-clock
      time, number of LLM calls, and memory storage size.


      Since memory granularity and storage capacity vary substantially across systems,
      a fixed top- k can correspond to very different amounts of retrieved information.
      For a fair comparison, we align retrieval budgets using Retrieval Scope (RS),
      defined as the tokens in the memory units exposed to the LLM from retrieval
      through answering, normalized by the total tokens within the system’s retrievable
      store. We tune top- k for each system (increasing it from the default in most
      cases) so its Retrieval Scope is roughly no lower than that of RAG (1-round),
      while roughly comparable across systems. The exception includes systems that
      contain only a few memory units, which retains a fixed top- k .


      See full details in Appendix A.3 and A.4.


      Figure 2: Venn plot for per-query correction comparison between memory system
      and RAG (1rd).


      Figure 3: Original performances vs. w/ gold memory units (bars), and the memory
      tax (quantified in scores) before and after having gold memory units (boxed
      numbers).'
