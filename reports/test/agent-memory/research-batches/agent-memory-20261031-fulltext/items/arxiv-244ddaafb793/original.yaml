  - id: S51
    title: Benchmark Details.
    text: 'Experience is accumulated on the training (or dev) split and evaluated
      on test split, with task counts provided (experience / test).


      ALFWorld (Shridhar et al., 2021): text-based household tasks (300 / 134).


      WebShop (Yao et al., 2023a): searching for and buying a product on a simulated
      e-commerce website (1,000 / 500).


      Mind2Web (Deng et al., 2023): navigation on real-world websites, tested on the
      cross-task, cross-website and cross-domain splits (1,009 / 1,341).


      BigCodeBench (Zhuo et al., 2025): Python programming with calls to diverse libraries,
      tested on the Hard subset (992 / 148).


      AppWorld (Trivedi et al., 2024): everyday tasks solved by writing code that
      calls app APIs, tested on test-normal and test-challenge (147 / 585).


      \tau^{2} -Bench (Barres et al., 2025): customer service with domain policies,
      tools and a simulated user in the airline, retail and telecom domains (178 /
      100).'
    location: https://arxiv.org/html/2610.34073v1#A3.SS6.SSS1.Px1
  - id: S52
    title: Baseline Details.
    text: 'No Memory: the agent interacts with the environment purely in the ReAct
      (Yao et al., 2023b), with no memory across tasks.


      Naive RAG: At the start of each task, we retrieve the top-2 previously accumulated
      tasks based on their description similarity to the current task and include
      their raw trajectories in the prompt. We use the same embedding model as in
      Section 3.1, Qwen3-Embedding-0.6B.


      Memp (Fang et al., 2026b): distills past trajectories into procedural memory,
      i.e., step-by-step workflows, and retrieves those of similar tasks as guidelines.


      ReasoningBank (Ouyang et al., 2026): induces generalizable reasoning strategies
      from both successful and failed trajectories as structured memory items, retrieved
      by task similarity.


      G-Memory (Zhang et al., 2025a): organizes experience in a three-tier graph hierarchy
      of insights, queries and interaction trajectories, and retrieves both high-level
      insights and condensed past trajectories from it.


      SkillPro (Mi et al., 2026): maintains an evolving pool of skills, from which
      the agent selects one to follow at each step, and the skills are refined from
      the feedback of the tasks.'
    location: https://arxiv.org/html/2610.34073v1#A3.SS6.SSS1.Px2
  - id: S53
    title: Implementation Details.
    text: 'We follow the default task protocols of each benchmark consistent with
      prior work, including a step limit of 50 for ALFWorld, 15 for Webshop, 50 for
      AppWorld and 50 for \tau^{2} -Bench, while Mind2Web imposes no explicit step
      limit. We follow each benchmark’s official metric: success rate for ALFWorld,
      task score for WebShop, step success rate for Mind2Web, pass@1 for BigCodeBench,
      passˆ1 for \tau^{2} -Bench, and Task Goal Completion (TGC) for AppWorld, where
      a task succeeds only if all associated unit tests pass. Although pass@ k and
      passˆk differ in definition, they are equivalent when k=1 .'
    location: https://arxiv.org/html/2610.34073v1#A3.SS6.SSS1.Px3
  - id: S54
    title: Benchmark Details.
    text: '2 benchmarks adopted:


      Context-as-Memory Test set (Yu et al., 2025). We use 60 samples from it. Starting
      from the first-frame input image, each sample generates four video segments
      in sequence that complete a revisit, e.g., with instruction of turning right
      by 45∘, right by 45∘, left by 45∘ and left by 45∘, which return the camera to
      its original position. We then compare the final frame with the original view
      and report PSNR, SSIM and 1 - LPIPS, all higher is better.


      MemoBench (Chen et al., 2026b). A target object undergoes a physical process
      (e.g., dissolution), leaves the view through camera motion, and must reappear
      in its updated state. We test 25% of it, i.e., 90 samples.'
    location: https://arxiv.org/html/2610.34073v1#A3.SS6.SSS2.Px1
  - id: S55
    title: Baseline Details.
    text: '6 baselines adopted:


      I3DM (Li et al., 2026) retrieves the past frames most relevant to the current
      viewpoint with implicit 3D-aware matching and injects them as conditioning,
      so its memory is the naive past frames.


      WorldKV (Yi et al., 2026) keeps the key-value cache of past frames as world
      memory, and retrieves and compresses the cached entries for the current generation
      step.


      ReWorld (Chen et al., 2026f) an interactive world model that carries long-horizon
      memory in a learned, bounded key-value memory updated as the video is generated.


      MagicWorld (Li et al., 2025a) stores the visual latents of past frames and reuses
      them as context to keep long-horizon exploration stable.


      FramePack (Zhang et al., 2026e) packs the history into a fixed-length context
      of visual latents, compressing older frames more aggressively, with sampling
      that prevents drift.


      HyDRA (Chen et al., 2026d) summarizes the history into a small set of memory
      tokens that the generator attends to.


