    location: https://arxiv.org/html/2610.34073v1
  - id: S2
    title: 1 Introduction
    text: 'Memory has become an important component of long-horizon LLM agents, supporting
      recall across interaction histories and reuse of prior experience (Wang et al.,
      2023; Xie et al., 2024; Gur et al., 2024; Hu et al., 2025a).


      Recent work has introduced increasingly diverse memory representations and management
      mechanisms (Chhikara et al., 2025a; Kang et al., 2025; Fang et al., 2026a; Hu
      et al., 2026b; Jiang et al., 2026a), aiming to make relevant information easier
      to preserve and utilize, but often incur additional computation over the original
      context.


      As memory systems grow more complex, it remains unclear how much these operations
      improve over a straightforward alternative, such as directly retrieve from the
      raw history.


      Surveying prior works, it shows many memory designs primarily compare against
      other memories, while naive RAG is often overlooked, and when included, its
      setup is also not always fully specified (Appendix B.2).


      Without a retrieval baseline, the value of building memory remains entangled
      with the value of direct evidence retrieval, leaving its marginal or net value
      underexamined.


      So this suggests a gap between the growing complexity of memory design and our
      understanding of whether and where that complexity actually helps, motivating
      us to revisit a fundamental question:


      To study this question, we start from a common setting, personal-agent conversational
      memory.


      We evaluate representative memory designs across several benchmarks and model
      backbones, using naive RAG as a reference to assess the net value of memory.
      The results show that naive RAG remains a strong baseline and many memory systems
      underperform it across diverse settings, indicating a negative net value in
      these cases.


      But a closer query-level comparison shows memory is not uniformly worse. It
      does solve some queries RAG misses, where organization or restructuring may
      help, while losing others that RAG already solves. We refer to the former as
      memory benefit and the latter as memory tax. When the tax outweighs the benefit,
      memory falls below RAG overall.


      These gains and losses suggest a different view of memory.


      Memory goes far beyond a purely beneficial augmentation as often treated in
      prior works, and can be better understood as a double-edged process that changes
      how information from raw history is structured and accessed. We view such changes
      as inevitable deviations from the raw history.


      These deviations give memory its dual nature.


      They are originally designed and intended to better serve the task, e.g., by
      organizing scattered facts, distilling preferences, etc., yet some may also
      have unintended harmful effects due to particular design choices, such as losing
      or obscuring evidence.


      Memory benefit and tax thus capture the two sides, and their balance defines
      the net value of memory, reflected in the external performance.


      Memory benefit reflects the intended gains of memory design, such as reorganization
      or abstraction, which is expected. So we focus more on how the memory tax emerges.
      We first examine faithfulness for how well the information survives memory process,
      and then accessibility for how easily the preserved information can be recalled
      or accessed. We further study robustness for reliability of memory across backbone
      changes.


      These dimensions characterize memory tax from system side, and its balance with
      memory benefit also highly depends on the task setting.


      Across more personal-agent memory benchmarks, we find naive RAG already achieves
      high absolute scores, suggesting a retrieval-friendly task setting with limited
      benchmark headroom for memory to deliver more benefit and thus making the tax
      more visible.


      Moreover, the benefit-tax view is generalizable and not tied to particular memory
      forms, as nontrivial memory operations can introduce both beneficial and harmful
      deviations from the source. We further examine this in experiential memory and
      world-model memory. Finally, we derive some design implications from the perspective
      of memory deviations and benefit-tax trade-offs. We focus on simple changes
      that can be applied to existing memories without introducing new architectures.


      We hope that the notion of memory tax can shift more attention from standalone
      memory performance to the net value of memory and its dissection into benefit
      and tax, thus informing more reliable memory design and evaluation.


      Our contributions are as follows:


      Reassess the net value of long-term memory over direct retrieval holistically.


      Dissect the net value into memory benefit and memory tax, and systematically
      analyze the source of memory tax.


      Generalize the benefit-tax view to broader settings and derive general design
      implications.'
    location: https://arxiv.org/html/2610.34073v1#S1
  - id: S3
    title: 2 Preliminary
    text: 'Long-term memory for agents maintains information from past interactions
      and selectively exposes it to the model at query time.


      Let the interaction history be \mathcal{H}=\{h_{1},\ldots,h_{T}\} , where each
      h_{t} may contain user/agent messages, observations, or other types of content.


      A memory system processes this history into a persistent memory \mathcal{M}=I(\mathcal{H})
      , where I denotes the memory ingestion process. Given a task query q , it retrieves
      relevant memory units \mathcal{C}=R(q,\mathcal{M}) and generates an answer \hat{y}=G(q,\mathcal{C})
      . Different systems instantiate \mathcal{M} as summaries, extracted facts, structured
      records, episodic entries, or other representations.


      Naive chunk-based RAG provides a natural reference under this formulation.


      It keeps raw history with minimal processing and retrieves relevant chunks directly.


      We use it throughout this work as the comparison reference for assessing the
      net value of memory, and measured memory benefit and memory tax are thus relative
      to this reference.'
