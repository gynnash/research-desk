  \n4.4\n\nLightMem\n\n76.2\n\n13.6\n\n0.6\n\n9.6\n\nMemory-R2\n\n72.6\n\n14.8\n\n\
  6.0\n\n6.6\n\nWe further provide representative benefit and tax cases in Appendix\
  \ D. Memory benefit often appears when extraction, aggregation, preference inference\
  \ or additional processing helps as shown in several typical types in Appendix D.1,\
  \ it largely aligns with the intended value of memory, while memory tax is underexplored.\
  \ Its effects are visible in failed queries, but these outcomes do not explain how\
  \ the losses arise within the memory. We next examine internal factors behind the\
  \ memory tax.\n[S7] 4.2 Memory Tax - Faithfulness: How Well Is the Information Preserved?\
  \ (https://arxiv.org/html/2610.34073v1#S4.SS2)\nA15: To trace where memory tax comes\
  \ from, the first place to look is how well the memory system preserves past information.\
  \ Memory operations like restructuring and compression may discard or distort evidence\
  \ before retrieval begins, and such loss can not be recovered later, so we first\
  \ investigate the faithfulness for a memory system, at both the macro level and\
  \ micro level.\n\nFigure 4: Retrieval rounds replayed for the evidence to be fully\
  \ retrieved, under raw chunks vs. memory units.\n\nFigure 5: Similarity comparison\
  \ of (query, gold raw turn) vs. (query, gold memory unit), with overall distribution\
  \ shift (left) and point-wise similarity difference (right).\n\nFor each query,\
  \ we denote the raw conversation turns or steps with the evidence as gold raw turns,\
  \ and the corresponding constructed memory units as gold memory units (null if the\
  \ evidence is lost after construction). At the macro level, we replay QA with only\
  \ the gold raw turns and, separately, only the gold memory units. Gold memory units\
  \ remove retrieval failures, so the remaining memory tax reflects the losses introduced\
  \ in memory construction, as shown by the red boxes in Figure 3. At the micro level,\
  \ we sample some atomic facts from the raw corpus and trace each fact to its corresponding\
  \ memory units, annotating the degree of information loss, as shown in Table 2 and\
  \ information loss does exist in many systems.\nA16:  Appendix C.2 and D.2 have\
  \ more details and case studies.\n\nHowever, the reduced tax after having oracle\
  \ memory also indicates degradation arises beyond construction. The performance\
  \ shows a similar signal. Some systems (MAGMA, LightMem) achieve gold-mem scores\
  \ close to gold-raw-turn scores, yet far above their original, suggesting the preserved\
  \ evidence may become harder to access.\n[S8] 4.3 Memory Tax - Accessibility: How\
  \ Easily Can Stored Information Be Accessed? (https://arxiv.org/html/2610.34073v1#S4.SS3)\n\
  A17: §4.2 examines how much information survives memory construction. However, preserved\
  \ information is useful only if it remains accessible at query time. So next we\
  \ measure the accessibility of memory from both macro and micro levels.\n\nAt the\
  \ macro level, we replay retrieval iteratively for multiple rounds over the constructed\
  \ memory and record how many rounds are needed to recover all gold memory units\
  \ for a given query.\n\nEvidence lost in construction is marked as not retrievable.\n\
  \nAs shown in Figure 5, Memory systems recover fewer queries than RAG in the first\
  \ round, suggesting that some relevant evidence is buried deeper after memory construction.\n\
  \nTo understand why preserved evidence becomes harder to access, we further inspect\
  \ some cases as the micro level analysis (Appendix D.3).\n\nWe observe several recurring\
  \ patterns where evidence is fragmented across multiple memory units, diluted with\
  \ unrelated information, or rephrased, weakening its accessibility compared with\
  \ raw history.\n\nTo visualize this effect more broadly, we compare the (query,\
  \ gold raw turn) similarity with the (query, gold memory unit) similarity, reporting\
  \ the point-wise changes and overall drift in Figure 5.\n\n\nA18: Since each system\
  \ retrieves within its own memory store, absolute similarity values across systems\
  \ are only indicative, the main signal is how memory construction shifts the query\
  \ alignment of the same evidence.\n\nAppendix C.3 provides more results.\n[S9] 4.4\
  \ Memory Tax - Robustness: How Robust Is the Memory Across Backbones? (https://arxiv.org/html/2610.34073v1#S4.SS4)\n\
  A19: The above analyses examine memory under a fixed backbone setting. However,\
  \ long-lived agents may construct memory with one model and later consume it with\
  \ another, making backbone robustness another important property. We construct memory\
  \ independently with three backbones and evaluate each memory with different QA\
  \ backbones.\n\nTwo patterns emerge. First, with the QA backbone fixed, changing\
  \ the construction model leads to noticeable score variation. This is expected since\
  \ many intermediate operations rely heavily on the backbones and can produce different\
  \ memory items from the same raw history. More interestingly, with the construction\
  \ fixed, changing the QA backbone causes larger performance variation than naive\
  \ RAG for many systems, as shown in Figure 7. This suggests many memory mechanisms\
  \ can introduce additional fragility beyond the raw-history retrieval. In this sense,\
  \ memory tax is reflected not only in point-wise performance loss, but also in the\
  \ reduced robustness to backbone changes.\n\nSee Appendix C.4 for more details.\n\
  \nFigure 6: Each row fixes the construction model, while different marker shapes\
  \ denote different QA models. The segment shows Acc drop, red if the drop exceeds\
  \ that of RAG (grey) and green otherwise.\n\nFigure 7: Results of retrieval baselines\
  \ on more memory benchmarks with Q27B. Details are in Appendix C.5.\n[S10] 4.5 Benchmark\
  \ Headroom Further Exposes the Memory Tax (https://arxiv.org/html/2610.34073v1#S4.SS5)\n\
  A20: The analysis so far focuses on how memory tax arises within a memory system.\
  \ Yet the balance between memory benefit and tax also depends on the task settings.\
  \ Some tasks naturally favor direct recall from raw history, while others may benefit\
  \ more from abstraction or distillation. To examine this evaluation-side effect,\
  \ we run several naive baselines across a broader set of long-term memory benchmarks,\
  \ including No Memory, IDF-keyword, a lexical matching baseline based on the keyword\
  \ rarity, RAG-Emb, and RAG-Hybrid. Details are in Appendix C.5.\n\nFigure 7 shows\
  \ that simple retrieval baselines already performs quite well on some of the benchmarks,\
  \ including some widely-used ones. For example, the extremely simplified IDF-keyword\
  \ based method can even achieve more than 50% in absolute score on some of them,\
  \ while RAG-Hybrid reaches about 70%. Such results suggest some current evaluation\
  \ settings are relatively retrieval-friendly, leaving quite limited headroom for\
  \ heavy memory to improve over naive retrieval.\n\nThis also helps explain why some\
  \ systems with lightweight or even no explicit memory construction can achieve strong\
  \ performance and efficiency (Yan et al., 2025b; Yu et al., 2026b; Xiao et al.,\
  \ 2026; Xu et al., 2026b; Zhang et al., 2026b; Wu et al., 2026b).\nA21:  When naive\
  \ retrieval already provides a strong baseline, they “inherit” much of that performance\
  \ while introducing little memory tax, so lightweight design can be particularly\
  \ competitive under limited benchmark headroom.\n\nOn the other hand, many real-world\
  \ queries are also naturally retrieval-friendly, making such accurate recall tasks\
  \ essential and meaningful in its own right.\n\nCurrent benchmarks contain a large\
  \ share of such queries, and future evaluations could complement them with harder\
  \ settings.\n\nMoreover, reporting memory systems alongside naive RAG can make remaining\
  \ improvement room more explicit, which also helps clarify the contribution of built\
  \ memory. RAG scores can also serve as a reference for calibrating difficulty and\
  \ leaving meaningful room for more reliable evaluations.\n[S11] 5 Generalizing Memory\
  \ Tax (https://arxiv.org/html/2610.34073v1#S5)\nA22: Memory serves a wide range\
  \ of application scenarios beyond personal-agent memory. We next examine whether\
  \ the same benefit-tax view extends to two substantially different settings.\n[S12]\
  \ 5.1 Experiential Memory (https://arxiv.org/html/2610.34073v1#S5.SS1)\nA23: In\
  \ this setting, agents accumulate experience from past task traces to guide future\
  \ ones. We evaluate on several agentic scenarios covering embodied tasks (ALFWorld),\
  \ web (WebShop, Mind2Web), coding (BigCodeBench) and tool use (AppWorld, \\tau^{2}\
  \ -Bench), with Qwen3.5-4B as backbone. Experience is accumulated on the training\
  \ split and evaluated on the test split with memory frozen. We compare Memp (Fang\
  \ et al., 2026b), ReasoningBank (Ouyang et al., 2026), G-Memory (Zhang et al., 2025a)\
  \ and SkillPro (Mi et al., 2026) against a ReAct agent without memory and a naive\
  \ RAG baseline, which retrieves the most similar past tasks by their descriptions\
  \ and places the trajectories into the context, details are in Appendix C.6.1.\n\
  \nFigure 8 shows the effect of memory varies across task domains. In web-based tasks,\
  \ distilling long traces into workflows or strategies can outperform naive RAG,\
  \ while for tool-use, several memory methods fall behind it, suggesting memory tax\
  \ also emerges in experiential memory, but its magnitude depends strongly on the\
  \ task settings.\n[S13] 5.2 World-Model Memory (https://arxiv.org/html/2610.34073v1#S5.SS2)\n\
  A24: Long-horizon world models need to retain information about past environment\
  \ states to maintain temporal and scene consistency (Zhang et al., 2026e; Li et\
  \ al., 2026; He et al., 2026; Chen et al., 2026f; Chen et al., 2026d; Chen et al.,\
  \ 2026c). Existing approaches have explored diverse memory representations and mechanisms,\
  \ including raw frames, visual latents, and KV caches. We evaluate representative\
  \ methods on two settings for long-horizon consistency: Context-as-Memory (Yu et\
  \ al., 2025; King et al., 2026) and MemoBench (Chen et al., 2026b). Full details\
  \ are in Appendix C.6.2.\n\nA similar pattern appears in these settings (Table 3).\
  \ Directly retrieving and reinjecting past observations achieves strong consistency,\
  \ while latent- or cache-based memories do not consistently outperform this simpler\
  \ alternative. This suggests that memory tax can also arise in world-model memory,\
  \ where additional memory operations may introduce losses that offset their intended\
  \ benefits. It also motivates exploration of more unified memory carriers in video\
  \ world models.\n\nFigure 8: Experiential memory results on agent task benchmarks,\
  \ memory baselines are green when above RAG and red otherwise. See full version\
  \ with memory tax part plotted in Appendix C.6.1.\n\n\nA25: Moreover, we also expect\
  \ memory benefit/tax to extend beyond above settings along other axes (Hu et al.,\
  \ 2026b), like omni-modality, latents, parameters, etc. We leave the exploration\
  \ for future work.\n\nTable 3: Long-horizon consistency of world models with different\
