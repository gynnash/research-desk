  - id: S50
    title: Evaluation protocol.
    text: 'All predictions are judged against the reference answers with the binary
      LLM judge of Appendix A.3. Deviations from the official evaluation setups are
      summarized below.


      PersonaMem-v2, MINT-Eval, WorldMemArena: To reduce evaluation cost, we sample
      a subset of examples while approximately preserving the original distribution
      of question types.


      LoCoMo: Following prior works, we exclude the adversarial category (category
      5, abstention) and evaluate the remaining four categories.


      ES-MemEval: We evaluate only the QA task, as the other two task types do not
      have deterministic reference answers.


      Multimodal benchmarks (Mem-Gallery, WorldMemArena): We use a text-only retrieval
      setting for controlled comparison. Each image is first converted into a roughly
      200-token caption by a VLM (Qwen3.6-27B), after which all retrieval baselines
      operate on the resulting captioned history.


