  \ Overview (https://arxiv.org/html/2610.34073v1#A3.SS3.SSS0.Px1)\nA80: We group\
  \ the retrieval mechanisms of memory systems into four types in a representative\
  \ but not exhaustive way: ranking scores memory units, e.g., by embedding similarity,\
  \ lexical scores or a reranker; matching selects units by keywords or metadata filters;\
  \ expansion grows the retrieved set along the memory structure, e.g., via graph\
  \ neighbors or personalized PageRank; and persistence always places part of the\
