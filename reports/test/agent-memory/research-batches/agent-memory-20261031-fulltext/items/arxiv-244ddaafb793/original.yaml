  - id: S57
    title: Appendix D Case Studies
    text: 'In this section, we show some representative case studies for both Memory
      Benefit (D.1) and Memory Tax (


      D.2


      , D.3


      ), and also some comparison examples of benefit and tax within the same memory
      mechanism to directly show the dual nature of memory (D.4).'
    location: https://arxiv.org/html/2610.34073v1#A4
  - id: S58
    title: D.1 Memory Benefit
    text: 'Even the main results show memory underperform RAG in the overall performance
      in many cases, memory systems can still answer some questions correctly where
      naive RAG fails and we still need them in such scenarios. We inspect a sample
      of such questions and group the wins of memory into several representative types
      (Figures 18 and 19):


      Focused atomic extraction: each fact becomes a short unit, so the gold facts
      fit into the retrieved context, while RAG’s top- k is filled by long chunks
      that other irrelevant information, making the evidence hard to recover.


      Multi-hop linking: facts from different sessions are retrieved together and
      combined, while for naive RAG the evidences are scattered.


      Implicit preference exposure: a trait mentioned only in passing becomes an explicit
      unit in the memory.


      Temporal anchoring: relative time expressions are anchored to absolute dates
      during construction.


      Explicit forgetting: a forget request updates the stored state by removing or
      deactivating the targeted content.


      Processing for heterogeneous inputs: non-dialogue inputs such as code diffs
      are described in natural language, making it easier to be recalled with semantic
      retrieval.


      Figure 18: Examples of memory benefit: (a) focused atomic extraction, (b) multi-hop
      linking, and (c) implicit preference exposure.


      Figure 19: Examples of memory benefit-2: (d) temporal anchoring, (e) explicit
      forgetting, and (f) processing for heterogeneous inputs.'
    location: https://arxiv.org/html/2610.34073v1#A4.SS1
  - id: S59
    title: D.2 Memory Tax - Faithfulness
    text: 'Figures 23 to 23 show examples from the annotation in Section 4.2, with
      varying degrees of information loss:


      No Loss.


      Partial Loss.


      Major Loss.


