result:
  text: "{\n  \"summary\": \"长程智能体把对话或任务轨迹加工成摘要、事实、图谱与策略，可能更便于复用，却也可能丢失证据、降低检索命中，甚至对模型骨干变化更敏感。本文针对“记忆是否胜过直接找原文”这一常被不同记忆系统间比较掩盖的问题，以混合检索原始历史的\
    \ RAG 为参照，把逐题收益与损失分别称为记忆收益和记忆税，并从信息保真、可达性、跨骨干鲁棒性拆解损失。三项对话记忆基准中，多数记忆系统在不少设置下未胜过\
    \ RAG；经验记忆和世界模型实验也显示效果依任务与指标而异。作者进一步讨论原文回退、检索反馈和按需加工等设计取舍。\",\n  \"claims\": [\n\
    \    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 衡量记忆净值，先把检索本身的贡献分开\\\
    n\\n作者关心的不只是记忆系统能不能答题，而是把历史加工成持久记忆后，是否比直接从原始历史找证据更好。其流程可写成：历史经写入过程形成记忆单元，查询到来后检索相关单元，再由模型作答；单元可以是摘要、事实、结构化记录或情景条目。若只比较不同记忆架构，就难以分清提升来自记忆组织还是检索能力。为此，研究以几乎不加工历史、直接检索原文块的朴素\
    \ RAG 为参照：记忆答对而 RAG 答错计为收益，RAG 答对而记忆答错计为记忆税。二者的平衡反映相对净值，因此结论依赖所选参照和任务，而不是记忆的绝对属性。\"\
    ,\n      \"evidence_ids\": [\"A2\", \"A3\", \"A6\", \"A13\"]\n    },\n    {\n\
    \      \"kind\": \"fact\",\n      \"text\": \"朴素 RAG 的操作流程并非只做一次向量搜索：原始历史按对话轮次或观测步骤切块，短轮次合并到约\
    \ 1024 字符，过长轮次另行切分；BM25 与稠密检索各自召回候选，去重后由重排器排序，再把前列片段交给回答模型。双轮版本还允许模型判断首轮证据是否充分，并针对剩余语料发起一次后续检索。被比较的记忆系统则覆盖平面事实或笔记存储、分层及生命周期管理、图结构和训练策略等类别。由于不同系统的单元粒度不同，同一个\
    \ top-k 可能对应极不相同的上下文量，作者按检索范围调节 top-k，使多数系统暴露给模型的记忆比例不低于单轮 RAG；这一做法旨在避免检索过紧，并不等于精确统一了总推理成本。\"\
    ,\n      \"evidence_ids\": [\"A9\", \"A10\", \"A55\", \"A56\", \"A60\", \"A61\"\
    , \"A71\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"作者在 LongMemEval-s、PersonaMem-v2 和 MINT-Eval 上比较多种记忆系统，并使用三种回答骨干。主表报告准确率；开放问答由\
    \ Qwen3.6-27B 评审，PersonaMem-v2 的选择题则优先按解析出的选项精确匹配，无法解析时才交给评审。以 Qwen3.5-4B 为例，单轮\
    \ RAG 三项得分依次为 70.2%、37.2%、25.8%；A-Mem 为 70.4%、33.7%、24.4%，Mem-T 为 71.0%、32.1%、27.0%。这显示局部优势确实存在，但不是普遍胜出。Qwen3.6-27B\
    \ 在 PersonaMem-v2 上的双轮 RAG 为 48.7%，记忆系统从 38.7% 到 50.2% 不等，也说明比较必须固定基准、骨干和检索条件，不能把不同设置的分数拼成单一结论。\"\
    ,\n      \"evidence_ids\": [\"A7\", \"A8\", \"A9\", \"A10\", \"A12\", \"A58\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 同一套加工机制，可能既提炼证据也改坏证据\\\
    n\\n逐题比较让总体准确率背后的机制更清楚。作者列举的记忆收益包括：把分散事实提取成短小单元，避免检索上下文被长块中的无关内容占满；连接不同会话中的信息以支持多跳问题；把随口提及的偏好显式化；将相对时间转换为日期；处理用户的明确遗忘请求；以及把代码差异等非对话材料改写成更易语义检索的描述。相同的结构化或改写操作，也可能使另一问题上的原证据丢失、变得含糊或难以命中。因而作者把记忆理解为改变历史的组织、保存和访问方式，而不是只有收益的附加层；案例呈现这种双重性，但不能单独证明某一种设计在所有任务中必然有利或有害。\"\
    ,\n      \"evidence_ids\": [\"A13\", \"A98\", \"A99\", \"A102\"]\n    },\n   \
    \ {\n      \"kind\": \"author_claim\",\n      \"text\": \"保真分析把构建阶段丢失的信息，与仍在记忆中但未被检索的信息区分开。作者将基准提供的原始证据轮次映射到记忆单元；若没有对应单元，就视为证据在记忆构建时缺失。另从三个基准抽取\
    \ 500 个原始轮次，人工检查对应单元中的信息保留程度，标为完整、部分缺失、重大缺失或没有对应单元。研究还分别把原始证据轮次和映射到的记忆单元作为预言机上下文交给回答模型：如果原文条件优于记忆单元条件，提示加工改变了证据；如果预言机记忆接近预言机原文、却明显高于正常检索，则更像是证据存在但未被正常找出。作者报告\
    \ MAGMA、LightMem 有后一类信号，而 SimpleMem、OpenViking 等在特定设置出现原文与记忆单元表现差距。部分映射依赖模型挑选，辅以抽样人工核查，故归因并非对全部单元逐条人工审定。\"\
    ,\n      \"evidence_ids\": [\"A14\", \"A15\", \"A16\", \"A76\", \"A77\", \"A78\"\
    , \"A79\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"可达性实验反复检索记忆，每轮把已经找回的单元从待检索集合中移除，记录找齐证据需要多少轮；构建阶段已丢失的内容则记作不可检索。作者报告，多数记忆系统首轮找回的相关证据少于\
    \ RAG。案例分析把退化归为三类：一条原始记录被拆成多个单元，携带关键内容的单元排在后面；证据被长档案或附加内容稀释；以及改写后措辞与查询不再贴合。相似度分析因此比较同一证据加工前后的查询对齐变化，而不把不同存储系统的绝对相似度直接横比。作者还改变构建与问答骨干：固定构建模型、更换问答模型时，许多记忆系统出现比\
    \ RAG 更大的性能波动，提示生成出来的记忆表示可能带来额外的骨干依赖。\",\n      \"evidence_ids\": [\"A17\", \"\
    A18\", \"A19\", \"A81\", \"A82\", \"A83\", \"A101\"]\n    },\n    {\n      \"\
    kind\": \"author_claim\",\n      \"text\": \"## 基准是否留有提升空间，会改变记忆的相对价值\\n\\n作者把比较扩展到更多长期记忆基准，并加入关键词、向量和混合检索等简单对照。其报告显示，部分任务上朴素检索已经很强，例如\
    \ LongMemEval-s 的 Qwen3.6-27B 设置中，单轮 RAG 得分为 77.6%，双轮为 81.4%；扩展基准中，简单 IDF 关键词方法在一些任务也超过\
    \ 50%。作者据此认为，偏重直接回忆的基准可能给重型记忆留下较少提升空间，并建议同时报告原文检索参照、补充需要抽象或蒸馏的困难设置。对 RAG 自身的消融改变了分块、检索方式、嵌入模型和重排器，多数结果仍在默认值附近数个百分点；固定窗口切断轮次或单用\
    \ BM25 时下降较明显，但仍能与一些记忆系统竞争。这支持默认 RAG 不是靠某个单一组件才显得强，却不能说明所有检索配置都已穷尽。\",\n     \
    \ \"evidence_ids\": [\"A20\", \"A21\", \"A65\", \"A66\", \"A67\", \"A84\", \"\
    A86\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"作者将收益—税的分析扩展到经验记忆与世界模型。经验实验使用\
    \ Qwen3.5-4B，在 ALFWorld、WebShop、Mind2Web、BigCodeBench、AppWorld 和 τ²-Bench 上比较无记忆\
    \ ReAct、检索既有轨迹的 RAG，以及 Memp、ReasoningBank、G-Memory、SkillPro。经验从训练或开发划分积累，测试时冻结；经验\
    \ RAG 在每项任务开始时按任务描述检索最相似的两条旧轨迹。结果随领域变化：作者报告 Web 任务中流程或策略提炼可能胜过 RAG，而工具使用任务里若干方法落后；τ²-Bench\
    \ 的 pass@1 中，RAG 为 69，G-Memory 为 78，ReasoningBank 为 51。世界模型实验比较直接帧、KV 缓存、视觉潜变量和记忆\
    \ token：Context-as-Memory 上 I3DM 的 SSIM 为 .560；MemoBench 上 MagicWorld 为 .433，略高于\
    \ I3DM 的 .430，但其 1−LPIPS 为 .412，低于 I3DM 的 .476。指标并不一致，不能据单项判定某种记忆载体全面更优。\",\n\
    \      \"evidence_ids\": [\"A23\", \"A24\", \"A88\", \"A90\", \"A91\", \"A92\"\
    , \"A93\", \"A94\", \"A95\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"作者提出的工程方向不是再叠加一个复杂架构，而是让记忆加工造成的偏离可以恢复：在正常记忆检索之外并行查原始历史，再联合重排，以补回构建时丢失或访问时漏掉的证据；也可以把过去的查询、找到的证据及检索路径写回存储，使相似需求以后更容易直接命中。作者称这些做法有跨若干系统的概念验证结果，但当前抽取未呈现相关结果表的完整细节，无法核对各系统的收益幅度。另一项取舍是记忆何时加工：提前构建可把成本移到离线，但不知道未来查询时可能要广泛处理历史；即时构建可针对已知问题加工，却增加在线计算和用户等待。作者把利用既有兴趣、习惯和访问模式预测未来需求作为折中方向，属于设计讨论，而非已由实验确立的部署效果。\"\
    ,\n      \"evidence_ids\": [\"A26\", \"A27\", \"A28\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"作者说明所选基线具有代表性而非穷尽，官方配置与本文统一设置之间的系统专属差异、进一步调参都可能影响结果。评测成本限制了覆盖：PersonaMem-v2\
    \ 与 MINT-Eval 分别使用 20% 和 10% 的分层样本，GPT-5.6 Luna 在 LongMemEval-s 使用 100 个语料；未覆盖更强前沿模型。主要实验是静态、离线、英语设置，交错查询、多语言长期交互，以及多模态、潜变量和参数记忆仍待研究。经验记忆测试阶段冻结，也不能代表持续在线更新过程。\"\
    ,\n    \"部分损失归因依赖金标准证据映射、模型辅助筛选记忆单元、人工抽样标注和检索回放；相似度漂移只提供提示，不能作为跨系统绝对能力比较。不同领域的任务、样本和指标也不相同。原文回退与查询—证据反馈有作者报告的概念验证，但抽取缺少相应结果表的完整细节；即时构建和需求预测主要是设计讨论，不能据此认定效果已获验证。\"\
    ,\n    \"已阅读抽取全文，未独立复现实验。抽取覆盖所提供版本的正文及附录文本，但文本抽取不能核验图表布局，也可能遗漏或失真公式、表格及附录中的细节；全文抽取不等于实验复现或对所有结果逐项独立核查。\"\
    \n  ]\n}"
