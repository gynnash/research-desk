result:
  text: "{\n  \"summary\": \"这项研究追问：把对话历史加工成摘要、事实、图结构或分层记忆，是否真的胜过直接检索原文？作者以朴素混合 RAG\
    \ 为参照，将记忆净价值拆成“记忆收益”与“记忆税”，并沿信息保真、检索可达性、跨骨干鲁棒性追查损失来源。个人对话记忆的三项基准中，多数系统在不少设置下未胜过\
    \ RAG；但记忆也能解决 RAG 漏掉的问题。研究还把这一双刃剑视角扩展到经验记忆与视频世界模型，并提出保留原始历史回退通路、利用检索反馈和按需安排记忆加工等设计思路。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 净价值要以原始历史检索为参照\\n\\n论文针对的困难不是“记忆系统能否回答问题”，而是回答得比不构建记忆的直接检索更好吗。其形式化流程是：历史经写入过程变为持久记忆，查询到来后检索相关单元，再由模型作答；单元可以是摘要、事实、结构化记录或情景条目。作者把最小加工的原始历史分块检索作为参照，因为若只在不同记忆架构之间比较，记忆加工的增益就会与检索本身的价值混在一起。对逐查询结果而言，记忆答对而\
    \ RAG 答错是收益，RAG 答对而记忆答错是记忆税；二者差额才体现相对净值。这个定义是相对于指定 RAG 基线的，不是脱离任务与参照系统的绝对属性。\"\
    ,\n      \"evidence_ids\": [\"A2\", \"A3\", \"A6\", \"A13\"]\n    },\n    {\n\
    \      \"kind\": \"fact\",\n      \"text\": \"作者把基线实现为对原始语料按对话轮次或观测步骤切块，短轮次合并到约\
    \ 1024 字符，长轮次单独保留，极长轮次再切分；BM25 与稠密向量检索各取候选，去重后用重排器排序，再把前列片段交给回答模型。双轮版本允许模型判断首轮证据是否足够，并对剩余语料发起一次后续检索。记忆侧涵盖平面存储、层级或生命周期管理、图结构和训练策略等代表系统。为避免同一\
    \ top-k 因记忆单元大小不同而对应悬殊上下文量，作者调节各系统的检索范围，使其通常不低于单轮 RAG；这并不等于精确对齐全部推理 token 成本。\"\
    ,\n      \"evidence_ids\": [\"A9\", \"A10\", \"A55\", \"A56\", \"A60\", \"A61\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 主结果显示记忆收益与记忆税并存\\\
    n\\n作者在 LongMemEval-s、PersonaMem-v2、MINT-Eval 上比较多个记忆系统，并使用三种回答骨干；其中 PersonaMem-v2\
    \ 与 MINT-Eval 分别取分层抽样的 20% 和 10%，总体指标是由模型评审给出的准确率。以 Qwen3.5-4B 为例，单轮 RAG 在三项基准得分为\
    \ 70.2%、37.2%、25.8%；A-Mem 分别为 70.4%、33.7%、24.4%，Mem-T 则为 71.0%、32.1%、27.0%。因此并非所有系统、任务都一致落后，但优势零散：LongMemEval\
    \ 上个别方法略高于 RAG，其他不少结果低于它。两轮 RAG 在 Qwen3.6-27B 的 PersonaMem-v2 达 48.7%，而相同骨干下多种记忆系统约为\
    \ 38.7%至50.2%；不能把不同骨干或基准的数值拼成单一胜负结论。作者还报告记忆系统往往有额外构建成本，故单看准确率不足以证明复杂记忆划算。\",\n\
    \      \"evidence_ids\": [\"A7\", \"A8\", \"A9\", \"A10\", \"A12\"]\n    },\n\
    \    {\n      \"kind\": \"author_claim\",\n      \"text\": \"逐查询分解解释了整体分数为何会掩盖机制差异：记忆可通过原子事实提取、跨会话关联、把隐含偏好显式化、将相对时间锚定到日期、执行明确遗忘，或把代码差异等异质输入转成自然语言，帮助\
    \ RAG 难以命中的问题。反过来，同一种组织机制也可能在另一问题上损害答案。作者因此不把记忆简化为“压缩上下文”，而看作对原始证据的结构、保存方式和访问路径作出改变；有益的改变构成收益，意外造成证据丢失或难以找到的改变构成税。案例说明这些机制具有双重性，但本身不是对各机制普遍因果效果的独立实验验证。\"\
    ,\n      \"evidence_ids\": [\"A13\", \"A98\", \"A99\", \"A102\"]\n    },\n   \
    \ {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 记忆税既可能在写入时形成，也可能在检索时暴露\\\
    n\\n保真分析区分原始证据是否进入记忆，与进入后能否被找回。作者把基准提供的证据轮次映射到对应记忆单元；若没有对应单元，就标记为构建阶段的损失。抽样事实的人工标注也发现不同系统存在部分丢失、重大丢失或无对应单元。更关键的是，作者分别把原始证据轮次、映射出的记忆单元作为“预言机上下文”交给回答模型：若记忆单元条件下仍明显差于原始轮次，说明记忆加工已损害信息；若预言机记忆接近预言机原文，却远高于正常检索，则证据尚存但取回困难。文中举出\
    \ MAGMA、LightMem 的后一类信号，也指出 SimpleMem、OpenViking 等在特定设置出现原文与记忆单元表现差距。映射并非总是人工逐项核验：部分系统依赖模型挑选相关单元，并辅以抽样检查。\"\
    ,\n      \"evidence_ids\": [\"A14\", \"A15\", \"A16\", \"A76\", \"A77\", \"A78\"\
    , \"A79\"]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"可达性分析进一步把“存着”与“容易找到”分开：研究者对记忆反复检索，每轮移除已找回单元，记录找齐证据所需轮次；构建阶段已丢失的证据则视为不可检索。作者报告，多数记忆系统首轮找回的证据少于\
    \ RAG。案例归纳出三种退化：一条原始记录被拆成多个单元，关键片段排名落后；证据被无关内容包裹或稀释；改写削弱了记忆文本与查询的词义对齐。相似度分析比较同一证据的原文轮次与记忆表示，重点看加工前后的变化，而非跨系统绝对相似度，因为各系统存储和排序机制不同。另一个系统层面风险是骨干迁移：固定构建模型而更换问答模型时，许多记忆方法的分数波动比\
    \ RAG 更大，说明中间生成的记忆表示可能额外依赖特定模型。\",\n      \"evidence_ids\": [\"A17\", \"A18\"\
    , \"A19\", \"A81\", \"A82\", \"A83\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"作者还检查评测任务本身留给记忆的提升空间。扩展基准上的简单检索对照显示，混合 RAG 在部分任务已相当强：例如表列\
    \ LongMemEval-s、Qwen3.6-27B 设置中，单轮 RAG 为 77.6%，双轮为 81.4%；某些基准上的 IDF 关键词基线也超过 50%。这提示偏重准确回忆的任务可能天然有利于直接找原文，重型记忆的潜在收益空间较窄；但作者并未因此否定回忆任务，而是主张同时报告直接检索参照，并补充需要抽象或蒸馏能力的更困难设置。基线自身也经过组件消融：改变分块、检索器、嵌入模型或重排器后，表现多数仍在默认值附近数个百分点；固定窗口切断轮次或只用\
    \ BM25 时下降较明显。这支持 RAG 不是单一幸运配置，但不意味着所有可能的检索实现都已穷尽。\",\n      \"evidence_ids\"\
    : [\"A20\", \"A21\", \"A65\", \"A66\", \"A67\", \"A84\", \"A86\"]\n    },\n  \
    \  {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 跨领域结果与可恢复设计\\n\\\
    n在经验记忆实验中，作者用 Qwen3.5-4B，在 ALFWorld、WebShop、Mind2Web、BigCodeBench、AppWorld 与 τ²-Bench\
    \ 上比较无记忆 ReAct、检索历史轨迹的朴素 RAG，以及 Memp、ReasoningBank、G-Memory、SkillPro。作者报告结果随任务而变：WebShop\
    \ 上流程或策略蒸馏可以胜过朴素 RAG，而工具使用任务里若干记忆方法落后；例如表中 τ²-Bench 的 pass@1，RAG 为 69，G-Memory\
    \ 为 78，ReasoningBank 为 51。世界模型部分比较直接帧检索、KV 缓存、视觉潜变量和记忆 token；在 Context-as-Memory\
    \ 测试中，I3DM 的 SSIM 为 .560，表中其他方法低于该值；MemoBench 上 MagicWorld 的 SSIM 为 .433，略高于 I3DM\
    \ 的 .430，但其 1−LPIPS 为 .412，低于 I3DM 的 .476。指标不一致，不能据单项声称某表示全面占优。作者据此提出在现有记忆旁并行检索原历史并联合重排，或把过去查询与找到的证据写回记忆，以便后续复用；还讨论提前构建、查询到来后即时构建及依据历史访问习惯预测需求之间的成本与时延取舍。\"\
    ,\n      \"evidence_ids\": [\"A23\", \"A24\", \"A26\", \"A27\", \"A28\", \"A88\"\
    , \"A90\", \"A91\", \"A92\", \"A93\", \"A94\", \"A95\"]\n    }\n  ],\n  \"limitations\"\
    : [\n    \"作者明确说明基线具有代表性但并非穷尽，且虽尽量沿用官方配置，系统专属调参仍可能改变结果。计算与 API 成本限制了模型覆盖和样本规模：PersonaMem-v2、MINT-Eval\
    \ 分别只评测 20% 与 10%；GPT-5.6 Luna 在 LongMemEval-s 只用 100 个语料。主实验主要是静态、离线、英语设置，交错发生的长期查询、多语言交互及多模态、潜变量和参数记忆仍未充分覆盖。跨骨干结论也限于所测骨干与构建、问答组合。\"\
    ,\n    \"部分归因依赖金标准证据映射、模型辅助挑选记忆单元、人工抽样标注和迭代检索回放；相似度漂移只作提示性分析，系统间绝对值不可直接比较。扩展领域的任务、样本、指标各不相同，不能据此推出普遍的记忆优劣。文中提出的原文回退、检索经验反馈和按需求构建有概念验证结果，但可见抽取没有完整呈现相关表格细节，无法据此核查所有收益幅度。\"\
    ,\n    \"已阅读抽取全文，未独立复现实验。全文抽取虽覆盖所选版本及附录文本，仍无法核验图表布局和图中未转写信息；公式、表格或附录内容也可能因文本抽取而缺失或失真，故不能将抽取完整等同于复现或逐项核验。\"\
    \n  ]\n}"
