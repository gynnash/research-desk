result:
  text: "{\n  \"summary\": \"MemCut 研究长程对话记忆中的“删除不等于遗忘”：移除直接披露秘密的消息后，分散在普通记录中的线索仍可能组合出同一事实，而系统答不出来也可能只是检索没找到。作者构造含456个秘密及标注证据路径的基准，并用原生恢复、残余恢复区分检索可见性与存储内容仍支持的推断；再比较三种删除流程、五类记忆设计和四个语言模型。值得关注的是，删除披露主要降低原生恢复，LLM从20个候选中再删10条后仍残留39%—76%的恢复率；候选覆盖不足比继续扩大删除预算更像这些基线的瓶颈。\"\
    ,\n  \"claims\": [\n    {\n      \"kind\": \"author_claim\",\n      \"text\":\
    \ \"## 删除任务要切断证据路径，而非只删原话\\n\\n作者把秘密定义为受保护事实，把没有直接说出事实、但能支持推导的对话轮次称为证据。每个样本还标注直接披露、足以推出事实的最小证据组合，以及表面相似却不支持推导的干扰记录。若某事实有多组充分证据，删除操作必须移除披露，并且至少命中每一组充分证据中的一个成员；这就是一个“切断集”。因此，删除整段相关对话并非任务定义要求，真正目标是打断所有已标注的推导路径，同时避免只凭主题或相似措辞误删无关记录。\"\
    ,\n      \"evidence_ids\": [\"A10\", \"A12\"]\n    },\n    {\n      \"kind\":\
    \ \"author_claim\",\n      \"text\": \"作者用两个恢复指标拆分“存储还知道什么”和“当前检索能看见什么”。原生恢复让系统照常检索，再回答四选一问题；残余恢复跳过检索，把仍存活、且可追溯到已标注披露或证据的对象直接交给同一个回答模型。两者固定读者模型，但输入路径不同；删除按来源轮次做闭包处理，即一个来源轮次被删，其派生对象也随之删除。隐藏风险份额为（残余恢复−原生恢复）除以残余恢复，作者将其解释为原生检索漏掉残余可恢复事实比例的保守下界。这样，系统一时答不出来不再被直接当作已遗忘。\"\
    ,\n      \"evidence_ids\": [\"A11\", \"A61\"]\n    },\n    {\n      \"kind\":\
    \ \"fact\",\n      \"text\": \"基准由15段跨工作、家庭和社交场景的虚构长对话构成，每段平均2,893轮、约33个会话，覆盖27至86天；共设计456个秘密，四种推导类型各有113至115个。每个秘密平均有8.1条证据，分散在8.0个会话，形成15.7组最小充分证据组合；单条证据不能独立推出事实。每个事实平均配26.6条高混淆干扰记录。最小切断集平均需要3.04次删除，最大为5次。作者手工设计事实结构，再用生成模型改写成对话，并逐轮核对；两名标注者审计120个分层样本，另以两种算法验证全部456个事实的最小切断集。\"\
    ,\n      \"evidence_ids\": [\"A15\", \"A17\", \"A22\", \"A51\", \"A55\", \"A56\"\
    ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"## 三种删除流程把候选发现和候选选择分开\\\
    n\\n基线S0只删除直接披露及其派生对象，用作单纯披露删除的对照。S1先按删除请求查询系统原生检索器，取排名靠前的20个来源轮次，再删除其中最高排名的10条。S2沿用同一候选池，但由写入模型根据候选文本重排并删除前10条，因此比较S1与S2主要是在固定候选范围内考察选择能力。作者称之为覆盖（证据有没有进入候选池）、选择（进入后有没有被删）和预算（允许删多少）三类问题。所有系统均记录对象来源轮次并按轮次计数、删除和快照：这样，不同系统即使保存单条消息、整段会话或派生摘要，也可在共同的来源单位上比较。\"\
    ,\n      \"evidence_ids\": [\"A23\", \"A24\"]\n    },\n    {\n      \"kind\":\
    \ \"fact\",\n      \"text\": \"比较包含Turn RAG和Session RAG两种不派生内容的检索存储，以及三种记忆系统：MemoryBank以每日摘要组织原始轮次，Nemori把主题片段改写为叙事，LightMem离线整合摘要且不保留原文。每种配置均由同一个写入模型负责写入、给删除候选打分和回答问题；四个模型分别来自DeepSeek、Qwen、GLM和MiMo。每个事实在独立存储副本上评测，以免删除一个秘密影响另一个事实。两种RAG按各自检索设置运行；因此这组结果比较的是完整配置下的表现，而不是仅改变检索粒度、其余因素完全相同的受控实验。\"\
    ,\n      \"evidence_ids\": [\"A25\"]\n    },\n    {\n      \"kind\": \"author_claim\"\
    ,\n      \"text\": \"## 删除让事实更难被看见，却未必从记忆中消失\\n\\n作者报告，S0使原生恢复率下降12至50个百分点，但残余恢复率仍为85%至99%；例如Turn\
    \ RAG原生恢复从91%—95%降至57%—60%，而残余证据仍支持大多数事实。S1后残余恢复仍有48%—86%；S2从同一20条候选中再删10条，只再降低7至17个百分点，结果仍为39%—76%。这说明删掉直接披露、或让系统检索不到答案，不能单独证明秘密已不可推导。删除后原生检索漏掉的残余恢复份额上升：Turn\
    \ RAG从删除前5%—9%升至S0后的39%—42%，再升至S2后的76%—82%。这些数值是多个记忆设计、模型和删除设置下的恢复评测，不代表真实部署中的泄露发生率。\"\
    ,\n      \"evidence_ids\": [\"A27\", \"A28\", \"A29\", \"A40\"]\n    },\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"原因分析的关键是候选覆盖，而不只是删除预算。作者在144个事实、三种系统、两个模型上扫描候选池大小与删除数：固定预算10条时，把池从20扩大到60，S2残余恢复率下降12.5至23.9个百分点；反过来，20条候选全部删掉后，Turn\
    \ RAG和LightMem仍有43%—51%可恢复，MemoryBank仍有66%—72%。池中平均只覆盖事实8.1条证据中的约4.5条（MemoryBank约3.0条），所以预算增加也无法删除池外证据。对132个扫描设置，移除证据数量与残余恢复近似线性相关，每多删一条证据约对应恢复率下降13个百分点，拟合R²为0.95。作者据此判断：在这些基线中，触及证据的能力比池内重排更限制遗忘；这不是对所有删除算法的普遍因果定律。\"\
    ,\n      \"evidence_ids\": [\"A32\", \"A33\", \"A34\", \"A67\", \"A75\"]\n   \
    \ },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"证据如何关联删除请求，也会改变检索和删除表现。作者将样本分成事实拼接、实体关系链、数值聚合、时间与状态推理四类。关系链的证据涉及请求中的人物或组织，却未必使用请求中的词，因此更难被相似度检索触及：S2平均只删掉2.4条关系链证据，而聚合事实为4.6条；关系链的残余恢复在各系统中也通常更高。案例中，用户要求忘记“公司聘用的顾问事务所属于CFO妻子”，事实依赖聘用、所有权、婚姻关系和身份四条链。20条候选只包含两条不同链上的证据，删掉它们仍未切断任何链；候选扩至30条时，虽出现可完成切断的证据，模型却没选中；扩至50条才切断一条关系链。作者提出实体扩展可能触及完整切断集，但并未评测该策略的效果。\"\
    ,\n      \"evidence_ids\": [\"A38\", \"A39\", \"A71\", \"A88\", \"A89\", \"A90\"\
    , \"A91\"]\n    },\n    {\n      \"kind\": \"inference\",\n      \"text\": \"\
    ## 记忆粒度与派生方式改变“可见”与“可删”的关系\\n\\n据此推测，工程上不应把“检索器没找到”和“记忆已不支持回答”当作同一个状态：删除后的审计至少要分别检查正常问答路径，以及从残存来源证据能否恢复秘密。作者的系统比较也显示这种分离与存储结构有关：Session\
    \ RAG每次上下文平均约13.3千token，却只含1.9条证据；Turn RAG约1.1千token，含4.8条证据。S0后两者残余恢复相近，但Session\
    \ RAG原生恢复更低，隐藏风险份额也更高。摘要或叙事把多条线索融合，可能让问题更容易命中派生内容；另一方面，按来源轮次闭包删除可能连带移除共享对象中的其他内容。因而，设计删除流程时，候选覆盖、记忆粒度和派生对象的来源追踪应一起考虑，不能只看检索命中率。\"\
    ,\n      \"evidence_ids\": [\"A36\", \"A48\", \"A49\", \"A64\", \"A24\"]\n   \
    \ }\n  ],\n  \"limitations\": [\n    \"已阅读抽取全文，未独立复现实验。评测对象是作者设计并指定证据结构的虚构文本秘密及四类推导方式；作者也说明，需要自然发生的证据结构与部署研究来判断这些轨迹在实际系统中的频率。结论限于文本记忆，不覆盖多模态或参数化记忆；三种基线复用既有检索和写入组件，也不等于专门设计的删除方法。实体扩展仅在案例中被提出，未验证有效性。\"\
    ,\n    \"残余恢复依赖人工标注的证据与充分组合、来源轮次闭包，以及指定的同一读者模型；它度量的是这些已标注存活对象对读者的支持，不是对所有可能推理路径的完备证明。来源轮次删除成本也不能表示共享派生对象中无关信息损失或下游任务效用；论文明确将效用保持留作独立评估。抽取文本虽覆盖全文，但无法核验图表版式，也不能保证数学公式、图表或附录细节在文本抽取中完整呈现。\"\
    \n  ]\n}"
