      \geq 12 h


      two-annotator initial agreement


      97.6%


      minimal cuts verified by two algorithms


      456 / 456


      Table 2: Measurement guarantees of MemCut: conditions that make the recovery
      metrics interpretable, and the values that establish them (Qwen3.8-Flash as
      the reader).


      MemCut uses author-specified evidence structures to measure post-deletion derivability.
      Each secret comes with annotated evidence and minimal sufficient sets, so deletion
      can be checked against every annotated derivation. The evidence trail is designed
      to support the secret independently of its disclosure. Table 2 summarizes the
      structural properties and validation results supporting these measurements.
      Appendix


      efapp:data gives further statistics.'
    location: https://arxiv.org/html/2610.21405v1#S3.SS3
  - id: S10
    title: Human design, model phrasing.
    text: We design each episode’s disclosures, evidence, sufficient sets, and distractors.
      GPT-6 renders this specified content as dialogue. Authors check every turn against
      the design and revise deviations, spending at least twelve hours per episode.
    location: https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px1
  - id: S11
    title: Long-horizon scenarios with something to lose.
    text: Deletion gets harder as a fact is buried in more unrelated activity, and
      it matters more when a leak would hurt someone. So each of our fifteen episodes
      follows one scenario across work, family, and social threads for one to three
      months (2,893 turns on average) and protects about thirty facts with a reason
      to stay private, 456 in all.
    location: https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px2
  - id: S12
    title: Four typical ways to derive a fact.
    text: 'We cover the four most typical ways in which ordinary records yield an
      unstated fact, and each type challenges a deleter differently.


      •


      Fact assembly: records about one entity are joined, and they share the request’s
      entities and wording.


      •


      Relation chain: records about different entities are linked, and they share
      the request’s entities but not its wording, as when a contract names a firm,
      a filing names its owner, and dinner records name the owner’s spouse.


      •


      Aggregation: values are combined, and the derivation breaks when any value is
      deleted.


      •


      Temporal and state reasoning: records are ordered in time, and a question repeats
      their time cues.


      The types have comparable fact, evidence, and distractor counts but differ in
      how evidence connects to the request (Table 5).'
    location: https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px3
  - id: S13
    title: Dispersed, redundant, and individually harmless evidence.
    text: Evidence stored in the same object as its disclosure can be deleted with
      it, so we write evidence as the ordinary business around a fact, such as a booking,
      a filing, or a dinner. This evidence is spread over eight sessions on average
      and rarely appears in the disclosure’s session, and about two dozen distractors
      per fact keep a deleter from finding it by topic alone. Because a single derivation
      chain would make forgetting look easy, each fact’s eight evidence turns form
      sixteen minimal sufficient sets on average (7,148 in all), and a deleter has
      to break all of them.
    location: https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px4
