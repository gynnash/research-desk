  [S56] Judgment grows with reach. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px6)

  A72: S1 deletes the ten top-ranked candidates, so its deletion set is unchanged
  across the pool sweep once the pool holds ten deletable turns. At a pool of ten
  both strategies delete the same turns. The gain of S2 over S1 is therefore what
  judgment adds from candidates beyond the top ten: 5–15 points at a pool of 20 and
  20–32 at a pool of 60. Judgment is worth what reach gives it to choose from.

  [S57] Partial cuts leave derivations intact. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px7)

  A73: A complete cut intersects every annotated sufficient set. At a pool of 60,
  S2 intersects 92–93% of a fact’s sufficient sets on average in Turn RAG and LightMem;
  residual recovery is still 31–40%.

  [S58] Types. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px8)

  A74: Widening reaches more aggregation evidence than relation-chain evidence. At
  a pool of 60 the Turn RAG candidates contain 6.9 of an aggregate’s evidence turns
  but 4.4 of a relation chain’s, and after S2, 3–31% of aggregates and 49–78% of relation
  chains remain recoverable across the three systems and two write models. Relation
  chains have higher residual recovery than aggregation throughout both sweeps, the
  pattern of Appendix C.

  [S59] One quantity behind both sweeps. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px9)

  A75: Across the 132 distinct settings of the two sweeps (both strategies, three
  systems, two write models), residual recovery falls almost linearly with the mean
  number of annotated evidence turns a setting removes per fact, by about 13 points
  per turn ( R^{2}=0.95 ). Given that number, the system and the write model move
  residual recovery by at most about four points, and the strategy by less than one.
  The effects of pool width, budget, and judgment on residual recovery are closely
  associated with how much evidence they remove, consistent with MemoryBank retaining
  more because its pool holds less evidence. The fitted line reaches zero near 8.2
  removed turns, close to the 8.1 evidence turns of an average fact (Table 5).

  [S60] B.4 Deletion cost and residual recovery (https://arxiv.org/html/2610.21405v1#A2.SS4)

  A76: We compare recovery at specified source-turn deletion budgets. Selecting the
  entire source history exceeds these budgets. The smallest annotated cut contains
  3.04 evidence turns on average and at most five (Table 5). Forgetting therefore
  need not require deleting every evidence turn.


  For the additional selected turns A and the target’s evidence E , the off-target
  fraction is |A\setminus E|/|A| . The denominator is the actual number selected,
  excluding the common disclosure removal. This is a source-level reference measure
  of collateral damage.


