  [S39] Derivation types. (https://arxiv.org/html/2610.21405v1#A1.SS0.SSS0.Px1)

  A53: The four types abstract the most typical ways separate records entail a proposition.
  Fact assembly joins attributes of one entity: a code name, a site visit, and an
  address make an acquisition target. Relation chains join entities: a contract names
  a firm, a filing names its owner, a dinner names the owner’s spouse, and a staff
  list names the spouse’s role. Aggregation combines values: several payments sum
  to a debt, several visits make a pattern. Temporal and state reasoning orders records
  in time: an offer, a revision, and a withdrawal fix what holds now. Longer derivations
  often compose them.

  [S40] Scale and balance. (https://arxiv.org/html/2610.21405v1#A1.SS0.SSS0.Px2)

  A54: The facts are balanced across types, and every episode is long. The 456 protected
  facts split evenly over the four derivation types, 113–115 each (Table 5), and every
  type appears in every episode six to nine times. The fifteen episodes that carry
  them hold 43,402 turns in 490 sessions (1.74M tokens); each averages 2,893 turns,
  116k tokens, and 33 sessions over 27–86 days (Table 6).

  [S41] Derivation structure. (https://arxiv.org/html/2610.21405v1#A1.SS0.SSS0.Px3)

  A55: Every fact can be derived in many ways, but never from a single evidence turn.
  A fact has 8.1 evidence turns on average (6–10; 3,700 in all), which the authors
  grouped into 7,148 minimal sufficient sets, 15.7 per fact (4–38), each of two to
  five turns (mean 2.7). Breaking all of them takes two deletions for 25.9% of facts,
  three for 45.4%, four for 28.1%, and five for 0.7%; the minimal cuts were computed
  by enumeration and agree with an independent dynamic program on all 456 facts. Each
  fact also has 26.6 distractors (16–88; 12,092 distinct turns). No evidence turn
  serves two facts, five turns are evidence for one fact and a distractor for another,
  and 62.6% of turns carry no annotation.

  [S42] Dispersion. (https://arxiv.org/html/2610.21405v1#A1.SS0.SSS0.Px4)

  A56: Evidence is spread across the episode and mostly precedes the disclosure. A
  fact’s evidence spans 8.0 sessions (5–10), with a median first-to-last span of 2,259
  turns and 29 days, and lies a median of 714 turns and eight sessions from the disclosure.
  Only 67 of the 3,700 evidence turns (1.8%) share the disclosure’s session, and 14.3%
  of facts have at least one such turn. Disclosures fall in the last third of the
  episode for 61% of facts. Time is annotated at the granularity of session dates.

