  - id: S44
    title: Before deletion.
    text: 'Every system retains what recovery needs: residual recovery is 100% in
      both verbatim stores and 94–100% in the derived systems (Table 7), so later
      drops reflect deletion rather than encoding loss, apart from a small loss of
      aggregate values at write time in LightMem (Appendix C). Native recovery is
      82–96% in every system except Session RAG, where it is 48–70% because three
      retrieved sessions hold only part of a fact’s evidence (§B.2).'
    location: https://arxiv.org/html/2610.21405v1#A2.SS1.SSS0.Px1
  - id: S45
    title: Write models.
    text: Within each system the four write models agree on residual recovery after
      S2 to within about five points, and to within ten for Session RAG. The main
      patterns of §5 are consistent across these four models within each system.
    location: https://arxiv.org/html/2610.21405v1#A2.SS1.SSS0.Px2
  - id: S46
    title: Hidden-risk share.
    text: 'The hidden-risk share rises from Full to S2 in all 20 configurations, monotonically
      in the 16 outside Session RAG (Table 8). Session RAG hides the most at every
      level, from 30–52% before any deletion to 83–92% after S2.


      The share is a conservative estimate.


      Native and residual recovery are answered independently.


      As a result, native recovery finds a few facts that residual recovery misses.


      In the six configurations that we analyze per fact (MemoryBank, Nemori, and
      LightMem with DeepSeek and Qwen), these facts make up 4.8% of native successes.


      Let R and N be the sets of facts that residual and native recovery find.


      The share of facts in R that native recovery misses is |R\setminus N|/|R| .


      The reported share also subtracts the facts in N that are not in R , so it is
      a lower bound on |R\setminus N|/|R| .


      In the six configurations, |R\setminus N|/|R| is 0–12 points higher than the
      reported share, and the gap is largest after S2.


      After S2 it is 80–85% in MemoryBank and 52–62% in Nemori and LightMem, while
      the reported share is 78–82% and 43–56%.


      It also rises from Full to S2 in all six configurations.


      The reported share is therefore conservative about the level of hidden risk
      in these configurations.'
    location: https://arxiv.org/html/2610.21405v1#A2.SS1.SSS0.Px3
  - id: S47
    title: Collateral deletion at S0.
    text: 'Most of the residual recovery that derived systems lose at S0 was carried
      away by closure deletion: a derived object that also contains the disclosure
      goes with it, together with any evidence it summarized. The largest overall
      loss, 13 points for Nemori with DeepSeek, is close to the share of facts with
      at least one evidence turn in the disclosure’s session (14.3%, Table 5). Four
      fifths of the loss falls on aggregation, for reasons given in Appendix C.'
    location: https://arxiv.org/html/2610.21405v1#A2.SS1.SSS0.Px4
  - id: S48
    title: Retrieval unit.
    text: Session retrieval reads more and finds less. At the evaluated retrieval
      depths, a Session RAG context averages 13.3k tokens and holds 1.9 evidence turns,
      a Turn RAG context 1.1k tokens and 4.8. After the disclosure is deleted, the
      two stores’ residual recovery agrees to within about two points in 15 of the
      16 model–type cells of Table 3, while Session RAG’s native recovery is 31–43
      points lower and its hidden-risk share is 71–82% against 39–42%. After cleanup
      Session RAG also leaves 10–23 points more recoverable, because its candidate
      pools are diluted by non-evidence turns from the same sessions.
    location: https://arxiv.org/html/2610.21405v1#A2.SS2.SSS0.Px1
  - id: S49
    title: Derivation strength.
    text: 'Retrieval units help explain native recovery. In MemoryBank it is one turn,
      so once the disclosure is gone each evidence turn has to match the question
      on its own: deleting the disclosure costs 46–50 points of native recovery, and
      after cleanup four in five of the 72–76% of facts that remain recoverable are
      unseen by the system’s own retrieval. In Nemori it is a narrative or a distilled
      fact that fuses several turns, and in LightMem a consolidated entry that fuses
      more; such objects can still match the question without the disclosure, consistent
      with the smaller losses of 29–36 and 12–20 points. What a system retains follows
      instead how much evidence its deletion pool reaches (§B.3): MemoryBank’s pool
      of twenty holds 3.0 of a fact’s evidence turns against 4.5 in Turn RAG and LightMem,
      and cleanup lowers its residual recovery by only 18–23 points, against 33–38
      in Nemori and 47–52 in LightMem. Closure deletion also removes a whole object
      when any of its source turns goes; what it costs in unrelated memory is a separate
      question, which we leave to future work.'
    location: https://arxiv.org/html/2610.21405v1#A2.SS2.SSS0.Px2
