  - id: S4
    title: 2 Related Work
    text: 'Figure 2: One MemCut sample, abridged. Top: weeks of ordinary conversation
      hold one disclosure (D), evidence that never states the fact (E1–E3), and look-alike
      records (L1–L4). Bottom: deletion removes the disclosure and the look-alikes
      that resemble it. Retrieval misses an evidence turn, so the system cannot answer.
      However, the stored evidence (E1–E3) together still gives the answer.'
    location: https://arxiv.org/html/2610.21405v1#S2
  - id: S5
    title: Long-term memory and recall.
    text: Long-term memory helps LLM agents reuse information across interactions
      (Zhong et al., 2024; Chhikara et al., 2025; Zhang et al., 2024; Zhu et al.,
      2026). Most work focuses on accurate and efficient recall (Maharana et al.,
      2024; Wu et al., 2025). However, similarity-based retrieval may miss evidence
      linked through entities rather than similar wording, as in multi-hop QA (Yang
      et al., 2018; Trivedi et al., 2022). These omissions can also limit cleanup
      when retrieval supplies deletion candidates (§6.1).
    location: https://arxiv.org/html/2610.21405v1#S2.SS0.SSS0.Px1
  - id: S6
    title: Forgetting and unlearning.
    text: Memory must also forget sensitive information. Parametric unlearning and
      model editing target information in model weights, where an edited fact’s consequences
      can persist (Bourtoule et al., 2021; Cohen et al., 2024). In external memory,
      benchmarks test updated information, reuse of obsolete facts, or direct recall
      after deletion (Hu et al., 2026; Uddin et al., 2026; Yang, 2026). MemLeak also
      examines recovery through correlated cues (Wang and Zhang, 2026). MemCut tests
      whether surviving records jointly reveal a secret that none states directly.
      We annotate every minimal supporting combination. Table 1 compares these benchmarks.
    location: https://arxiv.org/html/2610.21405v1#S2.SS0.SSS0.Px2
  - id: S7
    title: 3.1 Task definition
    text: 'We define a secret in MemCut as a protected fact, and we call its trail
      the fact’s evidence, which consists of the turns that support it without stating
      it.


      Each sample pairs one protected fact with an episode, which is a long multi-session
      conversation stored as objects traceable to their source turns. Figure 2 shows
      one sample.


      We also annotate its disclosure (turns stating it), its sufficient sets (minimal
      evidence combinations implying it, since the fact can be derived in many ways),
      and its distractors (look-alike turns that resemble the evidence).


      Writing D for the disclosure, E for the evidence, and \mathcal{S} for the sufficient
      sets, a deletion X forgets the fact when


      D\subseteq X\quad\text{and}\quad X\cap S\neq\emptyset\;\text{ for every }S\in\mathcal{S}.


      A set of evidence turns that meets every sufficient set is a cut, and the minimal
      cut is the smallest one.


      The task has two sides. A deleter receives a natural-language deletion request
      and removes objects from the store, and we then test whether the fact is still
      recoverable with a four-choice question that allows the model to decline.'
    location: https://arxiv.org/html/2610.21405v1#S3.SS1
  - id: S8
    title: 3.2 Two recovery metrics
    text: 'We design two metrics to measure whether a deleted fact is still recoverable.
      Native recovery asks the fact’s question through the system’s own retrieval,
      so it measures what the assistant still brings up. Residual recovery skips retrieval
      and gives the model every surviving object derived from the fact’s evidence
      or disclosure, so it measures what the memory still supports. It estimates what
      the chosen reader can recover from these objects, providing a reference for
      native recovery.


      The pair rests on three design choices. First, the same model answers both,
      holding the reader fixed. Second, cleanup and native recovery query the same
      retriever with the request and question, respectively. Third, deleting a turn
      removes every object derived from it (closure), so residual recovery sees only
      what the deleter kept. We call the gap between the two, as a share of residual
      recovery, the hidden-risk share,


      \mathrm{Hid.}=\frac{\mathrm{Res}-\mathrm{Nat}}{\mathrm{Res}},


      and Appendix B.1 shows that it is a conservative estimate of the share of residual
      successes that native recovery misses.'
    location: https://arxiv.org/html/2610.21405v1#S3.SS2
