  efapp:data gives further statistics.

  [S10] Human design, model phrasing. (https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px1)

  A14: We design each episode’s disclosures, evidence, sufficient sets, and distractors.
  GPT-6 renders this specified content as dialogue. Authors check every turn against
  the design and revise deviations, spending at least twelve hours per episode.

  [S11] Long-horizon scenarios with something to lose. (https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px2)

  A15: Deletion gets harder as a fact is buried in more unrelated activity, and it
  matters more when a leak would hurt someone. So each of our fifteen episodes follows
  one scenario across work, family, and social threads for one to three months (2,893
  turns on average) and protects about thirty facts with a reason to stay private,
  456 in all.

  [S12] Four typical ways to derive a fact. (https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px3)

  A16: We cover the four most typical ways in which ordinary records yield an unstated
  fact, and each type challenges a deleter differently.


  •


  Fact assembly: records about one entity are joined, and they share the request’s
  entities and wording.


  •


  Relation chain: records about different entities are linked, and they share the
  request’s entities but not its wording, as when a contract names a firm, a filing
  names its owner, and dinner records name the owner’s spouse.


  •


  Aggregation: values are combined, and the derivation breaks when any value is deleted.


  •


  Temporal and state reasoning: records are ordered in time, and a question repeats
  their time cues.


  The types have comparable fact, evidence, and distractor counts but differ in how
  evidence connects to the request (Table 5).

  [S13] Dispersed, redundant, and individually harmless evidence. (https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px4)

  A17: Evidence stored in the same object as its disclosure can be deleted with it,
  so we write evidence as the ordinary business around a fact, such as a booking,
  a filing, or a dinner. This evidence is spread over eight sessions on average and
  rarely appears in the disclosure’s session, and about two dozen distractors per
  fact keep a deleter from finding it by topic alone. Because a single derivation
  chain would make forgetting look easy, each fact’s eight evidence turns form sixteen
  minimal sufficient sets on average (7,148 in all), and a deleter has to break all
  of them.

  [S14] Questions that test memory, not guessing. (https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px5)

  A18: To ensure that a fact counts as recovered only when memory gives the answer,
  wrong options differ from the answer in one detail, the model may decline, and the
  model has to answer correctly under both option orders.


