  [S2] Abstract (https://arxiv.org/html/2610.21405v1#abstract1)

  A2: Long-term memory has become a crucial component of large language model (LLM)
  agents, with most research focusing on retrieving relevant information accurately
  and efficiently. However, a dependable memory system must also forget sensitive
  user data upon request. To evaluate this capability, we introduce MemCut, a systematic
  benchmark for user-requested forgetting. Its 456 hand-designed secrets in long-horizon
  conversations have fully annotated evidence trails to test recovery after deletion,
  including from messages that never state the secrets directly. We propose two recovery
  metrics. Native recovery measures reader success through the system’s retrieval,
  whereas residual recovery measures the same reader’s success when directly given
  surviving objects traced to annotated disclosures or evidence. We establish three
  reference deletion baselines to test how far existing retrievers and write models
  support forgetting across five memory designs and four LLMs. Disclosure removal
  reduces native recovery far more than residual recovery. LLM-guided deletion of
  ten additional turns from twenty retrieval candidates leaves 39–76% residual recovery.
  Subset sweeps (144 facts, three systems, two models) show that widening the pool
  at a fixed budget reduces residual recovery more than deleting all original candidates.

  A3:  These sweeps identify candidate coverage as a bottleneck in the reference baselines.

  [S3] 1 Introduction (https://arxiv.org/html/2610.21405v1#S1)

  A4: Long-term memory is becoming an important part of LLM agents (Packer et al.,
  2023; Zhong et al., 2024; Chhikara et al., 2025), and most research has focused
  on retrieving the right memories quickly and accurately (Maharana et al., 2024;
  Wu et al., 2025). However, dependable memory should also forget sensitive information,
  such as a diagnosis or a confidential deal, when users ask. This ability has received
  much less attention than recall.


  Figure 1: The message that directly discloses the secret is deleted, but the secret
  remains recoverable from the surviving trail. The assistant can no longer answer
  a colleague, while ordinary messages that never state the secret still reveal it
  when combined.


