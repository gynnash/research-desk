  [S15] Checking the design. (https://arxiv.org/html/2610.21405v1#S3.SS3.SSS0.Px6)

  A22: We check the dialogue with Qwen3.8-Flash as an independent reader. Recovery
  is 96–99% from combined evidence and 0% in three controls: the best single evidence
  turn, the episode after removing annotated evidence and disclosure, and the question
  and options alone. Two annotators audit 120 stratified facts. Two algorithms verify
  minimal cuts against the annotated sufficient sets for all 456 facts.

  [S16] 4.1 Reference deletion baselines (https://arxiv.org/html/2610.21405v1#S4.SS1)

  A23: We establish three reference deletion baselines to benchmark forgetting with
  existing recall components. They reuse native retrievers and write models with minimal
  adaptation.


  S0 deletes the disclosure and all objects derived from it, providing a common baseline
  for disclosure removal.


  S1 adds retrieval-ranked cleanup. For a request q , S1 constructs a twenty-turn
  candidate pool P_{q} from one query to the system’s retrieval and deletes its ten
  highest-ranked turns. No fact has more than ten evidence turns, and a minimal cut
  needs at most five. The budget therefore suffices if supporting evidence is reached
  and selected.


  S2 reranks the same twenty candidates with the write model using their stored text
  and deletes the top ten (LLM-guided cleanup). The fixed pool isolates selection.
  Choice failures leave evidence unselected within the pool. Reach failures leave
  evidence outside it. Neither cleanup sees annotations. Section 6.1 varies pool and
  budget. At fixed cleanup budgets, the fraction of non-evidence selections provides
  a source-level reference measure of collateral damage (Appendix B.3).

  [S17] 4.2 One unit for every system (https://arxiv.org/html/2610.21405v1#S4.SS2)

  A24: Systems store different objects, so deleting one object removes a turn in one
  system but a whole session in another, and object counts are not comparable. However,
  every object derives from turns, so we anchor every operation to the turn. We record
  each object’s source turns at ingestion, delete by closure, and count pools and
  budgets in turns, so systems differ only in what they store and how they retrieve.
  Because the protocol needs only that a system can list, search, delete, and snapshot
  its objects, it extends to other designs, and we release its harness.

  [S18] 4.3 Memory systems and models (https://arxiv.org/html/2610.21405v1#S4.SS3)

  A25: We compare five memory designs along two properties, the unit retrieved and
  how much is derived (§6.2). Two retrieval stores keep every turn verbatim, retrieve
  by dense similarity (Karpukhin et al., 2020; Lewis et al., 2020), and derive nothing.
  They retrieve turns (Turn RAG) or sessions (Session RAG), letting us examine granularity
  under their respective retrieval settings. Three memory systems add derivation of
  increasing strength. MemoryBank keeps raw turns under daily summaries (Zhong et
  al., 2024), Nemori rewrites topical segments into narratives (Ma et al., 2025),
  and LightMem consolidates summaries offline without the raw text (Fang et al., 2025).
  Each system keeps its own retrieval. The verbatim stores test whether residual recovery
  can persist without summarization or rewriting.


  In each configuration, one write model writes memory, scores deletion candidates,
  and answers questions, as in a deployed assistant. We use four write models from
  four developers, DeepSeek-V4.1-Flash, Qwen3.8-Flash, GLM-5.3-Flash, and MiMo-V2.5,
  which perform strongly and are efficient enough for thousands of deletion runs,
  and we run every system with each of them to separate the effects of the memory
  design from those of the model. Each fact is evaluated on a fresh copy of the store,
  so deleting one fact cannot affect another.

  [S19] 5 Results: Deleting Is Not Forgetting (https://arxiv.org/html/2610.21405v1#S5)

  A26: Tables 3 and 4 give the main results. Table 7 reports that residual recovery
  is 94–100% in every store before deletion, limiting the contribution of ingestion
  loss to post-deletion recovery. Within each system, residual recovery after S2 varies
  by at most about five points across the four write models, ten for Session RAG.
  We report ranges over the four and focus on patterns that recur across them.

  [S20] 5.1 Disclosure deletion mainly reduces visibility (https://arxiv.org/html/2610.21405v1#S5.SS1)

  A27: Figure 3: Why cleanup fails. (a, b) Residual recovery as the candidate pool
  widens (budget ten) and as the budget grows (pool twenty); dashed vertical lines
  mark the main setting. Solid lines: LLM-guided cleanup (S2); dashed: retrieval-ranked
  cleanup (S1); each line is the mean of DeepSeek and Qwen, with a band for their
  range, on the 144 facts of EP01–05 (Appendix B.3). (c) Native recovery after S0
  against residual recovery after cleanup, per type and system; dark marks are means
  over the four write models, light marks are single models. (d) Hidden-risk share
  after cleanup by type, systems ordered by derivation strength.


  Disclosure deletion (S0) initially appears effective. Native recovery drops by 12–50
  points, in Turn RAG from 91–95% to 57–60%, so the assistant answers fewer questions
  correctly. Residual recovery nevertheless stays at 85–99%. Only 1.8% of the evidence
  shares a session with the disclosure, reflecting its wide dispersion. S0 also removes
  disclosure-derived objects by closure, but most indirect evidence remains.

  [S21] 5.2 Retrieval-based cleanup leaves substantial residual recovery (https://arxiv.org/html/2610.21405v1#S5.SS2)

  A28: After S1, residual recovery remains at 48–86%, although ten deletions could
  remove every annotated evidence turn of any fact. Turn RAG stores raw turns and
  derives nothing, ruling out survival through summaries, but its residual recovery
  remains at 59–62%. These outcomes motivate testing whether supporting evidence lies
  outside the candidate pool or remains unselected within it.


  S2 asks an LLM to choose among the same twenty candidates, allowing it to select
  evidence ranked below the top ten. It lowers residual recovery by another 7–17 points,
  to 39–76%. This improvement shows that selection matters, but the remaining recovery
  may reflect incomplete coverage or imperfect selection. Section 6.1 tests these
  explanations by varying the pool and budget.

  [S22] 5.3 Deletion increases the hidden-risk share (https://arxiv.org/html/2610.21405v1#S5.SS3)

  A29: Deletion increases the reported share of residual recovery missed by native
  retrieval. In Turn RAG the hidden-risk share goes from 5–9% before deletion to 39–42%
  after S0 and 76–82% after S2, and across all 20 configurations it ends above where
  it started, above one half in 14 of them, as the Hid. columns of Tables 3 and 4
  show.


  Cleanup targets records retrieved by the deletion request, whereas question answering
  uses a different query. Evidence that is difficult to retrieve may survive cleanup
  and remain unseen during later questions. Native answers can therefore suggest successful
  forgetting even when the same reader still recovers the secret from surviving evidence.

  [S23] 6 Analysis: Why Forgetting Fails (https://arxiv.org/html/2610.21405v1#S6)

  A30: Figure 4: A relation-chain fact under LLM-guided cleanup (Turn RAG, S2). (a)
  Recovery needs one evidence turn per link, so emptying any link makes it underivable.
  (b) Similarity ranks of evidence and disclosure (#7, deleted by S0), and what S2
  deletes (struck through) from pools of 20, 30, and 50; E2 enters at 30 but is kept
  (circled).


  To identify bottlenecks in forgetting with existing components, we examine candidate
  coverage, memory design, and fact type.

  [S24] 6.1 Budget, choice, and reach (https://arxiv.org/html/2610.21405v1#S6.SS1)

  A31: Cleanup leaves a great deal behind, and there are three candidate explanations:
  the budget may be too small, the evidence may enter the candidate pool but not be
  chosen, or the evidence may never enter the pool at all. These are the budget, choice,
  and reach of §4.1. They respond differently when the pool and the budget change,
  so Figure 3a–b varies each with the other held at the main setting.

  [S25] Budget. (https://arxiv.org/html/2610.21405v1#S6.SS1.SSS0.Px1)

  A32: For S2, gains diminish beyond ten deletions, and deleting the entire pool of
  twenty still yields residual recovery of 43–51% in Turn RAG and LightMem and 66–72%
  in MemoryBank. Extra budget can remove only turns already in the pool. In the sweep
  subset, widening the pool from twenty to sixty at budget ten lowers reported S2
  residual recovery by 12.5–23.9 points.

  [S26] Choice. (https://arxiv.org/html/2610.21405v1#S6.SS1.SSS0.Px2)

  A33: Choice can fail, as E2 in Figure 4 shows. Deleting the whole pool tests whether
  removing the unselected candidates would materially improve forgetting. Measured
  recovery need not be monotonic in deletion, since the reader can respond differently
  to the remaining context. In Table 9, whole-pool deletion lowers residual recovery
  by at most 6.5 points versus S2 at budget ten. These subset sweeps identify candidate
  coverage as the main bottleneck within the evaluated cleanup baselines.

  [S27] Reach. (https://arxiv.org/html/2610.21405v1#S6.SS1.SSS0.Px3)

  A34: Candidate reach limits these retrieval-based cleanup baselines. The pool holds
  only about half of a fact’s evidence, because other candidates resemble the request
  more than the evidence does. A minimal cut averages only three turns. A complete
  cut combines turns that jointly intersect every sufficient set. Across the 132 settings
  of the two sweeps, residual recovery tracks the number k of evidence turns removed
  almost exactly,


  \mathrm{Res}\approx 13\,(8.2-k)\qquad(R^{2}=0.95),


  while system, model, and strategy together shift it by at most four points. The
  fitted line extrapolates to zero near k=8.2 , nearly all the evidence of an average
  fact. For the evaluated deleters, removing more evidence strongly predicts lower
  residual recovery, linking their performance to the evidence their pools reach.
  Individual facts may need far fewer deletions when a complete cut is reached and
  selected.


  Annotations were fixed before system evaluation and validated independently of retrieval
  and deletion results. The pool and budget sweeps then distinguish reach and selection
  limitations using these fixed annotations.

  [S28] 6.2 Retrieval unit and derivation (https://arxiv.org/html/2610.21405v1#S6.SS2)

  A35: The five memories of §4.3 retrieve different units and store different derived
  content, which may shape candidate coverage and both recovery metrics.

  [S29] Granularity. (https://arxiv.org/html/2610.21405v1#S6.SS2.SSS0.Px1)

  A36: Turn RAG and Session RAG hold the same text and derive nothing, allowing a
  comparison under their respective retrieval settings. Both yield 96–99% residual
  recovery after S0, but Session RAG hides far more, with a hidden-risk share of 71–82%
  against 39–42%. Its three retrieved sessions hold only 1.9 evidence turns, against
  4.8 in Turn RAG’s sixteen turns. Session RAG’s cleanup also removes only 33–45 points
  of residual recovery against 51–56, because whole-session candidates are mostly
  not evidence. Under these settings, facts are harder both to see and to delete with
  session retrieval.

  [S30] Derivation. (https://arxiv.org/html/2610.21405v1#S6.SS2.SSS0.Px2)

  A37: Stronger derivation does not consistently correspond to higher residual recovery
  across the evaluated systems. Although LightMem has the strongest derivation, its
  residual recovery resembles Turn RAG’s (39–43% against 41–46%). MemoryBank has the
  lightest derivation and the highest residual recovery (72–76%), alongside lower
  candidate coverage (3.0 evidence turns against 4.5 in Turn RAG and LightMem). Derived
  objects may alter visibility by combining evidence and matching the question without
  the disclosure. After cleanup the hidden-risk share is 78–82% in MemoryBank against
  41–56% in Nemori and LightMem. This pattern is consistent with derived objects changing
  which surviving evidence native retrieval exposes.

  [S31] 6.3 Derivation types (https://arxiv.org/html/2610.21405v1#S6.SS3)

  A38: To break every annotated derivation, a deleter must reach and select a complete
  cut. The four types have similar amounts of evidence but differ in how that evidence
  relates to the request. Relation chains have the smallest annotated cuts (2.7 turns);
  nevertheless, their evidence may be difficult to retrieve because it names the request’s
  people and firms without using its words. Small cuts therefore need not yield low
  residual recovery under these baselines.


  Figure 3c shows that relation chains retain the most residual recovery after cleanup
  on average. Recovery drops 24 points from S0 to S2, and a Turn RAG pool of sixty
  holds 4.4 of their evidence turns against 6.9 for aggregation. Figure 3d shows hidden-risk
  shares of 81–94% across systems, plausibly because their links span topics while
  derived objects combine turns within topics. Aggregation loses 58 points to cleanup:
  more of its evidence enters the pool, allowing deletions to break its derivations.
  Under these baselines, evidence linked by entities rather than wording is associated
  with lower candidate coverage and higher residual recovery.

  [S32] 7 Case Study (https://arxiv.org/html/2610.21405v1#S7)

  A39: Figure 4 shows LLM-guided cleanup of a relation-chain fact in Turn RAG (Appendix
  D). The user asks the assistant to forget that their company hired a firm the company’s
  CFO’s wife owns. The fact rests on four links, (i) hiring, (ii) ownership, (iii)
  relationship, and (iv) identity, and it is forgotten once both evidence turns of
  any one link are deleted.


  The evidence shares the request’s entities but little of its wording, ranking 3–141
  by similarity. The pool of 20 holds only two evidence turns from different links.
  S2 deletes both with budget to spare, but neither link is cut, so the fact remains
  derivable (§6.1). With a pool of 30, E2 becomes available, but S2 leaves it unselected
  even though deleting it alongside E1 would cut the hiring link. At 50, S2 deletes
  E5 and E6, breaking the relationship link. A wider pool enables a complete cut,
  but S2 must still select all its turns. Every evidence turn is one hop from a request
  entity, so following entities could reach a complete cut.

  [S33] 8 Conclusion (https://arxiv.org/html/2610.21405v1#S8)

  A40: We introduce MemCut, a benchmark of 456 hand-designed secrets with annotated
  evidence trails, for evaluating forgetting in long-term agent memory. Its metrics
  distinguish native recovery from recovery by the same reader given surviving evidence.
  Across five memory designs, four models, and three reference baselines, disclosure
  deletion reduces native recovery far more than residual recovery. LLM-guided deletion
  of ten further turns from twenty retrieval candidates leaves 39–76% residual recovery,
  with higher reported hidden-risk shares than before deletion. Subset sweeps identify
  candidate coverage as the main bottleneck in the evaluated reference baselines.

  [S34] Limitations (https://arxiv.org/html/2610.21405v1#Sx1)

  A41: Controlled evaluation.


  MemCut evaluates forgetting for secrets with specified evidence trails across four
  derivation types. Controlled construction supports comparisons of candidate coverage,
  deletion choices, and residual recovery under fixed annotations. The episodes model
  recurring work, family, and social activities. Deployment studies can establish
  how often these trails occur and how forgetting performance changes with naturally
  occurring evidence structures.


  Reference baselines.


  Our reference baselines reuse existing retrieval and write components through a
  common deletion procedure. The sweeps examine candidate coverage and selection within
  this setting. These results establish reference performance for this reuse strategy.
  MemCut also supports evaluating dedicated erasure methods that expand candidate
  coverage or change memory indexing.


  Scope.


  We study text memory. Multimodal and parametric memory remain outside our scope.


  The source-level measure does not capture unrelated content removed through closure
  or downstream utility loss.

  [S35] Ethics Statement (https://arxiv.org/html/2610.21405v1#Sx2)

  A42: MemCut contains no real personal data; all people, organizations, and events
  are fictional. Describing how deleted secrets can be reconstructed could be misused.
  However, the reconstruction relies only on ordinary retrieval and reading of stored
  memory, and we believe that measuring this risk is a prerequisite for reducing it.
  The annotation audit was carried out by two graduate students in NLP who had no
  part in building the benchmark; each worked about 25 hours and was told in advance
  that all content is fictional. The benchmark will be released for research use.

  [S36] Use of AI Assistants (https://arxiv.org/html/2610.21405v1#Sx3)

  A43: We used generative models to phrase author-designed dialogue and polish the
  manuscript.


  The research questions, the design of the benchmark and the experiments, the analyses,
  and every figure, table, and number were produced by the authors.

