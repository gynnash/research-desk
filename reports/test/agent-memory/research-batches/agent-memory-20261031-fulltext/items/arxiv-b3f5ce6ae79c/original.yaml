  [S61] Appendix C Leakage by Derivation Type (https://arxiv.org/html/2610.21405v1#A3)

  A80: The four derivation types of §3.3 differ in how their evidence relates to a
  deletion request, not in how much evidence they have (Table 5). Section 6 reads
  them through derivation and reach (Figure 3c–d); Table 12 summarizes each type over
  the 16 configurations outside Session RAG and Table 13 gives the per-type results
  in full. After cleanup, relation chains have the highest residual recovery in 12
  of these configurations and aggregation the lowest in all 16; temporal facts, whose
  time cues the question repeats, and fact assembly, whose evidence shares the request’s
  wording, stay the most visible after S0 (77% and 74%). Four further regularities
  follow from the same relation between a type’s evidence and the request.

  [S62] Relation chains are hard to recall and forget. (https://arxiv.org/html/2610.21405v1#A3.SS0.SSS0.Px1)

  A81: Relation chains are also the type retrieval answers least well before any deletion,
  81% against 90–96% for the others and 68% in LightMem, and deleting the disclosure
  costs them 63 points of native recovery against 18–30. Their visibility rests almost
  entirely on the one turn that states them: at S0, LightMem still answers 94% of
  fact-assembly and 90% of temporal questions but only 30% of relation chains. Their
  evidence names the right people and firms but not in the words of the question or
  request, which may hinder similarity retrieval for both answering and deletion.

  [S63] Judgment helps least where reach fails most. (https://arxiv.org/html/2610.21405v1#A3.SS0.SSS0.Px2)

  A82: Replacing retrieval ranking with LLM judgment lowers residual recovery by 14
  points for fact assembly and aggregation, 11 for temporal facts, and 8 for relation
  chains (Table 12). The smaller gain for relation chains is consistent with limited
  candidate coverage: judgment can select only turns already in the pool.

  [S64] Coarse retrieval costs aggregation most. (https://arxiv.org/html/2610.21405v1#A3.SS0.SSS0.Px3)

  A83: On the same text, Session RAG answers fewer questions than Turn RAG after S0
  for every type, but by different margins: about 54 points for aggregation, 37 to
  38 for fact assembly and temporal facts, and 17 for relation chains (Table 3). An
  aggregate needs several values at once, and three retrieved sessions rarely contain
  all of them; relation chains lose least because turn retrieval already fails to
  surface them.

  [S65] Derivation reveals every type but relation chains. (https://arxiv.org/html/2610.21405v1#A3.SS0.SSS0.Px4)

  A84: For fact assembly, aggregation, and temporal facts, the hidden-risk share after
  S2 falls from 68–85% in Turn RAG and MemoryBank to 20–39% in Nemori and LightMem
  (Figure 3d), consistent with derived objects combining evidence within topics. Relation
  chains stay 81–94% hidden in every system, likely because their links span topics
  (§6.2).

  [S66] Aggregation also loses what deletion did not target. (https://arxiv.org/html/2610.21405v1#A3.SS0.SSS0.Px5)

  A85: Aggregation is the only type whose residual recovery falls when only the disclosure
  is deleted: 15 points on average against at most 3 for the others, and 4 to 13 points
  even in Turn RAG, which derives nothing. Co-location does not explain it, since
  temporal facts share a session with their disclosure as often, in a fifth of facts
  (Table 5), and lose about one point. Two effects do. First, an aggregate has to
  be computed from several values, and the disclosure states the result, so once the
  disclosure is gone the reader has to carry out the computation itself, which it
  does less reliably than it reads a stated fact. The evidence still suffices by design.
  The reader recovers 96–99% of facts from evidence alone in the validation of §3.3,
  with misses concentrated in aggregation, consistent with arithmetic errors. Second,
  in derived systems a summary that folds the disclosure together with other values
  goes with it under closure. Part of aggregation’s small residue after cleanup is
  therefore collateral rather than evidence the deleter found, although cleanup also
  deletes more aggregation evidence than any other type (Table 10). LightMem also
  loses aggregate values at write time, with 92% residual recovery before deletion,
  the lowest of any type–system pair.

  A86:  In two cells native recovery of aggregation slightly exceeds residual recovery,
  which may miss aggregated values in objects without an annotated evidence source.
  The hidden-risk share remains a lower bound on the share of residual successes missed
  by native recovery.

  [S67] Appendix D Case Study Details (https://arxiv.org/html/2610.21405v1#A4)

  A87: This appendix gives the full record of the fact in Figure 4: its evidence and
  cuts, where similarity to the request ranks each evidence turn, what S2 deletes
  at each pool size, and how entity expansion could reach a complete cut.

  [S68] The fact and its cuts. (https://arxiv.org/html/2610.21405v1#A4.SS0.SSS0.Px1)

  A88: The fact is that Arden Advisory, the firm the user’s company hired, belongs
  to Nina Shah, the wife of its CFO, Ravi Shah. It rests on four links, each with
  two evidence turns: hiring, the Q3 contract with Arden (E1) and a note that Ravi,
  the CFO, hired Arden (E2); ownership, Arden’s filing listing Nina Shah as sole owner
  (E3) and Nina’s engagement letter as Arden’s owner (E4); relationship, the offsite
  dinner Ravi and his wife Nina host (E5) and a table booked for their wedding anniversary
  (E6); identity, the same note (E2) and a staff line naming Ravi Shah as CFO (E7).
  Recovery needs one evidence turn from every link, so the minimal cuts are \{ E1,
  E2 \} , \{ E3, E4 \} , \{ E5, E6 \} , and \{ E2, E7 \} , two turns each.

  [S69] Similarity scatters the evidence. (https://arxiv.org/html/2610.21405v1#A4.SS0.SSS0.Px2)

  A89: For the request “Forget that the firm we hired belongs to our CFO’s wife”,
  the evidence turns rank 3 (E1), 14 (E3), 22 (E2), 36 (E5), 45 (E6), 53 (E4), and
  141 (E7), so the main-table pool of 20 holds only E1 and E3, one evidence turn from
  each of two links. They share entities with the request but almost no wording, while
  records above and between them share its words without supporting the fact: a booking
  at the Arden Hotel, an old vendor list, an advisory budget, an advisory call, a
  note about a Nina in HR, an address on Arden Street. The disclosure itself ranks
  seventh; S0 deletes it, and it is excluded from every pool.

  [S70] S2 completes a cut only at fifty. (https://arxiv.org/html/2610.21405v1#A4.SS0.SSS0.Px3)

  A90: With a budget of ten, S2 deletes E1 from a pool of 10 and E1 and E3 from a
  pool of 20; the pool holds at most one evidence turn per link, S2 deletes what it
  holds, the budget never binds, and the fact stays derivable. From a pool of 30,
  E2 is in the pool and never selected, although with E1 it would complete the hiring
  cut: it reads as a routine record of a hire and says nothing about ownership. At
  40, E5 joins the deleted turns. At 50, E6 enters the pool and is deleted; the relationship
  link has lost both evidence turns, and the fact is no longer derivable. At 60, E4
  is deleted as well, emptying the ownership link too. E7 enters no pool we ran. In
  miniature, this is why the budget curve of Figure 3b is flat while the pool curve
  of Figure 3a falls.

  [S71] Following entities could reach a complete cut. (https://arxiv.org/html/2610.21405v1#A4.SS0.SSS0.Px4)

  A91: Every evidence turn is one hop from an entity the request refers to: Ravi,
  the CFO, links to E2, E5, E6, and E7; Arden, the firm, to E1, E2, E3, and E4; Nina,
  the wife, to E3, E4, E5, and E6. In this example, entity expansion could place a
  complete cut within a ten-turn pool; its effectiveness as a deletion strategy remains
  untested.

  [S72] Appendix E Additional Related Work (https://arxiv.org/html/2610.21405v1#A5)

  A92: Beyond the five memories evaluated here, other agent memories (Park et al.,
  2023; Wang et al., 2023; Xu et al., 2025; Rasmussen et al., 2025; Gutiérrez et al.,
  2024; Zhu et al., 2026; Park, 2026) vary the same two properties (§6.2). Long-term
  memory is also evaluated for recall (Xu et al., 2022; Tan et al., 2025); forgetting
  in model parameters is studied through unlearning and knowledge editing (Jang et
  al., 2023; Maini et al., 2024; Shi et al., 2025; Meng et al., 2022; Zhong et al.,
  2023); and contextual-privacy benchmarks test whether models disclose information
  in the wrong context (Mireshghallah et al., 2024; Shao et al., 2024).'
