      Table 1: Data construction in benchmarks for long-term memory, forgetting, and
      unlearning. Probe: test after forgetting. Human design: facts designed by people.
      LLM-free: no fact invented by an LLM, which may only phrase text. All checked:
      every item checked by people. \LEFTcircle partly.


      To evaluate this capability, we introduce MemCut, a benchmark for user-requested
      forgetting in long-term agent memory. It tests whether a protected fact remains
      recoverable after deletion and helps diagnose why deletion succeeds or fails.


      A user may ask an assistant to forget a secret they shared, and the GDPR recognizes
      a right to erasure (European Parliament and Council of the European


      Union, 2016). Removing the disclosing record deletes the explicit statement,
      but ordinary records that never state the secret can still reveal it together.
      Figure 1 gives an example. A sufficient cut must break every supporting evidence
      combination without necessarily removing every related record.


      An assistant’s failure to answer does not establish successful forgetting. Its
      retriever may miss surviving evidence that another query or retriever can expose.
      We therefore propose two recovery metrics. Native recovery measures reader success
      through the system’s own retrieval. Residual recovery measures the same reader’s
      success when directly given all surviving memory objects traced to annotated
      disclosures or evidence. Dividing their gap by residual recovery gives the hidden-risk
      share, a lower bound on the share of residual successes missed by native retrieval.


      MemCut contains 456 hand-designed secrets in long-horizon conversations. For
      each secret, we annotate the deletion request, disclosure, evidence in other
      records, and look-alike records that do not support it. We also mark the minimal
      evidence combinations that imply the secret. These annotations support recovery
      measurement and analysis of surviving evidence.


      We ask how far existing memory components support user-requested forgetting
      and what limits their effectiveness. We evaluate five memory designs and four
      LLMs using three reference deletion baselines that reuse native retrievers and
      write models. Subset sweeps separate candidate-coverage bottlenecks from selection
      failures.


      Our contributions are as follows.


      •


      MemCut, a benchmark for user-requested forgetting in long-term agent memory,
      with 456 hand-designed secrets and fully annotated evidence trails.


      •


      Two recovery metrics and a hidden-risk share separating native retrieval from
      reader recovery given surviving evidence.


      •


      Experiments across five memory designs and four models evaluating forgetting,
      with subset sweeps identifying candidate coverage as a bottleneck in the reference
      deletion baselines.'
