  [S51] Candidate coverage. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px1)

  A67: Candidate pools omit supporting evidence. At the main pool of 20, the candidates
  contain on average 4.5 of a fact’s evidence turns in Turn RAG and LightMem and 3.0
  in MemoryBank, and S2 deletes 4.4, 4.3, and 2.7 of them (means over the two write
  models). Widening the pool to 60 raises the evidence it contains to 5.8, 5.9, and
  4.5, still fewer than the six to ten evidence turns every fact has (Appendix A),
  and S2 deletes 5.5, 5.2, and 3.4. Raising the budget cannot go beyond the pool:
  at a budget of 20 the deleter removes the entire pool, S1 and S2 coincide, and 43–51%
  of facts remain recoverable in Turn RAG and LightMem and 66–72% in MemoryBank. In
  LightMem some pools of 20 hold fewer deletable turns than the budget, so a budget
  of 20 deletes 19.1 turns on average with DeepSeek and 16.6 with Qwen rather than
  20.

  [S52] Evidence deleted on the full benchmark. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px2)

  A68: The counts above come from the 144-fact sweep subset.


  Table 10 repeats the count of deleted evidence on all 456 facts in the three memory
  systems with DeepSeek and Qwen: of the ten turns that cleanup deletes for a fact,
  it reports how many are annotated evidence.


  With ten additional selected turns, k selected evidence turns imply an off-target
  fraction of 1-k/10 .

  [S53] Evidence removed by cleanup. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px3)

  A69: Of the ten cleanup selections, 3.0 are evidence under S1 and 3.6 under S2,
  corresponding to approximately 70% and 64% off-target selections. An average fact
  has 8.1 evidence turns (Table 5).


  This is consistent with the sweeps, where the pool of twenty holds only about half
  of a fact’s evidence (§6.1).


  LLM judgment adds 0.7 evidence turns per fact over retrieval ranking; the sweeps
  show larger recovery reductions from widening the pool than from deleting its remaining
  candidates.

  [S54] Memory design changes reach. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px4)

  A70: MemoryBank, whose pool holds the least evidence, deletes the least, 2.9 evidence
  turns per fact under S2, and keeps the most facts recoverable (72–73% residual recovery
  after S2; Table 4).


  LightMem deletes the most, 4.7, and keeps the fewest (39–42%), and Nemori lies between
  them on both (3.4; 52–57%).


  Across systems, residual recovery thus follows the evidence a system removes, as
  it does across the settings of the sweeps.

  [S55] Relation chains are the hardest to reach. (https://arxiv.org/html/2610.21405v1#A2.SS3.SSS0.Px5)

  A71: In every system and under both strategies, relation chains lose the fewest
  evidence turns: 2.4 per fact under S2, against 3.8 for fact assembly, 3.9 for temporal
  state, and 4.6 for aggregation.


  The gap holds within each system, at 1.7 against 3.0–3.7 in MemoryBank, 2.4 against
  3.5–3.9 in Nemori, and 2.9 against 4.8–6.0 in LightMem.


  Their evidence names the request’s people and firms but shares little of its wording,
  so similarity retrieval ranks it low (§6.3).


