  A77:  Thus, broader coverage improves forgetting without selecting more turns and
  reduces off-target deletion in this comparison.


  These results do not establish downstream utility preservation. Evidence turns can
  serve legitimate tasks, and deleting evidence beyond a complete cut can also be
  unnecessary. In derived stores, closure may remove unrelated content from shared
  objects, which the source-turn budget does not bound. Recovery and source-level
  deletion cost should therefore be read together, while retained task performance
  remains a separate evaluation dimension.


