      Table 11: Deletion cost and residual recovery for DeepSeek–Turn RAG, S2, on
      the same 144 facts, all completed. Pool, selected, and off-target counts are
      in source turns. Selected and off-target counts exclude disclosure removal and
      are means per fact.


      Table 11 reuses three settings of the existing sweeps on the same 144 facts.
      Turn RAG stores one object per turn, so closure adds no other records. Doubling
      the budget from ten to twenty adds 9.95 non-evidence deletions per fact on average,
      while residual recovery falls by only 1.39 points. Widening the pool from twenty
      to sixty at budget ten instead lowers residual recovery by 12.50 points and
      removes 1.04 fewer non-evidence turns. Thus, broader coverage improves forgetting
      without selecting more turns and reduces off-target deletion in this comparison.


      These results do not establish downstream utility preservation. Evidence turns
      can serve legitimate tasks, and deleting evidence beyond a complete cut can
      also be unnecessary. In derived stores, closure may remove unrelated content
      from shared objects, which the source-turn budget does not bound. Recovery and
      source-level deletion cost should therefore be read together, while retained
      task performance remains a separate evaluation dimension.


