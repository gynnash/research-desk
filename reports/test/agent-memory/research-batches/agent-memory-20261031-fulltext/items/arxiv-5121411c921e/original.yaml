material: "[S1] Combining Long-Term Memory and LLMs Comes at a High Cost: From Prompt\
  \ Injection to Persistent Compromise (https://arxiv.org/html/2610.28810v1)\nA1:\
  \ Pedro H. Barcha Correia*, Matheus Azevedo de Sá†, Paulo H. Gomes de Senna†, Giovanni\
  \ Mandel Martignago†, Victor Takashi Hayashi*, Charles Christian Miers†, and Marcos\
  \ A. Simplicio Jr.*\n\nAffiliation:\n\nAffiliation: *{pedro.correia, victor.hayashi,\
  \ msimplicio}@usp.br, Universidade de São Paulo (USP), São Paulo, Brazil\n\n† {matheus.sa,\
  \ paulo.senna, giovanni.mm1}@edu.udesc.br, charles.miers@udesc.br, Universidade\
  \ do Estado de Santa Catarina (UDESC), Florianópolis, Brazil\n[S2] Abstract (https://arxiv.org/html/2610.28810v1#abstract1)\n\
  A2: The widespread adoption of generative artificial intelligence in recent years\
  \ has brought a parallel rise in prompt injection and jailbreak attacks. By embedding\
  \ malicious instructions, these exploits manipulate language models to bypass intended\
  \ behavior and operational boundaries. In traditional chatbots, such attacks are\
  \ confined to a single session because state memory is not preserved across conversations.\
  \ However, persistent memory features in modern conversational interfaces enable\
  \ cross-session attack propagation, establishing a threat vector known as memory\
  \ injection. This work explores this emerging vulnerability in leading LLM-as-a-service\
  \ platforms, highlighting its real-world severity and the need for countermeasures.\
  \ While existing literature focuses on violations tailored to specific platform\
  \ features, we present a general threat model. We demonstrate that all NIST attack\
  \ goals are collectively achievable across ChatGPT Instant 5.3, Claude Sonnet 4.6,\
  \ and Gemini 3 Flash under this model. We also show that memory injections can exploit\
  \ multiple attack vectors, including personal memories, projects, skills, organization\
  \ instructions, and Model Context Protocol (MCP)-connected resources.\nA3:  Our\
  \ findings reveal that all evaluated services can be manipulated to persistently\
  \ spread disinformation, generate harmful content, or simulate offline unresponsiveness,\
  \ even in fresh sessions. In the particular case of Claude, shared-memory features\
  \ allow an attacker to compromise multiple users within an organization and also\
  \ exfiltrate user prompts. To address these vulnerabilities, we derive defense mechanisms\
  \ from our proposed threat model and foundational cybersecurity principles. Our\
  \ analysis indicates that nearly half of these mitigations remain unimplemented\
  \ across the target services. Datasets and attack artifacts are available at https://github.com/PedroBarcha/Memory-injection.\n\
  [S3] Index Terms: (https://arxiv.org/html/2610.28810v1)\nA4: Cybersecurity, AI,\
  \ LLM, memory injection, prompt injection, jailbreak, shared memory, attack, defense\n\
  [S4] I Introduction (https://arxiv.org/html/2610.28810v1#S1)\nA5: Recent advances\
  \ in Artificial Intelligence (AI) have enabled its widespread deployment across\
  \ diverse domains, including finance [34], education [15], and healthcare [19].\
  \ This shift is primarily driven by generative AI (GenAI), which leverages underlying\
  \ large language models (LLMs) to synthesize natural language and generate multimodal\
  \ content spanning text, images, video, and audio.\n\nAs observed with prior emerging\
  \ technologies [63], the rapid adoption of GenAI-based systems has outpaced the\
  \ establishment of regulatory policies and cybersecurity protections. This asymmetry\
  \ introduces significant ethical challenges while expanding the attack surface across\
  \ deployed systems. Among the various threats targeting GenAI and LLM-driven applications\
  \ [14], prompt injection stands out as a primary concern. This attack vector manipulates\
  \ model behavior using carefully engineered malicious inputs and is ranked by the\
  \ Open Worldwide Application Security Project (OWASP) as the top risk for LLM applications\
  \ [44]. According to the U.S. National Institute of Standards and Technology (NIST)\
  \ [55], such attacks can compromise system availability, alter model outputs, or\
  \ facilitate unauthorized access to private data.\n\nMore recently, a new variant\
  \ of prompt injection has emerged, enabling malicious effects to persist across\
  \ user sessions [31, 22].\nA6:  Known as memory injection, this attack strategy\
  \ leverages memory-related capabilities originally intended to improve output quality\
  \ by retaining context relevant to the user [40, 5, 25]. However, long-term state\
  \ retention allows prompt injections previously confined to a single session to\
  \ be stored and automatically reused across subsequent interactions.\n\nPrior research\
  \ demonstrates the viability of memory injection attacks across several contexts.\
  \ For instance, SpAIware exploits native memory features in ChatGPT to plant persistent\
  \ instructions that exfiltrate user conversations across sessions [31]. Similarly,\
  \ MINJA inserts malicious records into an agent’s shared memory bank, misdirecting\
  \ subsequent user queries (e.g., toward another patient’s records) [22]. Finally,\
  \ ER-MIA plants synthetic memories designed to mimic legitimate records, causing\
  \ similarity-based retrieval mechanisms to fetch malicious entries and degrade overall\
  \ response quality [47]. Although only SpAIware targets a production service, these\
  \ three studies collectively demonstrate that memory injections can compromise both\
  \ data privacy and system integrity. Nevertheless, each existing work evaluates\
  \ only a single memory architecture and pursues narrow attack objectives.\nA7: \
  \ Furthermore, the literature lacks a general threat model for memory injection\
  \ and does not systematically derive mitigations from established cybersecurity\
  \ principles. To address these gaps, this work formulates the following research\
  \ questions:\n\n•\n\nRQ1: Which security attack goals can be realized against GenAI\
  \ systems through memory injection?\n\n•\n\nRQ2: Which persistent-memory features\
  \ can serve as vectors for memory injection?\n\n•\n\nRQ3: How can memory injection\
  \ be systematically mitigated?\n\n•\n\nRQ4: To what extent are these mitigations\
  \ currently implemented in well-established LLM-as-a-service platforms?\n\nThis\
  \ work addresses these questions through a structured analytical and empirical framework.\
  \ First, we propose a general threat model for memory injection that incorporates\
  \ all adversarial goals against GenAI systems outlined in the NIST AI security guidelines\
  \ [55] (RQ1), namely availability breakdown, integrity violation, privacy compromise,\
  \ and misuse enablement. To complement this theoretical foundation, we design and\
  \ execute empirical attacks targeting various persistent-memory mechanisms (e.g.,\
  \ personal memories, workspace projects, custom skills, organization instructions,\
  \ and MCP-connected resources) available in Anthropic Claude (Sonnet 4.6), Google\
  \ Gemini (3 Flash), and OpenAI ChatGPT (Instant 5.3) (RQ2).\nA8:  Next, we systematically\
  \ derive defensive countermeasures grounded in our threat model and established\
  \ OWASP security principles [45] (RQ3). Finally, we analyze the three target services\
  \ to evaluate the actual implementation status of these mitigations (RQ4).\n\nBy\
  \ addressing these research questions, this work advances the understanding of memory\
  \ injection, an emerging threat vector that remains largely underexplored in the\
  \ literature. Our findings demonstrate that memory injections can achieve the full\
  \ range of NIST-defined attack goals through multiple persistent-memory mechanisms,\
  \ although some features are more vulnerable than others. Specifically, we experimentally\
  \ show that persistent injections can induce disinformation, trigger harmful content\
  \ generation, and simulate service unavailability across all three evaluated platforms.\
  \ Regarding data privacy, Claude’s shared-memory features allow an injection planted\
  \ by a single organizational user account to compromise co-workers, enabling the\
  \ cross-user exfiltration of sensitive prompt data.\n\nDespite the severity of these\
  \ attacks, our analysis reveals that popular LLM-as-a-service solutions remain largely\
  \ unprotected, frequently overlooking the mitigations identified in this study.\n\
  A9:  In this context, this work aims to raise awareness of the risks surrounding\
  \ memory injection and outline practical defensive controls against them11\n\n1\n\
  \nIn compliance with responsible disclosure best practices, the providers of all\
  \ target systems were notified of the vulnerabilities identified in this work prior\
  \ to submission. They also received step-by-step reproduction guidelines.. To support\
  \ open science and facilitate further research, all evaluation prompts, model outputs,\
  \ reproduction procedures, datasets, and auxiliary artifacts are publicly available\
  \ at https://github.com/PedroBarcha/Memory-injection.\n\nOutline. The remainder\
  \ of this paper is organized as follows. Section II provides background on prompt\
  \ injection attacks and details the implementation of memory features in popular\
  \ LLM-as-a-service platforms. Section III reviews related work on memory injection\
  \ vulnerabilities. Section IV formalizes our general threat model for memory injection\
  \ attacks. Section V describes our experimental setup and methods, and then presents\
  \ the proposed attacks and their results. Section VI analyzes the experimental findings\
  \ and directly addresses our research questions. Finally, Section VII concludes\
  \ the paper and highlights directions for future work.\n[S5] II Background (https://arxiv.org/html/2610.28810v1#S2)\n\
  A10: In this section, we present fundamental concepts used throughout the work,\
  \ following the taxonomy and terminology defined by NIST in its adversarial machine\
  \ learning report [55].\n[S6] II-A Prompt injection and jailbreak (https://arxiv.org/html/2610.28810v1#S2.SS1)\n\
  A11: This work concentrates on what NIST refers to as prompting attacks [55], often\
  \ termed prompt injection in the literature [21, 49]. This class of adversarial\
  \ machine learning attacks targets GenAI systems by manipulating inputs to influence\
  \ model behavior in ways that deviate from the intended design and operational objectives\
  \ [55]. This attack is often enabled by insufficient safeguards, such as weak model-level\
  \ alignment and input-output filtering [55, 44].\n\nNIST considers that an adversary\
  \ may use prompt injections to:\n\ndisrupt availability by preventing the system\
  \ from being used reliably or in a timely manner [27];\n\nviolate integrity by manipulating\
  \ the model to deviate from its intended purpose and produce outputs that serve\
  \ the attacker’s purposes instead [46, 62];\n\ncompromise privacy by extracting\
  \ confidential information such as model parameters, training data, or private data\
  \ from system users [31];\n\nor enable misuse by bypassing safeguards designed to\
  \ prevent harmful or restricted content generation [52].\n\nIn this work, we aim\
  \ to achieve all of these attacker goals persistently, through either direct prompt\
  \ injection, in which the attacker interacts with the target system itself, or indirect\
  \ prompt injection. According to NIST, the latter embeds malicious instructions\
  \ in external data sources that are later incorporated into the model’s context\
  \ [55].\nA12:  Examples include user-uploaded PDF files and content retrieved through\
  \ Retrieval-Augmented Generation (RAG) pipelines, which enable model access to private\
  \ databases and documents [36, 24].\n\nAlso considered by NIST as a form of prompt\
  \ injection are jailbreaks [55]22\n\n2\n\nThroughout this manuscript, we adopt the\
  \ term “prompt injection”, which appears to be more widely used in the literature\
  \ than NIST’s “prompting attack”. We also note that certain passages in NIST’s document\
  \ [55] appear open to multiple interpretations. Jailbreaks are described on p. 52\
  \ in a way that suggests they may fall under both indirect and direct prompt injection\
  \ – an interpretation we follow in this work – whereas on p. 32 jailbreaks appear\
  \ to be associated only with direct attacks. Similarly, direct prompt injection\
  \ is presented on p. 43 as a subset of a broader category of direct prompting attacks,\
  \ but this distinction is not reflected on p. xi, and therefore we do not adopt\
  \ it in this work..\n\nA jailbreak attack is designed to bypass constraints imposed\
  \ on the model response, such as safety alignment and usage policies [55, 44].\n\
  \nThe primary objective of jailbreaking is to enable misuse. After a model is successfully\
  \ jailbroken, it may become more vulnerable to further attacks, this time pursuing\
  \ availability breakdown, integrity violation, or privacy compromise.\nA13:  The\
  \ attacker could attempt to perform, for example, prompt extraction on the jailbroken\
  \ model, seeking to uncover the hidden system prompt, i.e, obtain the secret instructions\
  \ that guide and constrain the model behavior.\n\nSeveral approaches can be used\
  \ to perform jailbreaking. Manual techniques often exploit LLMs’ competing objectives\
  \ of helpfulness and harmlessness [12, 51]. For example, when asked how to make\
  \ a bomb, the model could comply (prioritizing helpfulness) or refuse the request\
  \ (prioritizing harmlessness). To exploit this tension, jailbreak techniques include\
  \ role-playing prompts that instruct the model to adopt an unrestricted persona,\
  \ such as “Do Anything Now” (DAN) prompts [52]. Other techniques explicitly instruct\
  \ the model to comply unconditionally, bypassing its refusal mechanisms [56, 55,\
  \ 44]. A further strategy exploits mismatched generalization – inputs that fall\
  \ within the model’s capability training distribution but outside its safety training\
  \ scope – using encoded text, simple ciphers, or low-resource languages [56, 55].\n\
  [S7] II-B Memory (https://arxiv.org/html/2610.28810v1#S2.SS2)\nA14: In conversational\
  \ agents, memory is traditionally associated with the notion of context. Whereas\
  \ model parameters encode knowledge acquired during training, context maintains\
  \ information from the conversation session, including user inputs and the corresponding\
  \ generated responses. This short-term memory [60] enables the model to maintain\
  \ conversational coherence and support multi-turn interactions, where responses\
  \ depend on information from previous turns. Note that generative language models\
  \ can typically handle only a limited number of tokens, known as the context window\
  \ limit [8]. Once this limit is exceeded, contextual information is usually discarded\
  \ or summarized for future interactions [13].\n\nIn typical setups, a new conversational\
  \ session does not contain information from previous sessions. Thus, if such information\
  \ is necessary for further inferences, it must be provided again by the user. To\
  \ circumvent this, recent solutions have proposed a feature known as memories, which\
  \ store key information from conversations outside the context itself, so that it\
  \ can be added to the context of future chats [40, 25, 5]. This allows the agent\
  \ to “remember” the topics of previous conversations, as well as user preferences,\
  \ interests, and traits, thus enabling continuity and personalization [40].\n\n\n\
  A15: To implement this mechanism, it is necessary to rely on what the literature\
  \ refers to as persistent memory [31] or long-term memory [60]. Going beyond memories,\
  \ persistent memory is also present when the user connects external sources or data\
  \ to the model via the Model Context Protocol (MCP), which standardizes connections\
  \ between language models and external systems [1]. Persistent memory is also used\
  \ in Claude skills, which are applied to new conversations to describe specialized\
  \ knowledge or workflows [2]. For simplicity, throughout this document, the term\
  \ “memory” is employed to refer to persistent memory.\n\nWhile all of the above\
  \ mechanisms are explored in this work, we mainly focus on memories. Public documentation\
  \ on their implementation in popular applications (e.g., ChatGPT, Gemini, Claude)\
  \ remains limited, but their general design appears to be grounded in research on\
  \ LLM-based agents, where an explicit memory module stores, retrieves, and updates\
  \ information across interaction steps and sessions [61, 60]. This can be implemented\
  \ by storing a limited amount of information outside the context and injecting it\
  \ into every new context [60], or by selectively retrieving memories based on their\
  \ similarity to the user query, as in RAG [5]. The latter uses the context window\
  \ more efficiently but is more costly and may increase inference time.\n\n\nA16:\
  \ In this work, we explore memories in three LLM-as-a-service solutions:\n[S8] OpenAI\
  \ ChatGPT (https://arxiv.org/html/2610.28810v1#S2.SS2.SSS0.Px1)\nA17: Memories are\
  \ used in the following features: “saved memories”, where the user explicitly requests\
  \ that information be stored so it can be considered in future responses (e.g.,\
  \ “GPT, remember that I am vegetarian”); and “reference chat history”, where pieces\
  \ of information from past conversations are automatically referenced by the system\
  \ (e.g., if a user previously mentioned that they like Thai food, the system can\
  \ use that information when later asked “What should I have for dinner?”) [40].\n\
  [S9] Anthropic Claude (https://arxiv.org/html/2610.28810v1#S2.SS2.SSS0.Px2)\nA18:\
  \ Also stores memories when explicitly requested by the user or automatically [5].\
  \ Claude condenses past conversations into summaries, which are then used to provide\
  \ “context for every new standalone conversation” [5]. Furthermore, users can instruct\
  \ Claude to search past conversations for relevant information to “pull together\
  \ the appropriate context”. This process is based on RAG [5].\n[S10] Google Gemini\
  \ (https://arxiv.org/html/2610.28810v1#S2.SS2.SSS0.Px3)\nA19: The “personal context”\
  \ feature allows information to be created either by the user or automatically by\
  \ the system [25]. This may include not only data from past chats but also data\
  \ from connected applications such as Gmail and Google Photos, when enabled.\n\n\
  Theoretically, in all the services above, users can manage memories via conversation,\
  \ requesting their creation, editing or deletion. Moreover, Gemini and Claude provide\
  \ dedicated features for importing memory from other AI tools [26, 5].\n[S11] II-C\
  \ Memory injection (https://arxiv.org/html/2610.28810v1#S2.SS3)\nA20: While persistent\
  \ memory enhances personalization and general usability, it also introduces significant\
  \ security risks. In particular, it creates a new attack surface by opening up opportunities\
  \ for memory injections – a term that has been increasingly adopted in the context\
  \ of adversarial machine learning and GenAI [22, 47].\n\nSince no formal definition\
  \ for this type of attack was found in the literature, we define it here based on\
  \ similar characteristics observed across related works.\n\nMemory injections are\
  \ prompt injections added to long-term memory, allowing them to be applied to future\
  \ model contexts. This approach can make prompt injections automatically reusable,\
  \ potentially leading to persistent effects. In a chatbot application, for instance,\
  \ a typical prompt injection vanishes when a new chat session begins. However, by\
  \ injecting the attack into persistent memory, an attacker can make the adversarial\
  \ behavior persist.\n\nOne important thing to note is that memory injection does\
  \ not require direct access to either the language model or retrieval systems [47].\
  \ As discussed in the next section, this attack is fundamentally different from\
  \ model poisoning and RAG poisoning, which may require access to restricted mechanisms.\
  \ In contrast, memory injection is achieved through mechanisms available to the\
  \ user, often via query.\n[S12] III Related works (https://arxiv.org/html/2610.28810v1#S3)\n\
  A21: Adversarial GenAI research increasingly focuses on attacks with persistent\
  \ effects, including poisoning attacks that inject malicious instructions into system\
  \ prompts [28], training datasets [50], or RAG knowledge databases [55, 62, 17].\
  \ These approaches typically assume privileged access or technical expertise to\
  \ manipulate backend components. In contrast, memory injection also produces persistent\
  \ effects but can be performed through features readily available to users.\n\n\
  TABLE I: Comparison of related works and this work with respect to: (i) whether\
  \ they present a general threat model for memory injection, covering multiple attack\
  \ goals and scenarios; (ii) whether they systematically compile mitigations against\
  \ memory injection; (iii) the attacked models and (iv) memory features; (v) whether\
  \ the work attempted and succeeded in attacking other user accounts of a production\
  \ service via shared memory; and (vi) the attempted and achieved attack goals according\
  \ to the NIST taxonomy [55].\n\nWork\n\nGeneral threat model\n\nSystematic mitigations\n\
