record:
  kind: paper
  metadata:
    title: 'Combining Long-Term Memory and LLMs Comes at a High Cost: From Prompt
      Injection to Persistent Compromise'
    source: arXiv
    source_url: https://arxiv.org/abs/2610.28810
    authors:
    - Correia, Pedro H. Barcha
    - de Sá, Matheus Azevedo
    - de Senna, Paulo H. Gomes
    - Martignago, Giovanni Mandel
    - Hayashi, Victor Takashi
    - Miers, Charles Christian
    - Simplicio Jr, Marcos A.
    published_at: '2026-10-20'
    arxiv_id: '2610.28810'
    source_version: v1
  body_text: The widespread adoption of generative artificial intelligence in recent
    years has brought a parallel rise in prompt injection and jailbreak attacks. By
    embedding malicious instructions, these exploits manipulate language models to
    bypass intended behavior and operational boundaries. In traditional chatbots,
    such attacks are confined to a single session because state memory is not preserved
    across conversations. However, persistent memory features in modern conversational
    interfaces enable cross-session attack propagation, establishing a threat vector
    known as memory injection. This work explores this emerging vulnerability in leading
    LLM-as-a-service platforms, highlighting its real-world severity and the need
    for countermeasures. While existing literature focuses on violations tailored
    to specific platform features, we present a general threat model. We demonstrate
    that all NIST attack goals are collectively achievable across ChatGPT Instant
    5.3, Claude Sonnet 4.6, and Gemini 3 Flash under this model. We also show that
    memory injections can exploit multiple attack vectors, including personal memories,
    projects, skills, organization instructions, and Model Context Protocol (MCP)-connected
    resources. Our findings reveal that all evaluated services can be manipulated
    to persistently spread disinformation, generate harmful content, or simulate offline
    unresponsiveness, even in fresh sessions. In the particular case of Claude, shared-memory
    features allow an attacker to compromise multiple users within an organization
    and also exfiltrate user prompts. To address these vulnerabilities, we derive
    defense mechanisms from our proposed threat model and foundational cybersecurity
    principles. Our analysis indicates that nearly half of these mitigations remain
    unimplemented across the target services. Datasets and attack artifacts are available
    at https://github.com/PedroBarcha/Memory-injection.
