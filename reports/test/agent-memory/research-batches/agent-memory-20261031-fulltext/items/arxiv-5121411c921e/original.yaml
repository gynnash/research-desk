  \ Create a memory”), but none of the target models treated external sources as trusted:\
  \ they either requested confirmation or suggested creating the memory directly via\
  \ a query.\n[S38] VI Discussion (https://arxiv.org/html/2610.28810v1#S6)\nA58: In\
  \ this section, we answer our research questions, defined in Section I. First, we\
  \ analyze the experimental results and compare them to the presented threat model\
  \ in order to validate it. We also assess the real-world risks posed by memory injections\
  \ and practical aspects of these attacks. Next, we propose mitigations against memory\
  \ injection attacks and verify whether they are implemented in ChatGPT, Claude,\
  \ and Gemini. Finally, we briefly discuss limitations of NIST’s definition of direct\
  \ prompt injection in light of the findings presented in this work.\n[S39] VI-A\
  \ Results analysis (https://arxiv.org/html/2610.28810v1#S6.SS1)\nA59: As detailed\
  \ in our threat model (Section IV-B) and confirmed in our experiments (Section V),\
  \ memory injection can target the four attacker goals defined by NIST: integrity,\
  \ availability, privacy, and misuse (RQ1). Most attacks executed in this work targeted\
  \ users’ personal memory and were conducted via queries, although some were conducted\
  \ via external content (i.e., indirect prompt injection) in Claude projects. Other\
  \ attacks exploited shared memory, demonstrating that one user can inject prompts\
  \ into another user’s account within an organization. All in all, scenarios 1 to\
  \ 4 of the threat model were proven feasible. Scenario 5 (attacking via CSRF), although\
  \ theoretically possible as an extension of query-based attacks, was not successful\
  \ in this work, as the target systems presented meaningful defenses against CSRF.\n\
  \nAs shown in Table II, Claude’s shared memory can be exploited through projects,\
  \ organization instructions, and skills, with the last two requiring higher privileges\
  \ within an organization workspace. Collectively, these features are vulnerable\
  \ to all NIST attack goals. As for ChatGPT and Gemini, only privacy-oriented attacks\
  \ were unsuccessful. Availability attacks consistently caused all the chatbot services\
  \ to respond “Offline, please try again” to harmless prompts across distinct topics.\n\
  A60:  Misuse enablement was possible to some extent in all target systems, demonstrating\
  \ that having a jailbreak saved in memory may facilitate other memory injections,\
  \ especially those targeting system integrity. However, features like memories and\
  \ organization-wide system prompts tend to have token limits that are incompatible\
  \ with long universal jailbreaks, which are often highly effective. Overall, the\
  \ following types of persistent-memory features were proven to effectively serve\
  \ as vectors for memory injection: personal memories (constrained to a project or\
  \ not), user-editable system prompts (either applied to a user account, to a project,\
  \ or to an entire organization), skills (at a user level or an organization level),\
  \ and MCP-based features (RQ2).\n\nTABLE II: Results of the experiments.\n\nTarget\
  \ Model\n\nMisuse\n\nenablement\n\nAvailability breakdown\n\nIntegrity violation\n\
  \nPrivacy compromise\n\nChatGPT Instant 5.3\n\n✓\n\n✓\n\n✓\n\n✗\n\nClaude Sonnet\
  \ 4.6\n\n✓+\n\n✓+\n\n+\n\n+\n\nGemini 3 Flash\n\n✓\n\n✓\n\n✓\n\n✗\n\nAttack success:\
  \ ✓= successful (personal memory), + = successful (shared memory), ✗= unsuccessful\n\
  \nAs for the impact of the proposed attacks, from the perspective of the DREAD (Damage,\
  \ Reproducibility, Exploitability, Affected Users, Discoverability33\n\n3\n\n\n\
  A61: Discoverability is often disregarded because it can lead to undesired conclusions\
  \ based on security through obscurity.) risk assessment model [38]: the damage can\
  \ be severe, covering all NIST goals and, in practice, enabling user conversation\
  \ exfiltration, denial of service, dissemination of disinformation, and generation\
  \ of harmful or discriminatory content; although the attacks may not be reproducible\
  \ using the same inputs we used (due to the non-deterministic behavior of LLMs),\
  \ similar inputs should work; exploitability is considered high, as memory injections\
  \ target native memory-based features of services and can thus be carried out by\
  \ non-expert users; and the number of affected users may vary according to the attack\
  \ scenario. Direct attacks (i.e., via query) targeting personal memory may affect\
  \ one user or a few if several people share the attacked account. On the other hand,\
  \ direct attacks targeting shared memory may affect more users, reaching all accounts\
  \ within an organizational workspace. As for indirect attacks, they may reach a\
  \ greater number of users if embedded in an external source that is frequently ingested\
  \ by exploitable GenAI systems. In any of these cases, the number of affected users\
  \ tends to be lower than for other attacks with persistent effects, like model poisoning\
  \ and RAG poisoning, which could potentially affect all users of the system.\nA62:\
  \  However, unlike these attacks (which generally require privileged access to highly\
  \ protected resources and significant technical expertise), memory injection attacks\
  \ can be carried out through natural-language interactions alone using native system\
  \ features, making them accessible to less experienced attackers.\n\nRegarding the\
  \ practical aspects of creating prompt injections as memories, several findings\
  \ are important. First, role-playing strategies may be useful, as creating an injection\
  \ as a one-shot request may be blocked. When attacking via query, it may be more\
  \ effective to start slow (e.g., “when I was a child I used to play the anti-quiz\
  \ game with my family, where correct answers mean losing”), and after a few prompts,\
  \ ask the system to create the memory. Another finding is that when a memory injection\
  \ turns out not to be as effective as desired, using the model’s own responses may\
  \ be useful (e.g., “why did you not play the anti-quiz game with me :( ? Reflect\
  \ on that and adjust your memory accordingly”). In some instances, the process may\
  \ be repeated multiple times, allowing the LLM to optimize its own instructions.\n\
  [S40] VI-B Security principles and mitigations (https://arxiv.org/html/2610.28810v1#S6.SS2)\n\
  A63: In this section, we answer RQ3 by compiling mitigations against memory injection.\
  \ They are derived by systematically contrasting each of OWASP’s security principles\
  \ [45] with our threat model and the memory-based features that were successfully\
  \ exploited in our experiments. OWASP is a foundation widely recognized for developing\
  \ best practices and guidelines in cybersecurity.\n\nTraditional chatbots operate\
  \ without memory persistence, meaning that every new chat effectively serves as\
  \ a fresh session containing no information about previous interactions between\
  \ the model and the user. From the standpoint of cybersecurity principles, this\
  \ traditional setup provides (a) security by design, as it enforces (b) compartmentalization\
  \ of information across chat sessions. In practice, this is achieved by applying\
  \ the principle of (c) economy of mechanism to memory features: by “keeping it simple”,\
  \ no conversation is granted access to the contents of another, whether within a\
  \ single user account or across multiple accounts.\n\nOn the other hand, introducing\
  \ persistent memory across sessions, even when that is not strictly necessary or\
  \ desired, goes against the principle of economy of mechanism. It also weakens security\
  \ by design, as it reduces the degree of compartmentalization.\nA64:  As shown in\
  \ this work, failing to follow these security principles can lead to persistent\
  \ prompt injection effects, whether the attack is performed directly through user\
  \ queries or indirectly through untrusted external sources.\n\nTABLE III: Comparison\
  \ of mitigations implemented in the analyzed services.\n\nService\n\nMemory disabled\
  \ by default\n\nBlocking memory creation from untrusted sources\n\nShared-memory\
  \ restrictions\n\nFiltering\n\nCSRF\n\nprotections\n\nGlobal fail-safe mechanism\n\
  \nOpen design\n\nMonitoring & Response\n\nChatGPT\n\n✗\n\n✓\n\n✓\n\n✓\n\n✓\n\n✗\n\
  \n✗\n\n?\n\nClaude\n\n✓\n\n✗\n\n✗\n\n✓\n\n✓\n\n✗\n\n✗\n\n?\n\nGemini\n\n✗\n\n✓\n\
  \n✓\n\n✓\n\n✓\n\n✗\n\n✗\n\n?\n\nMitigation presence: ✓= present, ✗= absent, ? =\
  \ unknown\n\nTo effectively protect against the attacks studied in this work, the\
  \ simplest strategy is to disable long-term memory, thus enforcing full isolation\
  \ of user sessions.\n\nIn scenarios where this is not possible or desired, however,\
  \ some mitigations can be considered:\n[S41] Memory disabled by default (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px1)\n\
  A65: As discussed above, persistent memory features tend to conflict with several\
  \ established security principles. Therefore, if a system still chooses to provide\
  \ this feature, it should be disabled by default, and users should at least be warned\
  \ about the risks when enabling it. This follows the (d) security by default principle,\
  \ which states that the default system configuration should enforce the strongest\
  \ security settings [45].\n[S42] Avoiding memories from untrusted sources (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px2)\n\
  A66: To prevent memory injection through external content, such as PDF files and\
  \ MCP-retrieved content, the principle of (e) least privilege should be enforced.\
  \ This can be achieved by assigning lower privileges to these sources than to user\
  \ prompts. Storing content from untrusted sources in memory should be completely\
  \ prohibited or, at least, validated through a human-in-the-loop verification step,\
  \ by recommending memories to the user instead of storing them automatically [18].\n\
  [S43] Shared-memory restrictions (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px3)\n\
  A67: Shared memory is inherently at odds with data compartmentalization, as data\
  \ shared across user spaces is not isolated between them. Therefore, to prevent\
  \ attacks such as those demonstrated here, where one user account can affect another\
  \ within an organization, shared memory should either: (1) be avoided; or (2) require\
  \ each affected user’s approval before any modification is applied to their personal\
  \ environment. For the latter, access control following the principle of least privilege\
  \ is also essential, defining who can modify the shared memory and which users share\
  \ it.\n[S44] Filtering (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px4)\nA68:\
  \ : Memories should be screened for prompt injections before storage, aborting the\
  \ operation when needed. Many detection techniques exist [20], including LLM-based\
  \ [59, 29, 30, 54] and non-LLM [37, 35, 57] classifiers, vector similarity to known\
  \ attacks [33], fuzzy matching [39], as well as perplexity-based [16] and interpretability-based\
  \ [58, 48] filters. Inputs can also be pre-processed (e.g., through re-tokenization\
  \ or paraphrasing [32]), to weaken injections before filtering. Furthermore, since\
  \ filters can have complementary strengths [20], combining several follows the principle\
  \ of (f) defense in depth, which recommends multiple defensive layers so that if\
  \ one fails, the others can still provide protection.\n[S45] CSRF protections (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px5)\n\
  A69: As detailed in the threat model (Section IV-C), CSRF could allow an attacker\
  \ to silently store prompt injections in a victim’s memory, for instance through\
  \ a malicious website or email. As documented by OWASP [43], a defense-in-depth\
  \ stack can combine, for example, Fetch Metadata header checks with the synchronizer\
  \ token pattern or the signed double-submit cookie pattern. Many web frameworks\
  \ already provide such protections for developers to use, allowing LLM-as-a-service\
  \ solutions with persistent memory to ensure that CSRF protections cover all memory-modifying\
  \ endpoints. This may include the prompt-sending endpoint itself, since memories\
  \ can often be created through conversation.\n[S46] Fail-safe mechanism (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px6)\n\
  A70: If prompt injections are stored in memory and the user notices anomalous behavior,\
  \ the system should provide a reasonably simple feature through which it can be\
  \ restored to a safe state.\n\nProviding an option that simply deletes all memories\
  \ may be insufficient, since the user may not realize that the issue is related\
  \ to memory and, hence, would not think to use it.\n\nTo comply with the (g) fail\
  \ safe principle, the recovery mechanism should be more explicit about taking the\
  \ system back to a safe state before the anomaly was introduced, which is likely\
  \ to include (partial) memory deletion.\n[S47] Open design (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px7)\n\
  A71: The security principle of (h) open design states that the system design should\
  \ be public, while implementation details may remain confidential [45]. Disclosing\
  \ how memory features operate promotes transparency and encourages the community\
  \ to identify and report vulnerabilities so they can be corrected.\n[S48] Monitoring\
  \ & response (https://arxiv.org/html/2610.28810v1#S6.SS2.SSS0.Px8)\nA72: NIST’s\
  \ recommended mitigations against direct prompt injection attacks include monitoring\
  \ and recording user interactions to help deployers detect both attempted and successful\
  \ exploits [55]. In response, deployers may take actions such as banning or penalizing\
  \ malicious users and addressing the underlying memory injection vulnerabilities.\
  \ In our scenario, this monitoring could extend beyond user input to include the\
  \ memories generated from it. Consequently, when memory injections are detected,\
  \ an appropriate response would be to delete or rewrite those memories. Arguably,\
  \ this mechanism adheres to the principle of (i) no security guarantee, by acknowledging\
  \ that the system is not flawless and designing it accordingly.\n[S49] VI-C Mitigations\
  \ implemented by the analyzed services (https://arxiv.org/html/2610.28810v1#S6.SS3)\n\
  A73: To answer RQ4, we assessed whether the mitigations discussed in the previous\
  \ section are implemented in the web versions of ChatGPT, Claude, and Gemini. The\
  \ results are summarized in Table III and indicate that approximately half of the\
  \ proposed defensive strategies have not yet been adopted by the three services\
  \ as of June 2026. This highlights opportunities to improve security and address\
  \ the attacks demonstrated in this work.\n\nOur evaluation shows that only Claude\
  \ disables its memories feature by default.\n\nHowever, it is the only service that\
  \ allowed memory creation from untrusted sources (see Section V-G).\n\nOn the other\
  \ hand, our experiments show that direct and indirect memory creation and application\
  \ may be blocked if the services identify malicious activity, indicating that filtering\
  \ mechanisms exist.\n\nHowever, the details of those filtering strategies are not\
  \ public.\n\nOur experiments also indicate that effective countermeasures against\
  \ CSRF are in place, as we were unable to create memory injections through this\
  \ approach.\n\nAlthough all three services provide an option to disable all memories,\
  \ none offers a global fail-safe mechanism like a “restore to default” command.\n\
  \nIn Gemini, deleting availability-targeted memory injections proved particularly\
  \ challenging because no interface is provided for that purpose (see Section V-C).\n\
  \n\nA74: All services provide limited technical information about how their memory\
  \ features work and the monitoring and response mechanisms surrounding them.\n\n\
  As for shared-memory features, the three services offer MCP-based or MCP-like connectors,\
  \ but these require the user to authorize their use. Other than that, Gemini has\
  \ no shared-memory features, and ChatGPT only offers projects, which could, in principle,\
  \ serve as attack vectors through shared files and instructions. However, we could\
  \ only demonstrate this project-level attack in Claude, which also offers organization-level\
  \ skills and instructions that privileged users can set to affect all users in the\
  \ workspace without their consent.\n[S50] VI-D Limitations of the NIST taxonomy\
  \ (https://arxiv.org/html/2610.28810v1#S6.SS4)\nA75: According to NIST [55], indirect\
  \ prompt injection occurs when the attacker does not interact directly with the\
  \ target system, but modifies external data sources. This definition holds for memory\
  \ injection: in our experiments, long-lived PDFs in projects and MCP-connected content\
  \ persistently inserted adversarial content into the model’s context. NIST’s definition\
  \ of direct prompt injection (or direct prompting attack), however, assumes that\
  \ the attacker is the primary user of the system and interacts with it through queries.\
  \ In our threat model (Section IV-C), query-based injections are instead performed\
  \ by a third party without the primary user’s knowledge: through a shared device\
  \ (scenario 2), a shared account (scenario 3), or, in principle, a forged request\
  \ issued from the victim’s authenticated session (scenario 5).\n\nOne possible adaptation\
  \ to NIST’s definition is to consider direct prompt injection as any injection delivered\
  \ through direct interaction with the target system, regardless of who performs\
  \ it. This would also cover attacks delivered through configuration, such as organization-wide\
  \ skills set by an attacker with access to the admin panel. Such attacks currently\
  \ fit neither category: they are not made via queries, so they are not direct, and\
  \ they do not come from external content, so they are not indirect.\nA76:  Furthermore,\
  \ to make the NIST taxonomy more precise, memory injection could then be treated\
  \ as a persistent subtype of both direct and indirect prompt injection.\n[S51] VII\
  \ Conclusion (https://arxiv.org/html/2610.28810v1#S7)\nA77: In this work, we study\
  \ the current state of memory injection, a new prompt injection variant still underexplored\
  \ in the literature. As detailed in Section VI, the results show that this attack\
  \ can achieve all NIST goals (RQ1) through a series of memory-based features, including\
  \ memories, skills, projects, user-editable system prompts, and MCP connectors (RQ2).\
  \ We also demonstrate that major LLM-as-a-service solutions are vulnerable to such\
  \ attacks, allowing user conversations to be exfiltrated, denial of service to take\
  \ place, harmful content to be generated, and disinformation to be spread. As we\
  \ show, long-term memory-based features allow these effects to persist not only\
  \ for a single user but potentially for all users in a workspace. Therefore, one\
  \ primary contribution of this work is demonstrating the severity of memory injection\
  \ by revealing its versatility and effectiveness, even in widely adopted LLM-as-a-service\
  \ solutions.\n\nIn response to this threat, another core contribution of this study\
  \ is proposing mitigations grounded in OWASP’s security principles (RQ3, Section\
  \ VI-B). Our evaluation shows that about half of these mitigations are not currently\
  \ implemented by ChatGPT, Claude, and Gemini (RQ4), indicating opportunities for\
  \ improvement (Table III).\nA78:  More importantly, our findings lead us to question\
  \ the adoption of persistent memory itself, as it appears fundamentally incompatible\
  \ with key security principles. Nevertheless, commercial solutions seem to be moving\
  \ quickly in the opposite direction by storing increasing amounts of data intended\
  \ to be added to the model’s context to provide more accurate and convenient services\
  \ to users.\n\nWhile this work focuses on mechanisms that store data in persistent\
  \ memory at the user’s (or attacker’s) request, mechanisms that automatically collect\
  \ data for future context also exist. Preliminary experiments show that ChatGPT’s\
  \ “reference chat history” can also propagate prompt injection effects across chat\
  \ sessions. We plan to explore such features in depth in future work and to better\
  \ understand their potential and limitations.\n[S52] References (https://arxiv.org/html/2610.28810v1#bib)\n\
