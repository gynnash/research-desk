  star} .\n[S63] 5 Memory-Centric Continual Learning Applications Across Digital and\
  \ Physical Domains (https://arxiv.org/html/2610.29357v1#S5)\nA106: When agents deploy\
  \ over weeks or months, their operational context constantly shifts: user goals\
  \ change, software interfaces update, and physical surroundings evolve. In these\
  \ settings, continual learning serves two practical roles: it keeps long-running\
  \ tasks on track, and it applies past experience to new problems. Memory provides\
  \ the backbone for both. By storing past interactions, execution outcomes, and environmental\
  \ states, memory gives agents a stable basis for future decisions.\n\nThese capabilities\
  \ take four main forms across digital and physical domains (Figure 14):\n\n(1) personal\
  \ agents track evolving user preferences;\n\n(2) digital agents turn execution logs\
  \ into reusable workflows;\n\n(3) embodied robots map environments and acquire physical\
  \ skills; and\n\n(4) multi-agent teams share project context and collaboration patterns.\n\
  \nBelow, we examine how each setting turns accumulated experience into durable capability.\n\
  \nFigure 14:\n\nMemory-centric continual learning across application domains.\n\n\
  Each row shows how accumulated experience updates memory to support\n\npersonalized\
  \ service, digital automation, embodied exploration, or\n\nmulti-agent collaboration.\
  \ Return arrows mark experience flowing back\n\ninto memory across tasks and deployments.\n\
  [S64] 5.1 Lifelong Personalization and Companion Agents (https://arxiv.org/html/2610.29357v1#S5.SS1)\n\
  A107: Personal agents must adapt as users change. Over time, schedules shift, learners\
  \ build skills or form misconceptions, health symptoms evolve, and interpersonal\
  \ bonds deepen. To remain useful, an agent must update its internal model of the\
  \ user and use this state to guide dialogue, planning, and tool calls.\n\nPersonal\
  \ assistants. Assistants use cross-session logs to maintain conversational continuity\
  \ and match individual style. Retrieving user profile items directly improves generation\
  \ on tasks like email drafting and news summarization [Salemi et al., 2024], while\
  \ modeling complete interaction histories captures personal tone and habits [Liu\
  \ et al., 2025b]. Crucially, assistants must track when facts expire. Recent systems\
  \ update user facts across conversations [Bae et al., 2022], decay memory strength\
  \ over time [Zhong et al., 2024], record user feedback alongside its valid context\
  \ [Yuan et al., 2025b], and organize changing user states through causal links [Ong\
  \ et al., 2025]. These mechanisms ensure that assistants preserve core preferences\
  \ while promptly reflecting new changes.\n\nTutoring agents. Tutoring agents track\
  \ what a student knows and where they struggle. For example, ScaffoldLM stores pedagogical\
  \ goals, step-level progress, and inferred misconceptions in an assessment memory,\
  \ selecting the next hint based on the learner’s latest response [Li et al., 2026b].\n\
  A108:  Similarly, versioned student profiles track skill mastery, error patterns,\
  \ and review schedules to calibrate hints and spaced practice [David and Ghosh,\
  \ 2026]. Updating student profiles in real time allows agents to adjust lesson pacing,\
  \ hint specificity, and problem difficulty on the fly.\n\nHealth follow-up and emotional\
  \ companionship. Memory directly underpins long-term care and companionship. In\
  \ a ten-week study of 147 real-world users (1,252 calls), the CareCall system used\
  \ memory to revisit past health complaints and life events. This continuity encouraged\
  \ users to disclose more health details and build trust [Jo et al., 2024]. Studies\
  \ on Replika users show that social bonding varies widely in depth and pace, meaning\
  \ companion agents cannot rely on static facts alone [Skjuve et al., 2022, Skjuve\
  \ et al., 2023]. Effective companionship requires referencing shared moments and\
  \ conversational routines. For instance, recent agents infer implicit emotional\
  \ needs and retrieve relevant shared memories to offer proactive comfort [Fu et\
  \ al., 2026].\n\nFrom personalized generation to tool use. Personalization extends\
  \ beyond text generation to planning and tool execution. Dual-reflection mechanisms\
  \ build user memory banks that accurately route past preferences to current prompts\
  \ [Tan et al., 2025b].\nA109:  In tool-augmented setups, benchmarks like Mem2ActBench\
  \ test whether agents can translate past dates, locations, and habits into correct\
  \ API parameters [Shen et al., 2026]. Through memory, personalization becomes a\
  \ continuous feedback loop: each interaction updates the user model, which in turn\
  \ steers the agent’s next action.\n[S65] 5.2 Evolving Problem-Solving in Long-Horizon\
  \ Digital Environments (https://arxiv.org/html/2610.29357v1#S5.SS2)\nA110: Digital\
  \ tasks often span multiple web pages, applications, and execution steps. Web research\
  \ requires tracking checked links and active filters; desktop tasks coordinate code\
  \ editors, terminals, and spreadsheets; and software engineering requires navigating\
  \ evolving codebases. In these settings, continual learning serves two needs: resuming\
  \ interrupted workflows and transferring problem-solving strategies across tasks.\
  \ Memory tracks progress to ensure task continuity, while abstracting successful\
  \ runs into reusable skills and debugging routines.\n\nWeb automation. Web navigation\
  \ offers an ideal testbed for workflow reuse. For example, AWM distills reusable\
  \ workflows from successful web trajectories and feeds them into future runs [Wang\
  \ et al., 2025c]. Across 200 domains (such as shopping and travel), this approach\
  \ raised success rates by 24.6% on Mind2Web and 51.1% on WebArena while cutting\
  \ overall action steps. Online-learned routines—like filtering products or comparing\
  \ flight routes—readily transfer to new websites with similar structures.\n\nDesktop\
  \ and cross-application tasks. Desktop agents require both state tracking and skill\
  \ reuse across applications.\nA111:  Systems like OS-Copilot store verified tool\
  \ scripts in procedural memory [Wu et al., 2024b], while other architectures combine\
  \ past execution traces with hierarchical planning to navigate unfamiliar interfaces\
  \ [Agashe et al., 2024]. Similarly, Trace2Skill distills raw trajectories into executable\
  \ skill documents, demonstrating reuse across spreadsheet operations, vision-language\
  \ tasks, and math reasoning [Ni et al., 2026]. For task continuity, OpenHands logs\
  \ commands, file diffs, browser events, and user inputs into a unified event stream\
  \ [Wang et al., 2025a]. This complete history lets coding agents resume interrupted\
  \ jobs without losing context. Together, these systems show that combining execution\
  \ logs with procedural skills supports complex, multi-app workflows.\n\nSoftware\
  \ engineering. Software engineering scales these demands to entire codebases. Coding\
  \ agents must understand repository structures while logging inspected files, failed\
  \ patches, and unit test outputs. SWEMem uses issue progress to selectively compress\
  \ context, keeping context windows manageable during extended debugging sessions\
  \ [Gao et al., 2026]. To transfer knowledge across bugs, SWE-Exp extracts debugging\
  \ strategies from both successful and failed repairs to guide new GitHub issues\
  \ [Chen et al., 2025].\nA112:  Thus, memory maintains local focus within a single\
  \ bug fix while transferring repair strategies across the repository.\n\nExperience\
  \ distillation and strategy reuse. Through trial and error, digital agents turn\
  \ raw execution traces into reusable strategies. Recent frameworks extract high-level\
  \ rules from repeated attempts, attach clear trigger conditions to guidelines, and\
  \ index strategies derived from both successes and failures [Zhao et al., 2024a,\
  \ Fu et al., 2024, Ouyang et al., 2026]. Terminal outputs, browser states, and test\
  \ suites provide immediate feedback to test whether an extracted rule works. In\
  \ short, memory gives digital agents two capabilities: it keeps long-horizon jobs\
  \ from derailing, and it turns past mistakes into faster future execution.\n[S66]\
  \ 5.3 Continuous Exploration in Embodied and Open Worlds (https://arxiv.org/html/2610.29357v1#S5.SS3)\n\
  A113: Embodied agents must track a dynamic physical world while expanding their\
  \ motor skills. Robots navigating homes must remember shifted furniture; robotic\
  \ arms must adapt to unfamiliar tools; and open-world agents must set new goals\
  \ as they explore. These tasks require two memory systems: a world-state memory\
  \ that updates with visual observations, and a skill memory that stores reusable\
  \ behaviors. Together, they allow agents to map their surroundings and master complex\
  \ actions.\n\nLong-term navigation and scene understanding. Mobile robots rely on\
  \ spatial memory to navigate and track dynamic scenes. For example, RememBR indexes\
  \ video clips with spatial and temporal tags, allowing robots to answer queries\
  \ about past object locations during navigation [Anwar et al., 2025]. Similarly,\
  \ EmbodiedVideoAgent combines egocentric video, depth, and pose data into an object-centric\
  \ memory, updating object states as interactions occur [Fan et al., 2025b]. This\
  \ structured memory boosts benchmark scores on Ego4D-VQ3D, OpenEQA, and EnvQA, and\
  \ directly guides grasping, navigation, and placement. Historical observations thus\
  \ become an editable 3D world model.\n\nOpen-world exploration. In open worlds like\
  \ Minecraft, agents must learn complex behaviors without human supervision.\nA114:\
  \  Voyager implements this by proposing new tasks, writing executable skill code,\
  \ and saving verified skills into a library [Wang et al., 2024b]. This skill bank\
  \ helped Voyager discover 3.3 \\times more items and unlock tech-tree milestones\
  \ 15.3 \\times faster than baselines. Crucially, the saved skill library lets agents\
  \ solve unseen tasks from scratch in brand-new worlds. In text worlds like ScienceWorld,\
  \ CLIN abstracts action outcomes into causal rules to guide future planning [Majumder\
  \ et al., 2023]. By saving executable code and causal patterns, exploration continually\
  \ feeds subsequent skill acquisition.\n\nCross-task and cross-embodiment adaptation.\
  \ Manipulating physical objects requires sample-efficient learning. RoboCat addresses\
  \ this by pooling experience across different simulated and real robot arms [Bousmalis\
  \ et al., 2024]. The model learns a generalist policy, generates self-supervised\
  \ data on new tasks, and feeds these runs back into training. Across this self-improving\
  \ training loop, success rates on unseen tasks (after fine-tuning on 500 demonstrations)\
  \ rose from 36% with the initial model to 74% with the final RoboCat model. Pooling\
  \ data across diverse robot hardware shows that cross-embodiment memory drastically\
  \ cuts the demonstrations needed for new tasks.\n\nRobot fleets. Robot fleets turn\
  \ shared deployment into collective policy updates.\nA115:  In a 16-robot setup,\
  \ autonomous trajectories and human teleoperation interventions are pooled to train\
  \ a single generalist policy, which is then flashed back to the fleet [Wang et al.,\
  \ 2026c]. Across eight manipulation tasks—including grocery restocking routines\
  \ lasting 3–5 minutes—accumulated fleet data pushed success rates to 95%. Field\
  \ deployment thus acts as a continual training engine, linking individual robot\
  \ trials to fleet-wide policy improvements.\n[S67] 5.4 Collaborative Evolution via\
  \ Shared Multi-Agent Memory (https://arxiv.org/html/2610.29357v1#S5.SS4)\nA116:\
  \ Multi-agent systems require shared memory to coordinate specialized roles. Software\
  \ teams must log architectural decisions; data teams need to track data provenance;\
  \ and scientific teams must record hypotheses, lab results, and reviews. Storing\
  \ these records in a shared memory pool prevents redundant effort and lets agents\
  \ reuse established workflows and team roles. Memory acts as the team’s shared workspace,\
  \ linking past findings to current tasks.\n\nCross-task collaboration procedures.\
  \ Shared procedural memory allows teams to reuse proven collaboration patterns.\
  \ G-Memory organizes multi-agent interaction histories into a three-tier graph of\
  \ dialogues, queries, and insights, letting agents retrieve both raw traces and\
  \ abstract lessons [Zhang et al., 2025a]. Across five benchmarks, this structured\
  \ memory improved embodied task success and question-answering accuracy. Similarly,\
  \ LegoMem splits memory into orchestrator and worker tiers: orchestrator memory\
  \ sharpens task decomposition, while worker memory improves tool-use accuracy [Han\
  \ et al., 2025]. Reusing execution traces even helps teams of smaller LLMs match\
  \ the performance of proprietary models.\n\nMember expertise and selective sharing.\
  \ Teams also benefit from remembering which agent is good at what.\nA117:  LLMA-Mem\
  \ builds a transactive memory that models member expertise, team layouts, and past\
  \ coordination to optimize future role assignment [Wu et al., 2026b]. But sharing\
  \ everything overwhelms agents. To prevent broadcast clutter, Fioresi et al. train\
  \ an admission policy that only writes an intermediate step to global memory if\
  \ it benefits downstream agents [Fioresi et al., 2026]. On AssistantBench and GAIA,\
  \ this selective sharing cut duplicated work without hurting task accuracy. In short,\
  \ memory decides who should do the work and what information is worth broadcasting.\n\
  \nScientific collaboration. Scientific discovery teams use shared memory to iterate\
  \ on complex research programs. In VirtualLab, specialized AI scientists hold multi-round\
  \ meetings around a shared workspace to design nanobodies, guided by a human lead\
  \ [Swanson et al., 2025]. Co-Scientist refines hypotheses across cycles of generation,\
  \ reflection, and peer review, using persistent context memory to carry validation\
  \ results forward [Gottweis et al., 2026]. Similarly, Robin connects literature\
  \ search, lab protocol design, and data analysis into an autonomous loop where wet-lab\
  \ results update current hypotheses [Ghareeb et al., 2026]. Shared memory keeps\
  \ these long-running research pipelines coherent across iterative design cycles.\n\
  \nSynthesis of shared-memory applications.\nA118:  Effective teamwork relies on\
  \ three forms of continuity: project state (what the team is doing), member profiles\
  \ (who is best equipped to do it), and shared procedures (how the work was done\
  \ before). Project state keeps ongoing investigations on track; member profiles\
  \ streamline role assignments; and reusable workflows eliminate redundant trial\
  \ and error. Shared memory turns individual agent outputs into lasting organizational\
  \ assets.\n\nCross-domain synthesis. Together, these four domains highlight the\
  \ practical scope of memory-centric continual learning. Applications now span multi-week\
  \ health companions, cross-application web agents, repository-level bug fixing,\
  \ open-world discovery, fleet-scale robotics, and automated science labs. In each\
  \ case, memory links past experience to future action. By retaining and organizing\
  \ execution traces, systems avoid repeating mistakes, adapt to changing users and\
  \ environments, and continually turn raw interactions into durable capabilities.\n\
  \nFigure 15:\n\nFour open challenges in memory-centric continual learning:\n\n(1)\
  \ credit assignment across prospective, retrospective, and long-term horizons;\n\
  \n(2) the stability–plasticity dilemma driven by memory interference;\n\n(3) a bridge\
  \ connecting episodic experience with parametric weights; and\n\n(4) a lifecycle\
  \ pipeline of deployment risks and governance rules.\n\n\nA119: Colors distinguish\
  \ the four challenges, and the bottom bar highlights their core questions.\n[S68]\
  \ 6.1 Predicting Experience Value and Long-Term Credit Assignment (https://arxiv.org/html/2610.29357v1#S6.SS1)\n\
  A120: Current agents still rely on handcrafted heuristics rather than learned policies\
  \ \\pi^{\\mathrm{mem}} . The main obstacle is delayed credit assignment. When an\
  \ agent records an event at step t , it must decide three things: whether to save\
  \ it, how to format it, and what metadata to keep. But the true value of this write\
  \ may not show up until step t+100 or later, after many rounds of summarization,\
  \ pruning, and task shifts. As a result, final task success reflects a long chain\
  \ of memory actions, not a single write. This delay blurs the credit signal. Agents\
  \ can easily reflect using prompts, but they struggle to train policies that decide\
  \ what to keep, update, or delete Bhargava and Barrento [2026], Yan et al. [2026],\
  \ Yu et al. [2026b]. Feedback simply changes memory content ( \\mathcal{M}_{t}\\\
  rightarrow\\mathcal{M}_{t+1} ), while the policy itself stays fixed ( \\pi_{t}^{\\\
  mathrm{mem}}=\\pi_{t+1}^{\\mathrm{mem}} ).\n\nThis challenge grows as memory moves\
  \ from raw chat logs to reusable experience. Storing everything is impractical.\
  \ Agents must weigh the future payoff of an experience against storage size, search\
  \ latency, and the risk of confusion Luo et al. [2026], Huang et al. [2026], Shu\
  \ et al. [2026], Zhang et al. [2026c], Wu et al. [2026a]. Recent surveys map out\
  \ how memory is written, managed, and read Du [2026], Wu et al. [2026c], Huang et\
  \ al. [2026], Zhoubian et al.\nA121:  [2026], Jiang et al. [2026]. Yet we still\
  \ lack a principled way to balance these costs and benefits over time. Most existing\
  \ methods rely on simple shortcuts: (1) rules based on recency, frequency, or text\
  \ similarity Luo et al. [2026], Wu et al. [2026c]; (2) learning to call tools like\
  \ store, search, or summarize Yu et al. [2026b], Zhang et al. [2026b], Zhang et\
  \ al. [2025b], Wang et al. [2025b]; or (3) hard budgets on context size Zhang et\
  \ al. [2026c], Wu et al. [2026a], Zhoubian et al. [2026].\n\nThese shortcuts only\
  \ look at the current prompt or immediate reward. They ignore delayed returns, distribution\
  \ shifts, and interactions between co-retrieved memories. Saving bad data pollutes\
  \ the store, triggers negative transfer, and hurts future tasks Shu et al. [2026],\
  \ Wei et al. [2025], Hu et al. [2026a], Yang et al. [2026c], Yu et al. [2026a],\
  \ Wu et al. [2026a]. Three practical hurdles prevent delayed rewards from training\
  \ \\pi^{\\mathrm{mem}} :\n\n•\n\nPredicting value before writing. At write time,\
  \ the agent does not know future queries or tasks. Dropping an experience loses\
  \ information permanently. Keeping bad data pollutes the store. The policy must\
  \ forecast long-term utility using only local, present clues Bhargava and Barrento\
  \ [2026], Du [2026], Shu et al. [2026], Wu et al. [2026a].\n\n•\n\nTracing failure\
  \ back through the pipeline.\nA122:  Final errors stem from many sources: poor admission,\
  \ lossy summarization, bad retrieval, or weak reasoning. When an agent fails, it\
  \ is hard to isolate whether memory or reasoning caused the error Bhargava and Barrento\
  \ [2026], Jiang et al. [2026], Du [2026], Ai et al. [2025], Yan et al. [2026], Zhang\
  \ et al. [2026a].\n\n•\n\nPath dependence across runs. Every write or delete alters\
  \ the memory state for future sessions. Different rollouts no longer share the same\
  \ environment. This variance breaks standard reinforcement learning assumptions\
  \ and destabilizes training Yan et al. [2026], Yang et al. [2026c], Yu et al. [2026b],\
  \ Yu et al. [2026a], Zhang et al. [2026a].\n\nSolving these hurdles requires optimizing\
  \ for long-term net value. For write-time prediction, agents can learn value models\
  \ on task streams, using scaling curves to judge marginal returns Bhargava and Barrento\
  \ [2026], Shu et al. [2026], Zhoubian et al. [2026], Xiao et al. [2025]. To trace\
  \ errors, systems can log write decisions, run ablation tests, and keep links from\
  \ summaries back to raw source episodes Bhargava and Barrento [2026], Du [2026],\
  \ Jiang et al. [2026], Shu et al. [2026]. To handle path dependence, agents can\
  \ branch rollouts from identical memory checkpoints and use hindsight critics Yan\
  \ et al. [2026], Tan et al. [2026], Yu et al. [2026b], Zhang et al. [2026c], Wu\
  \ et al. [2026a].\nA123:  The ultimate goal is closed-loop control: task feedback\
  \ should update not just what the agent remembers, but how it manages memory.\n\
  [S69] 6.2 The Stability–Plasticity Dilemma in Dynamic Environments (https://arxiv.org/html/2610.29357v1#S6.SS2)\n\
  A124: External memory gives agents a way to learn continually at the system level.\
  \ Like classic continual learning, it aims to acquire new capabilities, preserve\
  \ old knowledge, and transfer skills Luo et al. [2026], Xiong et al. [2026]. As\
  \ noted in Section 2.1, parametric learning updates model weights, while agent memory\
  \ updates external records at inference time. However, external stores do not remove\
  \ the stability–plasticity dilemma; they simply relocate it Hu et al. [2026a].\n\
  \nHere, interference occurs during retrieval and prompt construction. A loose write\
  \ policy (Section 3.1) boosts plasticity by saving new records quickly, but it also\
  \ clutters storage with duplicate and conflicting entries. Under fixed retrieval\
  \ budgets, this clutter crowds out useful memories. In the cascade of Section 4.1.1,\
  \ saving more records (Gate 1) hurts retrieval accuracy (Gate 2). Even when retrieved,\
  \ outdated facts can lead the model to ignore correct updates or apply old rules\
  \ to wrong tasks (Gate 3) Hu et al. [2026a], Liang et al. [2026], Kim et al. [2026],\
  \ Zhang et al. [2026a]. Stability means keeping valid memories easy to find and\
  \ use. Plasticity means updating old facts without breaking what already works.\n\
  \nThis trade-off sharpens as memory expands. More interactions can help agents learn\
  \ Ouyang et al. [2026], and periodic cleaning keeps stores lean Yin et al. [2025].\n\
  A125:  Yet larger stores always raise the risk of retrieval noise. We should judge\
  \ memory scaling by task gains under fixed compute budgets, not by raw storage volume.\n\
  \nMeasuring these trade-offs requires long-term benchmarks. Recent benchmarks test\
  \ specific skills, such as fact updates in LongMemEval Wu et al. [2025a] or task\
  \ transfer in Evo-Memory and LifelongAgentBench Wei et al. [2025], Zheng et al.\
  \ [2025]. As outlined in Section 4, evaluations should track retention, forward\
  \ transfer, and negative interference across shifting task streams. Beyond final\
  \ accuracy, tracking survival rates, retrieval ranks, and actual memory usage against\
  \ frozen-memory baselines shows whether memory truly helps or quietly harms performance.\n\
  \nThe core question is direct: How can agents keep memories accurate and relevant\
  \ as experience grows? Promising paths include write filters that prevent clutter,\
  \ consolidation that checks raw evidence, and retrieval that matches the exact conditions\
  \ where an experience applies Hu et al. [2026a], Zhang et al. [2026a], Liang et\
  \ al. [2026].\n[S70] 6.3 Synergistic Continual Learning through Experience Memory\
  \ and Parametric Learning (https://arxiv.org/html/2610.29357v1#S6.SS3)\nA126: Continual\
  \ learning requires coordinating external experience with internal model weights.\
  \ Today, agents treat them as two separate systems. External memory stores new facts\
  \ quickly without touching model weights Shinn et al. [2023], Chhikara et al. [2025],\
  \ Xu et al. [2025]. Parametric fine-tuning bakes patterns into weights for broad\
  \ generalization, but risks catastrophic forgetting Wu et al. [2024a], Shi et al.\
  \ [2025].\n\nRecent work connects the two sides by extracting reasoning paths into\
  \ external memory or fine-tuning lightweight adapters Gutiérrez et al. [2025], Ouyang\
  \ et al. [2026], Zhao et al. [2024b], He et al. [2024]. Yet information flows mostly\
  \ one way: from raw episodes into weights or static stores. Systems cannot easily\
  \ edit, roll back, or delete parametric knowledge once written. Human memory works\
  \ differently. In biology, recalling a consolidated memory makes it flexible again,\
  \ meaning the brain must actively restabilize it (a process called reconsolidation)\
  \ Nader et al. [2000]. Neural networks lack this feature; once weights change, they\
  \ stay fixed until the next gradient step.\n\nThe key missing piece is the bridge\
  \ between raw experience and parametric weights. An agent should first test and\
  \ summarize experiences in external storage. Only repeatedly verified patterns should\
  \ enter model weights.\nA127:  Conversely, when existing weights fail on new evidence,\
  \ the agent must pull that knowledge back into explicit text to inspect and fix\
  \ it. This cycle follows Complementary Learning Systems (CLS) theory: fast learning\
  \ in the hippocampus and slow integration in the cortex interact via replay to balance\
  \ plasticity and stability McClelland et al. [1995], Kumaran et al. [2016], Wilson\
  \ and McNaughton [1994]. Furthermore, the brain does not store every event; synaptic\
  \ tagging-and-capture shows that novelty and reward flags decide which synapses\
  \ undergo lasting change Frey and Morris [1997].\n\nFuture systems should build\
  \ a two-way learning loop across three clear steps:\n\n1.\n\nSelection: Filter raw\
  \ traces by novelty, utility, and frequency—like synaptic tagging—before keeping\
  \ them.\n\n2.\n\nConsolidation: Replay, abstract, and bake verified memories into\
  \ model weights via modular adapters.\n\n3.\n\nRevision: Test weights against new\
  \ facts, reopen outdated knowledge for correction (like reconsolidation), and use\
  \ schemas to absorb new rules quickly Tse et al. [2007].\n\nInstead of treating\
  \ memory and weights as separate silos, agents need clear algorithms that pass knowledge\
  \ back and forth between them.\n[S71] 6.4 Trustworthy Memory Governance in Lifelong\
  \ Deployment (https://arxiv.org/html/2610.29357v1#S6.SS4)\nA128: While methods for\
  \ writing and searching memory have matured, memory safety and control lag behind.\
  \ Few studies address access control, rollback, or secure deletion, even though\
  \ real-world deployment risks center on these exact areas Ding et al. [2026].\n\n\
  Without explicit governance, security risks spread across every stage of the memory\
  \ lifecycle:\n\n•\n\nFormation: Attackers can inject malicious text through poisoned\
  \ web pages or prompt injection. Without write checks, agents save these instructions\
  \ as trusted facts, corrupting future actions (Section 3.1) Chen et al. [2024],\
  \ Dong et al. [2025], Tian et al. [2026].\n\n•\n\nConsolidation: When agents summarize\
  \ logs into general rules, they often drop timestamps and source links—a failure\
  \ known as context collapse (Section 3.2). As a result, a single poisoned prompt\
  \ can turn into a permanent, trusted behavioral rule.\n\n•\n\nRetrieval: Corrupted\
  \ memories can hijack tool calls and override user instructions during normal tasks\
  \ Xu et al. [2026a], or leak private data across users in shared stores Yang et\
  \ al. [2026a]. This shows why retrieving a memory is different from using it safely\
  \ (Section 3.3).\n\n•\n\nForgetting: Deleting a raw record does not remove its downstream\
  \ traces, such as summaries, fine-tuned weights, or knowledge graphs (Section 3.4)\
  \ Lin et al. [2026]. Bad behavior can persist long after the original entry is gone\
  \ Ding et al.\nA129:  [2026].\n\nMemory control is hard for three reasons: (1) Expanding\
  \ scope: As agents gain more tools and autonomy, attack surfaces constantly shift\
  \ Zhou et al. [2026]. (2) Delayed impact: The gap between a poisoned write and an\
  \ attack can be weeks or months. Summarization hides original sources, making it\
  \ hard to trace who wrote what Lin et al. [2026]. (3) Direct trade-offs: Strict\
  \ privacy checks and audit logs slow down search and increase token costs Lam et\
  \ al. [2026].\n\nRecent work introduces basic defenses: write permissions, provenance\
  \ logs, user-isolated retrieval, and verified rollback Lin et al. [2026]. Yet evaluation\
  \ still falls short. Most benchmarks only score task success, giving developers\
  \ little reason to build safe memory systems Ding et al. [2026]. In addition, self-reflection\
  \ remains hard to verify from the outside, and shared memory in multi-agent setups\
  \ lacks clear access rules Wang et al. [2026b], Yang et al. [2026a].\n\nTo build\
  \ reliable agents, governance must cover the full lifecycle:\n\n•\n\nFormation:\
  \ Verify sources and permissions before writing, rather than filtering data after\
  \ problems occur Lin et al. [2026].\n\n•\n\nConsolidation: Borrow ideas from database\
  \ recovery and belief revision to prevent agents from dropping critical source context\
  \ during summarization Ding et al. [2026].\n\n•\n\n\nA130: Retrieval: Sandbox tool\
  \ execution and enforce role-based access for shared multi-agent stores Wang et\
  \ al. [2026b], Yang et al. [2026a].\n\n•\n\nForgetting: Use clear metrics—such as\
  \ stress tests and recovery targets—to prove that deleted data and its side effects\
  \ are truly gone Ding et al. [2026].\n\nGovernance cannot remain an afterthought;\
  \ it must become a testable, built-in guarantee of agent systems.\n[S72] 7 Conclusion\
  \ (https://arxiv.org/html/2610.29357v1#S7)\nA131: In this paper, we reframe agent\
  \ memory as an evolving learning\n\ninfrastructure for continual learning, rather\
  \ than a passive storage or\n\nretrieval component. We argue that experience accumulation\
  \ cannot be equated\n\nwith static recall, but requires a closed-loop dynamic of\
  \ retention,\n\nadaptation, and transfer, explaining why current memory agents fail\
  \ under\n\ndelay, interference, and environmental drift. To address this, we establish\n\
  \na unified framework spanning physical substrates, reusable assets, and\n\nlifecycle\
  \ policies, coupled with a behavior-centric evaluation methodology\n\nto isolate\
  \ genuine experiential gains and a memory scaling law that relates\n\nthose gains\
  \ to experience and memory resources. By adopting this memory-centric\n\nlens, the\
  \ field shifts its central question from whether an agent can\n\nremember to whether\
  \ it can continually learn, paving a more principled path\n\ntowards building resilient,\
  \ self-improving intelligent systems.\n[S73] References (https://arxiv.org/html/2610.29357v1#bib)\n\
