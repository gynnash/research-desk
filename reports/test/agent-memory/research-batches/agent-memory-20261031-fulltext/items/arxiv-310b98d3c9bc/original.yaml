    title: Abstract
    text: 'Autonomous agents powered by foundation models can reason, plan, and use
      tools, but their fixed weights and context limits hinder sustained learning
      from experience over long-term deployment. While external memory systems attempt
      to bridge this gap, they mostly act as passive retrieval caches, evaluated primarily
      by whether they can recall stored facts or past interactions. Whether memory
      can drive genuine continual learning remains an open question. In this paper,
      we introduce Memory-Centric Continual Learning (MCCL), arguing that memory should
      be judged by whether it improves future actions, not merely what it retrieves.
      MCCL has three main parts. First, a three-axis taxonomy organizes memory by
      where state is stored (substrates), what form it takes (assets), and how it
      is managed (policies). This defines a two-loop lifecycle that updates memory
      state in an inner loop while refining management policies in an outer loop based
      on task feedback. Second, an evaluation protocol measures retention under interference,
      adaptation to change, and task transfer to isolate genuine behavioral gains
      from simple context expansion. Third, a memory scaling framework models how
      agent performance scales with experience, storage capacity, and compute budgets
      across non-parametric and parametric memory. Together, these components reframe
      agent memory from passive lookup to continuous learning, offering a principled
      route toward self-improving autonomous agents.


      Non-parametric memory


      Parametric memory


      Figure 1: Memory scaling across two substrates. Theoretical illustrations:


      left, joint allocation of storage and reading resources sustains improvement


      beyond fixed-capacity limits; center, greater experience requires more


      parametric memory capacity; right, load-induced interference emerges at


      substrate-dependent thresholds. Curves are synthetic illustrations;


      see Section 4.3 and Figures 7 and 11.'
