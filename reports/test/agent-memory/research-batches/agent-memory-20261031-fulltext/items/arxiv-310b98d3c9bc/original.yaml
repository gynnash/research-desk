material: "[S1] Abstract (https://arxiv.org/html/2610.29357v1#abstract1)\nA1: Autonomous\
  \ agents powered by foundation models can reason, plan, and use tools, but their\
  \ fixed weights and context limits hinder sustained learning from experience over\
  \ long-term deployment. While external memory systems attempt to bridge this gap,\
  \ they mostly act as passive retrieval caches, evaluated primarily by whether they\
  \ can recall stored facts or past interactions. Whether memory can drive genuine\
  \ continual learning remains an open question. In this paper, we introduce Memory-Centric\
  \ Continual Learning (MCCL), arguing that memory should be judged by whether it\
  \ improves future actions, not merely what it retrieves. MCCL has three main parts.\
  \ First, a three-axis taxonomy organizes memory by where state is stored (substrates),\
  \ what form it takes (assets), and how it is managed (policies). This defines a\
  \ two-loop lifecycle that updates memory state in an inner loop while refining management\
  \ policies in an outer loop based on task feedback. Second, an evaluation protocol\
  \ measures retention under interference, adaptation to change, and task transfer\
  \ to isolate genuine behavioral gains from simple context expansion. Third, a memory\
  \ scaling framework models how agent performance scales with experience, storage\
  \ capacity, and compute budgets across non-parametric and parametric memory.\nA2:\
  \  Together, these components reframe agent memory from passive lookup to continuous\
  \ learning, offering a principled route toward self-improving autonomous agents.\n\
  \nNon-parametric memory\n\nParametric memory\n\nFigure 1: Memory scaling across\
  \ two substrates. Theoretical illustrations:\n\nleft, joint allocation of storage\
  \ and reading resources sustains improvement\n\nbeyond fixed-capacity limits; center,\
  \ greater experience requires more\n\nparametric memory capacity; right, load-induced\
  \ interference emerges at\n\nsubstrate-dependent thresholds. Curves are synthetic\
  \ illustrations;\n\nsee Section 4.3 and Figures 7 and 11.\n[S2] 1 The Landscape:\
  \ Why Agents Need Continual Learning via Memory (https://arxiv.org/html/2610.29357v1#S1)\n\
  A3: Autonomous agents powered by foundation models have demonstrated strong\n\n\
  capabilities in multi-step reasoning, planning, and tool use across digital and\
  \ physical\n\ndomains Agashe et al. [2024], Wang et al. [2024b], Yao et al. [2023].\n\
  \nHowever, current agents cannot reliably improve from experience over long deployments.\n\
  \nAlthough modern agent harnesses can systematically track execution logs, timestamps,\n\
  \nand environment states, they often treat accumulated history as raw text to be\
  \ retrieved\n\nand inserted back into the prompt.\n\nSimply retrieving raw text\
  \ does not guarantee behavioral improvement. As interaction\n\ntrajectories grow,\
  \ unmanaged context dilutes relevant signals, increases inference latency,\n\nand\
  \ degrades model attention Wang et al. [2026d].\n\nConventional adaptation methods\
  \ face clear trade-offs. Expanding context windows is bounded\n\nby session limits\
  \ and suffers from attention degradation over long contexts. Meanwhile, continual\n\
  \nfine-tuning requires substantial computation, risks catastrophic forgetting of\
  \ general abilities,\n\nand lacks reliable mechanisms to roll back errors Gu et\
  \ al. [2024], Luo et al. [2025].\n\nWithout mechanisms to distill, update, and transfer\
  \ accumulated experience, deployed agents cannot\n\nretain what they learn. Consequently,\
  \ they repeatedly commit the same errors, struggle with\n\n\nA4: conflicting or\
  \ outdated information, and fail to improve across sequential tasks Cattan et al.\
  \ [2025], Hu et al. [2026a], Yu et al. [2026a].\n\nAgent memory has emerged as a\
  \ primary approach to support persistence across sessions and\n\npersonalization\
  \ Chhikara et al. [2025], Packer et al. [2023], Park et al. [2023].\n\nHowever,\
  \ despite rapid progress, most existing methods focus on specific engineering implementations\n\
  \nrather than systematic continual learning. Many approaches adopt an information\
  \ retrieval view,\n\ntreating memory simply as an external database or a Retrieval-Augmented\
  \ Generation (RAG) cache\n\ndesigned to feed past tokens back into the prompt Lewis\
  \ et al. [2020], Luo et al. [2026].\n\nFurthermore, existing classifications often\
  \ blur distinct system choices, including where memory is\n\nphysically stored,\
  \ what form knowledge takes, and how memory operations are managed.\n\nEvaluation\
  \ also remains limited. Many benchmarks primarily test whether an agent can recall\
  \ or answer\n\nquestions over a static past history, rather than whether experience\
  \ accumulated during deployment\n\nimproves subsequent actions under interference\
  \ and drift Du et al. [2024], Maharana et al. [2024], Wu et al. [2025a].\n\nMoreover,\
  \ as memory stores grow, unmanaged external memory suffers from retrieval noise,\
  \ memory\n\npollution, and negative transfer when task distributions shift Chen\
  \ et al.\nA5:  [2026a], Zhang et al. [2026a].\n\nTo bridge this gap, we propose\
  \ the framework of Memory-Centric Continual Learning (MCCL).\n\nWe argue that addressing\
  \ the stability–plasticity dilemma does not strictly require continuous\n\ngradient\
  \ updates to foundation model weights.\n\nInstead, memory itself can serve as an\
  \ evolving learning infrastructure through which an agent\n\nincorporates feedback,\
  \ refines strategies, and resolves knowledge conflicts during deployment,\n\nwhile\
  \ keeping the base model intact.\n\nIn this framework, continual learning operates\
  \ as a coupled dynamical system. An inner\n\nmemory-state loop updates stored knowledge\
  \ from sequential deployment experience, while an\n\nouter policy-adaptation loop\
  \ refines memory management policies based on task performance.\n\nBy connecting\
  \ task outcomes back to memory management, MCCL provides a principled route toward\n\
  \nRecursive Self-Improvement (RSI), where agents not only accumulate experience\
  \ but also\n\nimprove how that experience is organized and used. We summarize our\
  \ core contributions as follows.\n\n1.\n\nA unified taxonomy of memory architecture.\n\
  \nWe clarify existing classifications through a three-axis taxonomy:\n\nwhere experience\
  \ persists (substrates: contextual, activation, external addressable, and adaptive\
  \ parametric),\n\nwhat form it takes (assets: episodic, semantic, and procedural),\
  \ and\n\n\nA6: how operations are managed (policies: prescribed, deliberative, and\
  \ learned).\n\nThis separates physical storage from cognitive representation and\
  \ operational control\n\n(Section 2).\n\n2.\n\nThe memory lifecycle as an engine\
  \ for continual learning.\n\nWe formalize memory dynamics across five core stages:\
  \ selective formation, structural consolidation,\n\nreactivation and utilization,\
  \ knowledge revision and selective forgetting, and feedback-driven policy evolution.\n\
  \nThis formulation explains how raw interactions turn into generalizable knowledge\
  \ while mitigating memory pollution and drift\n\n(Section 3).\n\n3.\n\nA behavioral\
  \ evaluation framework.\n\nWe distinguish retrieval-level checks from genuine continual\
  \ learning outcomes.\n\nWe introduce a four-gate retention cascade (preservation,\
  \ access, utilization, and effect) to diagnose failure points,\n\nuse matched stateful-versus-reset\
  \ comparisons ( \\Delta P_{t} ) to isolate the effect of accumulated memory,\n\n\
  and establish evaluation protocols to measure retention under interference, adaptation\
  \ under drift, and cross-task transfer\n\n(Section 4).\n\n4.\n\nA memory scaling\
  \ law.\n\nWe model how agent performance scales with experience, storage capacity,\
  \ and compute budgets across both non-parametric and parametric memory.\n\nBoth\
  \ share a resource-limited scaling frontier, but differ in how new writes interact\
  \ with existing content.\n\n\nA7: This shifts the focus from whether larger memory\
  \ helps to how experience, capacity, and compute should scale together\n\n(Section\
  \ 4.3).\n\nIn summary, this paper reframes agent memory from a passive storage component\
  \ into an active learning\n\ninfrastructure, focusing on whether an agent can continually\
  \ learn over time rather than simply retrieve\n\npast records. The remainder of\
  \ this paper is organized as follows.\n\nSection 2 presents the taxonomy across\
  \ substrates, assets, and policies.\n\nSection 3 details the memory lifecycle as\
  \ a continual learning engine.\n\nSection 4 formalizes the evaluation framework\
  \ and memory scaling laws.\n\nSection 5 analyzes applications across digital and\
  \ physical domains.\n\nSection 6 discusses open challenges in credit assignment,\
  \ parametric synergy, and trustworthy memory governance.\n\nSection 7 concludes\
  \ the paper.\n\nFigure 2: Memory-centric continual learning as a coupled dynamical\
  \ system.\n\nA task stream is executed by the agent and produces outcome feedback.\n\
  \nExperience is organized as episodic, semantic, and procedural assets that\n\n\
  persist across contextual, activation, external, and parametric\n\nsubstrates. An\
  \ inner memory-state loop forms, consolidates, reactivates,\n\nand revises these\
  \ assets, while prescribed, deliberative, or learned\n\npolicies govern the corresponding\
  \ operations. An outer\n\n\nA8: policy-adaptation loop uses task feedback to update\
  \ memory management.\n[S3] 2 A Unified Framework: Architecting Memory for Continual\
  \ Learning (https://arxiv.org/html/2610.29357v1#S2)\nA9: Classical continual learning\
  \ theory has primarily focused on the\n\nstability–plasticity dilemma within model\
  \ weights, seeking\n\nto mitigate catastrophic forgetting during sequential gradient\n\
  \nupdates McCloskey and Cohen [1989], Wang et al. [2024c].\n\nIn contrast, foundation-model-based\
  \ agents decouple computation from\n\npersistent storage, distributing experiential\
  \ adaptation across physical\n\nmedia, semantic abstractions, and control mechanisms.\n\
  \nHowever, existing taxonomies often mix these levels, confusing where an experience\n\
  \nis stored with what form it takes and how it is managed Huang et al. [2026], Zhoubian\
  \ et al. [2026].\n\nTo establish a principled foundation for memory-centric continual\
  \ learning,\n\nwe organize the design space around three core axes, covering\n\n\
  where experience persists, what reusable form it takes,\n\nand how memory operations\
  \ are managed\n\n(Figure 2).\n\n•\n\nMemory Substrates (WHERE): Physical Storage\
  \ Media.\n\nSubstrates define the physical medium where experience persists. They\
  \ govern trade-offs\n\nbetween write latency, volatility, capacity, and durability,\
  \ determining whether\n\nexperience is held in active context, model activations,\
  \ external stores, or model parameters.\n\n•\n\nMemory Assets (WHAT): Cognitive\
  \ Representations.\n\nAssets describe the form knowledge takes. Independent of physical\
  \ substrates,\n\n\nA10: assets balance specific detail against general abstraction,\
  \ grouping experience into\n\nepisodic traces, semantic facts, or procedural skills.\n\
  \n•\n\nMemory Policies (HOW): Mechanisms for Memory Management.\n\nPolicies define\
  \ the rules for writing, consolidating, retrieving, updating, and\n\nforgetting\
  \ memories. They span fixed heuristics (prescribed), runtime language model\n\n\
  reasoning (deliberative), and feedback-driven control (learned), determining whether\n\
  \nmemory management remains static or adapts over time.\n\nThese three axes are\
  \ complementary dimensions rather than isolated categories.\n\nA concrete agent\
  \ memory system combines specific choices across all three axes,\n\nsuch as compiling\
  \ episodic traces into an external addressable store governed by\n\ndeliberative\
  \ policies powered by Large Language Models (LLMs).\n\nDecoupling these dimensions\
  \ clarifies that possessing an external substrate\n\ndoes not by itself yield transferable\
  \ capability, nor does storing an\n\nepisodic asset indicate that an agent has an\
  \ effective policy to retrieve\n\nand use it.\n\nBy formalizing this three-axis\
  \ architecture, we establish a principled framework\n\nto diagnose where existing\
  \ architectures succeed or fail under non-stationary streams,\n\nand to compose\
  \ hybrid systems that support RSI.\n[S4] 2.1 Memory Substrates: Physical Foundations\
  \ for Stability and Plasticity (https://arxiv.org/html/2610.29357v1#S2.SS1)\nA11:\
  \ Memory substrates define where experience persists and how it can be accessed\n\
  \nand modified. Existing taxonomies commonly separate internal from external memory,\n\
  \nor computation-coupled from addressable memory Huang et al. [2026], Zhoubian et\
  \ al. [2026].\n\nWe distinguish substrates by where state physically persists, rather\
  \ than how it appears\n\nduring inference. For example, text retrieved from a database\
  \ remains external memory even when\n\nplaced in a prompt; conversely, offloading\
  \ the KV cache to disk changes its storage location\n\nbut keeps it an activation-level\
  \ representation. Following this principle, we identify\n\nfour basic substrates:\
  \ contextual memory, activation memory, external addressable memory,\n\nand adaptive\
  \ parametric memory.\n\nThis distinction is independent of memory assets and policies.\
  \ A substrate\n\nspecifies how long experience can persist, how it can be addressed,\
  \ and at\n\nwhat granularity it can be updated. It does not, by itself, tell us\
  \ whether\n\nthose updates yield transferable improvement; that depends on the assets\n\
  \nbuilt from experience and on the policies that govern their formation and\n\n\
  use.\n[S5] Contextual memory. (https://arxiv.org/html/2610.29357v1#S2.SS1.SSS0.Px1)\n\
  A12: The most direct memory substrate is the sequence of tokens currently visible\n\
  \nto the model. Thoughts, actions, and observations can be recorded in a shared\n\
  \nprompt so that the trajectory influences subsequent decisions through\n\nself-attention\
  \ Yao et al. [2023]. Ever-growing traces are replaced with\n\nsubgoal-level summaries\
  \ or compressed reasoning\n\nstates Hu et al. [2024], Wu et al. [2025b], and deletion,\
  \ compression, and\n\nrewriting are exposed as agent actions Zhang et al. [2025b].\
  \ These\n\nmethods require little architectural modification and offer nearly immediate\n\
  \nplasticity, with relatively high fidelity over short horizons. Their\n\nstability,\
  \ however, is bounded by the session limit. As trajectories grow,\n\nolder observations\
  \ consume context tokens and degrade model attention.\n\nEven within the supported\
  \ context window, performance can drop sharply with\n\nsequence length, evidence\
  \ position, and task complexity Liu et al. [2024], Hsieh et al. [2024].\n\nSummarization\
  \ and compaction extend the effective horizon but introduce an irreversible,\n\n\
  often lossy selection step Cim et al. [2026].\n[S6] Activation memory. (https://arxiv.org/html/2610.29357v1#S2.SS1.SSS0.Px2)\n\
  A13: A second family compresses history into machine-native states, including\n\n\
  hidden activations, KV caches, recurrent states, and dedicated memory slots.\n\n\
  Hidden states are reused across segments, and KV entries are selectively\n\nretained\
  \ under a fixed budget Dai et al. [2019], Zhang et al. [2023], Liu et al. [2025c].\
  \ Previously computed\n\ninternal representations are placed in a retrievable memory\n\
  \nbank Wang et al. [2023], Wu et al. [2022], and latent pools or designated\n\n\
  slots are introduced that can be repeatedly read and\n\nupdated Wang et al. [2024e],\
  \ Kang et al. [2025b]. Compared with textual context,\n\nthese states participate\
  \ in the forward pass at higher bandwidth and need not\n\nbe translated back into\
  \ natural language. Gating, state transitions, and\n\nisolated slots can also confine\
  \ rapid adaptation to a restricted state\n\nchannel, leaving the pretrained backbone\
  \ unchanged. This efficiency shifts\n\nthe capacity cost to runtime memory and limits\
  \ controllability: activation\n\nmemories are tied to a particular model, layer\
  \ structure, and representation\n\nspace, and their contents are difficult to inspect,\
  \ edit at the level of\n\nindividual facts, or transfer across models Kwon et al.\
  \ [2023].\n\nFixed-dimensional latent states also face capacity limits as experience\n\
  \naccumulates. Offloading activation states or the KV cache to disk does not turn\
  \ them\n\n\nA14: into external text memory, because they can still only be processed\
  \ as internal\n\nrepresentations by the original model.\n[S7] External addressable\
  \ memory. (https://arxiv.org/html/2610.29357v1#S2.SS1.SSS0.Px3)\nA15: External memory\
  \ separates storage from model computation. Experience persists\n\nas independently\
  \ maintained entries that can be explicitly retrieved and\n\nmodified. Implementations\
  \ range from natural-language logs and summaries to\n\nvector indices, relational\
  \ tables, knowledge graphs, hierarchical trees, code\n\nrepositories, and collections\
  \ of specialized stores. Observation streams are\n\ncombined with higher-order reflections,\
  \ language-level diagnoses are retained\n\nfrom failed trials, and information is\
  \ moved between a bounded active context\n\nand larger archival\n\nstores Park et\
  \ al. [2023], Shinn et al. [2023], Packer et al. [2023]. Memory\n\nextraction, dynamic\
  \ organization, and structured retrieval are further\n\ndeveloped in recent\n\n\
  systems Chhikara et al. [2025], Xu et al. [2025], Gutiérrez et al. [2025], Rezazadeh\
  \ et al. [2024].\n\nThis substrate offers a direct route to non-parametric\n\ncontinual\
  \ learning: new experience can survive across sessions without\n\naltering the foundation\
  \ model, individual records can be revised or\n\nversioned, and capacity can grow\
  \ independently of model size.\n\nStructural separation changes rather than resolves\
  \ the\n\nstability–plasticity dilemma. External stores avoid catastrophic forgetting\n\
  \ncaused by parameter updates, but an old memory can become inaccessible when\n\n\
  its retrieval rank declines, producing a form of functional\n\nforgetting.\nA16:\
  \  Summarization, deduplication, and conflict resolution may also\n\noverwrite earlier\
  \ records or change whether they still count as valid\n\nevidence. As the store\
  \ grows, redundant, stale, and conflicting entries\n\nraise retrieval noise. Indexing,\
  \ provenance tracking, and deletion become\n\nmore expensive as well. Irrelevant\
  \ or\n\nconflicting retrieval can be actively\n\nharmful Wang et al. [2024a], Cattan\
  \ et al. [2025], and current memory\n\nagents do not reliably combine retrieval,\
  \ online updating, long-range use,\n\nand selective forgetting Hu et al. [2026b],\
  \ Uddin et al. [2026].\n[S8] Adaptive parametric memory. (https://arxiv.org/html/2610.29357v1#S2.SS1.SSS0.Px4)\n\
  A17: Parametric substrates encode deployment experience in model weights,\n\ndetachable\
  \ adapters, or designated fast parameters. Static pretrained weights\n\nare not\
  \ sufficient for this category; the defining property is that\n\nparameters can\
  \ still be updated from experience after deployment. Consecutive\n\nedits are isolated\
  \ in a side parameter space, and behavior obtained with\n\nvisible context is distilled\
  \ into a model that no longer receives that\n\ncontext Wang et al. [2024d], Wang\
  \ et al. [2024f]. Test-time neural memory and\n\nrapidly updated LoRA parameters\
  \ are used to preserve behavioral effects after\n\nthe corresponding evidence has\
  \ left the active\n\nprompt Behrouz et al. [2025], Ren et al. [2026]. Once internalized,\
  \ it can be used\n\nduring a standard forward pass without external retrieval\n\n\
  and may generalize beyond the specific instance that produced the update. It\n\n\
  is therefore attractive for stable, frequently reused, and well-validated\n\nknowledge\
  \ or skills.\n\nThis efficiency at read time comes at the cost of more expensive\
  \ and less\n\ncontrollable writes. Parameter updates require optimization, generated\n\
  \nsupervision, or specialized test-time learning rules. Once an experience is\n\n\
  distributed across weights, its scope is difficult to localize, and\n\nrecord-level\
  \ expiration, provenance tracking, and deletion become\n\nsubstantially harder than\
  \ in an external store.\nA18:  Repeated adaptation can cause\n\ncatastrophic forgetting\
  \ of earlier knowledge or consolidate transient\n\nfeedback and self-generated errors\
  \ into persistent behavior. Continual\n\ninstruction tuning forgets across domain\
  \ knowledge, reasoning, and reading\n\ncomprehension, and successful factual edits\
  \ can still degrade unrelated\n\ngeneral abilities Luo et al. [2025], Gu et al.\
  \ [2024]. Side\n\nmemories, low-rank adapters, and slow–fast parameter decompositions\
  \ reduce\n\nforgetting by restricting the update scope, but introduce routing failures,\n\
  \nmodule-merging conflicts, and long-term drift of their own.\n[S9] Hybrid substrates.\
  \ (https://arxiv.org/html/2610.29357v1#S2.SS1.SSS0.Px5)\nA19: Practical memory systems\
  \ increasingly combine substrates with complementary roles,\n\nwhere tokens and\
  \ activations support immediate adaptation, external stores provide durable\n\n\
  and auditable retention, and parameter updates selectively internalize stable skills\
  \ Packer et al. [2023], Wang et al. [2023], Behrouz et al. [2025], Ren et al. [2026].\n\
  \nExisting hybrid systems still leave several design choices open, including where\
  \ new\n\nexperience first enters, when it moves to a more durable store, how queries\
  \ are routed,\n\nwhich state is authoritative during conflicts, and where erroneous\
  \ updates can be rolled back.\n\nFigure 3:\n\nA unified taxonomy of agent memory\
  \ for continual learning.\n\nMemory substrates specify where experience persists,\
  \ memory assets describe\n\nwhat reusable representations are constructed from experience,\
  \ and memory\n\npolicies determine how memory is written, retrieved, consolidated,\
  \ revised,\n\nand forgotten. Representative related works are organized by subclass\
  \ under\n\neach of the three dimensions.\n[S10] 2.2 Memory Assets: Representations\
  \ for Cross-Task Transfer (https://arxiv.org/html/2610.29357v1#S2.SS2)\nA20: Memory\
  \ substrates determine the physical state in which experience persists,\n\nwhereas\
  \ memory assets describe the reusable units constructed from that\n\nexperience.\
  \ The two dimensions do not admit a fixed correspondence. The same\n\ntask experience\
  \ may remain temporarily as context tokens, be written to an\n\nexternal log, organized\
  \ as a graph, or eventually internalized into model\n\nparameters. Conversely, a\
  \ single external store may contain event records,\n\nfactual relations, and executable\
  \ skills. We therefore classify an asset by\n\nhow it is used when retrieved, rather\
  \ than by how it is stored, distinguishing\n\nepisodic, semantic, and procedural\
  \ assets. This taxonomy concerns experience\n\nthat can persist across interactions\
  \ or tasks. Contextual tokens and\n\nactivation states may participate in memory\
  \ formation, but they count as\n\nassets only once they persist in a reusable form\
  \ across tasks; otherwise they\n\nremain working state on a substrate.\n\nAs with\
  \ substrates, possessing an asset is not itself evidence of cross-task\n\nlearning.\
  \ Episodes, facts, and skills specify the form in which\n\nexperience can transfer;\
  \ whether transfer occurs is a question for memory\n\npolicies.\n[S11] Episodic\
  \ assets. (https://arxiv.org/html/2610.29357v1#S2.SS2.SSS0.Px1)\nA21: Episodic assets\
  \ preserve what happened. Their basic unit is a\n\nparticular experience situated\
  \ in its temporal, environmental, and task\n\ncontext. An episode may include observations,\
  \ goals, actions, tool calls,\n\nintermediate reasoning, feedback, and outcomes,\
  \ or a compressed segment\n\nderived from these elements. Compared with more abstract\
  \ assets, episodes\n\nretain the conditions under which an experience was obtained.\
  \ They therefore\n\nsupport case-based reuse, resumption of interrupted tasks, and\
  \ retrospective\n\ninspection of the evidence behind a later belief or strategy.\
  \ Observations\n\nand higher-order reflections are stored in a memory stream, trial\
  \ outcomes\n\nand linguistic diagnoses are retained after failed attempts, and both\
  \ prior\n\ntrajectories and insights extracted from collections of experience are\n\
  \nretrieved for later reuse Park et al. [2023], Shinn et al. [2023], Zhao et al.\
  \ [2024a].\n\nStructured event records and production memory stores further retain\n\
  \ntemporally grounded episodes across sessions Lu et al. [2026], Chhikara et al.\
  \ [2025].\n\nEpisodes are particularly valuable for rare events and one-shot observations\n\
  \nfor which reliable abstraction is not yet possible. They permit highly\n\nplastic\
  \ writes because the agent need not decide immediately whether an\n\nobservation\
  \ expresses a general rule, while their high fidelity supplies\n\nevidence for later\
  \ correction.\nA22:  The same fidelity, however, produces\n\nsubstantial storage\
  \ and retrieval costs. As the collection grows,\n\ntrajectories that are superficially\
  \ similar but decisionally different\n\ncompete for retrieval, while complete traces\
  \ carry observations and actions\n\nirrelevant to the current problem. Stored experience\
  \ is most useful when its\n\nstructure matches the target task; in other settings,\
  \ long-context baselines\n\nremain competitive Wang et al. [2026d].\n[S12] Semantic\
  \ assets. (https://arxiv.org/html/2610.29357v1#S2.SS2.SSS0.Px2)\nA23: Semantic assets\
  \ preserve what is known. Their reusable units are facts,\n\nconcepts, relations,\
  \ constraints, preferences, and environment models\n\nabstracted from particular\
  \ observations. Unlike episodic assets, they suppress\n\nmuch of the temporal and\
  \ surface detail of the originating event so that\n\nknowledge can be reused across\
  \ sessions and tasks. A recurring user\n\npreference, a tool authentication requirement,\
  \ or a relation between two\n\nentities can thus be invoked without replaying the\
  \ full interaction from which\n\nit was inferred.\n\nStripping temporal and situational\
  \ detail yields compression and broader\n\nreuse, and structured semantic assets\
  \ additionally support entity-level\n\nrevision, relational inference, and multi-hop\
  \ retrieval. Dynamically indexed\n\nnotes are\n\nlinked so that new entries can\
  \ modify the contextual representation of\n\nexisting ones; current and historical\
  \ relations are maintained in temporal\n\nknowledge graphs; and structured retrieval\
  \ is framed as non-parametric\n\ncontinual\n\nlearning Xu et al. [2025], Rasmussen\
  \ et al. [2025], Gutiérrez et al. [2025].\n\nHierarchical schemas and operating-system-style\
  \ stores likewise organize\n\nreusable facts beyond a single\n\nepisode Rezazadeh\
  \ et al. [2024], Kang et al. [2025a]. These approaches\n\nindicate that semantic\
  \ memory is not a static knowledge base but a\n\n\nA24: knowledge state that must\
  \ be continually formed, connected, and revised.\n\nThe central weakness of semantic\
  \ assets arises from the same abstraction that\n\nenables transfer. Premature consolidation\
  \ may convert an accidental\n\ncorrelation into a general claim, while removing\
  \ context may discard when,\n\nwhere, and with what confidence that claim is valid.\
  \ Appending new information\n\ncan leave mutually competing facts in memory, whereas\
  \ overwriting an earlier\n\nentry can destroy historical provenance. Retrieving\
  \ updated evidence also\n\ndoes not guarantee recognition of an implicitly invalidated\
  \ belief or\n\ncorresponding adaptation in downstream behavior Chao et al. [2026].\
  \ In\n\npractice, existing semantic stores often keep the extracted claim while\n\
  \nomitting provenance, temporal scope, confidence, and links to the episodes\n\n\
  that support it.\n[S13] Procedural assets. (https://arxiv.org/html/2610.29357v1#S2.SS2.SSS0.Px3)\n\
  A25: Procedural assets preserve how to act. Their reusable units include\n\nworkflows,\
  \ strategies, plan templates, tool-use rules, and executable\n\nprograms. They may\
  \ be represented as natural-language instructions, code,\n\nparameterized workflows,\
  \ or behavioral policies internalized in model\n\nparameters. The distinction from\
  \ semantic assets is functional rather than\n\nsyntactic: semantic assets describe\
  \ a state of the world, whereas procedural\n\nassets prescribe how that state should\
  \ be changed under particular\n\nconditions. The same piece of text can therefore\
  \ be semantic if retrieved as\n\na fact and procedural if retrieved as an instruction.\n\
  \nBecause they directly constrain action generation, procedural assets provide\n\
  \nthe most immediate form of behavioral transfer. Environment-verified skills\n\n\
  are stored as composable code, parameterized workflows are induced from\n\nsuccessful\
  \ trajectories for reuse across tasks and domains, and\n\ngeneralizable strategies\
  \ are extracted from successful and failed experience\n\ninstead of retaining only\
  \ raw\n\ntrajectories Wang et al. [2024b], Wang et al. [2025c], Ouyang et al. [2026].\n\
  \nEvolving context playbooks and learned memory skills further compile\n\nrepeated\
  \ execution into reusable action\n\nknowledge Zhang et al. [2026f], Zhang et al.\
  \ [2026b], Ni et al. [2026]. Procedural\n\nassets can also be composed, allowing\
  \ previously acquired skills to become\n\n\nA26: components of more complex behavior\
  \ and reducing repeated exploration.\n\nThis compilation nevertheless locks in assumptions\
  \ from the original\n\nexperience. A workflow may remain valid only for a particular\
  \ tool\n\nversion, interface, or set of environment dynamics. Retrieving a skill\
  \ for a\n\nsuperficially similar task with different preconditions can produce negative\n\
  \ntransfer, while unverified self-reflection may turn an accidental success into\n\
  \na persistent rule. Explicit skill maintenance is not uniformly superior to\n\n\
  retaining prior context, and gains are more reliable on tasks with clear\n\nworkflows\
  \ than on open-ended ones Guan et al. [2026], Zhong et al. [2026].\n\nIn current\
  \ systems, preconditions, expected outcomes, environment\n\ndependencies, verification\
  \ status, and versioning are often left implicit.\n\nLong-lived skill libraries\
  \ therefore tend to accumulate skills rather than\n\nmerge, deprecate, or regression-test\
  \ them.\n[S14] Cross-asset consolidation. (https://arxiv.org/html/2610.29357v1#S2.SS2.SSS0.Px4)\n\
  A27: The three asset classes are not mutually exclusive storage compartments. They\n\
  \ndescribe experience at different levels of abstraction. Episodic assets\n\nretain\
  \ concrete evidence; regularities recurring across episodes may be\n\nconsolidated\
  \ into semantic assets; and repeatedly validated action\n\nregularities may be compiled\
  \ into procedural assets. This transformation\n\nimproves compression and cross-task\
  \ reuse while progressively removing details\n\nof the original context. Asset formation\
  \ therefore exposes a fundamental\n\ntrade-off: representations close to individual\
  \ episodes preserve evidence but\n\ndepend on precise matching, whereas abstract\
  \ knowledge and skills are cheaper\n\nto invoke but allow erroneous generalizations\
  \ to affect a wider range of\n\ntasks.\n\nConsolidation is rarely a clean, one-way\
  \ pipeline in existing systems.\n\nSemantic claims and procedural skills often lose\
  \ their links to supporting\n\nepisodes, and new experience cannot always qualify,\
  \ revise, or revoke what\n\nwas previously consolidated.\n\nA single record can\
  \ also contain all three components, such as a task trajectory,\n\nan environmental\
  \ fact inferred from it, and a corrective procedure learned after failure.\n\nAt\
  \ retrieval time, such a record is better classified by how it is used than by how\
  \ it is\n\nphysically stored.\n[S15] 2.3 Memory Policies: Prescribed, Deliberative,\
  \ and Learned Control (https://arxiv.org/html/2610.29357v1#S2.SS3)\nA28: As agents\
  \ operate over longer horizons, memory is no longer only a problem of\n\nstoring\
  \ more information or retrieving it more accurately. The central\n\nchallenge is\
  \ how memory should change over time, deciding what should be retained,\n\nconsolidated,\
  \ revised, or forgotten, and how these decisions should adapt to\n\nnew experience\
  \ and feedback. We refer to the mechanisms governing such\n\ndecisions as memory\
  \ policies. They determine when and how memory state\n\nevolves, and they correspond\
  \ to the how column of\n\nFigure 3.\n\nWe distinguish three control regimes. Prescribed\
  \ policies apply fixed\n\nrules, heuristics, and scoring functions. Deliberative\
  \ policies use\n\nthe LLM to decide, for each case, whether to write, retrieve,\
  \ or revise,\n\ngiven the task, memory state, and context. Learned policies update\n\
  \nmemory control from outcomes and feedback. The regimes are compositional\n\nrather\
  \ than exclusive: a system may prescribe capacity limits, deliberate\n\nover conflicts,\
  \ and learn retrieval utilities. They also align with the\n\nprescribed, deliberative,\
  \ and learned control tiers used later in the lifecycle\n\ncomparison (Section 3).\n\
  [S16] Prescribed policies. (https://arxiv.org/html/2610.29357v1#S2.SS3.SSS0.Px1)\n\
  A29: Prescribed policies treat memory management as resource allocation under\n\n\
  limited context, cache, and store capacity. Control is specified before\n\ndeployment\
  \ through rules such as FIFO, LRU, sliding windows, or fixed\n\nTop- k retrieval,\
  \ so utility is approximated by position, recency, and\n\nbudget rather than estimated\
  \ future value Xiao et al. [2024].\n\nSalience-based scoring is a richer but still\
  \ prescribed variant: recency,\n\nimportance, and relevance are combined to select\
  \ episodic\n\nrecords Park et al. [2023], Lewis et al. [2020], and entries are admitted\
  \ or\n\nforgotten according to novelty, importance, or decay\n\nthresholds Zhong\
  \ et al. [2024], Tan et al. [2025b]. Hierarchical designs go\n\nbeyond single-shot\
  \ Top- k by controlling movement across memory tiers, yet\n\nthe tools, thresholds,\
  \ and control rules remain\n\npredefined Packer et al. [2023]. Prescribed control\
  \ is efficient,\n\npredictable, and easier to inspect. Its limitation is rigidity:\
  \ what\n\ncounts as novel, important, or disposable is not subsequently revised\n\
  \naccording to task outcomes.\n[S17] Deliberative policies. (https://arxiv.org/html/2610.29357v1#S2.SS3.SSS0.Px2)\n\
  A30: Deliberative policies place the LLM inside the memory-control loop because\n\
  \nnumerical scores cannot fully capture the semantic value of an experience.\n\n\
  The model is asked, for each case, whether to store, retrieve,\n\nresolve a conflict,\
  \ or rewrite, using the current task, memory state, and\n\ncontext. Handcrafted\
  \ scoring is replaced by case-by-case judgments, while\n\nthe outer tool protocol\
  \ remains\n\nfixed Packer et al. [2023], Xu et al. [2025], Chhikara et al. [2025].\
  \ A stronger\n\ndeliberative pattern lets experience revise subsequent control in\
  \ natural\n\nlanguage: verbal post-mortems are stored to steer later attempts, and\n\
  \nsuccessful and failed traces are abstracted into reusable\n\nstrategies Shinn\
  \ et al. [2023], Ouyang et al. [2026]. Write\n\nboundaries are tightened, consistency\
  \ is verified against constraint memory,\n\nor the memory collection itself is reorganized\
  \ Liu et al. [2025a], Fan et al. [2025a], Nan et al. [2025], Kang et al. [2025c].\
  \ The resulting\n\ncontrol is flexible and interpretable, but inference-intensive\
  \ and dependent\n\non prompt following. Rewriting a strategy in language still leaves\
  \ the\n\ncontroller untrained, as most such systems lack credit assignment\n\nfrom\
  \ later task outcomes back to earlier memory decisions.\n[S18] Learned policies.\
  \ (https://arxiv.org/html/2610.29357v1#S2.SS3.SSS0.Px3)\nA31: Learned policies treat\
  \ memory control as an experience-updated decision\n\nproblem. The agent may still\
  \ use standard operations, such as write,\n\nretrieve, compress, revise, and forget,\
  \ but a trainable controller selects among\n\nthem, and those selections improve\
  \ from outcomes and feedback. Discrete\n\nmemory actions are learned from\n\nreward\
  \ Yan et al. [2025], Zhang et al. [2025b], Yu et al. [2026b], and purely\n\nsimilarity-based\
  \ retrieval is replaced with utility values that reflect\n\nhistorical contribution\
  \ to success Zhang et al. [2026g]. Reinforcement\n\nlearning provides the credit\
  \ assignment that static controllers lack, because the true value\n\nof a write\
  \ or deletion often appears only several steps\n\nlater Yao et al. [2024], Yuan\
  \ et al. [2025a], Chen et al. [2026b].\n\nTwo levels of learning should be distinguished.\
  \ In many existing systems the\n\ncontroller is optimized offline and then frozen,\
  \ so memory content continues\n\nto evolve while the operational policy remains\
  \ static. Recent RSI frameworks\n\ninstead attempt rule-level\n\nmodification, where\
  \ the language model is prompted to inspect and revise its own\n\nprompt templates\
  \ or execution\n\nscaffolding Zhang et al. [2026f], Agrawal et al. [2026], Yin et\
  \ al. [2024], Zhang et al. [2026d].\n\nRecuris further shows that a Meta-Agent can\
  \ synthesize validation-gated\n\nupdates from execution failures, recursively refining\
  \ operational rules and\n\n\nA32: the skill library Yu et al. [2026c]. Although\
  \ reflection-based prompt\n\nadaptation offers substantial semantic flexibility,\
  \ such methods typically\n\nrely on heuristic textual edits and trial-and-error\
  \ screening against a\n\nvalidation set. Under long-horizon\n\ndelayed task feedback,\
  \ they struggle to establish fine-grained temporal\n\ncredit assignment and to keep\
  \ the meta-policy stable. A more\n\nsystematic form of continual policy evolution\
  \ would update the\n\nmemory-management policy from ongoing environmental feedback\
  \ while\n\nsuppressing policy drift. The next section turns to how experience-level\n\
  \nrule evolution can be combined with structured closed-loop policy learning\n\n\
  across the lifecycle.\n[S19] 3 The Memory Lifecycle as the Engine of Continual Learning\
  \ (https://arxiv.org/html/2610.29357v1#S3)\nA33: The previous section describes\
  \ agent memory in terms of where experience\n\npersists, what reusable form it takes,\
  \ and how memory operations are\n\ncontrolled. These dimensions define the architecture\
  \ of a memory system, but\n\nthey do not explain how that system changes through\
  \ continued deployment.\n\nContinual learning is often described as adaptation through\
  \ parameter updates.\n\nFor agents, however, experience can also accumulate in external\
  \ records,\n\npersistent internal states, and other writable memory substrates.\
  \ We therefore\n\nview memory-centric continual learning (MCCL) as a coupled dynamical\
  \ process,\n\nwhere experience updates the persistent memory state while behavioral\
  \ feedback\n\ncan also adapt the policy governing future memory decisions.\n\nAt\
  \ the first level, newly acquired experience changes the memory state through\n\n\
  a transition function controlled by the current memory policy,\n\n\\mathcal{M}_{t+1}=\\\
  mathcal{T}\\left(\\mathcal{M}_{t},e_{t};\\pi_{t}^{\\mathrm{mem}}\\right),\n\n(3.1)\n\
  \nwhere \\mathcal{M}_{t} denotes the persistent memory state at time t ,\n\ne_{t}\
  \ denotes experience from the current interaction, and\n\n\\pi_{t}^{\\mathrm{mem}}\
  \ denotes the policy that controls how this experience\n\nis handled. We use e_{t}\
  \ broadly to include relevant observations, agent\n\nactions, outcomes, and feedback.\
  \ The transition function \\mathcal{T} is\n\nindependent of any particular memory\
  \ substrate.\nA34:  Depending on the system, it\n\nmay admit new experience, reorganize\
  \ accumulated memory, revise existing\n\ncontent, or reduce the future influence\
  \ of selected memories.\n\nA change in memory state is not, by itself, evidence\
  \ of continual learning.\n\nThe updated state must later be accessed and incorporated\
  \ into reasoning,\n\ndecisions, or actions under the memory policy,\n\n\\mathcal{M}_{t+1}\\\
  xrightarrow{\\text{access and utilization }(\\pi_{t+k}^{\\mathrm{mem}})}\\Delta\\\
  mathcal{B}_{t+k},\\qquad k>0,\n\nwhere \\Delta\\mathcal{B}_{t+k} denotes a downstream\
  \ behavioral effect\n\nassociated with the memory change. Information may persist\
  \ without being\n\nretrieved, may be retrieved without being used appropriately,\
  \ or may influence\n\nbehavior in a harmful way. Memory supports continual learning\
  \ only when\n\nexperience-induced changes remain usable, yield appropriate improvement\
  \ or\n\nadaptation in later behavior, and avoid unnecessary damage to still-useful\n\
  \ncapabilities Shu et al. [2026], Yu et al. [2026a].\n\nAt the second level, feedback\
  \ may change not only memory content but also the\n\npolicy that controls future\
  \ memory decisions. We write this outer update as\n\n\\pi_{t+1}^{\\mathrm{mem}}=\\\
  mathcal{U}\\left(\\pi_{t}^{\\mathrm{mem}},\\mathcal{F}_{t:t+H}\\right),\n\n(3.2)\n\
  \nwhere \\mathcal{F}_{t:t+H} summarizes downstream feedback observed over a\n\n\
  later horizon H , and \\mathcal{U} denotes the rule used to update the\n\n\nA35:\
  \ memory policy. Such feedback may include task outcomes, rewards, errors, user\n\
  \ncorrections, or other signals that reveal the consequences of earlier memory\n\
  \ndecisions. \\mathcal{U} need not change the policy in every\n\nsystem. A fixed\
  \ controller may continue to modify \\mathcal{M}_{t} while\n\n\\pi_{t}^{\\mathrm{mem}}\
  \ remains unchanged. Policy evolution refers to the\n\nstronger case in which accumulated\
  \ experience also changes how future memory\n\ndecisions are made.\n\nEquations\
  \ (3.1) and\n\n(3.2), together with behavioral utilization,\n\ndefine two coupled\
  \ processes. The inner memory-state loop governs both how\n\nthe persistent state\
  \ \\mathcal{M}_{t} evolves and how it informs decisions:\n\nhow experience enters\
  \ persistent memory (formation and writing), how\n\naccumulated experience is restructured\
  \ (organization and consolidation),\n\nhow prior memory returns to the active decision\
  \ process (retrieval and\n\nutilization), and how the stored state is maintained\
  \ as new evidence arrives\n\n(revision and forgetting). Persistent memory is not\
  \ an additional\n\noperational stage; rather, it is the central evolving state upon\
  \ which write,\n\nconsolidation, readout, and maintenance operations act. The outer\
  \ control loop\n\ndetermines how decisions within these four stages are governed\
  \ and whether\n\ndownstream feedback modifies those control rules over time.\n\n\
  \nA36: Together, the two loops describe continual learning as more than memory\n\
  \naccumulation. Experience changes memory, memory influences later behavior,\n\n\
  and behavioral consequences may in turn improve how subsequent experience is\n\n\
  managed. The goal is therefore not to maximize the amount of stored\n\ninformation\
  \ or the frequency of updates, but to support adaptation while\n\npreserving valid\
  \ evidence and useful capabilities.\n\nFigure 4 summarizes this view.\n\nFigure\
  \ 4:\n\nThe memory lifecycle as two coupled processes in memory-centric\n\ncontinual\
  \ learning. The memory-state loop governs how experience\n\nenters persistent memory,\
  \ is organized and reused, and is revised or\n\nforgotten as conditions change.\
  \ The control loop uses behavioral\n\noutcomes to influence future memory decisions.\n\
  [S20] 3.1 Formation and Selective Writing (https://arxiv.org/html/2610.29357v1#S3.SS1)\n\
  A37: Formation is the first point at which ongoing experience can acquire\n\npersistent\
  \ influence over future behavior. It determines not only which\n\nobservations should\
  \ enter long-term memory, but also how they are represented\n\nand what source,\
  \ temporal, and contextual information is preserved for later\n\nuse.\n[S21] Selective\
  \ Writing and Plasticity Control. (https://arxiv.org/html/2610.29357v1#S3.SS1.SSS0.Px1)\n\
  A38: Memory-centric continual learning begins with an admission decision, because\
  \ not\n\nevery interaction should modify persistent memory. Writing too\n\nfreely\
  \ can accumulate incidental, redundant, or erroneous observations and\n\nincrease\
  \ interference over time. Writing too conservatively can discard\n\nexperience that\
  \ would have supported later adaptation. Selective writing\n\ntherefore defines\
  \ the agent’s plasticity boundary by deciding which\n\ndeployment-time experiences\
  \ may exert persistent influence on future\n\nbehavior. Selected session-level information\
  \ can be promoted into persistent\n\nmemory, and storage operations can be exposed\
  \ as actions that are optimized\n\nfrom downstream outcomes Cognee [2026], Yu et\
  \ al. [2026b]. These examples\n\nshow that admission can range from staged promotion\
  \ to learned action\n\nselection. In either case, the cost of a poor write can persist,\
  \ as admitting\n\nunreliable experience propagates errors while rejecting useful\
  \ experience\n\nremoves evidence needed for future learning. The objective is\n\n\
  therefore not to store as much as possible, but to admit useful experience\n\nwithout\
  \ giving transient or unreliable observations unnecessary long-term\n\ninfluence.\n\
  [S22] Initial Representation. (https://arxiv.org/html/2610.29357v1#S3.SS1.SSS0.Px2)\n\
  A39: Admission also requires a choice about how experience is represented. What\
  \ is\n\nmade explicit at write time determines what can later be retrieved, compared,\n\
  \nor revised. An experience may remain as a relatively direct episodic record\n\n\
  or be encoded into a representation that makes events, entities, relations,\n\n\
  and temporal information explicit Lu et al. [2026], Rasmussen et al. [2025].\n\n\
  Structure and granularity are orthogonal choices: structure determines how\n\nexplicitly\
  \ relational and temporal attributes are indexed, whereas granularity\n\ndetermines\
  \ how much situational detail is retained versus compressed. A\n\nrepresentation\
  \ can therefore be highly structured while remaining fine-grained,\n\nwhereas overly\
  \ coarse or unstructured encodings may discard contextual details\n\nthat later\
  \ become critical. Because subsequent consolidation cannot reliably\n\nrecover evidence\
  \ that was never recorded at admission, the initial\n\nrepresentation directly bounds\
  \ the evidence available to all downstream memory\n\noperations.\n[S23] Source,\
  \ Scope, and Memory Pollution. (https://arxiv.org/html/2610.29357v1#S3.SS1.SSS0.Px3)\n\
  A40: A useful persistent memory should also retain the conditions under which it\n\
  \nwas acquired. Relevant information includes provenance, temporal validity,\n\n\
  contextual scope, and, where available, confidence Li et al. [2025], Rasmussen et\
  \ al. [2025]. These attributes do not prove that a memory is true.\n\nInstead, they\
  \ help later reasoning determine where the memory came from,\n\nwhether it still\
  \ applies, and how strongly it should be trusted. Without such\n\ninformation, a\
  \ hallucinated observation may later be reused as fact, an\n\naccidental success\
  \ may become a general strategy, or a temporary state may be\n\napplied outside\
  \ the context in which it was observed. This causes memory\n\npollution, where an\
  \ error introduced at formation continues to degrade later\n\nbehavior and may be\
  \ reinforced through repeated retrieval, revision, and\n\nconsolidation. Formation\
  \ therefore determines both which experience enters\n\npersistent memory and what\
  \ evidence is carried forward with it. The next\n\nquestion is how these formed\
  \ memories should be organized and transformed as\n\nexperience accumulates.\n[S24]\
  \ 3.2 Organization, Compression, and Consolidation (https://arxiv.org/html/2610.29357v1#S3.SS2)\n\
  A41: Organization and consolidation form the integration stage of the memory\n\n\
  lifecycle. Once experience has entered persistent memory, the system must\n\ndecide\
  \ which observations belong together, when accumulated evidence is ready\n\nfor\
  \ further transformation, and whether repeated experience should remain\n\nepisodic\
  \ or become more reusable knowledge. These decisions improve stability\n\nand reuse,\
  \ but they also introduce risks, as premature or overly aggressive\n\nconsolidation\
  \ can turn incomplete evidence into persistent generalizations.\n\nHere, consolidation\
  \ refers to the durable organization or transformation of\n\nexperience across interactions,\
  \ rather than the compression of active\n\nshort-term context alone.\n[S25] Choosing\
  \ the Unit of Experience. (https://arxiv.org/html/2610.29357v1#S3.SS2.SSS0.Px1)\n\
  A42: Consolidation first requires a decision about the unit over which experience\n\
  \nis organized. Continuous interaction arrives as a stream, yet memory systems\n\
  \nmust decide which observations should be treated as part of the same event,\n\n\
  episode, or semantic segment. This choice determines which pieces of evidence\n\n\
  can later be compared, linked, or transformed together. Recent systems use\n\ndynamically\
  \ detected events or temporally grounded episodes instead of relying\n\nonly on\
  \ fixed turns or windows Zou et al. [2026], Rasmussen et al. [2025]. Fine-grained\
  \ units\n\npreserve local detail but can split dependencies across several memories.\n\
  \nBroader units make longer-range relations easier to capture, but they may also\n\
  \ncombine observations that should remain separate. Experience boundaries\n\ntherefore\
  \ shape what later consolidation can learn from, determining which\n\nevidence is\
  \ considered jointly and which patterns can eventually be stabilized\n\nand reused.\n\
  [S26] When to Consolidate. (https://arxiv.org/html/2610.29357v1#S3.SS2.SSS0.Px2)\n\
  A43: A coherent experience unit does not automatically justify immediate\n\nconsolidation.\
  \ If transformation occurs too early, the system may generalize\n\nfrom insufficient\
  \ evidence, repeatedly rewrite unstable knowledge, or amplify\n\nan early mistake.\
  \ If it occurs too late, related experience remains fragmented\n\nand becomes harder\
  \ to reuse. Recent approaches make this timing decision\n\nexplicit in different\
  \ ways. LycheeMemory V2 waits for semantic segment\n\nboundaries before encoding\
  \ accumulated interaction into long-term memory,\n\nwhereas RecMem uses recurrence\
  \ across related observations as a signal that\n\nconsolidation is warranted Li\
  \ et al. [2026a], Dai et al. [2026]. These methods\n\ntreat consolidation timing\
  \ as an explicit memory-control decision rather than\n\na routine background process.\
  \ Their triggers, however, are still prescribed\n\nrather than learned from downstream\
  \ outcomes. This distinction separates the\n\nquestion of when evidence is ready\
  \ for consolidation from the later\n\npolicy-level question of whether the rule\
  \ that makes this decision can itself\n\nimprove from feedback.\n[S27] From Episodes\
  \ to Reusable Abstractions. (https://arxiv.org/html/2610.29357v1#S3.SS2.SSS0.Px3)\n\
  A44: Consolidation also determines the level at which past experience remains\n\n\
  available for future use. Individual episodes preserve what happened and the\n\n\
  conditions under which it happened, but continual learning often requires\n\nregularities\
  \ that can be reused beyond a single case. Collections of\n\ntrajectories can be\
  \ distilled into reusable natural-language insights or\n\nexecutable skills Zhao\
  \ et al. [2024a], Wang et al. [2024b]. Evidence from continual\n\nexperience internalization,\
  \ although obtained in a parametric setting,\n\nsimilarly suggests that principle-level\
  \ experience may remain more robust\n\nacross repeated updates than instance-specific\
  \ traces Chen et al. [2026a]. Abstraction can therefore improve\n\ntransfer, but\
  \ it should not be treated as a mandatory replacement for\n\nepisodic memory. Episodes\
  \ preserve context and supporting evidence, whereas\n\nmore abstract knowledge trades\
  \ some of that detail for broader applicability.\n\nConsolidation is thus a change\
  \ in the form and scope of knowledge, not merely\n\na reduction in storage size.\
  \ It determines when an experience should remain a\n\ncase to be recalled and when\
  \ repeated evidence is strong enough to support a\n\nmore general principle, schema,\
  \ or procedure.\n[S28] Lossy Consolidation and Evidence Preservation. (https://arxiv.org/html/2610.29357v1#S3.SS2.SSS0.Px4)\n\
  A45: The same transformation that improves reuse can also remove information that\n\
  \nlater becomes important. Repeated LLM-based rewriting has been shown to\n\ninitially\
  \ improve and then reduce memory utility, while retaining raw episodes\n\ncan remain\
  \ competitive with systems that repeatedly force consolidation Zhang et al. [2026a].\
  \ Compression can also remove the contextual\n\nconditions needed to decide whether\
  \ an abstracted memory still applies.\n\nRaMem describes this failure as context\
  \ collapse and restores information such\n\nas event time, participants, and session\
  \ scope before compressed memories are\n\nused as evidence Yang et al. [2026b].\
  \ Consolidation should therefore preserve links\n\nto supporting evidence rather\
  \ than replace that evidence by default.\n\nHigher-level abstractions should remain\
  \ traceable to the episodes from which\n\nthey were derived so that later retrieval,\
  \ verification, or revision can\n\nrecover from a poor generalization. Consolidation\
  \ can stabilize and generalize\n\nexperience, but it can also become a source of\
  \ distortion, interference, and\n\nimplicit forgetting when abstraction removes\
  \ information that remains useful.\n[S29] 3.3 Retrieval and Utilization (https://arxiv.org/html/2610.29357v1#S3.SS3)\n\
  A46: Retrieval and utilization (i.e., uptake) connect accumulated experience to\
  \ the agent’s current\n\nreasoning and actions. Their effectiveness depends on recovering\
  \ sufficient\n\nevidence, matching it to the current decision, and using it appropriately.\n\
  \nThese functions concern the use of existing memory rather than changes to\n\n\
  its persistent content.\n[S30] Reactivating Relevant Evidence. (https://arxiv.org/html/2610.29357v1#S3.SS3.SSS0.Px1)\n\
  A47: Retrieval must recover usable evidence, not simply records with similar\n\n\
  wording. A task may depend on several related events, their temporal order,\n\n\
  or the circumstances in which earlier observations were made. Selecting the\n\n\
  right memory source is therefore only part of the problem. The system must\n\nalso\
  \ recover enough supporting context to interpret what it finds. Temporal\n\ngraph\
  \ memories, reflective memory managers, and contextual-reinstatement\n\nmethods\
  \ offer different ways to select or recover such evidence Rasmussen et al. [2025],\
  \ Tan et al. [2025b], Yang et al. [2026b]. These mechanisms connect retrieval to\
  \ the\n\nrepresentation and evidence-preservation choices discussed above. A compact\n\
  \nsummary may be sufficient for one task, whereas another may require access\n\n\
  to its supporting episodes. Recovering that context helps establish the\n\nmeaning\
  \ and scope of the memory without rewriting it. The goal is not to\n\nreturn as\
  \ much history as possible, but to recover enough relevant evidence\n\nand to keep\
  \ its source and context checkable.\n[S31] Matching Memory to the Decision State.\
  \ (https://arxiv.org/html/2610.29357v1#S3.SS3.SSS0.Px2)\nA48: A memory can be relevant\
  \ to a task yet unhelpful at a particular decision\n\npoint. During planning, the\
  \ agent may need a reusable procedure or a record\n\nof earlier constraints. During\
  \ tool execution, it may instead need exact\n\nparameters or the conditions required\
  \ for an operation to succeed.\n\nVerification may call for evidence that tests\
  \ a tentative conclusion, while\n\nfailure recovery may benefit from records of\
  \ unsuccessful attempts.\n\nRetrieval should therefore consider the current subgoal,\
  \ the evidence\n\nalready available, and the uncertainty that prevents the next\
  \ decision.\n\nThis also dictates when retrieval is beneficial, since additional\
  \ memory may resolve\n\na specific information gap, repeat existing context, or\
  \ introduce distracting\n\ndetails. Relevance to the overall task is therefore\n\
  \nnot enough. The retrieved evidence should address what the agent needs to\n\n\
  decide at that moment, rather than simply resemble its current query.\n[S32] From\
  \ Access to Effective Use. (https://arxiv.org/html/2610.29357v1#S3.SS3.SSS0.Px3)\n\
  A49: Utilization (often termed uptake in retrieval workflows) concerns\n\nwhether\
  \ and how retrieved evidence actually shapes reasoning or action. A\n\nrecord appearing\
  \ in the context does not establish that the agent used it, and\n\nits use does\
  \ not guarantee behavioral improvement. Even after a relevant\n\nrecord is preserved\
  \ and retrieved, the agent may overlook it in context,\n\nmisinterpret its valid\
  \ scope, or misapply a past strategy under conditions\n\nwhere it no longer holds.\
  \ Studies of continual agents and experience reuse\n\nhighlight this gap between\
  \ retaining experience and benefiting from it\n\nlater Shu et al. [2026], Chen et\
  \ al. [2026a]. Consequently,\n\nfour sequential conditions must remain conceptually\
  \ distinct:\n\npreservation (retaining the record in storage), access\n\n(retrieving\
  \ it into the decision context), utilization (incorporating\n\nit into reasoning),\
  \ and behavioral effect (achieving a net task\n\nimprovement, formalized as the\
  \ retention cascade in\n\nSection 4). Appropriate utilization may involve applying\
  \ a\n\nmemory, restricting its use to supported conditions, or rejecting it when\n\
  \nmore reliable evidence contradicts it. When memory use reveals an error or outdated\
