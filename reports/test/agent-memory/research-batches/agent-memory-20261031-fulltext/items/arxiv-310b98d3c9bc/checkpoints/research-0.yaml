result:
  text: "{\n  \"summary\": \"论文针对智能体长期部署中“记录了经验却未必因此学会”的问题，提出记忆中心持续学习框架：把记忆按存储载体、知识形态和管理策略拆分，并用记忆状态更新与管理策略演化两个闭环描述经验如何影响后续行为。作者还提出保留、适应、迁移三类行为评测及资源缩放模型。最值得关注的是，文中既报告了外部记忆随写入增长而出现负向收益的\
    \ IdeaBench 结果，也汇集参数记忆的容量与干扰数据，说明记忆扩容本身不等同于持续进步。\",\n  \"claims\": [\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"## 记忆系统不只是在找回旧内容\\n\\n作者把问题界定为：长部署中的历史记录虽能被追踪，却常以原始文本形式塞回提示词；随着轨迹增长，相关信息会被稀释，推理延迟和注意力退化也随之增加。扩大上下文受会话容量与长序列性能约束，持续微调则要付出计算成本，并可能遗忘既有能力且难以回滚。因此，单看能否答出历史事实，不足以证明智能体从经验中学习；关键是经验能否持续改变之后的行动，并在新情况出现时修正。\"\
    ,\n      \"evidence_ids\": [\n        \"A3\",\n        \"A4\",\n        \"A5\"\
    \n      ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"\
    MCCL 用三个彼此独立的维度描述记忆架构。载体回答状态存在哪里：当前上下文、激活或 KV 等内部状态、可寻址外部存储，或部署后仍可更新的模型参数；资产回答经验以什么形式复用：保留具体情境的情景记录、抽象事实关系的语义知识，或直接规定行动方式的程序技能；策略回答何时写入、检索、合并、修订和遗忘，可由固定规则、运行时语言模型判断，或由反馈学习控制。这样分类很重要：数据库内容进入提示词仍属外部载体，而存成参数不自动意味着能正确迁移，系统效果还取决于所形成的资产和管理规则。\"\
    ,\n      \"evidence_ids\": [\n        \"A9\",\n        \"A10\",\n        \"A11\"\
    ,\n        \"A20\",\n        \"A25\",\n        \"A28\"\n      ]\n    },\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"载体之间的工程取舍并非简单的“外部更好”或“参数更强”。上下文写入快、保真度高，但受窗口限制，摘要会丢失细节；激活记忆可高带宽参与前向计算，却依赖原模型表示，难以逐条检查、编辑或跨模型迁移。外部存储支持跨会话持久保存、单条修订和版本管理，但记录可能因排序下降而无法访问，过期或冲突信息也会造成检索干扰。参数记忆能在常规前向计算中使用已内化内容，却需要优化写入，且难以定位、删除或追溯单条经验；重复更新还可能把暂时反馈固化，损伤其他能力。作者因此把混合载体视为一种分工选择，而非已经解决冲突的方案。\"\
    ,\n      \"evidence_ids\": [\n        \"A12\",\n        \"A13\",\n        \"A15\"\
    ,\n        \"A16\",\n        \"A17\",\n        \"A18\",\n        \"A19\"\n   \
    \   ]\n    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"##\
    \ 两个闭环把存储操作接到未来行动\\n\\n作者将持续学习写成两个相连的过程。内环在当前管理策略控制下，把交互经验写入持久状态，并可重组、修订或降低某些记录的影响；之后还必须在未来任务中取出并实际用于推理或行动。外环则把较晚出现的任务结果、奖励、错误或用户纠正反馈给管理策略，改变未来如何写、检索或遗忘。若系统只更新记忆内容而控制规则仍固定，这是状态适应，不是策略演化；离线训练好控制器后冻结，也不同于部署中持续调整策略。区分这些层次，避免把“有更新操作”误当成完整的自我改进。\"\
    ,\n      \"evidence_ids\": [\n        \"A33\",\n        \"A34\",\n        \"A35\"\
    ,\n        \"A36\",\n        \"A56\",\n        \"A57\"\n      ]\n    },\n    {\n\
    \      \"kind\": \"author_claim\",\n      \"text\": \"这个闭环贯穿一条有损的工程流水线。写入阶段要决定是否接纳经验、保留多细的情境，以及记录来源、有效时间、适用范围和置信信息；后续摘要无法可靠恢复最初没存下的证据。整合阶段要选择事件边界和合并时机：过早会把偶然相关性写成规则，过晚则让相关经历难以共同利用。情景记录可支持核查，重复验证的规律可逐步抽象为语义知识或程序技能，但抽象会牺牲上下文，因此作者主张保留通往原始经历的证据链。取回时也不能只按文字相似度，应结合当前子目标和具体决策缺口；找到记录、将其用于推理、最终改善行为，是不同环节。\"\
    ,\n      \"evidence_ids\": [\n        \"A38\",\n        \"A39\",\n        \"A40\"\
    ,\n        \"A42\",\n        \"A43\",\n        \"A44\",\n        \"A45\",\n  \
    \      \"A47\",\n        \"A48\",\n        \"A49\"\n      ]\n    },\n    {\n \
    \     \"kind\": \"author_claim\",\n      \"text\": \"维护同样要区分“事实不再有效”和“记录不值得继续影响行动”。新证据可能证明旧记录错误，也可能只是表明它在过去成立、如今已过期；后者应更新有效范围，而不必抹去历史证据。直接删除、按期限失效和保留但降低检索优先级，分别处理不同的容量与干扰问题。删除来源记录还不保证其摘要或程序技能中的派生影响消失。作者进一步区分记忆状态变化与策略变化：反思文本可能指导后续尝试，却不等于控制器已从结果中学会；强化学习等方法提供延迟信用分配的可能，但长期反馈难归因于早先哪次写入，策略本身也会发生稳定性—可塑性冲突。\"\
    ,\n      \"evidence_ids\": [\n        \"A51\",\n        \"A52\",\n        \"A53\"\
    ,\n        \"A54\",\n        \"A58\"\n      ]\n    },\n    {\n      \"kind\":\
    \ \"author_claim\",\n      \"text\": \"## 评测要证明行为改变，而不只是记忆可访问\\n\\n作者把证据链拆为保存、访问、利用和行为效果四道关口：记录仍在库中不代表检索得到，检索得到不代表模型正确使用，正确使用也不保证净收益。持续学习评测还应分别测量延迟与干扰下的保留、环境变化后的修订恢复，以及超出原经历的迁移。建议将有状态条件与重置条件放在匹配任务上比较，定义差值为两者得分之差，并控制模型、工具、上下文、检索和计算预算；另以完整历史、静态检索和额外推理等对照排除替代解释。静态对话问答可测长程访问，却通常不能证明评测过程中形成了新能力；跨论文分数也不宜直接排名，因为任务和预算往往不同。\"\
    ,\n      \"evidence_ids\": [\n        \"A63\",\n        \"A64\",\n        \"A65\"\
    ,\n        \"A66\",\n        \"A67\",\n        \"A69\",\n        \"A70\",\n  \
    \      \"A71\",\n        \"A73\",\n        \"A74\",\n        \"A77\"\n      ]\n\
    \    },\n    {\n      \"kind\": \"author_claim\",\n      \"text\": \"论文报告的实验和既有研究数字展示了这种评测视角的价值，但不是一项统一的端到端系统比较。在\
    \ LoCoMo 的 Raw RAG 设置中，读取预算从512增至2048个词元，在保留八分之一历史时 F1 仅提高0.89个百分点，在保留全部历史时提高3.82个百分点，两种增益之差为2.93个百分点，区间为[2.06,4.02]；这支持读取资源的收益依赖可用存储量。另一项\
    \ IdeaBench 顺序部署评测中，Mem0 在8192词元容量上、读预算1024时，有状态相对重置的均值增益从64段训练对话后的+7.10个百分点降至128段后的−10.43，最终256段时为−13.93；每16或64段做整合虽把最终占用降至约1800词元，最终增益仍为负。它说明单纯积累或压缩内容并不保证持续收益，但该设置未周期整合时的性能走势不能直接代表所有记忆系统。\"\
    ,\n      \"evidence_ids\": [\n        \"A83\",\n        \"A84\",\n        \"A85\"\
    ,\n        \"A87\",\n        \"A88\"\n      ]\n    },\n    {\n      \"kind\":\
    \ \"author_claim\",\n      \"text\": \"作者把缩放规律作为资源分析框架，而不是宣称已经得到普适常数。非参数记忆的可达性能被建模为经验量、持久容量、读取预算和写入维护计算共同约束；资源不足时先出现瓶颈，扩展实际限制项才可能推迟饱和。参数记忆则额外引入负载比：新经验写入共享参数，可能直接覆盖旧内容，因此干扰随载体和写入策略而变。所汇集的数值包括：Memory\
    \ Layers 扩容时，1.3B配置的NaturalQuestions准确率从13.68升至20.78；GradMem固定八个记忆向量、存储96组键值对时，单步写入精确匹配率为32.6%，五步写入为88.4%。但跨研究设置不一，且作者明确指出“不同容量下负载曲线是否塌缩”这一缩放预测尚未检验。\"\
    ,\n      \"evidence_ids\": [\n        \"A78\",\n        \"A79\",\n        \"A95\"\
    ,\n        \"A98\",\n        \"A101\",\n        \"A102\"\n      ]\n    }\n  ],\n\
    \  \"limitations\": [\n    \"本文主要贡献是框架、评测协议和缩放假设，同时引用多种既有系统的结果；所列实验并非对统一 MCCL\
    \ 实现的完整验证。报告数字来自不同任务、模型和比较设置，不能合并成记忆方法的通用排名或部署效果。\",\n    \"非参数缩放关系和参数记忆干扰项包含假设及理论示意；经验结构、策略和任务分布会影响结果。作者指出参数记忆的负载曲线跨容量塌缩预测仍未测试，已有研究通常也没有同时控制容量与负载。\"\
    ,\n    \"已阅读抽取全文，未独立复现实验。抽取文本无法核验图表布局和数学表达是否忠实，也可能遗漏公式、图表细节及附录内容；因此对表格或图示不完整之处不作推算。\"\
    \n  ]\n}"
