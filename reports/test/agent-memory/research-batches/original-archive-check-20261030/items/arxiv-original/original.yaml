  A48: Figs. 9, 10, 11 and 12 expand on the Minecraft examples in Section 4.4.\n\n\
  In each case, the agent finds a stored frame through its index entry.\n\nIt then\
  \ inspects the frame to answer a question that the textual record alone cannot:\n\
  \nwhat kind of animal it saw (Fig. 9),\n\nwhere a hole it dug earlier is located\
  \ (Fig. 10),\n\nwhether a place seen in an earlier life matches the current view\
  \ (Fig. 11),\n\nand why an earlier mining cut failed (Fig. 12).\n\n(a) Stored frame:\
  \ a pale animal on the hillside.\n\n(b) Magnified crop: a wolf.\n\n(c) Stored frame:\
  \ a possible pink sheep.\n\n(d) Magnified crop: a pink sheep.\n\nFigure 9: Correcting\
  \ and confirming perception with visual memory.\n\n(a–b) At step 4,588, the agent\
  \ records a pale animal on the hillside.\n\nMagnifying the stored frame shows a\
  \ wolf rather than a sheep, so the agent does not attack and looks for food elsewhere.\n\
  \n(c–d) At step 4,917, the agent is unsure whether an animal on the slope is a pink\
  \ sheep.\n\nMagnifying the stored frame confirms a sheep rather than a pig, and\
  \ the agent hunts it for food.\n\n(a) Stored frame of the hole the agent dug.\n\n\
  (b) Retrieved frame (left) beside the current view (right).\n\nFigure 10: Memory-guided\
  \ spatial relocation.\n\nThe retrieved and current views line up closely, which\
  \ lets the agent identify the hole’s rim and recover its exact location.\n\n(a)\
  \ Life 1: stored frame of a shallow iron-mine entrance.\n\n\nA49: (b) Life 2: retrieved\
  \ frame (left) beside the current view (right).\n\nFigure 11: Cross-life visual\
  \ memory retrieval.\n\nAfter dying, the agent retrieves a frame recorded in an earlier\
  \ life and compares it with its current view.\n\nIt recognizes the grass bank ahead\
  \ as the entrance to that life’s iron mine, digs in, and mines iron ore at step\
  \ 6,565.\n\n(a) Retrieved frame: the earlier cut was pitched upward.\n\n(b) Re-aimed\
  \ view facing the mining face.\n\nFigure 12: Using visual memory to recover mining\
  \ orientation.\n\nThe agent inspects the frame of an earlier cut that failed to\
  \ open a level passage.\n\nIt sees that the view was pitched upward rather than\
  \ at the mining face.\n\nIt then re-aims with look_abs and resumes mining at the\
  \ correct orientation.\n[S21] A.3 Qualitative Examples on CUABench-KiCad (https://arxiv.org/html/2610.22686v1#A1.SS3)\n\
