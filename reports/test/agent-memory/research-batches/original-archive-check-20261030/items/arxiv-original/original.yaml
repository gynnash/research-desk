material: "[S1] Multimodal Filesystem Memory for Long-Horizon Embodied Agents (https://arxiv.org/html/2610.22686v1)\n\
  A1: Chloe Su\n\nAffiliation: Harvard\n\nAffiliation: Kempner Institute\n\nJiahan\
  \ Li\n\nAffiliation: NYU\n\nZhenting Qi\n\nAffiliation: Harvard\n\nChaoran Cheng\n\
  \nAffiliation: UIUC\n\nHaoyu Chen\n\nAffiliation: Harvard\n\nSejoon Jun\n\nAffiliation:\
  \ NEU\n\nGitHub Project Page\n\nWeirui Ye\n\nAffiliation: MIT\n\nYilun Du\n\nAffiliation:\
  \ Harvard\n\nAffiliation: Kempner Institute\n[S2] Abstract (https://arxiv.org/html/2610.22686v1#abstract1)\n\
  A2: Agents operating over long horizons need an effective memory that allows them\
  \ to reuse their experience throughout long interactions. If the entire history\
  \ of an interaction is retained, it becomes difficult to find the relevant experience,\
  \ while compressing it into summaries may result in the loss of visual and spatial\
  \ details that are required later on. We present MFM, a multimodal filesystem memory\
  \ architecture that keeps complementary types of agent memory. Episodic memory stores\
  \ the observations, actions, and outcomes, and spatial memory associates experiences\
  \ with locations. Semantic and procedural memory build up general knowledge and\
  \ reusable methods of acting, and working memory holds the current plans. MFM makes\
  \ use of searchable textual records to connect these different representations to\
  \ the underlying multimodal episodes. The agents are able to find previous experiences\
  \ by means of contextual cues and to examine the original observations in order\
  \ to recover details that are missing from their textual descriptions. Through consolidation,\
  \ the agents convert experience into higher-level knowledge and procedures while\
  \ still keeping references to the original episodes. In the case of long-horizon\
  \ Minecraft and computer-use tasks, MFM leads to improved performance with three\
  \ base models.\nA3:  With GPT-6-Astra, MFM completes Mine Diamond from Scratch and\
  \ reaches 16 out of 24 milestones on the Ender Dragon task, as against 12.7 for\
  \ the best baseline. On CUABench-KiCad it attains a mean reward of 0.440, as compared\
  \ to 0.400 for the best baseline and 0.267 in the case of no persistent memory.\n\
  \n$\\star$$\\star$footnotetext: Equal contribution.\n[S3] 1 Introduction (https://arxiv.org/html/2610.22686v1#S1)\n\
  A4: Agents that are intelligent and capable of operating autonomously over long\
  \ periods in complicated, open-ended environments need to remember what they have\
  \ seen, discovered, and previously done (Park et al., 2025; Wang et al., 2026).\
  \ A large part of this kind of memory will generally be visual or spatial in character,\
  \ for instance the route by which one can get back to an object that it has seen\
  \ before. It is not clear what the appropriate form of compact memory the agent\
  \ should use to store such observations. If one stores everything directly then\
  \ it becomes difficult to find relevant experiences as the amount of history increases.\
  \ Conversely, summaries of the memory enable quicker retrieval, but may result in\
  \ important details being discarded later (Lu et al., 2026; Zou et al., 2026).\n\
  \nWe represent memory as a multimodal filesystem (MFM) which simultaneously holds\
  \ different types of memory. We organize the memory based on the distinctions between\
  \ various human memory systems (Tulving, 1972; Squire, 2004). In the MFM, episodic\
  \ memory preserves past observations and interactions, spatial memory connects experiences\
  \ to locations in the environment, semantic memory records facts and relationships,\
  \ procedural memory contains reusable methods of acting, and working memory holds\
  \ the current plan and the immediate subgoals.\nA5:  The five memory functions are\
  \ realised using three common storage elements: episodic records, an associative\
  \ index, and agent-written memory. These elements are arranged as folders and files\
  \ in a shared filesystem, with references that link knowledge, procedures, and plans\
  \ to their supporting episodes.\n\nPrevious work that has used a filesystem to store\
  \ agent memory has shown the effectiveness of searchable textual records of interaction\
  \ (Fox et al., 2026). With embodied agents, textual descriptions can fail to include\
  \ important visual or spatial information. VISTA (Han et al., 2026) keeps visual\
  \ observations and allows frames to be revisited using a turn or frame identifier,\
  \ thus holding on to information that goes beyond its textual summaries. Yet it\
  \ can be difficult to find the relevant experience, particularly as the memory increases.\
  \ MFM offers an explicit structuring of the memory in the form of a filesystem,\
  \ which enables quick retrieval of context and the aggregation of skills and knowledge.\n\
  \nFigure 1: MFM’s Memory Evolution in Minecraft. Over 36,000 steps, MFM continuously\
  \ updates its memory and retrieves from it to support decision-making.\n\nAs shown\
  \ in Fig. 2, associative indexing links these representations via searchable cues\
  \ to the stored evidence.\nA6:  Text acts as an addressing layer for multimodal\
  \ records: the agent begins by searching the descriptions of events, actions, and\
  \ locations and then looks up the references in order to examine the corresponding\
  \ observations. For instance, it can find a previous visit to a cave by means of\
  \ its coordinates or by referring to an action that was attempted, check the recorded\
  \ view, and then compare it with the current observation. The cues employed to locate\
  \ an episode need not include a description of all the details of the episode. This\
  \ enables us to navigate a long history of past episodes using compact records and\
  \ at the same time retain detailed visual information which may only become relevant\
  \ later.\n\nWith increasing experience, MFM employs self-evolving consolidation\
  \ in order to update its knowledge, skills, and current working plans. Specific\
  \ observations can lead to the establishment of new facts or relationships, useful\
  \ action sequences can be turned into reusable procedures, and new information discovered\
  \ can cause the agent to alter its present plan. These updates link episodic experience\
  \ to semantic, procedural, and working memory. For instance, the agent might connect\
  \ a resource with a cave that has just been explored, record a reliable procedure\
  \ for getting to it, and change its route if a subsequent observation indicates\
  \ that the entrance is blocked.\nA7:  Since the memories written by the agent include\
  \ references to the episodes that support them, the agent can go back and look at\
  \ the original evidence whenever its interpretation becomes uncertain or is contradicted.\
  \ The evolution of the memory is illustrated in Fig. 1.\n\nOur work consists of\
  \ three parts. Firstly, we propose a method for organising a multimodal agent’s\
  \ memory within a single filesystem, covering episodic, spatial, semantic, procedural,\
  \ and working memory. Secondly, we implement this organisation in MFM, which combines\
  \ cue-based retrieval and visual inspection with consolidation into revisable knowledge\
  \ and reusable procedures. Thirdly, we demonstrate through long-horizon Minecraft\
  \ and computer-use tasks that MFM surpasses both memory-free and memory-augmented\
  \ baseline methods when using three base models, and that it is able to reuse its\
  \ memory across different tasks. Using GPT-6-Astra, our system manages to complete\
  \ the MCU Mine Diamond from Scratch task in all instances and achieves 16 out of\
  \ 24 milestones on Ender Dragon, whereas the best baseline achieves an average of\
  \ 12.7. On CUABench-KiCad, its mean reward is 0.440, compared to 0.400 for the best\
  \ baseline and 0.267 for an agent lacking persistent memory.\n[S4] 2 Related Work\
  \ (https://arxiv.org/html/2610.22686v1#S2)\nA8: Table 1: MFM versus prior agent\
  \ memory systems across key memory properties.\n\nMethod\n\nRaw multimodal\n\nevidence\n\
  \nIndex with\n\nevidence pointers\n\nSpatial\n\nmemory\n\nAgent-writable\n\nmemory\n\
  \nKnowledge\n\nlinked to evidence\n\nRetrieval\n\nVoyager (Wang et al., 2024)\n\n\
  ✗\n\n✗\n\n✗\n\n✓a\n\n✗\n\nEmbedding similarity\n\nJARVIS-1 (Wang et al., 2025)\n\
  \n✓b\n\n✗\n\n✗\n\n✓b\n\n✗\n\nMultimodal similarity\n\nMrSteve (Park et al., 2025)\n\
  \n✓\n\n✗\n\n✓\n\n✗\n\n✗\n\nPlace/event lookup\n\nPRO-LONG (Fox et al., 2026)\n\n\
  ✗c\n\n✗\n\n✗\n\n✓d\n\n✗d\n\nRegex / code over log\n\nVISTA (Han et al., 2026)\n\n\
  ✓\n\n✗e\n\n✗\n\n✓e\n\n✗\n\nInspect by frame ID\n\nMFM (ours)\n\n✓\n\n✓\n\n✓\n\n\
  ✓\n\n✓\n\nCue query + evidence inspection\n\naSkill library (code) only. bSuccessful\
  \ trajectories only. cText log only. dOptional notes, not linked to log entries.\
  \ eFrame IDs without a searchable index; free-form notes.\n\nFilesystem and Multimodal\
  \ Memory.\n\nApproaches that use a filesystem allow agents to search through and\
  \ modify persistent records. PRO-LONG has demonstrated that searchable textual interaction\
  \ logs can support long-horizon reasoning (Fox et al., 2026), and in other cases\
  \ filesystems are used as organizational structures for agent memory (Zhou et al.,\
  \ 2026a). Multimodal memory systems are designed to organize long sequences of visual\
  \ data in order to enable question answering and reasoning (Fan et al., 2024; Liu\
  \ et al., 2026a; Long et al., 2026).\nA9:  Other research looks into task-conditioned\
  \ retention (Zou et al., 2026), retrieval reliability in the face of temporal decay\
  \ and conflicting evidence (Lu et al., 2026), query-aware relational organization\
  \ (Li et al., 2026), and analytic operations performed on accumulated observations\
  \ (Tian et al., 2026). Table 1 summarizes the differences between MFM and related\
  \ systems.\n\nMemory for interactive agents with a long horizon.\n\nThe ability\
  \ to carry out long-horizon interactions demands a type of memory that enables continuous\
  \ perception, exploration, and planning. The latest ARC-AGI-3 systems integrate\
  \ foundation models with interaction harnesses and external memory (ARC Prize Foundation,\
  \ 2026; Fox et al., 2026; Zeng et al., 2026; Rodionov, 2026), and VISTA keeps records\
  \ of visual information that agents can go back to and compare (Han et al., 2026).\
  \ In the field of robotics, efforts are directed towards multi-scale memory, the\
  \ learning of history compression, and the development of benchmarks for memory-dependent\
  \ policies (Torne et al., 2026; Wang et al., 2026; Dai et al., 2026). Spatial memory\
  \ also helps with navigation and reasoning (Ge et al., 2026; Zhang et al., 2026).\n\
  A10:  In Minecraft, Voyager creates a collection of executable skills (Wang et al.,\
  \ 2024), JARVIS-1 retrieves successful plans from its multimodal memory (Wang et\
  \ al., 2025), and later agents introduce hybrid multimodal memory (Li et al., 2024),\
  \ what-where-when representations (Park et al., 2025), and accumulated knowledge\
  \ as a means of self-improvement (Xie et al., 2026). New benchmarks have recently\
  \ emphasised exploration and long-horizon competence (Zheng et al., 2025; Ju et\
  \ al., 2026; Zhou et al., 2026b). Although PRO-LONG indexes only text and VISTA\
  \ revisits frames without having a searchable index, MFM provides a general-purpose\
  \ multimodal episodic filesystem.\n[S5] 3 Multimodal Filesystem Memory (https://arxiv.org/html/2610.22686v1#S3)\n\
  A11: We present MFM, a multimodal filesystem memory architecture designed for long-horizon\
  \ agents. This architecture incorporates three complementary elements: episodic\
  \ records which store the multimodal experience, a searchable index that enables\
  \ textual access to these records, and agent-written memory which structures plans,\
  \ findings, environmental knowledge, and reusable procedures. Fig. 2 shows the structure\
  \ of this approach, while Fig. 3 illustrates an example from Minecraft, covering\
  \ the processes of episodic recording and indexing as well as retrieval and consolidation.\
  \ Section 3.2 explains the various memory components and the way in which searchable\
  \ records are linked to the multimodal evidence, Section 3.3 describes how the agent\
  \ finds and examines relevant episodes, and Section 3.4 outlines how the accumulated\
  \ experience is consolidated into reusable knowledge without losing the original\
  \ evidence. Algorithm 1 gives a summary of the entire loop.\n\nFigure 2: Overview\
  \ of MFM. Five forms of memory in one filesystem. Harness-written episodic memory\
  \ records observations, states, actions, and outcomes every step, with searchable\
  \ cues for locating them; spatial\n\nmemory ties experiences to locations. Agent-written\
  \ semantic, procedural, and working memory hold facts, reusable procedures, and\
  \ the current plan, each citing its supporting episodes. The agent retrieves by\n\
  \n\nA12: searching cues and inspecting original evidence (Sec. 3.3), and consolidates\
  \ experience into knowledge, procedures, and plans without modifying episodic records\
  \ (Sec. 3.4).\n[S6] 3.1 Problem Setup (https://arxiv.org/html/2610.22686v1#S3.SS1)\n\
  A13: An agent interacts with an environment over a long horizon to achieve a task\
  \ objective g . At step t , it receives an observation o_{t}=(v_{t},x_{t}) , where\
  \ v_{t} is a visual observation and x_{t} contains textual or structured information,\
  \ and selects an action a_{t} . Its interaction history is H_{t}=(o_{1},a_{1},\\\
  ldots,a_{t-1},o_{t}) . As this history grows beyond the model’s context budget,\
  \ the agent must retain information outside its active context and retrieve it when\
  \ needed. We represent this external memory as M_{t}=(E_{t},I_{t},C_{t}) , where\
  \ E_{t}=(e_{1},\\ldots,e_{N_{t}}) stores the N_{t} completed episodes retained at\
  \ step t , I_{t} provides an index for locating these episodes, and C_{t} contains\
  \ agent-written knowledge.\n\nBelow, we discuss how these components support complementary\
  \ forms of memory.\n[S7] 3.2 Memory Representation (https://arxiv.org/html/2610.22686v1#S3.SS2)\n\
  A14: As shown in Figure 2, MFM divides memory into three parts: episodic records\
  \ of multimodal experience, a searchable index, and agent-written memory. This approach\
  \ is based on the difference between episodic memory, which relates to specific\
  \ experiences, and semantic and procedural memory, which concern knowledge and ways\
  \ of acting (Tulving, 1972; Squire, 2004). The episodic store E_{t} holds the observations,\
  \ states, and actions, while the index I_{t} gives cues for finding these records.\
  \ The agent-written memory C_{t} links discoveries from different episodes and keeps\
  \ environmental knowledge, reusable procedures, and working plans. The following\
  \ section explains each of these in turn.\n\nEpisodic memory.\n\nTo revisit a past\
  \ experience, the agent needs access to what it observed, what it attempted, and\
  \ what happened. We retain episodes as multimodal records,\n\ne_{i}=\\bigl(\\mathrm{id}_{i},\\\
  tau_{i},\\mathcal{V}_{i},\\mathcal{S}_{i},\\mathcal{A}_{i},m_{i}\\bigr),\n\nwhere\
  \ \\mathrm{id}_{i} is the episode identifier, \\tau_{i}=[b_{i},d_{i}] is the episode’s\
  \ timestep interval, \\mathcal{V}_{i} contains recorded visual observations, \\\
  mathcal{S}_{i} contains associated structured states, \\mathcal{A}_{i} records actions,\
  \ and m_{i} contains metadata such as plan progress and task milestones. Episode\
  \ identifiers and timestep metadata link these records to the corresponding agent\
  \ interactions.\nA15:  Images retain perceptual details that may be absent from\
  \ a textual description, while states, actions, and outcomes allow the agent to\
  \ reconstruct the circumstances of an event. Preserving these records allows the\
  \ agent to inspect details whose relevance becomes apparent only later. Fig. 3(a)\
  \ illustrates the contents of an episode.\n\nAssociative indexing.\n\nEpisodic memory\
  \ is useful only if the agent can retrieve relevant experiences when needed. MFM\
  \ associates each episode with cues describing what happened, where it occurred,\
  \ and when it took place. This use of cues to access detailed records is motivated\
  \ by indexing accounts of episodic memory (Teyler and Rudy, 2007). We represent\
  \ the index as\n\nI_{t}=(z_{1},\\ldots,z_{N_{t}}),\\qquad z_{i}=(\\mathrm{id}_{i},k_{i},\\\
  rho_{i}),\n\nwhere k_{i} contains searchable cues and \\rho_{i} contains references\
  \ to the stored evidence. The cues include temporal and available location metadata,\
  \ action type, retrieval tags, and a short action–outcome description. The harness\
  \ maintains one entry per completed episode in index.jsonl.\n\nThe index serves\
  \ as an addressing layer: cues narrow the search to relevant episodes, while references\
  \ provide access to their underlying observations. For example, the agent can locate\
  \ an encounter near a cave through its recorded location, an object tag, or an attempted\
  \ action, then inspect the corresponding image.\nA16:  This allows the agent to\
  \ retrieve an experience through its context without first recalling its precise\
  \ visual content. Details absent from the index remain available for inspection\
  \ in the stored observations. Fig. 3(b) illustrates this separation between cues\
  \ and evidence, and Algorithm 2 summarizes episode storage and indexing.\n\nSpatial\
  \ memory.\n\nFor embodied interaction, location provides a common frame for connecting\
  \ experiences collected at different times. MFM supports this function through spatial\
  \ information distributed across its episodic store, index, and agent-written memory.\
  \ Our memory filesystem maintains an append-only grid of traversed cells in a world\
  \ frame in grid.jsonl. Episode coordinates support retrieval by spatial proximity\
  \ or vertical position, while stored egocentric views let the agent verify a retrieved\
  \ location by its appearance (Fig. 1(a,d)). The agent further records landmark knowledge\
  \ in notes.md, such as the entrance to a mine that has become blocked, together\
  \ with coordinates and references to supporting episodes. These representations\
  \ draw on complementary ideas from cognitive maps (Tolman, 1948), memory for events\
  \ and their locations (Clayton and Dickinson, 1998), and visual place recognition\
  \ (Cartwright and Collett, 1983).\n\nSemantic and procedural memory.\nA17:  The\
  \ agent must also accumulate knowledge that is still useful after a specific episode\
  \ has ended. This knowledge is stored in the agent-created collection C_{t} , which\
  \ provides support for both semantic and procedural memory as well as the working\
  \ memory mentioned below. Semantic memory involves recording facts and the relationships\
  \ between them across different experiences. For instance, a note can link a resource\
  \ to a cave, connect the cave to its coordinates, or relate an attempted action\
  \ to the result of that action. These associations are given in plain text and include\
  \ episode identifiers or file paths, enabling the agent to refer back to the relevant\
  \ evidence. Useful discoveries and local knowledge are stored in notes.md, while\
  \ more general environmental patterns and operating instructions are kept in GUIDE.md.\n\
  \nProcedural memory consists of methods that can be reused. In the procedures/ directory\
  \ there are textual or executable sequences of actions which the agent is able to\
  \ reuse and modify during later interactions. Experience is converted into these\
  \ kinds of knowledge and skill through periodic consolidation (Kumaran et al., 2016).\
  \ The agent can add to, correct or reorganize these procedures as new evidence becomes\
  \ available, the underlying episodic records staying unaltered.\n\nWorking memory.\n\
  \n\nA18: To continue an ongoing task across context changes, MFM maintains the agent’s\
  \ current plan and immediate subgoals in working.md (part of C_{t} ). This file\
  \ records the current plan, unresolved questions, and information needed to resume\
  \ after a context reset. It connects the agent’s accumulated experience and knowledge\
  \ to the decisions required by its present objective.\n\nFigure 3: Memory contents\
  \ and operations in MFM. A Minecraft trajectory shows how each form of memory is\
  \ populated and used. (a) An episode: observation, state, action, and outcome stored\
  \ as persistent files. (b) Its index entry: searchable cues, including spatial coordinates,\
  \ with references to the records. (c) Retrieval: the agent locates episodes by step\
  \ and inspects the referenced frame. (d) Consolidation: the evidence updates semantic\
  \ (GUIDE.md) and working memory while earlier entries and episode references are\
  \ preserved. Bottom: where each form of memory lives at this step.\n[S8] 3.3 Memory\
  \ Retrieval (https://arxiv.org/html/2610.22686v1#S3.SS3)\nA19: Retrieving an experience\
  \ requires both locating a relevant episode and determining what its observations\
  \ reveal about the current task. MFM separates this into two stages. The agent first\
  \ searches for episodes through textual or structured cues, then inspects selected\
  \ multimodal evidence. As the cues determine where to look without requiring the\
  \ agent to describe every detail, the agent can ask new questions of past observations,\
  \ including ones whose relevance was not apparent when the experience was recorded.\
  \ Fig. 3(c) illustrates this process, and Algorithm 3 summarizes the retrieval procedure.\n\
  \nAgent-initiated search.\n\nGiven its current information need, the agent constructs\
  \ a query q_{t} over the episode index I_{t} and receives matching entries R_{t}\
  \ . A query specifies conditions on recorded context, such as a time interval or\
  \ location. For example, an agent investigating a failed action can locate episodes\
  \ around the time it occurred. Search then identifies episodes that match the requested\
  \ context, while the agent judges which are useful for its current decision. Each\
  \ result provides the episode identifier, contextual cues, an action–outcome summary,\
  \ and references to the evidence. Matches are returned in chronological order, with\
  \ an optional limit that retains only the most recent matches.\n\nVisual inspection.\n\
  \n\nA20: If you find a particular episode, you gain access to information that goes\
  \ beyond the description in its index. The agent then chooses the references \\\
  mathcal{P}_{t}\\subseteq\\bigcup_{z_{i}\\in R_{t}}\\rho_{i} from the results and\
  \ loads the relevant evidence into the context, D_{t}=\\{\\operatorname{Load}(p)\\\
  mid p\\in\\mathcal{P}_{t}\\} , where \\operatorname{Load} converts a reference into\
  \ its stored frame, state, or other record. This approach of selectively loading\
  \ evidence enables the agent to look at the evidence it needs without including\
  \ the entire interaction history in the context. With respect to visual evidence,\
  \ the agent may examine an original frame, compare a number of frames on a contact\
  \ sheet, place a previous observation alongside the current view, or zoom in on\
  \ a region of interest. These operations help answer different questions regarding\
  \ the same experience, for example identifying an object, recognising a location,\
  \ or understanding the outcome of an action. Since the observations are available\
  \ independently of the textual clues, the agent is able to look at details that\
  \ are missing from k_{i} and reconsider a previous interpretation. When an inspection\
  \ involves a question, the agent keeps both the question and the result so that\
  \ the reason for the lookup is not lost.\n[S9] 3.4 Self-Evolving Consolidation (https://arxiv.org/html/2610.22686v1#S3.SS4)\n\
  A21: Episodic memory preserves past experiences, while semantic and procedural memory\
  \ capture knowledge and skills for future scenarios. MFM connects these forms of\
  \ memory through consolidation, drawing on how complementary memory systems support\
  \ learning from experience (Kumaran et al., 2016). During consolidation, the agent\
  \ examines accumulated evidence and updates its understanding of the environment,\
  \ reusable procedures, and its current plan. These updates change the agent-written\
  \ memory C_{t} while preserving the recorded history (E_{t},I_{t}) . Algorithm 4\
  \ summarizes this procedure.\n\nFrom experience to knowledge and skills.\n\nConsolidation\
  \ allows findings from individual episodes to inform subsequent behavior. The agent\
  \ can record a useful observation as local knowledge in notes.md, or update GUIDE.md\
  \ when experience supports a broader regularity. For example, an encounter may establish\
  \ where a resource was found, while repeated encounters may suggest conditions under\
  \ which an action succeeds or fails. The agent can also qualify earlier guidance\
  \ when new observations reveal limits to its applicability.\n\nProcedural updates\
  \ record effective methods of acting; the agent is able to convert a sequence of\
  \ actions into a textual or executable procedure and then modify it as a result\
  \ of the changes revealed by later attempts.\nA22:  Working-memory updates link\
  \ the knowledge that has been accumulated to the current task by having the agent\
  \ revise the file working.md to show the completed subgoals, any changes to the\
  \ plan, and the questions that remain unanswered. The agent decides which of these\
  \ updates to make on the basis of the evidence available and the role of each memory,\
  \ and the resulting documents and procedures stay accessible during future interactions.\n\
  \nRevision with preserved episodic evidence. Knowledge gained from experience can\
  \ become out of date or incorrect. By linking the knowledge that agents write to\
  \ the episodic observations that support it, agents are able to go back and look\
  \ at the basis of their earlier beliefs. For instance, after having noticed a sheep\
  \ on a hillside the agent then decides to go back for food, enlarges the original\
  \ frame, and discovers that the animal was in fact a wolf; it then corrects the\
  \ note and alters its plan while still keeping the reference to the episode. If\
  \ the agent had kept only the textual description it would have lost the visual\
  \ details required to correct that interpretation. Therefore, by preserving the\
  \ episodic evidence the agent can reevaluate its earlier conclusions as its understanding\
  \ develops.\nA23:  Figure 3(d) shows that the agent updates its GUIDE to indicate\
  \ that the death message names a Piglin and that the previous identification as\
  \ a brute has not been confirmed.\n[S10] 4 Experiment Results (https://arxiv.org/html/2610.22686v1#S4)\n\
