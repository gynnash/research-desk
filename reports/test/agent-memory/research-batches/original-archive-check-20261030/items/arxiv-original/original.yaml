  - id: S12
    title: 4.2 Performance on Long-Horizon Tasks
    text: 'MCU-AgentBeats. Table 3 shows completion counts. MFM + GPT-6-Astra finishes
      all 10 Diamond milestones (vs. 6.3 for direct evaluation, 9.3 for PRO-LONG,
      and 9.7 for VISTA). On the harder Dragon task, MFM achieves 16/24 milestones,
      outperforming direct evaluation (6.3), PRO-LONG (11.0), and VISTA (12.7). We
      observe that every baseline plateaus, making no further progress after at most
      13 milestones. MFM consistently improves performance across all base models.


      CUABench-KiCad. Table 3 indicates that MFM’s benefits extend to computer-use
      tasks, yielding mean rewards of 0.413 (GPT-5.6-Sol), 0.389 (Opus 5), and 0.440
      (GPT-6): improving over direct evaluation baselines by 0.149–0.173 and outperforming
      memory baselines across models. Without cross-task memory, MFM’s reward drops
      by 0.013 – 0.027 across models.


      Temporal reach and interaction efficiency. Fig. 6 reveals that MFM accesses
      much earlier history than VISTA (which favors recent experience) or PRO-LONG,
      demonstrating the effectiveness of MFM’s addressing layer. Furthermore, Fig.
      8 shows that MFM and PRO-LONG execute more actions per turn than VISTA, with
      fewer total model queries and reducing execution overhead.


