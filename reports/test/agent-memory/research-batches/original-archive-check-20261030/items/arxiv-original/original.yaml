  \ and not under) else 0,\n\n\"sneak\": 1 if edge else 0}, \"repeat\": 1})\n\n“‘\n\
  [S25] Appendix D Harness and Implementation Details (https://arxiv.org/html/2610.22686v1#A4)\n\
  A70: This appendix covers five things:\n\nthe episode index (Section D.1),\n\nthe\
  \ spatial grid (Section D.2),\n\nthe configuration of each method and the action\
  \ interface shared by all methods (Section D.3),\n\nand storage and cost statistics\
  \ (Section D.4).\n[S26] D.1 Episode Index (https://arxiv.org/html/2610.22686v1#A4.SS1)\n\
  A71: The harness appends one row to index.jsonl for each completed episode (Section\
  \ D.1).\n\nEach row contains:\n\n•\n\nthe episode identifier and the path to the\
  \ episode’s directory;\n\n•\n\nthe first and last environment steps of the episode;\n\
  \n•\n\nthe kind of action executed;\n\n•\n\na one-line summary;\n\n•\n\na list of\
  \ tags;\n\n•\n\nthe agent’s position (x,y,z) .\n\nThe summary records the procedure\
  \ call with its arguments, followed by its outcome: how long it ran, how far the\
  \ agent moved, how the inventory changed, and any milestone reached.\n\nTags flag\
  \ notable events such as a milestone, an inventory change, or a failure to move\
  \ (stuck).\n\nThe harness computes all of these fields from the structured game\
  \ state; the model does not write them.\n[S27] D.2 Spatial Grid (https://arxiv.org/html/2610.22686v1#A4.SS2)\n\
  A72: The harness also maintains grid.jsonl, an append-only record of the world cells\
  \ the agent has interacted with.\n\nEach row gives a cell’s integer coordinates,\
  \ the step at which it was recorded, and one of five kinds:\n\n•\n\nwalked: the\
  \ agent stood in the cell;\n\n•\n\nplaced: the agent placed an item in the cell;\n\
  \n•\n\nopened: the agent opened the screen of a block in the cell;\n\n•\n\nblocked:\
  \ the agent could not move into the cell;\n\n•\n\nhazard: the agent took damage\
  \ in the cell.\n\nRows of kind placed and opened also record the item and the agent’s\
  \ pose at that moment.\n\nRows of kind hazard record the amount and type of damage.\n\
  \nBelow we give one example of each kind.\n[S28] D.3 Method Configurations (https://arxiv.org/html/2610.22686v1#A4.SS3)\n\
  A73: Table 6 lists the configuration of each method on Minecraft. All methods receive\
  \ the same 12 KB standing brief in prompt. All methods act through the same 28 atomic\
  \ procedures (Table 7).\n\nThe atoms are closed-loop: they read the structured game\
  \ state at every step.\n\nNo method has access to task-specific macros such as tree\
  \ harvesting, strip mining, or portal building.\n\nWe reimplemented PRO-LONG and\
  \ VISTA in our harness without changing their core algorithms.\n\nPRO-LONG keeps\
  \ its programmatic text logs, and VISTA keeps its archive of visual observations\
  \ and its inspect interface.\n\nMatched inspection, different addressing. VISTA\
  \ and MFM have equivalent visual inspection capabilities: both store every observation\
  \ losslessly with its step identity, and both let the agent reopen earlier frames,\
  \ crop and enlarge regions, and compare several past or current views in one context.\
  \ The methods differ only in how the agent locates evidence and what it does with\
  \ it. VISTA addresses frames by turn and frame identifier; MFM additionally provides\
  \ a harness-written index of cues (time, position, action type, tags, outcome summary)\
  \ that the agent can query, and agent-written memory that cites the supporting episodes.\
  \ Our comparison with VISTA therefore isolates the contribution of the addressing\
  \ layer and consolidation, not of the inspection tools.\n\nWhy only MFM writes executable\
  \ procedures.\nA74:  Neither baseline provides a persistent place for agent-written\
  \ procedures: PRO-LONG’s durable memory is a single harness-owned log, and VISTA’s\
  \ writable memory is limited to two notes files. Turning an action sequence into\
  \ a procedure also requires checking whether that sequence has succeeded before.\
  \ MFM’s associative index makes this check direct: the agent can query past episodes\
  \ by action type and outcome tags, then inspect the linked frames to confirm the\
  \ result. VISTA addresses frames only by turn identifier, and PRO-LONG’s text log,\
  \ while searchable, has no structured action or outcome fields and no links to visual\
  \ evidence, so the same check requires scanning and reconstructing past attempts.\
  \ Without these supports, the baselines kept their procedural knowledge as prose\
  \ notes rather than callable procedures.\n\nTable 6: Configuration of each method\
  \ on Minecraft tasks.\n\nAll methods share the action and procedure reference, the\
  \ knowledge sections, the ground-truth rules, and the per-turn state block; Direct\
  \ Evaluation omits the block’s [RECENT] and [MAP] fields.\n\nAll methods with memory\
  \ can write files and execute stored procedures through the same interface.\n\n\
