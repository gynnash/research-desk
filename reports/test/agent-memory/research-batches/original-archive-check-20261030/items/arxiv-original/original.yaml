      """aim_speckles: turn the crosshair onto the (x, y) pixel a ’mining stopped:
      …-ore-like speckles’ [NOTE] names, then mine that block and sweep its drop."""


      # Why it exists: the life that found the diamond did exactly this within 20
      steps of the


      # watcher’s [NOTE] – aim at the speckles, mine the block under the crosshair,
      walk to the


      # drop. Lives that answered a sighting with "finish the column first" or "craft
      a sword


      # first" never mined the ore at all: by the next turn the view had moved and
      the speckles


      # were gone. So: a sighting [NOTE] outranks everything; call this from its (x,
      y) BEFORE any


      # other look or step, while the view is still the flag-time view (the runner
      dropped the


      # rest of the plan for exactly that).


      # The frame the watcher reads is 640x360 with a 70-degree vertical field of
      view: the focal


      # length is 180 / tan(35 deg) = 257 px, so an offset of d pixels from the centre
      (320, 180) is


      # atan(d / 257) degrees – 104 px right is 22 degrees of yaw, not the 17 a linear
      scale gives.


      # Two 30-step holds: ore takes longer than stone, and the hold is cut the moment
      the block


      # breaks anyway. collect_drops then sweeps the drop; the milestone is the PICKUP,
      not the break.


      import json, math, sys


      PARAMS = {"x": "screen x from the [NOTE] (0-640)", "y": "screen y from the [NOTE]
      (0-360)",


      "pick": "hotbar slot 1-9 with the pickaxe (default: the best in the hotbar)"}


      args = json.loads(sys.argv[sys.argv.index("–args") + 1]) if "–args" in sys.argv
      else {}


      s = json.load(sys.stdin)


      if s.get("gui_open"):


      raise SystemExit("a screen is open: close_inventory first")


      if "x" not in args or "y" not in args:


      raise SystemExit("pass x and y: the pixel the sighting [NOTE] names, e.g. (424,
      145)")


      x, y = float(args["x"]), float(args["y"])


      if not (0 <= x <= 640 and 0 <= y <= 360):


      raise SystemExit("x must be 0-640 and y 0-360 (the [NOTE]’s frame)")


      rank = {"diamond_pickaxe": 0, "iron_pickaxe": 1, "stone_pickaxe": 2, "wooden_pickaxe":
      3}


      picks = [h for h in s["hotbar"] if h.get("item") in rank]


      if args.get("pick") is not None:


      picks = [h for h in picks if int(h["slot"]) + 1 == int(args["pick"])]


      if not picks:


      raise SystemExit("no pickaxe in the hotbar (diamond ore needs IRON or better
      to drop a diamond)")


      pick = min(picks, key=lambda h: rank[h["item"]])


      F = 180.0 / math.tan(math.radians(35.0)) # 257 px


      dpitch = round(math.degrees(math.atan((y - 180.0) / F)), 1) # + is down, like
      the screen


      dyaw = round(math.degrees(math.atan((x - 320.0) / F)), 1) # + is right, like
      the screen


      plan = [{"procedure": "equip_hotbar", "args": {"slot": int(pick["slot"]) + 1}},


      {"action": {"camera": [dpitch, dyaw]}, "repeat": 1},


      {"action": {"attack": 1}, "repeat": 30},


      {"action": {"attack": 1}, "repeat": 30},


      {"procedure": "collect_drops", "args": {"steps": 48}}]


      print(json.dumps({"actions": plan}))


