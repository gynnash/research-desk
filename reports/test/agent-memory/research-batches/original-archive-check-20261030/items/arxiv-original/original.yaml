  400 steps\n\n400 steps\n\nImages per call\n\ncurrent frame\n\ncurrent frame\n\n\
  current frame + inspected frames\n\ncurrent frame + inspected frames\n\nTable 7:\
  \ The 28 atomic procedures shared by all methods (procedures.ATOMS).\n\nThey include\
  \ closed-loop movement and aiming primitives, GUI cursor control, one-call crafting,\
  \ and placement.\n\nAtom\n\nDescription\n\nAiming and walking\n\nlook\n\nTurn the\
  \ camera by a relative (pitch, yaw) in degrees, in safe increments.\n\nlook_at\n\
  \nAim the crosshair at a world coordinate, using the exact position from [STATE].\n\
  \nlook_abs\n\nSteer the camera to an absolute pitch and yaw, closed-loop against\
  \ [STATE] at every step; works from any starting pose.\n\ngo_to\n\nWalk to a world\
  \ coordinate (x,z) , re-aiming against [STATE] at every step until within reach.\n\
  \nwatch\n\nWait up to n steps, stopping as soon as a condition read from the game\
  \ state holds: none (plain wait), inventory (any count changes), gui (a screen opens),\
