      Table 7: The 28 atomic procedures shared by all methods (procedures.ATOMS).


      They include closed-loop movement and aiming primitives, GUI cursor control,
      one-call crafting, and placement.


      Atom


      Description


      Aiming and walking


      look


      Turn the camera by a relative (pitch, yaw) in degrees, in safe increments.


      look_at


      Aim the crosshair at a world coordinate, using the exact position from [STATE].


      look_abs


      Steer the camera to an absolute pitch and yaw, closed-loop against [STATE] at
      every step; works from any starting pose.


      go_to


      Walk to a world coordinate (x,z) , re-aiming against [STATE] at every step until
      within reach.


      watch


      Wait up to n steps, stopping as soon as a condition read from the game state
      holds: none (plain wait), inventory (any count changes), gui (a screen opens),
      health, damage, y_below:<v>, y_above:<v>, or moved:<blocks>.


      Mining and pickup


      mine_ahead


      Hold attack on the block under the crosshair, without re-aiming or walking.


      collect_drops


      Walk a short out-and-back sweep to pick up item drops; stop as soon as the inventory
      count rises, and report whether it did.


      Inventory and GUI cursor


      equip_hotbar


      Select hotbar slot 1–9.


      open_inventory


      Press E to open the inventory screen.


      close_inventory


      Press E to close the current screen.


      cursor_to_slot


      Move the cursor onto a player inventory slot, given its [INV] slot ID.


      cursor_to_cell


      Move the cursor onto a crafting or furnace cell, or onto the output cell.


      gui_click


      Left-click at the cursor (pick up or place a stack).


      gui_right_click


      Right-click at the cursor (place one item).


      stow_items


      Move the cursor stack and the named crafting cells into empty inventory slots,
      so the screen can close without dropping anything.


      discard_stack


      Throw away the stack in slot (there is no drop key): open the inventory, lift
      the stack, force-close the screen so it lands on the ground, and step back to
      avoid picking it up again.


      drop_and_pickup


      Drop the stack in slot and walk over it, so the game registers a pickup.


      Crafting and smelting


      craft


      Craft a recipe from the current inventory in one call: place each ingredient,
      take the output count times, return leftovers, move tools to the hotbar, and
      verify the result.


      place_and_open


      Place a crafting table or furnace on the ground one block ahead and open its
      screen, moving it to the hotbar first if needed; verify the placement and the
      screen type.


      furnace_load


      Load n of an item into the open furnace (0 = the whole stack) along with enough
      fuel, chosen in the order coal, charcoal, planks, logs, sticks.


      furnace_take


      Take the finished output from the open furnace into the inventory, after checking
      that the output cell is not empty; report what was taken.


      Placing and using items


      place_at


      Place item into the cell (x,y,z) by clicking a face of an adjacent block (by
      default, the block below the cell).


      use_at


      Right-click a face of the block at (x,y,z) with item selected, e.g., to pour
      water, light with flint and steel, till soil, plant seeds, or open a door or
      chest; with no item, use the block with whatever is held.


      use_held


      Hold use with the selected item, e.g., to draw a bow (release after \geq 25
      steps), drink a potion, look through a spyglass, or raise a shield.


      fill_bucket


      Fill an empty bucket from visible water: sweep the crosshair over the ground
      ahead (pitch 18–60∘, yaw \pm 40∘), pressing use at each aim until a filled bucket
      appears; report which liquid was collected.


      throw


      Throw a snowball, egg, ender pearl, or eye of ender n times; verify that the
      item count decreases.


      eat


      Eat the named food, or the best food carried; holds use for about 40 steps.


      pillar_up


      Jump and place n blocks underfoot, verifying each by the measured height; used
      to build a lookout or escape a mob.'
