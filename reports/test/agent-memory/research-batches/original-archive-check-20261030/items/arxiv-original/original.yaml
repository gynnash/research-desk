  - id: S29
    title: D.4 Storage and Cost
    text: 'All main and ablation results are averaged over 3 seeds; each seed fixes
      the Minecraft world or KiCad task order, with further variation from stochastic
      model sampling. In total we ran 96 Minecraft runs (72 main + 24 ablation, capped
      at 12k steps for Diamond and 36k for Dragon) and 1,125 KiCad episodes ( 25\text{
      tasks}\times 15\text{ configurations}\times 3\text{ seeds} ). All 48 Dragon
      runs exhaust their budget


      (Fig. 8), consuming \approx 1.7M steps and up to 14 hours each. In the Claude
      Opus 5 on Dragon configuration, a single run makes 0.9\text{--}3.9\text{k} model
      calls and costs \$108\text{--}\$969 (Table 9).


      Table 8 reports storage, retrieval, and memory-use statistics for one MFM run.


      Table 9 reports the cost of one Kill the Ender Dragon run per method with Claude
      Opus 5. Both tables come from single runs and are meant to show orders of magnitude.


