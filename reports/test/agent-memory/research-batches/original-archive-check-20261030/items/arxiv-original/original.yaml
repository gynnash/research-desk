  \ sequence from one task is reused on another.\n[S15] 5.1 Skill Learning through\
  \ Memory (https://arxiv.org/html/2610.22686v1#S5.SS1)\nA33: We look into whether\
  \ long-term memory allows agents to enhance their future behaviour by turning experience\
  \ from interactions into reusable procedures. In this context, self-improvement\
  \ means adapting as a result of the memory accumulated in MFM. MFM includes the\
  \ facilities needed to store, modify, and carry out procedures written by the agent,\
  \ and it is the agent itself that decides which behaviours to keep and when to reuse\
  \ them. We do not specify the resulting skill library and do not require a fixed\
  \ number of skills for each run. The analysis presented in this section includes\
  \ observations of skill creation and reuse over different trajectories, an ablation\
  \ study of the agent-written procedures, and a controlled study of the number of\
  \ steps required to solve new tasks with or without reusing the agent-written procedures.\n\
  \nFrom experience to reusable behaviour. The trajectories show how agents convert\
  \ their experience of interaction into permanent action routines. In a run of GPT-6-Astra\
  \ Dragon, after manually cutting a descending staircase (steps 5,068 to 5,249),\
  \ the agent created the procedure cut_step, which is parameterised by heading and\
  \ cuts one step while advancing (); it then invoked this procedure 60 times, once\
  \ for each of the four cardinal headings.\nA34:  A second procedure, quarry_north_pair,\
  \ extracts the upper and lower block from the wall in front and gathers the dropped\
  \ items (); the 27th time it was called, at step 17,462, it broke the first diamond\
  \ ore block. Reuse also carries over from one life to another. The procedure bridge_north,\
  \ which places one floor block while sneaking and takes the target cell as input\
  \ (), was written in the previous life after the agent had manually placed two blocks\
  \ over the lava and was then called three times in that same life. In this life\
  \ the agent called it nine times between steps 19,261 and 20,103, using inputs ranging\
  \ from (x=-3037, y=29, z=-5657) to (x=-3037, y=33, z=-5665). Each invocation placed\
  \ one cobblestone block and left the agent’s health unchanged, and the bridge ended\
  \ up reaching the lava pool where mining of obsidian took place at step 20,736.\
  \ The agent also disabled one inherited procedure, level_step, having traced the\
  \ previous death in the lava back to this procedure’s release of the sneak key.\n\
  \nContribution to task performance. The results from the procedure ablation show\
  \ that the procedures written by the agent do in fact contribute to task performance\
  \ in MFM. For instance, when these procedures are removed for GPT-5.6-Sol, the mean\
  \ milestone completion drops from 9.7 to 8.7 on Diamond and from 10.7 to 9.0 on\
  \ Dragon.\nA35:  Our analysis points to two mechanisms that account for these improvements.\
  \ Firstly, the skills allow agents to carry out the tasks more quickly; as presented\
  \ in Table 5, reusing skills acquired during an earlier task decreased the average\
  \ number of environment steps required to complete three new tasks: Iron shield,\
  \ Climb out, and Cook meat by 30%, 7%, and 26% respectively. Secondly, skills can\
  \ enable agents to reach milestones that would otherwise be impossible for them\
  \ to achieve, as shown in the case of the blaze-fighting skill. If there are no\
  \ agent-written skills that take visual inputs (for example, ), then none of the\
  \ methods or models evaluated is able to go beyond milestone 16 to accomplish milestones\
  \ such as killing a blaze or an enderman. These findings indicate that procedures\
  \ enhance both the efficiency of task completion and the variety of milestones that\
  \ can be achieved, even though they do not mean that each stored procedure is beneficial\
  \ or that having a larger library of skills will necessarily lead to better performance.\n\
