  - id: S13
    title: 4.3 Ablation Studies
    text: 'We evaluate the contributions of MFM’s memory components through four ablations
      that separately remove access to historical visual observations, associative
      indexing, agent-written procedures, and consolidation. Table 4 reports the ablation
      results. Historical visual observations appear essential for resolving perceptual
      ambiguities and spatial orientation (Section 4.4), since disabling stored frames
      drops completion to 8.0\pm 1.0 (Diamond) and 8.3\pm 0.6 (Dragon). Associative
      indexing suggests that a dedicated addressing layer helps; replacing it with
      chronological text matching over a flat log (Flat) reduces scores to 8.7\pm
      0.6 on both tasks. Additionally, agent-written procedures seem to help compound
      past successes into reusable routines (Section 5.1), as disabling it tends to
      decrease performance (Diamond: 8.7; Dragon: 9.0). Finally, the removal of consolidation
      lowers performance to 8.3\pm 0.6 on both tasks. The consistent drops across
      all four ablations is the main evidence that each component contributes.'
    location: https://arxiv.org/html/2610.22686v1#S4.SS3
  - id: S14
    title: 4.4 How Memory Retrieval Helps in Long-Horizon Tasks
    text: 'We examine qualitative examples to understand how MFM supports decisions
      during long-horizon interaction. These examples illustrate how agents inspect
      visual evidence to revise earlier interpretations, recover spatial context from
      previous observations, and reuse evidence across tasks.


      MCU-AgentBeats. Visual inspection enables agents to correct uncertain observations.
      In Fig. 9(a,b), magnifying ambiguous frames reveals a wolf instead of a sheep,
      preventing a costly attack; in (c,d), pink sheep observations guide resource
      gathering.


      Retrieving earlier observations also helps the agent recover spatial context
      and connect past experience to the current environment. Agents utilize past
      frames to locate hole rims (Fig. 10), identify mine entrances (Fig. 11), and
      correct unfavorable viewing angles (Fig. 12).


      We further examine a controlled construction task requiring the agent to align
      visual observations across multiple actions with a textual specification (full
      prompt in section E.3). Starting on a cleared stone platform with sufficient
      resources, the agent must build and activate a Nether portal. This probes multimodal
      capability: the agent must translate textual geometric constraints into a 3D
      structure, track construction progress from first-person views, and adjust accordingly.
      Only MFM successfully built the portal under a 6,000-step budget (Fig. 4), requiring
      lower overhead (Fig. 5): 30 model calls, 77 tool calls, and 77 environment actions
      (vs. 141/140/129 for VISTA and 43/131/151 for PRO-LONG).


      (a) MFM completes the portal.


      (b) VISTA


      (c) PRO-LONG


      Figure 4: Qualitative behavior on the Nether portal task. MFM successfully completes
      the Nether portal, whereas VISTA and PRO-LONG fail to finish the structure.


      Figure 5: Interaction efficiency on the Nether portal task.


      Comparison of model calls, tool calls, and executed environment actions.


      Figure 6: Temporal reach of memory retrieval.


      Retrieval-lag distributions on Diamond and Dragon. VISTA favors recent experience;
      MFM reaches further back, especially on Dragon.


      CUABench-KiCad. Fig. 13 shows 3 tasks where MFM outperforms VISTA (GPT-6-Astra).
      In Task 55f2eefb (switching an LED circuit’s supply from 9 V to 5 V), both methods
      log an “OK” from Change


      Symbol, but only MFM verifies the resulting netlist: its final state reads +5V


      while VISTA’s still reads +9V, underscoring the need to check task state through
      visual memory. On a buck-regulator task (c4baee36), both methods


      produce identical components and wiring but different supply labels; on the


      two-op-amp task (b7148878), MFM leaves 1 input pin unconnected versus 3 for


      VISTA. Fig. 15 shows episodic retrieval across tasks: an


      export sequence from one task is reused on another.'
    location: https://arxiv.org/html/2610.22686v1#S4.SS4
  - id: S15
    title: 5.1 Skill Learning through Memory
    text: 'We look into whether long-term memory allows agents to enhance their future
      behaviour by turning experience from interactions into reusable procedures.
      In this context, self-improvement means adapting as a result of the memory accumulated
      in MFM. MFM includes the facilities needed to store, modify, and carry out procedures
      written by the agent, and it is the agent itself that decides which behaviours
      to keep and when to reuse them. We do not specify the resulting skill library
      and do not require a fixed number of skills for each run. The analysis presented
      in this section includes observations of skill creation and reuse over different
      trajectories, an ablation study of the agent-written procedures, and a controlled
      study of the number of steps required to solve new tasks with or without reusing
      the agent-written procedures.


      From experience to reusable behaviour. The trajectories show how agents convert
      their experience of interaction into permanent action routines. In a run of
      GPT-6-Astra Dragon, after manually cutting a descending staircase (steps 5,068
      to 5,249), the agent created the procedure cut_step, which is parameterised
      by heading and cuts one step while advancing (); it then invoked this procedure
      60 times, once for each of the four cardinal headings. A second procedure, quarry_north_pair,
      extracts the upper and lower block from the wall in front and gathers the dropped
      items (); the 27th time it was called, at step 17,462, it broke the first diamond
      ore block. Reuse also carries over from one life to another. The procedure bridge_north,
      which places one floor block while sneaking and takes the target cell as input
      (), was written in the previous life after the agent had manually placed two
      blocks over the lava and was then called three times in that same life. In this
      life the agent called it nine times between steps 19,261 and 20,103, using inputs
      ranging from (x=-3037, y=29, z=-5657) to (x=-3037, y=33, z=-5665). Each invocation
      placed one cobblestone block and left the agent’s health unchanged, and the
      bridge ended up reaching the lava pool where mining of obsidian took place at
      step 20,736. The agent also disabled one inherited procedure, level_step, having
      traced the previous death in the lava back to this procedure’s release of the
      sneak key.


      Contribution to task performance. The results from the procedure ablation show
      that the procedures written by the agent do in fact contribute to task performance
      in MFM. For instance, when these procedures are removed for GPT-5.6-Sol, the
      mean milestone completion drops from 9.7 to 8.7 on Diamond and from 10.7 to
      9.0 on Dragon. Our analysis points to two mechanisms that account for these
      improvements. Firstly, the skills allow agents to carry out the tasks more quickly;
      as presented in Table 5, reusing skills acquired during an earlier task decreased
      the average number of environment steps required to complete three new tasks:
      Iron shield, Climb out, and Cook meat by 30%, 7%, and 26% respectively. Secondly,
      skills can enable agents to reach milestones that would otherwise be impossible
      for them to achieve, as shown in the case of the blaze-fighting skill. If there
      are no agent-written skills that take visual inputs (for example, ), then none
      of the methods or models evaluated is able to go beyond milestone 16 to accomplish
      milestones such as killing a blaze or an enderman. These findings indicate that
      procedures enhance both the efficiency of task completion and the variety of
      milestones that can be achieved, even though they do not mean that each stored
      procedure is beneficial or that having a larger library of skills will necessarily
      lead to better performance.


      Table 5: Skills learned from one task speed up new tasks. Mean environment


      steps (over 5 seeds each) to solve three new tasks without (w.o.) and with (w.)
      the scripts an earlier life


      wrote installed. Every life solved its task.


