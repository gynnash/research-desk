  \ A.4 Inspection Statistics (https://arxiv.org/html/2610.22686v1#A1.SS4)\nA53: We\
  \ quantify a mechanism behind Sec. 4.4 over the main Minecraft runs (three models,\
  \ two tasks, three seeds): how often inspecting a stored frame changed the agent’s\
  \ next action (Fig. 16).\n\nDoes looking at a stored frame change the next action?\n\
  \nThe agent looks before it commits, and the transcripts hold no counterfactual,\
  \ so a\n\nwithin-call before/after comparison is empty by construction. What can\
  \ be measured is the\n\ndestination. A turn is a retarget if its plan names a\n\n\
  go_to/look_at coordinate the running plan did not contain, and a\n\nrecall target\
  \ if that coordinate lies within 8 blocks of where the looked-at\n\nepisode was\
  \ recorded; the null for recall is the fraction of all stored episodes that\n\n\
  would match the coordinate by position alone. On Mine Diamond\n\n(Fig. 16), a turn\
  \ that opened a stored frame retargets 2.5\\times as often\n\nas one that did not\
  \ ( 17\\% vs 7\\% , p=5\\times 10^{-6} , Fisher), and the new destination\n\nis\
  \ the retrieved episode’s location in 42 of 48 cases against a 37\\% null\n\n( p=6\\\
  times 10^{-13} , binomial). Ender Dragon shows the same pattern ( 33\\% vs 14\\\
  % ;\n\n15/17 against a 24\\% null), as does the pool ( 19\\% vs 11\\% ; 57/65 against\n\
  \n33\\% ). The\n\nretrieval is therefore not merely correlated with replanning:\
  \ it selects which\n\nplace the agent goes to next.\n\nFigure 16: What follows a\
  \ look at a stored frame. Left: the share of turns whose\n\n\nA54: plan names a\
  \ destination the current plan did not have, after the agent opened a stored\n\n\
  episode frame (blue) against turns in which it opened no image at all (orange).\n\
  \nRight: of those new destinations, the share falling within 8 blocks of the\n\n\
  position at which the retrieved episode was recorded (blue), against the share of\
  \ the\n\nwhole episode store that would match the same coordinate by position alone\
  \ (orange).\n[S23] Appendix B Pseudocode (https://arxiv.org/html/2610.22686v1#A2)\n\
  A55: Notation.\n\nLet g denote the task objective, o_{t}=(v_{t},x_{t}) an observation,\n\
  \nand M_{t}=(E_{t},I_{t},C_{t}) the memory at step t .\n\nHere E_{t} stores completed\
  \ multimodal episodes, I_{t} provides searchable\n\ncues and references to those\
  \ episodes, and C_{t} contains revisable\n\nagent-written knowledge. The algorithms\
  \ use E , I , and C for their\n\ncurrent values. The initial memory may be empty\
  \ or contain retained\n\nexperience. An episode groups a contiguous interaction\
  \ interval;\n\nB holds the interval currently being recorded, and \\| denotes\n\n\
  sequence concatenation.\n\nAlgorithm 1 MFM: Multimodal Filesystem Memory\n\n1:\n\
  \nObjective g ; environment \\mathcal{E} ; initial memory M ; horizon T\n\n2:\n\n\
  Updated memory M\n\n3:\n\n(E,I,C)\\leftarrow M ; B\\leftarrow\\langle\\rangle ;\
  \ o_{1}\\leftarrow\\mathcal{E}.\\textsc{Observe}()\n\n4:\n\nfor t=1,\\ldots,T do\n\
  \n5:\n\nD_{t}\\leftarrow\\emptyset\n\n6:\n\nif past experience is needed then\n\n\
  7:\n\nq_{t}\\leftarrow\\textsc{FormQuery}(g,C,\\{o_{t}\\})\n\n8:\n\nD_{t}\\leftarrow\\\
  textsc{Retrieve}(q_{t},I)\n\n9:\n\nend if\n\n10:\n\nif consolidation is triggered\
  \ then\n\n11:\n\nC\\leftarrow\\textsc{Consolidate}(g,C,E,I,\\{o_{t}\\}\\cup D_{t})\n\
  \n12:\n\nend if\n\n13:\n\na_{t}\\leftarrow\\textsc{SelectAction}(g,o_{t},C,D_{t})\n\
  \n14:\n\n(o_{t+1},f_{t})\\leftarrow\\mathcal{E}.\\textsc{Step}(a_{t})\n\n15:\n\n\
  Persist (o_{t},a_{t},o_{t+1},f_{t}) with their interaction identifiers\n\n16:\n\n\
  Append references to these records to B\n\n17:\n\n\nA56: if an episode boundary\
  \ is reached then\n\n18:\n\n(E,I)\\leftarrow\\textsc{RecordEpisode}(B,E,I) ; B\\\
