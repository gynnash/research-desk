  - id: S16
    title: 6 Conclusion
    text: 'We introduced MFM, a multimodal filesystem memory that organizes episodic,
      spatial, semantic, procedural, and working memory as folders and files in one
      shared filesystem. Episodic records preserve raw observations, states, actions,
      and outcomes; a searchable index of contextual cues addresses them; and agent-written
      knowledge, procedures, and plans cite the episodes that support them. An agent
      can thus locate past experience by when, where, or what happened, inspect the
      original observation for details text omits, and revise what it has learned
      without discarding the evidence. Across Minecraft and KiCad with three base
      models, MFM outperforms memory-free and memory-augmented baselines, each component
      contributes, and memory transfers across tasks. We hope MFM can serve as a foundation
      for memory in long-horizon multimodal and embodied agents.


      Limitations and Future Work. MFM improves long-horizon performance, but exploration
      remains hard: even GPT-6-Astra at maximum reasoning effort (from a concurrent
      experiment posted online) did not complete Ender Dragon. Finding better ways
      of coupling memory


      to exploration and route planning could help agents find landmarks and avoid
      repeated traversal. Our evaluation is also limited to single agents in Minecraft
      and KiCad; shared memory across agents could combine experience from different
      regions or solution attempts, and broader environments would test how far the
      design transfers.'
