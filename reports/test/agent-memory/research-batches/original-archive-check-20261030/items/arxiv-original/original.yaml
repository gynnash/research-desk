      Filesystem and Multimodal Memory.


      Approaches that use a filesystem allow agents to search through and modify persistent
      records. PRO-LONG has demonstrated that searchable textual interaction logs
      can support long-horizon reasoning (Fox et al., 2026), and in other cases filesystems
      are used as organizational structures for agent memory (Zhou et al., 2026a).
      Multimodal memory systems are designed to organize long sequences of visual
      data in order to enable question answering and reasoning (Fan et al., 2024;
      Liu et al., 2026a; Long et al., 2026). Other research looks into task-conditioned
      retention (Zou et al., 2026), retrieval reliability in the face of temporal
      decay and conflicting evidence (Lu et al., 2026), query-aware relational organization
      (Li et al., 2026), and analytic operations performed on accumulated observations
      (Tian et al., 2026). Table 1 summarizes the differences between MFM and related
      systems.


      Memory for interactive agents with a long horizon.


      The ability to carry out long-horizon interactions demands a type of memory
      that enables continuous perception, exploration, and planning. The latest ARC-AGI-3
      systems integrate foundation models with interaction harnesses and external
      memory (ARC Prize Foundation, 2026; Fox et al., 2026; Zeng et al., 2026; Rodionov,
      2026), and VISTA keeps records of visual information that agents can go back
      to and compare (Han et al., 2026). In the field of robotics, efforts are directed
      towards multi-scale memory, the learning of history compression, and the development
      of benchmarks for memory-dependent policies (Torne et al., 2026; Wang et al.,
      2026; Dai et al., 2026). Spatial memory also helps with navigation and reasoning
      (Ge et al., 2026; Zhang et al., 2026). In Minecraft, Voyager creates a collection
      of executable skills (Wang et al., 2024), JARVIS-1 retrieves successful plans
      from its multimodal memory (Wang et al., 2025), and later agents introduce hybrid
      multimodal memory (Li et al., 2024), what-where-when representations (Park et
      al., 2025), and accumulated knowledge as a means of self-improvement (Xie et
      al., 2026). New benchmarks have recently emphasised exploration and long-horizon
      competence (Zheng et al., 2025; Ju et al., 2026; Zhou et al., 2026b). Although
      PRO-LONG indexes only text and VISTA revisits frames without having a searchable
      index, MFM provides a general-purpose multimodal episodic filesystem.'
    location: https://arxiv.org/html/2610.22686v1#S2
  - id: S5
    title: 3 Multimodal Filesystem Memory
    text: 'We present MFM, a multimodal filesystem memory architecture designed for
      long-horizon agents. This architecture incorporates three complementary elements:
      episodic records which store the multimodal experience, a searchable index that
      enables textual access to these records, and agent-written memory which structures
      plans, findings, environmental knowledge, and reusable procedures. Fig. 2 shows
      the structure of this approach, while Fig. 3 illustrates an example from Minecraft,
      covering the processes of episodic recording and indexing as well as retrieval
      and consolidation. Section 3.2 explains the various memory components and the
      way in which searchable records are linked to the multimodal evidence, Section
      3.3 describes how the agent finds and examines relevant episodes, and Section
      3.4 outlines how the accumulated experience is consolidated into reusable knowledge
      without losing the original evidence. Algorithm 1 gives a summary of the entire
      loop.


      Figure 2: Overview of MFM. Five forms of memory in one filesystem. Harness-written
      episodic memory records observations, states, actions, and outcomes every step,
      with searchable cues for locating them; spatial


      memory ties experiences to locations. Agent-written semantic, procedural, and
      working memory hold facts, reusable procedures, and the current plan, each citing
      its supporting episodes. The agent retrieves by


      searching cues and inspecting original evidence (Sec. 3.3), and consolidates
      experience into knowledge, procedures, and plans without modifying episodic
      records (Sec. 3.4).'
    location: https://arxiv.org/html/2610.22686v1#S3
  - id: S6
    title: 3.1 Problem Setup
    text: 'An agent interacts with an environment over a long horizon to achieve a
      task objective g . At step t , it receives an observation o_{t}=(v_{t},x_{t})
      , where v_{t} is a visual observation and x_{t} contains textual or structured
      information, and selects an action a_{t} . Its interaction history is H_{t}=(o_{1},a_{1},\ldots,a_{t-1},o_{t})
      . As this history grows beyond the model’s context budget, the agent must retain
      information outside its active context and retrieve it when needed. We represent
      this external memory as M_{t}=(E_{t},I_{t},C_{t}) , where E_{t}=(e_{1},\ldots,e_{N_{t}})
      stores the N_{t} completed episodes retained at step t , I_{t} provides an index
      for locating these episodes, and C_{t} contains agent-written knowledge.


      Below, we discuss how these components support complementary forms of memory.'
    location: https://arxiv.org/html/2610.22686v1#S3.SS1
  - id: S7
    title: 3.2 Memory Representation
    text: 'As shown in Figure 2, MFM divides memory into three parts: episodic records
      of multimodal experience, a searchable index, and agent-written memory. This
      approach is based on the difference between episodic memory, which relates to
      specific experiences, and semantic and procedural memory, which concern knowledge
      and ways of acting (Tulving, 1972; Squire, 2004). The episodic store E_{t} holds
      the observations, states, and actions, while the index I_{t} gives cues for
      finding these records. The agent-written memory C_{t} links discoveries from
      different episodes and keeps environmental knowledge, reusable procedures, and
      working plans. The following section explains each of these in turn.


      Episodic memory.


      To revisit a past experience, the agent needs access to what it observed, what
      it attempted, and what happened. We retain episodes as multimodal records,


      e_{i}=\bigl(\mathrm{id}_{i},\tau_{i},\mathcal{V}_{i},\mathcal{S}_{i},\mathcal{A}_{i},m_{i}\bigr),


      where \mathrm{id}_{i} is the episode identifier, \tau_{i}=[b_{i},d_{i}] is the
      episode’s timestep interval, \mathcal{V}_{i} contains recorded visual observations,
      \mathcal{S}_{i} contains associated structured states, \mathcal{A}_{i} records
      actions, and m_{i} contains metadata such as plan progress and task milestones.
      Episode identifiers and timestep metadata link these records to the corresponding
      agent interactions. Images retain perceptual details that may be absent from
      a textual description, while states, actions, and outcomes allow the agent to
      reconstruct the circumstances of an event. Preserving these records allows the
      agent to inspect details whose relevance becomes apparent only later. Fig. 3(a)
      illustrates the contents of an episode.


      Associative indexing.


      Episodic memory is useful only if the agent can retrieve relevant experiences
      when needed. MFM associates each episode with cues describing what happened,
      where it occurred, and when it took place. This use of cues to access detailed
      records is motivated by indexing accounts of episodic memory (Teyler and Rudy,
      2007). We represent the index as


      I_{t}=(z_{1},\ldots,z_{N_{t}}),\qquad z_{i}=(\mathrm{id}_{i},k_{i},\rho_{i}),


      where k_{i} contains searchable cues and \rho_{i} contains references to the
      stored evidence. The cues include temporal and available location metadata,
      action type, retrieval tags, and a short action–outcome description. The harness
      maintains one entry per completed episode in index.jsonl.


      The index serves as an addressing layer: cues narrow the search to relevant
      episodes, while references provide access to their underlying observations.
      For example, the agent can locate an encounter near a cave through its recorded
      location, an object tag, or an attempted action, then inspect the corresponding
      image. This allows the agent to retrieve an experience through its context without
      first recalling its precise visual content. Details absent from the index remain
      available for inspection in the stored observations. Fig. 3(b) illustrates this
      separation between cues and evidence, and Algorithm 2 summarizes episode storage
      and indexing.


      Spatial memory.


      For embodied interaction, location provides a common frame for connecting experiences
      collected at different times. MFM supports this function through spatial information
      distributed across its episodic store, index, and agent-written memory. Our
      memory filesystem maintains an append-only grid of traversed cells in a world
      frame in grid.jsonl. Episode coordinates support retrieval by spatial proximity
      or vertical position, while stored egocentric views let the agent verify a retrieved
      location by its appearance (Fig. 1(a,d)). The agent further records landmark
      knowledge in notes.md, such as the entrance to a mine that has become blocked,
      together with coordinates and references to supporting episodes. These representations
      draw on complementary ideas from cognitive maps (Tolman, 1948), memory for events
      and their locations (Clayton and Dickinson, 1998), and visual place recognition
      (Cartwright and Collett, 1983).


      Semantic and procedural memory. The agent must also accumulate knowledge that
      is still useful after a specific episode has ended. This knowledge is stored
      in the agent-created collection C_{t} , which provides support for both semantic
      and procedural memory as well as the working memory mentioned below. Semantic
      memory involves recording facts and the relationships between them across different
      experiences. For instance, a note can link a resource to a cave, connect the
      cave to its coordinates, or relate an attempted action to the result of that
      action. These associations are given in plain text and include episode identifiers
      or file paths, enabling the agent to refer back to the relevant evidence. Useful
      discoveries and local knowledge are stored in notes.md, while more general environmental
      patterns and operating instructions are kept in GUIDE.md.


      Procedural memory consists of methods that can be reused. In the procedures/
      directory there are textual or executable sequences of actions which the agent
      is able to reuse and modify during later interactions. Experience is converted
      into these kinds of knowledge and skill through periodic consolidation (Kumaran
      et al., 2016). The agent can add to, correct or reorganize these procedures
      as new evidence becomes available, the underlying episodic records staying unaltered.


      Working memory.


      To continue an ongoing task across context changes, MFM maintains the agent’s
      current plan and immediate subgoals in working.md (part of C_{t} ). This file
      records the current plan, unresolved questions, and information needed to resume
      after a context reset. It connects the agent’s accumulated experience and knowledge
      to the decisions required by its present objective.


      Figure 3: Memory contents and operations in MFM. A Minecraft trajectory shows
      how each form of memory is populated and used. (a) An episode: observation,
      state, action, and outcome stored as persistent files. (b) Its index entry:
      searchable cues, including spatial coordinates, with references to the records.
      (c) Retrieval: the agent locates episodes by step and inspects the referenced
      frame. (d) Consolidation: the evidence updates semantic (GUIDE.md) and working
      memory while earlier entries and episode references are preserved. Bottom: where
      each form of memory lives at this step.'
    location: https://arxiv.org/html/2610.22686v1#S3.SS2
  - id: S8
    title: 3.3 Memory Retrieval
    text: 'Retrieving an experience requires both locating a relevant episode and
      determining what its observations reveal about the current task. MFM separates
      this into two stages. The agent first searches for episodes through textual
      or structured cues, then inspects selected multimodal evidence. As the cues
      determine where to look without requiring the agent to describe every detail,
      the agent can ask new questions of past observations, including ones whose relevance
      was not apparent when the experience was recorded. Fig. 3(c) illustrates this
      process, and Algorithm 3 summarizes the retrieval procedure.


      Agent-initiated search.


      Given its current information need, the agent constructs a query q_{t} over
      the episode index I_{t} and receives matching entries R_{t} . A query specifies
      conditions on recorded context, such as a time interval or location. For example,
      an agent investigating a failed action can locate episodes around the time it
      occurred. Search then identifies episodes that match the requested context,
      while the agent judges which are useful for its current decision. Each result
      provides the episode identifier, contextual cues, an action–outcome summary,
      and references to the evidence. Matches are returned in chronological order,
      with an optional limit that retains only the most recent matches.


      Visual inspection.


      If you find a particular episode, you gain access to information that goes beyond
      the description in its index. The agent then chooses the references \mathcal{P}_{t}\subseteq\bigcup_{z_{i}\in
      R_{t}}\rho_{i} from the results and loads the relevant evidence into the context,
      D_{t}=\{\operatorname{Load}(p)\mid p\in\mathcal{P}_{t}\} , where \operatorname{Load}
      converts a reference into its stored frame, state, or other record. This approach
      of selectively loading evidence enables the agent to look at the evidence it
      needs without including the entire interaction history in the context. With
      respect to visual evidence, the agent may examine an original frame, compare
      a number of frames on a contact sheet, place a previous observation alongside
      the current view, or zoom in on a region of interest. These operations help
      answer different questions regarding the same experience, for example identifying
      an object, recognising a location, or understanding the outcome of an action.
      Since the observations are available independently of the textual clues, the
      agent is able to look at details that are missing from k_{i} and reconsider
      a previous interpretation. When an inspection involves a question, the agent
      keeps both the question and the result so that the reason for the lookup is
      not lost.'
    location: https://arxiv.org/html/2610.22686v1#S3.SS3
  - id: S9
    title: 3.4 Self-Evolving Consolidation
    text: 'Episodic memory preserves past experiences, while semantic and procedural
      memory capture knowledge and skills for future scenarios. MFM connects these
      forms of memory through consolidation, drawing on how complementary memory systems
      support learning from experience (Kumaran et al., 2016). During consolidation,
      the agent examines accumulated evidence and updates its understanding of the
      environment, reusable procedures, and its current plan. These updates change
      the agent-written memory C_{t} while preserving the recorded history (E_{t},I_{t})
      . Algorithm 4 summarizes this procedure.


      From experience to knowledge and skills.


      Consolidation allows findings from individual episodes to inform subsequent
      behavior. The agent can record a useful observation as local knowledge in notes.md,
      or update GUIDE.md when experience supports a broader regularity. For example,
      an encounter may establish where a resource was found, while repeated encounters
      may suggest conditions under which an action succeeds or fails. The agent can
      also qualify earlier guidance when new observations reveal limits to its applicability.


      Procedural updates record effective methods of acting; the agent is able to
      convert a sequence of actions into a textual or executable procedure and then
      modify it as a result of the changes revealed by later attempts. Working-memory
      updates link the knowledge that has been accumulated to the current task by
      having the agent revise the file working.md to show the completed subgoals,
      any changes to the plan, and the questions that remain unanswered. The agent
      decides which of these updates to make on the basis of the evidence available
      and the role of each memory, and the resulting documents and procedures stay
      accessible during future interactions.


      Revision with preserved episodic evidence. Knowledge gained from experience
      can become out of date or incorrect. By linking the knowledge that agents write
      to the episodic observations that support it, agents are able to go back and
      look at the basis of their earlier beliefs. For instance, after having noticed
      a sheep on a hillside the agent then decides to go back for food, enlarges the
      original frame, and discovers that the animal was in fact a wolf; it then corrects
      the note and alters its plan while still keeping the reference to the episode.
      If the agent had kept only the textual description it would have lost the visual
      details required to correct that interpretation. Therefore, by preserving the
      episodic evidence the agent can reevaluate its earlier conclusions as its understanding
      develops. Figure 3(d) shows that the agent updates its GUIDE to indicate that
      the death message names a Piglin and that the previous identification as a brute
      has not been confirmed.'
    location: https://arxiv.org/html/2610.22686v1#S3.SS4
  - id: S10
    title: 4 Experiment Results
    text: 'We evaluate MFM to understand how persistent multimodal memory affects
      task performance, decision-making, and interaction efficiency. We compare MFM
      with baseline methods on long-horizon embodied and computer-use tasks (Section
      4.2), examine the memory component contributions via ablation studies (Section
      4.3), and illustrate qualitative retrieval behaviors (Section 4.4), with a portal-building
      case study examining task completion and interaction efficiency, and analyze
      how the


      agent learns and reuses skills through memory (Section 5.1).'
    location: https://arxiv.org/html/2610.22686v1#S4
  - id: S11
    title: 4.1 Experimental Setup
    text: 'We evaluate MFM across two diverse domains, averaging all main and ablation
      results over three random seeds (determining the Minecraft world or KiCad task
      order). We limit each configuration to three seeds because long-horizon runs
      with frontier models are expensive. All models are ran with high reasoning efforts.


      •


      Minecraft: MCU-AgentBeats (Zheng et al., 2025; Liu et al., 2026b): open-world
      exploration and interaction in Minecraft, scored via scene-specific milestones.
      The details of both tasks are included in E.1. For the Mine Diamond from Scratch
      task, we use 12,000 max steps; for the Ender Dragon task, we use 36,000 max
      steps.


      •


      CUABench-KiCad. Built on the CUABench framework (Cua AI, Inc., 2025; Cua AI,
      2026) via low-level action spaces, this environment evaluates visual GUI agents
      on realistic electronic design automation workflows in KiCad. It contains N=25
      tasks. For MFM, VISTA, and PRO-LONG, memory can carry over across tasks. A task
      may receive a score in [0,1] when the solution satisfies only a subset of the
      required criteria.


      Baselines and models. We compare MFM against direct evaluation (no persistent
      memory), PRO-LONG (Fox et al., 2026), and VISTA (Han et al., 2026) using frontier
      base models (GPT-5.6-Sol, Claude Opus 5, and GPT-6-Astra). For a fair comparison,
      all methods share identical base agent prompts, decoding settings, environments,
      harness, and context management.


