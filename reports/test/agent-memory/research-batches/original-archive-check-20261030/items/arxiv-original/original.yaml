  \ drops; stop as soon as the inventory count rises, and report whether it did.\n\
  \nInventory and GUI cursor\n\nequip_hotbar\n\nSelect hotbar slot 1–9.\n\nopen_inventory\n\
  \nPress E to open the inventory screen.\n\nclose_inventory\n\nPress E to close the\
  \ current screen.\n\ncursor_to_slot\n\nMove the cursor onto a player inventory slot,\
  \ given its [INV] slot ID.\n\ncursor_to_cell\n\nMove the cursor onto a crafting\
  \ or furnace cell, or onto the output cell.\n\ngui_click\n\nLeft-click at the cursor\
  \ (pick up or place a stack).\n\ngui_right_click\n\nRight-click at the cursor (place\
  \ one item).\n\nstow_items\n\nMove the cursor stack and the named crafting cells\
  \ into empty inventory slots, so the screen can close without dropping anything.\n\
  \ndiscard_stack\n\nThrow away the stack in slot (there is no drop key): open the\
  \ inventory, lift the stack, force-close the screen so it lands on the ground, and\
  \ step back to avoid picking it up again.\n\ndrop_and_pickup\n\nDrop the stack in\
  \ slot and walk over it, so the game registers a pickup.\n\nCrafting and smelting\n\
  \ncraft\n\nCraft a recipe from the current inventory in one call: place each ingredient,\
  \ take the output count times, return leftovers, move tools to the hotbar, and verify\
  \ the result.\n\nplace_and_open\n\n\nA77: Place a crafting table or furnace on the\
  \ ground one block ahead and open its screen, moving it to the hotbar first if needed;\
  \ verify the placement and the screen type.\n\nfurnace_load\n\nLoad n of an item\
  \ into the open furnace (0 = the whole stack) along with enough fuel, chosen in\
  \ the order coal, charcoal, planks, logs, sticks.\n\nfurnace_take\n\nTake the finished\
  \ output from the open furnace into the inventory, after checking that the output\
  \ cell is not empty; report what was taken.\n\nPlacing and using items\n\nplace_at\n\
  \nPlace item into the cell (x,y,z) by clicking a face of an adjacent block (by default,\
  \ the block below the cell).\n\nuse_at\n\nRight-click a face of the block at (x,y,z)\
  \ with item selected, e.g., to pour water, light with flint and steel, till soil,\
  \ plant seeds, or open a door or chest; with no item, use the block with whatever\
  \ is held.\n\nuse_held\n\nHold use with the selected item, e.g., to draw a bow (release\
  \ after \\geq 25 steps), drink a potion, look through a spyglass, or raise a shield.\n\
  \nfill_bucket\n\nFill an empty bucket from visible water: sweep the crosshair over\
  \ the ground ahead (pitch 18–60∘, yaw \\pm 40∘), pressing use at each aim until\
  \ a filled bucket appears; report which liquid was collected.\n\nthrow\n\nThrow\
  \ a snowball, egg, ender pearl, or eye of ender n times; verify that the item count\
  \ decreases.\n\neat\n\n\nA78: Eat the named food, or the best food carried; holds\
  \ use for about 40 steps.\n\npillar_up\n\nJump and place n blocks underfoot, verifying\
  \ each by the measured height; used to build a lookout or escape a mob.\n[S29] D.4\
  \ Storage and Cost (https://arxiv.org/html/2610.22686v1#A4.SS4)\nA79: All main and\
  \ ablation results are averaged over 3 seeds; each seed fixes the Minecraft world\
  \ or KiCad task order, with further variation from stochastic model sampling. In\
  \ total we ran 96 Minecraft runs (72 main + 24 ablation, capped at 12k steps for\
  \ Diamond and 36k for Dragon) and 1,125 KiCad episodes ( 25\\text{ tasks}\\times\
  \ 15\\text{ configurations}\\times 3\\text{ seeds} ). All 48 Dragon runs exhaust\
  \ their budget\n\n(Fig. 8), consuming \\approx 1.7M steps and up to 14 hours each.\
  \ In the Claude Opus 5 on Dragon configuration, a single run makes 0.9\\text{--}3.9\\\
  text{k} model calls and costs \\$108\\text{--}\\$969 (Table 9).\n\nTable 8 reports\
  \ storage, retrieval, and memory-use statistics for one MFM run.\n\nTable 9 reports\
  \ the cost of one Kill the Ender Dragon run per method with Claude Opus 5. Both\
  \ tables come from single runs and are meant to show orders of magnitude.\n\nTable\
  \ 8: Storage, retrieval, and memory-use statistics for the GPT-6-Astra Mine Diamond\
  \ run that reached all 10 milestones.\n\nQuantity\n\nValue\n\nEnvironment steps\n\
  \n12,000\n\nModel calls\n\n130\n\nEpisodes stored\n\n636\n\nEpisode directory on\
  \ disk\n\n46 MB\n\nIndex (index.jsonl) size\n\n313 KB\n\nFull-resolution frames\
  \ on disk\n\n720 MB\n\nQuery time over the full index\n\n0.3–0.4 s\n\nview_image\
  \ calls\n\n87\n\nAgent-written procedures (written / calls)\n\n4 / 14\n\nTable 9:\
  \ Costs of Ender Dragon runs with Claude Opus 5 (36,000 steps) using Claude Code.\n\
  \n\nA80: Method\n\nMilest. obs.\n\nCalls\n\nTokens (M)\n\nUSD ($)\n\nMFM\n\n10\n\
  \n2,129\n\n47\n\n108\n\nVISTA\n\n9\n\n2,177\n\n69\n\n172\n\nPRO-LONG\n\n8\n\n895\n\
  \n57\n\n168\n\nDirect\n\n6\n\n3,934\n\n155\n\n969\n[S30] E.1 MCU Tasks Descriptions\
  \ (https://arxiv.org/html/2610.22686v1#A5.SS1)\nA81: Mine Diamond from Scratch.\
  \ The agent starts with no resources and must progress through the Minecraft technology\
  \ tree: gathering wood, stone, and iron, crafting increasingly capable tools, and\
  \ ultimately mining a diamond.\n\nKill Ender Dragon. The agent completes the same\
  \ early-game progression, then prepares diamond equipment, enters the Nether to\
  \ obtain blaze materials, crafts Eyes of Ender, reaches the End, and defeats the\
  \ Ender Dragon.\n\nFigure 17: Milestone progression for the Minecraft tasks. Mine\
  \ Diamond from Scratch contains 10 milestones, while Kill Ender Dragon shares the\
  \ same initial progression and adds 14 milestones required to reach and defeat the\
  \ Ender Dragon. Numbers in the left column index the Mine Diamond list; inner and\
  \ right-column numbers index the Ender Dragon list, in which Diamond ore is inserted\
  \ as milestone 10, so Diamond becomes 11 and the added milestones continue from\
  \ 12. Note that the milestones do not need to be finished strictly in this order.\n\
  [S31] E.2 New Tasks for Evaluating Skill Reuse (https://arxiv.org/html/2610.22686v1#A5.SS2)\n\
  A82: We design three additional Minecraft tasks to study whether reusing\n\nagent-written\
  \ skills reduces the steps required to solve new tasks.\n\nThese tasks introduce\
  \ new objectives while providing opportunities\n\nto apply procedures acquired during\
  \ earlier interaction.\n\nIron Shield. The agent builds a furnace, mines iron ore,\n\
  \nsmelts an iron ingot, and crafts a shield, combining intermediate\n\nobjectives\
  \ familiar from Mine Diamond from Scratch with a new crafting\n\ngoal. A small vein\
  \ of iron ore is placed underground, 13 blocks below\n\nand 12 blocks south of the\
  \ starting position, at coordinates given in\n\nthe task description.\n\nClimb Out.\
  \ The agent starts sealed in a two-block pocket deep\n\nunderground and must return\
  \ to the surface, 40 blocks above, and mine a\n\nblock of bricks set in the ground\
  \ there; the block’s coordinates are\n\ngiven in the task description. Reaching\
  \ it requires digging upward,\n\nwhereas the example procedures supplied to the\
  \ agent only dig downward\n\nor level.\n\nCook Meat. The agent builds a furnace,\
  \ kills an animal, and\n\ncooks its meat, introducing a hunting objective absent\
  \ from Mine\n\nDiamond from Scratch. Three cows are placed beside the starting\n\
  \nposition.\n\nIn all three tasks, early-game resources are supplied (a stone pickaxe\n\
  \nand cobblestone, plus a crafting table and logs for Iron Shield and\n\nCook Meat,\
  \ and a stone sword for Cook Meat) and the target is either\n\n\nA83: placed nearby\
  \ or located in the task description, reducing the need to\n\nrepeat initial resource\
  \ gathering and search.\n\nWe compare the steps required to complete each task with\
  \ and without\n\naccess to previously written skills. This evaluation tests whether\n\
  \nprocedures learned from earlier experience improve efficiency when\n\napplied\
  \ to new objectives.\n\nFigure 18: Milestone structure of Diamond and three related\
  \ tasks. Columns align the tasks by Diamond’s ten milestones. Blue indicates shared,\
  \ scored milestones; orange indicates task-specific milestones; gray indicates milestones\
  \ provided at initialization and excluded from scoring. Empty cells denote Diamond\
  \ milestones not scored in the corresponding task.\n[S32] E.3 Prompts and Outputs\
  \ Examples (https://arxiv.org/html/2610.22686v1#A5.SS3)\nA84: In this section, we\
  \ provide examples of prompts used."
