  - id: S61
    title: Stage associations versus isolated causality.
    text: 'Matched stage drops associate each paired contrast with the intervened
      stage


      under a frozen reader, prompt, packer, and judge. Gold versus retrieved


      contexts still differ in distractors and composition, so stage labels are


      protocol associations rather than fully isolated causal mechanisms.'
    location: https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px1
  - id: S62
    title: Underpowered video nulls.
    text: 'Video strata are modest ( n{=}56 – 64 unique QIDs). At 80% power the MDEs


      are 8.9 – 11.2 points (Appendix F), so ordered-versus-shuffled


      and related nulls are inconclusive, not proof of lossless temporal


      compression.'
    location: https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px2
  - id: S63
    title: Gold-delivery audio nulls and lexical leakage.
    text: 'Raw audio versus ASR ( +0.8 ) and ASR plus a gold prosody tag versus ASR


      ( +1.5 ) are near-null under gold delivery for the primary reader. A


      model-independent lexical audit of the textualized audio carriers used as the


      ASR condition finds frequent paralinguistic cues (e.g., oh wow,


      ugh, filled pauses) in the script text, and other gold hops often


      already expose the answer value. These nulls therefore do not establish that


      the reader recovers sentiment from plain transcripts or raw audio. A separate


      correct-versus-swapped symbolic tag intervention does show selector-level


      sensitivity (Appendix K.4); human-audited


      lexically clean subsets defined without conditioning on model failure remain


      future work.'
    location: https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px3
  - id: S64
    title: Construction and coverage.
    text: 'Automated filters and a human audit support release quality


      (Appendix I). Modality coverage is uneven by design (we


      report per-challenge strata), and text-only backends do not yet ingest native


      media indices. Gold construction metadata must not be exposed to systems under


      test (Appendix H).'
    location: https://arxiv.org/html/2610.29249v1#A7.SS0.SSS0.Px4
  - id: S65
    title: Appendix H Refusal Surface-Structure Diagnostics
    text: 'Answer Refusal items inherit an IE-shaped template then strip required


      evidence. We separate privileged construction annotations from


      system-observable features. Classifiers are balanced logistic regressions


      with persona-grouped 5-fold CV; AUROC confidence intervals are item bootstrap


      95% intervals over out-of-fold scores.'
    location: https://arxiv.org/html/2610.29249v1#A8
  - id: S66
    title: Privileged negative control.
    text: 'Required-hop count, answer-session count, and the answer_refusal


      question-type label perfectly identify refusal items (AUROC =1.00 ). These


      fields are definitionally downstream of refusal construction and are not part


      of the evaluation request; this result is a sanity check, not an


      exploitable surface shortcut. Release users must not feed gold metadata


      (evidence_plan requiredness, answer_session_ids, type


      labels) into systems under test.'
    location: https://arxiv.org/html/2610.29249v1#A8.SS0.SSS0.Px1
  - id: S67
    title: Observable features.
    text: 'Haystack length is matched: sessions-only AUROC 0.52 [0.47,\,0.56] vs.
      all


      answerable items. Broader structural counts (messages, media attachments, date


      span, question length) reach 0.75 [0.70,\,0.79] . Question-text TF–IDF is


      partially predictive ( 0.85 [0.82,\,0.88] vs. all answerable; 0.66


      [0.60,\,0.72] vs. IE-only). Thus refusal status is not recoverable from


      haystack length alone, but residual question-form cues remain; calibration


      should not be read as fully form-blind, and matched multi-hop refusal controls


      are future work.'
    location: https://arxiv.org/html/2610.29249v1#A8.SS0.SSS0.Px2
  - id: S68
    title: I.1 Annotation Protocol
    text: 'Three annotators independently reviewed a stratified sample of 100 items
      (70 where the omni probe verdict was NO, 30 where it was YES). Annotators were
      shown the question, expected answer, all required evidence facts (with modality
      and gap strategy), and the omni probe’s verdict. For each item, they answered:


      1.


      Well-posed? Is the question unambiguous and answerable as stated? (Yes / Partially
      / No)


      2.


      Gold answer correct? Is the expected answer factually correct given the evidence?
      (Yes / No)


      3.


      Evidence sufficient? Are all required artefacts legible/audible and do they
      show the answer? (Yes / No)


      4.


      Failure mode: If insufficient, what is the primary failure? (Evidence item invalid
      / Model refused incorrectly / Model attended to wrong modality / Model overlooked
      gap-bearing detail / Judge format mismatch / No need to answer)


      A follow-up audit then graded 100 additional probe-YES items drawn from the
      740 automated answerable releases (seed 20260801; excluding the 30 YES items
      already in the first sample), using the same Q1–Q3 rubric with two annotators.'
    location: https://arxiv.org/html/2610.29249v1#A9.SS1
