  \ explains why:\n\nA-MEM delivers the complete required chain on 0.787 of items\
  \ vs. 0.698 (flat\n\ncaption) and only 0.466 (native index), whose media caps evict\
  \ chain members.\n\nMemoryOS lags at 0.268/0.279 (25.5 / 22.1 points behind flat\
  \ RAG), consistent\n\nwith Track B over-abstention.\n\nMemory organization therefore\
  \ helps when it improves complete-chain\n\ndelivery under a fixed reader and budget;\
  \ a native index can still lose if\n\npacking drops required media before the reader\
  \ sees them. Backends that keep\n\nevery required hop in the request win even with\
  \ a text-only store; native\n\nperception cannot rescue a truncated chain.\nA36:\
  \  All 9,338 retrieved-but-dropped\n\nartefacts hit the media-count cap (Appendix\
  \ K.9).\n[S30] 6.4 End-to-End Systems & Abstention (RQ4) (https://arxiv.org/html/2610.29249v1#S6.SS4)\n\
  A37: Figure 6: Answering versus abstention for all twelve Track B systems. Marker\n\
  \narea is proportional to the false-refusal rate. The shaded upper region is\n\n\
  unoccupied. Full scores: Appendix K.6,\n\nTable 28.\n\nFigure 6 exposes a sharp\
  \ answer–abstention trade-off.\n\nNative ReAct with MiMo-V2.5 leads on answerable\
  \ items (0.732) but correctly\n\nrefuses only 0.410, whereas MemoryOS exceeds 0.88\
  \ correct refusal while scoring\n\nbelow 0.26 on answerable items and falsely refusing\
  \ over 0.61. A-MEM caption\n\ntext is the closest to balanced, but no system occupies\
  \ the upper-right.\n\nBecause refusal controls retain question-form cues\n\n(Appendix\
  \ H), RQ4 diagnoses abstention under this\n\ncontrol set rather than form-blind\
  \ calibration.\n[S31] 7 Conclusion (https://arxiv.org/html/2610.29249v1#S7)\nA38:\
  \ MOSAIC separates omni-modal memory failures into write,\n\nretrieve, deliver,\
  \ and read. Under the matched\n\nprotocol and fixed reader, reading accounts for\
  \ the largest residual loss\n\nunder gold facts; retrieval and delivery constrain\
  \ native pipelines, textualization text-derived ones. These are protocol associations,\
  \ not universal bottlenecks. Spatial structure has the\n\nclearest causal validation\
  \ and no adequate text surrogate; annotated prosody\n\ntags show selector-level\
  \ sensitivity, while temporal and raw-audio versus ASR\n\ncontrasts remain inconclusive.\
  \ No system both answers and refuses reliably:\n\nprogress requires preserving modality-specific\
  \ signal, delivering complete\n\nchains, and reading them faithfully.\n[S32] 8 Limitations\
  \ (https://arxiv.org/html/2610.29249v1#S8)\nA39: MOSAIC’s personas, evidence sessions,\
  \ and media are synthetic; evaluation on\n\norganically collected multimodal histories\
  \ remains future work. The primary\n\nreader is held out from filtering, and stage\
  \ contrasts are paired, but stage\n\nlabels are matched-protocol associations rather\
  \ than fully isolated mechanisms.\n\nVideo nulls are underpowered (Appendix F).\
  \ The raw-audio versus\n\nASR gap is inconclusive for this reader, and textualized\
  \ audio carriers often\n\nretain paralinguistic lexical cues while other gold hops\
  \ already expose the\n\nanswer value—so gold-delivery audio nulls do not establish\
  \ acoustic recovery\n\n(Appendix G). Swapped gold prosody tags\n\nnonetheless show\
  \ selector-level sensitivity\n\n(Appendix K.4). RQ4 uses length-matched refusal\n\
  \ncontrols with residual form cues (Appendix H).\n\nFurther caveats on modality\
  \ coverage and backend scope are in\n\nAppendix G.\n[S33] 9 Ethical Considerations\
  \ (https://arxiv.org/html/2610.29249v1#S9)\nA40: Personas, evidence sessions, and\
  \ all media artefacts in MOSAIC are synthetic; we\n\nrelease no private user logs\
  \ collected by the authors. Filler dialogue\n\ntext is sampled from LongMemEval’s\
  \ public filler-session pool\n\n(Appendix B.6): UltraChat under MIT and ShareGPT\
  \ under Apache 2.0\n\nas stated by LongMemEval; multimodal attachments on those\
  \ fillers are synthetic\n\ninjections from our pipeline. Stage-localized evaluation\
  \ is intended as a\n\nconstructive tool: deployers can see where evidence was dropped\
  \ rather\n\nthan only that a system scored poorly. The human audit used short voluntary\n\
  \nacademic annotation (Appendix I). Real deployments of\n\nomni-modal memory should\
  \ of course obtain user consent and provide retention\n\ncontrols, concerns outside\
  \ the scope of this benchmark release. AI assistants\n\naided coding and drafting.\n\
