  - id: S71
    title: I.4 Failure Mode Distribution
    text: 'Table 24 breaks down failure modes for items where the omni probe verdict
      was NO. Evidence item invalid (60.0%) dominates, reflecting generative media
      artefacts rather than benchmark design flaws.


      Failure Mode (Q4)


      Count


      %


      Evidence item invalid


      126


      60.0%


      Model overlooked gap-bearing detail


      34


      16.2%


      Model refused incorrectly


      31


      14.8%


      Model attended to wrong modality


      16


      7.6%


      Judge format mismatch


      3


      1.4%


      Table 24: Failure mode distribution on Judge=NO items (pooled across 3 evaluators).


      The failure mode distribution clarifies why the omni probe fails. The dominant
      category—evidence item invalid (60.0%)—indicates that the primary bottleneck
      is media synthesis quality: generated images sometimes render text illegibly,
      video frames occasionally miscount actions, and audio clips may garble prosodic
      cues. This is a limitation of current generative models rather than a benchmark
      design flaw, and as synthesis quality improves, these failures will naturally
      decrease. The second-largest category, model overlooked gap-bearing detail (16.2%),
      reveals that even a capable omni model sometimes attends to the correct modality
      but misses the specific detail that the gap strategy targets—for example, reading
      the foreground text in an image while missing the small background label that
      contains the answer. This is precisely the failure mode that MOSAIC is designed
      to expose in evaluated systems. Model refused incorrectly (14.8%) indicates
      cases where the omni probe said “I don’t know” despite the evidence being present
      and legible, likely due to ambiguous question phrasing or insufficient reasoning
      depth. The remaining categories—wrong modality (7.6%) and format mismatch (1.4%)—are
      minor, confirming that the probe generally attends to the correct evidence source.'
    location: https://arxiv.org/html/2610.29249v1#A9.SS4
  - id: S72
    title: I.5 Probe Rejections Overturned (Rescued Items)
    text: 'The human audit identified 44 items where the omni probe verdict was NO
      but annotators restored them to the final set. The selection rule is: an item
      is excluded only if all three annotators mark the evidence item invalid (26
      items); otherwise it is rescued (44 items). The 44 rescued items are not unanimous
      first-pass agreement—first-pass Q2 Yes counts were 35/36/46 across the three
      annotators across the 70 probe-NO items audited—so “quality 1.0” means inclusion
      under the three-annotator unanimous-exclusion rule, not unanimous first-pass
      acceptance. Rescued items span all five answerable question types: Information
      Extraction (5), Knowledge Update (11), MSR Bridge (9), MSR Selection (9), and
      Temporal Reasoning (10).'
    location: https://arxiv.org/html/2610.29249v1#A9.SS5
  - id: S73
    title: I.6 Inter-Rater Agreement
    text: 'Pairwise agreement between evaluators measures the reliability of human
      judgments:


      Q1 (Well-posed?): mean pairwise 94.0% (E1-E2=95%, E2-E3=91%, E1-E3=96%).


      Q2 (Gold answer correct?): mean pairwise 92.7% (E1-E2=99%, E2-E3=90%, E1-E3=89%).


      Q3 (Evidence sufficient?): mean pairwise 84.0% (E1-E2=84%, E2-E3=76%, E1-E3=92%).


      Q3 shows the highest variance (76–92%), reflecting genuine perceptual ambiguity
      in judging whether a synthesised image or audio clip “clearly shows” the intended
      detail—a finding consistent with prior work on multimodal quality assessment.
      Q1 has the highest agreement (94.0%), confirming that MOSAIC questions are unambiguously
      well-posed.'
    location: https://arxiv.org/html/2610.29249v1#A9.SS6
  - id: S74
    title: I.7 Probe Rejections Upheld
    text: The audit confirmed 26 items where the omni probe verdict was NO and evaluators
      agreed the item was genuinely invalid. These items remain excluded from MOSAIC-Eval.
    location: https://arxiv.org/html/2610.29249v1#A9.SS7
  - id: S75
    title: Appendix J Judge Validation
    text: 'Every number in this paper is produced by a single judge


      (Qwen3.7-Plus), so that all comparisons are scored by the same model;


      comparing scores across different judges is unsound. To justify relying on one


      judge we run a three-judge panel: GLM-5.2 and Grok-4.5, both with


      extended thinking disabled at temperature 0, independently re-score every item


      of all twelve Track B runs under the identical rubric. This yields


      12\times 923=11{,}076 triple-scored items. Neither auxiliary judge ever


      contributes to a reported score; the panel exists only to test whether the


      conclusions survive a change of judge.


      Table 25 reports the pooled result. Agreement is very


      high on every pair: quadratic-weighted \kappa never falls below 0.96 on


      average, Spearman \rho of the item-level scores never below 0.95, and all


      three judges land in the same rubric band on 84.0% of items. Per-run


      variation is modest and concentrated in the two lowest-scoring MemoryOS runs,


      where most predictions are refusals and the band distribution is degenerate;


      even there the minimum weighted \kappa is 0.884. The most contested question


      type is knowledge update ( \kappa=0.926 ), which is expected: it is the type


      whose gold answer depends on resolving a later correction, so borderline


      partial credit is genuinely ambiguous. Answer refusal is nearly perfectly


      agreed ( \kappa=0.983 ) because it reduces to a binary rule.'
    location: https://arxiv.org/html/2610.29249v1#A10
