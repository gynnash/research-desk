      MOSAIC’s per-persona haystack ( \sim 269K tokens) is substantially larger than


      LongMemEval’s ( \sim 158K). The token distribution is deliberately skewed:


      evidence-bearing sessions contribute a mean of 840 tokens each, while filler


      sessions average 1,213 tokens (overall session mean \sim 1.2K). Required


      facts are therefore scattered across multimodal evidence and multi-topic


      filler rather than clustered in a handful of salient messages. LongMemEval


      spreads its smaller budget across more sessions ( \sim 50 at \sim 3.2K tokens


      each) that typically centre on a single text topic, so the retrieval challenge


      differs in both scale and modality mix.


