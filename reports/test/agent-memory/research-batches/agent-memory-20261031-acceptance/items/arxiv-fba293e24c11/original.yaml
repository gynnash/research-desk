      Table 4: Track A under the fixed Gemini 3.5 reader on 784 answerable QIDs.


      Chain R@ k denotes complete-chain delivery; MemoryOS coverage is unobservable.


      Paired effects: Appendix K.5.


      With the reader fixed (Table 4), A-MEM beats same-representation


      flat RAG by 16.2 points on caption text [13.1, 19.3; W/T/L 233/464/87] and by


      16.4 on omni text [13.2, 19.4]; A-MEM caption (0.684) also outscores flat RAG


      over native multimodal evidence (0.641). Chain coverage explains why:


      A-MEM delivers the complete required chain on 0.787 of items vs. 0.698 (flat


      caption) and only 0.466 (native index), whose media caps evict chain members.


      MemoryOS lags at 0.268/0.279 (25.5 / 22.1 points behind flat RAG), consistent


      with Track B over-abstention.


      Memory organization therefore helps when it improves complete-chain


      delivery under a fixed reader and budget; a native index can still lose if


      packing drops required media before the reader sees them. Backends that keep


      every required hop in the request win even with a text-only store; native


      perception cannot rescue a truncated chain. All 9,338 retrieved-but-dropped


      artefacts hit the media-count cap (Appendix K.9).'
    location: https://arxiv.org/html/2610.29249v1#S6.SS3
  - id: S30
    title: 6.4 End-to-End Systems & Abstention (RQ4)
    text: 'Figure 6: Answering versus abstention for all twelve Track B systems. Marker


      area is proportional to the false-refusal rate. The shaded upper region is


      unoccupied. Full scores: Appendix K.6,


      Table 28.


      Figure 6 exposes a sharp answer–abstention trade-off.


      Native ReAct with MiMo-V2.5 leads on answerable items (0.732) but correctly


      refuses only 0.410, whereas MemoryOS exceeds 0.88 correct refusal while scoring


      below 0.26 on answerable items and falsely refusing over 0.61. A-MEM caption


      text is the closest to balanced, but no system occupies the upper-right.


      Because refusal controls retain question-form cues


      (Appendix H), RQ4 diagnoses abstention under this


      control set rather than form-blind calibration.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS4
  - id: S31
    title: 7 Conclusion
    text: 'MOSAIC separates omni-modal memory failures into write,


      retrieve, deliver, and read. Under the matched


      protocol and fixed reader, reading accounts for the largest residual loss


      under gold facts; retrieval and delivery constrain native pipelines, textualization
      text-derived ones. These are protocol associations, not universal bottlenecks.
      Spatial structure has the


      clearest causal validation and no adequate text surrogate; annotated prosody


      tags show selector-level sensitivity, while temporal and raw-audio versus ASR


      contrasts remain inconclusive. No system both answers and refuses reliably:


      progress requires preserving modality-specific signal, delivering complete


      chains, and reading them faithfully.'
    location: https://arxiv.org/html/2610.29249v1#S7
  - id: S32
    title: 8 Limitations
    text: 'MOSAIC’s personas, evidence sessions, and media are synthetic; evaluation
      on


      organically collected multimodal histories remains future work. The primary


      reader is held out from filtering, and stage contrasts are paired, but stage


      labels are matched-protocol associations rather than fully isolated mechanisms.


      Video nulls are underpowered (Appendix F). The raw-audio versus


      ASR gap is inconclusive for this reader, and textualized audio carriers often


      retain paralinguistic lexical cues while other gold hops already expose the


      answer value—so gold-delivery audio nulls do not establish acoustic recovery


      (Appendix G). Swapped gold prosody tags


      nonetheless show selector-level sensitivity


      (Appendix K.4). RQ4 uses length-matched refusal


      controls with residual form cues (Appendix H).


      Further caveats on modality coverage and backend scope are in


      Appendix G.'
    location: https://arxiv.org/html/2610.29249v1#S8
  - id: S33
    title: 9 Ethical Considerations
    text: 'Personas, evidence sessions, and all media artefacts in MOSAIC are synthetic;
      we


      release no private user logs collected by the authors. Filler dialogue


      text is sampled from LongMemEval’s public filler-session pool


      (Appendix B.6): UltraChat under MIT and ShareGPT under Apache 2.0


      as stated by LongMemEval; multimodal attachments on those fillers are synthetic


      injections from our pipeline. Stage-localized evaluation is intended as a


      constructive tool: deployers can see where evidence was dropped rather


      than only that a system scored poorly. The human audit used short voluntary


      academic annotation (Appendix I). Real deployments of


      omni-modal memory should of course obtain user consent and provide retention


      controls, concerns outside the scope of this benchmark release. AI assistants


      aided coding and drafting.'
    location: https://arxiv.org/html/2610.29249v1#S9
  - id: S34
    title: References
