  - id: S87
    title: K.9 Why Delivery Fails
    text: 'Table 31 accounts for every artefact that was retrieved but


      never serialized into the reader’s request, counted from the per-request


      delivery manifests of the retrieved native, production caps condition


      (top-20 units, three media per modality;


      Appendix C.4). Across the 784 answerable items this


      amounts to 9,338 dropped artefacts—5,559 images, 593 videos, and 3,186


      audio clips. The result is unusually clean: every dropped artefact is


      attributable to the per-modality media-count cap. No chain member was lost to


      token limits, serialization failures, or unsupported formats. Delivery loss
      in


      MOSAIC is therefore a budgeting decision rather than an infrastructure failure,


      which is what makes it directly actionable.


