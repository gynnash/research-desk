  - id: S82
    title: Prosody-tag selector sensitivity.
    text: 'We reran both arms under one frozen reader, prompt, gold-delivery packer,
      and


      judge: ASR + correct gold tone versus the identical context with


      happy \leftrightarrow unhappy flipped. The eligible set is


      all prosody carriers (450 intervention cases spanning 399 unique QIDs; 51 QIDs


      host two carriers). We do not condition on ASR failure. The primary


      unit is the unique-QID mean paired delta: +0.046 [0.017,\,0.077]


      (W/T/L 46/330/23; persona-clustered mean +0.041 over 70 personas). Condition


      means are 0.824 (correct) and 0.782 (swapped). The case-level mean delta is


      +0.043 —slightly below the QID mean because multi-carrier QIDs are


      down-weighted when averaging by QID. A positive correct-over-swapped effect


      shows that the annotated prosodic selector is causally load-bearing; it


      does not show that raw audio perception outperforms ASR.'
