  - id: S4
    title: Contributions.
    text: '•


      MOSAIC, 923 persona-grounded omni-modal memory questions


      with construction-targeted spatial, temporal, and prosodic signals (strongest


      causal validation for spatial information; selector-level validation for


      annotated prosody), cross-modal multi-hop chains, and 139 refusal controls.


      •


      A matched four-stage diagnostic protocol separating


      write, retrieve, deliver, and read,


      with fixed-reader and native end-to-end evaluation tracks.


      •


      A validated public benchmark pipeline, including human


      audits, media, filtering dispositions, manifests, and run configurations.'
    location: https://arxiv.org/html/2610.29249v1#S1.SS0.SSS0.Px1
  - id: S5
    title: Conversational memory benchmarks.
    text: 'From single-session persona grounding (Zhang et al., 2018) to multi-session
      suites, text-only benchmarks probe extraction, multi-session and temporal reasoning,
      knowledge updating, recall, and persona consistency (Zhong et al., 2023; Ou
      et al., 2024; Wu et al., 2025; Yu et al., 2025; Jiang et al., 2025; He et al.,
      2024; Du et al., 2025). Multimodal extensions remain limited: LoCoMo images
      are often non-essential (Maharana et al., 2024; Bei et al., 2026); Mem-Gallery
      and MemLens make images task-critical but stop at text+image and emphasise finding
      rather than cross-modal chaining (Bei et al., 2026; Ren et al., 2026); ATM-Bench
      aggregates personal multi-source evidence rather than sequential conversational
      chaining (Mei et al., 2026); and MMRC, MMDU, MM-NIAH/MMNeedle, Mementos, and
      M3-Bench add image/video reasoning without multi-session dialogue structure
      (Xue et al., 2025; Liu et al., 2024b; Wang et al., 2024a; Wang et al., 2024b;
      Zhou et al., 2026). MOSAIC is the first to require retrieving and chaining evidence
      across all four primary modalities in multi-session conversations (Table 1).'
    location: https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px1
  - id: S6
    title: Multi-hop and cross-modal reasoning.
    text: HotpotQA, MuSiQue, MultiModalQA, WebQA, and CRIT target compositional multi-hop
      QA over text and images (Yang et al., 2018; Trivedi et al., 2022; Talmor et
      al., 2021; Chang et al., 2022; Sung et al., 2026); long-context suites such
      as BABILong, RULER, and MMLU-Reason chain facts in static corpora (Kuratov et
      al., 2024; Hsieh et al., 2024; Tie et al., 2025). MOSAIC combines multi-hop
      reasoning with session-scattered multimodal retrieval.
    location: https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px2
  - id: S7
    title: Memory-augmented LLM systems.
    text: Memory architectures virtualize or structure long context (Packer et al.,
      2024; Chen et al., 2023; Sarthi et al., 2024; Liu et al., 2024a), integrate
      graphs with retrieval (Guo et al., 2025; Gutiérrez et al., 2025; Paul et al.,
      2026), or provide agentic/OS-inspired layers (Xu et al., 2025; Kang et al.,
      2025; Wang et al., 2025). They lack a standard omni-modal benchmark for controlled
      comparison—the role MOSAIC fills.
    location: https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px3
  - id: S8
    title: RAG and memory diagnosis.
    text: 'Prior work localizes failures via claim-level RAG diagnostics (Ru et al.,
      2024), tests of visual evidence use (Hu et al., 2025), controlled document pools
      (Peng et al., 2026), AMemGym’s write/read/utilization split (Jiayang et al.,
      2026), and MemFail’s text-memory stages (Garg et al., 2026); localization itself
      is not novel. We differ in how stages are separated: instead of stressing a
      still-coupled pipeline, MOSAIC makes each stage substitutable under a frozen
      reader, prompt, packer, budget, and judge. This measures deliver apart from
      retrieve and attributes loss to carrier-level signals—to our knowledge the first
      substitutable four-stage protocol for omni-modal conversational memory.'
    location: https://arxiv.org/html/2610.29249v1#S2.SS0.SSS0.Px4
  - id: S9
    title: 3 Preliminaries
    text: 'Every MOSAIC item is a persona-grounded, multi-modal query embedded in
      a chronological haystack of user–assistant sessions. Three orthogonal axes define
      it, each worked through end-to-end in Appendix A: the question type fixes the
      reasoning skeleton (§3.1), the modality gap defines what each non-text modality
      must contribute (§3.2), and the reasoning chain composes Narrower, Selector,
      and Answer facts into a deterministic retrieval path (§3.3).'
    location: https://arxiv.org/html/2610.29249v1#S3
  - id: S10
    title: 3.1 Question Types
    text: 'MOSAIC covers six types: single-session information extraction;


      cross-session selection and bridging; knowledge updates; temporal-plan


      disruptions; and refusal after evidence removal. Questions require one to


      three facts; Appendix A defines each type, and


      Appendix D reports per-type counts.


