  body_text: 'Omni-modal assistants must remember not only what users say, but also
    what they show and convey. Existing long-term memory benchmarks are mostly text-and-image
    or report a single end-to-end score, so they cannot locate whether evidence is
    lost when it is represented, retrieved, delivered, or read. We introduce MOSAIC,
    a benchmark of 923 questions over persona-grounded histories of 11-24 sessions
    spanning text, image, video, and audio. MOSAIC constructs targeted spatial, temporal,
    and prosodic signals rather than decorative media, with the strongest causal validation
    for spatial information and selector-level validation for annotated prosody, and
    pairs them with a matched diagnostic protocol that freezes the question, reader,
    prompt, and budget while intervening on representation, retrieval, and delivery.
    Matched decomposition shows that representation loss is modality-dependent, residual
    reading dominates even under gold evidence, and abstention remains weak on these
    controls: strong answerable scores coexist with failures to refuse. MOSAIC thus
    turns omni-modal memory evaluation from a leaderboard into a diagnosis of write,
    retrieve, deliver, and read failures.'
