  - id: S86
    title: K.8 Retrieval and Delivery Curves
    text: 'Table 30 reports required-fact and complete-chain recall


      over the ranked units. Complete-chain recall is far below fact recall at every


      cutoff, which is precisely why chain-level accounting rather than fact-level


      recall is the correct retrieval metric for multi-hop memory: a chain is only


      useful if all of its members arrive. Query rewriting costs roughly one


      point of recall at every cutoff. After packing, these rankings deliver complete


      chains for 0.675 (all feasible hits), 0.491 (production caps), and 0.464


      (end-to-end) of items, with required-fact delivery coverage 0.871, 0.761, and


      0.742 respectively.


