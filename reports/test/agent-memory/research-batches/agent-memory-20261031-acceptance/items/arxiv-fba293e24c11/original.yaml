  - id: S78
    title: 'K.1 Matched Stage Ladder: Paired Contrasts'
    text: 'Numeric companion to Table 3 and


      Figure 3. Gold symbolic facts score 0.846, bounding


      residual integration and grading error at 15.4 points. The


      perception-and-integration cost of native evidence (symbolic - native) is


      6.2 points [95% CI 3.2, 9.3; W/T/L 206/489/89]. Generic captions and ASR lose


      a further 9.3 points relative to native evidence, of which only 1.4 are


      recovered by the query-blind structured writer ( +1.4 [ -0.9 , 3.7];


      103/585/96). Retrieval loss (gold native - retrieved all-delivered) is


      7.6 points [5.2, 9.9], and production delivery caps remove another 3.8 on the


      identical ranked hits [1.5, 6.0]. The full production pipeline reaches 0.653,


      only 1.7 points below the original-query budgeted condition [ -0.6 , 3.9]; gold


      symbolic facts exceed it by 19.2 points [15.7, 22.8].


      Video-dependent items score 0.900 symbolically but 0.729 with native video


      (17.1-point perception cost), against 6.2 for image and none for audio


      (0.821 \to 0.826). Probe-pass ( n{=}740 ) vs. human-rescued ( n{=}44 )


      items are indistinguishable under gold symbolic facts (0.846 vs. 0.845) but


      differ by 27.8 points under gold native evidence (0.799 vs. 0.520), persisting


      through the production pipeline (15.5 [2.9, 28.5]).'
