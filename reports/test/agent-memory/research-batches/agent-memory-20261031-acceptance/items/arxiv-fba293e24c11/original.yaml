      The filtering cascade reveals distinct failure profiles at each step. The structural
      filter (Step 1) catches 31 items (3.0%) through deterministic rules—primarily
      duplicate fact values and answer leaks—representing clear-cut generation errors.
      The LLM quality judge (Step 2) removes 15 additional items (1.5%). The 1,004-item
      set then comprises 864 answerable and 140 Answer Refusal candidates. The omni
      probe accepts 745 answerable candidates and rejects 119; adding the 140 bypassed
      refusal candidates gives 885. A second four-check quality intersection removes
      five probe-accepted answerable items and one refusal item, yielding the recorded
      879-item automated set (740 answerable + 139 refusal). Finally, human review
      restores 44 of the probe-rejected answerable items, yielding exactly 923 unique
      items (784 answerable + 139 refusal). Thus the final dataset is a 923-item subset
      of the 1,004-item LLM-filtered set and a 44-item superset of the automated post-review
      set.'
