      The modality distribution reflects MOSAIC’s deliberate emphasis on non-textual
      evidence. Across all facts (required + context + distractor), 80.0% involve
      a non-text modality, and among required facts specifically, 85.1% ( 1{,}582/1{,}860
      ) are non-text. Image evidence dominates, accounting for 39.1% of all facts
      and 49.0% of required facts, followed by audio (28.5% all, 25.6% required) and
      video (12.4% all, 10.5% required). The relatively lower share of video reflects
      the higher generation cost and the targeted use of video for temporal gaps (action
      ordering, state transition, repetition count), where static alternatives cannot
      suffice. Audio’s substantial presence—over a quarter of required facts—is unique
      among memory benchmarks and directly enables the prosody-based discrimination
      that Caption-Text architectures consistently fail on (see §6).


