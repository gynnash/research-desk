  - id: S91
    title: 'L.1 Example Item: Multi-Hop Cross-Modal Chain (MSR Bridge)'
    text: 'Question: “What is the packing method from the carver in the video where
      I first hollowed then inlaid, in the town on the sign in my chess set photo,
      that I sounded happy about?”


      Expected Answer: “bundle-wrap”


      Reasoning Chain:


      1.


      Selector (Image, Background Detail): The user shares a photo of their driftwood
      chess set on a hatch-cover table mid-game. A sign visible through the window
      in the background reads “Mistport”—this identifies the town where the carver’s
      workshop is located.


      2.


      Selector (Video, Action Ordering): A video from a Mistport workshop shows a
      carver working on driftwood pieces—first hollowing, then inlaying. The video
      gap requires perceiving the action sequence (hollow \rightarrow inlay) to identify
      the correct carver among two at the workshop.


      3.


      Answer (Audio, Happy Tone): A voice message mentions two packing methods (“bundle-wrap”
      and “crate-pack”), with happy tone toward “bundle-wrap”. The text transcript
      alone names both methods neutrally; only the prosody discriminates.


      Modalities required: Image (chess set with background sign) \rightarrow Video
      (carving action sequence) \rightarrow Audio (happy tone toward packing method).
      A text-only system would see captions for all three but lose both the spatial
      background detail and the prosodic discriminator.'
    location: https://arxiv.org/html/2610.29249v1#A12.SS1
  - id: S92
    title: L.2 Example of Model Success
    text: 'Question: “In the photo of my fondue set with the colour-coded forks, what
      brand is stamped on the base?”


      Expected: “Lorraine”


      Predicted (RAG MM MiMo): “Lorraine” Score: 1.0


      The model correctly retrieved the image chunk (a photo of a vintage cast-iron
      fondue set) and read the brand name “Lorraine” stamped on the base. The brand
      was never mentioned in the chat text—only visible in the image.'
    location: https://arxiv.org/html/2610.29249v1#A12.SS2
  - id: S93
    title: 'L.3 Case Study: Audio Prosody Gap (MSR Selection)'
    text: 'Figure L.3 shows the evidence image from


      mm_msr_selection_ac58aedd_002. The comparison below illustrates a


      Track B failure mode discussed in §6: Caption-Text loses the


      labeled prosodic discriminator and selects the wrong entity; Native-MM


      preserves it. Transcripts below are the released required-evidence utterances


      (not paraphrases); see the selector note on the imperfect lexical cue.


      Figure 12: Birding-log photo from item


      mm_msr_selection_ac58aedd_002. The answer-critical detail


      (receipt price $189.99 under the black 10x42 pair) is only readable in the


      image; the chat text never states the price.


      Question: “What was the price of the binoculars I sounded happier about?”


      Expected Answer: “$189.99” (black 10x42 pair, identified by happy tone)


      Chain structure (MSR Selection):


      1.


      Selector (Audio, tone contrast): Required voice messages name both candidate
      pairs without an explicit prefer/like lexicon:


      •


      “I also tried the Nikon Monarch 5 8x42 while I was there, and then I gave the
      mossy oak 8x42 roof prism a go right after.”


      •


      “So I went back and tried the other two binoculars I was looking at—the Mossy
      Oak camo 8x42s and the black 10x42s. The black pair really surprised me.”


      Construction labels assign unhappy tone to the Mossy Oak 8x42s and happy tone
      to the black 10x42s. The phrase “surprised me” lexically singles out the black
      pair as the reacted-to entity, but it does not explicitly encode positive polarity
      (e.g., prefer/happy); we therefore treat this item as an imperfect Track B illustration
      of selector failure under ASR, not as a pure lexical-neutrality exemplar.


      2.


      Answer (Image, fine-grained attribute): A photo of both pairs on a birding log
      with the receipt tucked under the black pair. The price is never spoken—only
      readable in the image.'
    location: https://arxiv.org/html/2610.29249v1#A12.SS3
  - id: S94
    title: L.4 Example of Model Failure
    text: 'Question: “After I sounded unhappy about the wedding postponement, what
      price did I list the Ansel Adams print for in the photo?”


      Expected: “$450”


      Predicted (RAG MM Gemini 3.5): “I don’t know.” Score: 0.0


      The model failed to chain two pieces of cross-modal evidence: (1) an audio message
      with unhappy tone about a wedding postponement, and (2) a photo of an Ansel
      Adams print listing with a price. The multi-hop chain required connecting the
      temporal “after” relationship across audio prosody and image text, which the
      model could not complete.


      Question: “How did my living room wall change in the video I took while repainting?”


      (mm_knowledge_update_bb832271_001; type Knowledge Update)


      Expected: “from pale yellow with peeling paint to soft sage green”


      Predicted (ReAct MM MiMo): “sage green” Score: 0.5 (Partial)


      The item is a two-session knowledge update: an earlier image session shows the


      old wall colour behind a herb garden (Selector, background detail),


      and a later video session shows the repaint (Answer, state-transition


      gap). The model reported only the new colour, missing the required


      old \rightarrow new contrast.'
    location: https://arxiv.org/html/2610.29249v1#A12.SS4
