  [S71] I.4 Failure Mode Distribution (https://arxiv.org/html/2610.29249v1#A9.SS4)\n\
  A100: Table 24 breaks down failure modes for items where the omni probe verdict\
  \ was NO. Evidence item invalid (60.0%) dominates, reflecting generative media artefacts\
  \ rather than benchmark design flaws.\n\nFailure Mode (Q4)\n\nCount\n\n%\n\nEvidence\
  \ item invalid\n\n126\n\n60.0%\n\nModel overlooked gap-bearing detail\n\n34\n\n\
  16.2%\n\nModel refused incorrectly\n\n31\n\n14.8%\n\nModel attended to wrong modality\n\
  \n16\n\n7.6%\n\nJudge format mismatch\n\n3\n\n1.4%\n\nTable 24: Failure mode distribution\
  \ on Judge=NO items (pooled across 3 evaluators).\n\nThe failure mode distribution\
  \ clarifies why the omni probe fails. The dominant category—evidence item invalid\
  \ (60.0%)—indicates that the primary bottleneck is media synthesis quality: generated\
  \ images sometimes render text illegibly, video frames occasionally miscount actions,\
  \ and audio clips may garble prosodic cues. This is a limitation of current generative\
  \ models rather than a benchmark design flaw, and as synthesis quality improves,\
  \ these failures will naturally decrease. The second-largest category, model overlooked\
  \ gap-bearing detail (16.2%), reveals that even a capable omni model sometimes attends\
  \ to the correct modality but misses the specific detail that the gap strategy targets—for\
  \ example, reading the foreground text in an image while missing the small background\
  \ label that contains the answer.\nA101:  This is precisely the failure mode that\
  \ MOSAIC is designed to expose in evaluated systems. Model refused incorrectly (14.8%)\
  \ indicates cases where the omni probe said “I don’t know” despite the evidence\
  \ being present and legible, likely due to ambiguous question phrasing or insufficient\
  \ reasoning depth. The remaining categories—wrong modality (7.6%) and format mismatch\
  \ (1.4%)—are minor, confirming that the probe generally attends to the correct evidence\
  \ source.\n[S72] I.5 Probe Rejections Overturned (Rescued Items) (https://arxiv.org/html/2610.29249v1#A9.SS5)\n\
  A102: The human audit identified 44 items where the omni probe verdict was NO but\
  \ annotators restored them to the final set. The selection rule is: an item is excluded\
  \ only if all three annotators mark the evidence item invalid (26 items); otherwise\
  \ it is rescued (44 items). The 44 rescued items are not unanimous first-pass agreement—first-pass\
  \ Q2 Yes counts were 35/36/46 across the three annotators across the 70 probe-NO\
  \ items audited—so “quality 1.0” means inclusion under the three-annotator unanimous-exclusion\
  \ rule, not unanimous first-pass acceptance. Rescued items span all five answerable\
  \ question types: Information Extraction (5), Knowledge Update (11), MSR Bridge\
  \ (9), MSR Selection (9), and Temporal Reasoning (10).\n[S73] I.6 Inter-Rater Agreement\
  \ (https://arxiv.org/html/2610.29249v1#A9.SS6)\nA103: Pairwise agreement between\
