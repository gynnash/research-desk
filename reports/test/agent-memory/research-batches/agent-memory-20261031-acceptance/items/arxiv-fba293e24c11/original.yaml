      The six question types are not uniformly distributed. Knowledge Update (20.9%)
      and Temporal Reasoning (20.5%) are the largest categories, reflecting their
      importance for evaluating evolving state and causal disruption—two capabilities
      central to long-horizon memory. Information Extraction (19.3%), the simplest
      type, serves as a single-hop baseline. The two multi-hop types, MSR Bridge and
      MSR Selection, each account for 12.1%, and together with Knowledge Update and
      Temporal Reasoning, multi-hop reasoning questions constitute 65.6% of the benchmark.
      Answer Refusal items (15.1%) provide the abstention subset, sufficient for measuring
      refusal behaviour without dominating the evaluation.


