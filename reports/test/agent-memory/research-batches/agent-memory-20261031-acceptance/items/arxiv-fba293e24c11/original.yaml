  - id: S35
    title: A.1 Question Type Definitions and Examples
    text: 'Table 5 summarises hop and session requirements for the


      six types introduced in §3.1; Table 6


      gives full definitions and examples from the 923-item evaluation set.


      Type


      Hops


      Sess.


      Reasoning


      Info. Extraction


      1–2


      1


      Direct recall


      Msr-Selection


      2–3


      \geq 2


      Cross-sess. select


      Msr-Bridge


      3


      \geq 3


      Sequential chain


      Knowledge Update


      2


      \geq 2


      Old \rightarrow new


      Temporal Reasoning


      2–3


      \geq 2


      Plan \rightarrow disrupt


      Answer Refusal


      1–2


      1


      Abstention


      Table 5: The six MOSAIC question types. Hops = required facts in the


      reasoning chain; Sess. = evidence sessions that host those facts.


      Type


      Definition


      Example


      Information Extraction


      Single-session factual recall. Disambiguates among \geq 2 same-category items
      via a discriminator (tone, sequence, count, temporal hint). 1–2 hops.


      “In the photo of my fondue set with the colour-coded forks, what brand is stamped
      on it?”


      MSR Selection


      Cross-session entity binding: entities of the same category appear in different
      sessions; a discriminator selects the target. 2–3 hops, \geq 2 sessions.


      “What background detail is visible in the photo of the tomato seedlings I sounded
      happy about?”


      MSR Bridge


      Sequential chain: entity e_{0} in s_{0} identifies e_{1} in s_{1} , which identifies
      e_{2} in s_{2} ; the answer is an attribute of e_{2} . 3 hops, \geq 3 sessions.


      “What is the packing method from the carver in the video where I first hollowed
      then inlaid, in the town on the sign in my chess set photo?”


      Knowledge Update


      Evolving attribute tracking (old \rightarrow new state) across sessions. 2 hops,
      \geq 2 sessions.


      “In the two photos, what brand did my chore coat change to?” (Carhartt \rightarrow
      Dickies)


      Temporal Reasoning


      Time-order reasoning with a causal disruption: an old plan is altered; the answer
      depends on the new outcome. 2–3 hops, \geq 2 sessions.


      “After I sounded unhappy about the tour cancellation, what was the shade name
      of the replacement tile I photographed?”


      Answer Refusal


      Evidence-stripped unanswerable calibration check. The question appears answerable
      on its surface, but the required evidence has been deliberately removed. 1–2
      hops, 1 session.


      “In the photo of my Kierkegaard book on the bench by the foggy harbour, what
      stand-up comedy detail is in the background?” (Expected: “I don’t know.”)


      Table 6: The six MOSAIC question types with definitions and concrete examples.'
    location: https://arxiv.org/html/2610.29249v1#A1.SS1
  - id: S36
    title: A.2 Modality Gap Strategies
    text: 'Required non-text facts are assigned a gap strategy (1,555/1,582 carry
      a


      named tag in the release; see Table 14). A modality gap


      is information that survives only because its native modality preserves


      it—a text-only or caption-based agent would lose it. The gaps are not


      arbitrary: each probes a known encoder failure mode so that recovering the


      answer requires the native channel that mechanism preserves.'
    location: https://arxiv.org/html/2610.29249v1#A1.SS2
  - id: S37
    title: Encoder motivation (deferred from § 3.2 ).
    text: 'Image gaps (spatial) target detail that patch-based visual encoders compress
      away under token-pooling and resolution limits, and that captioners—which describe
      the salient foreground—omit. Video gaps (temporal) target what sparse frame-sampling
      and temporal pooling destroy: a caption of “assembling a shelf” retains neither
      order nor count. Audio gaps (prosodic) target the lexical–acoustic split that
      ASR collapses; prosody is the signal most completely erased by textualization.'
    location: https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px1
  - id: S38
    title: Image Gaps (Spatial).
    text: '•


      Background detail: The answer resides in the periphery or background; the foreground
      depicts an unrelated object. Example: a photo of a chess set where the answer
      is the lighthouse visible through the window behind it.


      •


      Fine-grained attribute: The answer requires reading text (brand names, prices,
      serial numbers, book titles) or counting exact quantities visible only in the
      image. Example: the brand name “Lorraine” stamped on the base of a fondue pot,
      never mentioned in chat text.


      •


      Spatial configuration: The answer depends on the relative arrangement or position
      of items. Example: “the left pole leaning higher than the right” in a photo
      of hiking poles against a fence.'
    location: https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px2
  - id: S39
    title: Video Gaps (Temporal).
    text: '•


      Action ordering: Which of two distinct actions came first vs. second. Example:
      a video of a shelf being assembled, where the model must determine whether the
      photo was placed before or after the candle was lit.


      •


      State transition: How a change unfolded—gradual, sudden, uneven, patchy. Example:
      a barn renovation video showing transformation stages across multiple weeks.


      •


      Action repetition count: How many times an action occurred, banded as 1–2, 4–5,
      or 8+ to absorb video-generation variance. Example: counting how many times
      a molinillo is spun in a hot chocolate preparation video.'
    location: https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px3
  - id: S40
    title: Audio Gap (Prosodic).
    text: '•


      Audio prosody (happy/unhappy): Emotional tone conveys preference, while the
      transcript uses deliberately neutral words naming \geq 2 candidates. Example:
      a voice message saying “I tried the brass-and-glass telegraph” in a happy tone,
      while another message mentions a different telegraph neutrally.'
    location: https://arxiv.org/html/2610.29249v1#A1.SS2.SSS0.Px4
  - id: S41
    title: A.3 Fact Roles and Chain Structure
    text: 'Every answerable MOSAIC item is built around a reasoning chain—an ordered
      sequence of required facts. Each fact has a role:


      •


      Narrower (NAR): Reduces the candidate set (e.g., “I prefer vintage items”).


      •


      Selector (SEL): Identifies a unique entity (e.g., “the brass-and-glass telegraph
      I sounded happy about”).


      •


      Answer (ANS): Carries the final value (e.g., “8:15 AM”).


      A chain follows the pattern \text{NAR}^{*}\;\text{SEL}^{*}\;\text{ANS} . Every
      valid chain satisfies four constraints defined in §3.3. A chain is cross-modal
      when its required facts span at least two modalities. The gap-bearing detail
      typically resides in a Narrower or Selector. The Answer’s final value is always
      a short text-expressible string (a name, price, count, or date), but the fact
      that carries it may itself be multimodal—e.g., a brand name readable only in
      an image, or a preference conveyed only by prosody.'
    location: https://arxiv.org/html/2610.29249v1#A1.SS3
  - id: S42
    title: Appendix B Generation Pipeline Details
    text: 'Figure 7: The MOSAIC generation pipeline. Stage 1 samples a persona and
      designs a multi-hop reasoning chain; Stage 2 audits it via a per-fact deletion
      test against twelve failure modes; Stage 3 realises it as a timestamped multi-session
      conversation with persona-conditioned filler; Stage 4 synthesises the media
      assets, followed by structural and LLM-based quality filtering.'
    location: https://arxiv.org/html/2610.29249v1#A2
  - id: S43
    title: B.1 Stages 1–3 in Detail
    text: 'Each item is grounded in a persona from Nemotron-Personas. A round-robin
      sampler assigns gap strategies and audio tones for uniform coverage, and a single
      LLM call designs one caption-distinct primary entity per question (at most two
      per category, differing in \geq 2 of style, colour, material, setting, or condition).
      The LLM then designs the chain question-first—write the question, choose the
      answer, then construct the chain \mathcal{C} and its facts under the bridge-entity
      and entity-pair constraints (§3.3). Every chain enters a validate-and-repair
      loop (up to three iterations): a programmatic pass enforces hard structural
      constraints, and an LLM judge runs a per-fact deletion test against twelve named
      failure modes (e.g. Lexical-Leak, Bridge-Integrity, Shortcut); chains unrepaired
      after three iterations are discarded, and Answer Refusal items have their required
      facts stripped after auditing. Surviving facts are realised as natural turns
      in a chronological haystack of evidence and persona-conditioned filler sessions,
      under a temporal-leak guard and a forbidden-value list that keep early or non-answer
      turns from leaking the answer.'
    location: https://arxiv.org/html/2610.29249v1#A2.SS1
  - id: S44
    title: B.2 Stage 4 Filtering Lineage and Release Statistics
    text: 'Stage 4 synthesises media—images via FLUX-2-pro (GPT-image-2 for text-rich
      gaps), video via Kling/Seedance, and audio via Qwen3-TTS with persona-aware
      voices—after which a filtering cascade reduces the 1,050 raw items to 1,004
      structurally and semantically valid candidates. Of the 864 answerable candidates,
      an omni answerability probe accepts 745; a second automated quality intersection
      retains 740 of these plus 139 of the 140 Answer Refusal candidates, producing
      an 879-item automated set. A three-annotator human audit of 100 sampled items
      (94.3% well-posed) then rescues 44 probe false negatives, yielding exactly 923
      unique items (784 answerable + 139 refusal). We report this as an exact lineage
      rather than reconstructing it from rounded pass rates; the 784/864 (90.7%) figure
      is a filtering retention rate, not a human answerability ceiling (full cascade
      in Appendix E; audit in Appendix I).


      MOSAIC-Eval spans 70 personas (11–24 sessions, mean 17.5), 4,573 annotated facts
      of which 1,860 are required by answerable items, 10,765 multimodal artefacts,
      and an \sim 18.8M-token haystack ( \sim 269K tokens per persona, 1.7\times LongMemEval’s
      budget in denser sessions). Among answerable items, 668/784 (85.2%) require
      at least two facts and 588/784 (75.0%) require at least two modalities. Required
      evidence appears in image, audio, video, and text for 780 (99.5%), 424 (54.1%),
      184 (23.5%), and 277 (35.3%) items respectively; these incidence rates overlap,
      so we report per-challenge strata throughout. The remaining distribution tables
      appear in Appendix D.'
    location: https://arxiv.org/html/2610.29249v1#A2.SS2
  - id: S45
    title: B.3 Prompt Templates
    text: 'The pipeline uses a modular set of LLM prompt templates, each targeting
      a specific generation subtask:


      •


      Chain design: Given a persona, question type, and assigned modalities, the LLM
      designs the reasoning chain question-first: write the question, choose the answer,
      then construct the chain \mathcal{C} and its facts. Type-specific templates
      enforce the required hop count and session structure.


      •


      Fact extraction: After chain design, the LLM extracts canonical fact statements
      from the reasoning chain, assigning each fact a role (Narrower, Selector, Answer),
      a modality, and a gap strategy.


      •


      Session planning: Facts are distributed across a chronological timeline of evidence
      and filler sessions. Periods and session groups are assigned programmatically;
      the LLM determines the natural language realisation of each fact within its
      assigned session.


      •


      Validation and repair: A dedicated validation prompt runs a per-fact deletion
      test and checks for twelve named failure modes (see below). Failures trigger
      minimal repairs (1–3 targeted changes); items unrepaired after three iterations
      are discarded.


      •


      Session building: An LLM rewrites each canonical fact as a natural conversation
      turn under two guards: a temporal-leak guard restricts facts to those with \texttt{hop\_index}\leq
      the current turn, and a forbidden-value list prevents Narrower and Selector
      facts from mentioning the Answer value.'
    location: https://arxiv.org/html/2610.29249v1#A2.SS3
  - id: S46
    title: B.4 Chain Templates
    text: 'Table 7 lists the type-specific chain templates used during Stage 1 chain
      design (§4).


      Type


      Chain template


      Info. Extraction


      Naropt \rightarrow Sel \rightarrow Ans


      Msr-Selection


      Naropt \rightarrow Sel \rightarrow Ans (cross-sess.)


      Msr-Bridge


      Naropt \rightarrow Sel \rightarrow Sel \rightarrow Ans


      Knowledge Update


      Naropt \rightarrow Selold \rightarrow Ansnew


      Temporal Reasoning


      Naropt \rightarrow Selplan \rightarrow Seldisrupt \rightarrow Ansout.


      Answer Refusal


      inherits IE, evidence stripped


      Table 7: Chain templates. Nar = Narrower, Sel = Selector, Ans = Answer. “opt”
      denotes an optional narrowing step.'
    location: https://arxiv.org/html/2610.29249v1#A2.SS4
  - id: S47
    title: B.5 Twelve Named Failure Modes
    text: 'Table 8 catalogues the twelve failure modes checked during Stage 2 chain
      validation (§4). Each mode targets a specific class of generation defect, detected
      by the LLM validation judge, triggering targeted repairs; chains unrepaired
      after three iterations are discarded.


      Failure Mode


      Definition


      Lexical-Leak


      The question text paraphrases or contains the answer value.


      Bridge-Integrity


      Adjacent facts in the chain do not share a concrete referent.


      Shortcut


      The answer can be derived from text-only evidence, bypassing the intended modality
      gap.


      Entity-Mismatch


      The entity described in the Answer fact does not match the entity selected by
      prior facts.


      Gap-Anchoring


      The question text does not reference the gap-bearing detail, making it unclear
      which evidence to retrieve.


      Redundant-Gap


      Two facts test the same modality gap, reducing diversity.


      Session-Overlap


      Required facts from different hops are placed in the same session, collapsing
      the temporal structure.


      Tone-Collapse


      Both audio candidates share the same prosodic tone, removing the discriminator.


      Period-Leak


      A later-period fact leaks the answer value into an earlier period’s context.


      Caption-Distinctness


      Primary entities in the same category are not sufficiently distinct ( <2 of
      style, colour, material, setting, condition).


      Entity-Pair


      An audio/video Narrower or Selector has no competing same-type entity, making
      the gap unnecessary.


      Count-Band


      The action repetition count in a video question does not match the specified
      count band (1–2, 4–5, 8+).


      Table 8: The twelve named failure modes checked during Stage 2 validation.'
    location: https://arxiv.org/html/2610.29249v1#A2.SS5
  - id: S48
    title: B.6 Filler Session Generation
    text: 'Filler dialogue text is taken from LongMemEval’s publicly released


      custom-history filler pool (Wu et al., 2025)


      (data_5_filler_sess.json; 29,149 sessions):


      UltraChat (Ding et al., 2023) (20,000 sessions; LLM-synthesized


      dialogues; MIT; accessed via https://github.com/thunlp/UltraChat) and


      ShareGPT (Chiang et al., 2023) (9,149 sessions; user-shared ChatGPT


      transcripts curated via LMSYS FastChat; Apache 2.0 as stated by


      LongMemEval, accessed via https://github.com/lm-sys/FastChat). We do not


      re-sample upstream dumps independently; session IDs retain the LongMemEval


      ultrachat_* / sharegpt_* scheme. In the official release


      configuration the existing-corpus ratio is 1.0 (no LLM-generated filler


      dialogue). Multimodal attachments on fillers are injected separately by our


      pipeline and are synthetic. Topic filtering prevents fillers from mentioning


      evidence entities. Fillers are interleaved chronologically with evidence


      sessions to create realistic temporal gaps.'
    location: https://arxiv.org/html/2610.29249v1#A2.SS6
  - id: S49
    title: C.1 System Architectures
    text: 'Figure 8: The three system architectures evaluated on MOSAIC: Caption-Text
      (VL captioner + Whisper ASR, text index), Omni-Text (single omni captioner preserving
      prosody, text index), and Native-MM (multimodal embeddings over raw artefacts,
      omni-modal reasoner).


      Three architectures differ in how multimodal evidence is preprocessed and indexed
      (see Figure 8):


      •


      Caption-Text (CT): A VL captioner (Qwen3-VL-235B-A22B) and Whisper-large-v3-turbo
      convert all non-text evidence to captions. All captions are indexed as text
      chunks with a text embedding model (Qwen3-Embedding-0.6B). A text-only LLM reasoner
      retrieves and answers over captions.


      •


      Omni-Text (OT): A single omni-modal LM (MiMo-V2.5) replaces the cascade, generating
      captions that preserve audio prosody (Whisper discards it). Otherwise identical
      to Caption-Text: text index, text reasoner.


      •


      Native-MM (NMM): No textualization. Raw images, video frames, and audio are
      indexed with a multimodal embedding model (jina-embeddings-v5-omni-small). An
      omni-modal LM reasons directly over the retrieved artefacts (images, video,
      audio).'
    location: https://arxiv.org/html/2610.29249v1#A3.SS1
  - id: S50
    title: C.2 Retrieval Back-Ends
    text: '•


      Naive RAG: Single-pass retrieval with top- k=20 , using Qwen3-Embedding-0.6B
      (Zhang et al., 2025) for text indices and jina-embeddings-v5-omni-small (Hönicke
      et al., 2026) for Native-MM. Query rewriting (LLM keyword extraction) before
      embedding. No time filter. Score threshold 0.0.


      •


      ReAct-RAG: Iterative retrieval (up to 5 steps) with a tool-use loop; the model
      decides when to search and when to answer. SEARCH/ANSWER marker format for Native-MM,
      function calling for text architectures. Search top- k=20 , query rewriting
      enabled, duplicate query rejection. Every ReAct configuration must first pass
      a one-search parity gate, in which the scaffold is restricted to a single retrieval
      call and must reproduce the corresponding Naive RAG run’s retrieval and delivery
      plumbing; ReAct numbers are reported only after that gate matches.


      •


      A-MEM (Xu et al., 2025): Agentic memory system that extracts structured memory
      entries from conversation history. Uses MiniLM-L6-v2 (Wang et al., 2020) embeddings.
      Applied only to Caption-Text and Omni-Text, since it does not ingest native
      media.


      •


      MemoryOS (Kang et al., 2025): Memory operating system that organizes conversation
      history into retrievable memory blocks. Uses MiniLM-L6-v2 embeddings. Applied
      only to Caption-Text and Omni-Text. MemoryOS does not expose a ranked candidate
      list, so its chain-coverage cells are reported as not observable rather than
      zero.'
    location: https://arxiv.org/html/2610.29249v1#A3.SS2
  - id: S51
    title: C.3 Reasoning Models
    text: '•


      Fixed reader (all matched conditions and Track A): Gemini 3.5, temperature 0,
      1,024 output tokens, extended thinking disabled. Chosen because it played no
      role in dataset construction.


      •


      Text reasoners (Track B): DeepSeek-v4-Flash for Naive RAG, ReAct, A-MEM, and
      MemoryOS over the text architectures. Temperature 0.


      •


      Omni reasoners (Track B, Native-MM only): MiMo-V2.5 and Gemini 3.5. Temperature
      0. For Native-MM ReAct, the omni model handles both the iterative search loop
      and the final answer.


      •


      Write-time models: generic text uses a Qwen3-VL-235B captioner (Bai et al.,
      2025) with Whisper-large-v3-turbo ASR (Radford et al., 2023); structured text
      uses a query-blind MiMo-V2.5 writer with fixed per-modality schemas that preserve
      spatial relations, temporal order, counts, and prosody.'
    location: https://arxiv.org/html/2610.29249v1#A3.SS3
  - id: S52
    title: C.4 Diagnostic Conditions
    text: 'Beyond the two architecture tracks, the matched decomposition


      (§5.1) runs seven conditions on the same 784 answerable


      QIDs under one reader, prompt, packer, budget, and judge:


      •


      Gold symbolic facts: the annotated required facts as text, bounding residual
      read and grading error.


      •


      Gold native evidence: the same chain delivered as raw media, isolating native
      perception cost.


      •


      Gold generic text: the same chain as VL captions plus Whisper ASR, isolating
      write-time textualization loss.


      •


      Gold structured text: the same chain under the query-blind structured writer,
      isolating the avoidable share of that loss.


      •


      Retrieved native, all delivered: every retrieved hit is serialized, isolating
      retrieval loss at fixed delivery.


      •


      Retrieved native, production caps: the identical ranked manifest under top-20
      units, three media per modality, 100 MB, isolating delivery loss at fixed ranking.


      •


      End-to-end native RAG: adds the frozen fixed-rewrite query ranking.


      Delivery is additionally swept over two tighter budgets (top-10 units with


      three media; top-5 units with one media item per modality) against a single


      frozen top-50 manifest, so that retrieval quality is constant by construction


      and only the packer’s allowance varies. The within-item modality interventions


      (§5.2) supply twelve further conditions: four image


      variants, four video variants, and four audio variants.'
    location: https://arxiv.org/html/2610.29249v1#A3.SS4
  - id: S53
    title: C.5 LLM-as-Judge Protocol
    text: 'All system outputs are evaluated by a single LLM judge (Qwen3.7-Plus; full


      prompt in Appendix M). A three-judge panel (GLM-5.2 and


      Grok-4.5 as auxiliaries) re-scores every Track B run to verify that conclusions


      are robust to judge identity (agreement statistics:


      Appendix J). Only the primary judge’s scores appear in any


      reported number. The judge receives the question, expected answer, accepted


      aliases, and the system’s predicted answer, and assigns a score on a 0–1


      scale:


      Score


      Label


      Definition


      1.0


      Perfect


      Semantically identical to expected or alias. Only formatting/capitalization
      differs.


      0.7


      Mostly Correct


      Right answer but extra context or slightly imprecise wording.


      0.5


      Partial


      Gets category or one part right, misses specifics.


      0.3


      Attempted


      Core fact wrong but shows effort.


      0.0


      Wrong


      Completely incorrect, refused on answerable question, empty, or error.


      Table 9: LLM-as-Judge scoring rubric.


      For Answer Refusal items, “I don’t know” or similar refusals score 1.0; any
      other answer scores 0.0.'
    location: https://arxiv.org/html/2610.29249v1#A3.SS5
  - id: S54
    title: C.6 Metrics Definitions
    text: '•


      Judge score (answerable): Mean judge score over the 784 answerable items. Answer
      Refusal is excluded and reported separately as abstention.


      •


      Abstention (paired): Correct-refusal rate on the 139 Answer Refusal items together
      with the false-refusal rate on the 784 answerable items (Table 28, Figure 6);
      reporting both prevents an always-abstain system from appearing well-calibrated.


      •


      Required-fact Recall@ k : Fraction of an item’s gold required facts whose source
      unit appears in the top- k set, computed over both the ranked units and the
      units actually serialized into the request.


      •


      Complete-chain Recall@ k / chain delivery: Fraction of items for which every
      required fact appears, ranked or delivered respectively. This is the retrieval
      metric that matters for multi-hop memory, since a partial chain is not usable.


      •


      Paired effect: For a controlled contrast, the mean within-item difference over
      the shared QID set, with an item-bootstrap 95% interval (10,000 resamples),
      wins/ties/losses, and a persona-clustered bootstrap as a dependence sensitivity
      check.'
    location: https://arxiv.org/html/2610.29249v1#A3.SS6
