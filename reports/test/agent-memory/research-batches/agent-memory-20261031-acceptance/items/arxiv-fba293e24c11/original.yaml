  \ (§3.1), the modality gap defines what each non-text modality must contribute (§3.2),\
  \ and the reasoning chain composes Narrower, Selector, and Answer facts into a deterministic\
  \ retrieval path (§3.3).\n[S10] 3.1 Question Types (https://arxiv.org/html/2610.29249v1#S3.SS1)\n\
