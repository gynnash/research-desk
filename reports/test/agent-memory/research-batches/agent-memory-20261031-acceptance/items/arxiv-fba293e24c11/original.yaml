  [S89] K.11 Method Family Ranking (https://arxiv.org/html/2610.29249v1#A11.SS11)\n\
  A121: Table 33 groups the twelve Track B configurations into\n\narchitecture families.\
  \ Text-memory families (A-MEM, MemoryOS) never ingest\n\nnative media and use a\
  \ different retrieval substrate from the RAG families, so\n\nrankings vs. Native-MM\
