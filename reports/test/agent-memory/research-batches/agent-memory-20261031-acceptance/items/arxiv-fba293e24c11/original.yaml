  \ encodes\n\nthe architecture family. The native-multimodal configurations occupy\
  \ the top of\n\nthe ranking, and the two MemoryOS configurations the bottom.\n\n\
  Figure 10: Judge score by system \\times question type, with\n\nAR the correct-refusal\
  \ rate on the 139 refusal items. Knowledge Update\n\nis the hardest answerable type\
  \ for essentially every system. The AR column runs\n\nopposite to every answerable\
  \ column, which is the\n\nindiscriminate-abstention pattern quantified in §6.4.\n\
  \nFigure 11: Judge score by question type: six panels, each ranking all\n\ntwelve\
  \ systems for that type. Colour encodes the architecture family. The\n\nanswerable\
  \ panels share a near-identical ordering, while the AR panel reverses\n\nit.\n[S91]\
  \ L.1 Example Item: Multi-Hop Cross-Modal Chain (MSR Bridge) (https://arxiv.org/html/2610.29249v1#A12.SS1)\n\
  A123: Question: “What is the packing method from the carver in the video where I\
  \ first hollowed then inlaid, in the town on the sign in my chess set photo, that\
  \ I sounded happy about?”\n\nExpected Answer: “bundle-wrap”\n\nReasoning Chain:\n\
  \n1.\n\nSelector (Image, Background Detail): The user shares a photo of their driftwood\
  \ chess set on a hatch-cover table mid-game. A sign visible through the window in\
  \ the background reads “Mistport”—this identifies the town where the carver’s workshop\
  \ is located.\n\n2.\n\nSelector (Video, Action Ordering): A video from a Mistport\
  \ workshop shows a carver working on driftwood pieces—first hollowing, then inlaying.\
  \ The video gap requires perceiving the action sequence (hollow \\rightarrow inlay)\
  \ to identify the correct carver among two at the workshop.\n\n3.\n\nAnswer (Audio,\
  \ Happy Tone): A voice message mentions two packing methods (“bundle-wrap” and “crate-pack”),\
  \ with happy tone toward “bundle-wrap”. The text transcript alone names both methods\
  \ neutrally; only the prosody discriminates.\n\nModalities required: Image (chess\
  \ set with background sign) \\rightarrow Video (carving action sequence) \\rightarrow\
  \ Audio (happy tone toward packing method). A text-only system would see captions\
  \ for all three but lose both the spatial background detail and the prosodic discriminator.\n\
  [S92] L.2 Example of Model Success (https://arxiv.org/html/2610.29249v1#A12.SS2)\n\
  A124: Question: “In the photo of my fondue set with the colour-coded forks, what\
  \ brand is stamped on the base?”\n\nExpected: “Lorraine”\n\nPredicted (RAG MM MiMo):\
  \ “Lorraine” Score: 1.0\n\nThe model correctly retrieved the image chunk (a photo\
  \ of a vintage cast-iron fondue set) and read the brand name “Lorraine” stamped\
  \ on the base. The brand was never mentioned in the chat text—only visible in the\
  \ image.\n[S93] L.3 Case Study: Audio Prosody Gap (MSR Selection) (https://arxiv.org/html/2610.29249v1#A12.SS3)\n\
  A125: Figure L.3 shows the evidence image from\n\nmm_msr_selection_ac58aedd_002.\
  \ The comparison below illustrates a\n\nTrack B failure mode discussed in §6: Caption-Text\
  \ loses the\n\nlabeled prosodic discriminator and selects the wrong entity; Native-MM\n\
  \npreserves it. Transcripts below are the released required-evidence utterances\n\
  \n(not paraphrases); see the selector note on the imperfect lexical cue.\n\nFigure\
  \ 12: Birding-log photo from item\n\nmm_msr_selection_ac58aedd_002. The answer-critical\
  \ detail\n\n(receipt price $189.99 under the black 10x42 pair) is only readable\
  \ in the\n\nimage; the chat text never states the price.\n\nQuestion: “What was\
  \ the price of the binoculars I sounded happier about?”\n\nExpected Answer: “$189.99”\
  \ (black 10x42 pair, identified by happy tone)\n\nChain structure (MSR Selection):\n\
  \n1.\n\nSelector (Audio, tone contrast): Required voice messages name both candidate\
  \ pairs without an explicit prefer/like lexicon:\n\n•\n\n“I also tried the Nikon\
  \ Monarch 5 8x42 while I was there, and then I gave the mossy oak 8x42 roof prism\
  \ a go right after.”\n\n•\n\n“So I went back and tried the other two binoculars\
  \ I was looking at—the Mossy Oak camo 8x42s and the black 10x42s. The black pair\
  \ really surprised me.”\n\nConstruction labels assign unhappy tone to the Mossy\
  \ Oak 8x42s and happy tone to the black 10x42s.\nA126:  The phrase “surprised me”\
  \ lexically singles out the black pair as the reacted-to entity, but it does not\
  \ explicitly encode positive polarity (e.g., prefer/happy); we therefore treat this\
  \ item as an imperfect Track B illustration of selector failure under ASR, not as\
  \ a pure lexical-neutrality exemplar.\n\n2.\n\nAnswer (Image, fine-grained attribute):\
  \ A photo of both pairs on a birding log with the receipt tucked under the black\
  \ pair. The price is never spoken—only readable in the image.\n[S94] L.4 Example\
  \ of Model Failure (https://arxiv.org/html/2610.29249v1#A12.SS4)\nA127: Question:\
  \ “After I sounded unhappy about the wedding postponement, what price did I list\
  \ the Ansel Adams print for in the photo?”\n\nExpected: “$450”\n\nPredicted (RAG\
  \ MM Gemini 3.5): “I don’t know.” Score: 0.0\n\nThe model failed to chain two pieces\
  \ of cross-modal evidence: (1) an audio message with unhappy tone about a wedding\
  \ postponement, and (2) a photo of an Ansel Adams print listing with a price. The\
  \ multi-hop chain required connecting the temporal “after” relationship across audio\
  \ prosody and image text, which the model could not complete.\n\nQuestion: “How\
  \ did my living room wall change in the video I took while repainting?”\n\n(mm_knowledge_update_bb832271_001;\
  \ type Knowledge Update)\n\nExpected: “from pale yellow with peeling paint to soft\
  \ sage green”\n\nPredicted (ReAct MM MiMo): “sage green” Score: 0.5 (Partial)\n\n\
  The item is a two-session knowledge update: an earlier image session shows the\n\
  \nold wall colour behind a herb garden (Selector, background detail),\n\nand a later\
  \ video session shows the repaint (Answer, state-transition\n\ngap). The model reported\
  \ only the new colour, missing the required\n\nold \\rightarrow new contrast.\n\
  [S95] Appendix M Key Prompts (https://arxiv.org/html/2610.29249v1#A13)\nA128: This\
  \ appendix documents the key LLM prompts used throughout the MOSAIC pipeline and\
  \ evaluation framework."
