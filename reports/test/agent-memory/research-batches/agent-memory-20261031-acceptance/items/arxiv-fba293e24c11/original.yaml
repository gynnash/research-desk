  \ of the retrieved native, production caps condition\n\n(top-20 units, three media\
  \ per modality;\n\nAppendix C.4). Across the 784 answerable items this\n\namounts\
  \ to 9,338 dropped artefacts—5,559 images, 593 videos, and 3,186\n\naudio clips.\
  \ The result is unusually clean: every dropped artefact is\n\nattributable to the\
  \ per-modality media-count cap. No chain member was lost to\n\ntoken limits, serialization\
  \ failures, or unsupported formats. Delivery loss in\n\nMOSAIC is therefore a budgeting\
  \ decision rather than an infrastructure failure,\n\nwhich is what makes it directly\
  \ actionable.\n\nDrop reason\n\nImage\n\nVideo\n\nAudio\n\nAll\n\nMedia-count cap\n\
  \n5,559\n\n593\n\n3,186\n\n9,338\n\nContext/token cap\n\n0\n\n0\n\n0\n\n0\n\nSerialization/API\
  \ error\n\n0\n\n0\n\n0\n\n0\n\nUnsupported format\n\n0\n\n0\n\n0\n\n0\n\nTotal dropped\
  \ artefacts\n\n5,559\n\n593\n\n3,186\n\n9,338\n\nTable 31: Retrieved-but-dropped\
  \ artefacts by modality and recorded drop reason,\n\nunder production delivery caps\
  \ (media-count cap applied per modality). The\n\nend-to-end condition shows the\
  \ same single-cause pattern (6,184 image, 587\n\nvideo, 2,533 audio; 9,304 total).\n\
  [S88] K.10 Per-Challenge Accuracy (https://arxiv.org/html/2610.29249v1#A11.SS10)\n\
  A120: Table 32 reports the best end-to-end system’s\n\njudge score by required challenge.\
  \ Read alongside the within-item interventions\n\n(§6.2), this localizes which signals\
  \ survive in a\n\ndeployed system rather than under gold delivery. Fine-grained\
  \ attributes score\n\nhighest (0.801) because the native channel resolves them directly\
  \ once\n\ndelivered, whereas background detail is the weakest image challenge (0.670):\n\
  \nthe target is by construction not the salient subject, so it survives neither\n\
  \ncaptioning nor a reader’s attention budget. Repetition count is the weakest\n\n\
  challenge overall (0.666), consistent with the video perception cost measured\n\n\
  in §6.1. On the prosody stratum ( N{=}399 ), the same\n\nper-challenge accounting\
  \ gives 0.361 for Track B Caption-Text Naive RAG,\n\n0.715 for Naive RAG Native-MM\
  \ (Gemini 3.5), and 0.740 for ReAct Native-MM\n\n(MiMo-V2.5)—the contrast quoted\
  \ in §6.2.\n\nChallenge (required)\n\nScore\n\nN\n\nImage — Background detail\n\n\
  0.670\n\n284\n\nImage — Fine-grained attribute\n\n0.801\n\n333\n\nImage — Spatial\
  \ configuration\n\n0.714\n\n185\n\nVideo — Action ordering\n\n0.773\n\n64\n\nVideo\
  \ — Action repetition count\n\n0.666\n\n56\n\nVideo — State transition\n\n0.697\n\
  \n64\n\nAudio — Prosody\n\n0.740\n\n399\n\nTable 32: Per-challenge judge score for\
