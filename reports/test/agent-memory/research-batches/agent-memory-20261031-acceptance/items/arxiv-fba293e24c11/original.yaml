  \ mean pairwise 92.7% (E1-E2=99%, E2-E3=90%, E1-E3=89%).\n\nQ3 (Evidence sufficient?):\
  \ mean pairwise 84.0% (E1-E2=84%, E2-E3=76%, E1-E3=92%).\n\nQ3 shows the highest\
