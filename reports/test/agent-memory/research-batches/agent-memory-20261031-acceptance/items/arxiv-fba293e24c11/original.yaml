      Table 15: Haystack scale comparison with prior conversational memory benchmarks.


      LoCoMo figures follow Maharana et al. (ACL 2024): 1,986 QA pairs, mean


      16.6K tokens and 27.2 sessions per conversation. MOSAIC session counts are


      per item; token budgets for MOSAIC/LongMemEval are per persona.


      MOSAIC occupies a distinct position in the benchmark landscape. At


      \sim 269K tokens per persona it is about 1.7\times LongMemEval’s


      per-persona budget ( \sim 158K) and about 16\times LoCoMo’s


      per-conversation budget ( \sim 17K), with a mean of 17.5 sessions per item.


      Individual MOSAIC sessions average \sim 1.2K tokens (evidence 840, filler


      1,213)—so the scale advantage is the large multimodal haystack around


      sparse required facts, not multi-kilotoken sessions. The 80.0% non-text


      fact rate is substantially higher than prior conversational memory suites:


      LoCoMo includes shared images in text dialogues but no video or audio, and


      LongMemEval is text-only. No prior benchmark combines all four modalities at


      this scale.'
    location: https://arxiv.org/html/2610.29249v1#A4
