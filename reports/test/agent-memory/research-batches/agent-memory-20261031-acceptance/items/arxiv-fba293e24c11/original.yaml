      Table 3: Matched write–retrieve–deliver–read


      decomposition on the 784 answerable items with the fixed Gemini 3.5 reader


      (Figure 3). Image/Video/Audio


      restrict to the 780/184/424 items whose chain needs that modality;


      Multi-hop to the 668 needing \geq 2 facts; Chain is


      complete-chain delivery into the request. Paired CIs (and W/T/L for write


      contrasts) are in Appendix K.


      We run seven matched conditions on the same 784 answerable QIDs


      (Table 3), changing only representation, retrieval, or


      delivery under one reader, prompt, packer, and judge. These are


      interventions rather than an assumed ranking: native evidence may remain


      perceptually difficult, and retrieved context may include useful evidence


      outside the minimal annotated chain.


      The main paired contrasts are symbolic versus native (perception cost),


      structured versus generic text (avoidable write-time compression), gold native


      versus retrieved-all-delivered (retrieval loss), and all-delivered versus


      production-capped requests (delivery loss). Delivery is additionally traced
      as a


      budget curve over tighter packer allowances (top-10 units; top-5 with one


      media item per modality). Residual errors under gold symbolic facts bound


      answer integration and grading error.'
    location: https://arxiv.org/html/2610.29249v1#S5.SS1
  - id: S17
    title: Frozen configuration.
    text: 'Matched conditions use Gemini 3.5 as the fixed omni-modal reader (temperature
      0;


      extended thinking disabled), held out from dataset construction: MiMo-V2.5 is


      the answerability probe, so using it as the primary reader would couple


      selection with evaluation. The trade-off is disclosed—gold-native failures


      mix perception error with bounded item noise


      (§6.1). Retrieval replays a frozen top-50 ranked


      manifest; the production budget delivers the top 20 units with at most three


      items per modality under a 100 MB media cap. Embedders, captioner/ASR,


      structured writer (query-blind MiMo-V2.5 schemas), and judge (Qwen3.7-Plus)


      are listed in Appendix C. MiMo-V2.5 as second reader on the


      120-item pilot reproduces the gold and budgeted stage ladder


      (Appendix K.2); uncapped all-delivered remains Gemini-only


      (MiMo timeouts under large multimodal payloads).'
    location: https://arxiv.org/html/2610.29249v1#S5.SS1.SSS0.Px1
  - id: S18
    title: 5.2 Within-Item Modality Interventions
    text: 'Within an item we change one required carrier while holding its question,


      evidence order, and every other hop fixed. Image variants are raw media,


      OCR-only text, object-only text, and a spatial description; video variants are


      raw video, ordered sparse frames, shuffled frames, and an ordered event/count


      description; audio variants are raw audio, ASR, ASR plus a gold


      prosody tag from the construction annotation (an upper bound on any prosody


      tagger), and ASR plus the swapped gold tag (happy \leftrightarrow unhappy).


      Image and video text variants use the same query- and answer-blind MiMo writer


      as the structured-write condition.


      Because every retained item was verified answerable from native evidence alone,


      a text-over-raw gap indicates a perception failure rather than a missing


      signal. Each contrast is restricted to the matching challenge stratum, and a


      per-condition leak audit verifies that non-intervened hops are unchanged.'
    location: https://arxiv.org/html/2610.29249v1#S5.SS2
  - id: S19
    title: 5.3 Two Architecture Tracks
    text: 'We separate two questions that end-to-end leaderboards conflate.


      In Track A (fixed reader), flat RAG over caption-text, omni-text, and


      native indexes, plus A-MEM (Xu et al., 2025) and


      MemoryOS (Kang et al., 2025), export retrieved context to one reader,


      prompt, packer, budget, and judge—comparing the useful evidence each


      backend produces. In Track B (native end-to-end), Naive RAG, repaired


      ReAct (Yao et al., 2023), A-MEM, and MemoryOS use their intended


      controllers and readers, measuring deployable capability descriptively


      because multiple components change at once.


      Three representations underlie both tracks


      (Appendix C): Caption-Text (VL captioner + ASR),


      Omni-Text (single omni LM captions that retain prosody Whisper


      discards; retrieval still textual), and Native-MM (multimodal


      embeddings + omni reader over raw artefacts). A-MEM and MemoryOS are


      text-derived only; ReAct results in Table 28 are adaptive (up to 5 iterative
      search steps; mean 1.91 searches, median 1). A one-search parity gate is applied
      first—the scaffold is restricted to a single retrieval and must match the corresponding
      Naive RAG run’s retrieval and delivery plumbing—and adaptive ReAct numbers are
      reported only after that gate passes.'
    location: https://arxiv.org/html/2610.29249v1#S5.SS3
  - id: S20
    title: 5.4 Metrics and Uncertainty
    text: 'The primary answer metric is a 0–1 semantic judge score from Qwen3.7-Plus


      (rubric in Appendix C) (Li et al., 2024), reported


      separately for the 784 answerable items, with correct-refusal and false-refusal


      rates paired so that an always-abstain system cannot appear calibrated.


      Retrieval and delivery use required-fact and complete-chain Recall@ k over both


      ranked units and units actually serialized into the request. Controlled


      comparisons are paired by QID with item-bootstrap 95% intervals and


      wins/ties/losses; a persona-clustered bootstrap is a dependence check.


      Reported intervals are per-contrast and unadjusted across the many paired


      tests and strata, so exploratory challenge-level nulls should be read


      cautiously. GLM-5.2 and Grok-4.5 evaluate each native end-to-end run


      (Appendix J); Appendix C documents


      manifests, media caps, and scoring; Appendix M reproduces the


      prompts.'
    location: https://arxiv.org/html/2610.29249v1#S5.SS4
  - id: S21
    title: 6 Results and Analysis
    text: 'All numbers come from one canonical paired run, and every stage claim uses
      only


      paired conditions with identical QIDs, readers, prompts, packers, and judges.
      A


      retrieved-but-dropped artefact counts as a delivery failure rather than a


      reading failure, and a write loss is claimed only where structured text recovers


      an error made with generic text.'
    location: https://arxiv.org/html/2610.29249v1#S6
  - id: S22
    title: 6.1 Overall Stage Decomposition (RQ1–RQ3)
    text: 'Figure 3: Decomposing the loss on the 784 answerable items under one fixed


      reader, prompt, packer, and judge (Table 3).


      (a) Descending the native pipeline: each arrow is a paired drop


      associated with the intervened stage under the matched protocol; the shaded


      band is residual reading error under gold symbolic facts. (b)


      Write-time representation only: generic captions/ASR cost 9.3 points; a


      query-blind structured writer recovers a statistically insignificant 1.4.


      Table 3 and Figure 3 associate


      each paired drop with the intervened stage under the matched protocol. Gold


      symbolic facts score 0.846, so 15.4 points of residual reading/grading error


      remain even with perfect evidence. Native gold evidence drops to 0.783


      (6.2-point perception cost [3.2, 9.3]); generic captions/ASR fall further to


      0.690 ( -9.3 vs. native), and the structured writer recovers only +1.4


      [ -0.9 , 3.7] to 0.704—a recovery indistinguishable from zero. Retrieval


      costs 7.6 points (0.783 \to 0.708 all-delivered [5.2, 9.9]) and production


      packing another 3.8 on identical ranked hits (0.708 \to 0.670 [1.5, 6.0]),


      with complete-chain delivery falling from 0.675 to 0.491; end-to-end native


      RAG reaches 0.653 ( +1.7 vs. the original-query budgeted condition is not


      material). Under this frozen reader and judge, reading is the largest single
      associated loss and the only


      stage whose dominance is stable across pipelines; among the rest, retrieval
      leads for native


      pipelines while write-time textualization leads for text-derived ones. These
      are matched-protocol associations, not universal causal bottlenecks: the 15.4-point
      gold-symbolic residual reflects reader, output-format, and judge error in addition
      to true reading failure.


      Appendix K gives paired CIs and write-contrast


      W/T/L; Appendix K.7 the per-type ladders.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS1
  - id: S23
    title: Perception cost is modality-dependent.
    text: 'Video items score 0.900 with symbolic facts but only 0.729 with native
      video


      (17.1-point perception cost), against 6.2 for image (0.847 \to 0.785) and none


      for audio (0.821 \to 0.826). For this fixed reader, video perception is a


      candidate bottleneck—not explained by retrieval or question difficulty alone.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS1.SSS0.Px1
  - id: S24
    title: Probe selection.
    text: 'Probe-pass ( n{=}740 ) and human-rescued ( n{=}44 ) items match under gold


      symbolic facts (0.846 vs. 0.845) but differ by 27.8 points under gold native


      evidence (0.799 vs. 0.520); absolute native scores are optimistic there, but


      paired comparisons remain interpretable under the matched protocol.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS1.SSS0.Px2
  - id: S25
    title: Delivery is the stage a retrieval-terminating decomposition cannot see.
    text: 'Figure 4 freezes the top-50 ranked manifest (required-fact


      Recall@50 =0.871 throughout) and varies only the packer. Halving the unit


      budget costs 5.7 points [3.3, 8.0]; one media item per modality jointly with
      the reduced top- k costs 17.7


      [14.5, 20.9] and collapses complete-chain delivery from 0.675 to 0.184


      (required-fact coverage 0.871 \to 0.501). The 17.7-point drop therefore reflects
      the combined effect of the top- k reduction and the one-media-per-modality cap
      together, not the media cap alone. Context construction, not ranking,


      is the binding constraint once media budgets tighten (numeric sweep in


      Appendix K.3).


      Figure 4: Delivery-budget sweep over a single frozen top-50 ranked manifest.


      Retrieval quality is constant (Recall@50 =0.871 ); only the packer’s allowance


      changes. One-media-per-modality packing collapses complete-chain delivery from


      0.675 to 0.184.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS1.SSS0.Px3
  - id: S26
    title: 6.2 Representation Loss by Modality (RQ1)
    text: 'Figure 5: Within-item paired effects on the governing challenge stratum


      (item-bootstrap 95% intervals). Filled markers exclude zero. Spatial structure


      is the signal for which no tested text surrogate is adequate.


      Figure 5 shows the paired effects on each governing challenge


      stratum; Appendix K.4 tabulates exact estimates


      and W/T/L.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS2
  - id: S27
    title: Visual signals are heavily compressed by textualization.
    text: 'On fine-detail and background items, OCR-only text loses 18.5 points to
      raw


      images [15.3, 21.6], and on spatial-configuration items raw images beat


      OCR-only text by 32.0 points. What is lost is specifically relational: on


      those same spatial-configuration items, an explicit spatial description recovers


      15.4 points over object-only text [9.5, 21.5], closing about a third of the


      43.3-point gap between object-only text and raw pixels. Naming the objects


      present is therefore not enough; the arrangement carries the fact, and a writer


      that is told to preserve arrangement recovers a substantial part of it—but


      only a part.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS2.SSS0.Px1
  - id: S28
    title: Temporal and prosodic signals show the opposite profile.
    text: 'Ordered sparse frames do not beat shuffled frames on action-ordering items


      ( -1.5 points [ -7.8 , 4.6]); event/count text matches sparse frames on


      repetition and state-transition items ( +1.4 [ -5.2 , 8.0] and +2.7 [ -5.0 ,


      10.6]); raw audio beats ASR by only 0.8 [ -1.5 , 3.0]; and a gold


      prosody tag adds only 1.5 [ -0.8 , 3.8] (394/450 ties). Under gold delivery


      these are ceilings on acoustic recovery once the transcript is in hand,


      not evidence that the gap is decorative. On the same 399 items, Native-MM substantially
      outperforms Caption-Text


      end-to-end (Appendix K.10), a write/retrieve exposure


      that gold delivery factors out. Video


      strata remain small ( n{=}56 – 64 unique QIDs); at 80% power the MDEs are


      8.9 – 11.2 points (Appendix F), so the nonsignificant video


      contrasts do not establish lossless temporal compression.


      Over 399 unique prosody QIDs, replacing the correct gold prosody tag with its


      opposite reduced score by 4.6 points [1.7, 7.7; W/T/L 46/330/23]


      (Appendix K.4, Figure 5): the


      annotated selector is causally load-bearing under gold delivery, even though


      raw audio versus ASR remains inconclusive.'
    location: https://arxiv.org/html/2610.29249v1#S6.SS2.SSS0.Px2
  - id: S29
    title: 6.3 Fixed-Reader Comparison (RQ2)
    text: 'Backend / representation


      Chain R@ k


