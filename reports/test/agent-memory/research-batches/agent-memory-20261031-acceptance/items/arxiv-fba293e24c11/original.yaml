      the primary LLM judge was \kappa=0.79 and \kappa=0.69 respectively (within-one-band
      88% and 90%; human-mean \kappa=0.82 ). Disagreements are concentrated in adjacent
      bands where partial credit is genuinely ambiguous, consistent with the three-LLM-judge
      pattern above. We report mean partial-credit judge scores throughout rather
      than exact match.


