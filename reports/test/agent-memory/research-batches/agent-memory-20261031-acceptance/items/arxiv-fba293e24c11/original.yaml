  - id: S88
    title: K.10 Per-Challenge Accuracy
    text: 'Table 32 reports the best end-to-end system’s


      judge score by required challenge. Read alongside the within-item interventions


      (§6.2), this localizes which signals survive in a


      deployed system rather than under gold delivery. Fine-grained attributes score


      highest (0.801) because the native channel resolves them directly once


      delivered, whereas background detail is the weakest image challenge (0.670):


      the target is by construction not the salient subject, so it survives neither


      captioning nor a reader’s attention budget. Repetition count is the weakest


      challenge overall (0.666), consistent with the video perception cost measured


      in §6.1. On the prosody stratum ( N{=}399 ), the same


      per-challenge accounting gives 0.361 for Track B Caption-Text Naive RAG,


      0.715 for Naive RAG Native-MM (Gemini 3.5), and 0.740 for ReAct Native-MM


      (MiMo-V2.5)—the contrast quoted in §6.2.


