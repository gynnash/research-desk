      cover 1,555/1,582 required non-text facts; the 27 untagged residuals are


      26 required audio facts without a tone field and 1 image fact without a


      visual strategy (release audit of


      stage2_human_filtered).


      The gap strategy distribution reveals three design priorities. First,


      fine-grained attributes (388 required-fact occurrences over 333 items; e.g.,


      brand names, prices, or labels) constitute the largest image gap, reflecting


      the prevalence of text-bearing visual evidence in real-world omni-modal


      interactions. Background detail (328 facts / 284 items) and spatial


      configuration (194 / 185) together ensure that models must attend to the full


      visual field rather than fixating on salient foreground objects. Second, video


      gaps are deliberately balanced across action ordering (67), repetition count


      (64), and state transition (64). Third, tagged audio prosody is the single most


      frequent gap strategy: 450 required-fact occurrences across 399 answerable


      items (50.9% of 784). Prosody is an intrinsic property of voice messages that


      text transcripts discard, so caption-based pipelines are exposed on a large


      fraction of the release.


