  - id: S13
    title: Appendix B Protocols
    text: 'Mem0 OSS 2.1.0 writes one chronological turn at a time and retrieves k=200
      without reranking; dates are prepended to the text. Zep runs Graphiti OSS 0.30.2
      on Kuzu, one session per episode, with hybrid edge search (top 20). The memory
      methods’ GPT-6 Luna and Claude Opus 5.5 requests set reasoning effort high.


      Each agent question is a Harbor 0.24.0 task [19]: a fresh container holding
      only the conversation, exactly as in the official file, without questions or
      answers. The agent’s last message is its answer. While the agent runs, the container
      can reach only the model endpoint. GPT-6 Luna and Claude Opus 5.5 run at reasoning
      effort high, through a proxy that translates the API where an agent does not
      speak the model’s own; GPT-4o-mini has no effort setting. Codex and Claude Code
      have web search off; Pi has none. A question may take 20 minutes, and Pi and
      Claude Code at most 100 turns. With GPT-6 Luna, Codex picks its code mode: one
      JavaScript tool that calls the shell. A trial that fails or ends without an
      answer is run again, and only the accepted trial is counted.'
    location: https://arxiv.org/html/2610.29823v1#A2
  - id: S14
    title: Appendix C Prompts
    text: 'Each prompt is copied from the code the runs called; fields in braces are
      filled per question.


      Answer, system message.


      ⬇


      You are a helpful assistant that can answer questions based on the provided
      context.If the question involves timing, use the conversation date for reference.Provide
      the shortest possible answer.Use words directly from the conversation when possible.Avoid
      using subjects in your answer.


      Answer, user message.


      ⬇


      # Question:


      {{QUESTION}}


      # Context:


      {{CONTEXT}}


      # Short answer:


      Pi, Codex and Claude Code, user message.


      ⬇


      Answer a question about the conversation in `conv-26/conv.json`. If the question
      involves timing, use the conversation date for reference. Provide the shortest
      possible answer. Use words directly from the conversation when possible. Avoid
      using subjects in your answer. Your final message is taken as the answer.


      Question: {question}


      Judge.


      ⬇


      Your task is to label an answer to a question as ’CORRECT’ or ’WRONG’. You will
      be given the following data:


      (1) a question (posed by one user to another user),


      (2) a ’gold’ (ground truth) answer,


      (3) a generated answer


      which you will score as CORRECT/WRONG.


      The point of the question is to ask about something one user should know about
      the other user based on their prior conversations.


      The gold answer will usually be a concise and short answer that includes the
      referenced topic, for example:


      Question: Do you remember what I got the last time I went to Hawaii?


      Gold answer: A shell necklace


      The generated answer might be much longer, but you should be generous with your
      grading - as long as it touches on the same topic as the gold answer, it should
      be counted as CORRECT.


      For time related questions, the gold answer will be a specific date, month,
      year, etc. The generated answer might be much longer or use relative time references
      (like "last Tuesday" or "next month"), but you should be generous with your
      grading - as long as it refers to the same date or time period as the gold answer,
      it should be counted as CORRECT. Even if the format differs (e.g., "May 7th"
      vs "7 May"), consider it CORRECT if it''s the same date.


      Now it''s time for the real question:


      Question: {question}


      Gold answer: {gold_answer}


      Generated answer: {generated_answer}


      First, provide a short (one sentence) explanation of your reasoning, then finish
      with CORRECT or WRONG.


      Do NOT include both CORRECT and WRONG in your response, or it will break the
      evaluation script.


      Just return the label CORRECT or WRONG in a json format with the key as "label".'
