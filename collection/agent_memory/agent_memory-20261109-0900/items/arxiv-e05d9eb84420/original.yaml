  [S38] Controlled intervention (https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px1)

  A55: All layouts use the same atomic memory items, BM25 baseline ranking, total
  candidate budget, question set, source packet scheduler, semantic frontier, Reader,
  and Judge. Evaluation is read-only with respect to persistent memory.

  [S39] Flat (https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px2)

  A56: Flat disables Cell-derived candidates rather than placing all items in one
  container. Its candidate sequence is the BM25-only sequence used by the no-Cell
  endpoint. Flat establishes the candidate recall of 0.8154 against which every structured
  layout is measured.

  [S40] Bounded Cells (https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px3)

  A57: For every new item, all capacity-feasible existing Cells compete with a new
  Cell under the placement objective in Eq. 4. The resulting organization jointly
  reflects person and keyword locality, session proximity, coherence, conflict avoidance,
  capacity, and entropy pressure. The policy is deterministic and accumulative, not
  a gradient-trained clustering model. The bouned cell layout improves recall by 3.959
  points.

  [S41] Sequential (https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px4)

  A58: Sequential orders items by session index and then by dialogue identifier within
  each session order, and partitions the resulting sequence into fixed-length contiguous
  blocks. It discards people, keywords, coherence, and conflict signals, retaining
  only dialogue adjacency. This layout tests whether simple sequential locality accounts
  for the Cell benefit.

  [S42] Session (https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px5)

  A59: Session first groups items by session index, preserves their within-session
  order, and partitions each session independently into fixed-length blocks. Comparing
  Session with Sequential therefore isolates the value of the dataset’s session boundaries.

  [S43] Entity (https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px6)

  A60: Entity assigns each item to a bucket keyed by its primary person entity, orders
  each bucket by dialogue order, and partitions it into fixed-length blocks. It tests
  person identity as a cross-turn and cross-session address without using the complete
  placement objective. Entity layout improves the recall by 2.910 points. The result
  identifies person locality as a useful but incomplete component of the persistent
  organization.


