  [S23] Multiple hits repeatedly occupy the same source slots (https://arxiv.org/html/2610.23313v1#S4.SS4.SSS0.Px1)

  A33: Table 5 exposes the mismatch between hit count and source coverage. A Top-20
  ranking contains 20 hits but only 14.60 distinct sources on average while same-source
  hits consume 27.02% of the nominal budget and affect 97.27% of questions. Thus adding
  hits or channels does not translate directly into broader evidence coverage.

  [S24] source normalization releases duplicate address slot (https://arxiv.org/html/2610.23313v1#S4.SS4.SSS0.Px2)

  A34: Table 3 indicates that standard text deduplication provides almost no improvement
  against directly sending top-10 claims into the reader. While Source normalization
  instead resolves every hit to its SourcePacket key before applying the budget, yielding
  a significant but moderate Gold Recall gain of 3.35 pp.

  [S25] Complementary scheduling converts released capacity into coverage (https://arxiv.org/html/2610.23313v1#S4.SS4.SSS0.Px3)

  A35: Complementary scheduling reallocates the normalized slots toward sources that
  add missing support. Crucially, the number of distinct sources remains 9.988 and
  DBR remains zero, while Gold Recall rises from 51.91% to 80.84%—a +28.93 pp gain
  [26.81, 31.14]. Figure 4 also shows the same large scheduling gain in every category.
  The contrast separates the two mechanisms: normalization prevents redundant sources
  from consuming the budget; scheduling determines which complementary sources fill
  that budget.

  [S26] 4.5 RQ4: Analysis of Reader Evidence Granularity (https://arxiv.org/html/2610.23313v1#S4.SS5)

  A36: Table 4 isolates evidence presentation by holding the final SourcePacket exactly
  constant. Compressing each selected packet to a single representative claim reduces
  Judge from 80.52% to 57.01% indicating that aggressive compression can discard answer-bearing
  relations, temporal qualifiers, and other context needed to interpret an otherwise
  correct source.


  Presenting the raw SourcePacket recovers much of this loss, reaching 75.32% Judge,
  but remains significantly below the complete claim bundle. The compiled bundle preserves
  the relations and qualifications lost by single-claim compression while filtering
  the conversational noise retained by raw dialogue. This fixed-source comparison
  isolates evidence presentation as a separate design problem from source recovery.

  [S27] 4.6 Ablation Study (https://arxiv.org/html/2610.23313v1#S4.SS6)

  A37: Table 2 compares controlled pipeline paths while


  holding the frozen memory and claim-bundle Reader fixed. The full system


  achieves the strongest performance across all reported metrics.


  A0-A3 separate the effects of anchor construction and subsequent


  frontier expansion. These comparisons reveal that frontier expansion compensates
  most strongly for weaker deterministic anchors, while complementary packet scheduling
  produces a stronger initial evidence set and reduces reliance on later expansion.


  The A4 and A5 variants show an asymmetric complementarity between


  BM25 and Cell routing. BM25 provides the stronger standalone route,


  whereas adding Cell-derived candidates to BM25 supplies non-redundant


  evidence that improves the full pipeline. A6 further suggests that


  structured query intent primarily improves evidence prioritization rather


  than source coverage while A7 shows that directly retrieving the dense


  cosine Top-10 SourcePackets and presenting their claim bundles to the


  Reader does not match the compiled pipeline.


