  - id: S38
    title: Controlled intervention
    text: All layouts use the same atomic memory items, BM25 baseline ranking, total
      candidate budget, question set, source packet scheduler, semantic frontier,
      Reader, and Judge. Evaluation is read-only with respect to persistent memory.
    location: https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px1
  - id: S39
    title: Flat
    text: Flat disables Cell-derived candidates rather than placing all items in one
      container. Its candidate sequence is the BM25-only sequence used by the no-Cell
      endpoint. Flat establishes the candidate recall of 0.8154 against which every
      structured layout is measured.
    location: https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px2
  - id: S40
    title: Bounded Cells
    text: For every new item, all capacity-feasible existing Cells compete with a
      new Cell under the placement objective in Eq. 4. The resulting organization
      jointly reflects person and keyword locality, session proximity, coherence,
      conflict avoidance, capacity, and entropy pressure. The policy is deterministic
      and accumulative, not a gradient-trained clustering model. The bouned cell layout
      improves recall by 3.959 points.
    location: https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px3
  - id: S41
    title: Sequential
    text: Sequential orders items by session index and then by dialogue identifier
      within each session order, and partitions the resulting sequence into fixed-length
      contiguous blocks. It discards people, keywords, coherence, and conflict signals,
      retaining only dialogue adjacency. This layout tests whether simple sequential
      locality accounts for the Cell benefit.
    location: https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px4
  - id: S42
    title: Session
    text: Session first groups items by session index, preserves their within-session
      order, and partitions each session independently into fixed-length blocks. Comparing
      Session with Sequential therefore isolates the value of the dataset’s session
      boundaries.
    location: https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px5
  - id: S43
    title: Entity
    text: 'Entity assigns each item to a bucket keyed by its primary person entity,
      orders each bucket by dialogue order, and partitions it into fixed-length blocks.
      It tests person identity as a cross-turn and cross-session address without using
      the complete placement objective. Entity layout improves the recall by 2.910
      points. The result identifies person locality as a useful but incomplete component
      of the persistent organization.


      Figure 5: Cell-placement contribution to recall. Bars are


      gains over Flat construction; translucent bands and dashed endpoints show


      conversation-bootstrap 95% intervals.'
    location: https://arxiv.org/html/2610.23313v1#A2.SS4.SSS0.Px6
  - id: S44
    title: C.1 LoCoMo Protocol
    text: 'The LoCoMo evaluation contains 1,540 questions from ten conversations and
      retains the benchmark’s single-hop, multi-hop, temporal, and open-domain categories.
      Memory construction receives conversation sessions only. Query text is exposed
      to query-intent extraction and retrieval at evaluation time; answers, question
      categories, gold evidence, and judge labels are not inputs to construction,
      addressing, scheduling, frontier selection and answer generation. Evaluation
      is read-only with respect to persistent memory state.


