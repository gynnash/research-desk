  [S47] C.3 Reader Views (https://arxiv.org/html/2610.23313v1#A3.SS3)

  A66: The representative-claim view renders the highest-scoring address claim for


  each selected source. The raw-source view renders the packet’s text and, when


  present, its image caption and query fields. The claim-bundle view renders all


  retained claims linked to the selected packet in construction order. Packet


  selection and ordering are held fixed across the three views.

  [S48] Appendix D LongMemEval Results (https://arxiv.org/html/2610.23313v1#A4)

  A67: LongMemEval examples are converted into the same neutral session/turn schema
  used by LoCoMo. Each official haystack session retains its identifier and date;
  each turn receives a stable identifier formed from the session ID and turn position.
  The system constructs a separate memory for each evaluation instance and applies
  the same source-linked descriptor, Cell routing, SourcePacket scheduling, semantic
  frontier, and reader compilation pipeline. The official question types comprise
  single-session user, single-session


  assistant, single-session preference, temporal reasoning, knowledge update, and
  multi-session questions. Answer-session and turn-level evidence labels are used
  only for offline evidence evaluation. On LongMemEval-S, MemCompile achieves the
