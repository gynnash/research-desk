  [S21] 4.2 RQ1: Analysis of End-to-End Quality and Cost (https://arxiv.org/html/2610.23313v1#S4.SS2)

  A29: On LoCoMo, Table 1 shows that MemCompile ranks first on all reported single-hop,
  multi-hop, and temporal metrics and obtains the best overall F1/BLEU/Judge scores
  of 55.94/48.65/80.52. Besides the dominant performance on Single-Hop, MemCompile
  achieves substantial improvements over the strongest baseline on Multi-Hop and Temporal,
  increasing the J score by 8.69 and 7.79 percentage points. This consistent enhancement
  across direct, compositional, and time-sensitive queries confirms the effectiveness
  of separating multi-view addressing from source-budgeted evidence compilation: source
  normalization preserves precise direct recall, while complementary scheduling and
  packet-scoped rendering remain effective when evidence is distributed across sources
  or time.


  Figure 3 illustrates the corresponding quality-cost trade-off. Compared with Mem0,
  MemCompile improves Judge by 14.35 points while using 51.7% fewer tokens (26.72M
  vs. 55.30M). AtomMem provides the closest cost comparison: MemCompile uses only
  8.8% more tokens (26.72M vs. 24.55M), yet improves overall Judge by 10.01 points.
  Thus, although MemCompile does not minimize absolute token usage, it converts a
  moderate computational budget into substantially higher answer quality and extends
  the empirical frontier to 80.52% Judge. The detailed per phase cost accounting is
  in Appendix E.



  A30: On LongMemEval-S, MemCompile shows strong cross-benchmark performance. On temporal
  reasoning and single-session assistant, MemCompile increases the J score by 24.1
  and 50 percentage points comparing with Mem0. Table 7 in Appendix D reports the
  full results.

  [S22] 4.3 RQ2: Analysis of Cell Placement (https://arxiv.org/html/2610.23313v1#S4.SS3)

  A31: We first compare five placement layouts that organize the same memory items
  under a fixed candidate budget. Detailed


  layouts definitions are provided in


  Appendix B.4. Figure 5 shows that structured placement improves candidate recovery
  across complementary query types. Bounded Cell produces the largest gains on single-hop
  and multi-hop questions, increasing recall by 5.13 percentage points (pp) and 3.42
  pp, respectively. It also improves temporal recall by 1.71 pp and open-domain recall
  by 2.78 pp.


  The upstream coverage improvement carries into the Evidence Plane. Removing Cell-routed
  candidates while keeping the downstream scheduler and evidence compilation pipeline
  fixed reduces final recall to 81.54%, a decrease of 3.96 percentage points, F1 to
  52.31, BLEU-1 to 45.14, and Judge to 77.53%. Cell placement expands the set of answer-relevant
  addresses available to the Evidence Plane, and the downstream pipeline converts
  this additional source coverage into measurable answer-quality gains.


