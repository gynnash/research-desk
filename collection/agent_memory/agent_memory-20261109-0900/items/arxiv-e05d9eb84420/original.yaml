material: '[S1] From Memory Hits to Answerable Evidence: Query-Conditioned Memory
  Compilation for Long-Term Agent Memory (https://arxiv.org/html/2610.23313v1)

  A1: Shangze Li


  Affiliation: State Key Laboratory of Cognitive IntelligenceUniversity of Science
  and Technology of China, Hefei, China


  {lishangze ,yyyao, derongxu}@mail.ustc.edu.cn, {zhengzhi97, tongxu}@ustc.edu.cn


  Yanyu Yao


  Affiliation: State Key Laboratory of Cognitive IntelligenceUniversity of Science
  and Technology of China, Hefei, China


  {lishangze ,yyyao, derongxu}@mail.ustc.edu.cn, {zhengzhi97, tongxu}@ustc.edu.cn


  Derong Xu


  Affiliation: State Key Laboratory of Cognitive IntelligenceUniversity of Science
  and Technology of China, Hefei, China


  {lishangze ,yyyao, derongxu}@mail.ustc.edu.cn, {zhengzhi97, tongxu}@ustc.edu.cn


  Zhi Zheng


  Affiliation: State Key Laboratory of Cognitive IntelligenceUniversity of Science
  and Technology of China, Hefei, China


  {lishangze ,yyyao, derongxu}@mail.ustc.edu.cn, {zhengzhi97, tongxu}@ustc.edu.cn


  Tong Xu


  Affiliation: State Key Laboratory of Cognitive IntelligenceUniversity of Science
  and Technology of China, Hefei, China


  {lishangze ,yyyao, derongxu}@mail.ustc.edu.cn, {zhengzhi97, tongxu}@ustc.edu.cn

  [S2] Abstract (https://arxiv.org/html/2610.23313v1#abstract1)

  A2: Long-term agent memory requires recovering answer-relevant evidence dispersed
  across turns and sessions. Existing systems increasingly use structured memories
  and adaptive retrieval, yet often pass retrieved or expanded units directly to the
  reader, coupling memory addressing with evidence presentation and leaving the final
  context redundant or incomplete. To address this gap, we propose MemCompile, a query-conditioned
  evidence compilation framework for long-term conversational memory. Given a query,
  the Address Plane locates relevant support through compact source-linked descriptors
  and capacity-aware Cells, while a normalization boundary resolves heterogeneous
  retrieval hits to stable SourcePacket identities. Its Evidence Plane then allocates
  a bounded evidence budget across complementary packets, admits limited additional
  support, and renders the retained claims associated with each selected packet into
  an answer-ready context. MemCompile achieves 80.52% Judge Accuracy on LoCoMo and
  extends the empirical quality–cost Pareto frontier to a higher-quality regime. Its
  strong performance on LongMemEval-S further suggests that the benefits of query-conditioned
  compilation generalize across long-term conversational-memory benchmarks.


  The implementation code is publicly available at https://github.com/MINE-USTC/MemCompile


  Figure 1: Motivation and overview of MemCompile.



  A3: Existing memory systems face different trade-offs in retrieval units


  and evidence representation. MemCompile addresses these challenges


  through source-normalized retrieval, complementary evidence selection,


  and packet-scoped reader-view compilation.

  [S3] 1 Introduction (https://arxiv.org/html/2610.23313v1#S1)

  A4: Long-term memory is essential for interactive agents to sustain coherent, personalized,
  and reliable behavior across sessions. By carrying forward user preferences, past
  events, commitments, and evolving states, it allows an agent to respond in light
  of what has happened before Maharana et al. (2024); Wu et al. (2025). However, the
  information needed for a new query may be distributed across distant turns and sessions
  or revised by later interactions. Persistent interaction therefore depends not only
  on retaining past information, but also on making the relevant parts of an accumulated
  history accessible when needed.


  Foundational long-term memory systems addressed this need by extracting and retrieving
  salient records, including persistent memories and atomic conversational facts Zhong
  et al. (2023); Chhikara et al. (2025). Subsequent work improved access by compressing
  dialogue into facts, notes, summaries, profiles, and events, and by organizing these
  representations in graphs or hierarchies Xu et al. (2025); Rasmussen et al. (2025);
  Liu et al. (2026); Yao et al. (2026). As retrieval representations became increasingly
  compact and structured, recent work began to distinguish the units used to locate
  memory from the evidence exposed to the reader.

  A5:  AnchorMem reconstructs immutable contexts from retrieved fact anchors, xMemory
  adaptively discloses segments or raw messages from a hierarchy, and MemIR projects
  heterogeneous retrieval cues into provenance-scoped claim bundles Shen et al. (2026);
  Hu et al. (2026); Jin et al. (2026). Together, these developments move long-term
  memory systems from improving addressability toward separating memory location from
  evidence presentation.


  However, this separation remains incomplete: the retrieved representation, or the
  expansion attached to it, still largely determines the context presented to the
  reader. Existing systems therefore do not fully separate two decisions: which underlying
  conversation sources should receive the limited evidence budget, and how evidence
  from those sources should be represented for answer generation. This coupling is
  problematic because the two decisions favor different properties. Address representations
  should be compact, discriminative, and broad enough to support reliable recall,
  whereas reader evidence should preserve relevant qualifications, connect complementary
  facts, and avoid unnecessary context. When a single unit serves both purposes, the
  system must accept a fixed trade-off. As illustrated in Figure 1, an atomic claim
  may be easy to retrieve but may omit causal relationships or sibling facts from
  the same source.

  A6:  A raw turn preserves such details but may reintroduce noise, such as greetings
  and irrelevant dialogue, whereas a hierarchy node can provide an effective navigation
  unit without matching the granularity required for answer generation. Moreover,
  without an explicit source-level boundary, multiple claims or retrieval channels
  may allocate context budget repeatedly to the same underlying source. This coupling
  not only creates avoidable quality loss after successful retrieval, but also makes
  it difficult to distinguish failures of source recovery from failures of evidence
  presentation.


  In this paper, we propose MemCompile, a source-normalized evidence compiler for
  long-term conversational memory. Its central principle is to locate relevant information
  through compact representations and allocate the evidence budget at the level of
  original dialogue turns while generating from a separately compiled reader view.
  MemCompile realizes this principle through an Address–Evidence two-plane architecture.
  The Address Plane organizes source-linked atomic descriptors into capacity-bounded
  Cells and combines diminishing-benefit Cell routing with lexical retrieval to construct
  primary source candidates while a broader dense packet pool supplies proposals for
  bounded semantic refinement.

  A7:  An explicit normalization boundary resolves these heterogeneous results to
  stable SourcePacket identities, ensuring that one underlying source occupies one
  evidence unit regardless of how many descriptors or channels locate it. The Evidence
  Plane then selects complementary packet identities, preserves the initial anchors
  while admitting bounded additional support, completes evidence within each selected
  packet, and compiles the result into a reader-facing view. By separating packet
  selection from textual rendering, MemCompile can optimize and evaluate source recovery
  and evidence presentation as distinct decisions.


  Our main contributions are summarized as follows:


  •


  We formulate long-term memory serving as query-conditioned evidence compilation,
  distinguishing two decisions that are commonly coupled: which underlying sources
  receive the evidence budget and how evidence from those sources is represented to
  the reader.


  •


  We introduce MemCompile, an Address–Evidence two-plane architecture that addresses
  memory through compact derived views, allocates evidence budget at the level of
  immutable SourcePackets, and generates from a separately compiled reader view.


  •


  Comprehensive evaluations on long-term memory


  benchmarks demonstrate that MemCompile consistently outperforms state-of-the-art
  baselines while extending the empirical quality–cost Pareto frontier.

  A8:  On the LoCoMo benchmark, packet-scoped compilation improves F1 by 15.26 points
  and Judge Accuracy by 23.51 points over representative-claim rendering.

  [S4] Structured long-term memory for LLM agents (https://arxiv.org/html/2610.23313v1#S2.SS0.SSS0.Px1)

  A9: Early long-term memory systems store and retrieve salient interaction records
  to support persistent personalization and multi-session reasoning. MemoryBank combines
  retrieval with time-dependent forgetting and memory reinforcement, while Mem0 extracts
  and consolidates conversational facts into vector- and graph-based stores Zhong
  et al. (2023); Chhikara et al. (2025). Subsequent systems construct richer memory
  organizations. A-MEM creates dynamically linked notes whose attributes and relations
  evolve as new experiences arrive while Zep represents evolving conversational knowledge
  in a temporal graph Xu et al. (2025); Rasmussen et al. (2025). Other approaches
  improve information density or associative access through


  semantic compression, atomic facts, profiles, events, and higher-level memory scenes
  Liu et al. (2026); Yao et al. (2026).

  [S5] Reconstructive and adaptive memory access (https://arxiv.org/html/2610.23313v1#S2.SS0.SSS0.Px2)

  A10: Recent systems recognize that a representation useful for locating memory need
  not be self-contained answer evidence. AnchorMem retrieves atomic facts as anchors
  and reconstructs their associated raw contexts and events Shen et al. (2026). xMemory
  organizes intact memory units into a revisable hierarchy and adaptively discloses
  episodes or raw messages when additional


  detail reduces reader uncertainty Hu et al. (2026). MemIR takes a typed approach,
  separating raw evidence, retrieval cues, and truth-bearing claims, and projecting
  heterogeneous hits into provenance-scoped claim bundles exposed through a normalized
  fact


  interface Jin et al. (2026). MemCompile builds on the shared insight that retrieval
  representations and answer evidence serve different purposes, but places its architectural
  boundary at a different level. MemCompile instead resolves derived


  address results to immutable SourcePacket identities before evidence selection.
  This source-normalized boundary makes it possible to vary and evaluate reader representation
  while holding the selected source set fixed.

  [S6] 3.1 Problem Formulation (https://arxiv.org/html/2610.23313v1#S3.SS1)

  A11: Let a conversational history be


  \mathcal{H}=(\mathcal{P},\prec) , where


  \mathcal{P}=\{p_{1},\ldots,p_{N}\} contains the original dialogue turns


  and \prec denotes their temporal order. Each turn p_{i} includes its


  speaker, session, interaction time, and content. Given a query q , the


  task is to construct an ordered and bounded reader context X_{q} grounded


  in \mathcal{H} . The context should contain sufficient and complementary


  support for answering q , preserve traceability to the original dialogue


  turns, and limit irrelevant or redundant content.

  [S7] 3.2 Address Plane (https://arxiv.org/html/2610.23313v1#S3.SS2)

  A12: MemCompile instantiates each original turn p_{i}\in\mathcal{P} as an


  immutable SourcePacket that stores its speaker, session, interaction


  time, raw content, and stable identifier. The Address Plane builds compact source-linked
  descriptors and organizes them for complementary retrieval. Its objective is to
  preserve source coverage under fixed limits on opened Cells and sparse and dense
  candidate pools.


  Figure 2: The overall architecture of MemCompile

  [S8] 3.2.1 Source-Linked Atomic Descriptors (https://arxiv.org/html/2610.23313v1#S3.SS2.SSS1)

  A13: From immutable SourcePackets, MemCompile constructs the descriptor


  set \mathcal{X}=\{x_{1},\ldots,x_{M}\} . Each descriptor retains a foreign key to
  its owning SourcePacket,


  \pi:\mathcal{X}\rightarrow\mathcal{P}.


  (1)


  For each SourcePacket, a large language model extracts standalone factual claims
  while


  using the immediately preceding turn to resolve local references. A retained


  descriptor is


  \displaystyle x_{i}=\bigl(f_{i},d_{i},s_{i},j_{i},t_{i},\mathsf{Per}_{i},\mathsf{Key}_{i},\tau_{i},\bar{\tau}_{i},n_{i},\pi_{i}\bigr),


  (2)


  where f_{i} is the claim text, d_{i} is the dialogue-turn identifier, s_{i}


  is the speaker, j_{i} is the session index, and t_{i} is the recorded session


  time. \mathsf{Per}_{i} and \mathsf{Key}_{i} are the extracted people and


  keyword sets; \tau_{i} and \bar{\tau}_{i} are the described-event time and


  interaction time; n_{i} is the claim token count; and


  \pi_{i}\in\mathcal{P} is its SourcePacket foreign key. Claims provide sparse


  and semantic retrieval keys while preserving a path to their originating


  dialogue evidence.

  [S9] 3.2.2 Bounded Cell Placement (https://arxiv.org/html/2610.23313v1#S3.SS2.SSS2)

  A14: Cells are capacity-constrained routing structures over atomic descriptors.


  Let \mathcal{C} be the set of Cells. Descriptor x_{i} is feasible for cell c only
  if


  \operatorname{Token}(c)+n_{i}\leq B_{C},\qquad|c|<M_{C},


  (3)


  where B_{C} is the token capacity and M_{C} is the item capacity. A feasible


  Cell is scored by


  \displaystyle S_{\mathrm{place}}(i,c)={}


  \displaystyle L(i,c)+\beta C(i,c)


  (4)


  \displaystyle}{\displaystyle-\gamma X(i,c)-\eta E(i,c),


  where L , C , X , and E respectively measure metadata locality, weighted


  keyword–person–time coherence, polarity inconsistency, and capacity/entropy


  pressure. Creating a new Cell is an additional candidate with expansion


  pressure 0.65+n_{i}/B_{C} . The highest-scoring candidate receives x_{i} .


  Placement is serialized in dialogue and claim order, producing a fixed Cell


  layout before query serving. Appendix B


  specifies every score component, hyperparameter, and stopping condition.

  [S10] 3.2.3 Diminishing-Benefit Cell Routing (https://arxiv.org/html/2610.23313v1#S3.SS2.SSS3)

  A15: For a query q , we calculate the query relevance u(c,q) for each cell based
  on the normalized query term set of q and the person set.


  Given the set of memory units \mathcal{O}_{t} opened before round t , the marginal
  benefit of candidate memory cell c is denoted as g(c\mid\mathcal{O}_{t},q) :


  g(c\mid\mathcal{O}_{t},q)=u(c,q)\left[1-\lambda_{R}J\!\left(M_{c},M_{\mathcal{O}_{t}}\right)\right]-\kappa_{\mathrm{open}}


  (5)


  Here, u(c,q) combines keyword, person, time, and density signals and J(A,B) denotes
  Jaccard similarity between two sets.


  M_{c} contains the Cell’s people and keywords, and M_{\mathcal{O}_{t}} is their


  cumulative set over opened Cells. The implementation sets \lambda_{R}=0.45


  and defines \kappa_{\mathrm{open}} as an opening cost that increases with the number
  of


  opened Cells plus a token-proportional reading cost. Cells are opened greedily


  until the marginal gain or relative-utility criterion fails, the cumulative


  utility reaches its threshold, or the six-Cell cap is reached. Exact


  weights and stopping conditions appear in Appendix B.3.

  [S11] 3.2.4 Multi-Channel Candidate Union (https://arxiv.org/html/2610.23313v1#S3.SS2.SSS4)

  A16: BM25 ranks all atomic descriptors and supplies a lexical channel alongside


  Cell routing; its top eight descriptors also act as Cell-routing seeds. Let


  \mathcal{C}_{q} denote the opened Cell set, the complete address candidate pool
  is


  \displaystyle\mathcal{K}_{q}={}


  \displaystyle\bigcup_{c\in\mathcal{C}_{q}}\operatorname{claims}(c){}\cup\operatorname{BM25}(q),


  (6)


  where \operatorname{BM25}(q) denotes the top 96 lexical candidates.


  For x_{i}\in\mathcal{K}_{q} , let \mathsf{Term}_{i} be the normalized claim


  terms and let b_{i} be its normalized BM25 score, or zero when it is not


  returned by the lexical channel. Its candidate score is


  \displaystyle r_{i}={}


  \displaystyle\alpha_{f}J(\mathsf{Term}_{q},\mathsf{Term}_{i})+\alpha_{k}J(\mathsf{Term}_{q},\mathsf{Key}_{i})


  (7)


  \displaystyle+\alpha_{p}J(\mathsf{Per}_{q},\mathsf{Per}_{i})+\alpha_{t}\mathbf{1}_{t}(i,q)+\alpha_{b}b_{i},


  where \mathbf{1}_{t}(i,q) indicates that a temporal query matches a descriptor


  with normalized time. The coefficients are specified in


  Appendix B.3. The descriptors in the union are then


  reordered according to the candidate score.


  In parallel with structured Cell routing, the supplemental channel performs global
  semantic retrieval over the complete packet collection. Let K_{D} denote the semantic
  proposal depth.

  A17:  It encodes the enriched query q^{+} and each packet document z(p) , and selects
  the K_{D} packets with the highest


  cosine similarity; we use K_{D}=40 in the reported configuration:


  \mathcal{D}_{q}=\operatorname{TopK}^{K_{D}}_{p\in\mathcal{P}}\operatorname{cos}\!\left(e(q^{+}),e(z(p))\right).

  [S12] 3.3 Plane Transition via Source-Normalization Boundary (https://arxiv.org/html/2610.23313v1#S3.SS3)

  A18: The candidate pool \mathcal{K}_{q} contains address hits rather than distinct


  pieces of evidence. Several claims can paraphrase the same dialogue turn,


  and the same claim can be reached through both BM25 and one or more Cells. We


  therefore resolve every claim through


  \rho(x_{i})=\pi_{i}\in\mathcal{P}


  (8)


  and collapse all candidates with the same resolved packet. The normalized


  packet pool is


  \displaystyle\mathcal{U}_{q}=\bigl\{p\in\mathcal{P}:{}


  \displaystyle\exists x_{i}\in\mathcal{K}_{q},\rho(x_{i})=p\bigr\},


  (9)


  with packet score


  s(p,q)=\max_{\begin{subarray}{c}x_{i}\in\mathcal{K}_{q}\\


  \rho(x_{i})=p\end{subarray}}r_{i}.


  (10)


  This many-to-one transition


  separates the multiplicity of retrieval keys from the amount of evidence:


  multiple successful addresses to one turn create one evidence candidate, not


  multiple budget items.

  [S13] 3.4 Evidence Plane (https://arxiv.org/html/2610.23313v1#S3.SS4)

  A19: The Evidence Plane converts the normalized packet candidates into a bounded


  and coherent context. We organize it around the two decisions: how to compile a
  selected packet,


  and when to supplement the selected packet set.

  [S14] 3.4.1 Complementary Packet Scheduling (https://arxiv.org/html/2610.23313v1#S3.SS4.SSS1)

  A20: A closed-pool listwise scheduler receives q and \mathcal{U}_{q} and selects


  K_{0}=10 complementary SourcePackets,


  \mathcal{A}_{0}(q)=\operatorname{Schedule}_{K_{0}}(q,\mathcal{U}_{q}),


  (11)


  where \mathcal{A}_{0}(q) is the baseline evidence anchor set. Each candidate is


  rendered with an opaque label, dialogue identifier, speaker, recorded date,


  and source content. The scheduler is instructed to rank direct answer-bearing


  packets first while retaining complementary packets for relational, temporal,


  comparative, and list questions. It returns exactly K_{0} distinct labels in


  descending usefulness; labels are validated against the closed pool and


  resolved back to SourcePacket identities. The scheduler can therefore reorder


  and select only packets in \mathcal{U}_{q} . Appendix A.2


  provides the complete request construction, output validation, and prompt.


  After this transition,


  Cells, claim multiplicity, and retrieval-channel identity no longer define the


  evidence state; the Evidence Plane operates over SourcePackets and their


  reader projections.

  [S15] 3.4.2 Anchor-Preserving Bounded Frontier (https://arxiv.org/html/2610.23313v1#S3.SS4.SSS2)

  A21: Source-scoped claim-bundle rendering improves the usability of selected evidence,
  while


  the frontier addresses support that is absent from the baseline anchor set. The
  closed frontier pool is


  \mathcal{W}_{q}=\mathcal{A}_{0}(q)\cup\mathcal{D}_{q}.


  (12)


  A listwise reranker returns an ordering \sigma_{q} over \mathcal{W}_{q} . The


  system examines its first K_{R}=5 positions and admits at most K_{\Delta}=2


  previously unselected packets:


  \displaystyle\Delta(q)


  \displaystyle=\operatorname{First}_{K_{\Delta}=2}\left(\sigma_{q}[1{:}K_{R}]\setminus\mathcal{A}_{0}(q)\right),


  (13)


  \displaystyle\mathcal{E}_{q}


  \displaystyle=\mathcal{A}_{0}(q)\cup\Delta(q).


  (14)


  Here \operatorname{First}_{m}(S) returns the first at most m elements of an


  ordered sequence S while preserving their order. The construction preserves the
  baseline anchors and bounds the evidence change.


  In Appendix C.2.1 we report the sensitivity of reranking cutoff and append cap.

  [S16] 3.4.3 Reader-View Compilation (https://arxiv.org/html/2610.23313v1#S3.SS4.SSS3)

  A22: After obtaining the final ordered SourcePacket sequence \mathcal{E}_{q} , we


  construct a source-scoped claim-bundle view for each packet p :


  B_{p}=\left\langle x\in\mathcal{X}\mid\pi(x)=p\right\rangle_{\prec_{\mathcal{X}}}.


  (15)


  The system retrieves every retained atomic claim originating from p , formats


  the bundle with the packet timestamp, and concatenates the evidence blocks in


  packet scheduling order. This compilation is complete with respect to the


  retained descriptor set, rather than a reconstruction of the packet’s raw text.
  Let \mathcal{E}_{q}=\langle p_{1},\ldots,p_{L}\rangle be the final scheduled


  packet sequence. The final reader context is


  X_{q}=\operatorname{Render}(p_{1},B_{p_{1}})\mathbin{\|}\cdots\mathbin{\|}\operatorname{Render}(p_{L},B_{p_{L}}),


  (16)


  where \| denotes order-preserving concatenation of the rendered evidence blocks.

  [S17] 4 Experiments (https://arxiv.org/html/2610.23313v1#S4)

  A23: Our experiments are designed to answer four central research questions:


  RQ1 Does MemCompile deliver meaningful performance improvements over long-term-memory
  baselines under the same evaluation protocol?


  RQ2 Does bounded Cell placement improve fixed-budget source recovery, and how does
  it complement the Evidence Plane? RQ3 Does budgeting by SourcePacket reduce source
  aliasing and distinguish source-recovery failures from evidence-presentation failures?


  RQ4 Given the same recovered SourcePackets, how does reader-view granularity affect
  answer quality?

  [S18] Datasets (https://arxiv.org/html/2610.23313v1#S4.SS1.SSS0.Px1)

  A24: We evaluate MemCompile on LoCoMo Maharana et al. (2024) and LongMemEval Wu
  et al. (2025) benchmarks. LoCoMo evaluates long-term conversational memory over
  extended, multi-session dialogues which contains ten conversations, each comprising
  roughly 600 dialogue turns and 16K tokens on average. LongMemEval-s evaluates the
  ability of chat assistants to retain and use information across sustained user-assistant
  interactions, which contains 500 questions, each embedded in a history of approximately
  115K tokens.

  [S19] Baselines and Metrics (https://arxiv.org/html/2610.23313v1#S4.SS1.SSS0.Px2)

  A25: We compare against representative long-term memory systems spanning flat, atomic,
  graph, and hierarchical designs including MemoryBank Zhong et al. (2023), A-Mem
  Xu et al. (2025), Mem0 Chhikara et al. (2025), MemoryOS Kang et al. (2025), LightMem
  Fang et al. (2026)


  , AnchorMem Shen et al. (2026), xMemory Hu et al. (2026)


  , SimpleMem Liu et al. (2026), AtomMem Yao et al. (2026).


  We report token-level F1, BLEU-1 Papineni et al. (2002) and Judge accuracy Zheng
  et al. (2023). We report token cost through memory construction and query-time retrieval/generation.
  For Open-Domain questions, we do not


  use F1 or BLEU-1 for cross-method comparisons due to this category require combining
  conversational evidence


  with commonsense or world knowledge and may admit multiple


  lexically divergent yet semantically valid answers.

  [S20] Experimental Details (https://arxiv.org/html/2610.23313v1#S4.SS1.SSS0.Px3)

  A26: Unless otherwise specified, all generative components of MemCompile use gpt-4o-mini
  with temperature 0 and default top- p , and set the maximum output length to 2,048
  tokens. Dense retrieval uses text-embedding-3-small without task-specific fine-tuning
  or dimensionality reduction.


  The LLM-as-a-Judge metric employs gpt-5-nano with a rigorous evaluation prompt to
  assess semantic correctness.


  To ensure a controlled comparison, we rerun all baselines under the same evaluation
  protocol while preserving their method-specific memory construction and retrieval
  mechanisms. All methods are evaluated on the same dataset release and use the same
  model configuration including the same backbone model and the same answer/judge
  prompt.


