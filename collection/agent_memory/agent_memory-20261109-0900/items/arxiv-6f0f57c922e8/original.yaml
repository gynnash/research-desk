      if im.size != (W, H):


      im = im.resize((W, H))


      px = im.load()


      # A BLAZE IS YELLOW, FIRE IS ORANGE: the burning grass and the flames on the
      trees here


      # measure (165, 66, 5) – green 66 – while a blaze’s rods are (167, 167, 79).
      The warm


      # mask takes both (a blaze close up is wrapped in its own orange flames); ‘yellows‘
      marks


      # the rod-coloured ones, and a group must contain at least one to count as a
      mob.


      warm = set()


