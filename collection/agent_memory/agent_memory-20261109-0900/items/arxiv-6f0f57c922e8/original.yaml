  - id: S31
    title: E.1 MCU Tasks Descriptions
    text: 'Mine Diamond from Scratch. The agent starts with no resources and must
      progress through the Minecraft technology tree: gathering wood, stone, and iron,
      crafting increasingly capable tools, and ultimately mining a diamond.


      Kill Ender Dragon. The agent completes the same early-game progression, then
      prepares diamond equipment, enters the Nether to obtain blaze materials, crafts
      Eyes of Ender, reaches the End, and defeats the Ender Dragon.


      Figure 18: Milestone progression for the Minecraft tasks. Mine Diamond from
      Scratch contains 10 milestones, while Kill Ender Dragon shares the same initial
      progression and adds 14 milestones required to reach and defeat the Ender Dragon.
      Numbers in the left column index the Mine Diamond list; inner and right-column
      numbers index the Ender Dragon list, in which Diamond ore is inserted as milestone
      10, so Diamond becomes 11 and the added milestones continue from 12. Note that
      the milestones do not need to be finished strictly in this order.'
    location: https://arxiv.org/html/2610.22686v2#A5.SS1
  - id: S32
    title: E.2 New Tasks for Evaluating Skill Reuse
    text: 'We design three additional Minecraft tasks to study whether reusing


      agent-written skills reduces the steps required to solve new tasks.


      These tasks introduce new objectives while providing opportunities


      to apply procedures acquired during earlier interaction.


      Iron Shield. The agent builds a furnace, mines iron ore,


      smelts an iron ingot, and crafts a shield, combining intermediate


      objectives familiar from Mine Diamond from Scratch with a new crafting


      goal. A small vein of iron ore is placed underground, 13 blocks below


      and 12 blocks south of the starting position, at coordinates given in


      the task description.


      Climb Out. The agent starts sealed in a two-block pocket deep


      underground and must return to the surface, 40 blocks above, and mine a


      block of bricks set in the ground there; the block’s coordinates are


      given in the task description. Reaching it requires digging upward,


      whereas the example procedures supplied to the agent only dig downward


      or level.


      Cook Meat. The agent builds a furnace, kills an animal, and


      cooks its meat, introducing a hunting objective absent from Mine


      Diamond from Scratch. Three cows are placed beside the starting


      position.


      In all three tasks, early-game resources are supplied (a stone pickaxe


      and cobblestone, plus a crafting table and logs for Iron Shield and


      Cook Meat, and a stone sword for Cook Meat) and the target is either


      placed nearby or located in the task description, reducing the need to


      repeat initial resource gathering and search.


      We compare the steps required to complete each task with and without


      access to previously written skills. This evaluation tests whether


      procedures learned from earlier experience improve efficiency when


      applied to new objectives.


      Figure 19: Milestone structure of Diamond and three related tasks. Columns align
      the tasks by Diamond’s ten milestones. Blue indicates shared, scored milestones;
      orange indicates task-specific milestones; gray indicates milestones provided
      at initialization and excluded from scoring. Empty cells denote Diamond milestones
      not scored in the corresponding task.'
    location: https://arxiv.org/html/2610.22686v2#A5.SS2
