  - id: S26
    title: Appendix D Harness and Implementation Details
    text: 'This appendix covers five things:


      the episode index (Section D.1),


      the spatial grid (Section D.2),


      the configuration of each method and the action interface shared by all methods
      (Section D.3),


      and storage and cost statistics (Section D.4).'
    location: https://arxiv.org/html/2610.22686v2#A4
  - id: S27
    title: D.1 Episode Index
    text: 'The harness appends one row to index.jsonl for each completed episode (Section
      D.1).


      Each row contains:


      •


      the episode identifier and the path to the episode’s directory;


      •


      the first and last environment steps of the episode;


      •


      the kind of action executed;


      •


      a one-line summary;


      •


      a list of tags;


      •


      the agent’s position (x,y,z) .


      The summary records the procedure call with its arguments, followed by its outcome:
      how long it ran, how far the agent moved, how the inventory changed, and any
      milestone reached.


      Tags flag notable events such as a milestone, an inventory change, or a failure
      to move (stuck).


      The harness computes all of these fields from the structured game state; the
      model does not write them.'
    location: https://arxiv.org/html/2610.22686v2#A4.SS1
  - id: S28
    title: D.2 Spatial Grid
    text: 'The harness also maintains grid.jsonl, an append-only record of the world
      cells the agent has interacted with.


      Each row gives a cell’s integer coordinates, the step at which it was recorded,
      and one of five kinds:


      •


      walked: the agent stood in the cell;


      •


      placed: the agent placed an item in the cell;


      •


      opened: the agent opened the screen of a block in the cell;


      •


      blocked: the agent could not move into the cell;


      •


      hazard: the agent took damage in the cell.


      Rows of kind placed and opened also record the item and the agent’s pose at
      that moment.


      Rows of kind hazard record the amount and type of damage.


      Below we give one example of each kind.'
