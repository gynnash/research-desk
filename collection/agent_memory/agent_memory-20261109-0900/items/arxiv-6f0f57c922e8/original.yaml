    title: Abstract
    text: 'Agents operating over long horizons need an effective memory that allows
      them to reuse their experience throughout long interactions. If the entire history
      of an interaction is retained, it becomes difficult to find the relevant experience,
      while compressing it into summaries may result in the loss of visual and spatial
      details that are required later on. We present MFM, a multimodal filesystem
      memory architecture that keeps complementary types of agent memory. Episodic
      memory stores the observations, actions, and outcomes, and spatial memory associates
      experiences with locations. Semantic and procedural memory build up general
      knowledge and reusable methods of acting, and working memory holds the current
      plans. MFM makes use of searchable textual records to connect these different
      representations to the underlying multimodal episodes. The agents are able to
      find previous experiences by means of contextual cues and to examine the original
      observations in order to recover details that are missing from their textual
      descriptions. Through consolidation, the agents convert experience into higher-level
      knowledge and procedures while still keeping references to the original episodes.
      In the case of long-horizon Minecraft and computer-use tasks, MFM leads to improved
