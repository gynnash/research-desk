  - id: S20
    title: A.1 Milestone Progression and Interaction in Minecraft
    text: 'Fig. 8 tracks milestone progression on Kill the Ender Dragon with GPT-6-Astra,
      using one run per method.


      VISTA gets diamond equipment earlier than MFM, but its progress then stalls.


      MFM continues through obsidian and flint and steel and reaches netherrack within
      the same 36,000-step budget.


      Table 3 reports seed-averaged results for all methods and base models.


      Fig. 9 shows how many environment steps each method executes between successive
      model calls.


      MFM and PRO-LONG generally execute more steps per turn than VISTA.


      In other words, they issue longer action plans and call the model less often.


      How MFM compares with PRO-LONG depends on the task.


      On Ender Dragon, MFM executes more steps per turn than both baselines for 41–56%
      of each run.


      On Mine Diamond, it does so for only 5–14% of each run, and PRO-LONG usually
      executes the most steps per turn.


      Figure 8: Milestone progression on Kill the Ender Dragon with GPT-6-Astra.


      Each curve shows one run’s progression through the Minecraft technology tree
      against environment steps (log scale).


      Within the 36,000-step budget (dashed line), MFM reaches 16 of 24 milestones,
      compared with 13 for VISTA, 12 for PRO-LONG, and 6 for Direct Evaluation.


      The shaded region marks milestones that no method reached.


      One run is shown per method; Table 3 reports seed-averaged results.


      Figure 9: Environment interaction per agent turn.


      Rolling median of environment steps executed per agent turn over each run.


      Columns are the three base models; rows are Mine Diamond from Scratch (top)
      and Kill the Ender Dragon (bottom).


      Higher values mean more environment interaction between successive model calls;
      the vertical axis is logarithmic.


      Shaded intervals mark where MFM exceeds both VISTA and PRO-LONG, and the annotation
      in each panel gives the shaded fraction.'
    location: https://arxiv.org/html/2610.22686v2#A1.SS1
  - id: S21
    title: A.2 Visual Memory Inspection in Minecraft
    text: 'Figs. 10, 11, 12 and 13 expand on the Minecraft examples in Section 4.4.


      In each case, the agent finds a stored frame through its index entry.


      It then inspects the frame to answer a question that the textual record alone
      cannot:


      what kind of animal it saw (Fig. 10),


      where a hole it dug earlier is located (Fig. 11),


      whether a place seen in an earlier life matches the current view (Fig. 12),


      and why an earlier mining cut failed (Fig. 13).


      (a) Stored frame: a pale animal on the hillside.


      (b) Magnified crop: a wolf.


      (c) Stored frame: a possible pink sheep.


      (d) Magnified crop: a pink sheep.


      Figure 10: Correcting and confirming perception with visual memory.


      (a–b) At step 4,588, the agent records a pale animal on the hillside.


      Magnifying the stored frame shows a wolf rather than a sheep, so the agent does
      not attack and looks for food elsewhere.


      (c–d) At step 4,917, the agent is unsure whether an animal on the slope is a
      pink sheep.


      Magnifying the stored frame confirms a sheep rather than a pig, and the agent
      hunts it for food.


      (a) Stored frame of the hole the agent dug.


      (b) Retrieved frame (left) beside the current view (right).


      Figure 11: Memory-guided spatial relocation.


      The retrieved and current views line up closely, which lets the agent identify
      the hole’s rim and recover its exact location.


      (a) Life 1: stored frame of a shallow iron-mine entrance.


      (b) Life 2: retrieved frame (left) beside the current view (right).


      Figure 12: Cross-life visual memory retrieval.


      After dying, the agent retrieves a frame recorded in an earlier life and compares
      it with its current view.


      It recognizes the grass bank ahead as the entrance to that life’s iron mine,
      digs in, and mines iron ore at step 6,565.


      (a) Retrieved frame: the earlier cut was pitched upward.


      (b) Re-aimed view facing the mining face.


      Figure 13: Using visual memory to recover mining orientation.


      The agent inspects the frame of an earlier cut that failed to open a level passage.


      It sees that the view was pitched upward rather than at the mining face.


      It then re-aims with look_abs and resumes mining at the correct orientation.'
    location: https://arxiv.org/html/2610.22686v2#A1.SS2
  - id: S22
    title: A.3 Qualitative Examples on CUABench-KiCad
    text: 'Fig. 14 shows the final schematics that MFM and VISTA produce on the three
      tasks discussed in Section 4.4.


      On Task 55f2eefb, both agents get an “OK” from Change Symbol, but only MFM checks
      the resulting value; VISTA’s schematic still reads +9 V. Because MFM checks
      the resulting application state instead of trusting the “OK” returned by an
      edit operation, it catches incomplete edits that VISTA records as successful.


      On Task c4baee36, both agents place the same components and wiring but use different
      supply labels.


      On Task b7148878, MFM leaves one pin unconnected, compared with three for VISTA.


      Fig. 15 shows how MFM verifies its own edits on three other tasks.


      In each task, the agent follows the same three-step routine.


      First, it inspects the schematic to confirm that component values and net labels
      match the specification.


      Second, it runs the Electrical Rules Checker (ERC).


      Third, it reads the ERC report to confirm that only the expected undriven-power
      errors remain and that no pins are left unconnected.


      The agent first used this routine in an earlier task and later retrieved it
      from episodic memory, similar to the netlist-export reuse in Fig. 16.


      Fig. 16 shows episode reuse across tasks.


      While exporting a netlist in Task a6414tw4, the agent retrieves an episode from
      the earlier Task 4c913e30 whose action sequence is nearly identical, and follows
      it as a precedent.


      (a) MFM, 55f2eefb: supply reads +5 V.


      (b) MFM, c4baee36: +48 V and GND supply symbols.


      (c) MFM, b7148878: one unconnected pin.


      (d) VISTA, 55f2eefb: label still reads +9 V.


      (e) VISTA, c4baee36: local label 3.3VDC on the output net.


      (f) VISTA, b7148878: pins R1.1, U2.1, and U2.2 unconnected.


      Figure 14: Qualitative comparison on CUABench-KiCad.


