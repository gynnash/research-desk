  - id: S15
    title: 5.1 Skill Learning through Memory
    text: 'We look into whether long-term memory allows agents to enhance their future
      behaviour by turning experience from interactions into reusable procedures.
      In this context, self-improvement means adapting as a result of the memory accumulated
      in MFM. MFM includes the facilities needed to store, modify, and carry out procedures
      written by the agent, and it is the agent itself that decides which behaviours
      to keep and when to reuse them. We do not specify the resulting skill library
      and do not require a fixed number of skills for each run. The analysis presented
      in this section includes observations of skill creation and reuse over different
      trajectories, an ablation study of the agent-written procedures, and a controlled
      study of the number of steps required to solve new tasks with or without reusing
      the agent-written procedures.


      Figure 7: More memory of the world makes new tasks faster. We take the memory
      of an earlier agent that explored the world and give fresh agents progressively
      larger portions of it: none, an early cut, a middle cut, or the full memory.
      Each agent is then asked to find and mine an ore (iron, diamond or gold). (a)
      As more memory is inherited, tasks take fewer steps and are solved more often.
      The gain comes from what the memory contains. Agents whose memory already records
      where the needed ore lies (blue) almost always succeed and finish well within
      budget. Agents whose memory predates that discovery (grey) do no better than
      agents with no memory. (b–d) The pattern holds for each task. Informed agents
      dig straight to the remembered location instead of searching blindly.


      From experience to reusable behaviour. The trajectories show how agents convert
      their experience of interaction into permanent action routines. In a run of
      GPT-6-Astra Dragon, after manually cutting a descending staircase (steps 5,068
      to 5,249), the agent created the procedure cut_step, which is parameterised
      by heading and cuts one step while advancing (); it then invoked this procedure
      60 times, once for each of the four cardinal headings. A second procedure, quarry_north_pair,
      extracts the upper and lower block from the wall in front and gathers the dropped
      items (); the 27th time it was called, at step 17,462, it broke the first diamond
      ore block. Reuse also carries over from one life to another. The procedure bridge_north,
      which places one floor block while sneaking and takes the target cell as input
      (), was written in the previous life after the agent had manually placed two
      blocks over the lava and was then called three times in that same life. In this
      life the agent called it nine times between steps 19,261 and 20,103, using varying
      inputs. Each invocation placed one cobblestone block and left the agent’s health
      unchanged, and the bridge ended up reaching the lava pool where mining of obsidian
      took place at step 20,736. The agent also disabled one inherited procedure,
      level_step, having traced the previous death in the lava back to this procedure’s
      release of the sneak key.


      Table 5: Skills learned from one task speed up new tasks. Mean environment


      steps (over 5 seeds each) to solve three new tasks without (w.o.) and with (w.)
      the scripts an earlier life


      wrote installed. Every life solved its task.


      Iron shield


      Climb out


      Cook meat


      w.o.


      w.


      \Delta


      w.o.


      w.


      \Delta


      w.o.


      w.


      \Delta


      2422


      1705


      \downarrow 30\%


      2010


      1867


      \downarrow 7\%


      640


      476


      \downarrow 26\%


      Contribution to task performance. The results from the procedure ablation show
      that the procedures written by the agent do in fact contribute to task performance
      in MFM. For instance, when these procedures are removed for GPT-5.6-Sol, the
      mean milestone completion drops from 9.7 to 8.7 on Diamond and from 10.7 to
      9.0 on Dragon. Our analysis points to two mechanisms that account for these
      improvements. Firstly, the skills allow agents to carry out the tasks more quickly;
      as presented in Table 5, reusing skills acquired during an earlier task decreased
      the average number of environment steps required to complete three new tasks:
      Iron shield, Climb out, and Cook meat by 30%, 7%, and 26% respectively. Secondly,
      skills can enable agents to reach milestones that would otherwise be impossible
      for them to achieve, as shown in the case of the blaze-fighting skill. If there
      are no agent-written skills that take visual inputs (for example, ), then none
      of the methods or models evaluated is able to go beyond milestone 16 to accomplish
      milestones such as killing a blaze or an enderman. These findings indicate that
      procedures enhance both the efficiency of task completion and the variety of
      milestones that can be achieved, even though they do not mean that each stored
      procedure is beneficial or that having a larger library of skills will necessarily
      lead to better performance.'
    location: https://arxiv.org/html/2610.22686v2#S5.SS1
  - id: S16
    title: 5.2 Transferring world knowledge to new tasks
    text: 'We next examine whether accumulated knowledge of an environment helps agents
      solve new objectives. We initialize fresh agents with memory from an earlier
      exploration trajectory, using four conditions: no inherited memory, memory collected
      through step 3,000, through step 6,000, or the full trajectory. Each agent is
      then tasked with finding and mining iron, diamond, or gold in the same world.
      Fig. 7 reports success and environment steps under each condition. Across the
      evaluated trials, success increases from 1/12 without inherited memory to 11/12
      with full memory. The results suggest that the benefit depends on the information
      retained: agents whose inherited memory records the target ore’s location generally
      succeed within budget, whereas agents receiving memory from before its discovery
      often exhaust their budget.'
    location: https://arxiv.org/html/2610.22686v2#S5.SS2
  - id: S17
    title: 6 Conclusion
    text: 'We introduced MFM, a multimodal filesystem memory that organizes episodic,
      spatial, semantic, procedural, and working memory as folders and files in one
      shared filesystem. Episodic records preserve raw observations, states, actions,
      and outcomes; a searchable index of contextual cues addresses them; and agent-written
      knowledge, procedures, and plans cite the episodes that support them. An agent
      can thus locate past experience by when, where, or what happened, inspect the
      original observation for details text omits, and revise what it has learned
      without discarding the evidence. Across Minecraft and KiCad with three base
      models, MFM outperforms memory-free and memory-augmented baselines, each component
      contributes, and memory transfers across tasks. We hope MFM can serve as a foundation
      for memory in long-horizon multimodal and embodied agents.


      Limitations and Future Work. MFM improves long-horizon performance, but exploration
      remains hard: even GPT-6-Astra at maximum reasoning effort (from a concurrent
      experiment posted online) did not complete Ender Dragon. Finding better ways
      of coupling memory


      to exploration and route planning could help agents find landmarks and avoid
      repeated traversal. Our evaluation is also limited to single agents in Minecraft
      and KiCad; shared memory across agents could combine experience from different
      regions or solution attempts, and broader environments would test how far the
      design transfers.'
