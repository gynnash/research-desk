  [S13] 4.3 Ablation Studies (https://arxiv.org/html/2610.22686v2#S4.SS3)

  A30: We evaluate the contributions of MFM’s memory components through four ablations
  that separately remove access to historical visual observations, associative indexing,
  agent-written procedures, and consolidation. Table 4 reports the ablation results.
  Historical visual observations appear essential for resolving perceptual ambiguities
  and spatial orientation (Section 4.4). Disabling stored frames drops completion
  significantly across models: for GPT-5.6-Sol, scores fall to 8.0\pm 1.0 (Diamond)
  and 8.3\pm 0.6 (Dragon), while GPT-6-Astra drops to 8.7\pm 0.6 (Diamond) and 9.7\pm
  0.6 (Dragon). Associative indexing suggests that a dedicated addressing layer helps;
  Replacing it with chronological text matching over a flat log (Flat) reduces performance
  to 8.7\pm 0.6 on both tasks for GPT-5.6-Sol, and to 9.3\pm 0.6 on both tasks for
  GPT-6-Astra. Additionally, agent-written procedures seem to help compound past successes
  into reusable routines (Section 5.1), as disabling them decreases performance for
  GPT-5.6-Sol (Diamond: 8.7\pm 0.6 ; Dragon: 9.0\pm 1.0 ) and more sharply for GPT-6-Astra
  (Diamond: 8.7\pm 0.6 ; Dragon: 10.7\pm 1.2 ). Finally, the removal of consolidation
  lowers performance to 8.3\pm 0.6 on both tasks for GPT-5.6-Sol, and to 8.7\pm 0.6
  (Diamond) and 9.3\pm 0.6 (Dragon) for GPT-6-Astra.

  A31:  The consistent drops across all four ablations is the main evidence that each
  component contributes.

