  - id: S29
    title: D.3 Method Configurations
    text: 'Table 6 lists the configuration of each method on Minecraft. All methods
      receive the same 12 KB standing brief in prompt.


      The atoms are closed-loop: they read the structured game state at every step.


      No method has access to task-specific macros such as tree harvesting, strip
      mining, or portal building.


      We reimplemented PRO-LONG and VISTA in our harness without changing their core
      algorithms.


      PRO-LONG keeps its programmatic text logs, and VISTA keeps its archive of visual
      observations and its inspect interface.


      Matched inspection, different addressing. VISTA and MFM have equivalent visual
      inspection capabilities: both store every observation losslessly with its step
      identity, and both let the agent reopen earlier frames, crop and enlarge regions,
      and compare several past or current views in one context. The methods differ
      only in how the agent locates evidence and what it does with it. VISTA addresses
      frames by turn and frame identifier; MFM additionally provides a harness-written
      index of cues (time, position, action type, tags, outcome summary) that the
      agent can query, and agent-written memory that cites the supporting episodes.
      Our comparison with VISTA therefore isolates the contribution of the addressing
      layer and consolidation, not of the inspection tools.


      Why only MFM writes executable procedures. Neither baseline provides a persistent
      place for agent-written procedures: PRO-LONG’s durable memory is a single harness-owned
      log, and VISTA’s writable memory is limited to two notes files. Turning an action
      sequence into a procedure also requires checking whether that sequence has succeeded
      before. MFM’s associative index makes this check direct: the agent can query
      past episodes by action type and outcome tags, then inspect the linked frames
      to confirm the result. VISTA addresses frames only by turn identifier, and PRO-LONG’s
      text log, while searchable, has no structured action or outcome fields and no
      links to visual evidence, so the same check requires scanning and reconstructing
      past attempts. Without these supports, the baselines kept their procedural knowledge
      as prose notes rather than callable procedures.


      Table 6: Configuration of each method on Minecraft tasks.


      All methods share the action and procedure reference, the knowledge sections,
      the ground-truth rules, and the per-turn state block; Direct Evaluation omits
      the block’s [RECENT] and [MAP] fields.


      All methods with memory can write files and execute stored procedures through
