  Contribution to task performance. The results from the procedure ablation show that
  the procedures written by the agent do in fact contribute to task performance in
  MFM. For instance, when these procedures are removed for GPT-5.6-Sol, the mean milestone
  completion drops from 9.7 to 8.7 on Diamond and from 10.7 to 9.0 on Dragon. Our
  analysis points to two mechanisms that account for these improvements.

  A38:  Firstly, the skills allow agents to carry out the tasks more quickly; as presented
  in Table 5, reusing skills acquired during an earlier task decreased the average
  number of environment steps required to complete three new tasks: Iron shield, Climb
  out, and Cook meat by 30%, 7%, and 26% respectively. Secondly, skills can enable
  agents to reach milestones that would otherwise be impossible for them to achieve,
  as shown in the case of the blaze-fighting skill. If there are no agent-written
  skills that take visual inputs (for example, ), then none of the methods or models
  evaluated is able to go beyond milestone 16 to accomplish milestones such as killing
  a blaze or an enderman. These findings indicate that procedures enhance both the
  efficiency of task completion and the variety of milestones that can be achieved,
  even though they do not mean that each stored procedure is beneficial or that having
  a larger library of skills will necessarily lead to better performance.

  [S16] 5.2 Transferring world knowledge to new tasks (https://arxiv.org/html/2610.22686v2#S5.SS2)

  A39: We next examine whether accumulated knowledge of an environment helps agents
  solve new objectives. We initialize fresh agents with memory from an earlier exploration
  trajectory, using four conditions: no inherited memory, memory collected through
  step 3,000, through step 6,000, or the full trajectory. Each agent is then tasked
  with finding and mining iron, diamond, or gold in the same world. Fig. 7 reports
  success and environment steps under each condition. Across the evaluated trials,
  success increases from 1/12 without inherited memory to 11/12 with full memory.
  The results suggest that the benefit depends on the information retained: agents
  whose inherited memory records the target ore’s location generally succeed within
  budget, whereas agents receiving memory from before its discovery often exhaust
  their budget.

  [S17] 6 Conclusion (https://arxiv.org/html/2610.22686v2#S6)

  A40: We introduced MFM, a multimodal filesystem memory that organizes episodic,
  spatial, semantic, procedural, and working memory as folders and files in one shared
  filesystem. Episodic records preserve raw observations, states, actions, and outcomes;
  a searchable index of contextual cues addresses them; and agent-written knowledge,
  procedures, and plans cite the episodes that support them. An agent can thus locate
  past experience by when, where, or what happened, inspect the original observation
  for details text omits, and revise what it has learned without discarding the evidence.
  Across Minecraft and KiCad with three base models, MFM outperforms memory-free and
  memory-augmented baselines, each component contributes, and memory transfers across
  tasks. We hope MFM can serve as a foundation for memory in long-horizon multimodal
  and embodied agents.


  Limitations and Future Work. MFM improves long-horizon performance, but exploration
  remains hard: even GPT-6-Astra at maximum reasoning effort (from a concurrent experiment
  posted online) did not complete Ender Dragon. Finding better ways of coupling memory


  to exploration and route planning could help agents find landmarks and avoid repeated
  traversal.

  A41:  Our evaluation is also limited to single agents in Minecraft and KiCad; shared
  memory across agents could combine experience from different regions or solution
  attempts, and broader environments would test how far the design transfers.

