  [S15] 5.1 Skill Learning through Memory (https://arxiv.org/html/2610.22686v2#S5.SS1)

  A35: We look into whether long-term memory allows agents to enhance their future
  behaviour by turning experience from interactions into reusable procedures. In this
  context, self-improvement means adapting as a result of the memory accumulated in
  MFM. MFM includes the facilities needed to store, modify, and carry out procedures
  written by the agent, and it is the agent itself that decides which behaviours to
  keep and when to reuse them. We do not specify the resulting skill library and do
  not require a fixed number of skills for each run. The analysis presented in this
  section includes observations of skill creation and reuse over different trajectories,
  an ablation study of the agent-written procedures, and a controlled study of the
  number of steps required to solve new tasks with or without reusing the agent-written
  procedures.


  Figure 7: More memory of the world makes new tasks faster. We take the memory of
  an earlier agent that explored the world and give fresh agents progressively larger
  portions of it: none, an early cut, a middle cut, or the full memory. Each agent
  is then asked to find and mine an ore (iron, diamond or gold). (a) As more memory
  is inherited, tasks take fewer steps and are solved more often. The gain comes from
  what the memory contains. Agents whose memory already records where the needed ore
  lies (blue) almost always succeed and finish well within budget.

  A36:  Agents whose memory predates that discovery (grey) do no better than agents
  with no memory. (b–d) The pattern holds for each task. Informed agents dig straight
  to the remembered location instead of searching blindly.


  From experience to reusable behaviour. The trajectories show how agents convert
  their experience of interaction into permanent action routines. In a run of GPT-6-Astra
  Dragon, after manually cutting a descending staircase (steps 5,068 to 5,249), the
  agent created the procedure cut_step, which is parameterised by heading and cuts
  one step while advancing (); it then invoked this procedure 60 times, once for each
  of the four cardinal headings. A second procedure, quarry_north_pair, extracts the
  upper and lower block from the wall in front and gathers the dropped items (); the
  27th time it was called, at step 17,462, it broke the first diamond ore block. Reuse
  also carries over from one life to another. The procedure bridge_north, which places
  one floor block while sneaking and takes the target cell as input (), was written
  in the previous life after the agent had manually placed two blocks over the lava
  and was then called three times in that same life. In this life the agent called
  it nine times between steps 19,261 and 20,103, using varying inputs.

  A37:  Each invocation placed one cobblestone block and left the agent’s health unchanged,
  and the bridge ended up reaching the lava pool where mining of obsidian took place
  at step 20,736. The agent also disabled one inherited procedure, level_step, having
  traced the previous death in the lava back to this procedure’s release of the sneak
