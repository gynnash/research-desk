material: "[S1] Front matter (https://arxiv.org/html/2611.12068v1)\nA1: \\authoremails\n\
  \n{whuang80,wzhan42}@uic.edu,\n\nnjy@tongji.edu,\n\npxia@cs.unc.edu,\n\nyuw164@ucsd.edu\n\
  [S2] MIRIX-2.0 : Multi-Agent Memory System (https://arxiv.org/html/2611.12068v1)\n\
  A2: Wei-Chieh Huang\n\nAffiliation: MIRIX AI\n\nEqual contribution\n\nWeizhi Zhang\n\
  \nAffiliation: MIRIX AI\n\nEqual contribution\n\nCorresponding author\n\nJiayan\
  \ Nan\n\nAffiliation: MIRIX AI\n\nEqual contribution\n\nPeng Xia\n\nAffiliation:\
  \ MIRIX AI\n\nEqual contribution\n\nYu Wang\n\nAffiliation: MIRIX AI\n\nEqual contribution\n\
  \nCorresponding author\n[S3] Abstract (https://arxiv.org/html/2611.12068v1#abstract1)\n\
  A3: Long-term memory lets LLM agents personalize, stay consistent, and reuse what\n\
  \nworked before. Parametric memories need training, consolidation can lose details\n\
  \nfor good, and keeping every record leaves a growing store to search. We present\n\
  \nMIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and\n\
  \nefficient at once. It is the most accurate of the compared systems on four of\
  \ five QA benchmarks.\n\nIt reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S,\
  \ where it leads the\n\nstrongest baseline by 14.3 points, and with AutoDream disabled\
  \ it gains 31.0\n\nand 22.0 points over HyperMem on single-hop and multi-hop document\
  \ QA. As procedural memory, it yields the\n\nhighest mean success among the compared\
  \ memory methods on ALFWorld and WebShop\n\nand reaches 49.2% on MetaClaw-Bench,\
  \ against 44.0% for MetaClaw’s skill\n\nlibrary. Six typed memory agents keep complete\
  \ records as the system of record,\n\nand a provenance hypergraph indexes episodic\
  \ and semantic records with n-ary\n\nframes that cite their rows. Retrieval runs\
  \ under explicit budgets, so the\n\nevidence a question inspects does not grow with\
  \ the history. AutoDream merges\n\nduplicate anchors outside the write path without\
  \ rewriting any record, and it\n\ndistills task sessions into skills. With AutoDream\
  \ disabled, MIRIX-2.0 answers\n\nfaster than HyperMem on all five timed benchmarks.\
  \ It needs no fine-tuning, runs\n\n\nA4: with closed and open models, and its code\
  \ is public.\n\n††Website: https://mirix.io/††GitHub: https://github.com/Mirix-AI/MIRIX\n\
  \nFigure 1: Overview of MIRIX-2.0. Typed writers fill the evidence plane P_{u} ,\
  \ the provenance\n\nhypergraph G_{u} indexes it with n-ary frames that cite their\
  \ sources, retrieval traverses\n\nG_{u} under explicit budgets, and AutoDream consolidates\
  \ outside the write path.\n[S4] 1 Introduction (https://arxiv.org/html/2611.12068v1#S1)\n\
  A5: Large language model (LLM) agents now work over horizons far longer than a\n\
  \nsingle context window (Luo et al., 2025b; Huang et al., 2026b). A personal\n\n\
  agent accumulates months of conversation with its user, and a task agent meets\n\
  \nsimilar problems across many episodes. Memory lets such agents carry\n\ninformation\
  \ across sessions (Wang et al., 2025a), so that they can personalize their\n\nresponses\
  \ (Zhang et al., 2026e), stay consistent with what they were\n\ntold (Packer et\
  \ al., 2023; Chhikara et al., 2025), and reuse what worked\n\nbefore (Wang et al.,\
  \ 2025e; Xia et al., 2026a). Benchmarks now measure this\n\nability on long conversations\
  \ (Maharana et al., 2024; Wu et al., 2025), long\n\ndocuments (Hu et al., 2026),\
  \ multi-session agentic\n\ntasks (He et al., 2026), and lifelong\n\npersonalization\
  \ (Zhang et al., 2026d).\n\nBenchmarks score a memory by its answers, but a team\
  \ that deploys one asks more\n\nof it. A memory that agents can rely on in practice\
  \ has to meet three\n\nrequirements at once. It has to be accurate about the particulars\
  \ of past\n\nexperience, such as a name, a date, a count, or the distinction between\
  \ two\n\nevents, and about the connections between them. It has to be practical,\
  \ which\n\nmeans deployable with the models a team already uses, nothing to train,\
  \ answers\n\nthat can be traced to stored records, and consolidation that cannot\
  \ destroy what\n\nwas stored.\nA6:  It also has to be efficient, with answer latency\
  \ and token cost per\n\nquestion that stay bounded as the history grows.\n\nEach\
  \ family of existing systems gives up at least one of the three. Systems\n\nthat\
  \ consolidate records into extracted facts or\n\nabstractions (Chhikara et al.,\
  \ 2025; Ye et al., 2026) are compact but give up accuracy:\n\nthe details they discard\
  \ are gone for good, and consolidation can make a\n\nmemory faulty even when it\
  \ is distilled from useful\n\nexperience (Zhang et al., 2026a). Systems that keep\
  \ every record and\n\nretrieve from them directly lose nothing but give up efficiency,\
  \ since\n\nretrieval must search an ever larger and noisier\n\nhistory (Huang et\
  \ al., 2026b). Graph memories organize the same content\n\naround entities and their\
  \ relations (Rasmussen et al., 2025; Edge et al., 2024), but binary\n\ntriples split\
  \ an n-ary fact into fragments and lose the connections among its\n\nparticipants\
  \ (Luo et al., 2025a). Hypergraph\n\nmemories (Yue et al., 2026) group episodes\
  \ under topics and facts under\n\nepisodes, but their hyperedges record which unit\
  \ belongs where rather than\n\nthe participants of a fact, and retrieval descends\
  \ from topic summaries\n\nwritten at storage time, so a detail is reachable only\
  \ after its topic has\n\nbeen retrieved. File-system memories, such as the auto\
  \ memory of Claude\n\n\nA7: Code (Anthropic, 2026), route retrieval through summaries\
  \ in the same way: they keep notes in plain\n\nfiles behind a size-capped index\
  \ that is loaded into every session, and the\n\nagent opens a file on the strength\
  \ of its one-line summary. A detail that no\n\nsummary mentions is reachable only\
  \ by string search, which neither resolves\n\nan entity across files nor follows\
  \ its relations, and index entries past the\n\ncap are not loaded at the start of\
  \ a session. Both families prune top down to\n\nbound their cost, and both pay for\
  \ the pruning with recall on details their\n\nsummaries do not reflect. Parametric\
  \ memories store experience in model\n\nweights or latent states (Wang et al., 2024b;\
  \ Wang et al., 2025b; Wang et al., 2025c; Behrouz et al., 2025)\n\nand give up practicality,\
  \ since they require training and rule out closed\n\nmodels.\n\nThe requirements\
  \ also weigh differently for the two uses of memory. Recent\n\nstudies separate\
  \ user-centric memory, which personalizes an agent to its user,\n\nfrom agent-centric\
  \ memory, which accumulates the agent’s own experience, and\n\nthey find that the\
  \ two face reversed\n\nchallenges (Huang et al., 2026b; Huang et al., 2026c). A\
  \ user-centric memory has\n\nto record a user’s history broadly and connect its\
  \ pieces, because a later\n\nquestion may depend on any detail of that history (Zhang\
  \ et al., 2026d; Ma et al., 2026b).\n\n\nA8: An agent-centric memory has to be precise\
  \ and refined instead. It distills\n\ntrajectories into strategies and\n\nskills\
  \ (Zhao et al., 2024; Ouyang et al., 2026; Xia et al., 2026b), and\n\nretrieving\
  \ too much can pull the agent’s attention away from the context that\n\nmatters\
  \ for its next action (Huang et al., 2026c). A practical system has to\n\nserve\
  \ both uses from one store.\n\nFigures 2 and 3 trace one example of each\n\nsetting\
  \ through MIRIX-2.0.\n\nFigure 2: User-centric memory. Sessions are stored as episodic\
  \ and semantic records, and a\n\nlater question retrieves graph facts with their\
  \ source rows to give a personalized answer.\n\nIn this work, we present MIRIX-2.0,\
  \ a multi-agent memory system designed to be\n\npractical, accurate, and efficient\
  \ at once. It keeps the multi-agent design of\n\nMIRIX (Wang and Chen, 2025) and\
  \ rethinks how memory is stored, indexed, retrieved, and\n\nconsolidated so that\
  \ a specific layer meets each requirement\n\n(Figure 1). Six memory agents under\
  \ a Meta Memory Manager write\n\ncomplete records to a typed evidence plane in a\
  \ vector database, the system\n\nof record, so details survive consolidation and\
  \ every graph fact the answer\n\nreceives cites the rows it came from. The graph\
  \ is only an index. The database write commits first, a failed graph write never\
  \ rolls back a stored memory, and\n\na failed graph read falls back to direct evidence\
  \ retrieval. A\n\n\nA9: provenance hypergraph indexes the entities, events, relations,\
  \ roles, and\n\ntimes in episodic and semantic records as n-ary frames that cite\
  \ the rows they\n\nwere extracted from and carry dates, prices, and counts as literals,\
  \ and undated\n\nevents with similar wording keep distinct identities. At query\
  \ time, a\n\ndeterministic planner sets explicit budgets, retrieval enters the hypergraph\
  \ at the anchors that match the question, and the answer receives graph facts together\n\
  \nwith the records they cite (Section 2.4). The evidence a question inspects is\
  \ therefore bounded by construction\n\nand does not grow with the length of the\
  \ history.\n\nLike sleep-time and offline consolidation\n\nmethods (Lin et al.,\
  \ 2025; Ye et al., 2026), AutoDream consolidates\n\nmemory outside the write path,\
  \ and it treats the two kinds of memory in\n\nopposite ways. For semantic memory,\
  \ it consolidates identities and never\n\nrewrites evidence. It pairs each anchor\
  \ introduced by new semantic rows with its\n\nnearest anchors of the same identity-stable\
  \ type, such as a person or a place,\n\nand asks a language model whether a pair\
  \ denotes one entity. A confirmed merge\n\nunites the citations of the two anchors\
  \ and rewires the frames that mention\n\nthem, while event anchors, fact frames,\
  \ and stored records stay unchanged, so a\n\nmerge can never destroy a stored memory.\
  \ Its cost depends on the newly written\n\n\nA10: semantic frontier rather than\
  \ on the total size of memory, verification runs\n\nunder explicit pair caps, and\
  \ negative decisions are cached so that later cycles\n\ndo not pay for the same\
  \ pair again. For procedural memory, AutoDream refines\n\ninstead. It judges each\
  \ finished task session from quotes in its transcript,\n\ndistills lessons worth\
  \ reusing and mistakes worth avoiding, and lets a\n\ncurator (Zhang et al., 2026c)\
  \ create or edit skills whose edits can cite the\n\nexperiences behind them.\n\n\
  We evaluate MIRIX-2.0 on conversational memory, long-document question answering,\n\
  \npersonalized generation, and procedural memory for interactive agents. MIRIX-2.0\
  \ has the highest accuracy of all compared memory systems on both conversational\n\
  \nbenchmarks, 91.4% on LoCoMo in our runs and 72.6% on LongMemEval-S, 14.3 points\n\
  \nabove the strongest baseline. On LoCoMo, the hypergraph raises accuracy over flat\n\
  \nmemory from 85.7% to 88.4%, with the largest gain on multi-hop questions, and\n\
  \nAutoDream raises every question type and lifts the overall score to 91.4%. On\n\
  \nLongMemEval-S, the hypergraph alone adds 11.2 points. On the single-hop and multi-hop\
  \ document QA tasks of\n\nMemoryAgentBench (Hu et al., 2026), with AutoDream disabled,\
  \ it answers\n\n83.0% and 71.0% of the questions, 31.0 and 22.0 points above the\
  \ strongest\n\nbaseline, and on MemoryCD (Zhang et al., 2026d) it has the highest\
  \ value on all four\n\nA11: \nmetrics for cross-domain review summarization. Used\
  \ as procedural memory, MIRIX-2.0 gives the highest mean success among the compared\
  \ memory methods on\n\nALFWorld (Shridhar et al., 2021), at 76.4% with GPT-6 Luna\
  \ against 73.6%\n\nfor Agent Workflow Memory (AWM) (Wang et al., 2025e) and 69.4%\
  \ without memory, and on WebShop (Yao et al., 2022), at\n\n37.4%. With GPT-5.2 it\
  \ reaches 49.2% accuracy on\n\nMetaClaw-Bench (Xia et al., 2026b), against 44.0%\
  \ reported for the MetaClaw\n\nskill library.\n\nWhat makes these results usable\
  \ is the cost at which they come. With AutoDream\n\ndisabled, MIRIX-2.0 answers\
  \ faster than HyperMem, the strongest baseline, on all five\n\nbenchmarks we timed,\
  \ ingests the two conversational benchmarks in less time, and\n\nuses fewer answer\
  \ tokens on four of the five. As procedural memory, on WebShop it\n\nuses the fewest\
  \ training and test tokens among the memory methods while reaching\n\nthe highest\
  \ success. The cost is paid when long documents are ingested. Building the graph\
  \ makes\n\ntheir ingestion about four times slower than flat memory and slower than\
  \ that\n\nbaseline. The full system with AutoDream is not timed, and the retrieval\
  \ bounds\n\ncover the evidence a question inspects, not latency measured as the\
  \ history\n\ngrows. No model is fine-tuned, the same system runs with closed and\
  \ open\n\nmodels, and the code is public.\n\nOur contributions are as follows.\n\
  \n•\n\n\nA12: Accurate and practical. A layered memory design in which six\n\ntyped\
  \ memory agents keep complete records as the system of record and a\n\nprovenance-preserving\
  \ n-ary hypergraph serves only as their index, with\n\noccurrence identities that\
  \ keep distinct events apart and fail-soft\n\nindexing that never rolls back a stored\
  \ memory.\n\n•\n\nOne memory for users and agents. To the best of our\n\nknowledge,\
  \ MIRIX-2.0 is the first memory system that handles both user-centric\n\nand agent-centric\
  \ memory, serving personalization and the refinement of\n\nagent skills from one\
  \ store.\n\n•\n\nEfficient and safe to consolidate. Graph-owned retrieval runs\n\
  \nunder explicit budgets and returns graph facts together with the records\n\nthat\
  \ justify them. AutoDream merges duplicate entity anchors under explicit\n\ncaps\
  \ without touching stored memories, which adds 3.0 points on LoCoMo, and\n\ndistills\
  \ task sessions into skills for procedural memory.\n\nThe rest of the paper is organized\
  \ as follows. Section 2 presents\n\nMIRIX-2.0. It states the problem and the three\
  \ technical requirements, introduces\n\nthe typed evidence plane and the provenance\
  \ hypergraph that indexes it,\n\ndescribes graph-owned retrieval under explicit\
  \ budgets, and explains how\n\nAutoDream consolidates semantic and procedural memory\
  \ outside the write path.\n\nSection 3 evaluates the accuracy of MIRIX-2.0 on conversational\
  \ recall,\n\n\nA13: long-document question answering, and personalized generation,\
  \ its use as\n\nagent memory on ALFWorld, WebShop, and MetaClaw-Bench, and its cost\
  \ in\n\ningestion time, answer latency, and tokens. Section 4 relates MIRIX-2.0\
  \ to\n\nprior work on memory systems for LLM agents, multi-agent systems, and memory\n\
  \nconsolidation, and Section 5 concludes and discusses the\n\nlimitations of this\
  \ study. Appendix A gives the details of the method,\n\nand Appendix B gives the\
  \ full results behind the figures.\n\nFigure 3: Agent-centric memory. AutoDream\
  \ turns a failed purchase into experiences and a\n\nrevised routine, which a later\
  \ task follows to meet every constraint.\n[S5] 2 Methodology (https://arxiv.org/html/2611.12068v1#S2)\n\
  A14: MIRIX-2.0 is designed to be practical, accurate, and efficient. It has to run\n\
  \nwith the models a team already uses and leave stored records intact, it has to\n\
  \nkeep a name, a date, a count, or the distinction between two events recoverable\n\
  \nafter writing and after consolidation, and it has to answer from a bounded\n\n\
  evidence set however long the history grows. This section describes the\n\nlayered\
  \ design that delivers the three.\n\nMIRIX-2.0 separates storage from indexing (Figure\
  \ 1). A typed evidence plane stores complete\n\nmemories and is the system of record\
  \ (Section 2.2). A\n\nprovenance hypergraph indexes the entities, events, relations,\
  \ roles, and\n\ntimes in those memories, and every fact in it cites the records\
  \ it came from\n\n(Section 2.3). Three paths operate on the two layers, and\n\n\
  Algorithm 1 states each of them in pseudocode. The write path stores a\n\nmemory\
  \ and then indexes it. The read path plans a query, traverses the\n\ngraph, and\
  \ dereferences only the records it selects (Section 2.4).\n\nAutoDream, the third\
  \ path, runs outside the other two (Section 2.5). On semantic memory it\n\nmerges\
  \ duplicate anchors in the hypergraph and returns the evidence store\n\nunchanged,\
