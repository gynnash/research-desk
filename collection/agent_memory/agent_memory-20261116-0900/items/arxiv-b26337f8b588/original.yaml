  \nidentifiers that graph traversal selects. This boundary keeps a hidden\n\nfull-table\
  \ search from doing the work attributed to the graph. Only a graph\n\nread that\
  \ raises an error falls back to direct evidence retrieval. A query passes\n\nthrough\
  \ planning, anchor entry, expansion along two evidence lanes, and fusion,\n\nand\
  \ a verifier then checks the answer\n\n(Algorithm 1, lines 12–19). For the question\
