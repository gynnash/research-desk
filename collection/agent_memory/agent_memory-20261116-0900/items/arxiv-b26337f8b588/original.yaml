      With GPT-6 Luna, MIRIX-2.0 is the best of the three memory methods on four of
      the six


      task types, Pick, Look, Clean, and Pick Two, and AWM is ahead on Heat and Cool.


      Against no memory, Clean gains 14.0 points, Heat 26.1, and Cool 4.7, while Pick,


      Look, and Pick Two lose 4.1, 1.9, and 3.9 points.


      With GPT-5.6 Luna, MIRIX-2.0 leads the memory methods on Look, Clean, and Cool
      and ties


      AWM on Heat at 63.8%, while ReasoningBank is ahead on Pick and AWM on Pick Two.
      With


