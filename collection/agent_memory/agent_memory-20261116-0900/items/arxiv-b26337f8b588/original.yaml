  \ On procedural memory it starts in the background once five task\n\nsessions are\
  \ pending, and it turns them into skills.\n[S22] Semantic frontier. (https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px1)\n\
  A34: Each call receives the exact source-chunk identifiers of the batch just\n\n\
  written, which resolve to the newly written semantic rows. These rows define a\n\
  \nsmall frontier \\Delta_{u} , so the cost of consolidation depends on new\n\nactivity\
  \ rather than on the total size of memory. The invocation schedule of our protocol\
  \ is in Section A.5.\n[S23] Candidate generation. (https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px2)\n\
  A35: Only anchors that are backed by semantic rows and belong to an identity-stable\n\
  \ntype t\\in\\mathcal{T}_{\\mathrm{safe}}=\\{\\text{person, organization, location,\n\
  \nobject, concept}\\} are eligible. For each eligible anchor a\\in\\mathcal{A}_{\\\
  Delta} backed by a frontier row, AutoDream takes the four nearest entries of the\
  \ name index, which include a itself,\n\nand forms the candidate pairs\n\n\\mathcal{C}_{\\\
  Delta}=\\left\\{(a,b):\\begin{array}[]{l}a\\in\\mathcal{A}_{\\Delta},\\;b\\in\\\
  operatorname{NN}_{4}(a)\\setminus\\{a\\},\\\\\n\n\\cos(\\mathbf{e}_{a},\\mathbf{e}_{b})\\\
  geq 0.86,\\\\\n\nt_{a}=t_{b}\\in\\mathcal{T}_{\\mathrm{safe}}\\end{array}\\right\\\
  }.\n\n(13)\n\nEpisodic-only anchors are excluded by construction. An LLM decides\
  \ whether each\n\npair denotes the same entity and, if it does, chooses one of the\
  \ two existing\n\nnames as the canonical representative. Its output is constrained\
  \ to the\n\nsubmitted pair, and invented representatives are rejected. In\n\nFigure\
  \ 3, steel bottle and stainless steel\n\nbottle form such a pair.\n[S24] Bounded\
  \ schedule. (https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px3)\nA36: Every Dream\
  \ round verifies at most a fixed number of unseen pairs, and the\n\nfinal round\
  \ also considers the eligible anchors that no earlier round used as a\n\nsource.\
  \ Explicit negative decisions are cached as the set \\mathcal{N} of\n\nAlgorithm\
  \ 1, so later cycles do not pay again to reconsider the same pair.\n\nSection A.5\
  \ states the caps of the intermediate, final, and\n\nrepair rounds and the cache\
  \ key.\n[S25] Lossless structural merge. (https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px4)\n\
  A37: For a confirmed merge a\\rightarrow b , the system unions the episodic and\n\
  \nsemantic row identifiers, keeps aliases, sums mention counts, keeps the maximum\n\
  \nadmission score, and rewires every role-typed frame arm to b . Union, sum, and\
  \ maximum are commutative and\n\nassociative, so the order of repeated merges does\
  \ not change the reachable\n\nevidence. The dropped anchor is removed only after\
  \ its values and edges have\n\nbeen transferred.\n\nSemantic Dream never rewrites\
  \ the memories in the vector database, and it consolidates neither\n\nepisodic-only\
  \ anchors nor fact nodes. The asymmetry is deliberate. Semantic\n\nidentity can\
  \ be refined incrementally, whereas event occurrences and their\n\ncitations are\
  \ kept as observations. AutoDream therefore makes the graph less\n\nfragmented without\
  \ creating a textual summary whose embedding could hide the\n\ndetails of its inputs.\n\
