  A38: For procedural memory, AutoDream refines instead of merging. A distiller judges\n\
  \nthe outcome of each pending session from quotes in its transcript and distills\n\
  \nexperiences e_{1},\\ldots,e_{m} , each marked as a lesson worth reusing or a\n\
  \nmistake worth avoiding. A curator (Zhang et al., 2026c) turns these experiences\n\
  \ninto skills in the procedural store P_{u}^{P} , and it can create, edit, or\n\n\
  delete a skill. An edit can cite the experiences behind it with a quote of the\n\
  \ntext it adds, and a citation is recorded only when that quote checks out, so a\n\
  \ncited step of a skill can be traced through its experiences to the quoted\n\n\
  sessions they came from. In Figure 3, one failed purchase\n\nyields an experience\
  \ to avoid and one to reuse, and the curator adds two steps\n\nto the shopping routine\
  \ that cite the first and keeps a step that the second\n\nsupports. The distiller’s\
  \ unclear verdict and the curator’s non-edit verdicts are in Section A.5.\n\n\\\
  FloatBarrier\n[S27] 3 Experiments (https://arxiv.org/html/2611.12068v1#S3)\nA39:\
  \ We evaluate MIRIX-2.0 for the three properties it is designed for. Accuracy is\n\
  \nmeasured for user memory on conversational recall, document QA, and\n\npersonalized\
  \ generation (Section 3.2), which mainly exercise semantic\n\nmemory together with\
  \ the episodic records that ground it, and for agent memory\n\non held-out interactive\
  \ tasks and on\n\nMetaClaw-Bench, whose tasks span 30 days (Section 3.3), which\
  \ exercise procedural memory. Efficiency is measured\n\nas ingestion time, answer\
  \ latency, and answer tokens for user memory, with\n\nAutoDream disabled in every\
  \ timed run, and as training and test tokens for\n\nagents (Section 3.4). Practicality\
  \ is built into the protocol itself. One system serves both uses, no model is fine-tuned,\
  \ the agent\n\nevaluation covers closed and open backbones, and every graph configuration\
  \ runs\n\nunder the budgets of Section 2.4.\n[S28] Default system and ablations.\
  \ (https://arxiv.org/html/2611.12068v1#S3.SS1.SSS0.Px1)\nA40: Unless a configuration\
  \ is explicitly identified otherwise, MIRIX-2.0 denotes the\n\nfull architecture\
  \ with the provenance hypergraph and AutoDream enabled.\n\nFor the user-memory ablations,\
  \ M0 uses flat vector memory without the\n\ngraph or AutoDream, like MIRIX-1.0 (Wang\
  \ and Chen, 2025), and the tables label it\n\nMIRIX-1.0. M1 adds graph indexing\
  \ and retrieval but disables\n\nAutoDream, and M2 is the full graph plus AutoDream\
  \ configuration.\n\nM1 and M2 are configurations of MIRIX-2.0, not successive releases\
  \ of the\n\nmethod. In M2, semantic AutoDream is invoked by the ingestion driver\
  \ after\n\nevery five chunks and after the final chunk, outside the critical write\
