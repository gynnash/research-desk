  \n1.815 \\pm 0.054\n\n4.975 \\pm 0.340\n\n37.4 \\pm 2.1\n[S44] 3.5 What the experiments\
  \ establish (https://arxiv.org/html/2611.12068v1#S3.SS5)\nA60: The results support\
  \ the three properties in different measure. Accuracy has\n\nthe broadest support.\
  \ The M0, M1, and M2 ordering holds on both conversational\n\nbenchmarks, and MIRIX-2.0\
  \ leads the compared systems on four of the five QA\n\nbenchmarks, two of them with\
  \ AutoDream disabled. As procedural memory, it has\n\nthe highest mean success among\
  \ the compared memory methods on ALFWorld with\n\nboth backbones and on WebShop,\
  \ and the highest MetaClaw-Bench score with both\n\nbackbones, while the no-memory\
  \ comparisons show that retrieved experience can\n\nalso hurt. Efficiency holds\
  \ for answering more than for ingestion. With\n\nAutoDream disabled, MIRIX-2.0 answers\
  \ faster than HyperMem on every timed\n\nbenchmark, and on WebShop it uses the fewest\
  \ training and test tokens among\n\nthe memory methods. Graph construction, however,\
  \ makes document ingestion 3.8\n\nto 4.0 times slower than flat memory, and the\
  \ ALFWorld test tokens of MIRIX-2.0 are\n\nthe highest among the memory methods.\
  \ Practicality rests on the design and on\n\nour protocol rather than on a deployment.\
  \ One store serves both uses, no model\n\nis fine-tuned, and every graph fact returned\
  \ to the answerer cites its source\n\nrows.\n\nThe tables evaluate complete configurations,\
  \ so the component explanations in\n\nthis section remain interpretations, and the\
  \ limitations in\n\nSection 5 list the ablations that would test them. The tables\
  \ also\n\n\nA61: do not measure merge precision, source-detail retention, skill\
  \ provenance\n\ncoverage, or the contribution of the six-writer routing policy,\
  \ and they do not\n\nreport memory length or user-memory ingestion tokens, for which\
  \ graph counts\n\nand answer tokens cannot substitute.\n[S45] Memory systems for\
  \ LLM agents. (https://arxiv.org/html/2611.12068v1#S4.SS0.SSS0.Px1)\nA62: Memory\
  \ systems for LLM agents keep past interactions outside the model and\n\nretrieve\
  \ them when they become\n\nrelevant (Huang et al., 2026b; Zhang et al., 2025c; Wang\
  \ et al., 2025a; Guo et al., 2026).\n\nEarly designs rank or decay a memory stream\
  \ (Park et al., 2023; Zhong et al., 2024)\n\nor manage memory the way an operating\
  \ system manages\n\nstorage (Packer et al., 2023; Kang et al., 2025; Li et al.,\
  \ 2025). Later systems extract and update\n\nsalient facts (Chhikara et al., 2025),\
  \ link notes into an evolving network (Xu et al., 2025),\n\ncompress what they store\
  \ (Fang et al., 2026a; Liu et al., 2026a), or learn\n\nmemory construction with\
  \ reinforcement\n\nlearning (Wang et al., 2025d; Yan et al., 2026). Graph memories\
  \ organize\n\ncontent around entities and their\n\nrelations (Bei et al., 2025;\
  \ Rasmussen et al., 2025; Gutiérrez et al., 2024; Gutiérrez et al., 2025; Edge et\
  \ al., 2024; Wu et al., 2026b),\n\nand hypergraph memories keep n-ary facts\n\n\
  together (Luo et al., 2025a; Yue et al., 2026). Typed designs split memory by\n\n\
  function, following cognitive accounts of episodic and semantic\n\nmemory (Tulving,\
  \ 1985; Pink et al., 2025).\n\nMIRIX (Wang and Chen, 2025) assigns six memory types\
  \ to dedicated agents, and\n\nPersonaAgent (Zhang et al., 2026e) pairs episodic\
  \ and semantic memory\n\nfor personalization. Memory stored in model parameters\
  \ or latent\n\n\nA63: states (Wang et al., 2024b; Wang et al., 2025b; Wang et al.,\
  \ 2025c; Behrouz et al., 2025) requires training\n\nand cannot be used with closed\
  \ models. Evaluation has moved from recall over\n\nlong conversations (Maharana\
  \ et al., 2024; Wu et al., 2025) to multi-session agentic\n\ntasks (Hu et al., 2026;\
  \ He et al., 2026), evolving\n\nenvironments (Ji et al., 2026), lifelong\n\npersonalization\
  \ (Zhang et al., 2026d), memory audits (Ma et al., 2026b), and\n\ncomparisons of\
  \ memory substrates (Huang et al., 2026c). MIRIX-2.0 combines the\n\ntyped and the\
  \ graph directions. Complete typed records remain the system of\n\nrecord, a provenance\
  \ hypergraph serves only as their index, and every graph\n\nfact cites its source\
  \ records.\n[S46] Multi-agent systems. (https://arxiv.org/html/2611.12068v1#S4.SS0.SSS0.Px2)\n\
  A64: Multi-agent systems divide a task among LLM agents that take different\n\n\
  roles (Guo et al., 2024; Luo et al., 2025b), from role-playing and\n\nconversable\
  \ agents (Li et al., 2023; Wu et al., 2024) to software teams and\n\ngroups of experts\
  \ (Hong et al., 2024; Qian et al., 2024; Chen et al., 2024).\n\nAgents can debate\
  \ (Du et al., 2024; Liang et al., 2024; Huang and Caragea, 2026),\n\noptimize their\
  \ workflow (Zhuge et al., 2024; Zhang et al., 2025b), or\n\ncommunicate through\
  \ latent representations (Yang et al., 2026). They also\n\nfail in new ways (Cemri\
  \ et al., 2025; Huang et al., 2026a), and one response keeps\n\nhumans in the loop\
  \ as\n\ncollaborators (Zou et al., 2025a; Zou et al., 2025b; Wu et al., 2026a).\
  \ Memory\n\nin these systems mostly serves the collaboration, through shared pools,\
  \ graphs\n\nof team trajectories, and sharing across users under access\n\ncontrol\
  \ (Gao and Zhang, 2026; Zhang et al., 2025a; Rezazadeh et al., 2025).\n\nMIRIX-2.0\
  \ applies the multi-agent design to memory itself. A Meta Memory Manager\n\nroutes\
  \ each input to the agents of the six memory types, and each agent writes\n\nonly\
  \ the records of its own type.\n[S47] Self-reflection and memory consolidation.\
  \ (https://arxiv.org/html/2611.12068v1#S4.SS0.SSS0.Px3)\nA65: Self-reflection lets\
  \ an agent improve from feedback on its own behavior without\n\nupdating its\n\n\
  weights (Shinn et al., 2023; Madaan et al., 2023; Park et al., 2023; Zhao et al.,\
  \ 2025).\n\nExperience-driven methods turn such feedback into reusable knowledge,\
  \ including\n\ninsights (Zhao et al., 2024), executable skills (Wang et al., 2024a),\n\
  \nworkflows (Wang et al., 2025e), reasoning\n\nstrategies (Ouyang et al., 2026),\
  \ and evolving playbooks and case\n\nbanks (Suzgun et al., 2026; Zhang et al., 2026c;\
  \ Fang et al., 2026b; Zhou et al., 2025).\n\nSkills can co-evolve with the policy\
  \ (Xia et al., 2026a; Xia et al., 2026b), be\n\nverified and optimized as\n\nartifacts\
  \ (Zhang et al., 2026b; Ma et al., 2026a), or form a\n\nhypergraph (Xu et al., 2026),\
  \ and agents, their harnesses, and their\n\nmemory architectures can improve\n\n\
  themselves (Xia et al., 2026d; Xia et al., 2026c; Liu et al., 2026b; Gao et al.,\
  \ 2026; Fang et al., 2025).\n\nConsolidation can also run offline, before queries\
  \ arrive or while the user is\n\ninactive (Lin et al., 2025; Fang et al., 2026a;\
  \ Xia et al., 2026b; Ye et al., 2026).\n\nRewriting memory carries risks. Consolidated\
  \ memories can become\n\nfaulty (Zhang et al., 2026a), and a defective skill can\
  \ contaminate\n\nthe skills distilled after it (Shang et al., 2026). AutoDream also\n\
  \nconsolidates outside the write path, but it limits what consolidation may\n\n\
  change.\nA66:  On semantic memory it merges only anchors that denote the same entity\n\
  \nand never rewrites stored records. On procedural memory it keeps a judged\n\n\
  outcome, and each experience a skill edit cites, only after checking the\n\nquoted\
  \ text.\n[S48] 5 Conclusion (https://arxiv.org/html/2611.12068v1#S5)\nA67: We presented\
  \ MIRIX-2.0, a multi-agent memory system that keeps complete typed\n\nrecords, indexes\
  \ them with a provenance hypergraph under explicit budgets, and\n\nruns AutoDream\
  \ outside the write path to merge duplicate anchors and refine\n\nskills. It leads\
  \ the compared systems on four of the five QA benchmarks, two of\n\nthem with AutoDream\
  \ disabled, reaching 91.4% on LoCoMo and 72.6% on\n\nLongMemEval-S, and it has the\
  \ highest value on all four metrics for\n\ncross-domain review summarization on\
  \ MemoryCD. On LoCoMo, the hypergraph and\n\nAutoDream each add accuracy over flat\
  \ memory. As procedural memory, its\n\ndistilled skills lead the compared memory\
  \ methods in mean success on ALFWorld\n\nand WebShop, and with GPT-5.2 they reach\
  \ 49.2% on MetaClaw-Bench, against\n\n44.0% reported for the MetaClaw skill library.\
  \ With AutoDream disabled, MIRIX-2.0 answers each question in less time than HyperMem\
  \ on all five timed benchmarks,\n\nand on WebShop its skills cost the fewest tokens\
  \ among the memory methods. One\n\nstore serves both uses, and the system runs with\
  \ closed and open models without\n\nfine-tuning. The results suggest that a memory\
  \ layer can be\n\npractical, accurate, and efficient at once when complete records\
  \ remain the\n\nsystem of record, the graph is only a bounded index, and consolidation\
  \ changes\n\nhow evidence is connected rather than what evidence exists.\n[S49]\
  \ Limitations. (https://arxiv.org/html/2611.12068v1#S5.SS0.SSS0.Px1)\nA68: Our ablations\
  \ add components in groups. They do not isolate n-ary frames,\n\ncited source rows,\
  \ occurrence identities, answer-time verification, or the\n\njudge, distiller, and\
  \ curator of procedural memory, so the explanations in Section 3\n\nremain interpretations.\
  \ The user-memory results come from single runs, partly\n\nscored by an LLM judge,\
  \ the agent results average three runs with large\n\nspreads, and some baselines\
  \ are values reported by their authors.\n[S50] Ethics and Broader Impact Statement\
  \ (https://arxiv.org/html/2611.12068v1#Sx1)\nA69: MIRIX-2.0 lets assistants and\
  \ task agents carry what users told them, and what the\n\nagents learned, from one\
  \ session to the next. Every graph fact cites the records it was\n\nextracted from,\
  \ so an answer can be traced to stored evidence.\n\nIt is intended for assistants\
  \ that users knowingly choose to use and should\n\nnot be used to build profiles\
  \ of people without their consent. A user-centric\n\nmemory accumulates personal\
  \ and possibly sensitive information. MIRIX-2.0 keeps\n\nsensitive verbatim values\
  \ in a Knowledge Vault that the hypergraph does not\n\nindex, but this does not\
  \ replace consent and access control. A deployment\n\nshould let users view, correct,\
  \ and delete their memories, confine each memory\n\nto its user (Rezazadeh et al.,\
  \ 2025), and use model providers or local\n\nmodels that meet its privacy requirements,\
  \ because stored content is sent to\n\nthe model. Memory can also make mistakes\n\
  \npersistent (Zhang et al., 2026a; Shang et al., 2026), and content\n\ninjected\
  \ into a conversation can be stored and later retrieved as if it were\n\ntrusted.\
  \ A wrong merge\n\nchanges only the index, and a procedural edit keeps a citation\
  \ only after its\n\nquote is checked, but in high-stakes settings learned skills\
  \ and merged\n\nidentities should still be reviewed by a person and stored memories\
  \ audited\n\nperiodically (Ma et al., 2026b). All experiments use publicly released\n\
  \n\nA70: benchmarks under their licenses. We collected no new data and ran no study\
  \ with human participants.\n\nMemoryCD is built from public Amazon product reviews,\
  \ and we use it as\n\nreleased without attempting to identify the reviewers.\n[S51]\
