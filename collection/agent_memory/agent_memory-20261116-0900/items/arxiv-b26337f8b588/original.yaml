  \ memories associated with its co-participants. In the relation-citation\n\nlane,\
  \ which opens when the query plan contains a relation, the exactly named anchors\
  \ seed an indexed adjacency lookup over their incident\n\nframes. Predicate filtering\
  \ applies before a cap of 240 frames, the fact score\n\nbelow ranks the rest, and\
