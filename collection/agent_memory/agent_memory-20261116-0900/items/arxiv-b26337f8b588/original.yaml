  - id: S52
    title: Appendix A Method details
    text: 'This appendix collects the details of Section 2 that the main text summarizes
      or leaves out, in the order of its


      subsections. For each part it states the


      constants, schedules, scoring rules, and examples, explains why they are


      designed as they are, and names the step of Algorithm 1 they belong to.'
    location: https://arxiv.org/html/2611.12068v1#A1
  - id: S53
    title: A.1 Memory types, routing, and writing
    text: 'The Meta Memory Manager is the first call of the write path


      (Algorithm 1, line 2). The router reads the input and


      selects the memory types it updates. Each selected writer then reads the


      current store P_{u}^{t-1} and produces a record that line 3


      commits to the evidence plane before any graph work begins. Formally, each


      input x_{t} is mapped to a subset of six specialized writers,


      \displaystyle\mathcal{K}_{t}


      \displaystyle=R_{\theta}(x_{t}),


      (A.1)


      \displaystyle m_{t}^{(k)}


      \displaystyle=W_{k}(x_{t},P_{u}^{t-1}),\quad k\in\mathcal{K}_{t},


      and each writer owns the schema and update operations of one memory type. Both


      steps of (A.1) are language-model calls, which is why the router


      and the writers carry the \star mark in Algorithm 1.


      Table 5 lists the six types.


      Table 5: The six memory types of MIRIX-2.0 and their roles.


      Memory


      Primary role


      Hypergraph indexed


      Core


      persistent user and agent state


      no


      Episodic


      time-grounded occurrences


      yes


      Semantic


      durable facts and concepts


      yes


      Procedural


      executable workflows


      no


      Resource


      documents and multimodal artifacts


      no


      Knowledge Vault


      sensitive verbatim values


      no


      The separation is functional. Only episodic and semantic memory are indexed
      by


      the hypergraph, because they hold the event and relational evidence that


      cross-memory traversal needs. The other types keep their direct, type-specific


      retrieval paths. Core memory holds the persistent state of the user and the


      agent, procedural memory holds the skills that Section 2.5 refines,


      resource memory holds documents and multimodal artifacts, and the knowledge


      vault holds sensitive verbatim values. Each of them is read through its own
      typed path rather than through the graph.


      In Algorithm 1, the test k\in\{\mathrm{episodic},\mathrm{semantic}\} is the
      only step of the write


      path that depends on whether a record is graph-indexed. In Figure 2, both user
      turns are


      routed to the episodic and semantic writers.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS1
  - id: S54
    title: Source-faithful writing.
    text: 'Before a record reaches the graph extractor, the writer prompts of our
      runs ask


      the episodic and semantic writers to keep complete lists, names, counts, titles,


      locations, and dates in the record’s details instead of replacing them with
      a


      topical gist. Episodic writers store the time an event happened rather than
      the


      time it was mentioned, and they store a planned event with its planned date.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS1.SSS0.Px1
  - id: S55
    title: Write ordering.
    text: 'The write to the vector database commits before graph construction begins


      (line 3). Graph extraction


      is a fail-soft indexing hook, so a graph failure is logged but never rolls back


      a stored memory. The evidence plane is thus the durable system of record rather


      than a side effect of graph construction.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS1.SSS0.Px2
  - id: S56
    title: A.2 Anchor admission, canonicalization, and frame extraction
    text: 'This part details lines 5 to 9 of


      Algorithm 1, which turn a committed episodic or semantic record into the


      anchors and frames of Section 2.3.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS2
  - id: S57
    title: Anchor keys and admission.
    text: 'The key \kappa(n) of an anchor name normalizes case, punctuation, articles


      and other function words, word order, and conservative singular and plural


      variants while keeping numbers. In the code it lowercases the name, replaces


      punctuation with spaces, drops a fixed list of eleven articles and function


      words, singularizes tokens of at least four letters, and sorts the remaining


      tokens, so that Mobile App and Mobile Apps share one key. The key


      is deliberately conservative. Numbers and dates are preserved, so 10 Gallons
      and 20 Gallons


      stay distinct, and only plural endings are normalized, so Training and


      Trains stay apart. A


      single admission gate rejects generic filing terms, such as advice,


      details, information, plan, and tips, and


      dialogue-role pseudo-entities such as user and assistant, and it


      keeps at most 16 anchors for an episodic record and 18 for a semantic one. The


      caps bound the anchor space of a user, and they are sized for the arguments
      of


      an assertion rather than for a bag of keywords, so that one frame with seven


      arguments does not exhaust them. The gate is the Admit call of


      Algorithm 1, and because it runs on the canonical key, one entry such as


      user also blocks User, Users, and the user.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS2.SSS0.Px1
  - id: S58
    title: Registry-guided canonicalization.
    text: 'For every extracted entity, approximate nearest-neighbor search retrieves
      up to four existing anchors of the user whose cosine


      similarity is at least 0.72 , and one language-model call per record makes a


      conservative same-entity decision for all of its entities. The vector index


      scores a pair by (1+\cos)/2 , so the thresholds in the code are 0.86 here


      and 0.93 for AutoDream (Section A.5). The call is instructed


      not to merge different quantities, different days or months, different form
      or


      model codes, or related but distinct concepts. Canonicalization runs before
      the admission gate, which is the order \textsc{Admit}(\textsc{Canon}^{\star}(\Phi))
      of


      Algorithm 1, so the gate judges canonical names rather than surface forms.


      The candidates come from the anchors the user already has, which is what keeps


      naming consistent as the graph grows and why we call the step registry-guided.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS2.SSS0.Px2
  - id: S59
    title: Frames, literals, and repair.
    text: 'The extractor behind (5) is instructed to keep dates, prices,


      counts, durations, and measurements as literals on the frame rather than as


      anchors, so that values such as 7, $420, or three months stay attached to the


      assertion they qualify. A frame is materialized only if its arguments resolve


      to at least two distinct anchors of the user, which is the test |A_{f}|\geq
      2


      of Algorithm 1. When a deterministic audit finds that the extraction


      misses high-signal source details, such as quoted phrases, numbers, or concrete


      visual content, one bounded repair call may add frames that the source


      supports. The repair cannot remove anything the primary extraction produced.


      The audit compares the words of the rendered frames with the source text. It


      lists the quoted phrases and the numbers of the source that the frames do not


      cover, it treats a source with visual content as uncovered when the frames


      cover less than 45 percent of its content words, and it sends at most twelve


      missing items to the repair call. A missing date alone does not trigger a


      repair, because session dates recur in many records and are already preserved


      by provenance. A missing date is added to a call that a missing quote, number,


      or visual detail already requires. Repair is the \textsc{Repair}^{\star} call
      of


      line 5, and the frames it adds pass through the same


      canonicalization, admission, and identity rules as the primary ones.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS2.SSS0.Px3
  - id: S60
    title: A.3 Retrieval budgets, lanes, scores, and fusion
    text: 'This part details the Read procedure of Algorithm 1, whose steps


      Section 2.4 introduces.


      Table 6: Row budgets B_{q}^{B} and B_{q}^{R} per query operator.


      Operator


      B_{q}^{B}


      B_{q}^{R}


      Single


      6


      4


      Temporal


      6


      6


      Intersection


      7


      7


      List-union


      7


      9


      Count


      8


      12'
    location: https://arxiv.org/html/2611.12068v1#A1.SS3
  - id: S61
    title: Operator budgets.
    text: 'The planner (9) fixes two row budgets for every query, and


      Table 6 lists them by operator.


      The budgets grow with the operator, because counting and set construction need


      broader evidence than a single-value lookup. A single-value question needs the


      one row that holds the value, so its cited-row budget is the smallest, whereas
      a count has to see many members of the set it counts. The evidence a


      question inspects is therefore bounded by its operator and not by the length
      of


      the history.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS3.SSS0.Px1
  - id: S62
    title: Anchor entry.
    text: 'Beyond the fifteen anchors that vector recall returns, a relation query
      adds up


      to sixteen anchors that the question names exactly before the union is scored


      by (10). Person hubs receive a larger penalty unless a


      relation query names them explicitly. Only the exactly named anchors carry degree


      and predicate information, so the hub and predicate terms act on them alone.


      The two entry routes serve different questions. Vector recall finds the anchors


      whose names paraphrase the question, and exact lookup finds the anchors that
      a


      relation question names, so that the relation lane can start from the named


      participants rather than from their nearest paraphrases.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS3.SSS0.Px2
  - id: S63
    title: Two evidence lanes.
    text: 'The lanes follow three rules beyond those of Section 2.4. In the


      base-recall lane, same-chunk support and immediate temporal neighbors are


      recomputed from the provenance stored in the vector database instead of being
      duplicated as graph


      bookkeeping edges. In the relation-citation lane, predicate filtering runs


      inside Neo4j before the cap of 240 frames, and when the question names a


      concrete object, only frames that contain it are kept. The base lane is the
      \textsc{Rows}(A_{q}) term and the relation lane the


      \textsc{Adj}(A_{q},\mathcal{P}_{q}) term of Algorithm 1. Recomputing


      same-chunk and temporal neighbors from provenance keeps the graph free of edges


      that only restate what the evidence plane already records. Filtering by


      predicate inside the database before the cap means that an explicitly named
      hub


      with hundreds of incident frames does not trigger a full traversal, and the


      frames that survive the cap are selected by a deterministic order on the frame


      identifier, so which frames pass does not depend on the traversal order of the


      database.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS3.SSS0.Px3
  - id: S64
    title: Fact scoring.
    text: 'Two details of (11) complete Section 2.4. When a


      frame has no extracted event time, the state term s_{\mathrm{state}} falls


      back at half weight to the time of the source record, so the frame can still


      compete on time. For intersection questions, a hard shared-object group is preserved
      before


      these soft refinements, so recency cannot replace evidence that satisfies only


      one side of the intersection. The role term reads the typed roles of a frame,


      and the state term reads the status literal that marks an event as planned or


      completed (Section 2.3), which is how planned events are penalized in count,


      list-union, and temporal questions.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS3.SSS0.Px4
  - id: S65
    title: Citation-balanced fusion.
    text: 'Rows in each lane are reranked with a shallow vector-rank prior and the
      lexical


      coverage of the query. Fusion runs separately for episodic and semantic rows


      within the row limit of a request. Near-duplicate episodic paraphrases


      are collapsed only when they share a calendar date, so the same wording on two


      different dates stays separate. Cited rows are filled first because a graph


      fact without the row that supports it would leave the answer unverifiable, and


      the date condition on paraphrase collapse is the retrieval-side counterpart
      of


      the occurrence identity (7), which keeps undated


      repetitions apart at write time.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS3.SSS0.Px5
  - id: S66
    title: A.4 Answer-time verification
    text: 'The Answer procedure of Algorithm 1 belongs to the evaluation


      harness rather than to the memory server, and the rule-based check of


      Section 2.4 never inspects a reference answer. The check fires when it


      finds explicit uncertainty, a count without a number or one that disagrees with


      a listed count, a temporal answer without a time, an answer number or month
      that


      is absent from the evidence ledger and the question, ledger evidence with an


      incompatible role, or a planned event in a count question. It also fires on


      every intersection question. The extra search uses a query derived from


      \Pi(q) , or the question itself for a relation query. Most triggers mark a


      way in which a draft falls short of the evidence it was given or disagrees with


      it. A number or month that appears in neither the ledger nor the question was


      not retrieved, a count that disagrees with a listed count contradicts the


      evidence, and a planned event in a count question would count something that
      has


      not happened. Intersection questions always trigger the check because they need


      evidence for both sides, and a first retrieval that satisfies one side can look


      complete. The rewrite is line 19 of Algorithm 1, so the


      procedure adds at most one search and one model call to a question.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS4
  - id: S67
    title: A.5 AutoDream schedule, candidates, and procedural refinement
    text: 'This part details the SemanticDream and ProceduralDream


      procedures of Algorithm 1 (lines 22 to 29) and expands Section 2.5.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS5
  - id: S68
    title: Invocation protocol.
    text: 'Semantic AutoDream is an explicit service call that never schedules itself.
      In


      our protocol, the ingestion driver invokes AutoDream after every five chunks
      and


      once after the final chunk. The chunk identifiers of each call resolve to the


      newly written semantic rows, which define the frontier \Delta_{u} of


      (12), and the eligible anchors backed by those rows are the


      sources \mathcal{A}_{\Delta} of (13). An intermediate


      call therefore examines only the anchors whose semantic rows the batch just


      wrote, and the final call also considers the eligible anchors that no earlier


      call used as a source.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS5.SSS0.Px1
  - id: S69
    title: Candidate generation.
    text: 'The identity-stable types \mathcal{T}_{\mathrm{safe}} of


      Section 2.5 are person, organization, location, object, and concept.


      Anchors of the types event, date, content, method, and other are


      excluded deliberately, because merging two of them can collapse distinct occurrences
      or temporal


      context even when their names are close in embedding space. Both endpoints of
      a candidate pair must be backed by semantic rows and


      share the same eligible type, and the cosine threshold 0.86 of


      (13) is the index score 0.93 under the


      (1+\cos)/2 scale of Section A.2.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS5.SSS0.Px2
  - id: S70
    title: Bounded schedule.
    text: 'An intermediate Dream verifies at most 80 unseen pairs from the current
      semantic


      delta. The final Dream considers the delta together with eligible anchors that


      have never served as a Dream source, and it verifies at most 120 pairs. If that


      round merges anything, one repair round examines only the touched


      representatives and verifies at most 60 more pairs. Explicit negative decisions


      are cached by anchor type, so later cycles do not


      pay again to reconsider the same pair. The cache key hashes the case-folded


      pair in sorted order together with the type, so the


      order in which a pair is encountered does not matter. Only explicit rejections
      are cached. A pair that a round did not reach within


      its cap is not recorded as rejected, so it becomes a candidate again whenever
      one of


      its anchors is in a later frontier.


      The intermediate rounds keep the graph consolidated while ingestion proceeds,


      and the final round sweeps up anchors that earlier rounds never used as a source.
      In Algorithm 1, the cache is the set


      \mathcal{N} that line 22 subtracts from the candidate


      pairs, and the per-round caps bound the number of \textsc{Same}^{\star} calls


      the loop makes.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS5.SSS0.Px3
  - id: S71
    title: Procedural refinement.
    text: 'Two rules of the procedural path complete Section 2.5. The distiller


      judges the outcome of each pending session from quotes in its transcript, and
      an


      outcome whose quotes do not occur in the transcript is downgraded to unclear


      rather than trusted. Besides creating, editing, or deleting a skill, the curator


      can mark an experience as already covered, not worth a skill, or deferred, so
      it


      can decline an experience without changing the store. The quote check on


      outcomes and the quote check on citations are the procedural counterpart of
      the


      provenance that the hypergraph keeps for facts. They keep the skill library


      traceable although both \textsc{Distill}^{\star} and \textsc{Curate}^{\star}


      in Algorithm 1 are language-model calls.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS5.SSS0.Px4
  - id: S72
    title: Hard invariants.
    text: 'Four properties hold regardless of model behavior.


      1.


      Every returned graph fact exposes the identifiers of its source


      memories.


      2.


      Undated episodic occurrences from different memory rows receive


      different frame identities.


      3.


      Retrieval and Dream both run under explicit candidate and output caps.


      4.


      A failed graph write cannot destroy a committed memory, and a graph


      read that raises an error falls back to direct evidence retrieval.


      Together with Equation 12, the first and fourth invariants give


      the source fidelity required in Section 2.1, the third gives


      bounded access, and the second gives temporal identity.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS6.SSS0.Px1
  - id: S73
    title: Learned and deterministic decisions.
    text: 'Language models route inputs, write typed memories, extract frames, repair


      missing source details, judge semantic identity, and distill and curate


      procedural experience. Together with answer generation, these are the calls


      marked \star in Algorithm 1. Deterministic code owns the


      safety-critical boundaries, namely admissible anchor names, candidate


      allowlists, frame identities, the representation of events and their status,


      provenance attachment, query operators, lane budgets, merge algebra, and


      mutation order. An LLM may propose that two anchors are identical, for instance,


      but it cannot name an anchor outside the retrieved candidate set or delete


      evidence directly.'
    location: https://arxiv.org/html/2611.12068v1#A1.SS6.SSS0.Px2
  - id: S74
    title: Complexity.
    text: 'Let d be the number of admitted anchors in one memory, h the number of


      frames extracted from it, K_{A} the anchor-retrieval cap, and K_{F} the


      adjacent-frame cap. Ignoring model inference and indexed database lookups,


      writing a memory into the graph costs O(d+h) . Post-retrieval ranking and


      fusion cost O(K_{A}+K_{F}+K_{M}) , where K_{M} is the operator-dependent cited-row


      budget, and the system never materializes an unbounded evidence set from the
      vector database.


      For a Dream frontier of size |\Delta_{u}| , nearest-neighbor generation costs


      O(|\Delta_{u}|\log|\mathcal{A}_{u}|) under the vector index, and LLM verification


      is capped at 80 pairs per intermediate cycle and 180 pairs across the two


      possible final rounds. The constants behind these symbols are the ones of this


      appendix. The admission gate bounds d by 16 for an episodic record and 18


      for a semantic one (Section A.2), K_{A} is the fifteen anchors kept after scoring,
      K_{F} is the cap of 240 frames, and K_{M} is B_{q}^{R} , at most 12


      (Section A.3). The 180 final pairs are the 120 of the final


      round plus the 60 of its repair round (Section A.5).'
    location: https://arxiv.org/html/2611.12068v1#A1.SS6.SSS0.Px3
  - id: S75
    title: A.7 Implementation and an example hypergraph
    text: 'Evidence rows are stored in a vector database and the hypergraph in Neo4j.


      Figure 9 shows part of the hypergraph that MIRIX-2.0 builds for


      LoCoMo conversation conv-26, in which Caroline and Melanie talk from May to


      October 2023. The full graph has 792 anchors, 1,379 frames, and 3,303 role


      edges. The figure keeps the 32 anchors that appear in the most frames, leaving


      out generic duplicates such as Family and kids, together with the 448 frames


      that join at least two of them.


      The two speakers are the largest hubs, with 650 and 529 frames. Topics that


      one speaker raises gather on that speaker’s side, such as the pride parade and


      Becoming Nicole for Caroline and pottery and her family for Melanie. The


      94 frames that join only the two speakers lie between the hubs and are drawn
      in


      gray, and painting and art are reached from both sides. Each frame also keeps
      role labels,


      literals such as dates, and citations to its source records, which the figure


      leaves out. Through these frames one anchor gathers evidence across sessions.


      Self-Acceptance appears in 13 frames from 10 sessions, which link it to the


      LGBTQ support group, the pride parade, Becoming Nicole, and Caroline’s


      painting Embracing Identity.


      Figure 9: The 32 anchors with the most frames in the conv-26 hypergraph and
      the 448 frames that join them. Anchors are colored by type and sized by frame
      count, and frames take the color of their nearest topic.


      We built this graph with graph indexing and AutoDream enabled, using Claude


      Haiku 5.5 for extraction and Cohere Embed v4 for embeddings instead of the


      models described in Section 3.1.'
