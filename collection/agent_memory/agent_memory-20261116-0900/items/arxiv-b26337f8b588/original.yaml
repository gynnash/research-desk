  - id: S77
    title: B.1 User memory
    text: 'Table 8 lists the LongMemEval-S accuracy of every system, judged like LoCoMo


      by gpt-4o-mini with majority-of-3 voting. It reports M0, M1, and M2, so it complements
      the LoCoMo


      ablation of Table 1. Table 8 gives the results on the three document QA tasks
      of


      MemoryAgentBench. SHDocQA and MHDocQA ask single-hop and multi-hop questions
      about


      long documents and use substring matching on 100 questions each, and DetectiveQA
      uses


      letter exact matching on 71 questions. The document QA runs use M1, with AutoDream
      disabled by experimental choice.


      We ran HyperMem ourselves with its original settings unchanged, and all HyperMem


      results in this paper come from these runs. On LoCoMo, our run reaches 91.0%,


      below the 92.7% reported by Yue et al. [2026].


