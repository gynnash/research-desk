      On LongMemEval-S the graph increment of 11.2 points accounts for most of the


      14.3-point margin over HyperMem. The


      flat configuration M0 reaches 58.8%, close to HyperMem at 58.3% and mem0 at
      56.3%,


      while M1 reaches 70.0% and M2 72.6%, 14.3 points above HyperMem. On SHDocQA
      and MHDocQA, HyperMem is the strongest baseline, and M1 leads it by 31.0


      and 22.0 points. DetectiveQA is the exception.


      MemoryBank leads with 67.6%, followed by HyperMem with 66.2% and M1 with 64.8%.


      A-Mem varies the most across the three document tasks, from 14.0% on SHDocQA
      to


      62.0% on DetectiveQA.


