  A30: Each relation-lane frame receives the additive score\n\n\\displaystyle s_{F}(f,q)={}\n\
  \n\\displaystyle s_{\\mathrm{rel}}+s_{\\mathrm{entity}}+s_{\\mathrm{constraint}}+s_{\\\
  mathrm{type}}\n\n\\displaystyle+s_{\\mathrm{time}}+s_{\\mathrm{intersection}}+s_{\\\
  mathrm{specificity}}\n\n\\displaystyle+s_{\\mathrm{role}}+s_{\\mathrm{state}}.\n\
  \n(11)\n\nThe first seven terms score relation, named-entity, literal, answer-type,\
