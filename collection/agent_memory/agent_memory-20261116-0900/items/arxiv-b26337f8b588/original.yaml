  - id: S37
    title: Setup and transfer to held-out tasks.
    text: 'We evaluate procedural memory on ALFWorld (Shridhar et al., 2021) and


      WebShop (Yao et al., 2022), comparing an agent without memory with


      ReasoningBank (Ouyang et al., 2026), Agent Workflow Memory


      (AWM) (Wang et al., 2025e), and MIRIX-2.0. Within each comparison, methods share
      the


      actor prompt and backbone. ALFWorld uses GPT-6 Luna and GPT-5.6 Luna; WebShop


      uses GPT-6 Luna. Each memory method learns from the same training tasks,


      39 for ALFWorld and 40 for WebShop. Memory is then frozen for evaluation on


      134 held-out ALFWorld episodes with a 50-step cap and 140 WebShop instructions


      with a 15-step cap. Results are averaged over three independent runs.


      The separation between memory learning and evaluation tests reuse of acquired


      procedures on new tasks.


      This setting exercises the procedural branch of AutoDream


      (Section 2.5). Sessions supply lessons to reuse and mistakes to


      avoid, and a curator turns those experiences into skills. Unlike semantic


      consolidation, which preserves the factual records and changes their index,


      procedural refinement changes the instructions available to the actor. The


      experiments evaluate the utility of that combined process; they do not


      separately ablate the outcome judge, experience distiller, or curator.


      Figure 6: Agent memory on held-out tasks. Success rate, mean and standard deviation
      over three runs.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS3.SSS0.Px1
  - id: S38
    title: 'ALFWorld: useful procedures must generalize across action sequences.'
    text: 'Figure 6, and Table 10 in the appendix, show the highest mean


      overall success among the compared methods for MIRIX-2.0 with both backbones.
      With GPT-6 Luna it reaches


      76.4%, compared with 69.4% without memory and 73.6% with AWM. With GPT-5.6


      Luna it reaches 61.7%, compared with 54.2% and 58.0%, respectively.


      The gains over no memory are similar, at 7.0 and 7.5 points, but they are not


      uniform across task types (Figure 7). With GPT-6 Luna, Clean improves from 60.2%
      to


      74.2% and Heat from 47.8% to 73.9%, while Pick, Look, and Pick Two remain


      below the no-memory scores. This suggests that procedures are most useful


      when they supply missing action structure; retrieving a routine can also


      interfere with a task the actor already handles well.


      The step counts provide a complementary view. Successful episodes require


      13.2 rather than 14.2 steps with GPT-6 Luna and 12.4 rather than 16.1 with


      GPT-5.6 Luna, relative to no memory. This is consistent with more direct


      action sequences, but the successful subsets differ across methods, so these


      are not paired measurements on identical solved tasks. The large success-rate


      standard deviations for MIRIX-2.0, 6.2 and 14.0 points, also limit the conclusion.
      It has the highest observed mean, but three runs do not establish a stable


      advantage over AWM.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS3.SSS0.Px2
  - id: S39
    title: 'WebShop: procedure quality matters more than memory availability.'
    text: 'Table 11 in the appendix reports 37.4% success for MIRIX-2.0, compared
      with


      31.9% without memory, 25.7% with ReasoningBank, and 36.0% with AWM.


      ReasoningBank falls below no memory on both interactive benchmarks with


      GPT-6 Luna, showing that adding experience memory is not sufficient to improve


      an actor. In WebShop, MIRIX-2.0 leads the memory methods on Fashion and Beauty,


      ties AWM on Garden and Grocery, and trails AWM on Electronics. A plausible


      interpretation is that reusable constraint checks help some product searches,


      while other searches need more task-specific guidance. The category results


      do not directly identify which learned skills caused those differences.


      MIRIX-2.0 uses 8.2 steps per episode and 6.3 per successful episode, fewer than


      the other memory methods but slightly more than no memory at 7.9 and 6.2.


      Thus, its benefit is a higher success rate with modest additional interaction,


      not a reduction in steps relative to every baseline.


      Figure 7: ALFWorld success by task type with GPT-6 Luna, over three runs.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS3.SSS0.Px3
  - id: S40
    title: 'MetaClaw-Bench: answer quality and completed artifacts are distinct.'
    text: 'Table 3 evaluates agent memory on Part I of


      MetaClaw-Bench (Xia et al., 2026b), which spans 30 days.


      Accuracy is the official mean


      per-question score, which combines binary file checks with partial credit on


      multiple-choice questions, and completion is the completion rate over the 224
      file-check


      questions. With GPT-5.2, MIRIX-2.0 improves the official


      mean question score from 44.0% for MetaClaw Skills to 49.2%, and file-check


      completion from 17.1% to 27.7%. The larger completion gain, 10.6 points,


      suggests that reusable procedures can help produce the required artifacts as


      well as improve question scores. With Qwen3.6-35B-A3B, the score gain is


      smaller, from 51.8% to 52.7%, and completion is tied at 30.8%. The benefit


      therefore depends on the backbone and on what the metric measures.


      The GPT-5.2 baselines are reported values from the MetaClaw paper, so this


      comparison is not evidence from a fully controlled rerun. Unlike ALFWorld and


      WebShop, this table does not report variation across independent runs or a


      matched procedural-component ablation.


