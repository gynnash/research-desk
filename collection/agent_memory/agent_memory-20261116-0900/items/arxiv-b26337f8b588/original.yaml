      Table 12 shows where graph construction costs time. On the three document tasks,
      M1


      ingests 3.8 to 4.0 times more slowly than M0 and 3.4 to 5.0 times more slowly
      than


      HyperMem. On the conversational benchmarks the order reverses, and M1 needs
      21,416 s


      for LoCoMo against 69,467 s for HyperMem and 70,626 s for LongMemEval-S against


      170,224 s. Answering is faster for M1 than for HyperMem on all five benchmarks,
      by between 0.63 s per question on LongMemEval-S and 5.81 s on DetectiveQA, although
      M0 answers


      the document questions faster still. M1 uses fewer answer tokens than HyperMem
      on four


      benchmarks and more on DetectiveQA, 1.16M against 0.35M. Its graphs range from
      23,820


      nodes and 32,394 edges for LoCoMo to 181,131 nodes and 205,428 edges for


      LongMemEval-S.


      For Table 4, training covers actor interactions and memory


      learning, and testing covers actor interactions and memory retrieval on all
      test


      tasks, including unsuccessful ones. Counts include LLM input and output tokens,
      with


      reasoning tokens in the output and cached tokens in the input, and exclude embedding


      tokens. No memory skips training.'
