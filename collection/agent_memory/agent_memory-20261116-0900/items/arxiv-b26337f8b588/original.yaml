  - id: S44
    title: 3.5 What the experiments establish
    text: 'The results support the three properties in different measure. Accuracy
      has


      the broadest support. The M0, M1, and M2 ordering holds on both conversational


      benchmarks, and MIRIX-2.0 leads the compared systems on four of the five QA


      benchmarks, two of them with AutoDream disabled. As procedural memory, it has


      the highest mean success among the compared memory methods on ALFWorld with


      both backbones and on WebShop, and the highest MetaClaw-Bench score with both


      backbones, while the no-memory comparisons show that retrieved experience can


      also hurt. Efficiency holds for answering more than for ingestion. With


      AutoDream disabled, MIRIX-2.0 answers faster than HyperMem on every timed


      benchmark, and on WebShop it uses the fewest training and test tokens among


      the memory methods. Graph construction, however, makes document ingestion 3.8


      to 4.0 times slower than flat memory, and the ALFWorld test tokens of MIRIX-2.0
      are


      the highest among the memory methods. Practicality rests on the design and on


      our protocol rather than on a deployment. One store serves both uses, no model


      is fine-tuned, and every graph fact returned to the answerer cites its source


      rows.


      The tables evaluate complete configurations, so the component explanations in


      this section remain interpretations, and the limitations in


      Section 5 list the ablations that would test them. The tables also


      do not measure merge precision, source-detail retention, skill provenance


      coverage, or the contribution of the six-writer routing policy, and they do
      not


      report memory length or user-memory ingestion tokens, for which graph counts


      and answer tokens cannot substitute.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS5
  - id: S45
    title: Memory systems for LLM agents.
    text: 'Memory systems for LLM agents keep past interactions outside the model
      and


      retrieve them when they become


      relevant (Huang et al., 2026b; Zhang et al., 2025c; Wang et al., 2025a; Guo
      et al., 2026).


      Early designs rank or decay a memory stream (Park et al., 2023; Zhong et al.,
      2024)


      or manage memory the way an operating system manages


      storage (Packer et al., 2023; Kang et al., 2025; Li et al., 2025). Later systems
      extract and update


      salient facts (Chhikara et al., 2025), link notes into an evolving network (Xu
      et al., 2025),


      compress what they store (Fang et al., 2026a; Liu et al., 2026a), or learn


      memory construction with reinforcement


      learning (Wang et al., 2025d; Yan et al., 2026). Graph memories organize


      content around entities and their


      relations (Bei et al., 2025; Rasmussen et al., 2025; Gutiérrez et al., 2024;
      Gutiérrez et al., 2025; Edge et al., 2024; Wu et al., 2026b),


      and hypergraph memories keep n-ary facts


      together (Luo et al., 2025a; Yue et al., 2026). Typed designs split memory by


      function, following cognitive accounts of episodic and semantic


      memory (Tulving, 1985; Pink et al., 2025).


      MIRIX (Wang and Chen, 2025) assigns six memory types to dedicated agents, and


      PersonaAgent (Zhang et al., 2026e) pairs episodic and semantic memory


      for personalization. Memory stored in model parameters or latent


      states (Wang et al., 2024b; Wang et al., 2025b; Wang et al., 2025c; Behrouz
      et al., 2025) requires training


      and cannot be used with closed models. Evaluation has moved from recall over


      long conversations (Maharana et al., 2024; Wu et al., 2025) to multi-session
      agentic


      tasks (Hu et al., 2026; He et al., 2026), evolving


      environments (Ji et al., 2026), lifelong


      personalization (Zhang et al., 2026d), memory audits (Ma et al., 2026b), and


      comparisons of memory substrates (Huang et al., 2026c). MIRIX-2.0 combines the


      typed and the graph directions. Complete typed records remain the system of


      record, a provenance hypergraph serves only as their index, and every graph


      fact cites its source records.'
    location: https://arxiv.org/html/2611.12068v1#S4.SS0.SSS0.Px1
  - id: S46
    title: Multi-agent systems.
    text: 'Multi-agent systems divide a task among LLM agents that take different


      roles (Guo et al., 2024; Luo et al., 2025b), from role-playing and


      conversable agents (Li et al., 2023; Wu et al., 2024) to software teams and


      groups of experts (Hong et al., 2024; Qian et al., 2024; Chen et al., 2024).


      Agents can debate (Du et al., 2024; Liang et al., 2024; Huang and Caragea, 2026),


      optimize their workflow (Zhuge et al., 2024; Zhang et al., 2025b), or


      communicate through latent representations (Yang et al., 2026). They also


      fail in new ways (Cemri et al., 2025; Huang et al., 2026a), and one response
      keeps


      humans in the loop as


      collaborators (Zou et al., 2025a; Zou et al., 2025b; Wu et al., 2026a). Memory


      in these systems mostly serves the collaboration, through shared pools, graphs


      of team trajectories, and sharing across users under access


      control (Gao and Zhang, 2026; Zhang et al., 2025a; Rezazadeh et al., 2025).


      MIRIX-2.0 applies the multi-agent design to memory itself. A Meta Memory Manager


      routes each input to the agents of the six memory types, and each agent writes


      only the records of its own type.'
    location: https://arxiv.org/html/2611.12068v1#S4.SS0.SSS0.Px2
  - id: S47
    title: Self-reflection and memory consolidation.
    text: 'Self-reflection lets an agent improve from feedback on its own behavior
      without


      updating its


      weights (Shinn et al., 2023; Madaan et al., 2023; Park et al., 2023; Zhao et
      al., 2025).


      Experience-driven methods turn such feedback into reusable knowledge, including


      insights (Zhao et al., 2024), executable skills (Wang et al., 2024a),


      workflows (Wang et al., 2025e), reasoning


      strategies (Ouyang et al., 2026), and evolving playbooks and case


      banks (Suzgun et al., 2026; Zhang et al., 2026c; Fang et al., 2026b; Zhou et
      al., 2025).


      Skills can co-evolve with the policy (Xia et al., 2026a; Xia et al., 2026b),
      be


      verified and optimized as


      artifacts (Zhang et al., 2026b; Ma et al., 2026a), or form a


      hypergraph (Xu et al., 2026), and agents, their harnesses, and their


      memory architectures can improve


      themselves (Xia et al., 2026d; Xia et al., 2026c; Liu et al., 2026b; Gao et
      al., 2026; Fang et al., 2025).


      Consolidation can also run offline, before queries arrive or while the user
      is


      inactive (Lin et al., 2025; Fang et al., 2026a; Xia et al., 2026b; Ye et al.,
      2026).


      Rewriting memory carries risks. Consolidated memories can become


      faulty (Zhang et al., 2026a), and a defective skill can contaminate


      the skills distilled after it (Shang et al., 2026). AutoDream also


      consolidates outside the write path, but it limits what consolidation may


      change. On semantic memory it merges only anchors that denote the same entity


      and never rewrites stored records. On procedural memory it keeps a judged


      outcome, and each experience a skill edit cites, only after checking the


      quoted text.'
    location: https://arxiv.org/html/2611.12068v1#S4.SS0.SSS0.Px3
  - id: S48
    title: 5 Conclusion
    text: 'We presented MIRIX-2.0, a multi-agent memory system that keeps complete
      typed


      records, indexes them with a provenance hypergraph under explicit budgets, and


      runs AutoDream outside the write path to merge duplicate anchors and refine


      skills. It leads the compared systems on four of the five QA benchmarks, two
      of


      them with AutoDream disabled, reaching 91.4% on LoCoMo and 72.6% on


      LongMemEval-S, and it has the highest value on all four metrics for


      cross-domain review summarization on MemoryCD. On LoCoMo, the hypergraph and


      AutoDream each add accuracy over flat memory. As procedural memory, its


      distilled skills lead the compared memory methods in mean success on ALFWorld


      and WebShop, and with GPT-5.2 they reach 49.2% on MetaClaw-Bench, against


      44.0% reported for the MetaClaw skill library. With AutoDream disabled, MIRIX-2.0
      answers each question in less time than HyperMem on all five timed benchmarks,


      and on WebShop its skills cost the fewest tokens among the memory methods. One


      store serves both uses, and the system runs with closed and open models without


      fine-tuning. The results suggest that a memory layer can be


      practical, accurate, and efficient at once when complete records remain the


      system of record, the graph is only a bounded index, and consolidation changes


      how evidence is connected rather than what evidence exists.'
    location: https://arxiv.org/html/2611.12068v1#S5
  - id: S49
    title: Limitations.
    text: 'Our ablations add components in groups. They do not isolate n-ary frames,


      cited source rows, occurrence identities, answer-time verification, or the


      judge, distiller, and curator of procedural memory, so the explanations in Section
      3


      remain interpretations. The user-memory results come from single runs, partly


      scored by an LLM judge, the agent results average three runs with large


      spreads, and some baselines are values reported by their authors.'
    location: https://arxiv.org/html/2611.12068v1#S5.SS0.SSS0.Px1
  - id: S50
    title: Ethics and Broader Impact Statement
    text: 'MIRIX-2.0 lets assistants and task agents carry what users told them, and
      what the


      agents learned, from one session to the next. Every graph fact cites the records
      it was


      extracted from, so an answer can be traced to stored evidence.


      It is intended for assistants that users knowingly choose to use and should


      not be used to build profiles of people without their consent. A user-centric


      memory accumulates personal and possibly sensitive information. MIRIX-2.0 keeps


      sensitive verbatim values in a Knowledge Vault that the hypergraph does not


      index, but this does not replace consent and access control. A deployment


      should let users view, correct, and delete their memories, confine each memory


      to its user (Rezazadeh et al., 2025), and use model providers or local


      models that meet its privacy requirements, because stored content is sent to


      the model. Memory can also make mistakes


      persistent (Zhang et al., 2026a; Shang et al., 2026), and content


      injected into a conversation can be stored and later retrieved as if it were


      trusted. A wrong merge


      changes only the index, and a procedural edit keeps a citation only after its


      quote is checked, but in high-stakes settings learned skills and merged


      identities should still be reviewed by a person and stored memories audited


      periodically (Ma et al., 2026b). All experiments use publicly released


      benchmarks under their licenses. We collected no new data and ran no study with
      human participants.


      MemoryCD is built from public Amazon product reviews, and we use it as


      released without attempting to identify the reviewers.'
