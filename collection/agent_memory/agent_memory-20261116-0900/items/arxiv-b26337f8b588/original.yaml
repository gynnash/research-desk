    text: 'Table 12 gives the measurements behind Figure 8. Ingest is the


      total wall-clock time in seconds, and Ans./q is the mean time to retrieve and
      answer


      one question. Answer tokens sum input and output over all questions, where K
      and M


      denote thousands and millions. Graph size counts Neo4j nodes and edges and excludes


      the evidence store. M0 builds no graph, and for HyperMem the column names its
      index type instead of a size. None of these measurements includes


