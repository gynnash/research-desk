  \n\nA88: Cited by: §4.\n[S52] Appendix A Method details (https://arxiv.org/html/2611.12068v1#A1)\n\
  A89: This appendix collects the details of Section 2 that the main text summarizes\
  \ or leaves out, in the order of its\n\nsubsections. For each part it states the\n\
  \nconstants, schedules, scoring rules, and examples, explains why they are\n\ndesigned\
  \ as they are, and names the step of Algorithm 1 they belong to.\n[S53] A.1 Memory\
  \ types, routing, and writing (https://arxiv.org/html/2611.12068v1#A1.SS1)\nA90:\
  \ The Meta Memory Manager is the first call of the write path\n\n(Algorithm 1, line\
  \ 2). The router reads the input and\n\nselects the memory types it updates. Each\
  \ selected writer then reads the\n\ncurrent store P_{u}^{t-1} and produces a record\
  \ that line 3\n\ncommits to the evidence plane before any graph work begins. Formally,\
  \ each\n\ninput x_{t} is mapped to a subset of six specialized writers,\n\n\\displaystyle\\\
  mathcal{K}_{t}\n\n\\displaystyle=R_{\\theta}(x_{t}),\n\n(A.1)\n\n\\displaystyle\
  \ m_{t}^{(k)}\n\n\\displaystyle=W_{k}(x_{t},P_{u}^{t-1}),\\quad k\\in\\mathcal{K}_{t},\n\
  \nand each writer owns the schema and update operations of one memory type. Both\n\
  \nsteps of (A.1) are language-model calls, which is why the router\n\nand the writers\
  \ carry the \\star mark in Algorithm 1.\n\nTable 5 lists the six types.\n\nTable\
  \ 5: The six memory types of MIRIX-2.0 and their roles.\n\nMemory\n\nPrimary role\n\
  \nHypergraph indexed\n\nCore\n\npersistent user and agent state\n\nno\n\nEpisodic\n\
  \ntime-grounded occurrences\n\nyes\n\nSemantic\n\ndurable facts and concepts\n\n\
  yes\n\nProcedural\n\nexecutable workflows\n\nno\n\nResource\n\ndocuments and multimodal\
  \ artifacts\n\nno\n\nKnowledge Vault\n\nsensitive verbatim values\n\nno\n\nThe separation\
  \ is functional. Only episodic and semantic memory are indexed by\n\nthe hypergraph,\
  \ because they hold the event and relational evidence that\n\ncross-memory traversal\
  \ needs. The other types keep their direct, type-specific\n\n\nA91: retrieval paths.\
  \ Core memory holds the persistent state of the user and the\n\nagent, procedural\
  \ memory holds the skills that Section 2.5 refines,\n\nresource memory holds documents\
  \ and multimodal artifacts, and the knowledge\n\nvault holds sensitive verbatim\
  \ values. Each of them is read through its own typed path rather than through the\
  \ graph.\n\nIn Algorithm 1, the test k\\in\\{\\mathrm{episodic},\\mathrm{semantic}\\\
  } is the only step of the write\n\npath that depends on whether a record is graph-indexed.\
  \ In Figure 2, both user turns are\n\nrouted to the episodic and semantic writers.\n\
  [S54] Source-faithful writing. (https://arxiv.org/html/2611.12068v1#A1.SS1.SSS0.Px1)\n\
  A92: Before a record reaches the graph extractor, the writer prompts of our runs\
  \ ask\n\nthe episodic and semantic writers to keep complete lists, names, counts,\
  \ titles,\n\nlocations, and dates in the record’s details instead of replacing them\
  \ with a\n\ntopical gist. Episodic writers store the time an event happened rather\
  \ than the\n\ntime it was mentioned, and they store a planned event with its planned\
  \ date.\n[S55] Write ordering. (https://arxiv.org/html/2611.12068v1#A1.SS1.SSS0.Px2)\n\
  A93: The write to the vector database commits before graph construction begins\n\
  \n(line 3). Graph extraction\n\nis a fail-soft indexing hook, so a graph failure\
  \ is logged but never rolls back\n\na stored memory. The evidence plane is thus\
  \ the durable system of record rather\n\nthan a side effect of graph construction.\n\
  [S56] A.2 Anchor admission, canonicalization, and frame extraction (https://arxiv.org/html/2611.12068v1#A1.SS2)\n\
  A94: This part details lines 5 to 9 of\n\nAlgorithm 1, which turn a committed episodic\
  \ or semantic record into the\n\nanchors and frames of Section 2.3.\n[S57] Anchor\
  \ keys and admission. (https://arxiv.org/html/2611.12068v1#A1.SS2.SSS0.Px1)\nA95:\
  \ The key \\kappa(n) of an anchor name normalizes case, punctuation, articles\n\n\
  and other function words, word order, and conservative singular and plural\n\nvariants\
  \ while keeping numbers. In the code it lowercases the name, replaces\n\npunctuation\
  \ with spaces, drops a fixed list of eleven articles and function\n\nwords, singularizes\
  \ tokens of at least four letters, and sorts the remaining\n\ntokens, so that Mobile\
  \ App and Mobile Apps share one key. The key\n\nis deliberately conservative. Numbers\
  \ and dates are preserved, so 10 Gallons and 20 Gallons\n\nstay distinct, and only\
  \ plural endings are normalized, so Training and\n\nTrains stay apart. A\n\nsingle\
  \ admission gate rejects generic filing terms, such as advice,\n\ndetails, information,\
  \ plan, and tips, and\n\ndialogue-role pseudo-entities such as user and assistant,\
  \ and it\n\nkeeps at most 16 anchors for an episodic record and 18 for a semantic\
  \ one. The\n\ncaps bound the anchor space of a user, and they are sized for the\
  \ arguments of\n\nan assertion rather than for a bag of keywords, so that one frame\
  \ with seven\n\narguments does not exhaust them. The gate is the Admit call of\n\
