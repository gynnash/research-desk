  \ Graph-owned evidence retrieval (https://arxiv.org/html/2611.12068v1#S2.SS4)\n\
  A26: MIRIX-2.0 treats retrieval as the construction of a bounded evidence set rather\n\
  \nthan as open-ended similarity search. Episodic and semantic candidates must\n\n\
