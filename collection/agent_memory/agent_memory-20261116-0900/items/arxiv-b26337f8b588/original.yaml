  \ path (https://arxiv.org/html/2611.12068v1#S2.SS5)\nA33: AutoDream runs outside\
  \ the critical write path\n\n(Algorithm 1, lines 22–29). It treats\n\nthe two kinds\
  \ of memory it consolidates in opposite ways. On semantic memory it\n\nis an explicit\
  \ service call that never schedules itself, and it refines\n\nidentities under the\
  \ contract\n\n\\operatorname{Dream}(P_{u},G_{u};\\Delta_{u})=(P_{u},\\widetilde{G}_{u}),\n\
