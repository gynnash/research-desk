  - id: S3
    title: Abstract
    text: 'Long-term memory lets LLM agents personalize, stay consistent, and reuse
      what


      worked before. Parametric memories need training, consolidation can lose details


      for good, and keeping every record leaves a growing store to search. We present


      MIRIX-2.0, a multi-agent memory system designed to be practical, accurate, and


      efficient at once. It is the most accurate of the compared systems on four of
      five QA benchmarks.


      It reaches 91.4% on LoCoMo and 72.6% on LongMemEval-S, where it leads the


      strongest baseline by 14.3 points, and with AutoDream disabled it gains 31.0


      and 22.0 points over HyperMem on single-hop and multi-hop document QA. As procedural
      memory, it yields the


      highest mean success among the compared memory methods on ALFWorld and WebShop


      and reaches 49.2% on MetaClaw-Bench, against 44.0% for MetaClaw’s skill


      library. Six typed memory agents keep complete records as the system of record,


      and a provenance hypergraph indexes episodic and semantic records with n-ary


      frames that cite their rows. Retrieval runs under explicit budgets, so the


      evidence a question inspects does not grow with the history. AutoDream merges


      duplicate anchors outside the write path without rewriting any record, and it


      distills task sessions into skills. With AutoDream disabled, MIRIX-2.0 answers


      faster than HyperMem on all five timed benchmarks. It needs no fine-tuning,
      runs


      with closed and open models, and its code is public.


      ††Website: https://mirix.io/††GitHub: https://github.com/Mirix-AI/MIRIX


      Figure 1: Overview of MIRIX-2.0. Typed writers fill the evidence plane P_{u}
      , the provenance


      hypergraph G_{u} indexes it with n-ary frames that cite their sources, retrieval
      traverses


      G_{u} under explicit budgets, and AutoDream consolidates outside the write path.'
    location: https://arxiv.org/html/2611.12068v1#abstract1
  - id: S4
    title: 1 Introduction
    text: 'Large language model (LLM) agents now work over horizons far longer than
      a


      single context window (Luo et al., 2025b; Huang et al., 2026b). A personal


      agent accumulates months of conversation with its user, and a task agent meets


      similar problems across many episodes. Memory lets such agents carry


      information across sessions (Wang et al., 2025a), so that they can personalize
      their


      responses (Zhang et al., 2026e), stay consistent with what they were


      told (Packer et al., 2023; Chhikara et al., 2025), and reuse what worked


      before (Wang et al., 2025e; Xia et al., 2026a). Benchmarks now measure this


      ability on long conversations (Maharana et al., 2024; Wu et al., 2025), long


      documents (Hu et al., 2026), multi-session agentic


      tasks (He et al., 2026), and lifelong


      personalization (Zhang et al., 2026d).


      Benchmarks score a memory by its answers, but a team that deploys one asks more


      of it. A memory that agents can rely on in practice has to meet three


      requirements at once. It has to be accurate about the particulars of past


      experience, such as a name, a date, a count, or the distinction between two


      events, and about the connections between them. It has to be practical, which


      means deployable with the models a team already uses, nothing to train, answers


      that can be traced to stored records, and consolidation that cannot destroy
      what


      was stored. It also has to be efficient, with answer latency and token cost
      per


      question that stay bounded as the history grows.


      Each family of existing systems gives up at least one of the three. Systems


      that consolidate records into extracted facts or


      abstractions (Chhikara et al., 2025; Ye et al., 2026) are compact but give up
      accuracy:


      the details they discard are gone for good, and consolidation can make a


      memory faulty even when it is distilled from useful


      experience (Zhang et al., 2026a). Systems that keep every record and


      retrieve from them directly lose nothing but give up efficiency, since


      retrieval must search an ever larger and noisier


      history (Huang et al., 2026b). Graph memories organize the same content


      around entities and their relations (Rasmussen et al., 2025; Edge et al., 2024),
      but binary


      triples split an n-ary fact into fragments and lose the connections among its


      participants (Luo et al., 2025a). Hypergraph


      memories (Yue et al., 2026) group episodes under topics and facts under


      episodes, but their hyperedges record which unit belongs where rather than


      the participants of a fact, and retrieval descends from topic summaries


      written at storage time, so a detail is reachable only after its topic has


      been retrieved. File-system memories, such as the auto memory of Claude


      Code (Anthropic, 2026), route retrieval through summaries in the same way: they
      keep notes in plain


      files behind a size-capped index that is loaded into every session, and the


      agent opens a file on the strength of its one-line summary. A detail that no


      summary mentions is reachable only by string search, which neither resolves


      an entity across files nor follows its relations, and index entries past the


      cap are not loaded at the start of a session. Both families prune top down to


      bound their cost, and both pay for the pruning with recall on details their


      summaries do not reflect. Parametric memories store experience in model


      weights or latent states (Wang et al., 2024b; Wang et al., 2025b; Wang et al.,
      2025c; Behrouz et al., 2025)


      and give up practicality, since they require training and rule out closed


      models.


      The requirements also weigh differently for the two uses of memory. Recent


      studies separate user-centric memory, which personalizes an agent to its user,


      from agent-centric memory, which accumulates the agent’s own experience, and


      they find that the two face reversed


      challenges (Huang et al., 2026b; Huang et al., 2026c). A user-centric memory
      has


      to record a user’s history broadly and connect its pieces, because a later


      question may depend on any detail of that history (Zhang et al., 2026d; Ma et
      al., 2026b).


      An agent-centric memory has to be precise and refined instead. It distills


      trajectories into strategies and


      skills (Zhao et al., 2024; Ouyang et al., 2026; Xia et al., 2026b), and


      retrieving too much can pull the agent’s attention away from the context that


      matters for its next action (Huang et al., 2026c). A practical system has to


      serve both uses from one store.


      Figures 2 and 3 trace one example of each


      setting through MIRIX-2.0.


      Figure 2: User-centric memory. Sessions are stored as episodic and semantic
      records, and a


      later question retrieves graph facts with their source rows to give a personalized
      answer.


      In this work, we present MIRIX-2.0, a multi-agent memory system designed to
      be


      practical, accurate, and efficient at once. It keeps the multi-agent design
      of


      MIRIX (Wang and Chen, 2025) and rethinks how memory is stored, indexed, retrieved,
      and


      consolidated so that a specific layer meets each requirement


      (Figure 1). Six memory agents under a Meta Memory Manager write


      complete records to a typed evidence plane in a vector database, the system


      of record, so details survive consolidation and every graph fact the answer


      receives cites the rows it came from. The graph is only an index. The database
      write commits first, a failed graph write never rolls back a stored memory,
      and


      a failed graph read falls back to direct evidence retrieval. A


      provenance hypergraph indexes the entities, events, relations, roles, and


      times in episodic and semantic records as n-ary frames that cite the rows they


      were extracted from and carry dates, prices, and counts as literals, and undated


      events with similar wording keep distinct identities. At query time, a


      deterministic planner sets explicit budgets, retrieval enters the hypergraph
      at the anchors that match the question, and the answer receives graph facts
      together


      with the records they cite (Section 2.4). The evidence a question inspects is
      therefore bounded by construction


      and does not grow with the length of the history.


      Like sleep-time and offline consolidation


      methods (Lin et al., 2025; Ye et al., 2026), AutoDream consolidates


      memory outside the write path, and it treats the two kinds of memory in


      opposite ways. For semantic memory, it consolidates identities and never


      rewrites evidence. It pairs each anchor introduced by new semantic rows with
      its


      nearest anchors of the same identity-stable type, such as a person or a place,


      and asks a language model whether a pair denotes one entity. A confirmed merge


      unites the citations of the two anchors and rewires the frames that mention


      them, while event anchors, fact frames, and stored records stay unchanged, so
      a


      merge can never destroy a stored memory. Its cost depends on the newly written


      semantic frontier rather than on the total size of memory, verification runs


      under explicit pair caps, and negative decisions are cached so that later cycles


      do not pay for the same pair again. For procedural memory, AutoDream refines


      instead. It judges each finished task session from quotes in its transcript,


      distills lessons worth reusing and mistakes worth avoiding, and lets a


      curator (Zhang et al., 2026c) create or edit skills whose edits can cite the


      experiences behind them.


      We evaluate MIRIX-2.0 on conversational memory, long-document question answering,


      personalized generation, and procedural memory for interactive agents. MIRIX-2.0
      has the highest accuracy of all compared memory systems on both conversational


      benchmarks, 91.4% on LoCoMo in our runs and 72.6% on LongMemEval-S, 14.3 points


      above the strongest baseline. On LoCoMo, the hypergraph raises accuracy over
      flat


      memory from 85.7% to 88.4%, with the largest gain on multi-hop questions, and


      AutoDream raises every question type and lifts the overall score to 91.4%. On


      LongMemEval-S, the hypergraph alone adds 11.2 points. On the single-hop and
      multi-hop document QA tasks of


      MemoryAgentBench (Hu et al., 2026), with AutoDream disabled, it answers


      83.0% and 71.0% of the questions, 31.0 and 22.0 points above the strongest


      baseline, and on MemoryCD (Zhang et al., 2026d) it has the highest value on
      all four


      metrics for cross-domain review summarization. Used as procedural memory, MIRIX-2.0
      gives the highest mean success among the compared memory methods on


      ALFWorld (Shridhar et al., 2021), at 76.4% with GPT-6 Luna against 73.6%


      for Agent Workflow Memory (AWM) (Wang et al., 2025e) and 69.4% without memory,
      and on WebShop (Yao et al., 2022), at


      37.4%. With GPT-5.2 it reaches 49.2% accuracy on


      MetaClaw-Bench (Xia et al., 2026b), against 44.0% reported for the MetaClaw


      skill library.


      What makes these results usable is the cost at which they come. With AutoDream


      disabled, MIRIX-2.0 answers faster than HyperMem, the strongest baseline, on
      all five


      benchmarks we timed, ingests the two conversational benchmarks in less time,
      and


      uses fewer answer tokens on four of the five. As procedural memory, on WebShop
      it


      uses the fewest training and test tokens among the memory methods while reaching


      the highest success. The cost is paid when long documents are ingested. Building
      the graph makes


      their ingestion about four times slower than flat memory and slower than that


      baseline. The full system with AutoDream is not timed, and the retrieval bounds


      cover the evidence a question inspects, not latency measured as the history


      grows. No model is fine-tuned, the same system runs with closed and open


      models, and the code is public.


      Our contributions are as follows.


      •


      Accurate and practical. A layered memory design in which six


      typed memory agents keep complete records as the system of record and a


      provenance-preserving n-ary hypergraph serves only as their index, with


      occurrence identities that keep distinct events apart and fail-soft


      indexing that never rolls back a stored memory.


      •


      One memory for users and agents. To the best of our


      knowledge, MIRIX-2.0 is the first memory system that handles both user-centric


      and agent-centric memory, serving personalization and the refinement of


      agent skills from one store.


      •


      Efficient and safe to consolidate. Graph-owned retrieval runs


      under explicit budgets and returns graph facts together with the records


      that justify them. AutoDream merges duplicate entity anchors under explicit


      caps without touching stored memories, which adds 3.0 points on LoCoMo, and


      distills task sessions into skills for procedural memory.


      The rest of the paper is organized as follows. Section 2 presents


      MIRIX-2.0. It states the problem and the three technical requirements, introduces


      the typed evidence plane and the provenance hypergraph that indexes it,


      describes graph-owned retrieval under explicit budgets, and explains how


      AutoDream consolidates semantic and procedural memory outside the write path.


      Section 3 evaluates the accuracy of MIRIX-2.0 on conversational recall,


      long-document question answering, and personalized generation, its use as


      agent memory on ALFWorld, WebShop, and MetaClaw-Bench, and its cost in


      ingestion time, answer latency, and tokens. Section 4 relates MIRIX-2.0 to


      prior work on memory systems for LLM agents, multi-agent systems, and memory


      consolidation, and Section 5 concludes and discusses the


      limitations of this study. Appendix A gives the details of the method,


      and Appendix B gives the full results behind the figures.


      Figure 3: Agent-centric memory. AutoDream turns a failed purchase into experiences
      and a


      revised routine, which a later task follows to meet every constraint.'
    location: https://arxiv.org/html/2611.12068v1#S1
  - id: S5
    title: 2 Methodology
    text: 'MIRIX-2.0 is designed to be practical, accurate, and efficient. It has
      to run


      with the models a team already uses and leave stored records intact, it has
      to


      keep a name, a date, a count, or the distinction between two events recoverable


      after writing and after consolidation, and it has to answer from a bounded


      evidence set however long the history grows. This section describes the


      layered design that delivers the three.


      MIRIX-2.0 separates storage from indexing (Figure 1). A typed evidence plane
      stores complete


      memories and is the system of record (Section 2.2). A


      provenance hypergraph indexes the entities, events, relations, roles, and


      times in those memories, and every fact in it cites the records it came from


      (Section 2.3). Three paths operate on the two layers, and


      Algorithm 1 states each of them in pseudocode. The write path stores a


      memory and then indexes it. The read path plans a query, traverses the


      graph, and dereferences only the records it selects (Section 2.4).


      AutoDream, the third path, runs outside the other two (Section 2.5). On semantic
      memory it


      merges duplicate anchors in the hypergraph and returns the evidence store


      unchanged, so semantic consolidation changes how evidence is connected, never


      what evidence exists. On procedural


      memory, AutoDream instead distills task sessions into skills that cite the


      experiences behind them. Section A.6 collects the properties that hold regardless
      of


      how the language models behave.'
    location: https://arxiv.org/html/2611.12068v1#S2
  - id: S6
    title: 2.1 Problem setup
    text: 'For a user u , the system observes a stream


      \mathcal{X}_{u}=(x_{1},\ldots,x_{T}) of conversational or multimodal inputs.
      When it


      writes x_{t} , future queries are unknown, so the writer must produce a


      persistent state


      \mathcal{S}_{u}^{t}=(P_{u}^{t},G_{u}^{t})


      (1)


      from which a later query q can be answered with a bounded evidence set


      \mathcal{R}(q;\mathcal{S}_{u}^{t}) . The evidence store P_{u} collects the typed


      stores, among them the episodic store P_{u}^{E} , the semantic store P_{u}^{S}
      ,


      and the procedural store P_{u}^{P} . We seek high answer utility under three


      technical requirements.


      1.


      Source fidelity. Concrete evidence remains recoverable after


      writing and after consolidation.


      2.


      Bounded access. A query inspects a small graph neighborhood


      and a bounded set of cited rows instead of scanning the full history.


      3.


      Temporal identity. Repeated descriptions of one event may


      share evidence, but distinct occurrences must not collapse merely because


      they are worded alike.


      Source fidelity and temporal identity are what make the system accurate and


      its answers traceable, and bounded access is what keeps it efficient. The rest


      of this section shows how the two layers meet these requirements.


      Each subsection explains a block of Algorithm 1, and the numbers on its right


      point to the equations that define each step.


      Algorithm 1 MIRIX-2.0 for one user u . Calls marked \star use a language model.


      1:


      procedure Write( x_{t} )


      2:


      for k\in R_{\theta}^{\star}(x_{t}) do


      3:


      m\leftarrow W_{k}^{\star}(x_{t},P_{u}) , \textsc{Commit}(P_{u},m) (2)


      4:


      if k\in\{\mathrm{episodic},\mathrm{semantic}\} then


      5:


      \Phi\leftarrow\textsc{Extract}^{\star}(m)\cup\textsc{Repair}^{\star}(m) (5)


      6:


      A_{m}\leftarrow\textsc{Admit}(\textsc{Canon}^{\star}(\Phi))


      7:


      I_{a}\leftarrow I_{a}\cup\{i_{m}\} for a\in A_{m}


      8:


      for f\in\Phi with |A_{f}|\geq 2 do


      9:


      \textsc{Upsert}(G_{u},\operatorname{id}(f),f) (6), (7)


      10:


      C_{f}\leftarrow C_{f}\cup\{i_{m}\}


      11:


      procedure Read( q )


      12:


      \Pi\leftarrow\textsc{Plan}(q) (9)


      13:


      A_{q}\leftarrow\textsc{Top}(\textsc{Recall}(q),\,s_{A},\,K_{A}) (10)


      14:


      F_{q}\leftarrow\textsc{Top}(\textsc{Adj}(A_{q},\mathcal{P}_{q}),\,s_{F},\,B_{q}^{R})
      (11)


      15:


      return F_{q} , \textsc{Fuse}(\textsc{Rows}(A_{q}),\,\bigcup_{f\in F_{q}}C_{f};\,B_{q}^{B},B_{q}^{R})


      16:


      procedure Answer( q )


      17:


      \hat{y}\leftarrow\textsc{Agent}^{\star}(q) with at most five Read calls


      18:


      if \textsc{Check}(\hat{y}) then


      19:


      \hat{y}\leftarrow\textsc{Rewrite}^{\star}(\hat{y},\textsc{Read}(q^{\prime}))


      20:


      return \hat{y}


      21:


      procedure SemanticDream( \Delta_{u} )(12)


      22:


      for (a,b)\in\mathcal{C}_{\Delta}\setminus\mathcal{N} do(13)


      23:


      if \textsc{Same}^{\star}(a,b) then


      24:


      \textsc{Merge}(a\to b)


      25:


      else


      26:


      \mathcal{N}\leftarrow\mathcal{N}\cup\{(a,b)\}


      27:


      procedure ProceduralDream( S_{u} )


      28:


      e_{1:m}\leftarrow\textsc{Distill}^{\star}(S_{u})


      29:


      P_{u}^{P}\leftarrow\textsc{Curate}^{\star}(P_{u}^{P},e_{1:m})'
    location: https://arxiv.org/html/2611.12068v1#S2.SS1
  - id: S7
    title: Multi-agent routing.
    text: 'A Meta Memory Manager routes each input x_{t} to the subset


      \mathcal{K}_{t}=R_{\theta}(x_{t}) of memory types it updates (Algorithm 1,


      line 2). Each of the six types, Core, Episodic, Semantic,


      Procedural, Resource, and Knowledge Vault, has its own writer, and the writer


      of a selected type k produces the record m_{t}^{(k)}=W_{k}(x_{t},P_{u}^{t-1})


      and owns the schema and update operations of that type. Only episodic and


      semantic records are indexed by the hypergraph. Section A.1 gives


      the roles of the six types and the reason for this split.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS2.SSS0.Px1
  - id: S8
    title: Evidence records.
    text: 'Each of the six memory types keeps its records in its own schema. The hypergraph


      indexes the episodic and semantic records, and each of them is represented as


      m=(i,k,y,\tau_{e},\tau_{m},\rho,\mathbf{z}),


      (2)


      where i is an immutable row identifier,


      k\in\{\mathrm{episodic},\mathrm{semantic}\} is its memory type, y is the


      stored text, \tau_{e} is the event time when one applies, \tau_{m} is the


      mention or write time, \rho records source and chunk provenance, and


      \mathbf{z} holds the search embeddings. Full summaries and details remain in


      the vector database. The graph stores only identifiers and compact structural
      metadata.


      Writers keep concrete details such as names, counts, and dates in each record,


      and a record is committed to the vector database before graph construction


      begins (line 3), so a failed graph write never rolls back a


      stored memory (Section A.1).'
    location: https://arxiv.org/html/2611.12068v1#S2.SS2.SSS0.Px2
  - id: S9
    title: 2.3 A provenance-preserving n-ary hypergraph
    text: 'The second half of the write path turns each episodic or semantic record
      into


      graph structure (Algorithm 1, lines 5–9).


      For each user, MIRIX-2.0 maintains a hypergraph


      G_{u}=(\mathcal{A}_{u},\mathcal{F}_{u},\mathcal{E}_{u})


      (3)


      with entity or concept anchors \mathcal{A}_{u} , reified fact frames


      \mathcal{F}_{u} , and role-typed incidence edges \mathcal{E}_{u} .


      Section A.7 shows the hypergraph MIRIX-2.0 builds for one LoCoMo conversation.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS3
  - id: S10
    title: Anchors.
    text: 'An anchor


      a=(i_{a},n_{a},t_{a},\mathbf{e}_{a},I_{a}^{E},I_{a}^{S})


      (4)


      stores a canonical name n_{a} , an entity type t_{a} , a name embedding


      \mathbf{e}_{a} , and the identifiers I_{a}^{E} and I_{a}^{S} of the episodic
      and


      semantic rows that mention it. A deterministic key \kappa(n) normalizes


      case, punctuation, function words, word order, and singular and plural variants


      of a name while keeping numbers, and a deterministic admission gate rejects


      generic filing terms and dialogue-role pseudo-entities and caps the anchors


      admitted from one record (Section A.2).'
    location: https://arxiv.org/html/2611.12068v1#S2.SS3.SSS0.Px1
  - id: S11
    title: Registry-guided canonicalization.
    text: 'Surface normalization cannot decide whether two semantically close names
      denote


      the same entity. For every extracted entity, approximate nearest-neighbor search


      therefore retrieves a few existing anchors of the user above a similarity


      threshold, and one language-model call per record makes a conservative


      same-entity decision for all of its entities. A rename is accepted only when
      it


      selects a retrieved candidate, so embeddings propose comparisons but never


      authorize a merge on their own. The neighbor count and the threshold, with their
      relation to the vector-index score, are in Section A.2.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS3.SSS0.Px2
  - id: S12
    title: N-ary frames.
    text: 'For each episodic or semantic record, an extractor produces a set of frames


      f=\left(p,\,\{(r_{j},a_{j})\}_{j=1}^{d_{f}},\,\ell_{f},\,\tau_{e},\tau_{m},\,C_{f}\right),


      (5)


      where p is a canonical predicate, r_{j} is the open-vocabulary role of


      anchor a_{j} , \ell_{f} maps literal attributes to their values, and C_{f}


      is the set of identifiers of the vector-database records the frame cites. A
      flight, for example,


      becomes one frame with agent, origin, destination, carrier, and companion arms


      instead of several disconnected triples, and owns(Mia, Suica card) in


      Figure 2 is a frame that cites the May 2 record. The extractor is instructed
      to keep dates, prices, counts, durations, and


      measurements as literals on the frame rather than as anchors, so that a value


      stays attached to the assertion it qualifies. A frame is materialized only if


      its arguments resolve to at least two distinct anchors of the user. When a deterministic
      audit finds that


      the extraction misses high-signal source details, one bounded repair call may


      add frames that the source supports, and it cannot remove anything the primary


      extraction produced. Section A.2 describes the audit.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS3.SSS0.Px3
  - id: S13
    title: Occurrence identity.
    text: 'Semantic claims and episodic occurrences follow different identity rules.
      Let


      \sigma(f) be the sorted set of role and anchor keys


      \{r_{j}:\kappa(n_{a_{j}})\} . A semantic frame is identified by


      \operatorname{id}_{S}(f)=H(u,p,\sigma(f)),


      (6)


      so repeated support for the same durable claim accumulates citations on one


      node. An episodic frame adds an occurrence key,


      \displaystyle\operatorname{id}_{E}(f)


      \displaystyle=H(u,p,\sigma(f),\chi(f)),


      (7)


      \displaystyle\chi(f)


      \displaystyle=\begin{cases}\text{explicit event time},&\text{if extracted},\\


      \text{immutable memory id},&\text{otherwise}.\end{cases}


      (8)


      Two mentions of the same dated event therefore share one frame, while two undated


      events with similar wording, such as two runs on different days, stay separate.
      A


      frame keeps the time of the event apart from the time it was mentioned, and
      whether


      the event is planned or done does not change its identity.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS3.SSS0.Px4
  - id: S14
    title: 2.4 Graph-owned evidence retrieval
    text: 'MIRIX-2.0 treats retrieval as the construction of a bounded evidence set
      rather


      than as open-ended similarity search. Episodic and semantic candidates must


      enter through the graph, and the vector database dereferences and reranks only
      the


      identifiers that graph traversal selects. This boundary keeps a hidden


      full-table search from doing the work attributed to the graph. Only a graph


      read that raises an error falls back to direct evidence retrieval. A query passes


      through planning, anchor entry, expansion along two evidence lanes, and fusion,


      and a verifier then checks the answer


      (Algorithm 1, lines 12–19). For the question in


      Figure 2, the planner chooses the single operator, enters


      the graph at Mia and Tokyo transit, and returns three facts with five rows.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS4
  - id: S15
    title: Query plan.
    text: 'A deterministic planner maps a query to


      \Pi(q)=\left(o_{q},\mathcal{P}_{q},\mathcal{C}_{q},\mathcal{Y}_{q},\mathcal{T}_{q},B_{q}^{B},B_{q}^{R}\right),


      (9)


      where the operator o_{q} is single, temporal, intersection, list-union, or


      count, \mathcal{P}_{q} holds canonical relation families and their surface


      forms, \mathcal{C}_{q} holds non-relational constraints, \mathcal{Y}_{q} holds


      expected answer types, and \mathcal{T}_{q} holds date and temporal-order


      constraints. The two budgets cap the base-recall rows and the relation-cited


      rows, and B_{q}^{R} also caps the graph facts that the relation lane renders.


      The budgets grow with the operator, from 6 base rows and 4 cited rows for a


      single-value lookup to 8 and 12 for a count, since counting and set


      construction need broader evidence.


      Table 6 in Section A.3 lists all five


      operators.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS4.SSS0.Px1
  - id: S16
    title: Anchor entry.
    text: 'The query embedding first recalls fifteen anchors by name. A relation query
      adds


      the anchors that the question names exactly, and the union is scored by


      s_{A}(a,q)=s_{\mathrm{vec}}+s_{\mathrm{exact}}+s_{\mathrm{lex}}+s_{\mathrm{pred}}+s_{\mathrm{spec}}-s_{\mathrm{hub}}.


      (10)


      The vector score dominates. Exact mention, token overlap, predicate


      compatibility, and multi-token specificity break close ties, and a logarithmic


      degree penalty suppresses generic hubs. The top fifteen anchors are kept, which


      is the cap K_{A} of Algorithm 1. The cap on exactly named anchors and the hub
      and predicate rules are in Section A.3.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS4.SSS0.Px2
  - id: S17
    title: Two evidence lanes.
    text: 'The selected anchors open two bounded lanes. In the base-recall lane, anchors


      yield the episodic and semantic identifiers directly associated with them, and


      traversing an incident n-ary frame adds the frame’s cited memories and a bounded


      set of memories associated with its co-participants. In the relation-citation


      lane, which opens when the query plan contains a relation, the exactly named
      anchors seed an indexed adjacency lookup over their incident


      frames. Predicate filtering applies before a cap of 240 frames, the fact score


      below ranks the rest, and at most B_{q}^{R} of them are rendered as explicit


      graph facts that contribute their exact citations into the vector database.
      The provenance


      recomputation of the base lane and the object filter of the relation lane are


      in Section A.3.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS4.SSS0.Px3
  - id: S18
    title: Fact scoring.
    text: 'Each relation-lane frame receives the additive score


      \displaystyle s_{F}(f,q)={}


      \displaystyle s_{\mathrm{rel}}+s_{\mathrm{entity}}+s_{\mathrm{constraint}}+s_{\mathrm{type}}


      \displaystyle+s_{\mathrm{time}}+s_{\mathrm{intersection}}+s_{\mathrm{specificity}}


      \displaystyle+s_{\mathrm{role}}+s_{\mathrm{state}}.


      (11)


      The first seven terms score relation, named-entity, literal, answer-type, and


      temporal compatibility, a shared object for intersection questions, and the


      number of arguments a frame binds. The role term s_{\mathrm{role}} rewards agreement


      between the argument direction implied by the question and the frame’s typed


      roles, and it penalizes incompatible roles. The state term s_{\mathrm{state}}


      rewards an event time that matches a requested date and penalizes planned


      occurrences in count, list-union, and temporal questions.


      Section A.3 describes its fallback and the treatment of intersection questions.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS4.SSS0.Px4
  - id: S19
    title: Citation-balanced fusion.
    text: 'Rows in each lane are reranked, and fusion takes up to B_{q}^{R} cited
      rows,


      then up to B_{q}^{B} base rows, and fills the remaining capacity from the rest


      of either lane without duplicating row identifiers. The returned evidence


      therefore contains both the graph facts and the source rows that justify them.


      The reranking prior, the per-type split, and the rule for near-duplicate paraphrases
      are also in Section A.3.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS4.SSS0.Px5
  - id: S20
    title: Answer-time verification.
    text: 'In our harness, the answering agent may call the retriever up to five times.


      After it drafts an answer, a rule-based check requests one more search and one


      rewrite by the answering model when the draft shows explicit uncertainty, lacks
      a value the question asks for,


      or disagrees with the evidence ledger, for example a count without a number
      or a


      month that neither the evidence nor the question contains. It also fires on


      every intersection question (line 19). The check runs in the answering agent
      rather than in


      the memory server, and it never inspects a reference answer.


      Section A.4 lists every trigger and the query of the extra


      search.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS4.SSS0.Px6
  - id: S21
    title: '2.5 AutoDream: consolidation outside the write path'
    text: 'AutoDream runs outside the critical write path


      (Algorithm 1, lines 22–29). It treats


      the two kinds of memory it consolidates in opposite ways. On semantic memory
      it


      is an explicit service call that never schedules itself, and it refines


      identities under the contract


      \operatorname{Dream}(P_{u},G_{u};\Delta_{u})=(P_{u},\widetilde{G}_{u}),


      (12)


      where \Delta_{u} is the newly written semantic frontier and \widetilde{G}_{u}


      is the consolidated hypergraph. The evidence store P_{u} is returned


      unchanged. On procedural memory it starts in the background once five task


      sessions are pending, and it turns them into skills.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS5
  - id: S22
    title: Semantic frontier.
    text: 'Each call receives the exact source-chunk identifiers of the batch just


      written, which resolve to the newly written semantic rows. These rows define
      a


      small frontier \Delta_{u} , so the cost of consolidation depends on new


      activity rather than on the total size of memory. The invocation schedule of
      our protocol is in Section A.5.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px1
  - id: S23
    title: Candidate generation.
    text: 'Only anchors that are backed by semantic rows and belong to an identity-stable


      type t\in\mathcal{T}_{\mathrm{safe}}=\{\text{person, organization, location,


      object, concept}\} are eligible. For each eligible anchor a\in\mathcal{A}_{\Delta}
      backed by a frontier row, AutoDream takes the four nearest entries of the name
      index, which include a itself,


      and forms the candidate pairs


      \mathcal{C}_{\Delta}=\left\{(a,b):\begin{array}[]{l}a\in\mathcal{A}_{\Delta},\;b\in\operatorname{NN}_{4}(a)\setminus\{a\},\\


      \cos(\mathbf{e}_{a},\mathbf{e}_{b})\geq 0.86,\\


      t_{a}=t_{b}\in\mathcal{T}_{\mathrm{safe}}\end{array}\right\}.


      (13)


      Episodic-only anchors are excluded by construction. An LLM decides whether each


      pair denotes the same entity and, if it does, chooses one of the two existing


      names as the canonical representative. Its output is constrained to the


      submitted pair, and invented representatives are rejected. In


      Figure 3, steel bottle and stainless steel


      bottle form such a pair.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px2
  - id: S24
    title: Bounded schedule.
    text: 'Every Dream round verifies at most a fixed number of unseen pairs, and
      the


      final round also considers the eligible anchors that no earlier round used as
      a


      source. Explicit negative decisions are cached as the set \mathcal{N} of


      Algorithm 1, so later cycles do not pay again to reconsider the same pair.


      Section A.5 states the caps of the intermediate, final, and


      repair rounds and the cache key.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px3
  - id: S25
    title: Lossless structural merge.
    text: 'For a confirmed merge a\rightarrow b , the system unions the episodic and


      semantic row identifiers, keeps aliases, sums mention counts, keeps the maximum


      admission score, and rewires every role-typed frame arm to b . Union, sum, and
      maximum are commutative and


      associative, so the order of repeated merges does not change the reachable


      evidence. The dropped anchor is removed only after its values and edges have


      been transferred.


      Semantic Dream never rewrites the memories in the vector database, and it consolidates
      neither


      episodic-only anchors nor fact nodes. The asymmetry is deliberate. Semantic


      identity can be refined incrementally, whereas event occurrences and their


      citations are kept as observations. AutoDream therefore makes the graph less


      fragmented without creating a textual summary whose embedding could hide the


      details of its inputs.'
    location: https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px4
  - id: S26
    title: Procedural refinement.
    text: 'For procedural memory, AutoDream refines instead of merging. A distiller
      judges


      the outcome of each pending session from quotes in its transcript and distills


      experiences e_{1},\ldots,e_{m} , each marked as a lesson worth reusing or a


      mistake worth avoiding. A curator (Zhang et al., 2026c) turns these experiences


      into skills in the procedural store P_{u}^{P} , and it can create, edit, or


      delete a skill. An edit can cite the experiences behind it with a quote of the


      text it adds, and a citation is recorded only when that quote checks out, so
      a


      cited step of a skill can be traced through its experiences to the quoted


      sessions they came from. In Figure 3, one failed purchase


      yields an experience to avoid and one to reuse, and the curator adds two steps


      to the shopping routine that cite the first and keeps a step that the second


      supports. The distiller’s unclear verdict and the curator’s non-edit verdicts
      are in Section A.5.


      \FloatBarrier'
    location: https://arxiv.org/html/2611.12068v1#S2.SS5.SSS0.Px5
  - id: S27
    title: 3 Experiments
    text: 'We evaluate MIRIX-2.0 for the three properties it is designed for. Accuracy
      is


      measured for user memory on conversational recall, document QA, and


      personalized generation (Section 3.2), which mainly exercise semantic


      memory together with the episodic records that ground it, and for agent memory


      on held-out interactive tasks and on


      MetaClaw-Bench, whose tasks span 30 days (Section 3.3), which exercise procedural
      memory. Efficiency is measured


      as ingestion time, answer latency, and answer tokens for user memory, with


      AutoDream disabled in every timed run, and as training and test tokens for


      agents (Section 3.4). Practicality is built into the protocol itself. One system
      serves both uses, no model is fine-tuned, the agent


      evaluation covers closed and open backbones, and every graph configuration runs


      under the budgets of Section 2.4.'
    location: https://arxiv.org/html/2611.12068v1#S3
  - id: S28
    title: Default system and ablations.
    text: 'Unless a configuration is explicitly identified otherwise, MIRIX-2.0 denotes
      the


      full architecture with the provenance hypergraph and AutoDream enabled.


      For the user-memory ablations, M0 uses flat vector memory without the


      graph or AutoDream, like MIRIX-1.0 (Wang and Chen, 2025), and the tables label
      it


      MIRIX-1.0. M1 adds graph indexing and retrieval but disables


      AutoDream, and M2 is the full graph plus AutoDream configuration.


      M1 and M2 are configurations of MIRIX-2.0, not successive releases of the


      method. In M2, semantic AutoDream is invoked by the ingestion driver after


      every five chunks and after the final chunk, outside the critical write path
      (Section 2.5 and Section A.5). It merges eligible entity anchors while preserving


      stored records and episodic occurrences.


      The conversational tables report all three configurations. The available


      document QA results and graph efficiency measurements use M1 and are labeled


      accordingly; disabling AutoDream there is an experimental choice, not a


      restriction that prevents consolidation of document memories. MemoryCD is


      reported under the system name, but its recorded results do not identify an


      M0, M1, or M2 configuration, so we do not use them to estimate the contribution


      of AutoDream. For agent memory, we evaluate the procedural refinement path,


      in which AutoDream distills sessions into reusable skills whose retrieval is


      independent of the semantic hypergraph. The M0, M1, and M2 comparisons below


      therefore concern user-memory indexing and semantic consolidation, rather


      than a procedural graph ablation.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS1.SSS0.Px1
  - id: S29
    title: User-memory tasks and baselines.
    text: 'LoCoMo (Maharana et al., 2024) and LongMemEval-S (Wu et al., 2025) test
      conversational


      recall. SHDocQA, MHDocQA, and DetectiveQA in the MemoryAgentBench


      evaluation (Hu et al., 2026) extend this analysis to factual and


      relational evidence in documents. They are evidence-retrieval tests rather


      than direct personalization tasks. MemoryCD (Zhang et al., 2026d) tests whether


      stored user information supports personalized review summarization and


      generation. We compare with mem0, A-Mem, MemoryBank, Graphiti, and HyperMem
      on


      QA, and with the methods listed in the MemoryCD tables, including


      long-context and RAG baselines, on personalization.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS1.SSS0.Px2
  - id: S30
    title: Models and scoring.
    text: 'For the user-memory evaluation, the answerer and extractor use


      gpt-4.1-mini with temperature 0 and seed 42, and the topic extractor


      uses gpt-4.1-nano. MIRIX-2.0 uses text-embedding-3-small; external


      baselines retain their default embeddings. SHDocQA and MHDocQA use substring


      matching, and DetectiveQA uses letter exact matching. LoCoMo and LongMemEval-S


      use a gpt-4o-mini judge with majority-of-3 voting. MemoryCD uses


      ROUGE-1, ROUGE-L, BLEU-4, and BERTScore-F1. Agent backbones and evaluation


      protocols are specified in Section 3.3. Differences in accuracy


      or success rate are reported in percentage points.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS1.SSS0.Px3
  - id: S31
    title: Efficiency and uncertainty.
    text: 'We report total ingestion wall-clock time, mean time to retrieve and answer
      a


      question, total answer tokens, and graph node and edge counts where available.


      Graph size measures index structure, not stored text length or total storage.


      For interactive agents, we report success, action steps, and training and test


      tokens, with mean and standard deviation over three runs. For LoCoMo, all


      comparisons below use the results in Table 1; M0, M1, and M2


      are distinct system configurations, not repeated runs used to estimate


      variance.'
    location: https://arxiv.org/html/2611.12068v1#S3.SS1.SSS0.Px4
  - id: S32
    title: '3.2 User memory: recall, documents, and personalization'
    text: 'Figure 4: Components of MIRIX-2.0 on LoCoMo, its four question types, and
      LongMemEval-S. The hypergraph (M1) and AutoDream (M2) each add accuracy over
      flat memory (M0).'
    location: https://arxiv.org/html/2611.12068v1#S3.SS2
  - id: S33
    title: The hypergraph and AutoDream each improve conversational recall.
    text: 'Figure 4 and Table 1, with Table 8 in the appendix, compare the M0,


      M1, and M2 configurations under the evaluation protocol described above and
      show a


      consistent ordering on both conversational benchmarks. On LoCoMo, graph retrieval
      raises overall accuracy


      from 85.7% for M0 to 88.4% for M1, and semantic AutoDream raises it to


      91.4% for M2. On LongMemEval-S, the corresponding values are 58.8%, 70.0%,


      and 72.6%. The graph increment is thus 2.7 points on LoCoMo and 11.2 points


      on LongMemEval-S, while AutoDream adds 3.0 and 2.6 points, respectively.


      The larger graph increment on LongMemEval-S suggests that evidence organization


      can matter more when flat retrieval has difficulty recovering the relevant


      history. It does not establish which question types account for that gain,


      since a LongMemEval-S category breakdown is not available here.


