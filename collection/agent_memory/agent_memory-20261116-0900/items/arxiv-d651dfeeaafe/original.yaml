      64


      8


      12.93


      0.45


      128


      16


      14.15


      0.84


      256


      32


      13.17


      2.17


      FlyHash’s code is not itself k bits wide — it is m bits wide


      (2,000 in our default configuration), of which exactly k are active.


      Our default dense representation stores and compares this full m -bit


      array regardless of k , which makes FlyHash’s packed size a


      near-constant \sim 250 bytes/record independent of k — larger than


      SimHash’s genuinely k -bit code at every budget tested except


      k\gtrsim 250 — and its brute-force query time a near-constant


      \sim 13 ms/query, 10–70 \times slower than SimHash at the same k .


      This is a real structural property of the dense representation, not a


      bug: mAP depends only on which k bits are active, so it is


      entirely unaffected, but memory and speed under this representation


      clearly are.'
