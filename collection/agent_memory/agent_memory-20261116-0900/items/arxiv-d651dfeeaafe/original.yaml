      All embeddings are L2-normalized prior to hashing where applicable


      (GloVe, MiniLM). MNIST and digits pixel intensities are scaled


      to [0,1] .


      Data availability. All four datasets are public and loaded


      programmatically, and none of them is redistributed in this paper’s code


      release: GloVe via gensim’s model downloader


      (https://nlp.stanford.edu/projects/glove/); MiniLM sentence


      embeddings via the sentence-transformers library, which


      downloads the pretrained checkpoint from


      https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2;


      scikit-learn’s bundled digits dataset via


      sklearn.datasets.load_digits(); and MNIST via OpenML


      (https://www.openml.org/d/554), fetched with


      sklearn.datasets.fetch_openml(). Exact loading code is in the


      repository linked on the title page. The labeled agent-memory benchmark of


      Section 4.7 (6,000 memories, 150 queries, relevance


      labels) is released as JSONL files in the same repository


      (datasets/agent_memory_v1/), together with an offline demo, tests,


      and a REPRODUCING.md guide mapping each table to a command. The


      release is archived on Zenodo (release v1.0; DOI


