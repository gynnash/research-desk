      extreme compactness well below exact storage (as little as 2–32


      bytes/record). The honest conclusion is that a practitioner with no


      unusual memory constraint and a dataset at this scale should use HNSW,


      not a hash code; FlyHash/SimHash’s relevance is specifically to the


      regime HNSW does not target — severe, explicit storage budgets (e.g.,


      many independent memory stores on resource-constrained agents) — and


      we revise our framing in Section 5 accordingly rather


      than letting Sections 4.1–4.4 imply a


      general retrieval recommendation.'
