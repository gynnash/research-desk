  - id: S12
    title: '4.3 Memory and query latency: quality gains do not imply resource gains'
    text: 'The results above measure retrieval quality only. We separately


      measure memory footprint and query latency on GloVe (5,000 records),


      comparing FlyHash and SimHash at matched k against an exact (unhashed)


      Euclidean nearest-neighbor baseline, using brute-force comparison for all


      three (no approximate index on either side).


      Table 5: Packed memory and mean query latency (50 queries, brute-force


      ranking against all 5,000 records). Exact float32 baseline: 400


      bytes/record, 0.78 ms/query.


      k (bits)


      SimHash bytes/record


      FlyHash (dense) ms/query


      SimHash ms/query


      16


      2


      14.05


      0.19


      32


