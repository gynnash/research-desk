  - id: S21
    title: Appendix A Reproducibility Investigation
    text: 'While reproducing the original paper’s reported result on GloVe word


      vectors, we initially found FlyHash losing to SimHash on every dataset we


      tried — synthetic clustered embeddings, TF-IDF text vectors, real


      sentence embeddings, and real GloVe vectors — directly contradicting


      the published finding on GloVe. We treated this discrepancy as a signal


      that our comparison, not the algorithm, was most likely at fault, and


      pursued it systematically rather than accepting or explaining away the


      contradiction.


      Hypotheses ruled out. We first tested whether L2-normalizing


      inputs before hashing affected the result; it did not, meaningfully. We


      then tested whether using the algorithm’s exact original weight


      definition (true binary \{0,1\} projection weights, rather than the


      signed \{-1,+1\} weights we had implemented) affected the result; it


      did not, and we quantify this claim across all five main bit budgets


      below rather than resting it on the single seed we checked at the time.


      We then tested whether our evaluation metric — recall@ k by overlap,


      rather than mAP@ R — was responsible; switching to mAP@ R produced


      the same qualitative picture. Each ruled-out hypothesis narrowed the


      search space without resolving the discrepancy.


      Quantifying the weight-mode claim. The “it did not,


      meaningfully” judgment above was originally made on a single seed.


      Re-run across all 10 seeds and all five main bit budgets (GloVe), with


      SimHash included as a reference:


      Table 11: Signed vs. binary FlyHash projection weights, GloVe, 10 seeds.


      k (bits)


      Signed \{-1,+1\} mAP


      Binary \{0,1\} mAP


      | diff |


      SimHash mAP (ref.)


      16


      0.196 \pm 0.007


      0.191 \pm 0.005


      0.0042


      0.047 \pm 0.006


      32


      0.314 \pm 0.009


      0.298 \pm 0.007


      0.0156


      0.096 \pm 0.009


      64


      0.449 \pm 0.008


      0.421 \pm 0.005


      0.0277


      0.185 \pm 0.008


      128


      0.585 \pm 0.006


      0.540 \pm 0.005


      0.0449


      0.316 \pm 0.006


      256


      0.705 \pm 0.006


      0.647 \pm 0.005


      0.0577


      0.469 \pm 0.007


      Both weight modes beat SimHash by a wide margin at every budget tested.


      The signed-vs-binary difference is not zero and grows with k (0.004 at


      k=16 to 0.058 at k=256 ), so the honest claim is not “no difference”


      but “small relative to the FlyHash-vs-SimHash effect at every budget we


      tested, with a modest upward trend at higher k ” — the main results


      in Section 4.1 use the signed variant throughout, and


      this table bounds how much of that result could plausibly be an


      artifact of that choice.


      The actual cause. We resolved the discrepancy by comparing our


      implementation’s parameterization directly against a third-party


      reference implementation of the original algorithm


      (github.com/dataplayer12/Fly-LSH). This revealed that our


      comparison held FlyHash’s total hash dimensionality equal to


      SimHash’s bit count while separately fixing FlyHash’s winner-take-all


      percentage — silently making FlyHash’s effective number


      of active bits, at any given nominal “bits” value, a small fraction of


      what SimHash was being given as its full, genuinely active bit count.


      This is precisely the k -versus- m conflation described in


      Section 3.2. Correcting the protocol to hold k (not m )


      equal between the two methods, with m fixed independently at a large


      value, immediately reproduced the original paper’s reported pattern:


      FlyHash winning decisively on GloVe at every bit budget, and — as it


      turned out — on every other dataset we subsequently tested as well


      (Section 4.1).


      A hypothesis retracted. Prior to finding this cause, we had


      observed that FlyHash appeared to outperform SimHash specifically on


      data with correlated, non-negative features (e.g., TF-IDF text vectors)


      but not on isotropic synthetic data, and had proposed that FlyHash


      specifically benefits from such data properties. Once the actual


      comparison bug was corrected, this pattern disappeared: FlyHash


      outperformed SimHash on the corrected synthetic isotropic data just as


      decisively as on text data. We state plainly that our earlier hypothesis


      was incorrect — it was constructed to explain an artifact of a flawed


      comparison, not a genuine property of either the data or the algorithm


      — and we retract it here rather than omit it from this account.


      We document this investigation in this level of detail because the


      underlying pitfall — conflating a hash’s effective bit count


      with its nominal parameter dimensionality — seems easy to make


      and is, to our knowledge, not explicitly warned against elsewhere in this


      literature. We hope stating it precisely, alongside the specific


      hypotheses that seemed plausible but were not the actual cause, helps


      others attempting a similar comparison avoid the same error.'
