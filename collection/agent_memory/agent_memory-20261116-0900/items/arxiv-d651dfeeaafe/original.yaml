  \ four datasets spanning two modalities, with one specific,\n\npreviously undocumented\
  \ comparison pitfall identified and corrected\n\nalong the way); does that advantage\
  \ translate into real memory and\n\nlatency savings, including against the dense-vector\
  \ indexing (HNSW)\n\npractitioners default to today (no: at equal bits FlyHash’s\
  \ codes are\n\nlarger and slower to compare than SimHash’s, and HNSW dominates both\
  \ hash\n\nmethods at ordinary scale; a sparse-set comparison we introduce recovers\n\
  \n\nA3: most but not all of a naive latency gap, leaving hashing’s practical case\n\
  \nnarrower and more specific than the quality result alone implies); and does the\
  \ advantage survive genuine, non-circular\n\nagent-memory relevance labels rather\
  \ than the nearest-neighbor-by-\n\nembedding proxy this literature otherwise relies\
  \ on (it does). We report\n\nall three answers precisely, including the two that\
