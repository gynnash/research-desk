  - id: S13
    title: '4.4 A sparse-set comparison: partial recovery'
    text: 'Because every FlyHash code has exactly k active bits, the Hamming


      distance between two such codes reduces to 2k-2|A\cap B| , where A


      and B are their sets of active indices. Ranking by Hamming distance is


      therefore identical to ranking by descending intersection size, which we


      compute as a sparse-sparse matrix product over only the active indices,


      rather than a dense operation over the full m -wide array.


      Table 6: Sparse vs. dense FlyHash comparison, and memory as an explicit


      index list (uint16 per active index).


