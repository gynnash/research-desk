      The sparse comparison is 10–22 \times faster than the dense comparison


      and, unlike the dense version, its latency correctly scales with k


      rather than remaining flat. It does not, however, close the gap to


      SimHash entirely: SimHash’s small dense k\times k matrix


      multiplication remains 2–5 \times faster at every budget tested, and


      explicit index-list storage, while now also correctly scaling with k ,


      remains \sim 16 \times larger than SimHash’s bit-packed code, since


      storing an explicit position costs a full integer where bit-packing


      costs a single bit. We report this as a genuine, partial improvement —


      not a solved problem — and discuss the remaining gap in


      Section 6.'
