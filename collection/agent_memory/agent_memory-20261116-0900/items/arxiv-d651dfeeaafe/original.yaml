  \ benchmark (https://arxiv.org/html/2611.05791v1#S4.SS7)\nA37: Every result above\
  \ uses nearest-neighbor-by-embedding as a stand-in for\n\n“relevance” — two items\
  \ are treated as relevant to each other if an\n\nunhashed embedding considers them\
  \ close, which is circular with respect\n\nto the embedding itself and does not\
  \ test anything about whether hashing\n\npreserves true query-to-memory relevance.\
  \ We address this with a\n\nseparate benchmark using constructed relevance labels\
  \ that do not derive\n\nfrom any embedding distance.\n\nEstablished agent-memory\
  \ benchmarks such as LoCoMo (Maharana et al., 2024)\n\nand LongMemEval (Wu et al.,\
  \ 2024) evaluate end-to-end conversational QA\n\naccuracy over multi-session dialogue,\
  \ which conflates retrieval quality\n\nwith the downstream LLM’s reasoning over\
  \ retrieved context (Wu et al.,\n\n2024, explicitly separate indexing, retrieval,\
  \ and reading for this\n\nreason). Our evaluation instead requires ground-truth\
  \ relevance labels for\n\nthe retrieval step in isolation — the quantity FlyHash\
  \ and SimHash\n\nactually compete on — which these QA-style benchmarks do not provide\n\
  \ndirectly. We therefore construct a dataset with explicit, non-circular\n\nrelevance\
  \ labels anchored to named personas below, in the same spirit as\n\nrecent calls\
  \ for benchmark designs that disentangle retrieval correctness\n\nfrom answer correctness\
  \ (Wu et al., 2024; Hao et al., 2026).\n\nConstruction. We generate 150 synthetic\
  \ named personas, each\n\n\nA38: with 10 independent facts (favorite color, allergy,\
  \ job title, hometown,\n\nand six others), each fact expressed via 3–4 paraphrase\
  \ templates that\n\nname the persona directly (e.g., “Jordan’s favorite color is\
  \ teal.” /\n\n“If you ask Jordan, teal is their favorite color.”), giving 6,000\n\
  \nmemory sentences total. Each query is a differently-worded question that\n\nalso\
  \ names a target persona (e.g., “Which color does Jordan like\n\nbest?”), and its\
  \ ground-truth relevant set is exactly that persona’s own\n\nparaphrases for that\
  \ fact (3–4 sentences out of 6,000) — a label\n\nfixed by construction, not by embedding\
  \ similarity. Naming every fact\n\nand question to a specific persona is what makes\
  \ the corpus both\n\ngenuinely confusable (thousands of near-identical same-template\n\
  \nstatements about other people crowd every query) and answerable\n\nfrom text content\
  \ alone (the one token that correctly disambiguates the\n\nright answer — the name\
  \ — is actually present in the query), which\n\nan earlier, unnamed version of this\
  \ design was not: without a persona\n\nname tying question to answer, no text-similarity\
  \ method, hashed or not,\n\ncan identify whose stated value is correct among many\
  \ textually\n\nidentical same-template statements, and we do not report numbers\
  \ from\n\nthat earlier, ill-posed version.\n\nEmbedding. We embed both memories\
  \ and queries with TF-IDF\n\n\nA39: followed by truncated SVD (256 components),\
  \ fit on the memory corpus —\n\nan offline, network-free stand-in for a real sentence-transformer\n\
  \nembedding, consistent with this project’s practice elsewhere\n\n(Section 6).\n\
  \nTable 10: FlyHash vs. SimHash, standard mean Average Precision against constructed\
  \ relevance labels (150 queries, 6,000 memories, 10 seeds).\n\nk (bits)\n\nFlyHash\
  \ mAP (labeled)\n\nSimHash mAP (labeled)\n\nRobust\n\n16\n\n0.195 \\pm 0.014\n\n\
  0.038 \\pm 0.010\n\nYes\n\n32\n\n0.271 \\pm 0.017\n\n0.105 \\pm 0.011\n\nYes\n\n\
  64\n\n0.324 \\pm 0.012\n\n0.212 \\pm 0.016\n\nYes\n\n128\n\n0.365 \\pm 0.009\n\n\
  0.298 \\pm 0.011\n\nYes\n\n256\n\n0.392 \\pm 0.009\n\n0.345 \\pm 0.011\n\nYes\n\n\
  FlyHash beats SimHash robustly at every budget on this genuinely-labeled\n\ntask,\
  \ with absolute mAP values well above chance (random ranking over\n\n6,000 items\
  \ with \\sim 4 relevant would score far below 0.1) but,\n\nexpectedly, lower than\
  \ Table 2’s\n\nnearest-neighbor-pseudo-label mAP — this is a harder, more realistic\n\
  \ntask by construction, and the two numbers are not meant to be compared\n\ndirectly.\
  \ This result is, to our knowledge, the first time FlyHash’s\n\nadvantage over SimHash\
  \ has been shown against actual, non-circular\n\nrelevance labels for an agent-memory-shaped\
  \ task rather than an\n\nembedding-similarity proxy.\n[S17] 5 Discussion (https://arxiv.org/html/2611.05791v1#S5)\n\
  A40: Why is the advantage largest at low bit budgets? FlyHash’s\n\nsparse expansion\
  \ into a much higher-dimensional space before selecting\n\nwinners appears to preserve\
  \ more of the input’s neighborhood structure\n\nper output bit than SimHash’s direct\
  \ dense projection, particularly when\n\nvery few bits are available to encode that\
  \ structure. As the bit budget\n\ngrows, both methods have enough capacity to represent\
  \ more of the\n\nrelevant structure, and the relative gap narrows — though FlyHash’s\n\
  \nabsolute advantage never disappears across any budget we tested\n\n(Table 2).\
  \ This pattern is practically significant:\n\nreal deployments of compact hashing\
  \ are motivated precisely by wanting\n\nfew bits per record (that is the entire\
  \ point of hashing over\n\nstoring full embeddings), so the regime where FlyHash’s\
  \ advantage is\n\nlargest is also the regime a real system would actually operate\
  \ in.\n\nA quality advantage is not automatically a resource advantage.\n\nSection\
  \ 4.3 is, to our knowledge, an underappreciated\n\npoint in this line of work: a\
  \ hash function can preserve neighbor\n\nstructure strictly better than a baseline\
  \ while, in a naive\n\nimplementation, being simultaneously worse on memory and\
  \ speed —\n\nbecause “better structure per bit” and “cheap to store and compare”\n\
  \nare different properties that do not automatically follow from each\n\nother.\
  \ Section 4.4 shows that a principled fix targeting the\n\n\nA41: comparison’s sparsity\
  \ recovers much, but not all, of one axis (speed)\n\nwhile leaving the other (memory)\
  \ only partially improved. We think this\n\ndistinction — quality-per-bit versus\
  \ deployed resource cost — is\n\nworth making explicit in any evaluation of a hashing\
  \ scheme derived from\n\na sparse-coding argument, not only in this paper.\n\nPractical\
  \ implication for agent memory. An agent adopting\n\nFlyHash today obtains a genuine,\
  \ robustly validated retrieval-quality\n\nimprovement per bit over SimHash, particularly\
  \ in the low-bit-budget\n\nregime most relevant to a resource-constrained memory\
  \ system, and\n\n(Section 4.7) that advantage survives contact\n\nwith genuine,\
  \ non-circular relevance labels, not just an\n\nembedding-similarity proxy. It should\
  \ not, on the basis of this paper,\n\nexpect a memory or latency improvement over\
  \ a well-implemented SimHash\n\nbaseline without further engineering (Section 6),\n\
  \nnor should it expect either hash method to beat a standard production\n\nANN index\
  \ such as HNSW at ordinary scale (Section 4.6)\n\n— HNSW wins on quality and latency\
  \ simultaneously there, at a modest\n\nmemory premium over exact storage. Which\
  \ of these properties matters\n\nmost depends on the deployment: a system already\
  \ committed to compact\n\nhash codes, bottlenecked on retrieval accuracy at a fixed,\
  \ small bit\n\nbudget, benefits from FlyHash as a drop-in SimHash replacement; a\
  \ system\n\n\nA42: with no unusual storage constraint should likely use HNSW instead\
  \ of\n\neither hash; and a system bottlenecked specifically on raw per-record\n\n\
  storage at a scale where even HNSW’s overhead is unaffordable is the\n\nnarrow regime\
  \ where FlyHash/SimHash-style hashing is the right tool at\n\nall.\n[S18] 6 Limitations\
  \ and Future Work (https://arxiv.org/html/2611.05791v1#S6)\nA43: •\n\nMemory and\
  \ speed do not fully match the quality advantage,\n\neven after a targeted attempt\
  \ to close the gap.\n\nSection 4.4’s sparse-set comparison recovers most of the\n\
  \nspeed disadvantage but leaves a meaningful memory disadvantage; a\n\ngenuinely\
  \ sublinear index (e.g., banded or multi-probe LSH, or an\n\ninverted index verified\
  \ sublinear at scale — an earlier inverted-index\n\nattempt in our own implementation\
  \ was found not to be sublinear at the\n\nscales we tested) remains unbuilt. A more\
  \ compact encoding of the\n\nactive-index list (delta-coding of sorted indices,\
  \ variable-length or\n\nentropy coding, or reducing pool size at some cost to quality)\
  \ is a\n\nconcrete, identified next step we did not pursue here.\n\n•\n\nOur HNSW\
  \ comparison (Section 4.6) is a\n\nsingle-scale, single-configuration snapshot.\
  \ We report one dataset\n\n(GloVe, 5,000 records) and one HNSW configuration ( M=32\
  \ ,\n\nefConstruction =200 , three efSearch values); HNSW’s relative advantage\n\
  \nover hashing shrinks as per-record storage budgets tighten and may\n\nshrink or\
  \ reverse at very different corpus scales, which we have not\n\nswept. A combined\
  \ approach (e.g., FlyHash codes as a cheap pre-filter\n\nahead of an HNSW-indexed\
  \ re-ranking stage, in the spirit of how FAISS\n\ncombines quantization with HNSW)\
  \ is a natural direction we have not\n\nexplored.\n\n•\n\nSIFT1M, part of the original\
  \ paper’s evaluation, is not\n\nincluded.\nA44:  We judged that four independent\
  \ datasets across two\n\nmodalities already provide strong evidence the result is\
  \ not\n\ndataset-specific, and that a fifth, necessarily subsampled dataset\n\n\
  (SIFT1M’s full 1M-vector scale is impractical to evaluate exhaustively at\n\nour\
  \ compute budget) would add breadth rather than materially new\n\nevidence. We report\
  \ this as a deliberate scope decision, not an\n\noversight.\n\n•\n\nWe do not implement\
  \ DenseFly’s densification or BioHash’s\n\nlearned projection, both of which are\
  \ reported improvements over the\n\nplain, random-projection FlyHash evaluated here\n\
  \n(Section 2). Combining either with the agent-memory\n\napplication is natural\
  \ future work.\n\n•\n\nWe compare two hashing paradigms (sparse random-projection\n\
  \nvs. dense random-hyperplane) but do not benchmark against vector\n\nquantization\
  \ methods (e.g., Product Quantization, RaBitQ), which the\n\nliterature indicates\
  \ generally outperform hashing in accuracy-per-bit\n\n(Jégou et al., 2011; Gao &\
  \ Long, 2024; Section 2); a\n\ncomparison against quantization is natural future\
  \ work alongside the\n\nHNSW baseline already included.\n\n•\n\nThe real-text (MiniLM)\
  \ evaluation uses a small,\n\n100-sentence corpus, chosen to avoid duplicate-embedding\
  \ artifacts (see\n\nAppendix A) rather than to represent realistic\n\nagent-memory\
  \ scale. A larger, more diverse real-text corpus would\n\nstrengthen this specific\
  \ result.\n\n•\n\n\nA45: We report only a single data point for the full\n\nend-to-end\
  \ agent memory system’s latency (Section 4.5:\n\n20.5 ms/query on one machine, one\
  \ query, 30 repeats), not a proper\n\nbenchmark — no seed averaging and no sweep\
  \ over corpus size or\n\nhardware. A dedicated, multi-seed system-level benchmark\
  \ is future work.\n\n•\n\nThe realistic, labeled agent-memory benchmark\n\n(Section\
  \ 4.7) uses templated synthetic text,\n\nnot naturally-occurring language, and a\
  \ TF-IDF+SVD embedding as a\n\nstand-in for a real sentence-transformer. Real sentence\
  \ diversity is\n\nconsiderably messier than any fixed template set, and real deployments\n\
  \nwould more plausibly scope memory retrieval by session or user ID than\n\nrely\
  \ on a name mentioned in free text. A rerun with real human-written\n\nmemory logs\
  \ and a real sentence-transformer embedding (on a machine with\n\ninternet access,\
  \ the same gap already noted for MiniLM/MNIST elsewhere\n\nin this paper) would\
  \ strengthen this specific result.\n[S19] 7 Conclusion (https://arxiv.org/html/2611.05791v1#S7)\n\
  A46: Our three research questions have three different shapes of answer, and\n\n\
  we state the claim no wider than that. FlyHash beats SimHash at matched\n\nactive-bit\
  \ counts, robustly, on every dataset and seed we tested,\n\nincluding under genuine\
  \ agent-memory relevance labels rather than an\n\nembedding-similarity proxy (RQ1,\
  \ RQ3) — this is a real, well-supported\n\nresult, and one previously undocumented\
  \ comparison pitfall ( k -vs- m\n\nconflation) had to be corrected to see it. But\
  \ the practical deployment\n\nquestion (RQ2) does not resolve as cleanly: FlyHash’s\
  \ quality advantage\n\nover SimHash does not translate into a memory or latency\
  \ advantage under\n\na naive comparison, a sparse-set comparison closes most but\
  \ not all of\n\nthat gap, and a standard production index (HNSW) outperforms both\
  \ hash\n\nmethods on every axis at ordinary scale, leaving genuinely extreme\n\n\
  storage constraints as hashing’s specific niche rather than a general\n\ndeployment\
  \ recommendation. We think this — a validated hash-quality\n\nresult, a corrected\
  \ methodological pitfall, and a resource picture that\n\nnarrows rather than flatters\
  \ the headline claim — is a more useful\n\ncontribution to reproducible progress\
  \ here than a report that stopped at\n\nthe first, more flattering result.\n[S20]\
