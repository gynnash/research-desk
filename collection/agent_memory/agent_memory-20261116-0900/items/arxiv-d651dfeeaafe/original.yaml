  \ paper evaluates throughout.\n\nOur main results (Sections 4.1–4.4)\n\nisolate\
  \ hashing-function quality by comparing FlyHash against SimHash at\n\nmatched bit\
  \ budgets, rather than against HNSW, since the two are\n\ndifferent design points\
  \ (compact-code quality versus indexed graph\n\nsearch); we separately report a\
  \ direct, explicitly-labeled systems\n\n\nA11: comparison against HNSW in Section\
  \ 4 for readers asking\n\nthe practical “which would I actually deploy” question.\n\
  \nLLM memory architectures and retrieval-augmented generation. A\n\nlarge and rapidly\
  \ growing body of work designs memory systems for LLM\n\nagents directly, distinct\
  \ from the hashing-algorithm literature surveyed\n\nabove: production-oriented long-term\
  \ memory frameworks (Chhikara et al.,\n\n2025), structural memory representations\
  \ spanning chunks, triples, and\n\nsummaries (Zeng et al., 2024), and recent surveys\
  \ of agent memory\n\nmechanisms and evaluation (Du, 2026). This literature’s central\
  \ recent\n\nfinding — that flat, independent similarity retrieval over text\n\n\
  snippets can suffer from redundancy and relational blindness at longer\n\nhorizons,\
  \ motivating structured or hierarchical retrieval instead (Hu et\n\nal., 2026; Cao\
  \ et al., 2026) — is complementary to this paper’s\n\ncontribution: we evaluate\
  \ hashing methods within the flat similarity-based\n\nretrieval regime that remains\
  \ a widely used baseline (e.g., Mem0-style\n\nsystems), rather than proposing or\
  \ evaluating a structured memory\n\narchitecture; combining FlyHash-style hashing\
  \ with structured retrieval is\n\nnatural future work (Section 6).\n\nVector quantization\
  \ and alternative hashing families. A separate\n\nline of work compresses dense\
