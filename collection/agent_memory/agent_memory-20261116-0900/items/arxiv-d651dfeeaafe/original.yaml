material: "[S1] FlyHash for LLM Agent Memory: An Empirical Validation and a New Application\
  \ (https://arxiv.org/html/2611.05791v1)\nA1: Mohan Bheemadolu\n\n††thanks: Code:\
  \ https://github.com/mohanji/flyhash-agent-memory\n\nArchive (DOI): https://doi.org/10.5281/zenodo.23903302\n\
  \nAffiliation: Independent Researcher. Email: mohan.bmdl@gmail.com\n\nChrisogonas\
  \ O. Odhiambo\n\nAffiliation: Email: chrisogonas@gmail.com\n[S2] Abstract (https://arxiv.org/html/2611.05791v1#abstract1)\n\
  A2: Large language model (LLM) agents increasingly rely on external memory\n\nstores\
  \ to retain information across conversations, typically via dense\n\nvector embeddings\
  \ searched with approximate nearest-neighbor methods. The\n\nfruit fly’s olfactory\
  \ circuit computes a locality-sensitive hash of sensory\n\ninput using a strikingly\
  \ different mechanism — sparse random projection\n\nfollowed by winner-take-all\
  \ competition — and prior work (Dasgupta et al.,\n\n2017) showed this scheme, dubbed\
  \ FlyHash, preserves neighbor structure\n\nbetter per bit than conventional random-hyperplane\
  \ hashing (SimHash) on\n\nseveral benchmarks. We apply FlyHash, to our knowledge\
  \ for the first\n\ntime, to LLM agent memory retrieval, and ask three questions\
  \ a\n\npractitioner actually needs answered: does the quality advantage hold\n\n\
