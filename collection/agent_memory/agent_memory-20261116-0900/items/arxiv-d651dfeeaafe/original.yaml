  A4: Large language model agents that operate over long or repeated\n\ninteractions\
  \ increasingly need memory: a way to store facts, preferences,\n\nor prior context\
  \ and retrieve the relevant pieces on demand\n\n(Chhikara et al., 2025). The dominant\n\
  \napproach embeds each memory as a dense vector and retrieves by approximate\n\n\
  nearest-neighbor search over an index such as FAISS (Johnson et al., 2021; see also\
  \ the RAG survey of\n\nZhao et al., 2024),\n\nthough hybrid retrieval architectures\
  \ combining dense and lexical signals\n\nare an active and growing alternative.\
  \ This works well but\n\nscales in memory and compute with the size and dimensionality\
  \ of the\n\nstored embeddings, motivating interest in more compact representations\
  \ —\n\nin particular, hashing schemes that compress an embedding into a short\n\n\
  binary code while preserving enough neighbor structure to remain useful\n\nfor retrieval.\n\
  \nOne such scheme, introduced by Dasgupta, Stevens, and Navlakha (2017) and\n\n\
  directly inspired by neurobiology, computes a locality-sensitive hash the\n\nway\
  \ the fruit fly’s olfactory circuit is believed to encode odors: roughly\n\n50 receptor-neuron\
  \ activations are randomly and sparsely projected into\n\napproximately 2,000 “Kenyon\
  \ cells,” of which only the top \\sim 5% most\n\nactive are allowed to “fire,” producing\
  \ a sparse binary code. The original\n\npaper showed that this scheme — which we\
  \ refer to as FlyHash, following\n\n\nA5: subsequent literature — preserves nearest-neighbor\
  \ structure better, at a\n\nmatched number of output bits, than SimHash (Charikar,\
  \ 2002), the standard\n\nrandom-hyperplane hashing baseline, on several benchmark\
  \ datasets including\n\nSIFT, GloVe, and MNIST.\n\nDespite this result and several\
  \ follow-up papers extending the algorithm\n\n(surveyed in Section 2), we are not\
  \ aware of any prior work\n\napplying FlyHash-style hashing specifically to LLM\
  \ agent memory retrieval\n\n— a setting that is, in several respects, a natural\
  \ fit: agent memories\n\nare frequently decomposed into short, numerous, semantically\
  \ embedded\n\nunits retrieved by similarity (Hu et al., 2026; Du, 2026; Zeng et\
  \ al.,\n\n2024) — the regime this paper’s evaluation targets, though we note that\n\
  \nrecent work increasingly favors structured or hierarchical retrieval over\n\n\
  flat similarity search for longer-horizon tasks (Cao et al., 2026; Hu et\n\nal.,\
  \ 2026).\n\nThis paper is organized around three research questions, each answered\n\
  \nprecisely rather than in the aggregate, because — as we show below —\n\nthe answers\
  \ are not all the same shape:\n\n•\n\nRQ1. Under a protocol that correctly holds\
  \ FlyHash’s and\n\nSimHash’s active bit counts equal (Section 3.2),\n\ndoes FlyHash’s\
  \ reported per-bit retrieval-quality advantage over SimHash\n\nhold for data representative\
  \ of LLM agent memory, robustly across seeds\n\nand datasets? (Sections 4.1–4.2;\n\
  \n\nA6: answer: yes, with one specific, previously undocumented comparison\n\npitfall\
  \ that must be avoided to get there — Appendix A.)\n\n•\n\nRQ2. Does that quality\
  \ advantage translate into an actual\n\nresource advantage — lower memory, lower\
  \ query latency — in a\n\nrealistic deployment, including against the dense-vector\
  \ indexing\n\nmethods (HNSW) practitioners use by default today?\n\n(Sections 4.3–4.4,\
  \ 4.6;\n\nanswer: not by default, and not relative to HNSW at ordinary scale —\n\
  \nhashing’s resource case is narrower than the quality result alone would\n\nsuggest.)\n\
  \n•\n\nRQ3. Does the quality advantage hold under genuine,\n\nnon-circular agent-memory\
  \ relevance labels, rather than the\n\nnearest-neighbor-by-embedding proxy used\
  \ everywhere else in this\n\nliterature (including the original FlyHash paper)?\n\
  \n(Section 4.7; answer: yes.)\n\nIn service of these questions, the paper’s contributions\
  \ are: (1) the\n\nfirst application, to our knowledge, of FlyHash to LLM agent memory\n\
  \nretrieval, with a working end-to-end system\n\n(Sections 3.5, 4.5); (2) the\n\n\
  matched-active-bit protocol itself, stated precisely enough to prevent a\n\nspecific\
  \ conflation we discovered by reproducing a discrepancy with a\n\npublished result\
  \ (Section 3.2, Appendix A);\n\n(3) statistical and cross-dataset validation beyond\
  \ the original paper\n\n— 10 seeds, four datasets across two modalities, a 36-configuration\n\
  \n\nA7: hyperparameter sweep, and a paired statistical analysis\n\n(Sections 4.1–4.2);\
  \ and (4) an\n\nhonest, multi-angle resource and deployment analysis that does not\
  \ stop\n\nat the quality result — brute-force memory/latency costs, a sparse-set\n\
  \ncomparison, a direct HNSW systems baseline, and a relevance-label\n\nupgrade (Sections\
  \ 4.3–4.4,\n\n4.6–4.7).\n\nThe remainder of this paper is organized as follows.\n\
  \nSection 2 situates this work relative to FlyHash’s\n\noriginal paper and its algorithmic\
  \ follow-ups. Section 3\n\ndescribes the method, evaluation protocol, datasets,\
  \ and statistical\n\nprocedure. Section 4 presents results.\n\nSection 5 discusses\
