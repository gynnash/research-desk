  \ (Jégou, Douze, & Schmid, 2010) and its\n\noptimized variants (Ge et al., 2013)\
  \ achieve higher retrieval accuracy\n\nthan binary hashing at comparable memory\
  \ budgets by preserving continuous\n\ndistance estimates via asymmetric lookup tables\
  \ rather than collapsing to\n\nHamming codes; recent methods such as RaBitQ extend\
  \ this advantage to\n\nextreme, 1-bit-per-dimension compression (Gao & Long, 2024).\
  \ We do not\n\nevaluate against this family here, since our focus is a head-to-head\n\
  \ncomparison between two hashing paradigms under a matched-bit protocol, but\n\n\
