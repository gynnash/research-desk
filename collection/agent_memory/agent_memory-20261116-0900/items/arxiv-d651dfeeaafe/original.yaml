  \ so a single evaluation reflects one\n\nparticular random draw, not the expected\
  \ behavior of the method. For our\n\nmain results (Section 4.1) and hyperparameter\
  \ ablation\n\n(Section 4.2), we repeat every evaluation across N\n\nindependent\
