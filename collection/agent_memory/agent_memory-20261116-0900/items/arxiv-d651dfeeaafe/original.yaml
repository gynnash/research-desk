  - id: S5
    title: 3.1 FlyHash and SimHash
    text: 'Both hashing schemes take a dense input vector x\in\mathbb{R}^{d} and


      produce a binary output code.


      SimHash (Charikar, 2002) draws a dense random matrix


      W\in\mathbb{R}^{k\times d} with entries sampled i.i.d. from a


      standard normal distribution, and outputs


      h_{\text{sim}}(x)=\operatorname{sign}(Wx)\in\{0,1\}^{k}.


      Every one of the k output bits is thresholded independently; the code


      is dense in the sense that each bit is set to 1 with probability


      approximately 1/2 .


      FlyHash (Dasgupta et al., 2017) instead draws a sparse


      random projection matrix P\in\mathbb{R}^{m\times d} , where each row


      (each “Kenyon cell”) is connected to only a random subset of


      \lceil s\cdot d\rceil input dimensions ( s is the sparsity,


      fixed at 0.10 throughout this paper, following the fly’s own


      connectivity, where each Kenyon cell integrates inputs from roughly


      5–12% of input channels; Caron, Ruta, Abbott, & Axel, 2013), with


      weights drawn uniformly from \{-1,+1\} on those


      connections and zero elsewhere. The projection Px is then passed


      through a k -winners-take-all operation: only the k largest of the m


      projected values are set to 1, all others to 0:


      h_{\text{fly}}(x)=\operatorname{WTA}_{k}(Px)\in\{0,1\}^{m},\qquad\lVert h_{\text{fly}}(x)\rVert_{0}=k.


      We refer to m as the pool size (the total number of Kenyon


      cells, fixed at 2,000 in our experiments unless otherwise stated) and


      k as the bit budget (the number of winning, active bits). This


      notational distinction — k versus m — is deliberately explicit,


      because conflating the two is the source of the reproducibility


      discrepancy described in Section 3.2 and


      Appendix A.'
    location: https://arxiv.org/html/2611.05791v1#S3.SS1
  - id: S6
    title: 3.2 Evaluation protocol
    text: 'Metric. Following BioHash (Ryali et al., 2020), we evaluate


      retrieval quality with mean Average Precision at R (mAP@ R ). For a


      query q , let the relevant set be its R true nearest neighbors


      under exact Euclidean distance on the original (unhashed) embeddings.


      Average Precision for q is


      \text{AP}(q)=\frac{1}{R}\sum_{\ell=1}^{R}\text{Precision}(\ell)\cdot\text{Rel}(\ell),


      where \text{Rel}(\ell)=1 if the item ranked \ell -th by Hamming


      distance under the hash code is in the relevant set, and


      \text{Precision}(\ell) is the fraction of relevant items among the top


      \ell ranked results. mAP@ R is the mean of \text{AP}(q) over all


      queries. Unlike plain recall@ k , mAP@ R rewards ranking true neighbors


      earlier, not merely including them somewhere in the top R .


      Matched-active-bit (quality-per-active-bit) protocol. The


      central methodological point of this paper concerns what it means to


      compare FlyHash and SimHash “at the same number of bits.” There are at


      least three distinct, non-interchangeable notions of parity one could


      hold fixed:


      1.


      Equal active/output bits — the number of bits that are


      actually compared by Hamming distance per query ( k for both methods).


      This is the notion we use throughout


      Sections 4.1–4.2, and we call it the


      matched-active-bit protocol to avoid the vaguer, overloaded term


      “fair comparison.”


      2.


      Equal physical storage — the number of bytes each


      method’s code occupies at rest, which depends on representation


      (dense vs. packed vs. sparse-index), not just k


      (Sections 4.3–4.4).


      3.


      Equal query-time/resource budget — the number of bytes


      moved or compared per query, which can differ from storage when a


      method’s on-disk and in-memory representations differ


      (Sections 4.3–4.4, 4.6).


      Conflating these is the specific pitfall this paper is built around.


      Concretely, under the matched-active-bit protocol, for each bit budget


      k we evaluate FlyHash with pool size m fixed at a large value


      (2,000, unless stated otherwise) and the winner-take-all fraction set


      to k/m , and we evaluate SimHash with exactly k output bits — so


      both methods produce the same number of active bits, isolating


      the quality of the hash function from either method’s absolute


      output size. This is not the naive way to run the comparison: a naive


      implementation might instead fix FlyHash’s total output width


      (i.e., set m to whatever “bits” value is being swept) and hold the


      winner-take-all percentage fixed (e.g., 5%, matching the fly’s


      own biology) — in which case FlyHash’s effective number of


      active bits at a given nominal “bits” value is only a small fraction


      of that value, while SimHash is given the full nominal count as


      genuinely active bits. This conflation of k (notion 1) with m


      silently and substantially disadvantages FlyHash, and is distinct from


      the storage/resource conflations addressed later (notions 2 and 3,


      Sections 4.3–4.4). We discovered the


      first pitfall by reproducing a discrepancy with a published result; the


      full diagnostic process, including hypotheses we initially pursued and


      later ruled out, is given in Appendix A.'
