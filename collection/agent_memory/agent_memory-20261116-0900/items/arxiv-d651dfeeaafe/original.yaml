  arXiv:2607.12893.\n[S21] Appendix A Reproducibility Investigation (https://arxiv.org/html/2611.05791v1#A1)\n\
  A52: While reproducing the original paper’s reported result on GloVe word\n\nvectors,\
  \ we initially found FlyHash losing to SimHash on every dataset we\n\ntried — synthetic\
  \ clustered embeddings, TF-IDF text vectors, real\n\nsentence embeddings, and real\
  \ GloVe vectors — directly contradicting\n\nthe published finding on GloVe. We treated\
  \ this discrepancy as a signal\n\nthat our comparison, not the algorithm, was most\
  \ likely at fault, and\n\npursued it systematically rather than accepting or explaining\
  \ away the\n\ncontradiction.\n\nHypotheses ruled out. We first tested whether L2-normalizing\n\
  \ninputs before hashing affected the result; it did not, meaningfully. We\n\nthen\
  \ tested whether using the algorithm’s exact original weight\n\ndefinition (true\
  \ binary \\{0,1\\} projection weights, rather than the\n\nsigned \\{-1,+1\\} weights\
  \ we had implemented) affected the result; it\n\ndid not, and we quantify this claim\
  \ across all five main bit budgets\n\nbelow rather than resting it on the single\
  \ seed we checked at the time.\n\nWe then tested whether our evaluation metric —\
  \ recall@ k by overlap,\n\nrather than mAP@ R — was responsible; switching to mAP@\
  \ R produced\n\nthe same qualitative picture. Each ruled-out hypothesis narrowed\
  \ the\n\nsearch space without resolving the discrepancy.\n\nQuantifying the weight-mode\
  \ claim. The “it did not,\n\nmeaningfully” judgment above was originally made on\
  \ a single seed.\n\n\nA53: Re-run across all 10 seeds and all five main bit budgets\
  \ (GloVe), with\n\nSimHash included as a reference:\n\nTable 11: Signed vs. binary\
  \ FlyHash projection weights, GloVe, 10 seeds.\n\nk (bits)\n\nSigned \\{-1,+1\\\
  } mAP\n\nBinary \\{0,1\\} mAP\n\n| diff |\n\nSimHash mAP (ref.)\n\n16\n\n0.196 \\\
  pm 0.007\n\n0.191 \\pm 0.005\n\n0.0042\n\n0.047 \\pm 0.006\n\n32\n\n0.314 \\pm 0.009\n\
  \n0.298 \\pm 0.007\n\n0.0156\n\n0.096 \\pm 0.009\n\n64\n\n0.449 \\pm 0.008\n\n0.421\
  \ \\pm 0.005\n\n0.0277\n\n0.185 \\pm 0.008\n\n128\n\n0.585 \\pm 0.006\n\n0.540 \\\
  pm 0.005\n\n0.0449\n\n0.316 \\pm 0.006\n\n256\n\n0.705 \\pm 0.006\n\n0.647 \\pm\
  \ 0.005\n\n0.0577\n\n0.469 \\pm 0.007\n\nBoth weight modes beat SimHash by a wide\
  \ margin at every budget tested.\n\nThe signed-vs-binary difference is not zero\
  \ and grows with k (0.004 at\n\nk=16 to 0.058 at k=256 ), so the honest claim is\
  \ not “no difference”\n\nbut “small relative to the FlyHash-vs-SimHash effect at\
  \ every budget we\n\ntested, with a modest upward trend at higher k ” — the main\
  \ results\n\nin Section 4.1 use the signed variant throughout, and\n\nthis table\
  \ bounds how much of that result could plausibly be an\n\nartifact of that choice.\n\
  \nThe actual cause. We resolved the discrepancy by comparing our\n\nimplementation’s\
  \ parameterization directly against a third-party\n\nreference implementation of\
  \ the original algorithm\n\n(github.com/dataplayer12/Fly-LSH). This revealed that\
  \ our\n\ncomparison held FlyHash’s total hash dimensionality equal to\n\n\nA54:\
  \ SimHash’s bit count while separately fixing FlyHash’s winner-take-all\n\npercentage\
  \ — silently making FlyHash’s effective number\n\nof active bits, at any given nominal\
  \ “bits” value, a small fraction of\n\nwhat SimHash was being given as its full,\
  \ genuinely active bit count.\n\nThis is precisely the k -versus- m conflation described\
  \ in\n\nSection 3.2. Correcting the protocol to hold k (not m )\n\nequal between\
  \ the two methods, with m fixed independently at a large\n\nvalue, immediately reproduced\
  \ the original paper’s reported pattern:\n\nFlyHash winning decisively on GloVe\
  \ at every bit budget, and — as it\n\nturned out — on every other dataset we subsequently\
  \ tested as well\n\n(Section 4.1).\n\nA hypothesis retracted. Prior to finding this\
  \ cause, we had\n\nobserved that FlyHash appeared to outperform SimHash specifically\
  \ on\n\ndata with correlated, non-negative features (e.g., TF-IDF text vectors)\n\
  \nbut not on isotropic synthetic data, and had proposed that FlyHash\n\nspecifically\
  \ benefits from such data properties. Once the actual\n\ncomparison bug was corrected,\
  \ this pattern disappeared: FlyHash\n\noutperformed SimHash on the corrected synthetic\
  \ isotropic data just as\n\ndecisively as on text data. We state plainly that our\
  \ earlier hypothesis\n\nwas incorrect — it was constructed to explain an artifact\
  \ of a flawed\n\ncomparison, not a genuine property of either the data or the algorithm\n\
  \n\nA55: — and we retract it here rather than omit it from this account.\n\nWe document\
  \ this investigation in this level of detail because the\n\nunderlying pitfall —\
  \ conflating a hash’s effective bit count\n\nwith its nominal parameter dimensionality\
  \ — seems easy to make\n\nand is, to our knowledge, not explicitly warned against\
  \ elsewhere in this\n\nliterature. We hope stating it precisely, alongside the specific\n\
  \nhypotheses that seemed plausible but were not the actual cause, helps\n\nothers\
  \ attempting a similar comparison avoid the same error."
