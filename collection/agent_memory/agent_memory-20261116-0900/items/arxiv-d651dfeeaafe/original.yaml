  - id: S14
    title: 4.5 Agent memory demonstration
    text: 'The end-to-end system described in Section 3.5


      functions correctly: in the representative interaction described there,


      the agent retrieves a fact shared several turns earlier via


      FlyHash-based Hamming ranking over MiniLM sentence embeddings, without


      that fact appearing anywhere in the immediate conversational context.


      This confirms the pipeline is functional for its intended use case,


      independent of the benchmark numbers in


      Sections 4.1–4.4.


      As one measured data point for the full pipeline’s latency (embedding


      included, not just the isolated hash comparison of


      Sections 4.3–4.4), we timed a single


      representative query against the 6,000-record corpus of


      Section 4.7, averaged over 30 repeats on


      consumer hardware, using the sparse-set comparison method of


      Section 4.4 for the hash-ranking step (the same method


      behind Table 6’s speed numbers, consistent with the rest


      of the paper rather than an unrelated, unoptimized implementation):


      Table 7: End-to-end pipeline latency, one representative query (30 repeats).


      Stage


      ms/query


      % of total


      Sentence embedding (MiniLM)


      14.1


      68.8%


      FlyHash hash + sparse rank


      6.4


      31.2%


      Total end-to-end


      20.5


      100%


      With the hash-ranking step measured consistently with


      Table 6, sentence embedding — not FlyHash’s hash


      comparison — is the dominant cost of the full pipeline, by roughly


      2:1. This is a useful finding in its own right: it means that, at this


      corpus size, FlyHash’s own contribution to end-to-end latency is modest


      relative to the (hash-independent) embedding step, and that further


      latency optimization in a real deployment would pay off more from the


      embedding stage than the hash comparison. Embedding time is identical


      regardless of which hash is used downstream, so this number has no


      bearing on the FlyHash-vs-SimHash comparisons elsewhere in the paper —


      it exists only to put a real figure on the full pipeline’s latency


      rather than leaving it unmeasured. We still report it as a single data


      point on one machine, not a benchmark: no seed averaging and no


      variation in corpus size or hardware. A proper system-level benchmark


      remains future work (Section 6).'
