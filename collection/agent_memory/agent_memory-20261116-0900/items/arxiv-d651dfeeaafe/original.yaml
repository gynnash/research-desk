  \ the corrected protocol in\n\nSection 3.2.\n[S4] 2 Related Work (https://arxiv.org/html/2611.05791v1#S2)\n\
  A8: The original algorithm. Dasgupta, Stevens, and Navlakha (2017)\n\nintroduced\
  \ the algorithm this paper builds on, showing that a\n\nneurally-plausible circuit\
  \ — sparse random projection into a much\n\nhigher-dimensional space, followed by\
  \ winner-take-all sparsification —\n\nfunctions as a locality-sensitive hash competitive\
  \ with, and often\n\nsuperior to, dense random-hyperplane hashing (SimHash; Charikar,\
  \ 2002) at\n\na matched number of output bits. Their evaluation covered SIFT\n\n\
  descriptors, GloVe word vectors, and MNIST images. This paper directly\n\nreuses\
  \ their algorithm and their choice of evaluation datasets (GloVe and\n\nMNIST; we\
  \ do not evaluate on SIFT — see Section 6),\n\napplying it to a problem domain they\
  \ did not consider.\n\nDenseFly. Sharma and Navlakha (2018) extended the base algorithm\n\
  \nwith “DenseFly,” which densifies FlyHash’s sparse output as a\n\npost-processing\
  \ step to further improve similarity search accuracy. This\n\nis a genuine algorithmic\
  \ improvement over plain FlyHash that we do not\n\nimplement here; we discuss it\
  \ as natural future work in\n\nSection 6.\n\nBioHash. Ryali, Hopfield, Grinberg,\
  \ and Krotov (2020) replaced\n\nFlyHash’s random sparse projection with a learned\
  \ one,\n\ntrained with a biologically-plausible local learning rule, and reported\n\
  \nimproved retrieval accuracy over the random-projection version across\n\nseveral\
  \ datasets.\nA9:  Their paper also established mean Average Precision\n\n(mAP) as\
  \ the standard evaluation metric for this line of work, which we\n\nadopt in Section\
  \ 3.2. We note for transparency that\n\nBioHash’s learned projection is reported\
  \ to outperform the plain FlyHash\n\nevaluated in this paper; our contribution is\
  \ not a better hash function,\n\nbut an application and validation of the simpler,\
  \ random-projection\n\nversion, which requires no training data or learning procedure\
  \ — a\n\npractically relevant trade-off for a lightweight agent-memory component.\n\
  \nFlyNN. Most recently, work applying the fly olfactory circuit to\n\nfederated\
  \ nearest-neighbor classification (“FlyNN,” AAAI 2022)\n\nillustrates the breadth\
  \ of problems this biological mechanism has been\n\nadapted to beyond pure hashing,\
  \ extending it to a federated learning\n\nsetting.\n\nExisting implementations.\
  \ A general-purpose FlyHash\n\npackage is available on PyPI (Huang, MIT license),\
  \ providing a\n\nNumPy-compatible implementation of the base algorithm for\n\nsmall-to-medium\
  \ input dimensionalities. Its existence confirms that an\n\nimplementation of the\
  \ algorithm itself is not a novel contribution; our\n\nimplementation exists to\
  \ support the specific experiments in this paper\n\nrather than to serve as a general-purpose\
  \ library.\n\nGraph-based approximate nearest-neighbor search. A different\n\n\n\
  A10: line of work achieves fast approximate retrieval not by compressing each\n\n\
  vector into a short code, but by building a navigable graph over the\n\nfull-precision\
  \ (or lightly quantized) vectors and searching it via\n\ngreedy graph traversal.\
  \ HNSW (Hierarchical Navigable Small World graphs;\n\nMalkov and Yashunin, 2016/2020)\
  \ is the dominant practical method in this\n\nfamily and underlies most production\
  \ vector-search systems in use today\n\n(e.g., FAISS’s IndexHNSW, and the default\
  \ indexes in several\n\nvector databases including Milvus, Pinecone, Weaviate, and\
  \ pgvector;\n\nIdrees et al., 2026). HNSW and hashing schemes like FlyHash and SimHash\n\
  \ntarget different points in the retrieval design space: HNSW optimizes\n\nfor sublinear\
  \ query time and high recall at the cost of storing richer\n\nper-item structure\
  \ (full or near-full vectors plus graph edges), while\n\nFlyHash and SimHash optimize\
  \ for extreme per-record compactness — a\n\nshort binary code compared via cheap\
