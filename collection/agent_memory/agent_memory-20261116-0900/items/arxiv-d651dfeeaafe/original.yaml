  \ literature does not yet provide.\n[S5] 3.1 FlyHash and SimHash (https://arxiv.org/html/2611.05791v1#S3.SS1)\n\
  A14: Both hashing schemes take a dense input vector x\\in\\mathbb{R}^{d} and\n\n\
  produce a binary output code.\n\nSimHash (Charikar, 2002) draws a dense random matrix\n\
  \nW\\in\\mathbb{R}^{k\\times d} with entries sampled i.i.d. from a\n\nstandard normal\
  \ distribution, and outputs\n\nh_{\\text{sim}}(x)=\\operatorname{sign}(Wx)\\in\\\
  {0,1\\}^{k}.\n\nEvery one of the k output bits is thresholded independently; the\
  \ code\n\nis dense in the sense that each bit is set to 1 with probability\n\napproximately\
  \ 1/2 .\n\nFlyHash (Dasgupta et al., 2017) instead draws a sparse\n\nrandom projection\
  \ matrix P\\in\\mathbb{R}^{m\\times d} , where each row\n\n(each “Kenyon cell”)\
  \ is connected to only a random subset of\n\n\\lceil s\\cdot d\\rceil input dimensions\
  \ ( s is the sparsity,\n\nfixed at 0.10 throughout this paper, following the fly’s\
  \ own\n\nconnectivity, where each Kenyon cell integrates inputs from roughly\n\n\
  5–12% of input channels; Caron, Ruta, Abbott, & Axel, 2013), with\n\nweights drawn\
  \ uniformly from \\{-1,+1\\} on those\n\nconnections and zero elsewhere. The projection\
  \ Px is then passed\n\nthrough a k -winners-take-all operation: only the k largest\
  \ of the m\n\nprojected values are set to 1, all others to 0:\n\nh_{\\text{fly}}(x)=\\\
  operatorname{WTA}_{k}(Px)\\in\\{0,1\\}^{m},\\qquad\\lVert h_{\\text{fly}}(x)\\rVert_{0}=k.\n\
  \nWe refer to m as the pool size (the total number of Kenyon\n\ncells, fixed at\
  \ 2,000 in our experiments unless otherwise stated) and\n\n\nA15: k as the bit budget\
  \ (the number of winning, active bits). This\n\nnotational distinction — k versus\
  \ m — is deliberately explicit,\n\nbecause conflating the two is the source of the\
  \ reproducibility\n\ndiscrepancy described in Section 3.2 and\n\nAppendix A.\n[S6]\
  \ 3.2 Evaluation protocol (https://arxiv.org/html/2611.05791v1#S3.SS2)\nA16: Metric.\
  \ Following BioHash (Ryali et al., 2020), we evaluate\n\nretrieval quality with\
  \ mean Average Precision at R (mAP@ R ). For a\n\nquery q , let the relevant set\
  \ be its R true nearest neighbors\n\nunder exact Euclidean distance on the original\
  \ (unhashed) embeddings.\n\nAverage Precision for q is\n\n\\text{AP}(q)=\\frac{1}{R}\\\
  sum_{\\ell=1}^{R}\\text{Precision}(\\ell)\\cdot\\text{Rel}(\\ell),\n\nwhere \\text{Rel}(\\\
  ell)=1 if the item ranked \\ell -th by Hamming\n\ndistance under the hash code is\
  \ in the relevant set, and\n\n\\text{Precision}(\\ell) is the fraction of relevant\
  \ items among the top\n\n\\ell ranked results. mAP@ R is the mean of \\text{AP}(q)\
  \ over all\n\nqueries. Unlike plain recall@ k , mAP@ R rewards ranking true neighbors\n\
  \nearlier, not merely including them somewhere in the top R .\n\nMatched-active-bit\
  \ (quality-per-active-bit) protocol. The\n\ncentral methodological point of this\
  \ paper concerns what it means to\n\ncompare FlyHash and SimHash “at the same number\
  \ of bits.” There are at\n\nleast three distinct, non-interchangeable notions of\
  \ parity one could\n\nhold fixed:\n\n1.\n\nEqual active/output bits — the number\
  \ of bits that are\n\nactually compared by Hamming distance per query ( k for both\
  \ methods).\n\nThis is the notion we use throughout\n\nSections 4.1–4.2, and we\
  \ call it the\n\nmatched-active-bit protocol to avoid the vaguer, overloaded term\n\
  \n“fair comparison.”\n\n2.\n\n\nA17: Equal physical storage — the number of bytes\
  \ each\n\nmethod’s code occupies at rest, which depends on representation\n\n(dense\
  \ vs. packed vs. sparse-index), not just k\n\n(Sections 4.3–4.4).\n\n3.\n\nEqual\
  \ query-time/resource budget — the number of bytes\n\nmoved or compared per query,\
  \ which can differ from storage when a\n\nmethod’s on-disk and in-memory representations\
  \ differ\n\n(Sections 4.3–4.4, 4.6).\n\nConflating these is the specific pitfall\
  \ this paper is built around.\n\nConcretely, under the matched-active-bit protocol,\
  \ for each bit budget\n\nk we evaluate FlyHash with pool size m fixed at a large\
  \ value\n\n(2,000, unless stated otherwise) and the winner-take-all fraction set\n\
  \nto k/m , and we evaluate SimHash with exactly k output bits — so\n\nboth methods\
  \ produce the same number of active bits, isolating\n\nthe quality of the hash function\
  \ from either method’s absolute\n\noutput size. This is not the naive way to run\
  \ the comparison: a naive\n\nimplementation might instead fix FlyHash’s total output\
  \ width\n\n(i.e., set m to whatever “bits” value is being swept) and hold the\n\n\
  winner-take-all percentage fixed (e.g., 5%, matching the fly’s\n\nown biology) —\
  \ in which case FlyHash’s effective number of\n\nactive bits at a given nominal\
  \ “bits” value is only a small fraction\n\nof that value, while SimHash is given\
  \ the full nominal count as\n\ngenuinely active bits. This conflation of k (notion\
  \ 1) with m\n\n\nA18: silently and substantially disadvantages FlyHash, and is distinct\
  \ from\n\nthe storage/resource conflations addressed later (notions 2 and 3,\n\n\
  Sections 4.3–4.4). We discovered the\n\nfirst pitfall by reproducing a discrepancy\
  \ with a published result; the\n\nfull diagnostic process, including hypotheses\
  \ we initially pursued and\n\nlater ruled out, is given in Appendix A.\n[S7] 3.3\
