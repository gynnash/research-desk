  body_text: 'Agent memory enables large language model (LLM) agents to reuse past
    experiences without updating their parameters. However, semantic similarity alone
    does not guarantee memory usefulness: downstream performance depends on how memories
    are selected and presented to the agent. We propose MemComposer, a memory composer
    that jointly examines the current query and retrieved candidates to decide which
    experiences to include, how many to select, and how to order them. We train the
    composer using Experience Policy Optimization (ExPO), a GRPO-based framework that
    evaluates assembled memory contexts through complete agent interactions and uses
    task-success feedback to optimize the assembly policy. Across three $\tau^2$-bench
    domains with two frozen executors, MemComposer outperforms the strongest baseline
    for each executor while reducing average memory-token usage by 16.9% and 4.9%,
    respectively. The learned policy also transfers to unseen domains, executors,
    and memory banks, and benefits from memories generated by stronger models without
    further training. These results demonstrate the value of learning query-specific
    memory assembly using downstream task feedback.'
