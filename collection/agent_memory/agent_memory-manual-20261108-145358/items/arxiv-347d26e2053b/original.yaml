      Table 7: Results on ALFWorld. Ministral-3-8B-Instruct serves as both the frozen
      executor and the backbone of the vanilla selector and MemComposer.


      We report success rates (%) by task type. Bold and underline mark the best and
      second-best results; ties share the marking.


      We further evaluate MemComposer on ALFWorld (Shridhar et al., 2021), whose tasks
      fall into six types (pick and place, look at an object under a lamp, clean,
      heat, cool, and pick two objects). Following the evaluation setup of SkillRL
      (Xia et al., 2026), we report the success rate on the 133 games of the unseen
      test split.


      Ministral-3-8B-Instruct serves as both the frozen executor and the backbone
      of the vanilla selector and MemComposer.


      The memory bank is built from the executor’s own trajectories on the training
      games with the same pipeline as for \tau^{2} -bench (Appendix D), and the composer
      is trained with ExPO using task success as the outcome.


      All baselines draw from the same top-10 candidates, and fixed-budget baselines


      use k=5 , and MemRL uses k=7 .


      For MemComposer, we report the checkpoint after 20 training steps, roughly one
      epoch over the training data.


      As shown in Table 7, memory is highly beneficial in this environment: similarity-based
      selection alone raises the success rate from 25.6% to 76.7%. MemComposer achieves
      the highest overall success rate, 82.0%, compared with 79.7% for Memento, the
      strongest baseline, and is best or tied-best on three of the six task types.


      The most difficult type, picking two objects, remains challenging for all methods,
      with no method exceeding 30%.'
