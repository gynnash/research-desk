  - id: S27
    title: Learned assembly remains beneficial as memory improves.
    text: 'We test whether the advantage of MemComposer persists when the memory is
      built by stronger agents.


      We replace the memory bank with banks built by four other agents, from Qwen3-32B
      to GPT-5.4, using the same construction pipeline (Appendix D) and setting; since
      stronger agents tend to produce more reliable trajectories and reviews (Zheng
      et al., 2023), these banks span a range of memory quality.


      The executor (Qwen3-4B-Instruct), test tasks, user simulator, and retrieval
      procedure are held fixed; for each bank, all methods share the same top-10 candidate
      pool, and the composer, trained only on the executor’s own bank, is applied
      without retraining.


      Figure 6 shows two patterns.


      First, better memory alone yields limited gains under similarity retrieval:
      on retail, similarity top-5 with GPT-5.4’s bank performs close to its level
      with the executor’s own bank.


      Second, MemComposer matches or outperforms similarity top-5 in 9 of the 10 domain–bank
      pairs and improves average \text{pass}^{4} on every unseen bank, by 9.1 points
      on average and by 7.5 points even with GPT-5.4’s bank.


      Improving what is stored therefore does not remove the need to decide what to
      recall.'
    location: https://arxiv.org/html/2610.21091v2#S5.SS2.SSS0.Px3
  - id: S28
    title: 6 Conclusion
    text: We introduced MemComposer, which jointly selects and orders a variable-size
      subset of retrieved experiences for a frozen LLM agent. Through Experience Policy
      Optimization (ExPO), it learns from downstream task outcomes while keeping the
      executor, retriever, and memory bank fixed. Across three \tau^{2} -bench domains
      and two executors, MemComposer achieves the highest average \mathrm{pass}^{1}
      and \mathrm{pass}^{4} among evaluated methods with fewer memory tokens than
      the strongest baseline for each executor. Further analyses show improved selection
      and ordering, alongside transfer across domains, executors, and memory sources
      without retraining. These results highlight the value of learning memory assembly
      from downstream feedback.
    location: https://arxiv.org/html/2610.21091v2#S6
  - id: S29
    title: Executor preferences.
    text: 'MemComposer learns an assembly policy for one frozen executor. We show
      that this policy transfers to another. Still, we do not characterize what different
      executors prefer in a memory context: whether a stronger model benefits from
      fewer, longer, or differently ordered experiences, and whether the preference
      for failed experiences in §5 is specific to small executors. Both executors
      in this work have 4B and 8B parameters; it remains open whether a frontier-scale
      executor that can judge candidate memories on its own would benefit from a separate
      composer to the same extent.'
    location: https://arxiv.org/html/2610.21091v2#Sx1.SS0.SSS0.Px1
  - id: S30
    title: Ordering.
    text: MemComposer learns presentation order only implicitly from the sequence-level
      reward. Within a group, sampled sequences usually differ in both content and
      order, so credit for ordering is entangled with credit for selection, and with
      G=8 samples per prompt drawn from a space of ordered subsets that grows factorially
      with k , the learned order is not guaranteed to be optimal. Table 2 shows that
      it outperforms four heuristic orderings of the same memories, but we do not
      compare it against an oracle that searches over all permutations.
    location: https://arxiv.org/html/2610.21091v2#Sx1.SS0.SSS0.Px2
  - id: S31
    title: Memory type.
    text: 'We study procedural memory: complete past trajectories together with their
      reviews, from which the executor can reuse actions and avoid earlier mistakes.
      We do not evaluate whether learned assembly helps with other memory types, such
      as semantic memory (facts and rules) or episodic memory of a particular user’s
      history, where the interaction between selected items and their order may differ.'
    location: https://arxiv.org/html/2610.21091v2#Sx1.SS0.SSS0.Px3
