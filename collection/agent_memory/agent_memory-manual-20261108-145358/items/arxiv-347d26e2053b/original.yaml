  - id: S33
    title: A.1 Memory for LLM Agent
    text: 'Agent memory lets LLM agents reuse past experience without updating


      parameters (Jiang et al., 2026), in the form of trajectories and insights


      (Zhao et al., 2024; Ouyang et al., 2025), workflows and skills


      (Wang et al., 2025; Wang et al., 2024a; Ouyang et al., 2026; Zhang et al., 2026a),
      or general-purpose memory stores


      (Packer et al., 2023; Chhikara et al., 2025; Xu et al., 2025). Most of this


      work improves what is stored and how it is organized, while memories


      are still recalled by embedding similarity. Recent methods learn which


      memories to recall from task outcomes: MemRL (Zhang et al., 2026c)


      maintains a utility value for each memory, and Memento


      (Zhou et al., 2025) trains a scorer that predicts whether a single


      case will help; Memory-R1 (Yan et al., 2026) uses RL to manage


      memory operations. These methods score or operate on memories


      individually and return a fixed number of them. MemComposer instead


      treats the assembled context as the unit of decision, choosing which


      memories to include, how many, and in what order, and is rewarded for


      the outcome of that context as a whole.'
    location: https://arxiv.org/html/2610.21091v2#A1.SS1
  - id: S34
    title: A.2 Learning Context Selection from Downstream Feedback
    text: 'Learning which context to provide from downstream feedback has been


      studied in both in-context learning and retrieval-augmented generation.


      For in-context learning, EPR (Rubin et al., 2022), UDR (Li et al., 2023),


      and LLM-R (Wang et al., 2024b) train demonstration retrievers using the


      model’s likelihood of the gold output, while later work selects the


      demonstration set jointly: CEIL (Ye et al., 2023) with a determinantal


      point process, Se2 (Liu et al., 2024) with sequential beam search,


      and Zhang et al. (2022) and RetICL (Scarlatos and Lan, 2023) with


      reinforcement learning, motivated in part by the sensitivity of


      performance to demonstration order (Lu et al., 2022). For


      retrieval-augmented generation, beyond LLM-based


      reranking (Tian et al., 2026), Rank-R1 (Zhuang et al., 2026) and


      REARANK (Zhang et al., 2025a) train rerankers with reinforcement


      learning against relevance labels, search agents and rerankers have been


      trained from the generator’s output (Jiang et al., 2025; Sun et al., 2026a),


      and DynamicRAG (Sun et al., 2025) learns both the number and the


      order of passages from the quality of the generated answer. Beyond


      selection, other work structures how retrieved evidence is used, guiding


      multi-hop reasoning with a taxonomy (Sun et al., 2026c) or expressing


      it as an executable program (Sun et al., 2026b).


      Our setting differs in what is selected and how it is supervised. The candidates


      are full agent trajectories with hindsight reviews, whose value lies in


      how they steer an executor over many steps rather than in the facts or


      answer formats they supply. Prior methods rely on signals that are


      cheap and available per query, such as the likelihood of a gold output,


      relevance labels, or the quality of one generated answer. We have


      neither a gold output nor a gold memory sequence, and an assembled


      context can only be scored after a frozen executor completes a


      multi-turn interaction with tools and a simulated user, so the reward


      is sparse, stochastic, and expensive. Because a single executor run


      confounds context quality with the executor’s own randomness, ExPO


      estimates each context’s utility from repeated executor trials within


      a GRPO-style group comparison.'
    location: https://arxiv.org/html/2610.21091v2#A1.SS2
