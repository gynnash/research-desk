  [S53] Training cost. (https://arxiv.org/html/2610.21091v2#A5.SS3.SSS0.Px3)

  A82: We train each composer for 30 policy updates on NVIDIA H100 80GB GPUs, and
  report GPU-hours summed over all GPUs used by a run.


  For Qwen3-4B-Instruct, one GPU runs composer training and sampling, and five (retail,
  airline) or seven (telecom) GPUs serve the executor with vLLM, for a total of 24.2,
  16.3, and 81.7 GPU-hours on retail, airline, and telecom.


