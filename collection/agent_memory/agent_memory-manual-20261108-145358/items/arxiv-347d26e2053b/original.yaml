  [S2] Abstract (https://arxiv.org/html/2610.21091v2#abstract1)

  A2: Agent memory enables large language model (LLM) agents to reuse past experiences
  without updating their parameters. However, semantic similarity alone does not guarantee
  memory usefulness: downstream performance depends on how memories are selected and
  presented to the agent. We propose MemComposer, a memory composer that jointly examines
  the current query and retrieved candidates to decide which experiences to include,
  how many to select, and how to order them. We train the composer using Experience
  Policy Optimization (ExPO), a GRPO-based framework that evaluates assembled memory
  contexts through complete agent interactions and uses task-success feedback to optimize
  the assembly policy. Across three \tau^{2} -bench domains with two frozen executors,
  MemComposer outperforms the strongest baseline for each executor while reducing
  average memory-token usage by 16.9% and 4.9%, respectively. The learned policy also
  transfers to unseen domains, executors, and memory banks, and benefits from memories
  generated by stronger models without further training. These results demonstrate
  the value of learning query-specific memory assembly using downstream task feedback.

  [S3] 1 Introduction (https://arxiv.org/html/2610.21091v2#S1)

  A3: Figure 1: Semantic Similarity \neq Memory Usefulness. The more similar memory
  misses the permission issue; the less similar one leads to success.


  (a) Effect of memory count


  (b) Effect of ordering


  Figure 2:


  Both the number and the order of memory matter.


  Frozen Qwen3-4B-Instruct agent on \tau^{2} -bench


  pass1 averages c/n across tasks; pass4 averages \binom{c}{4}/\binom{n}{4} , where
  c of n trials succeed. Dashed lines denote no-memory performance.


  (a) Increasing k does not consistently improve performance, and the best k differs
  across domains.


  (b) Reordering the same memory set changes per-task outcomes, though no single order
  is best on average.


  Figure 3: Overview of MemComposer.


  Top: Self-generated trajectories are reviewed and curated into a fixed memory bank.


  Bottom: The composer samples G variable-size, ordered memory


  sequences per query, each evaluated over J executor trials; ExPO updates


  the composer with their group-relative advantages, while the executor and


  memory bank stay fixed.



  A4: Agent memory augments large language models (LLMs) with reusable experience
  (Zhang et al., 2025c; Hu et al., 2025), skills (Wang et al., 2024a; Zheng et al.,
  2024; Ouyang et al., 2026), and knowledge (Park et al., 2023; Zhong et al., 2024;
  Packer et al., 2023; Xu et al., 2025; Chhikara et al., 2025) without updating model
  parameters, and has shown promising potential for agent continuous learning (Shinn
  et al., 2023; Suzgun et al., 2026; Ouyang et al., 2025; Zhang et al., 2026b). A
  typical agent memory system stores past experiences in an external bank,


  retrieves candidate memories for a new task, and inserts them into the


  agent’s context to guide its subsequent decisions. However, the effectiveness of
  an agent’s memory system depends on how useful the retrieved memories are for the
  current task.


  Recent work on agentic memory (Wang et al., 2025; Zhao et al., 2024) has primarily
  focused on improving memory representations, while still relying on similarity-based
  methods, such as sparse retrieval (Robertson and Zaragoza, 2009) and embedding-based
  retrieval (Karpukhin et al., 2020; Izacard et al., 2022; Zhang et al., 2025b), for
  retrieved memories.



  A5: Although such methods are widely used in knowledge-intensive scenarios such
  as retrieval-augmented generation (RAG) (Lewis et al., 2020; Guu et al., 2020; Gao
  et al., 2023) and offer a natural starting point, similarity alone does not guarantee
  that a retrieved memory is useful. As illustrated in Figure 1, a memory describing
  semantically less similar content provides the crucial information while the similar
  memory does not.


  Recent work has accordingly used downstream execution feedback to learn memory utility
  or optimize memory-use policies (Zhang et al., 2026c; Zhou et al., 2025; Yan et
  al., 2026).


  Closing this gap therefore requires learning how candidate memories jointly affect
  downstream task performance, enabling the model to assemble a variable-length memory
  sequence tailored to the current query.


  To better understand how memory assembly affects downstream task performance, we
  examine two key decisions: how many memories to include and in what order to present
  them. Figure 2(a) shows that performance varies non-monotonically with memory count,
  with different domains favoring different retrieval budgets. Figure 2(b) further
  shows that even when the selected memories remain unchanged, their presentation
  order affects task outcomes, consistent with order sensitivity observed in in-context
  learning (Lu et al., 2022).



  A6: Together, these observations suggest that constructing a useful memory context
  requires decisions beyond ranking memories by similarity. To address this problem,
  we introduce MemComposer, a memory composer that jointly examines the task query
  and retrieved candidates to select an ordered subset of variable size.


  We train the composer using Experience Policy Optimization (ExPO), a GRPO-based
  framework that evaluates assembled contexts through complete agent interactions.


  By learning to assemble useful memory combinations, MemComposer outperforms the
  strongest baseline for each agent while using fewer memory tokens per task: 26.9%
  fewer for Qwen3-4B-Instruct and 35.2% fewer for Ministral-3-8B-Instruct on retail,
  and 16.9% and 4.9% fewer, respectively, across all domains. Furthermore, the learned
  composer demonstrates strong transferability to unseen domains, executors, and memory
  banks.


  Notably, MemComposer continues to improve performance when supplied


  with memories generated by stronger models, without further training


  (Figure 6). This suggests that it learns a transferable


  ability to assess which memories are useful for downstream tasks.


  Our contributions are summarized as follows:


  •


  We propose MemComposer, a memory composer that jointly selects and orders a variable-size
  subset of retrieved experiences for a frozen LLM agent.


  •



  A7: We develop Experience Policy Optimization (ExPO), a GRPO-based training framework
  that evaluates assembled contexts through complete agent interactions and combines
  empirical task success with selection-size and format penalties.


  •


  Experiments on \tau^{2} -bench demonstrate improved task success and memory-token
  efficiency with two frozen executors, together with strong transferability across
  domains, executors, and memory sources.

  [S4] 2.1 Memory for LLM Agents (https://arxiv.org/html/2610.21091v2#S2.SS1)

  A8: Agent memory lets LLM agents reuse past experience as trajectories and


  insights (Zhao et al., 2024; Ouyang et al., 2025), workflows and


  skills (Wang et al., 2025; Wang et al., 2024a; Ouyang et al., 2026; Zhang et al.,
  2026a), or general-purpose stores


  (Packer et al., 2023; Chhikara et al., 2025; Xu et al., 2025), but memories are


  typically recalled by embedding similarity. Methods that learn memory


  recall or management from task outcomes (Zhang et al., 2026c; Zhou et al., 2025;
  Yan et al., 2026) score or operate on memories


  individually, whereas MemComposer decides the assembled context as a


  whole: which memories, how many, and in what order.

  [S5] 2.2 Learning Context Selection from Downstream Feedback (https://arxiv.org/html/2610.21091v2#S2.SS2)

  A9: Demonstration selection for in-context learning (Rubin et al., 2022; Li et al.,
  2023; Wang et al., 2024b; Ye et al., 2023; Liu et al., 2024; Zhang et al., 2022;
  Scarlatos and Lan, 2023) and passage reranking for retrieval-augmented generation
  (Zhuang et al., 2026; Zhang et al., 2025a; Jiang et al., 2025; Sun et al., 2026a;
  Sun et al., 2025) have been learned from downstream feedback, in some cases jointly
  choosing the subset and its order.


  These methods rely on cheap per-query signals such as gold-output likelihood, relevance
  labels, or the quality of a single answer. In our setting, candidates are agent
  trajectories with hindsight reviews, and a context is scored only after a multi-turn
  interaction with tools and a simulated user, yielding a sparse, stochastic reward
  that ExPO estimates over repeated executor trials.


  Due to space limits, we provide an extended discussion in Appendix A.

  [S6] 3 Method (https://arxiv.org/html/2610.21091v2#S3)

  A10: In this section, we first formulate memory assembly (§3.1), then describe how
  the experience memory is built (§3.2) and how MemComposer assembles it (§3.3). Finally,
  we introduce Experience Policy Optimization (ExPO), which trains MemComposer with
  task-outcome rewards (§3.4). Figure 3 gives an overview of our framework.

  [S7] 3.1 Problem Formulation (https://arxiv.org/html/2610.21091v2#S3.SS1)

  A11: Let \pi_{\theta} denote the composer policy and \pi_{e} the executor policy.


  Given a task query q , let \mathcal{M}(q)=\{m_{1},\dots,m_{n}\} be the top- n candidate
  memories returned by a similarity-based retriever from a memory bank \mathcal{B}
  (§3.2).


  The composer \pi_{\theta} samples an ordered subset S=(m_{i_{1}},\dots,m_{i_{k}})
  of distinct candidates, with 0\leq k\leq n , jointly deciding which memories to
  include and their order.


  Conditioned on (q,S) , the executor completes the task through multi-turn interaction
  with the environment, which returns a binary success reward r\in\{0,1\} .


  Let R(q,S) denote the executor’s expected success reward when


  using the memory sequence S for query q .


  We train the composer to maximize


  \max_{\theta}\;\mathbb{E}_{q\sim\mathcal{D}_{\mathrm{train}}}\mathbb{E}_{S\sim\pi_{\theta}(\cdot\mid
  q,\mathcal{M}(q))}\big[R(q,S)\big],


  (1)

  [S8] 3.2 Self-Generated Memory Bank (https://arxiv.org/html/2610.21091v2#S3.SS2)

  A12: For each domain and agent backbone, we collect N independent trajectories \tau
  per training task q\in\mathcal{D}_{\mathrm{train}} using the frozen executor \pi_{e}
  and record the outcome r=r(q,\tau) .


  The same model then produces a hindsight review v for each trajectory–outcome pair
  (\tau,r) , without modifying the original outcome r .


  We validate the reviews with deterministic consistency checks and curate the validated
  memory m=(\tau,r,v) into a memory bank \mathcal{B} , shared by all methods evaluated
  with the same domain and agent backbone.


  Appendix D provides the review prompts and scripts,


  validation and curation rules, parameter settings, and final


  memory bank sizes.

  [S9] 3.3 MemComposer (https://arxiv.org/html/2610.21091v2#S3.SS3)

  A13: Given a task query q , we retrieve the top- n candidate memories \mathcal{M}(q)
  from memory bank \mathcal{B} using a fixed similarity-based retriever.


  The composer \pi_{\theta} reads q and all candidate memories jointly to generate
  a memory sequence:


  S=(m_{i_{1}},\dots,m_{i_{k}})\sim\pi_{\theta}\big(\cdot\mid q,\mathcal{M}(q)\big).


  (2)


  For each task sample, both the length k and the ordering of S


  are dynamically determined by the composer, and are learned from the task outcomes
  using Experience Policy Optimization (§3.4).


  The implementation details for MemComposer are provided in Appendix E.

  [S10] 3.4 Experience Policy Optimization (https://arxiv.org/html/2610.21091v2#S3.SS4)

  A14: We introduce Experience Policy Optimization (ExPO) to optimize Eq. 1, training
  the composer from the downstream utility of the memory contexts it assembles.


  ExPO builds on Group Relative Policy Optimization (GRPO) (Shao et al., 2024), but
  evaluates each memory sequence through complete downstream task interactions and
  combines its empirical task success rate with penalties on selection size and output
  format.


  Because each sequence is executed with its memories in the order given, this reward
  shapes not only which memories are selected but also how they are ordered, without
  a separate ordering objective.

  [S11] Reward Design. (https://arxiv.org/html/2610.21091v2#S3.SS4.SSS0.Px1)

  A15: Following prior work (Jiang et al., 2025; Zhang et al., 2026c; Sun et al.,
  2026a), we use downstream task outcomes to assess the utility of assembled memory
  contexts.


  Since agentic execution is stochastic (Kapoor et al., 2025; Yao et al., 2024), a
  single rollout provides a noisy estimate of a memory sequence’s utility. We therefore
  evaluate each sampled sequence S_{g} over J trials with the frozen executor and
  define its task-outcome reward as the empirical success rate:


  r_{g}^{\mathrm{task}}=\frac{1}{J}\sum_{j=1}^{J}r_{g,j},


  (3)


  where r_{g,j}\in\{0,1\} is the outcome of trial j .


  We additionally apply a selection-size penalty p_{\mathrm{len}}(k_{g}) , where k_{g}=|S_{g}|
  , to discourage unnecessarily large memory contexts.


  The format penalty p_{\mathrm{fmt}}(S_{g}) is applied when the composer violates
  the required reasoning and answer structure.


  The resulting ExPO reward is


  r_{g}^{\mathrm{ExPO}}=r_{g}^{\mathrm{task}}-p_{\mathrm{len}}(k_{g})-p_{\mathrm{fmt}}(S_{g}).


  (4)


  This reward balances downstream task success, selection size, and output validity.


  Penalty details and coefficients are given in Appendix E.2.

  [S12] Policy Optimization. (https://arxiv.org/html/2610.21091v2#S3.SS4.SSS0.Px2)

  A16: For each task q with candidate set \mathcal{M}(q) , we sample a group of G
  memory contexts \{S_{g}\}_{g=1}^{G} from the current policy \pi_{\theta_{\mathrm{old}}}
  and obtain their ExPO rewards \{r_{g}^{\mathrm{ExPO}}\}_{g=1}^{G} using Eq. 4.


  Following DAPO (Yu et al., 2025), we discard groups whose task-outcome rewards (Eq.
  3) are all identical and continue sampling until the batch is filled.


  Filtering on task outcomes rather than on the full reward ensures that every retained
  group differs in task success, so that the selection-size and format penalties alone
  cannot make a group informative.


  For each retained group, the advantage of a context is its group-centered ExPO reward:


  A_{g}=r_{g}^{\mathrm{ExPO}}-\frac{1}{G}\sum_{h=1}^{G}r_{h}^{\mathrm{ExPO}}.


  (5)


  Following Liu et al. (2025), we do not normalize advantages by the group standard
  deviation, which would amplify reward noise in groups with nearly identical outcomes.


  ExPO optimizes the clipped surrogate objective of GRPO:


  \displaystyle\ell_{g,t}(\theta)=\min\Bigl\{


  \displaystyle\rho_{g,t}(\theta)A_{g},


  (6)


  \displaystyle\operatorname{clip}\bigl(\rho_{g,t}(\theta),1-\epsilon,1+\epsilon\bigr)A_{g}\Bigr\},



  A17: where \rho_{g,t}(\theta) is the token-level likelihood ratio between \pi_{\theta}
  and \pi_{\theta_{\mathrm{old}}} , conditioned on q , \mathcal{M}(q) , and the preceding
  output tokens, and \epsilon is the clipping threshold.


  The ExPO training loss aggregates the surrogate at the token level over all sequences
  in a batch:


  \mathcal{L}_{\mathrm{ExPO}}(\theta)=-\,\frac{1}{\sum_{g}T_{g}}\sum_{g}\sum_{t=1}^{T_{g}}\ell_{g,t}(\theta),


  (7)


  where T_{g} is the number of generated tokens in the composer output encoding S_{g}
  , and the sums run over all sequences of all groups in the batch.


  ExPO thus inherits the optimization machinery of GRPO, while its advantages are
  derived from the memory-assembly reward in Eq. 4. ExPO uses no KL penalty to a reference
  policy, and only MemComposer is updated; the executor, retriever, and memory bank
  remain fixed throughout training. Hyperparameters and other details are provided
  in Appendix E.3.


