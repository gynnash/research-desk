  [S67] MemComposer achieves the best result with fewer memory tokens. (https://arxiv.org/html/2610.21091v2#A9.SS1.SSS0.Px1)

  A98: Figure 7 plots pass1 against memory tokens per task, averaged over the three
  domains, for both executors.


  MemComposer lies above the baseline Pareto frontier in both panels: it uses 16.9%
  fewer memory tokens than the strongest baseline with Qwen3-4B-Instruct and 4.9%
  fewer with Ministral-3-8B-Instruct, while reaching higher pass1.


  Figure 8 zooms in on retail with Qwen3-4B-Instruct, where the gap is largest: MemComposer
  reaches 60.0 pass1 with 9.2K memory tokens per task, whereas similarity top-10 reaches
