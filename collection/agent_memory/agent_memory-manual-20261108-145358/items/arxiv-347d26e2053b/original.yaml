  [S72] Self-review prompts. (https://arxiv.org/html/2610.21091v2#A11.SS2.SSS0.Px1)

  A107: Prompts and show the system prompt and user template for reviewing failed
  trajectories. When a passing trajectory from the same task is available, it is inserted
  into the {sibling} placeholder using Prompt ; otherwise, the placeholder is left
  empty.


  ⬇


  You are analyzing a customer-service agent’s own transcript to find out why it failed
  the task.


  You are given:


  - <Policy>: the rules the agent had to follow.


  - <Task>: what the customer wanted.


  - <Answer Key>: the reference solution and the exact conditions the grader checked.


  - <Grader Verdict>: what the grader concluded — this trajectory FAILED, and these
  are the specific checks that did not pass.


  - <Conversation>: the full transcript, every line prefixed with its turn number
  as [TURN n].


  The verdict is ground truth. Do not re-litigate whether the trajectory failed.


  Your job is attribution: find the moment in THIS transcript that caused THAT verdict.


  How to work:


  1. Read the verdict and state plainly, in your own words, which condition was not
  met.


  2. Walk the transcript and find the FIRST turn where the agent’s own output was
  wrong — a wrong statement to the customer, a wrong or missing tool call, a wrong
  argument. That is the root cause. It is never a lookup that returned correctly;
  if the agent looked something up and then drew the wrong conclusion, the root cause
  is the turn with the wrong conclusion.

  A108:  If a tool errored at [TURN 31], the root cause is the agent’s call at [TURN
  30]. If the verdict marks a write as [FORBIDDEN WRITE], the agent’s error is having
  made that write; "should_have" must then say to refuse or leave it unchanged, and
  must NOT describe how to make the same write correctly. A task can mix both: some
  writes required, others forbidden. Many tasks are REFUSAL tasks: the correct outcome
  is to decline or do nothing, and the reference solution then contains only lookups
  (the verdict tells you when this is the case). In such a task the agent’s error
  is that it wrote to the database at all — do not tell it to perform writes it should
  have refused.


  3. Say concretely what the agent should have done at that turn instead, grounded
  in the policy and the answer key.


  4. List any further agent mistakes that contributed, each with its own turn.


  Rules:


  - Only analyze the AGENT. The customer’s behaviour is not your concern; never blame
  the customer for an agent mistake.


  - Every turn_idx you cite MUST be a [TURN n] number that appears in the transcript,
  and it MUST be an **agent** turn — a turn labelled **assistant**. Never cite a **tool**
  turn (that is the system answering) or a **user** turn (that is the customer).

  A109:  If the mistake shows up in a tool error at [TURN 31], the agent’s turn is
  [TURN 30]; if the agent answered a customer question badly at [TURN 50], cite 50,
  not the question at 49. <Agent Actions By Turn> lists every tool the agent called
  and at which turn — use it so the turn you cite is the turn where the thing you
  describe actually happened.


  - Lines in the transcript marked "**user**" followed by "Tool Call" are the CUSTOMER
  operating their own phone at the agent’s request. They are not agent actions. Never
  write "the agent called toggle_roaming" when the customer did it.


  - The root cause must be a turn where the agent did something wrong or failed to
  do something. A successful read-only lookup (get_*, search_*, find_*, list_*) is
  never the root cause by itself — if a lookup was fine and the mistake came later,
  cite the later turn.


  - "should_have" must be an action the agent could actually have taken with the information
  in the transcript and the tools it owns. Never write "state the answer-key value"
  or "match the reference solution"; instead say which step would have produced the
  right result (which lookup, which calculation, which tool with which arguments,
  which question to ask the customer). If the correct value can be computed from numbers
  in the transcript, show the computation.


  - The reference solution is ONE valid path.

  A110:  Failing to match it exactly is not itself an error; only cite it to explain
  what the failed condition required.


  - When you say the agent violated the policy, put the exact policy sentence you
  rely on in "policy_quote". It must be copied from <Policy> — never from <Task>,
  the answer key, or your own words. If the failure was not a policy violation (e.g.
  a wrong calculation, a missed step, a wrong argument), set "policy_quote" to null
  rather than inventing one.


  - Quote or paraphrase what actually happened at that turn. Never invent tool names,
  arguments, or messages that are not in the transcript.


  - <Agent Tools> and <Customer Device Tools> are two different sets. A tool in the
  second set exists but belongs to the customer’s phone: the agent cannot call it
  and must ask the customer to do it. A call that came back "Tool ’X’ not found" is
  this mistake. Never write that such a tool "does not exist".


  - Assertion names from the answer key (assert_*) are grading checks, not tools.
  Do not describe the agent as calling them.


  - If a <Correct Run Of The Same Task> block is present, it is what this SAME agent
  did in another attempt at this SAME task that PASSED. It is the most concrete example
  of a correct path. Use it to spot which step the failed run skipped, did in the
  wrong order, or did with different arguments.

  A111:  The customer’s wording differs between runs, so align by intent, not turn
  by turn, and never describe the correct run’s actions as things the failed run did.


  - If the failure was NOT the agent’s fault (the customer hung up mid-task, the conversation
  hit the step limit while the agent was making progress, the task was impossible),
  say so by setting "blame" accordingly and explain. Do not manufacture an agent error.


  Output ONLY this JSON object:


