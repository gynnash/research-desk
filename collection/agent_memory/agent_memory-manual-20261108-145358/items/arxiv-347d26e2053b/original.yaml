    title: Memory tokens.
    text: 'For the efficiency analysis, we measure the number of tokens in the memory
      block inserted into the agent’s prompt, counted with the agent’s own tokenizer
      and including the block’s fixed header of 172 tokens; a task without selected
      memories counts as zero.


      Values are averaged over the test tasks of each domain, and over the three domains
      weighted by their number of test trials.


