  - id: S55
    title: Appendix G Baseline Implementation Details
    text: This section describes the implementation and adaptation of all baselines.
      Every method draws from the same pool of retrieved candidates for each task
      (Appendix D), so that differences between methods are attributable to how memories
      are selected rather than to retrieval.
    location: https://arxiv.org/html/2610.21091v2#A7
  - id: S56
    title: Similarity-based selection.
    text: The k most similar of the top-10 retrieved candidates are provided to the
      agent, ordered from most to least similar. We sweep k\in\{1,2,3,5,7\} ; Table
      1 reports the best k\in\{1,3,5,7\} , and results for k are given in Appendix
      F.
    location: https://arxiv.org/html/2610.21091v2#A7.SS1.SSS0.Px1
  - id: S57
    title: Complexity-based selection.
    text: 'Inspired by complexity-based prompting (Fu et al., 2023), the top-10 candidates
      are reranked by the length of their rendered full form, measured in tokens,
      as a cheap proxy for how much procedural detail a trajectory carries, and the
      k longest are provided to the agent, longest first.


      Because the reranking is applied to the whole pool before truncation, for k<10
      this baseline selects a different set of memories than similarity-based selection,
      not merely a different order, making it a selection heuristic in its own right.


      At k=10 , both baselines provide the same memories and differ only in their
      order. We sweep the same values of k as above.'
    location: https://arxiv.org/html/2610.21091v2#A7.SS1.SSS0.Px2
  - id: S58
    title: Qwen3-Reranker-8B.
    text: 'We rerank the top-10 candidates with Qwen3-Reranker-8B (Zhang et al., 2025b),
      a cross-encoder that scores the relevance of each candidate to the query.


      The query is the user’s first message, and each document is the candidate’s
      digest—the same rendering our MemComposer reads, so the two methods see identical
      content and differ only in how they score it. Following the model’s recommended
      usage, the candidate is scored by the probability of “yes” at the final position,
      normalized over the {“yes”, “no”} pair alone rather than the full vocabulary,
      conditioned on a task instruction, the query and the document. The five highest-scoring
      candidates are given to the agent in descending order of score. The reranker
      is used off the shelf, without further training.'
    location: https://arxiv.org/html/2610.21091v2#A7.SS2.SSS0.Px1
  - id: S59
    title: MemRL.
    text: 'MemRL (Zhang et al., 2026c) combines a growing memory bank with a value-aware
      retrieval policy: each memory carries a scalar value Q that estimates how useful
      it has been, and retrieval proceeds in two phases, a similarity phase that proposes
      a broad candidate set followed by a value phase that keeps the highest- Q entries.


      Since our memory bank is fixed, we disable memory write-back and reimplement
      only the value-aware retrieval, the component comparable to our method.'
    location: https://arxiv.org/html/2610.21091v2#A7.SS3.SSS0.Px1
  - id: S60
    title: Memento.
    text: 'Memento (Zhou et al., 2025) replaces similarity retrieval with a learned
      case-selection policy: a scorer trained on the agent’s own episode outcomes
      predicts whether a stored case will help on a new query, and the highest-scoring
      cases are retrieved. We adapt the parametric variant from the authors’ released
      code. The scorer encodes the query and the case separately with SimCSE-RoBERTa-base,
      concatenates their [CLS] vectors (case first, as in the reference), and applies
      a two-layer head ( 2\times 768\rightarrow 512\rightarrow 2 , ReLU, dropout 0.2
      ) that predicts whether the case is helpful. At inference, the five candidates
      with the highest predicted probability of being helpful are selected from the
      same top-10 pool that every other method receives and provided in descending
      order of that probability. Each case is represented by its digest, so the scorer
      reads the same rendering as our composer.


      Training data. The reference implementation accumulates training examples online
      as the agent runs. Since our memory bank is fixed, we collect the equivalent
      signal offline from logged episodes: each example is a (query, case, outcome)
      triple for a case that was in the agent’s context during an episode.


      We use only episodes on training tasks and exclude all episodes on test tasks.


      Repeated (query, case) pairs are merged by summing their successes and trials,
      and each merged pair is weighted by its trial count in the loss, which is equivalent
      to one hard-labeled example per episode at a fraction of the cost. This yields
      797–3,908 unique pairs per agent–domain cell, drawn from 1.2K–233K (episode,
      case) observations. In some cells, this is more supervision than the original
      online procedure would accumulate over the same tasks, so the comparison, if
      anything, favors Memento.


      Optimization. We follow the released hyperparameters: AdamW with learning rate
      2\times 10^{-5} , weight decay 0.01 (excluding biases and LayerNorm), a linear
      schedule with 6% warmup, gradient clipping at 1.0, batch size 32, three epochs,
      and the reference’s default class reweighting w_{+}=\max(1,n_{-}/n_{+}) , which
      ranges from 1.00 to 1.80 across cells. We make two departures: we use a maximum
      sequence length of 512 instead of 256, since 256 truncates 30–60% of our digests,
      and we split training and validation data by query rather than by example, so
      that no query appears in both.'
    location: https://arxiv.org/html/2610.21091v2#A7.SS3.SSS0.Px2
  - id: S61
    title: Benchmark and splits.
    text: 'We evaluate on the retail, airline, and telecom domains of \tau^{2} -bench
      (Barrès et al., 2025), using the official train/test split of each domain. Memory
      banks are built only from training tasks (Appendix D), and all results are reported
      on the test tasks: 40 tasks for retail, 20 for airline, and 40 for telecom (Table
      12).'
    location: https://arxiv.org/html/2610.21091v2#A8.SS0.SSS0.Px1
  - id: S62
    title: Agents and user simulator.
    text: The agent is either Qwen3-4B-Instruct-2507 (referred to as Qwen3-4B-Instruct
      in the main text) or Ministral-3-8B-Instruct, used without any parameter updates
      and decoded with temperature 0. We serve Qwen3-4B-Instruct locally with vLLM
      and access Ministral-3-8B-Instruct through the AWS Bedrock API. The user is
      simulated by GLM-4.7 with temperature 0 for all methods, including memory construction,
      composer training, and evaluation, so that every method interacts with the same
      user. Each episode ends when the task is completed, the user ends the conversation,
      or the agent reaches 50 steps. The selected memories are inserted into the agent’s
      system prompt in the order produced by the selection method (Appendix K).
    location: https://arxiv.org/html/2610.21091v2#A8.SS0.SSS0.Px2
  - id: S63
    title: Selection at test time.
    text: For every method that selects from the retrieved candidates, the selection
      is made once per test task and reused across all trials of that task, so that
      differences between trials reflect the interaction rather than the selected
      candidates. MemComposer and the vanilla selector decode their selections greedily.
    location: https://arxiv.org/html/2610.21091v2#A8.SS0.SSS0.Px3
  - id: S64
    title: Trials and metrics.
    text: 'Apart from the choice of user simulator, we follow the official \tau^{2}
      -bench evaluation protocol: each test task is run for four trials with the official
      seeds, and performance is measured by passk, the metric introduced in \tau -bench
      (Yao et al., 2024) and adopted by \tau^{2} -bench, which is the probability
      that the agent succeeds in all k of k independent trials of a task.


      Following the official implementation, for a task with c successes out of four
      trials, passk is estimated as \binom{c}{k}/\binom{4}{k} and averaged over tasks;
      pass1 thus equals the average success rate, and pass4 the fraction of tasks
      solved in all four trials. When averaging across domains, we take the unweighted
      mean of the three domains.'
    location: https://arxiv.org/html/2610.21091v2#A8.SS0.SSS0.Px4
