  - id: S36
    title: Discussion.
    text: 'Pooled over both executors (Table 6), the gap to every baseline excludes
      zero on pass1, and on pass4 for all baselines except Complexity and Memento.


      Within a single executor (Table 5), all 28 gaps are positive, but the intervals
      are roughly 1.5 times wider: on pass1, each executor’s gap excludes zero for
      four of the seven baselines (no memory, similarity, the reranker, and the vanilla
      selector) and includes zero for Complexity, MemRL, and Memento, including the
      strongest baseline for each executor (Memento, +5.9, for Qwen3-4B-Instruct;
      MemRL, +4.6, for Ministral-3-8B-Instruct).


      We therefore read Table 1 as showing a consistent advantage whose magnitude
      against the strongest individual baseline is not resolved by the official test
      splits, rather than a decisive per-executor win.


      Two aspects of the comparison do not depend on this uncertainty.


      First, MemComposer is the best or tied-best method in 10 of the 12 domain-level
      comparisons (Table 1).


      Second, the memory-token cost of each method is determined by its selections
      and is not subject to trial randomness: MemComposer reaches its performance
      with 16.9% fewer memory tokens than the strongest baseline for Qwen3-4B-Instruct
      and 4.9% fewer for Ministral-3-8B-Instruct (Appendix I.1).


      Even where the performance gap is within its interval, MemComposer thus matches
      the strongest baseline at lower cost.'
