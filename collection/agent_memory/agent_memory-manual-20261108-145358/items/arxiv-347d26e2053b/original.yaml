  Memory-token counts are determined by each method’s selections and are not subject
  to trial randomness (Appendix B).

  [S68] I.2 Domain Variation and Transfer (https://arxiv.org/html/2610.21091v2#A9.SS2)

  A99: The three \tau^{2} -bench domains involve different tools, policies, and task
  requirements, leading to different patterns of memory use. Their memory banks contain
  different distributions of successful and failed experiences, and each domain exhibits
  different sensitivity to the number and ordering of retrieved memories. These differences
  make cross-domain transfer meaningful, as the composer must identify useful experiences
  under varying task requirements and memory distributions rather than relying on
  a fixed selection strategy. Despite these differences, the composer trained only
  on Retail achieves performance comparable to in-domain training on Airline and Telecom,
  suggesting that it learns memory assembly strategies that transfer across different
  procedural tasks.

