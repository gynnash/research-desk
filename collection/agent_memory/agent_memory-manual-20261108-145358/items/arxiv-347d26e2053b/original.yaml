      quantify the uncertainty of the gaps reported in Table 1.


      For every baseline we compute the gap \Delta=\text{{MemComposer}{}}-\text{baseline}
      in pass1 and pass4 and estimate a 95% confidence interval by paired bootstrap
      over test tasks: in each of 10,000 resamples, we draw tasks with replacement
      within each domain, recompute the gap from each task’s outcomes under both methods,
      take the equal-weight macro average over domains as in Table 1, and report the
      2.5th and 97.5th percentiles.


      Table 5 reports this interval separately for each executor.


      Table 6 pools both executors; a resampled task then contributes its outcomes
      under both executors, so the two are never treated as independent samples.


      No correction for multiple comparisons is applied, so intervals that barely
