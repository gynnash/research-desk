  - id: S13
    title: 4.1 Datasets and Evaluation Metrics
    text: 'We evaluate on \tau^{2} -bench (Barrès et al., 2025), a benchmark of multi-turn
      customer-service tasks in which an agent must follow a domain policy, call tools,
      and interact with a simulated user. We use the retail, airline, and telecom
      domains, and the user is simulated by GLM-4.7 (Team et al., 2025) for all methods.


      Following prior work (Yao et al., 2024), we run each test task for four trials
      and report pass1, the average success rate, as the primary metric, and pass4,
      the fraction of tasks solved in all four trials, to assess reliability. Averages
      are taken over the three domains with equal weight. Further details are provided
      in Appendix H.'
    location: https://arxiv.org/html/2610.21091v2#S4.SS1
  - id: S14
    title: 4.2 Baselines
    text: For each agent backbone, all methods use the same frozen executor, user
      simulator, and memory bank constructed from that agent’s rollouts, and select
      from the same top-10 candidates. We compare against the following baselines.
    location: https://arxiv.org/html/2610.21091v2#S4.SS2
  - id: S15
    title: No memory.
    text: The executor solves each task without retrieved memories.
    location: https://arxiv.org/html/2610.21091v2#S4.SS2.SSS0.Px1
  - id: S16
    title: Heuristic selection.
    text: 'Similarity-based selection provides the k candidates whose first user messages
      are most similar to the current one under Qwen3-Embedding-8B (Zhang et al.,
      2025b), ordered from most to least similar.


      Complexity-based selection, inspired by complexity-based prompting (Fu et al.,
      2023), provides the k candidates with the longest trajectories, ordered from
      longest to shortest.


      For both, we report the best k\in\{1,3,5,7\} on the test set.


      Results for all k are given in Appendix F.'
    location: https://arxiv.org/html/2610.21091v2#S4.SS2.SSS0.Px2
  - id: S17
    title: Model-based selection.
    text: The vanilla selector applies our selection prompt to the agent backbone
      without training. The pre-trained reranker reranks the candidates with Qwen3-Reranker-8B
      and provides the top five.
    location: https://arxiv.org/html/2610.21091v2#S4.SS2.SSS0.Px3
  - id: S18
    title: RL-based memory methods.
    text: 'We compare MemComposer with two RL-based methods, MemRL (Zhang et al.,
      2026c) and Memento (Zhou et al., 2025), which learn the utility of memories
      from task outcomes.


      Implementation details are given in Appendix G.'
    location: https://arxiv.org/html/2610.21091v2#S4.SS2.SSS0.Px4
  - id: S19
    title: 4.3 Main Results
    text: 'Table 1 shows that MemComposer achieves the highest average pass1 and pass4
      with both executor backbones, and is the best or tied-best method in 10 of the
      12 domain-level comparisons.


      On Qwen3-4B-Instruct, it reaches 50.8 average pass1 and 32.5 pass4, outperforming
      the strongest baseline on each metric by 5.9 and 5.0 points, respectively.


      On Ministral-3-8B-Instruct, it achieves 4.6 points above the strongest baseline
      with a pass1 of 63.5, and slightly above the best baseline with a pass4 of 40.0.
      Notably, no baseline is consistently competitive: Memento is the strongest baseline
      with Qwen3-4B-Instruct but trails with Ministral-3-8B-Instruct, while MemRL
      is the strongest with Ministral-3-8B-Instruct but reaches only 17.5 average
      pass4 with Qwen3-4B-Instruct, close to the 14.2 of the no-memory agent.


      Pooled over both executors, the gap to every baseline is significant at the
      95% level on pass1, and on pass4 for all baselines except Complexity and Memento
      (paired bootstrap over test tasks; Appendix B).


      Beyond \tau^{2} -bench, MemComposer also achieves the highest overall success
      rate on ALFWorld (Shridhar et al., 2021) with Ministral-3-8B-Instruct, at 82.0%
      compared with 79.7% for the strongest baseline (Appendix C).


      Finally, MemComposer reaches this performance with fewer memory tokens than
      the strongest baseline, 16.9% fewer with Qwen3-4B-Instruct and 4.9% fewer with
      Ministral-3-8B-Instruct (Appendix I.1).'
    location: https://arxiv.org/html/2610.21091v2#S4.SS3
  - id: S20
    title: 5.1 How Does Training Change Experience Selection?
    text: 'We find that training changes selection in three ways: MemComposer chooses
      more experiences from deeper in the ranking, shows a weaker preference for historically
      successful experiences, and learns to order the selected experiences more effectively
      than fixed rules.


      The first two analyses compare the vanilla selector with MemComposer on the
      same 40 retail tasks and top-10 candidate pools with Qwen3-4B-Instruct as the
      executor; the ordering analysis uses Ministral-3-8B-Instruct on all test tasks.'
    location: https://arxiv.org/html/2610.21091v2#S5.SS1
  - id: S21
    title: Training makes MemComposer choose more, and deeper.
    text: 'Figure 4:


      Lower-ranked candidates account for a larger share of selections after training.
      Dashed lines indicate the mean rank of selected memories.


      Training increases the average selection size from 2.52 to 3.73 experiences
      compared to the vanilla selector. After training, MemComposer also chooses more
      experiences from farther down the retrieval ranking (Figure 4), and the mean
      similarity rank of all selected experiences rises from 3.21 to 4.35. The learned
      policy draws more broadly from the candidate pool, consistent with our intuition
      that useful memory contexts may include guidance beyond the closest matches.'
    location: https://arxiv.org/html/2610.21091v2#S5.SS1.SSS0.Px1
  - id: S22
    title: Training weakens the preference for successful experiences.
    text: 'Figure 5:


      Training weakens the preference for successful experiences.


      Fraction of candidates selected within each rank band, for the (a) untrained
      and (b) trained selectors on retail.


      Before training, successful experiences are selected more often than failed
      or fake-pass in every rank band, most clearly at ranks 4–6 (32% vs. 10%; Figure
      5). After training, this gap narrows to 6 points at ranks 4–6, reverses at ranks
      1–3, and vanishes at ranks 7–10; overall, the share of successful experiences
      among selections falls from 45.5% to 35.6%.


      This shift follows from the training objective: MemComposer is rewarded for
      the assembled context’s effect on the current task, not for the memories’ past
      outcomes, and a failed memory can still be instructive. For example, a memory
      that miscalculated a price difference nonetheless demonstrates the exchange
      operation the new task requires, raising success from 0/4 to 4/4 trials compared
      with no memory (see Table 14 for details).'
    location: https://arxiv.org/html/2610.21091v2#S5.SS1.SSS0.Px2
