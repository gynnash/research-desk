      Ministral-3-8B-Instruct composer.


      We use verl (Sheng et al., 2025) for training, and the hyperparameters used
      for both models are provided in tables 9 and 10, respectively. We train for
      30 policy updates and evaluate the final checkpoint.'
    location: https://arxiv.org/html/2610.21091v2#A5.SS3.SSS0.Px2
  - id: S53
    title: Training cost.
    text: 'We train each composer for 30 policy updates on NVIDIA H100 80GB GPUs,
      and report GPU-hours summed over all GPUs used by a run.


      For Qwen3-4B-Instruct, one GPU runs composer training and sampling, and five
      (retail, airline) or seven (telecom) GPUs serve the executor with vLLM, for
      a total of 24.2, 16.3, and 81.7 GPU-hours on retail, airline, and telecom.


      For Ministral-3-8B-Instruct, two GPUs run the composer and the executor is accessed
      through the AWS Bedrock API, for a total of 7.1, 16.2, and 24.9 GPU-hours on
      the same domains.


      The user simulator is accessed through an API in all runs, so these figures
      count local compute only.


      Most of the cost is environment simulation rather than learning: rollout generation
      and simulation take 69–91% of the wall-clock time per training step, while updating
      a LoRA-adapted 4B or 8B model is inexpensive.


      telecom is the most expensive domain in both settings because its conversations
      are the longest.


      The Ministral airline run costs more than retail despite its smaller task pool
      because identical sequences within a group are rarer, so fewer trials can be
      shared.'
