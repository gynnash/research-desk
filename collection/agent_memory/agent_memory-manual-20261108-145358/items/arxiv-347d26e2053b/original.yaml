  This section describes how the memory bank used by MemComposer and all baselines
  is constructed. The same procedure is applied to every agent. For each agent, the
  memory bank is built only from that agent’s own rollouts on the training split,
  so no test task contributes to memory. Table 8 summarizes the resulting memory banks.

  [S39] Rollout collection. (https://arxiv.org/html/2610.21091v2#A4.SS0.SSS0.Px1)

  A66: For each training task in a domain, the frozen agent performs N=8 independent
  rollouts against the user simulator (GLM-4.7), following the standard \tau^{2} -bench
  protocol. Each rollout is scored by the environment’s outcome reward, which indicates
  whether the final database state and the agent’s communicated information satisfy
  the task requirements. We observed no simulator or environment failures during collection,
  so every rollout is passed to the review stage.

  [S40] Self-review & Pass-audit. (https://arxiv.org/html/2610.21091v2#A4.SS0.SSS0.Px2)

  A67: Each rollout is then reviewed in hindsight by the same model that produced
  it. Because reviews are written only for training tasks, the reviewer is given the
  task outcome, the evaluator’s feedback, and the reference solution.


  For a failed rollout, the reviewer identifies the first agent turn at which the
  trajectory went wrong and states what the agent should have done instead; when another
  rollout of the same task succeeded, it is shown as a


  contrastive example. For a successful rollout, the reviewer checks whether the agent
  made critical errors along the way, such as giving the user false information or
  claiming an action it never performed. The outcome reward itself is never changed:
  a successful rollout in which the reviewer finds a critical error is labeled fake
  pass, while other successful rollouts are labeled clean pass, and failed rollouts
  are labeled failure. The label and the review are stored alongside the trajectory.
  Prompts are provided in Appendix K.

  [S41] Consistency Check. (https://arxiv.org/html/2610.21091v2#A4.SS0.SSS0.Px3)

  A68: Each review is validated by deterministic consistency checks before it is stored.
  A review must cite a turn that exists in the trajectory and is produced by the agent,
  its claimed outcome must match the environment’s reward, and its output must follow
  the required format. Reviews that fail any check are discarded together with their
  rollout.

  [S42] Curation. (https://arxiv.org/html/2610.21091v2#A4.SS0.SSS0.Px4)

  A69: To keep the memory compact and balanced, we retain at most two entries per
  training task: one clean or fake pass and one failure when both exist, and otherwise
  two rollouts with the same outcome chosen at random.

  [S43] Representation. (https://arxiv.org/html/2610.21091v2#A4.SS0.SSS0.Px5)

  A70: A full trajectory with its review averages 2.3K–3.0K tokens, so ten candidates
  would not fit comfortably in a selector’s context. We therefore render each entry
  in two forms. The digest (Memory ), shown to MemComposer and the other model-based
  selectors, contains the user’s first message, the outcome label, a short summary
  of the agent’s key actions, and the review, and averages 1.0K–1.4K tokens. The full
  form (Memory ), provided to the agent once an entry is selected, contains the complete
  trajectory followed by the review.

  [S44] Retrieval. (https://arxiv.org/html/2610.21091v2#A4.SS0.SSS0.Px6)

  A71: Entries are indexed by the user’s first message, the only task information
  available to the agent at the start of an episode, and embedded with Qwen3-Embedding-8B
  (Zhang et al., 2025b). For each task, the n=10 entries with the highest cosine similarity
  form the candidate pool shared by all methods. During training, entries originating
  from the same training task are excluded from its candidates.

  [S45] E.1 Input and Output Format (https://arxiv.org/html/2610.21091v2#A5.SS1)

  A72: As illustrated in Example ,


  MemComposer receives task instructions, ten retrieved memory digests, the user’s
  opening request,


  and output-format instructions. Candidates are numbered [1]–[10] in retrieval order,
  and each digest summarizes a past interaction, its outcome, and its hindsight review.
  The input and reasoning are abbreviated for readability and the full prompt template
  is provided in Appendix K.


  ⬇


  You are the memory selector for the retail agent.


  …


  Return the selected case indices in descending order of usefulness. If no retrieved
  case provides useful transferable guidance, return an empty list.


  Retrieved cases:


  [1]: Task: You want to exchange the water bottle and the desk lamp …


  KIND: failure_attribution


  FAILED CONDITION: The agent performed an exchange with wrong item IDs …


  SUMMARY: …


  Chat History: …


  ROOT CAUSE: …


  SHOULD HAVE: …


  [2]: …


  …


  [10]: …


  Query:


  Hi, I’d like to exchange a water bottle and a desk lamp from a recent order.


  First, inside <reasoning> </reasoning>, briefly reason about which cases you keep
  and why. Then output a JSON list of case numbers inside <answer> </answer>.


  The composer outputs reasoning followed by an ordered list of distinct candidate
  indices, dynamically determining both the selection size and presentation order.

  A73:  In Example , it selects four memories, which the executor receives in the
  order 1\rightarrow 6\rightarrow 5\rightarrow 8 . An empty list specifies execution
  without memory.


  ⬇


  <reasoning>


  The query involves exchanging a water bottle and a desk lamp …


  </reasoning>


  <answer>[1, 6, 5, 8]</answer>

  [S46] E.2 Reward Design Details (https://arxiv.org/html/2610.21091v2#A5.SS2)

  A74: This subsection specifies how the ExPO reward in Eq. 4 is computed.

  [S47] Task-outcome reward. (https://arxiv.org/html/2610.21091v2#A5.SS2.SSS0.Px1)

  A75: Each valid memory sequence is evaluated over J=8 trials with the frozen executor.
  The task, selected memories, and presentation order remain fixed, and trials differ
  only in their benchmark seeds. We average the binary success labels to obtain r_{g}^{\mathrm{task}}
  .


  Trials that fail because of infrastructure errors, such as API failures, are resampled,
  so every sequence is evaluated over J=8 completed trials. When several sequences
  in a group select the same memories in the same order, their trials are shared.

  [S48] Format penalty. (https://arxiv.org/html/2610.21091v2#A5.SS2.SSS0.Px2)

  A76: The composer is expected to produce a reasoning section and a list of candidate
  indices within the answer section (Example ).


  An output is invalid if it lacks a closed answer section, contains no list in that
  section, or includes an index outside \{1,\ldots,n\} .


  Invalid outputs are not passed to the executor and receive a final reward of zero.


  Repeated indices are de-duplicated, keeping their first occurrence, and an empty
  list is valid and specifies execution without memory. For valid outputs, a missing
  reasoning section incurs a penalty of \lambda_{\mathrm{fmt}}=0.05 , regardless of
  the task outcome.

  [S49] Selection-size penalty. (https://arxiv.org/html/2610.21091v2#A5.SS2.SSS0.Px3)

  A77: We apply a penalty only when the selection size k_{g}=|S_{g}| exceeds a free
  allowance K_{\max} :


  p_{\mathrm{len}}(k_{g})=\lambda_{\mathrm{len}}\max(0,k_{g}-K_{\max}).


  (8)


  For telecom, we use \lambda_{\mathrm{len}}=0.02 and K_{\max}=7 to discourage the
  excessive selection sizes observed in preliminary runs. For retail and airline,
  we set \lambda_{\mathrm{len}}=0.01 and K_{\max}=0 .


  The penalty is computed for every valid output, independently of its task outcome,
  and measures memory count rather than token length. With n=10 , the size penalty
  is at most 0.1 , below the task-reward increment of 1/8=0.125 . It therefore never
  reverses the ranking of sequences with different task outcomes and only favors smaller
  selections among sequences with equal task outcomes and format penalties.

  [S50] Dynamic sampling. (https://arxiv.org/html/2610.21091v2#A5.SS2.SSS0.Px4)

  A78: Groups are retained only if their task-outcome rewards are not all identical
  (§3.4). Differences in the format and size penalties alone therefore never cause
  a group to be retained. Advantages are then computed from the final rewards as in
  Eq. 5. Further training settings are given in Appendix E.3.

  [S51] Training data. (https://arxiv.org/html/2610.21091v2#A5.SS3.SSS0.Px1)

  A79: Training uses the official train split of each domain. Since the agent’s first
  message in \tau^{2} -bench is a fixed greeting, we sample four customer openings
  per task directly from the user simulator (GLM-4.7, temperature 1.0), which serve
  as four query variants of the same task. Each opening is embedded with Qwen3-Embedding-8B
  and used to retrieve memories by cosine similarity, excluding all memories from
  the query’s own task and keeping at most two memories per source task. The top 20
  candidates are split into two windows of ten, except for Ministral telecom and airline,
  which use the top 10 only, and the candidates in each window are renumbered from
  1 to 10, so that the selector cannot tell which window it sees and must judge candidates
  by their content. Each training example pairs one opening with one window. The data
  carry no labels of which memories are useful: the reward is obtained by running
  the agent in simulation. Test examples are built with the same pipeline, except
  that each test task uses a single fixed opening and only the top-10 candidates.

