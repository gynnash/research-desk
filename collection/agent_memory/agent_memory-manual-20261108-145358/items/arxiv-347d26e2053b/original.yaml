      \Delta : mean difference in successful trials over 100 tasks; \Delta pass {}^{1}=25\Delta
      points. Positive values favor the composer.


      To isolate the effect of ordering, we keep the memories selected by MemComposer
      for each task fixed and reorder them by one of four rules: similarity, reverse
      similarity, length descending, or length ascending.


      As Table 2 shows, the composer’s order outperforms every rule by 3.8 to 8.5
      points and 6.1 on average in pass1; since the memory set is identical, the gain
      comes solely from order.


      Case 3 in Appendix J gives an example: the same five memories yield 4/4 successes
      under the composer’s order and 0/4 under similarity order. Assembling a useful
      memory context therefore requires deciding not only which memories to include
      but how to present them.


