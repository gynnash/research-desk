  - id: S67
    title: MemComposer achieves the best result with fewer memory tokens.
    text: 'Figure 7 plots pass1 against memory tokens per task, averaged over the
      three domains, for both executors.


      MemComposer lies above the baseline Pareto frontier in both panels: it uses
      16.9% fewer memory tokens than the strongest baseline with Qwen3-4B-Instruct
      and 4.9% fewer with Ministral-3-8B-Instruct, while reaching higher pass1.


      Figure 8 zooms in on retail with Qwen3-4B-Instruct, where the gap is largest:
      MemComposer reaches 60.0 pass1 with 9.2K memory tokens per task, whereas similarity
      top-10 reaches 57.5 with 24.3K, so it performs better with 38% of the memory;
      within its 9.2K-token budget no baseline exceeds 51.2 pass1, and the reranker,
      MemRL, and Memento all score lower while using more tokens.


      Memory-token counts are determined by each method’s selections and are not subject
      to trial randomness (Appendix B).'
    location: https://arxiv.org/html/2610.21091v2#A9.SS1.SSS0.Px1
  - id: S68
    title: I.2 Domain Variation and Transfer
    text: The three \tau^{2} -bench domains involve different tools, policies, and
      task requirements, leading to different patterns of memory use. Their memory
      banks contain different distributions of successful and failed experiences,
      and each domain exhibits different sensitivity to the number and ordering of
      retrieved memories. These differences make cross-domain transfer meaningful,
      as the composer must identify useful experiences under varying task requirements
      and memory distributions rather than relying on a fixed selection strategy.
      Despite these differences, the composer trained only on Retail achieves performance
      comparable to in-domain training on Airline and Telecom, suggesting that it
      learns memory assembly strategies that transfer across different procedural
      tasks.
    location: https://arxiv.org/html/2610.21091v2#A9.SS2
  - id: S69
    title: Appendix J Case Studies
    text: 'We present three cases that illustrate how memory selection and ordering


      affect the executor.


      •


      Complementary memories (Table 13):


      on an airline task, two memories from the same training task each


      cover a different constraint of the current request.


      •


      A failed memory with a reusable action


      (Table 14): on a retail task, a memory that


      failed on price communication still contains the exchange operation


      the current task requires.


      •


      Same memories, different order


      (Table 15): on a retail task, the same five memories lead to different outcomes
      when presented in different order.


      Case Study 1: Complementary Memories for a Delayed-Flight Complaint


      Query


      My flight HAT039 from Atlanta to Seattle is delayed


      and I’m extremely upset. I want the airline to


      compensate me—but I do not want to cancel or


      change my reservation.


      Policy


      If the user complains about delayed flights and


      wants to change or cancel the reservation, the agent


      can offer a certificate after confirming the facts


      and changing or cancelling the reservation.


      Do not offer compensation for any other reason.


      Expected behavior


      Confirm the delay and explain the compensation policy.


      1. Do not cancel or modify the reservation,


      as the customer explicitly rejects these actions.


      2. Do not offer a certificate,


      as there is no qualifying change or cancellation.


      Memory 1


      Memory 2


      Explanation.


      The two memories provide complementary guidance.


      The first warns against an inappropriate cancellation


      and emphasizes leaving the reservation unchanged.


      The second warns against offering compensation


      without a valid policy trigger.


      Together, they address both constraints of the current task:


      respect the customer’s request not to change the booking,


      and explain why a certificate cannot be offered.


      Combining these lessons supports a response that


      satisfies both the customer’s intent and the domain policy.


      Table 13: An airline case illustrating complementary


      guidance from two trajectory memories.


      Case Study 2: A Failed Memory for a Successful Laptop Exchange


      Query


      Hi, I’m Lei Wilson. I received a laptop recently,


      but I need to exchange it for a different model.


      I’m looking for one with an i7 processor,


      8GB RAM, and a 1TB SSD.


      Policy


      For a delivered order, each item can be exchanged


      for an available item of the same product with


      different options. The user must provide a payment


      method for the price difference, and the agent must


      obtain explicit confirmation before acting.


      Expected behavior


      Exchange item 3478699712 in order


      #W2905754 for item 9844888101


      (i7, 8GB RAM, 1TB SSD), using the credit card on file


      and obtaining explicit confirmation before acting.


      This test task does not evaluate the agent’s


      statements about prices.


      Result.


      On the same test task, the executor succeeds


      in 0/4 trials without memory and


      4/4 trials with this failed memory alone. In the official


      \tau^{2} -bench split, training and test tasks can involve the same customer


      and order; this memory comes from such a training task and therefore


      contains an exchange call that applies directly to the test task. All


      methods draw from the same candidate pool, so this overlap is available to


      every method.


      Explanation.


      The memory fails on price communication,


      but its exchange call performs the operation


      required by the current task.


      The historical failure and the reusable action


      therefore concern different parts of the trajectory.


      This illustrates why MemComposer learns from


      the current task outcomes of assembled contexts,


      rather than the memories’ historical outcomes.


      Table 14:


      A failed memory contains the correct exchange


      action for a related task involving the same customer.


      Content is abbreviated; starred boxes highlight


      the historical error and the reusable action.


      Case Study 3: Memory Ordering Affects Agent Performance


      Query


      Hi, I need to exchnge a robotic vacuum cleaner from my recent order for a canister
      based one from the same product line.


      Policy


      For a delivered order, each item can be exchanged for an available item of the
      same product with different options. The user must provide a payment method
      for the price difference, and the agent must obtain explicit confirmation before
      acting.


      Expected behavior


      Present the available canister models and confirm the customer’s choice of the
      bagless version.


      Exchange the robotic vacuum cleaner (6259501109) in order #W9502127 for the
      bagless canister model (7958300294).


      Tell the customer that the price difference is $9.89, refund it to the original
      PayPal account (paypal_2433177), and obtain explicit confirmation before performing
      the exchange.


      MemComposer


      [8] \rightarrow [1] \rightarrow [7] \rightarrow [3] \rightarrow [6]


      Similarity-based


      [1] \rightarrow [3] \rightarrow [6] \rightarrow [7] \rightarrow [8]


      Outcome


      With the same five memories, the executor succeeds


      in 4/4 trials with MemComposer’s ordering


      and 0/4 trials with similarity ordering.


      Explanation


      A possible explanation is a positional attention effect.


      The executor may give greater attention to the key


      memories [1] and [8] when they appear early in


      MemComposer’s ordering.


      Under similarity ordering, memory [8] appears last


      and its guidance may be overlooked, contributing


      to the incorrect exchange.


      Table 15: Same five memories, different order. A retail case where the executor
      succeeds in 4/4 trials under MemComposer’s ordering and 0/4 under similarity
      ordering. Starred memories are the two the executor acts on.'
    location: https://arxiv.org/html/2610.21091v2#A10
  - id: S70
    title: Appendix K Prompts
    text: This section provides prompts used for MemComposer and memory bank construction.
    location: https://arxiv.org/html/2610.21091v2#A11
  - id: S71
    title: K.1 MemComposer Prompts
    text: 'The MemComposer receives the customer’s opening request and ten retrieved
      candidate memories in a single user message. We show the retail template below;
      the domain name is changed accordingly for airline and telecom.


      ⬇


      You are the memory selector for the retail agent.


      You are given the customer’s opening request and a set of retrieved cases from
      past conversations in the same domain, numbered [1], [2], and so on.


      Your task is to select and rank the cases that are useful for helping the agent
      act correctly in the new conversation.


      The concrete entities, wording, or itinerary in a past case may differ from
      the current request. Focus on whether the underlying lesson transfers.


      Each case includes its subsequent grading or outcome. Use this feedback to distinguish
      useful successful behavior from mistakes that should not be repeated. A negatively
      graded case can still be useful if it clearly demonstrates a relevant failure
      mode.


      Select only cases that provide meaningful additional guidance for the current
      request. Stop once additional cases would not materially improve the agent’s
      decision.


      Return the selected case indices in descending order of usefulness.


      If no retrieved case provides useful transferable guidance, return an empty
      list.


      Retrieved cases:


      [1]: {case 1}


      [2]: {case 2}


      …


      [10]: {case 10}


      Query:


      {customer’s opening request}


      First, inside <reasoning> </reasoning>, briefly reason about which cases you
      keep and why. Keep it to two or three sentences; do not walk through the cases
      one by one.


      Then output only a JSON list of case numbers inside <answer> </answer>, e.g.
      <answer>[…]</answer>. Output nothing after that.'
    location: https://arxiv.org/html/2610.21091v2#A11.SS1
  - id: S72
    title: Self-review prompts.
    text: 'Prompts and show the system prompt and user template for reviewing failed
      trajectories. When a passing trajectory from the same task is available, it
      is inserted into the {sibling} placeholder using Prompt ; otherwise, the placeholder
      is left empty.


      ⬇


      You are analyzing a customer-service agent’s own transcript to find out why
      it failed the task.


      You are given:


      - <Policy>: the rules the agent had to follow.


      - <Task>: what the customer wanted.


      - <Answer Key>: the reference solution and the exact conditions the grader checked.


      - <Grader Verdict>: what the grader concluded — this trajectory FAILED, and
      these are the specific checks that did not pass.


      - <Conversation>: the full transcript, every line prefixed with its turn number
      as [TURN n].


      The verdict is ground truth. Do not re-litigate whether the trajectory failed.


      Your job is attribution: find the moment in THIS transcript that caused THAT
      verdict.


      How to work:


      1. Read the verdict and state plainly, in your own words, which condition was
      not met.


      2. Walk the transcript and find the FIRST turn where the agent’s own output
      was wrong — a wrong statement to the customer, a wrong or missing tool call,
      a wrong argument. That is the root cause. It is never a lookup that returned
      correctly; if the agent looked something up and then drew the wrong conclusion,
      the root cause is the turn with the wrong conclusion. If a tool errored at [TURN
      31], the root cause is the agent’s call at [TURN 30]. If the verdict marks a
      write as [FORBIDDEN WRITE], the agent’s error is having made that write; "should_have"
      must then say to refuse or leave it unchanged, and must NOT describe how to
      make the same write correctly. A task can mix both: some writes required, others
      forbidden. Many tasks are REFUSAL tasks: the correct outcome is to decline or
      do nothing, and the reference solution then contains only lookups (the verdict
      tells you when this is the case). In such a task the agent’s error is that it
      wrote to the database at all — do not tell it to perform writes it should have
      refused.


      3. Say concretely what the agent should have done at that turn instead, grounded
      in the policy and the answer key.


      4. List any further agent mistakes that contributed, each with its own turn.


      Rules:


      - Only analyze the AGENT. The customer’s behaviour is not your concern; never
      blame the customer for an agent mistake.


      - Every turn_idx you cite MUST be a [TURN n] number that appears in the transcript,
      and it MUST be an **agent** turn — a turn labelled **assistant**. Never cite
      a **tool** turn (that is the system answering) or a **user** turn (that is the
      customer). If the mistake shows up in a tool error at [TURN 31], the agent’s
      turn is [TURN 30]; if the agent answered a customer question badly at [TURN
      50], cite 50, not the question at 49. <Agent Actions By Turn> lists every tool
      the agent called and at which turn — use it so the turn you cite is the turn
      where the thing you describe actually happened.


      - Lines in the transcript marked "**user**" followed by "Tool Call" are the
      CUSTOMER operating their own phone at the agent’s request. They are not agent
      actions. Never write "the agent called toggle_roaming" when the customer did
      it.


      - The root cause must be a turn where the agent did something wrong or failed
      to do something. A successful read-only lookup (get_*, search_*, find_*, list_*)
      is never the root cause by itself — if a lookup was fine and the mistake came
      later, cite the later turn.


      - "should_have" must be an action the agent could actually have taken with the
      information in the transcript and the tools it owns. Never write "state the
      answer-key value" or "match the reference solution"; instead say which step
      would have produced the right result (which lookup, which calculation, which
      tool with which arguments, which question to ask the customer). If the correct
      value can be computed from numbers in the transcript, show the computation.


      - The reference solution is ONE valid path. Failing to match it exactly is not
      itself an error; only cite it to explain what the failed condition required.


      - When you say the agent violated the policy, put the exact policy sentence
      you rely on in "policy_quote". It must be copied from <Policy> — never from
      <Task>, the answer key, or your own words. If the failure was not a policy violation
      (e.g. a wrong calculation, a missed step, a wrong argument), set "policy_quote"
      to null rather than inventing one.


      - Quote or paraphrase what actually happened at that turn. Never invent tool
      names, arguments, or messages that are not in the transcript.


      - <Agent Tools> and <Customer Device Tools> are two different sets. A tool in
      the second set exists but belongs to the customer’s phone: the agent cannot
      call it and must ask the customer to do it. A call that came back "Tool ’X’
      not found" is this mistake. Never write that such a tool "does not exist".


      - Assertion names from the answer key (assert_*) are grading checks, not tools.
      Do not describe the agent as calling them.


      - If a <Correct Run Of The Same Task> block is present, it is what this SAME
      agent did in another attempt at this SAME task that PASSED. It is the most concrete
      example of a correct path. Use it to spot which step the failed run skipped,
      did in the wrong order, or did with different arguments. The customer’s wording
      differs between runs, so align by intent, not turn by turn, and never describe
      the correct run’s actions as things the failed run did.


      - If the failure was NOT the agent’s fault (the customer hung up mid-task, the
      conversation hit the step limit while the agent was making progress, the task
      was impossible), say so by setting "blame" accordingly and explain. Do not manufacture
      an agent error.


      Output ONLY this JSON object:


      {


      "failed_condition": "<plain-language restatement of what the grader says was
      not met>",


      "blame": "agent" | "customer" | "environment" | "unclear",


      "root_cause": {


      "turn_idx": <int, an assistant turn>,


      "what_happened": "<what the agent did at this turn>",


      "why_it_caused_the_failure": "<causal link to the failed condition>",


      "should_have": "<the concrete correct action at this turn>",


      "policy_quote": "<exact sentence from <Policy> if a rule was broken, else null>"


      },


      "contributing_errors": [


      {"turn_idx": <int>, "what_happened": "<…>", "should_have": "<…>"}


      ],


      "summary": "<two sentences: the failure in one line, the fix in one line>"


      }


      ⬇


      <Policy>


      {policy}


      </Policy>


      <Agent Tools>


      {agent_tools}


      </Agent Tools>


      {customer_tools}


      <Task>


      {task}


      </Task>


      <Answer Key>


      Reference solution (one valid path; other paths may also be correct):


      {actions}


      {criteria}


      </Answer Key>


      {sibling}<Grader Verdict>


      This trajectory scored {reward}. The following checks did not pass:


      {verdict}


      </Grader Verdict>


      <Agent Actions By Turn>


      {tool_index}


      </Agent Actions By Turn>


      <Conversation>


      {conversation}


      </Conversation>


      ⬇


      <Correct Run Of The Same Task>


      The same agent PASSED this task in another attempt (trial {trial}). Its agent-side
      trace, in order:


      {txt}


      </Correct Run Of The Same Task>'
