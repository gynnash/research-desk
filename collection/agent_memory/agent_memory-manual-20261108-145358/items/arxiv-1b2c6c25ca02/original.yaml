  \ in Appendix Table 7.\n[S32] A.3 Evaluation populations (https://arxiv.org/html/2610.39276v1#A1.SS3)\n\
  A51: The training split drives failure attribution and revision proposals, whereas\n\
  \nvalidation is used to accept revisions and select the final design. MemSteer\n\
  \nuses generated QA–evidence supervision for these processes, without using\n\n\
  benchmark evaluation questions. The Official-QA reference instead uses official\n\
  \nQA for training and validation; these items remain included in evaluation.\n\n\
  On ATM-Bench, both the Official-QA and MemSteer conditions use 400 training items\n\
  \nand a fixed 200-item validation set; the former uses official QA and the latter\n\
  \nuses QA–evidence supervision generated from the records. Evaluation covers all\n\
  \n1,013 official QA items, including the 600 items used for Official-QA training\n\
  \nand validation. ATM-Bench-Hard, the 31-question hard multi-hop subset, is reported\n\
  \nseparately. Leaderboard references also use the full 1,013-item population.\n\n\
  RHELM contains 1,305 official QA items from ten personas and is evaluated on the\n\
  \nfull official set, both with and without external data sources. The Official-QA\n\
  \nreference uses 524 official items for training and 264 for validation; these\n\
  \nitems remain included in evaluation. The final MemSteer configuration uses 788\n\
  \ngenerated QA–evidence items for training, without using official QA for training\n\
  \nor design selection.\n\nIn the six-user setting, four personas provide training\
  \ supervision,\n\n\nA52: two provide validation supervision, and the remaining four\
  \ are held out\n\n(Table 9). For personal continuation, MemSteer\n\ngenerates 421\
  \ supervision items from Martin Keller’s history, split into 282\n\ntraining and\
  \ 139 validation items, and evaluates the continued design on 228\n\nofficial questions.\
  \ For David R. Ellis, it generates 337 supervision items,\n\nsplit into 223 training\
  \ and 114 validation items, and evaluates on 158 official\n\nquestions.\n[S33] A.4\
  \ Evaluation Metrics (https://arxiv.org/html/2610.39276v1#A1.SS4)\nA53: On ATM-Bench,\
  \ Question Score (QS) uses exact match\n\nfor numerical items, Jaccard partial credit\
  \ for list items, and judge scores\n\nfor open-ended items. R@10 averages the fraction\
  \ of gold evidence records\n\namong the top-10 retrieved records over questions.\n\
  \nBlind answer agreement.\n\nBlind answer recovery checks type-normalized exact\
  \ agreement: normalized text\n\nequality, set equality for lists, and exact value-and-unit\
  \ agreement for\n\nnumerical answers. Boolean answers are matched exactly. Evidence\
  \ coverage is\n\nchecked at the record level, requiring citations to every selected\
  \ evidence record.\n\nDesign-selection accuracy.\n\nValidation accuracy guides revision\
  \ acceptance and design selection.\n\nPredictions identical to their reference answers\
  \ are scored as correct;\n\nother responses receive a binary correctness judgment\
  \ from a fixed LLM judge.\n\nFinal ATM-Bench evaluation uses Question Score (QS),\
  \ which includes partial\n\ncredit for list questions. Final RHELM evaluation reports\
  \ overall accuracy,\n\ncomputed as the mean of binary correctness judgments from\
  \ the official evaluator.\n[S34] A.5 Feedback inputs (https://arxiv.org/html/2610.39276v1#A1.SS5)\n\
  A54: Gold evidence denotes the reference source evidence in\n\nMemSteer-generated\
  \ QA–evidence supervision, not human-annotated evidence.\n\nFor Random-30, each\
  \ sampled case includes the question, reference\n\nanswer, prediction and score,\
  \ ranked\n\nretrieved-record IDs, IDs actually delivered to the answer.\n\nGold\
  \ evidence remains unmarked in Random-30, even if it appears in the context.\n\n\
  Random-30 + Gold evidence adds required-evidence IDs and gold-record\n\nexcerpts\
  \ without programmatic failure attribution. Random-30 + Diagnosis\n\nretains random\
  \ sampling and additionally provides failure-stage labels,\n\nmissing-evidence IDs,\
  \ evidence checks, and memory-lookup results.\n\nDiagnosis + stratified sampling\
  \ uses the same diagnostic information\n\nbut organizes examples by failure category\
  \ before allocating the feedback budget.\n[S35] B.1 ATM-Bench reference and optimization\
