      Evidence-grounded answer planning and staged generation.


      We test whether constructing an evidence-grounded answer plan improves QA quality


      over direct generation, and whether programmatically checking the plan before
      a


      separate question-generation call provides further gains over joint generation.


      Table 5 compares three generation procedures on the


      same 600 tasks, holding source records, question types, evidence-count requirements,


      and the DeepSeek-V4-Flash generator fixed. Direct QA jointly generates


      the question, answer, and evidence in one call, without an intermediate


      answer plan. Joint Plan–Q first produces an evidence-grounded answer plan


      and then the question within the same response.


      Two-stage Plan–Q constructs the answer plan, applies programmatic


      structural and provenance checks, and generates the question in a separate


      call using the accepted answer plan and source records.


      All three use the same GPT-4.1-mini filter, which sees the QA, evidence and
      source


      material but not our detailed evidence-grounded answer plan.


      This shared filter is used only for the


      generation comparison, rather than the full MemSteer verification pipeline.


      For QA passing this filter, a separate, blinded GPT-4.1 review assesses QA quality


      with four criteria as used in Table 4.


      Joint Plan–Q improves QA quality over Direct QA, although both use one call,


      supporting explicit evidence-grounded answer planning. Two-stage Plan–Q improves


      quality further with programmatic plan checks before separate question generation,


      but has the highest per-question token cost.


      Training-question budget.


      Increasing the budget from 100 to 200 questions yields the largest performance


      gains in the evaluated sweep. Beyond 200, retrieval recall largely plateaus,


      while QS improves overall on both ATM-Bench and ATM-Bench-Hard


      (Appendix B.2).'
