      Cross-user transfer and continuation.


      We apply a frozen design optimized on six RHELM users to Martin Keller and


      David R. Ellis, who are excluded from the source-user pool. We then continue


      optimization from this shared design using QA–evidence supervision generated


      from each target user’s history, reserving official QA for evaluation


      (Appendix A.3).


      Direct transfer helps David slightly but reduces Martin’s accuracy


      (Table 3). Personal continuation improves both transferred


      designs, especially for Martin, suggesting that target-history supervision can


      support adaptation beyond a shared design.'
    location: https://arxiv.org/html/2610.39276v1#S4.SS3
  - id: S23
    title: 4.4 What Makes QA–Evidence Supervision Effective?
    text: 'We first compare QA-generation methods and the effect of verification on


      supervision quality and downstream utility. We then examine two generator


      design choices: constructing an explicit evidence-grounded answer plan and


      separating its construction from question generation.


      Table 4: QA-generation methods and verification on ATM-Bench.


      QA quality scores are reported for two


      judges (DS-V4F: DeepSeek-V4-Flash); Avg. is their mean.


      QS measures downstream utility; Kept is the percentage of candidates


      retained after verification (“–”: no filtering).


