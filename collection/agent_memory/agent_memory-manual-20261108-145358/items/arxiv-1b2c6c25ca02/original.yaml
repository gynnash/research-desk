      Yet suitable labels are rarely available for new user histories,


      and manually constructing QA pairs and supporting evidence is costly.


      We introduce MemSteer, which turns unlabeled user histories into question–answer


      (QA) supervision with supporting evidence for memory-design optimization.


      MemSteer constructs an evidence-grounded answer plan that specifies how facts


      across related records jointly support a reference answer.


      The plan guides question generation, while source-grounded auditing and blind


      answer recovery check the resulting annotations.


      To study the utility of this supervision, we develop MemSteer-Opt,


      which combines QA-based design evaluation with evidence-guided failure diagnosis


      to revise memory store, retrieval, and context construction without updating


      model parameters.


      Experiments on ATM-Bench and RHELM show that this supervision is competitive


      with official-QA-guided optimization.


      Relative to Base-BM25, MemSteer-Opt improves ATM-Bench Question Score by 13.4
      points


      and RHELM accuracy by 4.1 and 6.6 points without and with external data, respectively.


      The supervision also benefits two existing optimizers on ATM-Bench,


      while new-user experiments demonstrate continued design optimization using


      supervision generated from the target histories.'
    location: https://arxiv.org/html/2610.39276v1#abstract1
  - id: S3
    title: 1 Introduction
    text: 'Figure 1: Motivation for MemSteer.


      User histories vary in data characteristics, so one memory design may not suit
      every user.


      Automatic design adaptation through iterative optimization requires feedback
      on memory performance.


      MemSteer supports this optimization by automatically generating QA–evidence
      supervision from unlabeled histories, avoiding labor-intensive manual labeling.


      Agents that assist users over time need to draw on information accumulated


      across conversations, emails, and documents.


      An external memory system supports this process by storing and organizing


      the user’s history and retrieving relevant context for the agent.


      Storage granularity, retrieval strategy, and answer-context construction


      shape how effectively the agent can use that history.


      User histories differ in their content, modalities, and organization,


      so a memory design effective for one user may be less suitable for another.


      This motivates adapting memory designs to user histories.


      Recent methods such as MemEvolve, ALMA, and M^{\star} optimize memory designs


      using downstream task feedback (Zhang et al., 2025; Xiong et al., 2026; Pan
      et al., 2026).


      While executable tasks can provide feedback through their outcomes, personal


      records and interactions often lack an explicit signal for assessing memory
      quality.


      Annotated question–answer (QA) pairs can supply this signal (Pan et al., 2026),


      but constructing questions, reference answers, and supporting evidence for each


      new history is costly.


      This motivates our question (Figure 1):


      Can unlabeled user histories guide memory-design optimization?


      Generating QA from the history itself offers a potential source of this feedback.


      Within agent memory, MemBuilder uses synthetic QA rewards to train


      memory-construction policies (Shen et al., 2026), while MemMA uses QA probes


      to repair stored memories (Lin et al., 2026).


      We instead investigate whether history-derived QA can provide reliable feedback


      for evaluating and improving memory-system designs.


      For memory-design optimization, reference answers determine how candidate designs


      are evaluated, while source evidence can help diagnose unsuccessful responses.


      Unsupported answers or mismatched evidence can misdirect design selection


      and later revisions.


      We propose MemSteer, a framework that turns unlabeled user histories


      into source-grounded QA–evidence supervision for memory-design optimization


      (Figure 2).


      It brings together related source records and specifies how their facts


      jointly support a reference answer. The resulting evidence-grounded answer plan


      guides question generation. Source-grounded auditing checks


      the generated QA for evidence support and consistency, while blind answer


      recovery assesses whether the reference answer can be recovered from


      the sampled records.


      To investigate the utility of MemSteer’s generated supervision,


      we develop MemSteer-Opt, an evidence-guided memory-design optimizer.


      It uses source evidence and execution traces to identify whether


      incorrect responses stem from storage, retrieval, or answer generation,


      then proposes targeted design revisions and evaluates them using QA performance.


      Starting from a basic memory system, we use MemSteer-Opt to optimize


      memory representations, retrieval strategies, and context construction.


      We further supply the generated QA to M⋆ and MemEvolve


      (Pan et al., 2026; Zhang et al., 2025),


      allowing each framework to optimize within its own design space.


      Our contributions are threefold:


      •


      Memory-design optimization from unlabeled histories.


      MemSteer constructs QA–evidence supervision from unlabeled user histories


      for evaluating and improving memory designs without updating model parameters.


      •


      Evidence-grounded answer planning and verification.


      We construct answer plans that make explicit how source facts jointly


      support a reference answer for question generation.


      Source-grounded verification checks the resulting annotations.


      •


      Empirical validation across optimizers and user histories.


      Experiments with MemSteer-Opt on ATM-Bench and RHELM


      (Mei et al., 2026b; Zhang et al., 2026) show that generated


      supervision improves memory designs and is competitive with the


      Official-QA reference. Further experiments demonstrate its utility for


      two existing optimizers on ATM-Bench and for continued optimization


      on new user histories.'
    location: https://arxiv.org/html/2610.39276v1#S1
  - id: S4
    title: Memory-design optimization.
    text: 'Applications differ in what agents need to remember and how they use


      past information, making memory design an application-specific


      engineering challenge (Xiong et al., 2026; Pan et al., 2026).


      Recent work therefore explores automatic memory-design optimization


      to accommodate these requirements while reducing reliance on manual design.


      ALMA searches over code-based memory designs using task success


      and interaction logs as feedback (Xiong et al., 2026).


      MemEvolve introduces a dual-level process that evolves both


      experience memory and its underlying architecture (Zhang et al., 2025).


      M^{\star} searches over memory programs by jointly refining their


      schema, logic, and instructions through task feedback and reflective


      code evolution (Pan et al., 2026).


      At a narrower level, CluE refines memory-extraction prompts


      using downstream feedback across heterogeneous tasks (Yang et al., 2026).


      These methods optimize memory designs using feedback from downstream tasks.


      In many personal-memory applications, however, user records and everyday


      interactions do not naturally yield success-or-failure signals


      to guide memory-design optimization.


      We therefore investigate how these histories can be turned into supervision


      for memory-design optimization.'
    location: https://arxiv.org/html/2610.39276v1#S2.SS0.SSS0.Px1
  - id: S5
    title: Synthetic queries and QA for training and evaluation.
    text: 'Outside agent memory, synthetic data has been used to reduce


      annotation requirements for model training and system evaluation.


      Promptagator generates query–document pairs to train task-specific


      dense retrievers (Dai et al., 2022).


      Alberti et al. (2019) generate QA by selecting answers,


      formulating questions, and filtering pairs through answer-recovery


      consistency before training reading-comprehension models.


      For structured synthesis, GraphGen samples knowledge-graph subgraphs


      to construct atomic, aggregated, and multi-hop QA for supervised


      fine-tuning (Chen et al., 2025).


      For evaluation, DataMorgana constructs corpus-specific RAG benchmarks


      with configurable user and question categories (Filice et al., 2025),


      while Ragas uses graph relationships to synthesize multi-hop


      test questions (Ragas, 2026).


      The usefulness of synthetic questions has also been studied directly:


      Yue et al. (2022) learn a question value estimator to select examples


      that improve target-domain QA performance, rather than relying only


      on generation or answer-model scores.


      We ask whether synthetic QA can provide effective feedback


      for memory-design optimization.'
    location: https://arxiv.org/html/2610.39276v1#S2.SS0.SSS0.Px2
  - id: S6
    title: Synthetic supervision for agent memory.
    text: 'Generated QA has also been incorporated into memory learning


      and refinement.


      MemBuilder and CMI-Mem generate QA pairs from current sessions


      and retrieved memories, then use answering accuracy as a reward signal


      to train LLMs to construct and update memories via reinforcement


      learning (Shen et al., 2026; Wang et al., 2026).


      MemMA generates QA probes from each session and its historical context,


      then uses answering failures to repair the memory bank (Lin et al., 2026).


      MemMA also examines how the choice of probe generator affects repair outcomes.


      MemSteer instead uses generated QA pairs with source-grounded evidence


      to guide memory-design optimization, rather than to train memory models


      or repair stored memories.


      This turns user histories into a source of feedback for memory-design


      optimization without requiring manually annotated QA for the target history.


      Figure 2: Overview of MemSteer.


      (a) MemSteer turns unlabeled user histories into QA–evidence supervision


      through evidence-grounded answer planning, question generation,


      and source-grounded verification.


      (b) The resulting supervision supports the evaluation and refinement


      of memory designs with either MemSteer-Opt, our evidence-guided optimizer,


      or existing memory-design optimizers.


      Dashed E denotes optional evidence input.'
    location: https://arxiv.org/html/2610.39276v1#S2.SS0.SSS0.Px3
  - id: S7
    title: 3.1 Overview
    text: 'Histories from different users vary in content and structure,


      so a memory design effective for one user may be less suitable for another.


      Given unlabeled user histories H , our goal is to improve agent


      memory designs without manually annotating QA pairs for those histories.


      To this end, MemSteer constructs QA–evidence supervision:


      \mathcal{D}_{H}=\{(q_{i},a_{i},E_{i})\}_{i=1}^{N},


      (1)


      where q_{i} is a question about the history,


      a_{i} is its reference answer,


      and E_{i} identifies the selected source records, with source-span citations


      providing provenance for the supporting facts.


      Reference answers provide a criterion for evaluating memory designs,


      while evidence annotations support the diagnosis of unsuccessful responses.


      We describe the supervision construction process


      in Section 3.2.


      To assess the effectiveness of this supervision for


      memory-design optimization, we develop MemSteer-Opt,


      which evaluates candidate designs and uses evidence-guided feedback


      to propose iterative revisions (Section 3.3).


      The generated supervision can also be supplied to existing optimizers,


      allowing each to retain its own design space and optimization procedure.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS1
  - id: S8
    title: 3.2 Constructing QA–evidence supervision
    text: 'MemSteer constructs QA–evidence annotations by selecting related source
      records,


      establishing how their facts support an answer,


      and generating and verifying the corresponding question.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS2
  - id: S9
    title: Graph-guided material preparation.
    text: 'We organize each user’s history as a graph of source records, preserving
      original


      text, identifiers, and source-provided structural metadata. Edges connect records


      sharing a conversation, occupying adjacent document sections, explicitly


      referencing one another, or having sufficient lexical overlap.


      Path-based expansion from a seed samples a connected subgraph, whose records
      form


      a context-budgeted material bundle B with source-span references for identifying


      jointly supporting facts and evidence records.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS2.SSS0.Px1
  - id: S10
    title: Evidence-grounded answer planning and question generation.
    text: 'Given a material bundle B , an LLM-based planner constructs


      an evidence-grounded answer plan that specifies what the question should ask


      and its reference answer a , identifies supporting facts with source-span


      citations, and describes each selected evidence record’s contribution


      and operations needed to combine facts.


      Answer plans that fail programmatic checks of structural consistency


      and provenance coverage are rejected before question generation.


      Given the answer plan and material bundle B ,


      a question generator produces a standalone question.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS2.SSS0.Px2
  - id: S11
    title: Source-grounded verification.
    text: 'We verify each candidate through a semantic audit followed by blind


      answer recovery.


      Given the material bundle B , the answer plan, and the generated


      question, an LLM reviewer returns structured verification judgments


      with supporting rationales.


      These judgments assess answer support and question–plan


      consistency, with separate assessments of each fact’s source support


      and each evidence record’s stated contribution.


      A candidate proceeds only if all required judgments are supported.


      Given only the question, its answer type, and the source records in B ,


      an LLM-based blind reader returns an answer with source citations.


      A candidate passes only if the reader declares the question answerable,


      its answer exactly matches the reference after type-specific normalization,


      and its citations cover every selected evidence record.


      Normalization rules are detailed in Appendix A.4.


      We partition the generated QA–evidence annotations into disjoint


      training and validation sets, using the former to generate revision proposals


      and the latter to select memory designs.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS2.SSS0.Px3
  - id: S12
    title: '3.3 MemSteer-Opt: evidence-guided memory-design optimization'
    text: 'MemSteer-Opt uses the generated QA–evidence supervision to evaluate


      memory designs and turn observed failures into feedback for iterative revisions.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS3
  - id: S13
    title: Design space and evaluation.
    text: 'Starting from a basic memory system, MemSteer-Opt iteratively optimizes


      how historical records are organized into memory units and indexed,


      how relevant records are retrieved,


      and how retrieved records are assembled into the context supplied to the answerer.


      We represent these storage, retrieval, and context-construction choices


      as a memory design d=(s,r,c) .


      Under design d , the system constructs a memory M_{d}


      from the user’s historical records H :


      M_{d}=\operatorname{Store}_{s}(H).


      For each question q_{i} , it retrieves information from M_{d} ,


      assembles the answer context X_{d,i} ,


      and generates a response \hat{a}_{d,i} :


      X_{d,i}=\operatorname{Context}_{c}(\operatorname{Retrieve}_{r}(q_{i},M_{d})),\qquad\hat{a}_{d,i}=\operatorname{Answer}(q_{i},X_{d,i}).


      (2)


      We evaluate each prediction \hat{a}_{d,i} against its reference answer a_{i}


      under a fixed scoring protocol, yielding a binary correctness score


      y_{d,i}\in\{0,1\} .


      We score a design d by its accuracy on the same validation set as


      A(d)=\frac{1}{N_{\mathrm{val}}}\sum_{i=1}^{N_{\mathrm{val}}}y_{d,i} ,


      where N_{\mathrm{val}} is the number of validation questions.


      We use this binary validation accuracy for design selection; final benchmark


      scores follow the corresponding evaluation protocols (Appendix A.4).


      We hold the answering model, its instruction prompt,


      and the final context budget fixed across designs.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS3.SSS0.Px1
  - id: S14
    title: Evidence-guided diagnosis and sampling.
    text: 'Beyond scoring candidate designs, we use the automatically constructed


      evidence annotations to build targeted feedback for revising memory designs.


      (i) Evidence-guided diagnosis.


      For each incorrect training-set response, we use its evidence annotations


      to check whether the required source records and cited passages


      are fully available in the final answer context.


      If so, we label an answering failure.


      For missing evidence, we use the annotated source IDs to check whether the


      current memory system can recover the corresponding records.


      We assign a storage failure if any missing record is unrecoverable,


      and a retrieval failure if all missing records are recoverable.


      (ii) Failure-stratified sampling.


      To cover different failure modes within the proposer’s input-context budget,


      we sample cases separately from each observed failure category.


      Each sampled case includes the question, its reference answer and annotated


      source evidence, together with the current system’s response and diagnostic
      results.


      Together with the current design and revision history,


      these cases form the input to the design proposer.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS3.SSS0.Px2
  - id: S15
    title: Feedback-guided revision and selection.
    text: 'Given this feedback, an LLM-based design proposer proposes a revised design
      d^{\prime} ,


      using the diagnosed failures to guide changes to storage, retrieval,


      or context construction.


      It also provides a rationale for the proposed changes.


      We rebuild the memory under each valid candidate and evaluate its accuracy


      on the fixed validation set.


      We replace the current design d_{t} with d^{\prime} only if A(d^{\prime})>A(d_{t})
      ;


      otherwise, we retain d_{t} .


      After accepting a revision, we rerun the updated system on the training set


      to refresh the failure diagnoses and sampled feedback for the next iteration.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS3.SSS0.Px3
  - id: S16
    title: Supervision for existing memory-design optimizers.
    text: 'Beyond MemSteer-Opt, we use the generated supervision to guide existing


      memory-design optimizers within their own design spaces.


      Generated questions and reference answers supply task feedback for evaluating


      and refining memory designs; source evidence can additionally support feedback


      when the optimizer’s interface accommodates it.


      This tests whether the supervision remains useful across optimization frameworks.'
    location: https://arxiv.org/html/2610.39276v1#S3.SS3.SSS0.Px4
  - id: S17
    title: 4 Experiments
    text: 'We address four questions:


      Q1 (§4.2): Can generated supervision guide memory-design optimization?


      Q2 (§4.3): Can optimized memory designs transfer and adapt?


      Q3 (§4.4): Which supervision-construction choices matter?


      Q4 (§4.5): Does evidence-guided feedback improve optimization?'
    location: https://arxiv.org/html/2610.39276v1#S4
  - id: S18
    title: Benchmarks and evaluation.
    text: 'ATM-Bench (Mei et al., 2026b) is a multimodal personal-memory QA benchmark


      built from approximately four years of personal records. Its corpus contains
      11,034


      email, image, and video records. Unless otherwise specified, we follow the


      ATM-Bench scoring protocol and evaluate performance on its 1,013-question main


      set and 31-question hard multi-hop set.


      RHELM (Zhang et al., 2026) covers 21,142 interaction records from ten


      personas, evaluated with and without external data sources.


      Benchmark selection is discussed in Appendix A.1.'
    location: https://arxiv.org/html/2610.39276v1#S4.SS1.SSS0.Px1
  - id: S19
    title: Optimizers and protocol.
    text: 'MemSteer-Opt starts from a basic record-level retrieve-and-read system,


      which we refer to as Base-BM25: it indexes


      source text and metadata and uses the original question for BM25 (Robertson
      & Zaragoza, 2009)


      retrieval. Retrieved content is assembled in ranked order within a fixed context


      budget and passed to a fixed answering model.


      M^{\star} (Pan et al., 2026) and MemEvolve (Zhang et al., 2025) retain their


      own starting systems and design spaces.


      MemSteer uses our generated QA–evidence supervision for both training and validation
      while official QA is used only for testing.


      MemSteer-Opt runs 20 reflective evolution iterations per setting.'
    location: https://arxiv.org/html/2610.39276v1#S4.SS1.SSS0.Px2
  - id: S20
    title: Models and metrics.
    text: 'On ATM-Bench, DeepSeek-V4-Flash (DeepSeek-AI, 2026) serves as the answerer,


      open-answer judge (Zheng et al., 2023), and design proposer, matching the


      answerer and judge used by the corresponding leaderboard


      configurations (Mei et al., 2026a).


      We report Question Score (QS) and evidence recall at 10 (R@10).


      On RHELM, we follow the official protocol, using


      GPT-4.1-mini (OpenAI, 2025) for answering and evaluation and reporting


      overall accuracy, separately with and without external data.


      We include existing memory systems as performance references; their configurations


      and additional results are detailed in Appendix A.2 and Appendix B.3.'
    location: https://arxiv.org/html/2610.39276v1#S4.SS1.SSS0.Px3
