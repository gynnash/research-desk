      QA-generation ablations.


      Table 4 compares heuristic synthesis that randomly selects records


      to form a material bundle (Naive-QA), Ragas multi-hop


      generation (Ragas, 2026) (Ragas-QA), and MemSteer, each with and


      without verification. Checks denote our source-grounded verification


      (§3.2).


      For this comparison, QA quality is assessed using four criteria: premise support,


      question clarity, answer support, and evidence support. For each judge, a question


      receives 1 only when all four criteria are supported, and 0 otherwise.


      The QA quality score is the mean of these binary


      scores, expressed as a percentage. We evaluate QA quality using two independent


      LLMs—GPT-5-mini (OpenAI, n.d.) and DeepSeek-V4-Flash—and their average


      to see whether the trends are consistent.


      We make the following observations.


      (i) MemSteer outperforms Naive-QA and Ragas-QA, even when both


      baselines use our checks, in downstream QS and in QA quality assessed by both
      judges.


      (ii) Our checks improve QA quality across all three generation methods


      and downstream QS in most settings, except Ragas-QA on Hard. Naive-QA’s


      lowest retention indicates that a larger fraction of its candidates fail


      the verification criteria.


      (iii) QA quality scores from GPT-5-mini and DeepSeek-V4-Flash


      show broadly consistent trends across generation methods and generally align


      with downstream QS. This supports using the QA quality score as a useful


      indicator of supervision quality.


      Table 5: Generated QA quality evaluation. q denotes a question.


      Generation


      Quality (%)


