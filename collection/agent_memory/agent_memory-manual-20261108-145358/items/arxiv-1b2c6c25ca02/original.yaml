    title: B.2 Effect of supervision budget
    text: 'We augment the existing pool of generated QA–evidence pairs with an additional


      batch of generated data. From the expanded pool, we randomly sample supervision


      for five settings containing 100, 200, 300, 400, or 500 training questions,


      respectively. In each setting, training and validation account for approximately


      60% and 40% of the sampled supervision. All runs start from the same Base-BM25


      design, with training questions used to guide design revisions and validation


      questions used for design selection. Figure B.2 reports


      the resulting performance on ATM-Bench and ATM-Bench-Hard.


