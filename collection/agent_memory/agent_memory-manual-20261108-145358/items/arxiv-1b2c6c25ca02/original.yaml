  \n39.9 (+6.6)\n\nPerformance remains close to Base-BM25 at the smallest question\
  \ budget, with\n\nthe largest gains occurring between the 100- and 200-question\
  \ settings.\n\nBeyond this point, QS on ATM-Bench generally improves, while R@10\
  \ remains\n\nlargely stable on both benchmarks. ATM-Bench-Hard shows small fluctuations\n\
  \nin QS, with a test set of only 31 questions.\n[S37] B.3 Full RHELM results (https://arxiv.org/html/2610.39276v1#A2.SS3)\n\
  A63: Table B.2 reports RHELM results by question type, with and without\n\nexternal\
  \ data sources. It also includes baselines using other answer models and\n\nlong-context\
  \ models for reference, rather than as controlled comparisons with\n\nthe GPT-4.1-mini\
  \ systems in Table 2.\n[S38] B.4 Per-persona results (https://arxiv.org/html/2610.39276v1#A2.SS4)\n\
  A64: Table 9 reports per-persona results for shared\n\nmemory designs under two\
  \ optimization settings, complementing the shared and\n\ncontinued designs compared\
  \ in Table 3. In the six-user setting,\n\nfour personas provide training supervision\
  \ and two provide validation\n\nsupervision; the remaining four are held out from\
  \ optimization. In the ten-user\n\nsetting, all personas participate in optimization.\
  \ Official-QA uses 40% of each\n\npersona’s official QA for training and 20% for\
  \ validation, whereas MemSteer uses\n\nQA–evidence supervision generated from user\
  \ histories and reserves official QA\n\nfor evaluation.\n[S39] Transfer of the six-user\
  \ shared design. (https://arxiv.org/html/2610.39276v1#A2.SS4.SSS0.Px1)\nA65: Table\
  \ 9(a) shows that the shared design improves\n\npooled accuracy on the six source\
  \ users from 31.5% to 34.3%. However, this\n\nimprovement does not carry over in\
  \ aggregate to the four users held out from\n\noptimization. These results highlight\
  \ heterogeneous transfer across users: a\n\ndesign optimized on the source users\
  \ does not necessarily benefit other users.\n\nThis makes the target-user continuation\
  \ valuable, as studied in\n\nTable 3.\n[S40] Generated versus official supervision\
  \ in the ten-user setting. (https://arxiv.org/html/2610.39276v1#A2.SS4.SSS0.Px2)\n\
  A66: Table 9(b) shows that MemSteer improves over\n\nBase-BM25 for all ten personas,\
  \ raising pooled accuracy from 33.3% to 39.9%.\n\nIts overall accuracy is 0.8 points\
  \ below the 40.7% obtained with Official-QA\n\nsupervision. Note that MemSteer reserves\
  \ official QA for evaluation, whereas the\n\nOfficial-QA results include questions\
  \ used for training or validation. Thus,\n\nhistory-generated supervision provides\
  \ an effective alternative for optimizing\n\na shared memory design without relying\
  \ on official QA for training or design\n\nselection.\n[S41] B.5 Example accepted\
  \ architecture trajectory (https://arxiv.org/html/2610.39276v1#A2.SS5)\nA67: Figure\
  \ 5: Accepted memory-design optimization trajectory on ATM-Bench, starting\n\nfrom\
  \ Base-BM25 and comprising nine accepted revisions. Numbered badges and\n\ncolored\
  \ arrows indicate the revision order.\n\nFigure B.5 traces one accepted memory-design\
  \ optimization trajectory on ATM-Bench. Starting\n\nfrom Base-BM25 with raw queries\
  \ and a direct reader, revisions add BGE-M3 (Chen et al., 2024) dense\n\nretrieval;\
  \ hybrid retrieval with BGE reranking; question decomposition; HyDE (Gao et al.,\
  \ 2023) and\n\na second retrieval stage; HyDE queries; a 180-candidate pool with\
  \ 90 reranked\n\nitems; and answer verification. The final design uses four HyDE\
  \ queries, reranks\n\n120 candidates, reads 25 records, and permits a 4,000-token\
  \ output. The sequence\n\nmoves from retrieval representation and ranking to multi-query\
  \ context\n\nconstruction and answer validation.\n[S42] Appendix C Limitations (https://arxiv.org/html/2610.39276v1#A3)\n\
  A68: MemSteer’s supervision is generated and verified by LLMs without human\n\n\
  certification, so errors or biases shared across answer planning,\n\nsource-grounded\
  \ auditing, and blind answer recovery can pass verification\n\nundetected. Blind\
  \ answer recovery checks whether the reference answer is\n\nrecoverable from the\
  \ sampled records and every selected evidence record is\n\ncited; it does not establish\
  \ that each record is necessary.\n\nGenerated questions follow the distribution\
  \ of the history rather than users’\n\nactual information needs.\n\nMemSteer-Opt\
  \ explores a constrained, largely retrieval-centric design space.\n\nFinally, our\
  \ evaluation covers two benchmarks, one of which (RHELM) consists\n\nof synthetic\
  \ personas, so evidence on real, heterogeneous user histories\n\nremains limited."
