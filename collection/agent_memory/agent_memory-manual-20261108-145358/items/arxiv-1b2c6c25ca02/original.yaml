  - id: S24
    title: 4.5 Does Evidence-Guided Feedback Improve Optimization?
    text: 'We test whether explicit failure diagnosis improves on raw-evidence feedback


      and whether failure-stratified sampling further improves memory-design optimization.


      All four feedback conditions use MemSteer-generated QA–evidence supervision


      and start from Base-BM25 (Figure 3).


      Figure 3: Attribution and sampling ablation on ATM-Bench and


      ATM-Bench-Hard. Bars report QS and R@10 (%). Optimized conditions use


      MemSteer-generated supervision and start from Base-BM25;


      Diagnosis + stratified sampling is the full MemSteer-Opt configuration.


      We compare four ways to construct feedback from unsuccessful cases.


      Random-30 randomly samples up to 30 scored failures per round and gives


      the design proposer their questions, reference answers, predictions, scores,
      retrieval


      traces, and answer-context excerpts. Random-30 + Gold evidence retains


      the random sampling and adds required-evidence IDs and gold-record excerpts,


      but no failure attribution. Random-30 + Diagnosis further adds


      evidence-grounded failure attribution while retaining random sampling.


      Diagnosis + stratified sampling (ours) keeps the diagnostic feedback


      and samples up to ten cases per failure category, preventing frequent failure


      types from exhausting the feedback budget.


      Appendix A.5 details the feedback fields, while


      Appendix B.5 shows an accepted architectural trajectory.


      We make the following observations. (i) Adding gold evidence provides only


      limited improvement over trace-based feedback. (ii) Explicit failure


      attribution yields larger gains, particularly in evidence retrieval, supporting


      the use of stage-level diagnostic feedback rather than raw evidence alone.


      (iii) Combining diagnosis with stratified sampling achieves the highest


      downstream QS, although diagnosis with random sampling yields higher evidence


      recall on Hard.'
    location: https://arxiv.org/html/2610.39276v1#S4.SS5
  - id: S25
    title: 5 Conclusion
    text: 'We presented MemSteer, a framework for constructing QA–evidence supervision


      from unlabeled user histories and using it to guide memory-design optimization.


      Rather than requiring manually annotated QA for each new history, MemSteer


      derives reference answers and supporting evidence from the records themselves.


      These annotations serve complementary purposes: reference answers support the


      evaluation of candidate memory designs, while source evidence helps diagnose


      unsuccessful responses and guide revisions. We instantiate this approach in


      MemSteer-Opt and also use the generated supervision with existing optimizers


      that retain their own design spaces. Experiments on ATM-Bench and RHELM show


      that generated supervision improves memory designs, achieves performance


      competitive with the Official-QA reference, and supports continued adaptation


      to new user histories.'
    location: https://arxiv.org/html/2610.39276v1#S5
  - id: S26
    title: Ethics Statement
    text: 'Our experiments use released benchmark data under their published terms,
      without


      collecting new personal data or conducting human-subjects studies. Source records


      are processed through third-party LLM APIs, and generated QA may reveal sensitive


      information by combining facts across records. Deployment on personal histories


      should therefore require informed user consent and appropriate privacy safeguards.


      MemSteer is intended to improve memory systems for users, not to enable


      unauthorized profiling.'
    location: https://arxiv.org/html/2610.39276v1#Sx1
  - id: S27
    title: Reproducibility Statement
    text: 'Section 3.2 specifies the supervision-construction pipeline


      (graph-guided material preparation, evidence-grounded answer planning, question


      generation, and source-grounded verification), and


      Section 3.3 specifies the design space, evaluation protocol,


      evidence-guided diagnosis, and acceptance rule of MemSteer-Opt.


      Section 4.1 describes the benchmarks, baselines, iteration


      budget, and model roles.


      Appendix A documents additional experimental details, including


      evaluation populations and feedback inputs; Appendix B


      reports further experimental results.


      Because the pipeline depends on remote LLM APIs, exact outputs may vary with


      model nondeterminism and provider updates; we therefore report the model


      identities used for each role.'
    location: https://arxiv.org/html/2610.39276v1#Sx2
  - id: S28
    title: LLM Usage
    text: 'LLMs perform evidence-grounded answer planning, question generation,


      source-grounded auditing, and blind answer recovery in MemSteer. They also


      propose design revisions in MemSteer-Opt, act as fixed answerers and answer


      judges, and perform shared filtering and post hoc QA-quality evaluation.


      We use DeepSeek-V4-Flash, GPT-4.1-mini, GPT-4.1, and GPT-5-mini across these


      roles (Section 4.1).


      In preparing this paper, we also used LLM assistants for language editing and


      coding assistance.


      The authors reviewed all such output and take full responsibility for this paper.'
    location: https://arxiv.org/html/2610.39276v1#Sx3
