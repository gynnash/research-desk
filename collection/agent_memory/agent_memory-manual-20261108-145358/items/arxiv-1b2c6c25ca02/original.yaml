  - id: S30
    title: A.1 Benchmark Selection
    text: 'We prioritize ATM-Bench (Mei et al., 2026b) and


      RHELM (Zhang et al., 2026) because recent work characterizes


      performance on LoCoMo (Maharana et al., 2024) and


      LongMemEval (Wu et al., 2024) as near-saturated in


      conversational-memory QA settings (He et al., 2026).


      ATM-Bench combines real-world images, videos, and emails, whereas


      RHELM couples evolving simulated user dialogues with external textual


      sources such as emails and documents.'
    location: https://arxiv.org/html/2610.39276v1#A1.SS1
  - id: S31
    title: A.2 Reference Systems
    text: 'Table 2 compares DeepSeek-V4-based Memexa (labazhou2024, 2026),


      A-Mem (Xu et al., 2025), MemPalace (MemPalace, 2026), and


      HippoRAG2 (Gutiérrez et al., 2025) on ATM-Bench (Mei et al., 2026a).


      Table 2 includes the RHELM reference results (Zhang et al., 2026)


      for RAG ( k\in\{20,50\} ), Hybrid ( k\in\{5,20,50\} ),


      MemGPT (Packer et al., 2023), Mem0 (Chhikara et al., 2025), and


      MemU (NevaMind AI, 2025), all using GPT-4.1-mini as the answering model.


      Hybrid combines dense retrieval with BM25 through reciprocal rank fusion.


      The same table reports 1M-context inference with


      Gemini-2.5-Flash-Lite (Comanici et al., 2025),


      Qwen-2.5-14B-Instruct (1M) (Yang et al., 2025), and


      GPT-4.1-mini (OpenAI, 2025).


      The Base-BM25, optimized, and transferred-design rows follow the protocols


      in Sections 4.1 and 4.3.


      Appendix Table B.2 additionally reports RAG with


      GPT-4.1 (OpenAI, 2025), Gemini-2.5-Pro (Comanici et al., 2025),


      and Claude-Opus-4.5 (Anthropic, 2025), all at k=20 .


      Native Qwen3-VL/GPT-5-mini results, including


      ATM-RAG (Mei et al., 2026b), Self-RAG (Asai et al., 2023),


      ScrapMem (Chang & Ren, 2026), and MemoryOS (Kang et al., 2025), are


      included in Appendix Table 7.'
    location: https://arxiv.org/html/2610.39276v1#A1.SS2
  - id: S32
    title: A.3 Evaluation populations
    text: 'The training split drives failure attribution and revision proposals, whereas


      validation is used to accept revisions and select the final design. MemSteer


      uses generated QA–evidence supervision for these processes, without using


      benchmark evaluation questions. The Official-QA reference instead uses official


      QA for training and validation; these items remain included in evaluation.


      On ATM-Bench, both the Official-QA and MemSteer conditions use 400 training
      items


      and a fixed 200-item validation set; the former uses official QA and the latter


      uses QA–evidence supervision generated from the records. Evaluation covers all


      1,013 official QA items, including the 600 items used for Official-QA training


      and validation. ATM-Bench-Hard, the 31-question hard multi-hop subset, is reported


      separately. Leaderboard references also use the full 1,013-item population.


      RHELM contains 1,305 official QA items from ten personas and is evaluated on
      the


      full official set, both with and without external data sources. The Official-QA


      reference uses 524 official items for training and 264 for validation; these


      items remain included in evaluation. The final MemSteer configuration uses 788


      generated QA–evidence items for training, without using official QA for training


      or design selection.


      In the six-user setting, four personas provide training supervision,


      two provide validation supervision, and the remaining four are held out


      (Table 9). For personal continuation, MemSteer


      generates 421 supervision items from Martin Keller’s history, split into 282


      training and 139 validation items, and evaluates the continued design on 228


      official questions. For David R. Ellis, it generates 337 supervision items,


      split into 223 training and 114 validation items, and evaluates on 158 official


      questions.'
    location: https://arxiv.org/html/2610.39276v1#A1.SS3
  - id: S33
    title: A.4 Evaluation Metrics
    text: 'On ATM-Bench, Question Score (QS) uses exact match


      for numerical items, Jaccard partial credit for list items, and judge scores


      for open-ended items. R@10 averages the fraction of gold evidence records


      among the top-10 retrieved records over questions.


      Blind answer agreement.


      Blind answer recovery checks type-normalized exact agreement: normalized text


      equality, set equality for lists, and exact value-and-unit agreement for


      numerical answers. Boolean answers are matched exactly. Evidence coverage is


      checked at the record level, requiring citations to every selected evidence
      record.


      Design-selection accuracy.


      Validation accuracy guides revision acceptance and design selection.


      Predictions identical to their reference answers are scored as correct;


      other responses receive a binary correctness judgment from a fixed LLM judge.


      Final ATM-Bench evaluation uses Question Score (QS), which includes partial


      credit for list questions. Final RHELM evaluation reports overall accuracy,


      computed as the mean of binary correctness judgments from the official evaluator.'
    location: https://arxiv.org/html/2610.39276v1#A1.SS4
  - id: S34
    title: A.5 Feedback inputs
    text: 'Gold evidence denotes the reference source evidence in


      MemSteer-generated QA–evidence supervision, not human-annotated evidence.


      For Random-30, each sampled case includes the question, reference


      answer, prediction and score, ranked


      retrieved-record IDs, IDs actually delivered to the answer.


      Gold evidence remains unmarked in Random-30, even if it appears in the context.


      Random-30 + Gold evidence adds required-evidence IDs and gold-record


      excerpts without programmatic failure attribution. Random-30 + Diagnosis


      retains random sampling and additionally provides failure-stage labels,


      missing-evidence IDs, evidence checks, and memory-lookup results.


      Diagnosis + stratified sampling uses the same diagnostic information


      but organizes examples by failure category before allocating the feedback budget.'
    location: https://arxiv.org/html/2610.39276v1#A1.SS5
