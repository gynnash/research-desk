material: "[S1] MemSteer: Turning User Histories into Supervision for Agent Memory\
  \ Optimization (https://arxiv.org/html/2610.39276v1)\nA1: Jie Huang\n\n††thanks:\
  \ Work done during an internship at MSRA.\n\nAffiliation: Peking University\n\n\
  Affiliation: Microsoft Research Asia\n\nCuiling Lan\n\nAffiliation: Microsoft Research\
  \ Asia\n\nQize Yu\n\nAffiliation: Peking University\n\nXiulian Peng\n\nAffiliation:\
  \ Microsoft Research Asia\n\nYan Lu\n\nAffiliation: Microsoft Research Asia\n[S2]\
  \ Abstract (https://arxiv.org/html/2610.39276v1#abstract1)\nA2: An effective agent\
  \ memory system should adapt to a user’s history and task requirements.\n\nHuman-annotated\
  \ supervision can guide this adaptation by providing feedback\n\nfor evaluating\
  \ and improving memory designs.\n\nYet suitable labels are rarely available for\
  \ new user histories,\n\nand manually constructing QA pairs and supporting evidence\
  \ is costly.\n\nWe introduce MemSteer, which turns unlabeled user histories into\
  \ question–answer\n\n(QA) supervision with supporting evidence for memory-design\
  \ optimization.\n\nMemSteer constructs an evidence-grounded answer plan that specifies\
  \ how facts\n\nacross related records jointly support a reference answer.\n\nThe\
  \ plan guides question generation, while source-grounded auditing and blind\n\n\
  answer recovery check the resulting annotations.\n\nTo study the utility of this\
  \ supervision, we develop MemSteer-Opt,\n\nwhich combines QA-based design evaluation\
  \ with evidence-guided failure diagnosis\n\nto revise memory store, retrieval, and\
  \ context construction without updating\n\nmodel parameters.\n\nExperiments on ATM-Bench\
  \ and RHELM show that this supervision is competitive\n\nwith official-QA-guided\
  \ optimization.\n\nRelative to Base-BM25, MemSteer-Opt improves ATM-Bench Question\
  \ Score by 13.4 points\n\nand RHELM accuracy by 4.1 and 6.6 points without and with\
  \ external data, respectively.\n\nThe supervision also benefits two existing optimizers\
  \ on ATM-Bench,\n\n\nA3: while new-user experiments demonstrate continued design\
  \ optimization using\n\nsupervision generated from the target histories.\n[S3] 1\
  \ Introduction (https://arxiv.org/html/2610.39276v1#S1)\nA4: Figure 1: Motivation\
  \ for MemSteer.\n\nUser histories vary in data characteristics, so one memory design\
  \ may not suit every user.\n\nAutomatic design adaptation through iterative optimization\
  \ requires feedback on memory performance.\n\nMemSteer supports this optimization\
  \ by automatically generating QA–evidence supervision from unlabeled histories,\
  \ avoiding labor-intensive manual labeling.\n\nAgents that assist users over time\
  \ need to draw on information accumulated\n\nacross conversations, emails, and documents.\n\
  \nAn external memory system supports this process by storing and organizing\n\n\
  the user’s history and retrieving relevant context for the agent.\n\nStorage granularity,\
  \ retrieval strategy, and answer-context construction\n\nshape how effectively the\
  \ agent can use that history.\n\nUser histories differ in their content, modalities,\
  \ and organization,\n\nso a memory design effective for one user may be less suitable\
  \ for another.\n\nThis motivates adapting memory designs to user histories.\n\n\
  Recent methods such as MemEvolve, ALMA, and M^{\\star} optimize memory designs\n\
  \nusing downstream task feedback (Zhang et al., 2025; Xiong et al., 2026; Pan et\
  \ al., 2026).\n\nWhile executable tasks can provide feedback through their outcomes,\
  \ personal\n\nrecords and interactions often lack an explicit signal for assessing\
  \ memory quality.\n\n\nA5: Annotated question–answer (QA) pairs can supply this\
  \ signal (Pan et al., 2026),\n\nbut constructing questions, reference answers, and\
  \ supporting evidence for each\n\nnew history is costly.\n\nThis motivates our question\
  \ (Figure 1):\n\nCan unlabeled user histories guide memory-design optimization?\n\
  \nGenerating QA from the history itself offers a potential source of this feedback.\n\
  \nWithin agent memory, MemBuilder uses synthetic QA rewards to train\n\nmemory-construction\
  \ policies (Shen et al., 2026), while MemMA uses QA probes\n\nto repair stored memories\
  \ (Lin et al., 2026).\n\nWe instead investigate whether history-derived QA can provide\
  \ reliable feedback\n\nfor evaluating and improving memory-system designs.\n\nFor\
  \ memory-design optimization, reference answers determine how candidate designs\n\
  \nare evaluated, while source evidence can help diagnose unsuccessful responses.\n\
  \nUnsupported answers or mismatched evidence can misdirect design selection\n\n\
  and later revisions.\n\nWe propose MemSteer, a framework that turns unlabeled user\
  \ histories\n\ninto source-grounded QA–evidence supervision for memory-design optimization\n\
  \n(Figure 2).\n\nIt brings together related source records and specifies how their\
  \ facts\n\njointly support a reference answer. The resulting evidence-grounded answer\
  \ plan\n\nguides question generation. Source-grounded auditing checks\n\n\nA6: the\
  \ generated QA for evidence support and consistency, while blind answer\n\nrecovery\
  \ assesses whether the reference answer can be recovered from\n\nthe sampled records.\n\
  \nTo investigate the utility of MemSteer’s generated supervision,\n\nwe develop\
  \ MemSteer-Opt, an evidence-guided memory-design optimizer.\n\nIt uses source evidence\
  \ and execution traces to identify whether\n\nincorrect responses stem from storage,\
  \ retrieval, or answer generation,\n\nthen proposes targeted design revisions and\
  \ evaluates them using QA performance.\n\nStarting from a basic memory system, we\
  \ use MemSteer-Opt to optimize\n\nmemory representations, retrieval strategies,\
  \ and context construction.\n\nWe further supply the generated QA to M⋆ and MemEvolve\n\
  \n(Pan et al., 2026; Zhang et al., 2025),\n\nallowing each framework to optimize\
  \ within its own design space.\n\nOur contributions are threefold:\n\n•\n\nMemory-design\
  \ optimization from unlabeled histories.\n\nMemSteer constructs QA–evidence supervision\
  \ from unlabeled user histories\n\nfor evaluating and improving memory designs without\
  \ updating model parameters.\n\n•\n\nEvidence-grounded answer planning and verification.\n\
  \nWe construct answer plans that make explicit how source facts jointly\n\nsupport\
  \ a reference answer for question generation.\n\nSource-grounded verification checks\
  \ the resulting annotations.\n\n•\n\nEmpirical validation across optimizers and\
  \ user histories.\n\n\nA7: Experiments with MemSteer-Opt on ATM-Bench and RHELM\n\
  \n(Mei et al., 2026b; Zhang et al., 2026) show that generated\n\nsupervision improves\
  \ memory designs and is competitive with the\n\nOfficial-QA reference. Further experiments\
  \ demonstrate its utility for\n\ntwo existing optimizers on ATM-Bench and for continued\
  \ optimization\n\non new user histories.\n[S4] Memory-design optimization. (https://arxiv.org/html/2610.39276v1#S2.SS0.SSS0.Px1)\n\
  A8: Applications differ in what agents need to remember and how they use\n\npast\
  \ information, making memory design an application-specific\n\nengineering challenge\
  \ (Xiong et al., 2026; Pan et al., 2026).\n\nRecent work therefore explores automatic\
  \ memory-design optimization\n\nto accommodate these requirements while reducing\
  \ reliance on manual design.\n\nALMA searches over code-based memory designs using\
  \ task success\n\nand interaction logs as feedback (Xiong et al., 2026).\n\nMemEvolve\
  \ introduces a dual-level process that evolves both\n\nexperience memory and its\
  \ underlying architecture (Zhang et al., 2025).\n\nM^{\\star} searches over memory\
  \ programs by jointly refining their\n\nschema, logic, and instructions through\
  \ task feedback and reflective\n\ncode evolution (Pan et al., 2026).\n\nAt a narrower\
  \ level, CluE refines memory-extraction prompts\n\nusing downstream feedback across\
  \ heterogeneous tasks (Yang et al., 2026).\n\nThese methods optimize memory designs\
  \ using feedback from downstream tasks.\n\nIn many personal-memory applications,\
  \ however, user records and everyday\n\ninteractions do not naturally yield success-or-failure\
  \ signals\n\nto guide memory-design optimization.\n\nWe therefore investigate how\
  \ these histories can be turned into supervision\n\nfor memory-design optimization.\n\
  [S5] Synthetic queries and QA for training and evaluation. (https://arxiv.org/html/2610.39276v1#S2.SS0.SSS0.Px2)\n\
  A9: Outside agent memory, synthetic data has been used to reduce\n\nannotation requirements\
  \ for model training and system evaluation.\n\nPromptagator generates query–document\
  \ pairs to train task-specific\n\ndense retrievers (Dai et al., 2022).\n\nAlberti\
  \ et al. (2019) generate QA by selecting answers,\n\nformulating questions, and\
  \ filtering pairs through answer-recovery\n\nconsistency before training reading-comprehension\
  \ models.\n\nFor structured synthesis, GraphGen samples knowledge-graph subgraphs\n\
  \nto construct atomic, aggregated, and multi-hop QA for supervised\n\nfine-tuning\
  \ (Chen et al., 2025).\n\nFor evaluation, DataMorgana constructs corpus-specific\
  \ RAG benchmarks\n\nwith configurable user and question categories (Filice et al.,\
  \ 2025),\n\nwhile Ragas uses graph relationships to synthesize multi-hop\n\ntest\
  \ questions (Ragas, 2026).\n\nThe usefulness of synthetic questions has also been\
  \ studied directly:\n\nYue et al. (2022) learn a question value estimator to select\
  \ examples\n\nthat improve target-domain QA performance, rather than relying only\n\
  \non generation or answer-model scores.\n\nWe ask whether synthetic QA can provide\
  \ effective feedback\n\nfor memory-design optimization.\n[S6] Synthetic supervision\
  \ for agent memory. (https://arxiv.org/html/2610.39276v1#S2.SS0.SSS0.Px3)\nA10:\
  \ Generated QA has also been incorporated into memory learning\n\nand refinement.\n\
  \nMemBuilder and CMI-Mem generate QA pairs from current sessions\n\nand retrieved\
  \ memories, then use answering accuracy as a reward signal\n\nto train LLMs to construct\
  \ and update memories via reinforcement\n\nlearning (Shen et al., 2026; Wang et\
  \ al., 2026).\n\nMemMA generates QA probes from each session and its historical\
  \ context,\n\nthen uses answering failures to repair the memory bank (Lin et al.,\
  \ 2026).\n\nMemMA also examines how the choice of probe generator affects repair\
  \ outcomes.\n\nMemSteer instead uses generated QA pairs with source-grounded evidence\n\
  \nto guide memory-design optimization, rather than to train memory models\n\nor\
  \ repair stored memories.\n\nThis turns user histories into a source of feedback\
  \ for memory-design\n\noptimization without requiring manually annotated QA for\
  \ the target history.\n\nFigure 2: Overview of MemSteer.\n\n(a) MemSteer turns unlabeled\
  \ user histories into QA–evidence supervision\n\nthrough evidence-grounded answer\
  \ planning, question generation,\n\nand source-grounded verification.\n\n(b) The\
  \ resulting supervision supports the evaluation and refinement\n\nof memory designs\
  \ with either MemSteer-Opt, our evidence-guided optimizer,\n\nor existing memory-design\
  \ optimizers.\n\nDashed E denotes optional evidence input.\n[S7] 3.1 Overview (https://arxiv.org/html/2610.39276v1#S3.SS1)\n\
  A11: Histories from different users vary in content and structure,\n\nso a memory\
  \ design effective for one user may be less suitable for another.\n\nGiven unlabeled\
  \ user histories H , our goal is to improve agent\n\nmemory designs without manually\
  \ annotating QA pairs for those histories.\n\nTo this end, MemSteer constructs QA–evidence\
  \ supervision:\n\n\\mathcal{D}_{H}=\\{(q_{i},a_{i},E_{i})\\}_{i=1}^{N},\n\n(1)\n\
  \nwhere q_{i} is a question about the history,\n\na_{i} is its reference answer,\n\
  \nand E_{i} identifies the selected source records, with source-span citations\n\
  \nproviding provenance for the supporting facts.\n\nReference answers provide a\
  \ criterion for evaluating memory designs,\n\nwhile evidence annotations support\
  \ the diagnosis of unsuccessful responses.\n\nWe describe the supervision construction\
  \ process\n\nin Section 3.2.\n\nTo assess the effectiveness of this supervision\
  \ for\n\nmemory-design optimization, we develop MemSteer-Opt,\n\nwhich evaluates\
  \ candidate designs and uses evidence-guided feedback\n\nto propose iterative revisions\
  \ (Section 3.3).\n\nThe generated supervision can also be supplied to existing optimizers,\n\
  \nallowing each to retain its own design space and optimization procedure.\n[S8]\
  \ 3.2 Constructing QA–evidence supervision (https://arxiv.org/html/2610.39276v1#S3.SS2)\n\
  A12: MemSteer constructs QA–evidence annotations by selecting related source records,\n\
  \nestablishing how their facts support an answer,\n\nand generating and verifying\
  \ the corresponding question.\n[S9] Graph-guided material preparation. (https://arxiv.org/html/2610.39276v1#S3.SS2.SSS0.Px1)\n\
  A13: We organize each user’s history as a graph of source records, preserving original\n\
  \ntext, identifiers, and source-provided structural metadata. Edges connect records\n\
  \nsharing a conversation, occupying adjacent document sections, explicitly\n\nreferencing\
  \ one another, or having sufficient lexical overlap.\n\nPath-based expansion from\
  \ a seed samples a connected subgraph, whose records form\n\na context-budgeted\
  \ material bundle B with source-span references for identifying\n\njointly supporting\
  \ facts and evidence records.\n[S10] Evidence-grounded answer planning and question\
  \ generation. (https://arxiv.org/html/2610.39276v1#S3.SS2.SSS0.Px2)\nA14: Given\
  \ a material bundle B , an LLM-based planner constructs\n\nan evidence-grounded\
  \ answer plan that specifies what the question should ask\n\nand its reference answer\
  \ a , identifies supporting facts with source-span\n\ncitations, and describes each\
  \ selected evidence record’s contribution\n\nand operations needed to combine facts.\n\
  \nAnswer plans that fail programmatic checks of structural consistency\n\nand provenance\
  \ coverage are rejected before question generation.\n\nGiven the answer plan and\
  \ material bundle B ,\n\na question generator produces a standalone question.\n\
  [S11] Source-grounded verification. (https://arxiv.org/html/2610.39276v1#S3.SS2.SSS0.Px3)\n\
  A15: We verify each candidate through a semantic audit followed by blind\n\nanswer\
  \ recovery.\n\nGiven the material bundle B , the answer plan, and the generated\n\
  \nquestion, an LLM reviewer returns structured verification judgments\n\nwith supporting\
  \ rationales.\n\nThese judgments assess answer support and question–plan\n\nconsistency,\
  \ with separate assessments of each fact’s source support\n\nand each evidence record’s\
  \ stated contribution.\n\nA candidate proceeds only if all required judgments are\
  \ supported.\n\nGiven only the question, its answer type, and the source records\
  \ in B ,\n\nan LLM-based blind reader returns an answer with source citations.\n\
  \nA candidate passes only if the reader declares the question answerable,\n\nits\
  \ answer exactly matches the reference after type-specific normalization,\n\nand\
  \ its citations cover every selected evidence record.\n\nNormalization rules are\
  \ detailed in Appendix A.4.\n\nWe partition the generated QA–evidence annotations\
  \ into disjoint\n\ntraining and validation sets, using the former to generate revision\
  \ proposals\n\nand the latter to select memory designs.\n[S12] 3.3 MemSteer-Opt:\
  \ evidence-guided memory-design optimization (https://arxiv.org/html/2610.39276v1#S3.SS3)\n\
  A16: MemSteer-Opt uses the generated QA–evidence supervision to evaluate\n\nmemory\
  \ designs and turn observed failures into feedback for iterative revisions.\n[S13]\
  \ Design space and evaluation. (https://arxiv.org/html/2610.39276v1#S3.SS3.SSS0.Px1)\n\
  A17: Starting from a basic memory system, MemSteer-Opt iteratively optimizes\n\n\
  how historical records are organized into memory units and indexed,\n\nhow relevant\
  \ records are retrieved,\n\nand how retrieved records are assembled into the context\
  \ supplied to the answerer.\n\nWe represent these storage, retrieval, and context-construction\
  \ choices\n\nas a memory design d=(s,r,c) .\n\nUnder design d , the system constructs\
  \ a memory M_{d}\n\nfrom the user’s historical records H :\n\nM_{d}=\\operatorname{Store}_{s}(H).\n\
  \nFor each question q_{i} , it retrieves information from M_{d} ,\n\nassembles the\
  \ answer context X_{d,i} ,\n\nand generates a response \\hat{a}_{d,i} :\n\nX_{d,i}=\\\
  operatorname{Context}_{c}(\\operatorname{Retrieve}_{r}(q_{i},M_{d})),\\qquad\\hat{a}_{d,i}=\\\
  operatorname{Answer}(q_{i},X_{d,i}).\n\n(2)\n\nWe evaluate each prediction \\hat{a}_{d,i}\
  \ against its reference answer a_{i}\n\nunder a fixed scoring protocol, yielding\
  \ a binary correctness score\n\ny_{d,i}\\in\\{0,1\\} .\n\nWe score a design d by\
  \ its accuracy on the same validation set as\n\nA(d)=\\frac{1}{N_{\\mathrm{val}}}\\\
  sum_{i=1}^{N_{\\mathrm{val}}}y_{d,i} ,\n\nwhere N_{\\mathrm{val}} is the number\
  \ of validation questions.\n\nWe use this binary validation accuracy for design\
  \ selection; final benchmark\n\nscores follow the corresponding evaluation protocols\
  \ (Appendix A.4).\n\nWe hold the answering model, its instruction prompt,\n\n\n\
  A18: and the final context budget fixed across designs.\n[S14] Evidence-guided diagnosis\
  \ and sampling. (https://arxiv.org/html/2610.39276v1#S3.SS3.SSS0.Px2)\nA19: Beyond\
  \ scoring candidate designs, we use the automatically constructed\n\nevidence annotations\
  \ to build targeted feedback for revising memory designs.\n\n(i) Evidence-guided\
  \ diagnosis.\n\nFor each incorrect training-set response, we use its evidence annotations\n\
  \nto check whether the required source records and cited passages\n\nare fully available\
  \ in the final answer context.\n\nIf so, we label an answering failure.\n\nFor missing\
  \ evidence, we use the annotated source IDs to check whether the\n\ncurrent memory\
  \ system can recover the corresponding records.\n\nWe assign a storage failure if\
  \ any missing record is unrecoverable,\n\nand a retrieval failure if all missing\
  \ records are recoverable.\n\n(ii) Failure-stratified sampling.\n\nTo cover different\
  \ failure modes within the proposer’s input-context budget,\n\nwe sample cases separately\
  \ from each observed failure category.\n\nEach sampled case includes the question,\
  \ its reference answer and annotated\n\nsource evidence, together with the current\
  \ system’s response and diagnostic results.\n\nTogether with the current design\
  \ and revision history,\n\nthese cases form the input to the design proposer.\n\
  [S15] Feedback-guided revision and selection. (https://arxiv.org/html/2610.39276v1#S3.SS3.SSS0.Px3)\n\
