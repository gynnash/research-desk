  \ 4.5 Does Evidence-Guided Feedback Improve Optimization? (https://arxiv.org/html/2610.39276v1#S4.SS5)\n\
  A35: We test whether explicit failure diagnosis improves on raw-evidence feedback\n\
  \nand whether failure-stratified sampling further improves memory-design optimization.\n\
  \nAll four feedback conditions use MemSteer-generated QA–evidence supervision\n\n\
  and start from Base-BM25 (Figure 3).\n\nFigure 3: Attribution and sampling ablation\
  \ on ATM-Bench and\n\nATM-Bench-Hard. Bars report QS and R@10 (%). Optimized conditions\
  \ use\n\nMemSteer-generated supervision and start from Base-BM25;\n\nDiagnosis +\
  \ stratified sampling is the full MemSteer-Opt configuration.\n\nWe compare four\
  \ ways to construct feedback from unsuccessful cases.\n\nRandom-30 randomly samples\
  \ up to 30 scored failures per round and gives\n\nthe design proposer their questions,\
  \ reference answers, predictions, scores, retrieval\n\ntraces, and answer-context\
  \ excerpts. Random-30 + Gold evidence retains\n\nthe random sampling and adds required-evidence\
  \ IDs and gold-record excerpts,\n\nbut no failure attribution. Random-30 + Diagnosis\
  \ further adds\n\nevidence-grounded failure attribution while retaining random sampling.\n\
  \nDiagnosis + stratified sampling (ours) keeps the diagnostic feedback\n\nand samples\
  \ up to ten cases per failure category, preventing frequent failure\n\ntypes from\
  \ exhausting the feedback budget.\n\nAppendix A.5 details the feedback fields, while\n\
  \nAppendix B.5 shows an accepted architectural trajectory.\n\nWe make the following\
  \ observations.\nA36:  (i) Adding gold evidence provides only\n\nlimited improvement\
  \ over trace-based feedback. (ii) Explicit failure\n\nattribution yields larger\
  \ gains, particularly in evidence retrieval, supporting\n\nthe use of stage-level\
  \ diagnostic feedback rather than raw evidence alone.\n\n(iii) Combining diagnosis\
  \ with stratified sampling achieves the highest\n\ndownstream QS, although diagnosis\
  \ with random sampling yields higher evidence\n\nrecall on Hard.\n[S25] 5 Conclusion\
  \ (https://arxiv.org/html/2610.39276v1#S5)\nA37: We presented MemSteer, a framework\
  \ for constructing QA–evidence supervision\n\nfrom unlabeled user histories and\
  \ using it to guide memory-design optimization.\n\nRather than requiring manually\
  \ annotated QA for each new history, MemSteer\n\nderives reference answers and supporting\
  \ evidence from the records themselves.\n\nThese annotations serve complementary\
  \ purposes: reference answers support the\n\nevaluation of candidate memory designs,\
  \ while source evidence helps diagnose\n\nunsuccessful responses and guide revisions.\
  \ We instantiate this approach in\n\nMemSteer-Opt and also use the generated supervision\
  \ with existing optimizers\n\nthat retain their own design spaces. Experiments on\
  \ ATM-Bench and RHELM show\n\nthat generated supervision improves memory designs,\
  \ achieves performance\n\ncompetitive with the Official-QA reference, and supports\
  \ continued adaptation\n\nto new user histories.\n[S26] Ethics Statement (https://arxiv.org/html/2610.39276v1#Sx1)\n\
  A38: Our experiments use released benchmark data under their published terms, without\n\
  \ncollecting new personal data or conducting human-subjects studies. Source records\n\
  \nare processed through third-party LLM APIs, and generated QA may reveal sensitive\n\
  \ninformation by combining facts across records. Deployment on personal histories\n\
  \nshould therefore require informed user consent and appropriate privacy safeguards.\n\
  \nMemSteer is intended to improve memory systems for users, not to enable\n\nunauthorized\
  \ profiling.\n[S27] Reproducibility Statement (https://arxiv.org/html/2610.39276v1#Sx2)\n\
  A39: Section 3.2 specifies the supervision-construction pipeline\n\n(graph-guided\
  \ material preparation, evidence-grounded answer planning, question\n\ngeneration,\
  \ and source-grounded verification), and\n\nSection 3.3 specifies the design space,\
  \ evaluation protocol,\n\nevidence-guided diagnosis, and acceptance rule of MemSteer-Opt.\n\
  \nSection 4.1 describes the benchmarks, baselines, iteration\n\nbudget, and model\
  \ roles.\n\nAppendix A documents additional experimental details, including\n\n\
  evaluation populations and feedback inputs; Appendix B\n\nreports further experimental\
  \ results.\n\nBecause the pipeline depends on remote LLM APIs, exact outputs may\
  \ vary with\n\nmodel nondeterminism and provider updates; we therefore report the\
  \ model\n\nidentities used for each role.\n[S28] LLM Usage (https://arxiv.org/html/2610.39276v1#Sx3)\n\
  A40: LLMs perform evidence-grounded answer planning, question generation,\n\nsource-grounded\
  \ auditing, and blind answer recovery in MemSteer. They also\n\npropose design revisions\
  \ in MemSteer-Opt, act as fixed answerers and answer\n\njudges, and perform shared\
  \ filtering and post hoc QA-quality evaluation.\n\nWe use DeepSeek-V4-Flash, GPT-4.1-mini,\
