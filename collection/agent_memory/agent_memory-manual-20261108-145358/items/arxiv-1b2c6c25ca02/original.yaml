  \ (Mei et al., 2026b) and\n\nRHELM (Zhang et al., 2026) because recent work characterizes\n\
  \nperformance on LoCoMo (Maharana et al., 2024) and\n\nLongMemEval (Wu et al., 2024)\
  \ as near-saturated in\n\nconversational-memory QA settings (He et al., 2026).\n\
  \nATM-Bench combines real-world images, videos, and emails, whereas\n\nRHELM couples\
  \ evolving simulated user dialogues with external textual\n\nsources such as emails\
  \ and documents.\n[S31] A.2 Reference Systems (https://arxiv.org/html/2610.39276v1#A1.SS2)\n\
  A50: Table 2 compares DeepSeek-V4-based Memexa (labazhou2024, 2026),\n\nA-Mem (Xu\
  \ et al., 2025), MemPalace (MemPalace, 2026), and\n\nHippoRAG2 (Gutiérrez et al.,\
  \ 2025) on ATM-Bench (Mei et al., 2026a).\n\nTable 2 includes the RHELM reference\
  \ results (Zhang et al., 2026)\n\nfor RAG ( k\\in\\{20,50\\} ), Hybrid ( k\\in\\\
  {5,20,50\\} ),\n\nMemGPT (Packer et al., 2023), Mem0 (Chhikara et al., 2025), and\n\
  \nMemU (NevaMind AI, 2025), all using GPT-4.1-mini as the answering model.\n\nHybrid\
  \ combines dense retrieval with BM25 through reciprocal rank fusion.\n\nThe same\
  \ table reports 1M-context inference with\n\nGemini-2.5-Flash-Lite (Comanici et\
  \ al., 2025),\n\nQwen-2.5-14B-Instruct (1M) (Yang et al., 2025), and\n\nGPT-4.1-mini\
  \ (OpenAI, 2025).\n\nThe Base-BM25, optimized, and transferred-design rows follow\
  \ the protocols\n\nin Sections 4.1 and 4.3.\n\nAppendix Table B.2 additionally reports\
  \ RAG with\n\nGPT-4.1 (OpenAI, 2025), Gemini-2.5-Pro (Comanici et al., 2025),\n\n\
  and Claude-Opus-4.5 (Anthropic, 2025), all at k=20 .\n\nNative Qwen3-VL/GPT-5-mini\
