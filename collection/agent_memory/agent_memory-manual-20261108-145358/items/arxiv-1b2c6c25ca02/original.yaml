  - id: S22
    title: 4.3 Can Optimized Memory Designs Transfer and Adapt?
    text: 'We test design reuse across benchmarks and continued


      optimization for users, respectively.


      Cross-benchmark transfer.


      We freeze the design optimized with generated ATM-Bench QA and apply it to


      RHELM records without target-domain optimization.


      ATM-Bench-evolved(frozen) outperforms Base-BM25 by 4.1 and 5.3 accuracy points


      without and with external data, respectively (Table 2).


      These results suggest that some of the design improvements learned on ATM-Bench


      remain useful on RHELM without target-domain optimization.


      When further optimized using either RHELM Official-QA or QA generated from RHELM


      histories, the transferred design achieves further gains. Generated supervision


      achieves performance close to the Official-QA reference without requiring manually


      annotated target-domain QA for optimization.


      Table 3: RHELM cross-user accuracy (%, with external data).


      Martin and David are outside the six-user pool; personal continuation adapts
      its


      shared design using target-history-generated supervision. Source-user scores


      pool evaluation questions.


      Evaluation


