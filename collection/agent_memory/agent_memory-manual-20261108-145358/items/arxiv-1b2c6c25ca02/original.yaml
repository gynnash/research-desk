      Tables 2 and 2 compare MemSteer-generated


      supervision with official annotations (Official-QA) on ATM-Bench and RHELM;


      the ATM comparison also includes two external optimizers. Official-QA uses


      600 of the 1,013 official ATM items and 788 of the 1,305 RHELM items for training


      and validation. These items remain in its evaluation sets, whereas MemSteer


      uses no evaluation items for training. The final RHELM MemSteer configuration


      uses 788 generated training items and is evaluated on all 1,305 official QA
      items.


      Based on Tables 2 and 2, we make the following observations.


      Generated supervision improves memory designs.


      With MemSteer supervision, MemSteer-Opt raises QS from 54.9 to 68.3 on


      ATM-Bench and from 8.2 to 29.1 on Hard, alongside gains in evidence recall


      (Table 2). On RHELM, MemSteer improves over Base-BM25 by


      4.1 accuracy points without external data and 6.6 points with it


      (Table 2).


      Generated supervision is competitive with the human-annotated reference.


      On ATM-Bench, MemSteer scores marginally higher than Official-QA across all
      four metrics,


      including QS margins of 1.1 points on the main set and 1.3 points on Hard.


      On RHELM, MemSteer remains 0.1 and 0.8 accuracy points below


      Official-QA without and with external data, respectively.


      The supervision also benefits existing optimizers.


      From their own starting systems, M^{\star} and MemEvolve gain 6.0 and 18.6


      main-set QS points with MemSteer supervision, compared with 4.4 and 18.6


      points with Official-QA. Thus, the supervision’s utility is not limited to


      MemSteer-Opt. The benefit is not uniform: on Hard, MemEvolve obtains smaller


      gains than with Official-QA, and its R@10 decreases by 0.1 points.


      The optimized designs are competitive with existing memory systems.


      On ATM-Bench, MemSteer-Opt achieves the highest QS among the non-oracle systems


      using DeepSeek-V4 as the answerer. On RHELM with external data, MemSteer


      reaches 39.9 accuracy, compared with 33.9 for the strongest listed RAG,


      long-context, or memory-system baseline. Without external data, it remains


      competitive with the strongest listed baseline, RAG with k{=}50 .'
