  - id: S37
    title: B.3 Full RHELM results
    text: 'Table B.2 reports RHELM results by question type, with and without


      external data sources. It also includes baselines using other answer models
      and


      long-context models for reference, rather than as controlled comparisons with


      the GPT-4.1-mini systems in Table 2.'
    location: https://arxiv.org/html/2610.39276v1#A2.SS3
  - id: S38
    title: B.4 Per-persona results
    text: 'Table 9 reports per-persona results for shared


      memory designs under two optimization settings, complementing the shared and


      continued designs compared in Table 3. In the six-user setting,


      four personas provide training supervision and two provide validation


      supervision; the remaining four are held out from optimization. In the ten-user


      setting, all personas participate in optimization. Official-QA uses 40% of each


      persona’s official QA for training and 20% for validation, whereas MemSteer
      uses


      QA–evidence supervision generated from user histories and reserves official
      QA


      for evaluation.'
    location: https://arxiv.org/html/2610.39276v1#A2.SS4
  - id: S39
    title: Transfer of the six-user shared design.
    text: 'Table 9(a) shows that the shared design improves


      pooled accuracy on the six source users from 31.5% to 34.3%. However, this


      improvement does not carry over in aggregate to the four users held out from


      optimization. These results highlight heterogeneous transfer across users: a


      design optimized on the source users does not necessarily benefit other users.


      This makes the target-user continuation valuable, as studied in


      Table 3.'
    location: https://arxiv.org/html/2610.39276v1#A2.SS4.SSS0.Px1
  - id: S40
    title: Generated versus official supervision in the ten-user setting.
    text: 'Table 9(b) shows that MemSteer improves over


      Base-BM25 for all ten personas, raising pooled accuracy from 33.3% to 39.9%.


      Its overall accuracy is 0.8 points below the 40.7% obtained with Official-QA


      supervision. Note that MemSteer reserves official QA for evaluation, whereas
      the


      Official-QA results include questions used for training or validation. Thus,


      history-generated supervision provides an effective alternative for optimizing


      a shared memory design without relying on official QA for training or design


      selection.'
    location: https://arxiv.org/html/2610.39276v1#A2.SS4.SSS0.Px2
  - id: S41
    title: B.5 Example accepted architecture trajectory
    text: 'Figure 5: Accepted memory-design optimization trajectory on ATM-Bench,
      starting


      from Base-BM25 and comprising nine accepted revisions. Numbered badges and


      colored arrows indicate the revision order.


      Figure B.5 traces one accepted memory-design optimization trajectory on ATM-Bench.
      Starting


      from Base-BM25 with raw queries and a direct reader, revisions add BGE-M3 (Chen
      et al., 2024) dense


      retrieval; hybrid retrieval with BGE reranking; question decomposition; HyDE
      (Gao et al., 2023) and


      a second retrieval stage; HyDE queries; a 180-candidate pool with 90 reranked


      items; and answer verification. The final design uses four HyDE queries, reranks


      120 candidates, reads 25 records, and permits a 4,000-token output. The sequence


      moves from retrieval representation and ranking to multi-query context


      construction and answer validation.'
    location: https://arxiv.org/html/2610.39276v1#A2.SS5
  - id: S42
    title: Appendix C Limitations
    text: 'MemSteer’s supervision is generated and verified by LLMs without human


      certification, so errors or biases shared across answer planning,


      source-grounded auditing, and blind answer recovery can pass verification


      undetected. Blind answer recovery checks whether the reference answer is


      recoverable from the sampled records and every selected evidence record is


      cited; it does not establish that each record is necessary.


      Generated questions follow the distribution of the history rather than users’


      actual information needs.


      MemSteer-Opt explores a constrained, largely retrieval-centric design space.


      Finally, our evaluation covers two benchmarks, one of which (RHELM) consists


      of synthetic personas, so evidence on real, heterogeneous user histories


      remains limited.'
    location: https://arxiv.org/html/2610.39276v1#A3
