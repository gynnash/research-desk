  [S3] Abstract (https://arxiv.org/html/2610.24520v2#abstract1)

  A3: In long-term interactions with large language model (LLM) agents, users reveal
  habits through their choices and actions.


  These habits capture implicit user information that agents must infer across conversations.


  However, individual observations may provide only partial evidence about a habit
  or when it applies.


  Retaining past interactions alone does not ensure that agents can infer habits and
  apply them appropriately.


  We introduce HABIT-Bench to evaluate how well agent memory systems infer habits
  from weak evidence and apply them to later requests.


  We construct synthetic user histories from task-oriented dialogue data and controlled
  habit graphs.


  The histories span hundreds of sessions across food, finance, software, and travel.


  Four-choice tasks assess agents’ ability to infer user habits and apply them appropriately.


  They include temporary exceptions, changes in habits, and suggestions that users
  have not accepted.


  Sampled tasks undergo independent human review.


  We evaluate eight memory methods with Qwen3-235B-A22B and GLM-5.3-Flash.


  The best-performing memory method achieves 33.61% macro accuracy across the four
  domains.


  Performance remains limited even when annotated evidence is supplied directly. These
  results expose a persistent gap between access to past interactions and the ability
  to infer and appropriately use user habits.

  [S4] 1 Introduction (https://arxiv.org/html/2610.24520v2#S1)

  A4: Long-term interaction requires large language model (LLM) agents to learn from
  experience, not merely retain explicit facts and preferences [Shinn et al., 2023,
  Xu et al., 2026].


  Associative and latent memories offer complementary mechanisms for organizing and
  retaining experience [Gutiérrez et al., 2024, Wang et al., 2024, Wang et al., 2025].


  Useful personalization depends on inferring user characteristics and preferences
  from interaction history [Zhong et al., 2024, Zollo et al., 2025, Nam et al., 2026]
  and deciding when these regularities should guide a response.


  Context and subsequent changes can alter whether an otherwise useful default applies
  [Wood and Rünger, 2016, Jiang et al., 2025].


