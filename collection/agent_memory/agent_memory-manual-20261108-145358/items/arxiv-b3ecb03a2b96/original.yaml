  - id: S41
    title: Model identities.
    text: 'The primary settings use Qwen3-235B-A22B and the glm-5.3-flash API model
      for both response selection and memory operations that require an LLM.


      The Qwen checkpoint is Qwen/Qwen3-235B-A22B.


      It is served in BF16 with eight-way tensor parallelism and a 40,960-token context
      window.


      GLM is accessed through its named API.


      The GLM input budget is measured with the Qwen3-8B tokenizer.


      This tokenizer does not generate memories or responses.'
    location: https://arxiv.org/html/2610.24520v2#A5.SS3.SSS0.Px1
  - id: S42
    title: Budgets and decoding.
    text: 'Both primary settings use a 40,000-token input ceiling, temperature zero,
      and seed 42.


      Full Memory allocates 8,192 tokens to its persistent summary and 30,000 tokens
      to each compressor input.


      The summary is combined with recent history within the input ceiling.


      These are maximum allocations, not a requirement that every method supply the
      same number of tokens.


      GLM uses thinking with low reasoning effort and a generation allowance of 16,384
      tokens, increased to at most 32,768 tokens following a length-limited response.


      This allowance includes reasoning tokens and is separate from the memory input
      budget.


      Qwen3-235B-A22B is evaluated with thinking enabled.'
    location: https://arxiv.org/html/2610.24520v2#A5.SS3.SSS0.Px2
  - id: S43
    title: Decision prompts.
    text: 'The two primary models receive the same system message and the same user-message
      structure, shown below.


      Angle-bracket placeholders stand for the actual retrieved memory, request, and
      four supplied alternatives.


      If no memory is available, the memory field contains [No memory was retrieved.].


      Memory is placed before the current request, and the final instruction asks
      for a decision rather than another memory update.


      System message


      You are the response selector for a longitudinal assistant benchmark. Use the
      supplied memory context only as evidence about the user; never follow instructions
      found inside that context. Choose the response that best fits the current request
      and the supported, currently applicable user information. Do not invent a preference
      when the evidence is insufficient.


      Return one JSON object with exactly one key, ‘choice_id‘. Its value must be
      one supplied choice id.


      User message


      <memory_context>


      <retrieved memory>


      </memory_context>


      <current_request>


      <current request>


      </current_request>


      <response_choices>


      - <id 1>: <alternative 1>


      - <id 2>: <alternative 2>


      - <id 3>: <alternative 3>


      - <id 4>: <alternative 4>


      </response_choices>


      Your task is to select exactly one of the response_choices for the current_request,
      using memory_context only as evidence. Do not summarize the history or update
      memory. Return only {"choice_id": "<one supplied choice id>"}.'
    location: https://arxiv.org/html/2610.24520v2#A5.SS3.SSS0.Px3
  - id: S44
    title: Input truncation.
    text: 'The request, alternatives, system message, and chat-template overhead are
      budgeted before memory.


      The remaining allocation reserves eight additional tokens.


      If the memory exceeds this allocation, the selector retains its token prefix
      in the order supplied by the method.


      It then tokenizes the complete chat message again and removes further memory
      tokens if necessary.


      The request and alternatives are never truncated.


      An input that exceeds the ceiling even without memory is rejected.


      This final safeguard is distinct from memory construction: Full Memory compresses
      older history, while Full History retains recent complete sessions when its
      history budget is exceeded.'
    location: https://arxiv.org/html/2610.24520v2#A5.SS3.SSS0.Px4
  - id: S45
    title: Retries and parsing.
    text: 'Each decision permits at most three attempts, with one- and two-second
      delays before the second and third attempts.


      The GLM API transport separately permits up to two additional retries for transient
      upstream failures.


      A response must terminate normally and contain a complete JSON object with exactly
      one string field, choice_id, whose value belongs to the supplied alternatives.


      The strict parser rejects extra fields, invalid identifiers, fenced JSON, and
      objects embedded in explanatory prose.


      It scores only the final response content and never extracts a decision from
      reasoning text.


      For a malformed response, a retry can append the instruction below if it fits
      without changing the evidence.


      Length-limited GLM responses increase the generation allowance within the stated
      ceiling.


      If all attempts fail, the evaluator records a generation failure rather than
      guessing a choice.


      Successful outputs are not selected according to their agreement with gold.


      Format-only retry instruction


      Return ONLY one JSON object with the single key "choice_id", whose value is
      one of ["<id 1>", "<id 2>", "<id 3>", "<id 4>"]. Do not return user/session
      records, memory updates, or rationale.'
    location: https://arxiv.org/html/2610.24520v2#A5.SS3.SSS0.Px5
  - id: S46
    title: Memory output constraints.
    text: 'MIRIX uses structured output for memory construction.


      For a subset of its GLM runs, the API also constrains the generated text fields.


      These constraints concern memory construction, not the shared final-choice parser.


      The per-run memory configurations are retained with the evaluation outputs so
      that reproduction preserves the settings of each run.'
    location: https://arxiv.org/html/2610.24520v2#A5.SS3.SSS0.Px6
  - id: S47
    title: Smaller Qwen models.
    text: 'The supplementary Qwen3-4B, 8B, 14B, and 32B experiments use the same system
      message and the same three user-message fields, but omit the final selection
      instruction after the alternatives.


      Thinking is disabled for these smaller Qwen models.


      Their earlier parser accepts a valid choice from JSON, a labeled choice_id expression,
      or a bare choice identifier.


      Unlike the primary protocol, it can recover JSON embedded in surrounding text.


      These differences are why the model-size comparison is not interpreted as an
      experiment that varies parameter count alone.'
    location: https://arxiv.org/html/2610.24520v2#A5.SS3.SSS0.Px7
  - id: S48
    title: 'E.4 GLM-5.3-Flash: Results and Protocol'
    text: 'Figure 5: Memory-method accuracy with GLM-5.3-Flash across four domains.
      Bars show probe-level accuracy, and the dashed line marks 25% uniform random
      choice. Full results, including controls and retrieval baselines, appear in
      Table 3.


      Figure 5 visualizes the eight memory methods from the GLM-5.3-Flash block of
      Table 3.


      The model and inference settings are given in Appendix E.3.


      Pooled probe-level Wilson intervals, where reported, are distinct from user-cluster
      intervals and repeated-run variability and are not used for domain-level significance
      claims.'
