  Table 3 evaluates whether current memory systems can infer habits from longitudinal
  weak evidence and apply them to subsequent decisions. Three findings emerge across
  the two primary model settings.


  Habit induction and action selection remain challenging.


  Across the eight memory methods, four-domain macro accuracy ranges from 27.01% to
  33.06% with Qwen3-235B-A22B and from 30.42% to 33.61% with GLM-5.3-Flash.


  Even the best configurations achieve only approximately one-third accuracy, despite
  using the primary model for both memory operations and action selection.



  A27: The task requires selecting one of four actions and is scored by exact match,
  without an LLM judge.


  The model need not formulate a free-form response, but must still distinguish actions
  supported by the user’s history from plausible yet unsupported alternatives.


  Habit-conditioned decision making remains a demanding evaluation target across the
  tested memory designs and model settings.


  The benefit of memory depends on the domain.


  Under Qwen3-235B-A22B, the best memory-method results improve over No Memory by
  20.32 percentage points on Food and 13.07 points on Travel.


  In Finance, all eight methods fall below the 23.54% No Memory point estimate. In
  Software, the largest gain is 1.03 percentage points.


  The domain contrast also appears with GLM: the best memory-method accuracies are
  28.29% on Finance and 25.44% on Software, compared with 54.62% on Travel.


  Finance and Software require agents to combine multiple habits, resolve current
  or historical choices, and distinguish user commitments from unaccepted suggestions.


  Their low scores show that the evaluated methods struggle with these combined requirements,
  but domain comparisons alone cannot identify which requirement causes an error.


  Memory can substantially improve decisions in some domains without providing reliable
  benefits in others.


  Section 4.3 examines this distinction through evidence and capability diagnostics.



  A28: Memory methods do not consistently outperform retrieval.


  The best memory-method macro accuracy is close to that of simple retrieval: 33.06%
  versus 32.50% for BM25 with Qwen, and 33.61% versus 33.21% for dense retrieval with
  GLM.


  GLM’s Full Memory control reaches 41.98%, exceeding all eight memory methods while
  leaving substantial room for improvement.


  Extracting and organizing memories therefore does not consistently produce better
  decisions than retrieving sessions or compressing history in these experiments.


  The methods differ in context construction and effective budgets, so these results
  compare complete pipelines rather than isolate the effect of a memory architecture.


  The relevant question is whether a representation preserves the evidence and conditions
  needed for a later decision, not simply whether it stores a compact account of the
  history.

