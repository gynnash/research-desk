      Finance has 340 jointly annotated items across seven probe types.


      Five additional planned items lack B annotations and are excluded for coverage,
      not classified as quality failures.


      This leaves three of eight requested targeted items within the double-annotated
      sample.


      The 336 jointly valid A/B choices all agree, but four further items lack an
      alternative satisfying an additional output-placement requirement.


      C marks these four as Modify, yielding 336 Keep, four Modify, and no Exclude
      decisions at the audit stage.


      The 336 valid adjudicated choices all match gold.


      The evidence for the intended habit is sufficient in all four cases.


      The modification flags instead identify an extra output-placement requirement
      omitted from every alternative, illustrating that the rubric checks the full
      request rather than only agreement with the intended gold choice.


      We retain these judgments in the audit instead of counting the affected items
      as gold mismatches or forcing reviewers to choose the nearest alternative.


      High agreement on the valid choices therefore coexists with a small number of
      strict quality flags.


      The four local issues were subsequently corrected in the dataset used for final
      evaluation.


      Table 5 preserves their original audit dispositions to show the sensitivity
      of the quality checks, rather than to indicate outstanding defects in the evaluated
      dataset.


      Software has 311 jointly annotated items across seven probe types, including
      all four requested targeted items.


      A and B agree on 308 of 309 jointly valid choices.


      One answer disagreement and two blank B responses produce three adjudication
      cases.


      C resolves these cases, yielding 311 Keep decisions and 311/311 adjudicated
      choices matching gold.


      The adjudications distinguish historical workflow state from a current request
      and distinguish neutral packet identifiers from actual output constraints.'
