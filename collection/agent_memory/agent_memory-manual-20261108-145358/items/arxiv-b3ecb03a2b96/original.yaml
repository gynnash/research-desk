      Annotated evidence leaves substantial decision difficulty. Under Qwen3-235B-A22B,
      Oracle Evidence achieves 39.26–58.25% accuracy across domains, while Oracle
      Habit State achieves 98.41–99.26% (Table 4). The same qualitative separation
      appears with Qwen3-8B. Supplying the annotated evidence therefore does not by
      itself resolve the task. Oracle Habit State additionally exposes the private
      active state and required action, demonstrating that the answerer can map this
      privileged information to the correct alternative. The comparison diagnoses
      remaining difficulty after evidence selection, while combining differences in
      reconstruction requirements and supplied information.


      Evidence access and decision correctness remain distinct. For the six source-attributed
      Qwen3-32B methods, Hit@5 ranges from 37.77% to 41.44%, and annotated-evidence
      recall from 11.17% to 13.89% (Appendix E.5 Table 13).


      Hit@5 indicates whether any of the first five attributed sessions is annotated
      as positive evidence. Evidence recall measures the fraction of the annotated
      set covered by these sessions.


      The joint accuracy of the answer and the evidence (Joint A+E) is 12.92-16.20%,
      requiring a correct answer and at least one evidence hit. Clean Grounded@5 is
      5.49-8.20% on its eligible subset and additionally requires that none of the
      attributed sessions be labeled nonbinding.


      This stricter condition describes the composition of the attributed context.
      It does not directly measure whether the answerer improperly follows a retrieved
      suggestion.


      These diagnostics distinguish evidence access, answer correctness, and the exclusion
      of nonbinding observations, without interpreting an evidence hit as complete
      reasoning support or differences between eligible subsets as an error decomposition.


      This distinction matters when the decisive information is distributed across
      sessions.


      Retrieving a user’s later selection may be insufficient if an earlier session
      defines the alternatives, just as retrieving an established default may be insufficient
      without a subsequent exception or replacement.


      An evidence hit can therefore identify a relevant observation without establishing
      which action is justified at the probe’s target time.


      The diagnostic goal is to assess whether the retrieved context supports the
      complete decision, including the conditions under which the remembered behavior
      applies.


      The capability slices in Appendix D provide a complementary analysis.


      Method rankings vary across temporal resolution, provenance, reference reconstruction,
      induction, and exception handling.


      Strong relative performance on one requirement does not imply the same ordering
      on another.


      Overall accuracy should thus be read alongside these diagnostics, which identify
      distinct demands on memory without attributing every error to retrieval or to
      habit induction alone.'
