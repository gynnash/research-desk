      For a probe, let E_{p} be its annotated positive evidence sessions and S_{p}^{5}
      the first five unique source-session identifiers attributed by the method.


      ER@5 is the fraction of E_{p} covered by S_{p}^{5} , averaged over eligible
      probes.


      Hit@5 measures whether at least one positive evidence session is retrieved.


      NDCG@5 measures binary-relevance ranking quality with logarithmic rank discounting,
      and MRR@5 is the reciprocal rank of the first positive hit, or zero when there
      is none.


      Joint A+E requires both a correct answer and an evidence hit.


      Clean Grounded@5 additionally requires that none of the first five attributed
      sessions is annotated as nonbinding evidence.


      Each metric uses its annotation-eligible probes, so unavailable fields are not
      converted to zero.


      In particular, Clean Grounded@5 uses probes with nonbinding-evidence annotations
      and does not include Food.


      For Full Memory, ER measures evidence coverage in the supplied context and Joint
      A+E uses a hit anywhere in that context, without a five-session cutoff.


      For a nonempty annotated evidence set E_{p} , the per-probe bound is \mathrm{ER@5}_{p}\leq\min(5,|E_{p}|)/|E_{p}|
      . Coverage therefore depends on the size of the annotated set, which is not
      itself a specification of a minimal sufficient reasoning chain. Joint A+E requires
      at least one evidence hit rather than complete support for every decision component.
      Clean Grounded@5 additionally imposes the absence of annotated nonbinding sessions
      from the attributed context; retrieving such a session can still be useful for
      determining that a proposal was never accepted. We retain these as complementary
      context-and-answer diagnostics rather than direct measures of improper personalization.


      The ranked methods have ER@5 between 11.17% and 13.89%, despite Hit@5 between
      37.77% and 41.44%.


      Retrieving some relevant evidence therefore does not imply reconstructing the
      full support for a habit.


      Joint A+E ranges from 12.92% to 16.20%, while Clean Grounded@5 ranges from 5.49%
      to 8.20% on its eligible subset.


      These measures diagnose different aspects of evidence access and use, and their
      different denominators preclude interpreting the difference as a causal error
      decomposition.'
