  - id: S4
    title: 1 Introduction
    text: 'Long-term interaction requires large language model (LLM) agents to learn
      from experience, not merely retain explicit facts and preferences [Shinn et
      al., 2023, Xu et al., 2026].


      Associative and latent memories offer complementary mechanisms for organizing
      and retaining experience [Gutiérrez et al., 2024, Wang et al., 2024, Wang et
      al., 2025].


      Useful personalization depends on inferring user characteristics and preferences
      from interaction history [Zhong et al., 2024, Zollo et al., 2025, Nam et al.,
      2026] and deciding when these regularities should guide a response.


      Context and subsequent changes can alter whether an otherwise useful default
      applies [Wood and Rünger, 2016, Jiang et al., 2025].


      Table 1: Capability coverage across representative long-term-memory and personalization
      benchmarks. \boldsymbol{\checkmark} , \circ , and \boldsymbol{\times} denote
