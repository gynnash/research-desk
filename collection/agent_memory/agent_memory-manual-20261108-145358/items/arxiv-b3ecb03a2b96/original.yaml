  - id: S35
    title: B.3 Food Review
    text: 'The Food review covers 200 probes and follows the same answerability and
      quality rubric.


      Naturalization is a completed construction stage that improves conversational
      fluency while preserving the habit evidence and decision constraints.


      Table 5 reports 200/200 naturalness passes and 0/200 items requiring modification.


      Independent A/B answer agreement is 99.50%, with 200/200 A–gold and 199/200
      B–gold matches (Table 6).'
