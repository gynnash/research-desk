  - id: S18
    title: Appendix A Domain-specific Construction and Validation
    text: 'The four domains share chronological user histories and a deterministic
      four-choice interface, while differing in their source tasks, evidence structures,
      and habit composition.


      The following sections describe the construction and validation of the evaluated
      datasets.'
    location: https://arxiv.org/html/2610.24520v2#A1
  - id: S19
    title: Templates and source compatibility.
    text: The Food pipeline starts with 20 habit templates for private preparation,
      finishing, and serving choices. Each template specifies its applicability condition,
      default action, a competing action, boundary condition/action, and exception
      condition/action. Illustrative axes include the placement of herbs, chili, and
      briny accents, as well as recipe finishing styles. Templates that are effectively
      generic safety rules are filtered out. Trigger patterns constrain assignment
      to compatible recipe seeds, so that an oven-related habit is not inserted into
      an unrelated cooking task. The dialogue and recipe seeds come from CookDial
      [Jiang et al., 2023]. User continuity, habit assignments, and probe labels are
      constructed within HABIT-Bench rather than inherited from CookDial.
    location: https://arxiv.org/html/2610.24520v2#A1.SS1.SSS0.Px1
  - id: S20
    title: Evidence scheduling.
    text: 'Each user receives seven habits. A stable habit has ten signal sessions:
      one candidate shortlist, one distant ordinal resolution, three ratified reuses,
      two boundary observations, one one-case exception, one nonresolving rehearsal,
      and one rejected assistant suggestion. Key signals are distributed across early,
      middle, and late history. The boundary observations deliberately include a weak
      positive and an adjacent near-boundary negative: the contrast is locally available
      even though the overall habit evidence is longitudinal. This is not a claim
      that every supporting observation is far from every other observation. Sixty
      ordinary sessions are added to the 70 signal sessions, giving 130 sessions per
      user and 3,900 sessions in total.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS1.SSS0.Px2
  - id: S21
    title: Naturalization and probes.
    text: 'Naturalization rewrites planned sessions into cooking conversations while
      preserving recipe facts and habit evidence.


      Validation checks turn limits, protected recipe numbers, evidence-index alignment,
      preference leakage in ordinary sessions, mechanical phrasing, and benchmark-related
      terms.


      Each of the 210 user-level habits yields direct-use, boundary, and exception
      probes.


      Query surfaces reduce direct overlap with reuse evidence, and all four alternatives
      are adapted to the current scenario so that the gold action is not the only
      physically applicable option.


      The final dataset contains 630 probes.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS1.SSS0.Px3
  - id: S22
    title: Exception scope and validation.
    text: 'Exceptions authorize a local departure from the default rather than a durable
      replacement.


      The decision target distinguishes applying the default, respecting its boundary,
      and following the exception in its applicable context.


      Naturalization and human validation are part of the construction pipeline, with
      review criteria and results reported in Appendix B.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS1.SSS0.Px4
  - id: S23
    title: Source transformation and persona consistency.
    text: 'The Finance source from MultiDoGO [Peskov et al., 2019] contains 8,832
      conversations and 157,229 utterances.


      Conversations are reconstructed by identifier and turn order, then assigned
      a primary task intent.


      They supply task types, slot categories, interaction patterns, and style exemplars,
      while original identities and sensitive financial fields are replaced in the
      synthetic lifelines.


      The resulting 17,405 source-linked sessions use 7,049 primary source conversations,
      with no primary seed used more than three times.


      Source-linked and evidence-annotated sessions are overlapping categories.


      Each of the 36 users has a stable banking persona, including synthetic account
      identifiers and a consistent financial background. The history has 540 sessions
      per user, spanning January 2021 through June 2025. The final 19,440 sessions
      include 16,180 without memory annotations and 3,260 with some annotation; annotation
      is not synonymous with decisive evidence.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS2.SSS0.Px1
  - id: S24
    title: Habit state and evidence topology.
    text: 'There are eight candidate habits. Each user activates six and leaves two
      absent; two active habits undergo replacement. Workflow variants cover money
      movement, card/account changes, minimal secure verification, urgent fraud handling,
      account-review presentation, dispute preparation, noncommittal credit/loan analysis,
      and current payment-status checks. The secure-verification habit is active for
      every Finance user. Variants are designed to distinguish user-specific processes
      rather than safe versus plainly unsafe alternatives.


      A standing policy is recovered by joining an ordered shortlist with a distant
      user resolution that refers to an ordinal alternative. For drift habits, an
      additional shortlist/resolution pair establishes a replacement. One-off cases,
      unaccepted assistant proposals, unresolved rehearsals, and tentative signals
      are not automatically binding. Probe evidence must link each task component
      to the appropriate workstream, policy pair, user resolution, and target time.
      The private chains distinguish decisive, temporal-context, and nonbinding evidence.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS2.SSS0.Px2
  - id: S25
    title: Probe construction and validation.
    text: 'The 1,368 probes comprise 944 two-habit and 424 three-habit decisions.


      Types include as-of reversals, interleaved temporal composition, surface-decoy
      pairs, reference-case reconstruction, suggestion rejection, provenance-sensitive
      composition, and scope/temporal pairs.


      Validation checks gold–graph consistency, query–choice completeness, evidence
      topology, and surface quality.


      In particular, choices must cover every required task component, with no component
      supplied only by the gold alternative.


      The dataset also defines 288 decision units for complementary unit-level aggregation.


      Human review retains 336 of 340 sampled items and identifies four query–choice
      coverage defects, which are corrected before final evaluation (Appendix B).'
    location: https://arxiv.org/html/2610.24520v2#A1.SS2.SSS0.Px3
  - id: S26
    title: Source transformation and environments.
    text: 'The Software source from MultiDoGO [Peskov et al., 2019] contains 5,562
      conversations and 86,220 utterances.


      Task intents are inferred from complete conversations.


      The resulting 8,678 source-linked sessions use 2,828 primary conversations,
      with at most four realizations per primary seed.


      They retain support-task structure, slot categories, clarification patterns,
      and expression styles while replacing original company identities, credentials,
      contact fields, and repetitive helpdesk language.


      Each synthetic user has a consistent organization, operating system, browser,
      product suite, support account, and work context.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS3.SSS0.Px1
  - id: S27
    title: Habit assignment and temporal interference.
    text: 'Eighteen users each have 540 sessions, giving 9,720 sessions: 8,014 without
      memory annotations and 1,706 with some annotation. Seventeen users have six
      active habits and one has five. The seven candidate habits concern diagnostics,
      documentation lookup, escalation thresholds, secure account recovery, platform-specific
      instructions, backup before risky changes, and receipts after actual ticket
      submission.


      Software shares Finance’s distant shortlist/resolution mechanism and contains
      71 replacement chains.


      Drift frequency varies across users: nine have two replacements each, eight
      have six, and one has five.


      Competing evidence includes similar errors in different environments, case-local
      diagnostic routes, unaccepted proposals, and prior unresolved checkpoints. Ticket
      receipts are scoped to submitted tickets, not merely drafts or ongoing troubleshooting.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS3.SSS0.Px2
  - id: S28
    title: Probe construction and validation.
    text: 'The 680 probes comprise 464 two-habit and 216 three-habit decisions.


      They combine workflow selection with temporal state, provenance, and reference-case
      continuation.


      Validation checks query–choice coverage, gold–graph consistency, and nonredundant
      query text.


      The dataset defines 161 decision units, and human review accepts all 311 sampled
      items (Appendix B).'
    location: https://arxiv.org/html/2610.24520v2#A1.SS3.SSS0.Px3
  - id: S29
    title: Source-derived motifs and history-first realization.
    text: 'Travel begins with independent flight and hotel conversations from Taskmaster-2
      [Byrne et al., 2019].


      Source conversations provide behavioral motifs rather than cross-conversation
      user identities.


      Semantic consolidation yields 47 grounded instances, 18 policy prototypes across
      13 habit families, and 194 habits assigned to 30 synthetic users.


      Each user is specified by a dossier and chronological arc.


      Natural multi-turn sessions are authored before evidence annotation and blind
      recoverability checks, so the history establishes the habit before the probe
      tests its application.


      The histories contain 4,092 sessions, with 124–147 per user: 790 evidence-mode
      and 3,302 ordinary-mode sessions.


      There are 194 initial habit states and eight revisions within the lifelines.


      Probe-visible sessions are restricted by their chronological cutoffs.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS4.SSS0.Px1
  - id: S30
    title: Decision probes.
    text: 'The dataset contains 650 probes: 456 single-habit and 194 two-habit decisions.


      Probe families include cross-context transfer, conflict resolution, evidence
      disambiguation, exception/default composition, scope composition, and temporal-state
      composition.


      Private annotations specify the relevant habits and evidence for each decision.


      The query and alternatives provide current candidate facts, while historical
      sessions establish the user-specific behavioral rule needed to choose among
      them.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS4.SSS0.Px2
  - id: S31
    title: Validation and evaluation scope.
    text: 'Validation combines gold-blind, history-informed answerability checks with
      history-free checks for generic-best shortcuts.


      A and B independently assess the sampled items, C adjudicates disagreements,
      and content revisions receive targeted blind review.


      Appendix B reports agreement and review coverage.


      The experiments evaluate the full probe set with user-isolated memories and
      chronological cutoffs.


      Travel is a controlled diagnostic set, not an independently sequestered generalization
      test.'
    location: https://arxiv.org/html/2610.24520v2#A1.SS4.SSS0.Px3
  - id: S32
    title: A.5 Cross-domain Interpretation
    text: The common four-choice interface does not make the evidence mechanisms identical.
      Food includes both split decisions and repeated reuse, with local contrast for
      boundaries. Finance and Software predominantly test cross-session decision reconstruction
      and policy-state maintenance. Travel emphasizes behavioral-rule recovery and
      compositional application. The benchmark therefore evaluates integration of
      incomplete longitudinal evidence, not exclusively statistical inference from
      unratified behavior. Likewise, deterministic action labels do not establish
      a probabilistic habit-calibration task. These distinctions should constrain
      both the capability claims and the interpretation of domain-averaged accuracy.
    location: https://arxiv.org/html/2610.24520v2#A1.SS5
  - id: S33
    title: B.1 Gold-blind Review and Quality Criteria
    text: 'The review separates three questions: whether the evidence supports a unique
      action, whether the item meets the construction rubric, and whether its gold
      label agrees with the independently recovered action.


      Figure 4 summarizes the process.


      Reviewers receive anonymous queries, ordered alternatives, and chronological
      oracle evidence packets containing decisive evidence, necessary temporal context,
      and relevant nonbinding observations.


      Private habit graphs, gold choices, method predictions, and the other reviewer’s
      initial judgments are withheld during independent annotation.


      The evidence packets are selected using the private annotations, not retrieved
      by a tested memory method.


      This design tests decision recoverability conditional on those packets and does
      not measure human retrieval from the full lifelines.


      Figure 4: Human-validation protocol. A and B independently choose an action
      and apply the quality rubric. C adjudicates answer or quality disagreements
      without gold access. Only after the merged record is frozen does the data manager
      compare it with gold and assign a release disposition. Content corrections receive
      new, versioned inputs and targeted blind review. The diagram describes the protocol,
      while the tables report the completed stages and coverage in each domain.


      A and B record a selected action, eight quality judgments, and a separate modification
      flag with a reason.


      An unanswerable or ambiguous item is left without a selected choice.


      Inapplicable rubric fields are excluded from their field-specific denominators
      rather than counted as passes.


      After A/B records are frozen, any difference in the choice or a quality field
      is routed to C.


      Agreed judgments are retained, and C resolves the disputed judgments before
      gold is revealed for scoring.


      Thus, the three-person protocol does not mean that each item receives three
      independent initial annotations.


      The release decision is Keep when the item passes all applicable criteria without
      a required modification, Modify for a locally repairable defect, and Exclude
      when the item is invalid or requires reconstruction.


      A gold mismatch is not resolved by forcing the reviewer to match the stored
      label.


      Corrections create a new data revision while preserving the original judgments,
      and content changes require targeted blind re-review.


      Table 5 summarizes quality judgments and validation outcomes across all four
      domains.


      The rubric requires a unique evidence-supported answer, correct contextual and
      temporal scope, and appropriate treatment of boundaries, exceptions, and nonbinding
      evidence.


      It also checks that alternatives have comparable task coverage without generic-best
      or surface shortcuts, that language is coherent, that decisions are grounded
      in valid evidence rather than unratified suggestions, and that no real sensitive
      identifiers are exposed.


      Evidence sufficiency alone is not sufficient for acceptance if no alternative
      fulfills the complete request.


      Table 5: Human-validation quality judgments across four domains. Counts give
      positive judgments over applicable reviewed items. Lower is better for the modification
      flag. Finance retains four initial Modify judgments for output-placement omissions
      corrected before final evaluation. Completed naturalization and content validation
      are included in the quality outcomes.


