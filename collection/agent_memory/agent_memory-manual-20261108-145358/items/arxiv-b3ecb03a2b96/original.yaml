  Annotated evidence leaves substantial decision difficulty. Under Qwen3-235B-A22B,
  Oracle Evidence achieves 39.26–58.25% accuracy across domains, while Oracle Habit
  State achieves 98.41–99.26% (Table 4). The same qualitative separation appears with
  Qwen3-8B. Supplying the annotated evidence therefore does not by itself resolve
  the task. Oracle Habit State additionally exposes the private active state and required
  action, demonstrating that the answerer can map this privileged information to the
  correct alternative. The comparison diagnoses remaining difficulty after evidence
  selection, while combining differences in reconstruction requirements and supplied
  information.


  Evidence access and decision correctness remain distinct.

  A30:  For the six source-attributed Qwen3-32B methods, Hit@5 ranges from 37.77%
  to 41.44%, and annotated-evidence recall from 11.17% to 13.89% (Appendix E.5 Table
  13).


  Hit@5 indicates whether any of the first five attributed sessions is annotated as
  positive evidence. Evidence recall measures the fraction of the annotated set covered
  by these sessions.


  The joint accuracy of the answer and the evidence (Joint A+E) is 12.92-16.20%, requiring
  a correct answer and at least one evidence hit. Clean Grounded@5 is 5.49-8.20% on
  its eligible subset and additionally requires that none of the attributed sessions
  be labeled nonbinding.


  This stricter condition describes the composition of the attributed context. It
  does not directly measure whether the answerer improperly follows a retrieved suggestion.


  These diagnostics distinguish evidence access, answer correctness, and the exclusion
  of nonbinding observations, without interpreting an evidence hit as complete reasoning
  support or differences between eligible subsets as an error decomposition.


  This distinction matters when the decisive information is distributed across sessions.


  Retrieving a user’s later selection may be insufficient if an earlier session defines
  the alternatives, just as retrieving an established default may be insufficient
  without a subsequent exception or replacement.



  A31: An evidence hit can therefore identify a relevant observation without establishing
  which action is justified at the probe’s target time.


  The diagnostic goal is to assess whether the retrieved context supports the complete
  decision, including the conditions under which the remembered behavior applies.


  The capability slices in Appendix D provide a complementary analysis.


  Method rankings vary across temporal resolution, provenance, reference reconstruction,
  induction, and exception handling.


  Strong relative performance on one requirement does not imply the same ordering
  on another.


  Overall accuracy should thus be read alongside these diagnostics, which identify
  distinct demands on memory without attributing every error to retrieval or to habit
  induction alone.

  [S14] 4.4 Qwen Model-Size Comparison (https://arxiv.org/html/2610.24520v2#S4.SS4)

  A32: Figure 2: Qwen model-size comparison. Each group shows four-domain macro accuracy
  for five model settings. Full Memory is a control, and the dashed line marks 25%
  uniform random choice. Both memory-stage and answer models change, and the 235B
  setting uses a revised reader protocol, so the comparison does not isolate parameter
  scale.


  Figure 2 compares Qwen3-4B, 8B, 14B, 32B, and 235B-A22B using the same four-domain
  mean of probe-level accuracy.


  The exact values are retained in Appendix Table 12.


  Larger models do not yield uniform gains across methods.


  A-MEM increases from 29.41% with 4B to 33.06% with 235B, whereas LightMem reaches
  28.14% with 14B, drops to 25.04% with 32B, and recovers to 27.01% with 235B.


  These comparisons do not isolate a scale-only effect because both memory-stage and
  answer models change, and the smaller Qwen runs use an earlier reader protocol.


  Nevertheless, the modest and non-monotonic differences show that the larger model
  settings do not consistently resolve the benchmark’s difficulties.

  [S15] 4.5 Retrieval Sensitivity and Memory Costs (https://arxiv.org/html/2610.24520v2#S4.SS5)

  A33: (a) Retrieval and ingestion sensitivity


  (b) Measured memory costs


  Figure 3: Sensitivity and cost analysis with Qwen3-8B. (a) Four-domain macro accuracy
  under retrieval top- k and ingestion-chunk ablations, with 95% within-domain user-bootstrap
  intervals. (b) Cumulative build/query latency and LLM token usage on the same 32-user
  cohort. Build and query times are reported in hours and minutes, respectively. Token
  counts use a logarithmic scale.


  Retrieval quantity and ingestion granularity.


  We conduct a separate Qwen3-8B sensitivity study on eight fixed users per domain,
  covering 32 users and 954 probes, with adapted A-MEM, Mem0, Letta, and MemRL configurations.


  We vary retrieval top- k over 2, 5, 10, and 20 at a 4096-token ingestion target,
  and vary the ingestion target over 128, 512, 2048, and 4096 tokens at k=5 , using
  each method’s native tokenizer.


  Figure 3(a) reports the equal-domain mean of probe-level accuracies from the recorded
  run aggregates.


  Accuracy ranges from 24.83% to 31.71% across the tested settings.


  Increasing k from 2 to 20 raises A-MEM from 29.23% to 31.21% and Letta from 28.53%
  to 31.71%, while larger ingestion chunks do not consistently improve accuracy.


  Thus, varying retrieval quantity or ingestion granularity alone does not remove
  the observed limitations on this cohort.


  Memory construction and query costs.



  A34: Figure 3(b) separates memory construction from subsequent retrieval and answering
  across ten methods on the same cohort.


  The recorded per-user measurements sum to 54.59 hours and 107.80 million LLM tokens
  for A-MEM construction, compared with 13.24 minutes and 3.39 million tokens for
  its queries.


  This illustrates the substantial upfront cost that memory construction can incur
  even when subsequent queries are relatively inexpensive.


  Time is accumulated per-user latency, not parallel job wall time, and tokens include
  LLM prompts and completions but exclude embeddings.


  Initialization and discarded failed or interrupted runs are excluded.


  These measurements characterize the recorded implementations rather than a matched
  accuracy–cost ranking or an extrapolation to the full dataset.


  Separating construction from querying is important because memory is reused across
  subsequent requests.


  A low query cost can conceal substantial processing of the preceding history, while
  the value of that investment depends on how often the resulting memory is consulted
  and updated.


  The sensitivity and cost analyses therefore address complementary questions: how
  retrieval and ingestion choices affect decisions, and where computation is spent
  over the memory lifecycle.

  [S16] 5 Conclusion (https://arxiv.org/html/2610.24520v2#S5)

  A35: HABIT-Bench evaluates whether agents can infer behavioral defaults from longitudinal
  weak evidence and use them to make context-appropriate decisions.


  Its four domains require agents to integrate distributed observations while tracking
  applicability, exceptions, temporal validity, and user endorsement. Across the evaluated
  configurations, memory benefits vary substantially by domain, and richer memory
  pipelines do not consistently outperform retrieval or budget-feasible history compression.
  Oracle controls show that supplying annotated evidence still leaves substantial
  decision difficulty, while evidence-attribution diagnostics distinguish partial
  retrieval from grounded action selection. These findings motivate memory representations
  that preserve the relationships between a default, its supporting observations,
  and its conditions of validity. HABIT-Bench provides a controlled setting for studying
  how such representations support context-appropriate decisions.

