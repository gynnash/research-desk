  Existing benchmarks address complementary parts of this problem.



  A7: LoCoMo and LongMemEval assess recall and reasoning over extended histories [Maharana
  et al., 2024, Wu et al., 2024], while MemoryAgentBench adds incremental learning
  and selective forgetting [Hu et al., 2026a].


  PrefEval examines implicit preference inference and following, while PersonaMem
  tracks evolving user profiles [Zhao et al., 2025, Jiang et al., 2025].


  PERMA and DynamicMem study evolving preferences and habits [Liu et al., 2026, Xie
  et al., 2026].


  BenchPreS and OP-Bench examine when personalization should be withheld [Yoon et
  al., 2026, Hu et al., 2026b], while MemoryArena and Mem2ActBench connect memory
  to subsequent action [He et al., 2026, Shen et al., 2026].


  These developments make a precise evaluation question important: when does the available
  history justify applying a user-specific behavioral default to a new decision?


  We introduce HABIT-Bench to study this question. We define habit memory as the ability
  to infer behavioral defaults from incomplete evidence across sessions and apply
  them according to their scope, exceptions, temporal validity, and user endorsement.


  A relevant past interaction need not establish a valid default. A repeated choice
  may apply only in one context, and an assistant’s suggestion does not become a user
  preference merely because it appears in the history.

  A8:  The target is the support that memory provides for a justified decision, rather
  than a particular memory representation [Rabinowitz et al., 2018, Siththaranjan
  et al., 2024].


  HABIT-Bench constructs synthetic histories using task-oriented dialogue seeds and
  controlled habit graphs.


  It contains 114 users, 37,152 sessions, and 3,328 probes across food, finance, software,
  and travel.


  The domains cover complementary evidence structures. Food combines repeated choices
  with contextual contrasts, and Travel tests behavioral-rule recovery and its application
  to new requests. Finance and Software emphasize reconstructing user-confirmed workflows
  and tracking their changes across sessions. Candidate actions differ in their use
  of habits, including applying an outdated choice, extending a default beyond its
  scope, or treating an unaccepted suggestion as an established decision.


  Memory methods process each user’s history chronologically and supply context to
  a shared base model. We evaluate eight memory methods alongside retrieval baselines
  and a compressed-history control. The best memory-method macro accuracy is 33.06%
  with Qwen3-235B-A22B [Yang et al., 2025] and 33.61% with GLM-5.3-Flash [Zeng et
  al., 2026]. These results are close to the best retrieval baselines, while GLM’s
  compressed-history control reaches 41.98%.

  A9:  Oracle Evidence improves access to relevant observations but still leaves substantial
  decision errors. The results identify both the reconstruction of habits and their
  appropriate use as important targets for memory system evaluation.


  Our contributions are as follows.


  Capability definition.


  We formulate habit memory as the joint problem of inferring behavioral defaults
  and determining when the evidence supports their use.


  Benchmark construction.


  We introduce a four-domain benchmark with chronological histories, annotated habit
  states and supporting sessions, and human validation of decision recoverability.


  Evaluation and diagnostics.


  We compare memory systems under a shared answer protocol and provide diagnostic
  controls for evidence access and downstream decision making. The experiments show
  that elaborate memory pipelines do not consistently outperform simple retrieval
  on these tasks.

  [S5] 2 Related Work (https://arxiv.org/html/2610.24520v2#S2)

  A10: Long-term memory evaluation.


  LoCoMo evaluates long-conversation question answering, summarization, and multimodal
  generation [Maharana et al., 2024], while LongMemEval tests extraction, multi-session
  and temporal reasoning, updates, and abstention [Wu et al., 2024].


  MemoryAgentBench examines retrieval, learning, long-range understanding, and selective
  forgetting under incremental input [Hu et al., 2026a], and MemOps diagnoses memory
  operations and their composition [Hao et al., 2026].


  Implicit and evolving user modeling.


  PERMA studies preference formation and refinement [Liu et al., 2026], while DynamicMem
  evaluates evolving attributes, habits, and preferences across applications [Xie
  et al., 2026].


  HorizonBench constructs graph-controlled preference trajectories with traceable
  provenance [Li et al., 2026].


  RefMem-Bench tests behavioral pattern induction, temporal dynamics, and implicit
  boundaries from fragmented multimodal evidence [Lin et al., 2026].


  HABIT-Bench focuses on whether longitudinal evidence supports a behavioral default
  and its subsequent application.


  Selective personalization.


  BenchPreS tests preference application under social and institutional constraints
  in third-party communication [Yoon et al., 2026].


  OP-Bench examines irrelevant memory use, repetition, and sycophancy [Hu et al.,
  2026b].



  A11: HABIT-Bench couples selectivity with weak-evidence induction, testing scope,
  exceptions, temporal validity, and user endorsement.


  Memory-grounded agent behavior.


  MemoryArena evaluates experience reuse across interdependent sessions [He et al.,
  2026], and Mem2ActBench tests memory-dependent tool selection and parameter grounding
  [Shen et al., 2026].


  PersonaTrail studies personalized web navigation [Yang et al., 2026], while PersonalAlign’s
  AndroidIntent evaluates intent resolution and proactive GUI assistance [Lyu et al.,
  2026].


  IBA-Bench connects implicit user modeling to task execution under enduring traits
  and transient states [Song et al., 2026].


  HABIT-Bench uses non-interactive action selection with a shared answer LLM to compare
  the context produced by different memory systems.


  Table 1 compares these evaluation targets.

  [S6] 3 HABIT-Bench (https://arxiv.org/html/2610.24520v2#S3)

  A12: Figure 1: HABIT-Bench framework. (A) contrasts explicit-memory retrieval with
  latent habit induction. (B) combines task-oriented prompt seeds with latent habit
  graphs to construct real-prompt-seeded synthetic lifelines. (C) evaluates memory
  systems through a shared answerer and diagnostic choice interface.


  HABIT-Bench uses four-choice tasks to evaluate whether agents can infer user habits
  and use them appropriately to select actions.


  Figure 1 outlines the benchmark, and Appendix F illustrates how distributed evidence
  determines the valid action in each domain.

  [S7] 3.1 Task Formulation (https://arxiv.org/html/2610.24520v2#S3.SS1)

  A13: For user u , let H_{u}^{\leq t}=(s_{1},\ldots,s_{t}) denote the history through
  session t .


  A probe p contains a request x_{p} , four candidate actions A_{p} , a visibility
  cutoff t_{p} , and a target time \tau_{p} specifying the current or historical state
  to resolve.


  Each habit state z_{u,h}(\tau) describes a behavioral default, its applicability,
  exceptions, temporal validity, and user endorsement.


  The evaluator specifies


  \displaystyle Z_{u}(\tau)


  \displaystyle=\{z_{u,h}(\tau):h\in\mathcal{B}_{u}\},\qquad a_{p}^{\star}


  \displaystyle=\operatorname{Resolve}\!\left(x_{p},A_{p},Z_{u}(\tau_{p})\right),


  (1)


  where \mathcal{B}_{u} indexes the user’s habits. Resolve combines relevant habits
  and enforces the request’s constraints to identify one valid action. This specification
  leaves the evaluated method’s memory representation unrestricted.


  We define weak evidence as observations that provide incomplete support for a default
  or its validity conditions. A recurring choice can leave scope uncertain, and a
  later selection can require an earlier shortlist for interpretation.


  The task therefore combines behavioral inference and cross-session decision reconstruction.
  In the Finance example (Appendix Figure 7), two workflows must be reconstructed
  at a May 2023 target time even though their 2025 replacements are visible.

  A14:  Correct memory use requires preserving both the chosen actions and when they
  became effective.

  [S8] 3.2 Data and Task Construction (https://arxiv.org/html/2610.24520v2#S3.SS2)

  A15: HABIT-Bench contains 114 synthetic users, 37,152 sessions, and 3,328 probes
  across four domains (Table 2).


  Source datasets provide task seeds and interaction patterns. HABIT-Bench constructs
  user continuity, habit states, and longitudinal evidence relationships. Histories
  interleave habit-relevant observations with ordinary same-domain tasks, while private
  annotations link probes to applicable states and supporting sessions. The four domains
  instantiate complementary evidence structures.


