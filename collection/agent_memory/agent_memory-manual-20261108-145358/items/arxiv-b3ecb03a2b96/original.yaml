  - id: S34
    title: B.2 Sampling and Agreement
    text: 'Sampling is stratified by domain and probe type, using seed 42 and at most
      50 items per stratum, with smaller strata included in full.


      Additional targeted items are included when required by a repair manifest.


      We report the reviewed sample rather than extrapolating its pass rate to the
      domain population, because strata have different sampling fractions.


      Answer agreement and Cohen’s \kappa use pre-adjudication responses on items
      with valid choices from both A and B.


      Gold agreement uses each reviewer’s valid choices as its denominator, with blank
      responses reported separately.


      Quality-field agreement is distinct from answer agreement, and a constant binary
      field can have undefined \kappa despite complete raw agreement.


      Table 6 reports independent A/B results for all four domains before adjudication
      or label correction.


      Domain-specific agreement scores are reported separately, and adjudicated labels
      are not substituted into these independent agreement measurements.


      Table 6: Independent A/B answer agreement across four domains. N : jointly annotated
      items. n : jointly valid choices. A–gold and B–gold give matches over valid
      choices. Agreement and Cohen’s \kappa are measured before adjudication, and
      gold agreement is evaluated before label corrections.


