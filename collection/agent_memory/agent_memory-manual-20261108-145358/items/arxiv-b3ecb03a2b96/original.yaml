  The rubric requires a unique evidence-supported answer, correct contextual and temporal
  scope, and appropriate treatment of boundaries, exceptions, and nonbinding evidence.



  A61: It also checks that alternatives have comparable task coverage without generic-best
  or surface shortcuts, that language is coherent, that decisions are grounded in
  valid evidence rather than unratified suggestions, and that no real sensitive identifiers
  are exposed.


  Evidence sufficiency alone is not sufficient for acceptance if no alternative fulfills
  the complete request.


