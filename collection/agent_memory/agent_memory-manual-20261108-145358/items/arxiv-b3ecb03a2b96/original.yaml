      Existing benchmarks address complementary parts of this problem.


      LoCoMo and LongMemEval assess recall and reasoning over extended histories [Maharana
      et al., 2024, Wu et al., 2024], while MemoryAgentBench adds incremental learning
      and selective forgetting [Hu et al., 2026a].


      PrefEval examines implicit preference inference and following, while PersonaMem
      tracks evolving user profiles [Zhao et al., 2025, Jiang et al., 2025].


      PERMA and DynamicMem study evolving preferences and habits [Liu et al., 2026,
      Xie et al., 2026].


      BenchPreS and OP-Bench examine when personalization should be withheld [Yoon
      et al., 2026, Hu et al., 2026b], while MemoryArena and Mem2ActBench connect
      memory to subsequent action [He et al., 2026, Shen et al., 2026].


      These developments make a precise evaluation question important: when does the
      available history justify applying a user-specific behavioral default to a new
      decision?


      We introduce HABIT-Bench to study this question. We define habit memory as the
      ability to infer behavioral defaults from incomplete evidence across sessions
      and apply them according to their scope, exceptions, temporal validity, and
      user endorsement.


      A relevant past interaction need not establish a valid default. A repeated choice
      may apply only in one context, and an assistant’s suggestion does not become
      a user preference merely because it appears in the history. The target is the
      support that memory provides for a justified decision, rather than a particular
      memory representation [Rabinowitz et al., 2018, Siththaranjan et al., 2024].


      HABIT-Bench constructs synthetic histories using task-oriented dialogue seeds
      and controlled habit graphs.


      It contains 114 users, 37,152 sessions, and 3,328 probes across food, finance,
      software, and travel.


      The domains cover complementary evidence structures. Food combines repeated
      choices with contextual contrasts, and Travel tests behavioral-rule recovery
      and its application to new requests. Finance and Software emphasize reconstructing
      user-confirmed workflows and tracking their changes across sessions. Candidate
      actions differ in their use of habits, including applying an outdated choice,
      extending a default beyond its scope, or treating an unaccepted suggestion as
      an established decision.


      Memory methods process each user’s history chronologically and supply context
      to a shared base model. We evaluate eight memory methods alongside retrieval
      baselines and a compressed-history control. The best memory-method macro accuracy
      is 33.06% with Qwen3-235B-A22B [Yang et al., 2025] and 33.61% with GLM-5.3-Flash
      [Zeng et al., 2026]. These results are close to the best retrieval baselines,
      while GLM’s compressed-history control reaches 41.98%. Oracle Evidence improves
      access to relevant observations but still leaves substantial decision errors.
      The results identify both the reconstruction of habits and their appropriate
      use as important targets for memory system evaluation.


      Our contributions are as follows.


      Capability definition.


      We formulate habit memory as the joint problem of inferring behavioral defaults
      and determining when the evidence supports their use.


      Benchmark construction.


      We introduce a four-domain benchmark with chronological histories, annotated
      habit states and supporting sessions, and human validation of decision recoverability.


      Evaluation and diagnostics.


      We compare memory systems under a shared answer protocol and provide diagnostic
      controls for evidence access and downstream decision making. The experiments
      show that elaborate memory pipelines do not consistently outperform simple retrieval
      on these tasks.'
