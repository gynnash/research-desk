  - id: S5
    title: 2 Related Work
    text: 'Long-term memory evaluation.


      LoCoMo evaluates long-conversation question answering, summarization, and multimodal
      generation [Maharana et al., 2024], while LongMemEval tests extraction, multi-session
      and temporal reasoning, updates, and abstention [Wu et al., 2024].


      MemoryAgentBench examines retrieval, learning, long-range understanding, and
      selective forgetting under incremental input [Hu et al., 2026a], and MemOps
      diagnoses memory operations and their composition [Hao et al., 2026].


      Implicit and evolving user modeling.


      PERMA studies preference formation and refinement [Liu et al., 2026], while
      DynamicMem evaluates evolving attributes, habits, and preferences across applications
      [Xie et al., 2026].


      HorizonBench constructs graph-controlled preference trajectories with traceable
      provenance [Li et al., 2026].


      RefMem-Bench tests behavioral pattern induction, temporal dynamics, and implicit
      boundaries from fragmented multimodal evidence [Lin et al., 2026].


      HABIT-Bench focuses on whether longitudinal evidence supports a behavioral default
      and its subsequent application.


      Selective personalization.


      BenchPreS tests preference application under social and institutional constraints
      in third-party communication [Yoon et al., 2026].


      OP-Bench examines irrelevant memory use, repetition, and sycophancy [Hu et al.,
      2026b].


      HABIT-Bench couples selectivity with weak-evidence induction, testing scope,
      exceptions, temporal validity, and user endorsement.


      Memory-grounded agent behavior.


      MemoryArena evaluates experience reuse across interdependent sessions [He et
      al., 2026], and Mem2ActBench tests memory-dependent tool selection and parameter
      grounding [Shen et al., 2026].


      PersonaTrail studies personalized web navigation [Yang et al., 2026], while
      PersonalAlign’s AndroidIntent evaluates intent resolution and proactive GUI
      assistance [Lyu et al., 2026].


      IBA-Bench connects implicit user modeling to task execution under enduring traits
      and transient states [Song et al., 2026].


      HABIT-Bench uses non-interactive action selection with a shared answer LLM to
      compare the context produced by different memory systems.


      Table 1 compares these evaluation targets.'
    location: https://arxiv.org/html/2610.24520v2#S2
  - id: S6
    title: 3 HABIT-Bench
    text: 'Figure 1: HABIT-Bench framework. (A) contrasts explicit-memory retrieval
      with latent habit induction. (B) combines task-oriented prompt seeds with latent
      habit graphs to construct real-prompt-seeded synthetic lifelines. (C) evaluates
      memory systems through a shared answerer and diagnostic choice interface.


      HABIT-Bench uses four-choice tasks to evaluate whether agents can infer user
      habits and use them appropriately to select actions.


      Figure 1 outlines the benchmark, and Appendix F illustrates how distributed
      evidence determines the valid action in each domain.'
    location: https://arxiv.org/html/2610.24520v2#S3
  - id: S7
    title: 3.1 Task Formulation
    text: 'For user u , let H_{u}^{\leq t}=(s_{1},\ldots,s_{t}) denote the history
      through session t .


      A probe p contains a request x_{p} , four candidate actions A_{p} , a visibility
      cutoff t_{p} , and a target time \tau_{p} specifying the current or historical
      state to resolve.


      Each habit state z_{u,h}(\tau) describes a behavioral default, its applicability,
      exceptions, temporal validity, and user endorsement.


      The evaluator specifies


      \displaystyle Z_{u}(\tau)


      \displaystyle=\{z_{u,h}(\tau):h\in\mathcal{B}_{u}\},\qquad a_{p}^{\star}


      \displaystyle=\operatorname{Resolve}\!\left(x_{p},A_{p},Z_{u}(\tau_{p})\right),


      (1)


      where \mathcal{B}_{u} indexes the user’s habits. Resolve combines relevant habits
      and enforces the request’s constraints to identify one valid action. This specification
      leaves the evaluated method’s memory representation unrestricted.


      We define weak evidence as observations that provide incomplete support for
      a default or its validity conditions. A recurring choice can leave scope uncertain,
      and a later selection can require an earlier shortlist for interpretation.


      The task therefore combines behavioral inference and cross-session decision
      reconstruction. In the Finance example (Appendix Figure 7), two workflows must
      be reconstructed at a May 2023 target time even though their 2025 replacements
      are visible. Correct memory use requires preserving both the chosen actions
      and when they became effective.'
    location: https://arxiv.org/html/2610.24520v2#S3.SS1
  - id: S8
    title: 3.2 Data and Task Construction
    text: 'HABIT-Bench contains 114 synthetic users, 37,152 sessions, and 3,328 probes
      across four domains (Table 2).


      Source datasets provide task seeds and interaction patterns. HABIT-Bench constructs
      user continuity, habit states, and longitudinal evidence relationships. Histories
      interleave habit-relevant observations with ordinary same-domain tasks, while
      private annotations link probes to applicable states and supporting sessions.
      The four domains instantiate complementary evidence structures.


      Table 2: Dataset statistics and source datasets. Sources provide dialogue and
      task seeds, while HABIT-Bench constructs the longitudinal histories and probe
      labels.


      Domain


      Users


      Sessions


      Probes


      Source dataset


      Food


      30


      3900


      630


      CookDial [Jiang et al., 2023]


      Finance


      36


      19440


      1368


      MultiDoGO [Peskov et al., 2019]


      Software


      18


      9720


      680


      MultiDoGO [Peskov et al., 2019]


      Travel


      30


      4092


      650


      Taskmaster-2 [Byrne et al., 2019]


      Food.


      We use cooking dialogues and recipes from CookDial [Jiang et al., 2023] to create
      conversational evidence of preparation and serving habits.


      Earlier alternatives, later user selections, and repeated use establish behavioral
      defaults.


      Contrasting contexts and local exceptions determine their scope. We rewrite
      the sessions as natural conversations while preserving recipe facts and habit
      evidence. Direct-use, boundary, and exception probes distinguish applying a
      default from overgeneralizing it.


      Finance.


      We use banking dialogues from MultiDoGO [Peskov et al., 2019] to construct histories
      of financial tasks.


      Ordered shortlists and later user confirmations establish or replace standing
      choices. Two- and three-habit probes combine workflows at current or historical
      times, with local exceptions, unresolved cases, and unaccepted suggestions providing
      competing evidence.


      Software.


      The Software histories use technical-support dialogues from MultiDoGO [Peskov
      et al., 2019]. Each user has a consistent software environment. We use the same
      selection process as Finance, with more frequent changes to the chosen procedures.
      The histories also include similar errors in different environments and unfinished
      support cases. Questions combine two or three habits and may require continuing
      an earlier case.


      Travel.


      Taskmaster-2 [Byrne et al., 2019] flight and hotel dialogues supply behavioral
      candidates for synthetic user profiles. Chronological histories are authored
      before evidence annotation and blind recoverability checks. Questions involve
      one or two habits and test their application to new requests, including exceptions
      and changes over time.


      Choices and validation.


      Alternatives are designed to meet the request’s hard constraints while differing
      in habit use and validity.


      We check that the choices cover the request, the evidence supports the intended
      decision, and the context is consistent. Domain-specific structural checks,
      model-based checks, and human review also assess whether a choice can be identified
      without using the history.


      Appendix A details templates, evidence schedules, source transformations, and
      validation. The resulting lifelines are source-grounded synthetic histories,
      not longitudinal records of the source participants.'
    location: https://arxiv.org/html/2610.24520v2#S3.SS2
  - id: S9
    title: 3.3 Evaluation Protocol and Metrics
    text: 'Methods ingest sessions chronologically into user-isolated memory, M_{u}^{t}=\operatorname{Update}(M_{u}^{t-1},s_{t})
      . At probe p , they construct R_{p}=\operatorname{Retrieve}(M_{u}^{t_{p}},x_{p})
      under recorded method-specific budgets. A shared answerer within each comparison
      predicts \hat{a}_{p}=\operatorname{Answer}(x_{p},\mathcal{A}_{p},R_{p}) . Standard
      methods cannot access private gold choices, habit states, evidence annotations,
      future sessions, or other users’ memories.


      Appendix C documents their adapters.


      For the evaluated probe set P_{d} in domain d , the primary scores are


      \operatorname{Acc}_{d}=\frac{1}{|P_{d}|}\sum_{p\in P_{d}}\mathbf{\mathbb{I}}[\hat{a}_{p}=a_{p}^{\star}],\qquad\operatorname{Macro}=\frac{1}{4}\sum_{d=1}^{4}\operatorname{Acc}_{d}.


      (2)


      Exact-match scoring of the four-choice predictions avoids variability introduced
      by LLM judges and does not require a separate, stronger judge model.


      Uniform random choice yields 25%. Appendix E reports supplementary user-macro
      scores and available 95% user-cluster bootstrap intervals.


      Evidence-access and answer-evidence diagnostics require source-session attribution
      and eligible annotations. Missing attribution is not counted as retrieval failure.


      Appendices D and E.5 report capability slices and evidence metrics, respectively.
      Section 4.5 reports build/query time and LLM token usage. Boundary and nonbinding-evidence
      diagnostics do not constitute probability calibration or a global false-personalization
      rate.'
    location: https://arxiv.org/html/2610.24520v2#S3.SS3
  - id: S10
    title: 3.4 Human Validation
    text: 'Human validation tests whether the intended decision is recoverable from
      the annotated evidence, independently of a memory system’s ability to find that
      evidence in a long history.


      Two human reviewers, A and B, independently inspect the request, four alternatives,
      and a chronological evidence packet without seeing the gold answer or system
      predictions.


      They select the uniquely supported action and assess eight criteria covering
      answerability, evidence sufficiency, scope, boundaries and exceptions, choice
      balance, naturalness, source grounding, and privacy.


      An item without a uniquely defensible answer receives no choice rather than
      a forced guess.


      A third human reviewer, C, adjudicates disagreements in either the answer or
      quality judgments before the merged record is frozen and compared with the gold
      labels.


      Appendix B details the protocol, sampling, and domain-specific results.


      Independent review covers 200 Food, 340 Finance, 311 Software, and 618 Travel
      probes.


      A/B answer agreement over jointly valid choices is 99.50%, 100.00%, 99.68%,
      and 92.84%, respectively, with domain-specific denominators and Cohen’s \kappa
      reported in Appendix Table 6.


      The quality rubric is stricter than agreement with gold: four Finance items
      initially receive Modify because their alternatives omit an additional output-placement
      requirement, although the evidence supports the intended habit.


      These local issues were corrected before final evaluation, while the audit retains
      the original modification flags.


      The remaining 336 Finance items and all 311 Software items pass adjudication.


      All 79 content-revised Travel items pass targeted gold-blind validation, and
      all 200 reviewed Food items pass naturalness checks after naturalization.


      High independent agreement and the rubric’s ability to detect narrow construction
      defects support the quality of the reviewed evidence and decision labels.


      These checks assess decision recoverability given the evidence, not human retrieval
      from full histories.'
    location: https://arxiv.org/html/2610.24520v2#S3.SS4
  - id: S11
    title: 4.1 Experimental Setup
    text: 'Systems and models.


      We organize the comparison by the role of memory in each system: controls, retrieval
      baselines, memory methods, and multi-store memory methods.


      The No Memory and Full Memory controls omit the interaction history or provide
      a compressed history, respectively.


      The retrieval baselines select sessions directly from the history and comprise
      Recency-5, Recency-10, BM25 RAG, Dense RAG, and Temporal Hybrid RAG.


      The memory methods construct and maintain their own memory representations:
      A-MEM [Xu et al., 2026], Mem0 [Chhikara et al., 2025], MemOS [Li et al., 2025],
      MemRL [Zhang et al., 2026], LightMem [Fang et al., 2026], and SeCom [Pan et
      al., 2025].


      Letta [Packer et al., 2023] and MIRIX [Wang and Chen, 2025] are shown separately
      as multi-store memory methods, reflecting their coordination of distinct memory
      stores.


      The other six are grouped for presentation rather than treated as a single architecture.


      References to the eight memory methods include both groups.


      Qwen3-235B-A22B [Yang et al., 2025] and GLM-5.3-Flash [Zeng et al., 2026] are
      the two primary language models.


      Within each setting, all methods use the same model to select an answer and
      to perform memory operations that require an LLM.


      Dense retrieval components use a fixed BGE-M3 encoder [Chen et al., 2025].


      Together with additional controls, oracle diagnostics, and experiments with
      smaller Qwen3 models, the evaluation covers 308 configurations across methods,
      models, and domains.


      Inference protocol.


      Methods maintain a separate memory for each user and process sessions in chronological
      order, using only the history available at each probe’s visibility cutoff.


      We set the decoding temperature to zero.


      The two primary model settings use the same prompt for selecting an action and
      require outputs to follow a fixed JSON schema.


      In the GLM experiments, the Qwen3-8B tokenizer is used only to measure token
      budgets, not to generate memories or answers.


      Context construction and token budgets vary by method.


      We report accuracy over all probes within each domain and macro accuracy as
      the unweighted mean of the four domain accuracies.


      Appendix E reports supplementary accuracy averaged across users and, where available,
      bootstrap confidence intervals obtained by resampling users.


      It also provides the model configurations, decision prompts, token budgets,
      and rules for truncation, retries, and answer parsing.


      Baselines and oracle controls.


      Retrieval baselines use the request alone, without the answer alternatives,
      to select complete sessions from the visible history.


      No Memory omits the interaction history, while Full Memory supplies a compacted
      history that fits within its context budget.


      Oracle Evidence supplies the private annotated evidence, whereas Oracle Habit
      State supplies the private habit state and required action.


      Both oracle conditions use information unavailable to the evaluated methods
      and serve only as diagnostic controls.'
