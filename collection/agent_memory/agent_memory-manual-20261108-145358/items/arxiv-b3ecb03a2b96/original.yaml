  - id: S49
    title: 'E.5 Qwen3-32B: Evidence Retrieval and Grounded Answers'
    text: 'Table 13 reports detailed metrics with Qwen3-32B for methods that expose
      source-session attribution.


      LightMem and MIRIX are excluded from this evidence-specific comparison because
      their memory outputs do not provide stable source-session lineage, not because
      their retrieved text is necessarily irrelevant.


      Their answer accuracies remain in the model-size comparison.


      Full Memory is a separate context-coverage control, rather than a top-five retrieval
      method.


      Table 13: Detailed Qwen3-32B results. Acc. is four-domain macro accuracy. Evidence
      metrics use the eligible probes for each statistic. All scores are percentages
      except memory tokens. ER: evidence recall; CG: Clean Grounded; Joint A+E: correct
      answer with an evidence hit. †Full Memory uses context-wide evidence coverage,
      not top-five retrieval. Dashes indicate inapplicable metrics.


