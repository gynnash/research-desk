  - id: S37
    title: Appendix C Implementation Provenance
    text: 'A-MEM, Letta, LightMem, Mem0, MemOS, MemRL, and MIRIX are evaluated through
      MedMemoryBench adapters [Wang et al., 2026].


      These are official-code benchmark adapters: they retain the pinned source’s
      memory lifecycle but expose retrieval-only context to the common HABIT answerer,
      so they are not upstream-native end-to-end runs.


      SeCom is an official-source adapted baseline configured for chronological ingestion.


      The session-retrieval methods are HABIT-native retrieval baselines; No Memory,
      Full Memory, and Full History are evaluator controls; and Oracle Evidence and
      Oracle Habit State are private diagnostic oracles rather than deployable systems.


