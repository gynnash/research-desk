schema_version: 1
mode: research_cycle_test
backend: chatgpt_plan
topic: agent-memory
topics_file: config/research_topics.yaml
archive: true
presentation: technical_article
reading:
  mode: full_text_required
  paper_max_chars: 200000
  blog_max_chars: 200000
window:
  mode: rolling
  days: 60
selection:
  mode: community_attention
  min_score: 0.1
  max_requests: 240
discovery:
  max_candidates: 80
  max_documents: 5
  max_per_source: 5
  evidence_max_chars: 6000
  sources:
    - id: arxiv
      adapter: arxiv
      entry_url: https://export.arxiv.org/api/query
    - id: letta
      adapter: letta
      entry_url: https://www.letta.com/blog/
      sitemap_url: https://www.letta.com/sitemap.xml
      sitemap_max_pages: 5
    - id: langchain
      adapter: langchain
      entry_url: https://www.langchain.com/blog
      sitemap_url: https://www.langchain.com/sitemap.xml
      sitemap_max_pages: 5
    - id: huggingface-blog
      adapter: rss
      publisher: Hugging Face Blog
      entry_url: https://huggingface.co/blog/feed.xml
      allowed_hosts: [huggingface.co]
    - id: meituan-tech
      adapter: rss
      publisher: 美团技术团队
      entry_url: https://tech.meituan.com/feed/
      allowed_hosts: [tech.meituan.com]
    - id: ruanyifeng-blog
      adapter: rss
      publisher: 阮一峰的网络日志
      entry_url: https://www.ruanyifeng.com/blog/atom.xml
      allowed_hosts: [www.ruanyifeng.com]
models:
  research: gpt-6-luna
  insight: gpt-6-luna
  review: gpt-6.1-sol
budget:
  max_calls_per_cycle: 16
  research_max_calls: 12
  insight_max_calls: 4
  max_input_chars: 600000
  max_output_chars: 24000
  timeout_seconds: 120
  max_revisions: 1
history:
  lookback_days: 180
  max_documents: 30
