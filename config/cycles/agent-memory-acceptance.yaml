# Small real acceptance run after full-text and presentation validation fixes.
schema_version: 1
mode: research_cycle_test
backend: chatgpt_plan
topic: agent-memory
topics_file: config/research_topics.yaml
archive: true
presentation: technical_article
reading:
  mode: full_text_required
  paper_max_chars: 200000
  blog_max_chars: 200000
window:
  mode: rolling
  days: 60
selection:
  mode: community_attention
  min_score: 0.1
  max_requests: 160
discovery:
  max_candidates: 80
  max_documents: 2
  max_per_source: 2
  evidence_max_chars: 6000
  sources:
  - id: arxiv
    adapter: arxiv
    entry_url: https://export.arxiv.org/api/query
models:
  research: gpt-6.1-sol
  insight: gpt-6.1-sol
  review: gpt-6-astra
budget:
  max_calls_per_cycle: 12
  research_max_calls: 8
  insight_max_calls: 4
  max_input_chars: 600000
  max_output_chars: 24000
  timeout_seconds: 240
  max_revisions: 1
history:
  lookback_days: 180
  max_documents: 30
