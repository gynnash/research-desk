schema_version: 1
mode: research_batch_test
backend: chatgpt_plan
topic: agent-memory
topics_file: config/research_topics.yaml
models:
  research: gpt-6-luna
  review: gpt-6.1-sol
budget:
  max_documents: 2
  max_calls_per_item: 4
  max_calls_per_batch: 6
  month_max_calls: 10
  max_input_chars: 20000
  max_output_chars: 10000
  timeout_seconds: 120
  max_revisions: 1
prompts:
  version: research-batch-v1
sources:
  - id: amem-paper
    adapter: arxiv
    kind: paper
    url: 'https://export.arxiv.org/api/query?id_list=2502.12110v1'
    evidence_max_chars: 6000
  - id: letta-memory-blog
    adapter: letta
    kind: blog
    url: https://www.letta.com/blog/why-memory-isnt-a-plugin/
    evidence_max_chars: 6000
