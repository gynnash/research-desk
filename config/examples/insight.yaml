# Requires actual reviewed Research inputs; history may be empty for an initial batch.
schema_version: 1
mode: insight_test
backend: chatgpt_plan
topic: example-topic
topics_file: config/examples/research_topics.yaml
models:
  generation: generation-model-from-your-account
  review: different-review-model-from-your-account
budget:
  max_calls: 4
  month_max_calls: 10
  max_input_chars: 600000
  max_output_chars: 24000
  timeout_seconds: 240
  max_revisions: 1
prompts:
  version: insight-v6
research_inputs:
- receipt: reports/test/example-topic/research-batches/your-batch/receipt-attempt-1.yaml
  config: config/your-research-batch.yaml
historical_inputs: []
