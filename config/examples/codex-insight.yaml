# Explicit opt-in Insight entry; default cycles and schedules are unchanged.
# Real execution uses a loopback gateway for SIWC and per-request budgets;
# native tool isolation is probed before inference. Schedules stay unchanged.
schema_version: 1
mode: codex_insight_test
backend: codex
topic: agent_memory
topics_file: config/research_topics.yaml
models:
  generation: gpt-6.1-sol
  review: gpt-6-astra
codex:
  driver: python_sdk
  sdk_version: '0.163.0'
  runtime: bundled
  auth_source: researchdesk_siwc
  max_requests_per_task: 100  # Actual upstream requests, including retries/failures.
  timeout_seconds: 240
review_policy: accuracy_only
prompts:
  version: codex-insight-v2
history:
  lookback_days: 180
generation:
  target_words: [700, 1200]  # Report and insights combined. Shorter is fine.
  min_insights: 1           # A goal; insufficient evidence may yield no_insight.
limits:
  max_agent_turns: 4        # Explicit turns, NOT a replacement for model calls.
  max_revisions: 1
runtime:
  workbench_id: researchdesk
  state_directory: '~/Library/Application Support/ResearchDesk/runs'
