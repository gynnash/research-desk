# Copy and edit for a NEW batch; do not overwrite a frozen historical config.
schema_version: 1
mode: research_batch_test
backend: chatgpt_plan
topic: my-research
topics_file: config/examples/research_topics.yaml
models:
  research: research-model-from-your-account
  review: different-review-model-from-your-account
budget:
  max_documents: 1
  max_calls_per_item: 4
  max_calls_per_batch: 4
  month_max_calls: 100
  max_input_chars: 500000
  max_output_chars: 10000
  timeout_seconds: 120
  max_revisions: 1
prompts:
  version: research-batch-v2
sources:
  - id: example-deep-reading
    adapter: arxiv
    kind: paper
    url: https://arxiv.org/abs/2502.12110v1
    reading:
      mode: full_text_preferred
    evidence_max_chars: 120000
