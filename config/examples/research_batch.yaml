# Copy into your workspace config directory, then edit topic, sources and account models.
# Model placeholders deliberately cannot pass the actual account catalog check.
schema_version: 1
mode: research_batch_test
backend: chatgpt_plan
topic: my-research
topics_file: config/examples/research_topics.yaml
models:
  research: research-model-from-your-account
  review: different-review-model-from-your-account
budget:
  max_documents: 2
  max_calls_per_item: 4
  max_calls_per_batch: 6
  month_max_calls: 10
  max_input_chars: 20000
  max_output_chars: 10000
  timeout_seconds: 120
  max_revisions: 1
prompts:
  version: research-batch-v1
sources:
  - id: example-paper
    adapter: arxiv
    kind: paper
    url: 'https://export.arxiv.org/api/query?id_list=2502.12110v1'
    evidence_max_chars: 6000
  - id: example-blog
    adapter: letta
    kind: blog
    url: https://www.letta.com/blog/why-memory-isnt-a-plugin/
    evidence_max_chars: 6000
