# Copy with: python3 scripts/workbench.py init
# Edit config/local/workbench.yaml, then apply. Personal settings stay out of Git.
# Omitted fields inherit config/system.yaml; model names are examples only.
schema_version: 1
workbench_id: my-researchdesk

# Select an existing research_topics.topics ID; this links all three stages.
topic: agent_memory
models:
  generation: gpt-6.1-sol
  review: gpt-6-astra
  writing: gpt-6-luna

research:
  window:
    days: 60
  discovery:
    max_documents: 5
    # Sources merge by ID with the built-ins. [] keeps them all.
    sources: []
    # sources:
    #   - id: letta
    #     enabled: false
    #   - id: my-blog
    #     adapter: rss
    #     publisher: My technical blog
    #     entry_url: https://example.org/feed.xml
    #     allowed_hosts: [example.org]

membership_budget:
  month_max_calls: 100

# Set true before start() to enable Tuesday/Friday 03:00 Asia/Shanghai research.
# Later edits are reloaded automatically at the beginning of the next run.
automation:
  enabled: false

# Add reviewed real Insight reports/topics to the formal reading directories.
# Simulated results always stay in test; Writing still requires page confirmation.
admission:
  enabled: false

# Advanced overrides use the same paths as config/system.yaml.
# Example: confirmation.writing.models.review overrides models.review for Writing.
# runtime:
#   membership:
#     profile: ~/path/to/your/own/ResearchDesk-profile
