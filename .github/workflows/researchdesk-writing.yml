name: ResearchDesk confirmed Writing
run-name: Writing · ${{ inputs.approval_id }}

on:
  workflow_dispatch:
    inputs:
      approval_id:
        description: Existing synchronized human confirmation ID from the local page
        required: true
        type: string
      max_new_calls:
        description: 6 for a bounded attempt, 0 to verify and reuse completed checkpoints
        type: choice
        default: '6'
        options: ['0', '6']

permissions:
  contents: read

concurrency:
  group: researchdesk-membership-worker
  cancel-in-progress: false

jobs:
  write:
    if: github.ref == 'refs/heads/main' && vars.RESEARCHDESK_DEPLOYED == 'true'
    runs-on: [self-hosted, researchdesk]
    timeout-minutes: 25
    defaults:
      run:
        shell: 'bash --noprofile --norc -eo pipefail "{0}"'
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: researchdesk-code
          persist-credentials: false
      - name: Execute only the existing human-confirmed Writing batch
        id: writing
        env:
          APPROVAL_ID: ${{ inputs.approval_id }}
          MAX_NEW_CALLS: ${{ inputs.max_new_calls }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${RESEARCHDESK_RUNTIME_PYTHON:-}" ] || [ -z "${RESEARCHDESK_WORKBENCH_ROOT:-}" ]; then
            echo 'Run python scripts/researchdesk_workbench.py start on this machine first.'
            exit 1
          fi
          "$RESEARCHDESK_RUNTIME_PYTHON" researchdesk-code/scripts/researchdesk_writing_job.py dispatch \
            --source "$GITHUB_WORKSPACE/researchdesk-code" \
            --base-commit "$(git -C researchdesk-code rev-parse HEAD)" \
            --approval-id "$APPROVAL_ID" --max-new-calls "$MAX_NEW_CALLS" \
            --artifact "$RUNNER_TEMP/researchdesk-writing-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        id: artifact
        if: always() && steps.writing.outputs.artifact_path != ''
        with:
          name: researchdesk-writing-checkpoints
          path: ${{ steps.writing.outputs.artifact_path }}/
          if-no-files-found: error
          retention-days: 14

  save:
    needs: write
    if: always() && github.ref == 'refs/heads/main' && needs.write.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r workflows/requirements-membership.txt
      - uses: actions/download-artifact@v8
        with:
          name: researchdesk-writing-checkpoints
          path: ${{ runner.temp }}/researchdesk-writing-checkpoints
      - name: Recheck human confirmation and reviews, then save only new results
        run: python scripts/researchdesk_writing_job.py apply --artifact "$RUNNER_TEMP/researchdesk-writing-checkpoints"

  refresh-obsidian:
    needs: save
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.RESEARCHDESK_DEPLOYED == 'true' && needs.save.result == 'success' }}
    uses: ./.github/workflows/researchdesk-obsidian.yml
    permissions:
      contents: read
