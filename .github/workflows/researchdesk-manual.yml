name: ResearchDesk research cycle

on:
  schedule:
    # ResearchDesk managed weekly schedule
    - cron: '0 9 * * 1'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      operation:
        description: Check the deployment, collect originals, run Research/Insight, or catch up
        required: true
        default: health
        type: choice
        options: [health, collect, run, catchup]
      cycle_id:
        description: Reuse an existing ID to resume; empty selects the scheduled or manual batch
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: researchdesk-membership-worker
  cancel-in-progress: false

jobs:
  research:
    # Only start() sets this nonsecret opt-in flag; a new fork stays idle.
    if: github.ref == 'refs/heads/main' && vars.RESEARCHDESK_DEPLOYED == 'true'
    runs-on: [self-hosted, researchdesk]
    timeout-minutes: 360
    defaults:
      run:
        shell: 'bash --noprofile --norc -eo pipefail "{0}"'
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out trusted main code separately from the persistent workbench
        uses: actions/checkout@v7
        with:
          ref: main
          path: researchdesk-code
          persist-credentials: false
      - name: Reload configuration and run the registered workbench
        id: cycle
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ inputs.operation || 'run' }}
          REQUESTED_CYCLE_ID: ${{ inputs.cycle_id }}
          RESEARCHDESK_TRIGGER_CRON: ${{ github.event.schedule || '' }}
        run: |
          if [ -z "${RESEARCHDESK_RUNTIME_PYTHON:-}" ] || [ -z "${RESEARCHDESK_WORKBENCH_ROOT:-}" ]; then
            echo 'Run python scripts/workbench.py start on this machine first.'
            exit 1
          fi
          "$RESEARCHDESK_RUNTIME_PYTHON" researchdesk-code/scripts/deployment.py dispatch \
            --source "$GITHUB_WORKSPACE/researchdesk-code" --base-commit "$(git -C researchdesk-code rev-parse HEAD)" \
            --event "$TRIGGER_EVENT" --operation "$REQUESTED_OPERATION" \
            --cycle-id "$REQUESTED_CYCLE_ID" \
            --artifact "$RUNNER_TEMP/researchdesk-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
      - name: Preserve verifiable results and partial checkpoints
        id: artifact
        if: always() && steps.cycle.outputs.artifact_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: researchdesk-checkpoints
          path: ${{ steps.cycle.outputs.artifact_path }}/
          if-no-files-found: error
          retention-days: 14

  save-checkpoints:
    needs: research
    if: always() && github.ref == 'refs/heads/main' && needs.research.outputs.artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install offline verification dependencies
        run: python -m pip install -r workflows/requirements-membership.txt
      - uses: actions/download-artifact@v8
        with:
          name: researchdesk-checkpoints
          path: ${{ runner.temp }}/researchdesk-checkpoints
      - name: Verify frozen evidence and add results without overwriting notes
        run: python scripts/publish.py apply --artifact "$RUNNER_TEMP/researchdesk-checkpoints" --push

  refresh-obsidian:
    needs: save-checkpoints
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && vars.RESEARCHDESK_DEPLOYED == 'true' && needs.save-checkpoints.result == 'success' }}
    uses: ./.github/workflows/researchdesk-obsidian.yml
    permissions:
      contents: read
