name: ResearchDesk Obsidian reading vault

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - README.md
      - 研究首页.md
      - 'collection/**/*.md'
      - 'summary/**/*.md'
      - 'insights/**/*.md'
      - 'articles/**/*.md'
      - 'sources/papers/**/*.md'
      - 'sources/blogs/**/*.md'
      - 'sources/originals/**/*.md'
      - 'reports/*/*.md'
      - 'reports/*/解读/**/*.md'
      - 'reports/*/reading/**/*.md'

permissions:
  contents: read

jobs:
  refresh:
    if: github.ref == 'refs/heads/main' && vars.RESEARCHDESK_DEPLOYED == 'true'
    runs-on: [self-hosted, macOS, researchdesk]
    timeout-minutes: 5
    continue-on-error: true
    defaults:
      run:
        shell: 'bash --noprofile --norc -eo pipefail "{0}"'
    concurrency:
      group: researchdesk-obsidian-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: researchdesk-code
          persist-credentials: false
      - name: Refresh the local Obsidian reading vault if configured
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          if [ ! -x "${RESEARCHDESK_RUNTIME_PYTHON:-}" ] || [ -z "${RESEARCHDESK_WORKBENCH_ROOT:-}" ]; then
            echo '::warning::The runner is not bound to a local ResearchDesk workbench.'
            exit 1
          fi
          "$RESEARCHDESK_RUNTIME_PYTHON" researchdesk-code/scripts/setup_obsidian.py \
            --refresh-existing --root "$RESEARCHDESK_WORKBENCH_ROOT" --expected-repo "$EXPECTED_REPO"
