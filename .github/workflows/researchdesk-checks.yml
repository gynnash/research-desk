name: ResearchDesk checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: researchdesk-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline schema and research cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install -r workflows/requirements-membership.txt
      - name: Validate knowledge base and test isolation
        run: python workflows/validate.py --include-test
      - name: Check explicitly retired historical notes
        run: PYTHONPATH=tests python -m unittest test_retired_notes -v
      - name: Check Beijing research slots and catchup without model calls
        run: python -m unittest discover -s tests -p 'test_schedule.py' -v
      - name: Check research cycle with fixed inputs
        run: python -m unittest discover -s tests -p 'test_cycle.py' -v
      - name: Check Insight citation scopes and independent review without model calls
        run: python -m unittest discover -s tests -p 'test_insight*.py' -v
      - name: Check bounded linked recovery and checkpoint transfer without model calls
        run: python -m unittest discover -s tests -p 'test_recovery*.py' -v
      - name: Check URL history deduplication without model calls
        run: python -m unittest discover -s tests -p 'test_url_history_dedup.py' -v
      - name: Check full-text acquisition, reading scope and immutable updates without model calls
        run: python -m unittest discover -s tests -p 'test_fulltext*.py' -v
      - name: Check rolling discovery, attention, historical comparison and readable research
        run: PYTHONPATH=tests python -m unittest test_rolling_selection test_attention test_history_window test_article_presentation test_source_card -v
      - name: Check publisher feeds, archive coverage and offline original replay
        run: PYTHONPATH=tests python -m unittest test_feeds test_blog_archive_discovery test_archive test_archive_admission test_archive_transfer -v
      - name: Check create-only admission without model calls
        run: python -m unittest discover -s tests -p 'test_admission*.py' -v
      - name: Check real topic confirmation and local Git recovery
        run: python -m unittest discover -s tests -p 'test_confirmation.py' -v
      - name: Check confirmed Writing with fake transport and no member usage
        run: python -m unittest discover -s tests -p 'test_writing_member*.py' -v
      - name: Check readable Writing style and historical proof compatibility
        run: PYTHONPATH=tests python -m unittest test_writing_style test_writing_v2_proofs test_writing_original_excerpts -v
      - name: Check process-scoped Git refresh without network or credentials
        run: python -m unittest discover -s tests -p 'test_writing_refresh.py' -v
      - name: Check create-only Writing admission and formal document display
        run: python -m unittest discover -s tests -p 'test_writing_admission.py' -v
